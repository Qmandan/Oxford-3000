name: Android APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Bağımlılıkları kur
        run: npm install

      - name: Web dosyalarını kopyala
        run: npm run build:www

      - name: Android projesini oluştur
        run: npx cap add android

      - name: Uygulama ikonlarını üret
        run: npx capacitor-assets generate --android --assetPath assets
        continue-on-error: true

      - name: Android projesini eşitle
        run: npx cap sync android

      - name: Debug APK derle
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: APK dosyasını artifact olarak yükle
        uses: actions/upload-artifact@v4
        with:
          name: cumle-atolyesi-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk

      - name: APK'yı Releases bölümüne ekle (doğrudan indirilebilir)
        uses: softprops/action-gh-release@v2
        continue-on-error: true
        with:
          tag_name: apk-${{ github.run_number }}
          name: Cümle Atölyesi APK ${{ github.run_number }}
          body: Telefona indirip kurabileceğin debug APK. Android "bilinmeyen kaynaklardan yükleme" izni isteyebilir.
          files: android/app/build/outputs/apk/debug/app-debug.apk
