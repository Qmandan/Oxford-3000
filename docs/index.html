les:"1. They had to abandon the sinking ship. (Batmakta olan gemiyi terk etmek zorunda kaldılar.) 2. The team decided to abandon the project due to lack of funding. (Ekip, finansman eksikliği nedeniyle projeden vazgeçmeye karar verdi.) 3. She danced with abandon, not caring who was watching. (Kimsenin izlemesini umursamadan, kendini kaptırarak dans etti.)"},{word:"abandoned",type:"Sıfat",meaning:"1. Terk edilmiş, bırakılmış. 2. Düşüncesizce coşkulu, kendini kaptırmış.",guide:"Bir yerin veya eşyanın sahipsiz ve kullanılmaz halde olduğunu anlatır. Coşku hali için sıfat olarak da kullanılabilir.",examples:"1. We explored an abandoned factory. (Terk edilmiş bir fabrikayı keşfettik.) 2. The dog looked sad and abandoned. (Köpek üzgün ve terk edilmiş görünüyordu.) 3. The children laughed with abandoned glee. (Çocuklar düşüncesizce bir sevinçle güldüler.)"},{word:"ability",type:"İsim",meaning:"1. Yetenek, beceri. 2. Yapabilme kapasitesi, güç. 3. Yetenekler, kabiliyetler (çoğul).",guide:"Bir şeyi yapabilme fiziksel veya zihinsel gücünü, kapasitesini ifade eder.",examples:"1. She has a remarkable ability to learn languages. (Onun dilleri öğrenme konusunda dikkate değer bir yeteneği var.) 2. I doubt my ability to finish this on time. (Bunu zamanında bitirebilme gücümden şüpheliyim.) 3. The job requires good technical abilities. (İş, iyi teknik beceriler gerektiriyor.)"},{word:"able",type:"Sıfat",meaning:"1. Yapabilen, muktedir. 2. Yetenekli, becerikli. 3. (be able to) -ebilmek (yeterlilik).",guide:'Genellikle "be able to" yapısıyla, bir şeyi yapma gücüne veya fırsatına sahip olmak anlamında kullanılır. Tek başına "yetkin" anlamı da vardır.',examples:"1. Will you be able to come to the meeting? (Toplantıya gelebilecek misin?) 2. He is a very able surgeon. (O çok yetenekli bir cerrah.) 3. After the repair, the car was able to start again. (Tamirdan sonra araba tekrar çalışabildi.)"},{word:"about",type:"Edat/Zarf",meaning:"1. Hakkında, ile ilgili (edat). 2. Yaklaşık olarak, aşağı yukarı (zarf). 3. Etrafta, civarda (edat/zarf).",guide:'Bir konu hakkında konuşurken veya tahmini bir miktar/zaman belirtirken en sık kullanılır. "Etrafta olmak" anlamında da yaygındır.',examples:"1. What are you talking about? (Neyden bahsediyorsun?) 2. It costs about 50 dollars. (Yaklaşık 50 dolar tutuyor.) 3. Is there a bank about here? (Buralarda bir banka var mı?)"},{word:"above",type:"Edat/Zarf/Sıfat",meaning:"1. Üstünde, yukarısında (edat). 2. Daha fazla, üzerinde (miktar/yaş). 3. Yukarıda, önceden belirtilen (sıfat/zarf).",guide:"Temel fiziksel konum (üstünde) veya bir değerin (sayı, standart) üzerinde olma anlamında kullanılır.",examples:"1. The picture is hanging above the fireplace. (Resim şöminenin üstünde asılı.) 2. The temperature was above 30 degrees. (Sıcaklık 30 derecenin üzerindeydi.) 3. Please refer to the above diagram. (Lütfen yukarıdaki şemaya bakınız.)"},{word:"abroad",type:"Zarf",meaning:"1. Yurtdışında, yabancı ülkede. 2. Dışarıda, dışarıya (eski/edebi kullanım). 3. Yaygın olarak, ortalıkta (haber/düşünce).",guide:'Günlük dilde neredeyse her zaman "yurtdışında" anlamında kullanılır. Bir ülkenin sınırlarının dışında olmayı ifade eder.',examples:"1. She loves travelling abroad. (Yurtdışına seyahat etmeyi seviyor.) 2. The news spread abroad quickly. (Haber çabucak yayıldı.) 3. He lived abroad for many years. (Yıllarca yurtdışında yaşadı.)"},{word:"absolute",type:"Sıfat",meaning:"1. Mutlak, kesin. 2. Tam, saf. 3. Sınırsız, despot (iktidar).",guide:"Bir şeyin tam, koşulsuz ve şüphe götürmez olduğunu vurgular. Dereceyi pekiştirmek için kullanılır.",examples:"1. I have absolute confidence in you. (Sana mutlak güvenim var.) 2. His story was absolute nonsense. (Onun hikayesi tamamen saçmalıktı.) 3. The king had absolute power. (Kral mutlak iktidara sahipti.)"},{word:"absolutely",type:"Zarf",meaning:"1. Kesinlikle, tamamen. 2. Evet, kesinlikle (kabul/onay). 3. Kesinlikle hayır (vurgulu ret).",guide:'Bir fikre tam ve koşulsuz katılımı veya bir şeyin tamlık derecesini ifade eder. "Very" (çok) kelimesinden daha güçlüdür.',examples:'1. I absolutely agree with you. (Size kesinlikle katılıyorum.) 2. "Are you sure?" – "Absolutely!" ("Emin misin?" – "Kesinlikle!") 3. The food was absolutely delicious. (Yemek kesinlikle lezzetliydi.)'},{word:"academic",type:"Sıfat/İsim",meaning:"1. Akademik, eğitimsel (sıfat). 2. Teorik, pratik olmayan (sıfat). 3. Akademisyen, üniversite hocası (isim).",guide:"Okul, üniversite veya öğrenimle ilgili olanı tanımlar. Pratik değeri olmayan teorik konular için de kullanılır.",examples:"1. She has a strong academic background. (Güçlü bir akademik geçmişi var.) 2. It's an interesting academic debate, but not very useful. (İlginç bir akademik tartışma, ama pek kullanışlı değil.) 3. Several leading academics attended the conference. (Birkaç önde gelen akademisyen konferansa katıldı.)"},{word:"accept",type:"Fiil",meaning:"1. Kabul etmek (teklif/hediye). 2. Kabul etmek, onaylamak (fikir/durum). 3. Katlanmak, sineye çekmek.",guide:"Bir şeyi almaya veya bir gerçeği/durumu doğru veya kaçınılmaz olarak kabul etmeye razı olmak.",examples:"1. I gladly accept your invitation. (Davetinizi memnuniyetle kabul ediyorum.) 2. He found it hard to accept the truth. (Gerçeği kabullenmekte zorlandı.) 3. You have to accept the consequences of your actions. (Eylemlerinin sonuçlarına katlanmak zorundasın.)"},{word:"acceptable",type:"Sıfat",meaning:"1. Kabul edilebilir, makul. 2. Yeterli, idare eder. 3. Hoş karşılanan, beğenilen.",guide:"Minimum standartları karşılayan, onaylanabilir veya tolere edilebilir olanı ifade eder. Mükemmel değil, yeterli olan.",examples:"1. This standard of work is not acceptable. (Bu çalışma standardı kabul edilemez.) 2. The food was acceptable, but not great. (Yemek kabul edilebilirdi, ama harika değildi.) 3. Smoking is less acceptable in public places now. (Sigara içmek artık kamusal alanlarda daha az hoş karşılanıyor.)"},{word:"access",type:"İsim/Fiil",meaning:"1. Erişim, giriş (isim). 2. (Bilgisayar) erişmek, açmak (fiil). 3. (Bir yere) ulaşım imkanı.",guide:"Bir yere girebilme, bir şeyi kullanabilme veya elde edebilme imkanı veya hakkı.",examples:"1. The building has wheelchair access. (Binada tekerlekli sandalye erişimi var.) 2. Can you access the file on the server? (Sunucudaki dosyaya erişebilir misin?) 3. The house has easy access to the motorway. (Evin otoyola kolay ulaşımı var.)"},{word:"accident",type:"İsim",meaning:"1. Kaza. 2. Tesadüf, kazara olma. 3. Kazara olan şey.",guide:"Genellikle istenmeyen, beklenmedik ve zarar veren bir olay. Kasıt olmadan gerçekleşen her şey için de kullanılır.",examples:"1. He had a car accident yesterday. (Dün bir araba kazası geçirdi.) 2. We met by accident at the airport. (Havaalanında tesadüfen karşılaştık.) 3. The discovery was a happy accident. (Keşif hoş bir tesadüftü.)"},{word:"accommodation",type:"İsim",meaning:"1. Konaklama yeri. 2. Uzlaşma, anlaşma. 3. Göz uyumu (tıp).",guide:"Konuşma dilinde çoğunlukla otel, pansiyon, yurt gibi kalınacak yer anlamındadır.",examples:"1. We need to find accommodation for the night. (Gece için konaklama yeri bulmamız lazım.) 2. Both sides made accommodations to reach a deal. (Anlaşmaya varmak için her iki taraf da taviz verdi.) 3. I've booked our accommodation in Paris. (Paris'teki konaklamamızı ayırttım.)"},{word:"accompany",type:"Fiil",meaning:"1. Eşlik etmek, beraber gitmek/gelmek. 2. (Müzik) eşlik etmek. 3. Eşlik etmek, birlikte bulunmak (olay/durum).",guide:"Birine veya bir şeye refakat etmek, beraberinde olmak.",examples:"1. Would you like me to accompany you to the doctor? (Seni doktora benim eşlik etmemi ister misin?) 2. She sang while he accompanied her on the piano. (O piyanoda eşlik ederken, o şarkı söyledi.) 3. Strong winds accompanied the thunderstorm. (Şiddetli rüzgarlar, gök gürültülü fırtınaya eşlik etti.)"},{word:"according to",type:"Edat",meaning:"1. -e göre, -e dayanarak. 2. Uygun olarak. 3. -in dediğine/söylediğine göre.",guide:"Bir bilgi kaynağını, bir kuralı veya bir standardı belirtmek için kullanılır.",examples:"1. According to the map, we're close. (Haritaya göre, yakınız.) 2. Everything went according to plan. (Her şey plana göre gitti.) 3. According to Sarah, the meeting is cancelled. (Sarah'a göre toplantı iptal edilmiş.)"},{word:"account",type:"İsim/Fiil",meaning:"1. Hesap (banka, hesap özeti). 2. Açıklama, anlatım, rapor (isim). 3. (account for) Açıklamak, hesap vermek (fiil).",guide:"Günlük dilde çoğunlukla banka hesabı veya bir olayın anlatımı anlamındadır.",examples:"1. I need to check my bank account. (Banka hesabımı kontrol etmem gerekiyor.) 2. He gave a detailed account of what happened. (Olanlarla ilgili detaylı bir anlatımda bulundu.) 3. How do you account for your actions? (Eylemlerini nasıl açıklarsın?)"},{word:"accurate",type:"Sıfat",meaning:"1. Doğru, hatasız, kesin. 2. Dikkatli, titiz (kişi). 3. Tam isabet eden (tahmin/nişan).",guide:"Bilgi, ölçüm veya tanımın gerçeğe tam uygun, hata içermeyen olduğunu belirtir.",examples:"1. Make sure the information is accurate. (Bilginin doğru olduğundan emin ol.) 2. She's very accurate in her work. (İşinde çok titizdir.) 3. The weather forecast was surprisingly accurate. (Hava tahmini şaşırtıcı derecede isabetliydi.)"},{word:"accuse",type:"Fiil",meaning:"1. Suçlamak, itham etmek. 2. (Of ile) -makla suçlamak.",guide:"Resmi veya resmi olmayan şekilde, birinin yanlış veya suç sayılan bir şey yaptığını söylemek.",examples:"1. He was accused of theft. (Hırsızlıkla suçlandı.) 2. Are you accusing me of lying? (Beni yalan söylemekle mi suçluyorsun?) 3. She accused him of being selfish. (Onu bencil olmakla suçladı.)"},{word:"achieve",type:"Fiil",meaning:"1. Başarmak, elde etmek. 2. (Hedefe) ulaşmak. 3. (Sonuç) almak.",guide:"Çaba, beceri veya azim sonucu bir hedefe ulaşmak veya bir şeyi elde etmek.",examples:"1. She achieved all her career goals. (Tüm kariyer hedeflerini başardı.) 2. We have achieved a great deal this year. (Bu yıl çok şey başardık.) 3. It's hard to achieve a work-life balance. (İş-yaşam dengesini sağlamak zordur.)"},{word:"achievement",type:"İsim",meaning:"1. Başarı. 2. Başarılan şey, eser. 3. Elde edilen sonuç.",guide:"Zorlu veya değerli bir şeyi başarma eylemi veya başarılan şeyin kendisi.",examples:"1. Winning the award was her greatest achievement. (Ödülü kazanmak onun en büyük başarısıydı.) 2. The bridge is a remarkable engineering achievement. (Köprü, dikkate değer bir mühendislik başarısıdır.) 3. A sense of achievement is important for motivation. (Başarı duygusu motivasyon için önemlidir.)"},{word:"acknowledge",type:"Fiil",meaning:"1. Kabul etmek, onaylamak (gerçek/hak). 2. (Mektup/alındı) bildirmek. 3. Selamla karşılık vermek, fark ettiğini belli etmek.",guide:"Bir şeyin doğruluğunu veya varlığını kabul etmek veya bir şeyi aldığını/ gördüğünü bildirmek.",examples:"1. He acknowledged his mistake. (Hatâsını kabul etti.) 2. Please acknowledge receipt of this email. (Lütfen bu e-postayı aldığınızı bildirin.) 3. She smiled to acknowledge his presence. (Onun varlığını fark ettiğini belli etmek için gülümsedi.)"},{word:"acquire",type:"Fiil",meaning:"1. Elde etmek, kazanmak (bilgi/beceri). 2. Satın almak, edinmek (mal/varlık). 3. (Şirket) devralmak.",guide:"Genellikle çaba, çalışma veya alım satım yoluyla bir şey sahibi olmak.",examples:"1. She acquired fluency in Spanish. (İspanyolcada akıcılık kazandı.) 2. The museum acquired a new painting. (Müze yeni bir tablo satın aldı.) 3. Our company was acquired by a larger one. (Şirketimiz daha büyük bir şirket tarafından devralındı.)"},{word:"across",type:"Edat/Zarf",meaning:"1. Karşısında, öbür tarafında (edat). 2. Boyunca, her yerinde (edat). 3. Karşıdan karşıya (zarf).",guide:"Bir şeyin bir tarafından diğer tarafına doğru hareketi veya konumu ifade eder.",examples:"1. He lives across the street. (Sokağın karşısında yaşıyor.) 2. There are shops across the city. (Şehrin her yerinde dükkanlar var.) 3. Can you swim across? (Karşıya yüzebilir misin?)"},{word:"act",type:"Fiil/İsim",meaning:"1. Hareket etmek, davranmak (fiil). 2. Rol yapmak, oynamak (fiil). 3. Davranış, hareket; kanun; perde (isim).",guide:"Bir şey yapmak veya bir şey yapıyormuş gibi davranmak. İsim olarak eylem veya tiyatro perdesi anlamına gelir.",examples:"1. We must act quickly. (Hızlı hareket etmeliyiz.) 2. He acted surprised, but he already knew. (Şaşırmış gibi davrandı, ama zaten biliyordu.) 3. It was an act of kindness. (Bu bir iyilik hareketiydi.)"},{word:"action",type:"İsim",meaning:"1. Eylem, hareket, faaliyet. 2. (Filmde) aksiyon, hareketlilik. 3. Dava açma, yasal işlem.",guide:"Bir şeyi yapma süreci veya yapılan şey. Harekete geçmeyi vurgular.",examples:"1. We need action, not words. (Söze değil, eyleme ihtiyacımız var.) 2. The movie is full of action. (Film aksiyon dolu.) 3. They are considering legal action. (Yasal işlem yapmayı düşünüyorlar.)"},{word:"active",type:"Sıfat",meaning:"1. Aktif, etkin, faal. 2. Hareketli, enerjik. 3. (Dilbilgisi) etken (edilgenin zıttı).",guide:"Fiziksel olarak hareketli olmayı veya bir şeye katılmayı, dahil olmayı ifade eder.",examples:"1. She leads an active social life. (Aktif bir sosyal hayatı var.) 2. Volcanoes can be active or dormant. (Yanardağlar aktif veya uyuyan olabilir.) 3. He's very active for his age. (Yaşına göre çok hareketli.)"},{word:"activity",type:"İsim",meaning:"1. Faaliyet, etkinlik. 2. Canlılık, hareketlilik. 3. (Çoğul) yapılan şeyler, uğraşılar.",guide:"Yapılan bir iş veya eğlence, veya bir yerdeki hareketlilik durumu.",examples:"1. Outdoor activities are good for health. (Açık hava etkinlikleri sağlık için iyidir.) 2. There was a lot of activity in the market. (Pazarda çok fazla hareketlilik vardı.) 3. What's your favourite leisure activity? (En sevdiğin boş zaman etkinliğin nedir?)"},{word:"actor",type:"İsim",meaning:"1. (Erkek) oyuncu. 2. Katılımcı, fail (bir olayda).",guide:"Tiyatro, film vs.'de rol alan kişi. Daha geniş anlamda, bir süreçte yer alan kişi veya kurum.",examples:"1. He is a famous film actor. (O ünlü bir film oyuncusu.) 2. Various actors are involved in the peace process. (Barış sürecine çeşitli taraflar dahildir.)"},{word:"actress",type:"İsim",meaning:"1. (Kadın) oyuncu.",guide:`Tiyatro, film vs.'de rol alan kadın. Modern kullanımda "actor" terimi her iki cinsiyet için de kullanılabilir.`,examples:"1. She is an award-winning actress. (O ödüllü bir oyuncu.)"},{word:"actual",type:"Sıfat",meaning:"1. Gerçek, asıl, mevcut. 2. Fiili, gerçekte var olan. 3. Şu andaki.",guide:"Hayali veya teorik olanın aksine, var olan, gerçek ve doğru olanı vurgular.",examples:"1. The actual cost was higher than estimated. (Gerçek maliyet tahmin edilenden yüksekti.) 2. What were his actual words? (Onun asıl sözleri neydi?) 3. In actual fact, I disagree. (Aslına bakarsanız, katılmıyorum.)"},{word:"actually",type:"Zarf",meaning:"1. Aslında, gerçekte. 2. Doğrusu, itiraf etmek gerekirse. 3. (Vurgu için) Cidden, hakikaten.",guide:"Bir şeyin beklenenden veya sanılandan farklı olan gerçek durumunu belirtmek veya bir açıklamayı vurgulamak için kullanılır.",examples:"1. I thought he was French, but actually he's Belgian. (Onun Fransız olduğunu sanıyordum, ama aslında Belçikalı.) 2. Actually, I'd prefer to stay home. (Doğrusu, evde kalmayı tercih ederim.) 3. It was actually quite easy. (Aslında oldukça kolaydı.)"},{word:"ad",type:"İsim",meaning:"1. Reklam (advertisement'ın kısaltması). 2. İlan.",guide:'Günlük konuşmada "advertisement" yerine yaygın olarak kullanılan kısaltma.',examples:"1. I saw your ad in the newspaper. (İlanınızı gazetede gördüm.) 2. They placed an ad for a job. (Bir iş için ilan verdiler.) 3. That's a clever TV ad. (Bu zekice bir TV reklamı.)"},{word:"adapt",type:"Fiil",meaning:"1. Uyarlamak, adapte etmek. 2. Uyum sağlamak, alışmak. 3. (Kendini) ayarlamak.",guide:"Yeni koşullara göre değiştirmek veya değişmek.",examples:"1. The book was adapted into a film. (Kitap bir film için uyarlandı.) 2. It takes time to adapt to a new culture. (Yeni bir kültüre uyum sağlamak zaman alır.) 3. Animals must adapt to survive. (Hayvanlar hayatta kalmak için uyum sağlamalı.)"},{word:"add",type:"Fiil",meaning:"1. Eklemek, katmak, ilave etmek. 2. (Matematik) toplamak. 3. (add up) Anlam ifade etmek, mantıklı olmak.",guide:"Bir şeye bir şey daha koymak veya söylemek.",examples:"1. Add some salt to the soup. (Çorbaya biraz tuz ekle.) 2. If you add 5 and 3, you get 8. (5 ile 3'ü toplarsan, 8 eder.) 3. His story just doesn't add up. (Onun hikayesi bir türlü tutarlı gelmiyor.)"},{word:"addition",type:"İsim",meaning:"1. Ek, ilave. 2. (Matematik) toplama. 3. (in addition to) -e ek olarak.",guide:"Eklenen şey veya ekleme işlemi.",examples:"1. The new wing is a recent addition to the museum. (Yeni kanat, müzeye yakın zamanda yapılan bir ektir.) 2. Children learn addition and subtraction. (Çocuklar toplama ve çıkarmayı öğrenir.) 3. In addition to English, she speaks French. (İngilizceye ek olarak, Fransızca da konuşuyor.)"},{word:"additional",type:"Sıfat",meaning:"1. Ek, ilave, fazladan. 2. Yardımcı, tamamlayıcı.",guide:"Zaten var olana eklenen, fazladan olan.",examples:"1. There is an additional charge for luggage. (Bagaj için fazladan bir ücret var.) 2. We need additional information. (Ek bilgiye ihtiyacımız var.) 3. Additional resources were provided. (Ek kaynaklar sağlandı.)"},{word:"address",type:"İsim/Fiil",meaning:"1. Adres (isim). 2. Hitap etmek, seslenmek (fiil). 3. (Sorunu) ele almak, çözmeye çalışmak (fiil).",guide:"Konuşma dilinde genellikle fiziksel veya e-posta adresi anlamında isim olarak kullanılır. Fiil olarak birine söz söylemek veya bir sorunla ilgilenmek anlamına gelir.",examples:"1. What's your home address? (Ev adresin nedir?) 2. He addressed the crowd calmly. (Kalabalığa sakin bir şekilde hitap etti.) 3. We need to address this issue immediately. (Bu sorunu derhal ele almamız gerekiyor.)"},{word:"administration",type:"İsim",meaning:"1. Yönetim, idare. 2. (Ülke) hükümet, yönetim. 3. (İlaç) uygulama, verme.",guide:"Bir organizasyonu veya sistemi yönetme eylemi veya bu işi yapan kişiler grubu.",examples:"1. The daily administration of the office is her job. (Ofisin günlük yönetimi onun işidir.) 2. The current administration has faced many challenges. (Mevcut yönetim birçok zorlukla karşılaştı.) 3. The administration of the vaccine was quick. (Aşının uygulanması hızlıydı.)"},{word:"admire",type:"Fiil",meaning:"1. Hayran olmak, beğenmek. 2. Takdir etmek. 3. (Şey) hayranlıkla bakmak.",guide:"Birinin veya bir şeyin niteliklerine, başarılarına veya güzelliğine saygı ve beğeni duymak.",examples:"1. I really admire your patience. (Sabrına gerçekten hayranım.) 2. She admired the view from the balcony. (Balkondan manzaraya hayranlıkla baktı.) 3. He is widely admired for his honesty. (Dürüstlüğü nedeniyle geniş çapta takdir görür.)"},{word:"admit",type:"Fiil",meaning:"1. Kabul etmek, itiraf etmek. 2. (İçeri) almak, girişine izin vermek. 3. (Hastane) yatırmak.",guide:"Bir gerçeği, genellikle hoş olmayan bir gerçeği söylemek veya birinin bir yere girmesine izin vermek.",examples:"1. I must admit I was wrong. (Yanıldığımı itiraf etmeliyim.) 2. This ticket admits two people. (Bu bilet iki kişiyi içeri alır.) 3. He was admitted to the hospital with chest pains. (Göğüs ağrılarıyla hastaneye yatırıldı.)"},{word:"adopt",type:"Fiil",meaning:"1. Evlat edinmek. 2. Benimsemek, uygulamak (yöntem/ilk). 3. (Tavır) takınmak.",guide:"Bir çocuğu yasal olarak kendi çocuğu yapmak veya yeni bir fikri, davranışı kabul etmek.",examples:"1. They decided to adopt a child. (Bir çocuk evlat edinmeye karar verdiler.) 2. The company adopted a new marketing strategy. (Şirket yeni bir pazarlama stratejisi benimsedi.) 3. He adopted a more positive attitude. (Daha olumlu bir tavır takındı.)"},{word:"adult",type:"İsim/Sıfat",meaning:"1. Yetişkin (isim). 2. Yetişkinlere uygun (sıfat). 3. Olgun, mantıklı (sıfat).",guide:"Yasal ve biyolojik olarak tam gelişmiş insan. Sıfat olarak ciddi veya müstehcen içerik için de kullanılır.",examples:"1. The film is suitable for adults. (Film yetişkinler için uygundur.) 2. It's time to start making adult decisions. (Yetişkin kararlar vermeye başlamanın zamanı geldi.) 3. She handled the situation in a very adult way. (Durumu çok olgun bir şekilde ele aldı.)"},{word:"advance",type:"İsim/Fiil/Sıfat",meaning:"1. İlerleme, gelişme (isim). 2. Avans, peşin ödeme (isim). 3. İlerlemek, gelişmek (fiil).",guide:"İleri doğru hareket veya bir alandaki gelişme. Ayrıca önceden yapılan bir ödeme.",examples:"1. Medical advances have saved many lives. (Tıbbi ilerlemeler birçok hayat kurtardı.) 2. I need an advance on my salary. (Maaşımdan avans almam gerekiyor.) 3. The troops advanced towards the city. (Birlikler şehre doğru ilerledi.)"},{word:"advanced",type:"Sıfat",meaning:"1. İleri, ileri düzey. 2. Gelişmiş (teknoloji). 3. (Yaş) ileri.",guide:"Yüksek seviyede karmaşık veya gelişmiş olan.",examples:"1. She's taking an advanced English course. (İleri düzey bir İngilizce kursu alıyor.) 2. The country has advanced weapon systems. (Ülkenin gelişmiş silah sistemleri var.) 3. He is at an advanced stage of the disease. (Hastalığın ileri bir aşamasında.)"},{word:"advantage",type:"İsim",meaning:"1. Avantaj, üstünlük. 2. Yarar, fayda. 3. (take advantage of) -den yararlanmak; -i kötüye kullanmak.",guide:"Birine veya bir şeye fayda sağlayan, onu daha iyi veya daha başarılı kılan durum veya koşul.",examples:"1. His height gives him an advantage in basketball. (Boyu ona basketbolda avantaj sağlar.) 2. The advantage of this method is its simplicity. (Bu yöntemin yararı basit olmasıdır.) 3. You should take advantage of this opportunity. (Bu fırsattan yararlanmalısın.)"},{word:"adventure",type:"İsim",meaning:"1. Macera. 2. Serüven, heyecan verici deneyim. 3. Ticari spekülasyon, riskli girişim.",guide:"Heyecan verici, tehlikeli veya olağandışı bir deneyim veya yolculuk.",examples:"1. They went on a jungle adventure. (Bir orman macerasına çıktılar.) 2. Travelling alone can be quite an adventure. (Yalnız seyahat etmek büyük bir serüven olabilir.) 3. Starting a business is a real adventure. (Bir iş kurmak gerçek bir maceradır.)"},{word:"advertise",type:"Fiil",meaning:"1. Reklamını yapmak, ilan etmek. 2. Duyurmak. 3. (For ile) ilanla aramak.",guide:"Bir ürün veya hizmeti satmak veya bir etkinliği duyurmak için halka bildirmek.",examples:"1. Companies spend millions to advertise their products. (Şirketler ürünlerini reklam etmek için milyonlar harcar.) 2. The job was advertised in the local paper. (İş yerel gazetede ilan edildi.) 3. We're advertising for a new secretary. (Yeni bir sekreter için ilan veriyoruz.)"},{word:"advertisement",type:"İsim",meaning:"1. Reklam, ilan. 2. Tanıtım.",guide:"Bir şeyi satmak veya duyurmak için gazete, TV, internet gibi mecralarda yayınlanan duyuru.",examples:"1. I saw an advertisement for that car on TV. (O arabanın reklamını TV'de gördüm.) 2. The advertisement attracted many customers. (Reklam birçok müşteri çekti.)"},{word:"advertising",type:"İsim",meaning:"1. Reklamcılık, reklam. 2. Reklam veren sektör.",guide:"Reklam yapma işi veya endüstrisi.",examples:"1. She works in advertising. (Reklamcılıkta çalışıyor.) 2. The company's advertising budget is huge. (Şirketin reklam bütçesi çok büyük.)"},{word:"advice",type:"İsim",meaning:"1. Öğüt, tavsiye, nasihat. 2. (Resmi) bilgi, danışma.",guide:'Birine ne yapması gerektiği konusunda verilen fikir veya öneri. Sayılamaz, "a piece of advice" şeklinde kullanılır.',examples:"1. Can you give me some advice? (Bana biraz tavsiye verebilir misin?) 2. I followed my doctor's advice. (Doktorumun tavsiyesine uydum.) 3. Legal advice is expensive. (Hukuki danışmanlık pahalıdır.)"},{word:"advise",type:"Fiil",meaning:"1. Öğüt vermek, tavsiye etmek. 2. Bilgilendirmek, haber vermek. 3. (Resmi) danışmanlık yapmak.",guide:"Birine bir şey yapmasını önermek veya ona bilgi vermek.",examples:"1. I'd advise you to see a lawyer. (Bir avukat görmeni tavsiye ederim.) 2. We are advised to arrive early. (Bize erken gelmemiz söylendi.) 3. He advises the government on economic matters. (Hükümete ekonomik konularda danışmanlık yapıyor.)"},{word:"affair",type:"İsim",meaning:"1. Olay, mesele, iş. 2. Gizli/aşk ilişkisi. 3. (Çoğul) işler, meseleler.",guide:"Belirli bir konu veya faaliyet alanı; özellikle gizli veya tartışmalı bir ilişki.",examples:"1. The party was a grand affair. (Parti görkemli bir olaydı.) 2. He had an affair with his colleague. (Bir meslektaşıyla bir ilişkisi oldu.) 3. The minister handles foreign affairs. (Bakan dış işlerinden sorumludur.)"},{word:"affect",type:"Fiil",meaning:"1. Etkilemek. 2. (Duygusal) etkilemek, üzmek. 3. (Hastalık) vurmak, yakalamak.",guide:'Bir şeyin veya birinin üzerinde bir değişiklik veya etki yaratmak. Genellikle "effect" (etki, sonuç) ismi ile karıştırılır.',examples:"1. The bad weather affected our plans. (Kötü hava planlarımızı etkiledi.) 2. The news deeply affected her. (Haber onu derinden etkiledi.) 3. The disease affects the central nervous system. (Hastalık merkezi sinir sistemini etkiler.)"},{word:"afford",type:"Fiil",meaning:"1. Parası yetmek, gücü yetmek, alabilmek. 2. (Zaman/risk) göze alabilmek. 3. (afford to) -me lüksü olmak.",guide:`Parasal veya başka kaynaklar açısından bir şeyi yapma veya alma gücüne sahip olmak. Genellikle "can/can't" veya "be able to" ile kullanılır.`,examples:"1. We can't afford a new car. (Yeni bir araba almaya gücümüz yetmez.) 2. I can't afford to waste any more time. (Daha fazla zaman kaybetme lüksüm yok.) 3. He couldn't afford to offend his boss. (Patronunu gücendirme lüksü yoktu.)"},{word:"afraid",type:"Sıfat",meaning:"1. Korkmuş. 2. Endişeli, kaygılı. 3. (Üzgünüm) Korkarım, maalesef.",guide:`Korku veya endişe hissetmek. Bir kötü habri nazikçe vermek için de kullanılır. "I'm afraid" kalıbı yaygındır.`,examples:"1. Are you afraid of spiders? (Örümceklerden korkar mısın?) 2. I'm afraid I'll be late. (Korkarım geç kalacağım.) 3. I'm afraid we're out of milk. (Maalesef sütümüz kalmadı.)"},{word:"after",type:"Edat/Bağlaç/Zarf",meaning:"1. Sonra, ardından (edat/zarf). 2. -den sonra (edat). 3. Peşinden, ardından (zarf).",guide:"Zaman veya sıra bakımından daha sonra olmayı ifade eder.",examples:"1. We'll go for a walk after lunch. (Öğle yemeğinden sonra yürüyüşe çıkacağız.) 2. After you left, it started to rain. (Sen gittikten sonra yağmur yağmaya başladı.) 3. He arrived shortly after. (Kısa bir süre sonra geldi.)"},{word:"afternoon",type:"İsim",meaning:"1. Öğleden sonra.",guide:"Genellikle öğlen 12 ile akşam 6 arasındaki zaman dilimi.",examples:"1. See you tomorrow afternoon. (Yarın öğleden sonra görüşürüz.) 2. I have a meeting this afternoon. (Bu öğleden sonra bir toplantım var.) 3. Good afternoon! (Tünaydın!)"},{word:"afterwards",type:"Zarf",meaning:"1. Daha sonra, ondan sonra, ardından. 2. Sonradan.",guide:'Belirli bir zamandan veya olaydan sonraki zamanı belirtir. "After" ile benzerdir, ama daha çok cümle sonunda kullanılır.',examples:"1. We had dinner and went to the cinema afterwards. (Akşam yemeği yedik ve ondan sonra sinemaya gittik.) 2. I felt fine during the exam, but afterwards I was exhausted. (Sınav sırasında iyi hissettim, ama sonradan bitkin düştüm.)"},{word:"again",type:"Zarf",meaning:"1. Tekrar, yeniden, bir daha. 2. Ayrıca, üstelik. 3. (then again) Öte yandan.",guide:"Bir kez daha, bir önceki duruma dönerek.",examples:"1. Please say that again. (Lütfen onu tekrar söyle.) 2. It's nice, but then again, it's expensive. (Güzel, ama öte yandan pahalı.) 3. I won't do it again. (Bir daha yapmayacağım.)"},{word:"against",type:"Edat",meaning:"1. Karşı, aleyhinde. 2. -e dayalı, -e yaslanmış. 3. -e karşı (mücadele).",guide:"Karşıtlık, direnç veya fiziksel teması ifade eder.",examples:"1. I'm against the new policy. (Yeni politikaya karşıyım.) 2. He leaned against the wall. (Duvara yaslandı.) 3. We played against a strong team. (Güçlü bir takıma karşı oynadık.)"},{word:"age",type:"İsim/Fiil",meaning:"1. Yaş (isim). 2. Çağ, devir (isim). 3. Yaşlanmak (fiil).",guide:"Bir canlının veya şeyin var olduğu süre. Ayrıca tarihsel dönem.",examples:"1. What is your age? (Yaşınız nedir?) 2. We live in the digital age. (Dijital çağda yaşıyoruz.) 3. Fine wine ages well. (Kaliteli şarap iyi yaşlanır.)"},{word:"aged",type:"Sıfat",meaning:"1. Yaşında (sayı ile). 2. Yaşlanmış, ihtiyar. 3. Eskitilmiş (şarap/peynir).",guide:"Belli bir yaşa sahip olan veya yaşlanma belirtileri gösteren.",examples:"1. She has a son aged ten. (On yaşında bir oğlu var.) 2. They care for the aged in the community. (Toplumdaki yaşlılara bakıyorlar.) 3. aged cheese (eskitilmiş peynir)"},{word:"agency",type:"İsim",meaning:"1. Ajans, acente. 2. Kurum, kuruluş. 3. Etkenlik, etki gücü.",guide:"Belirli bir hizmet veren veya iş yapan organizasyon.",examples:"1. She works for a travel agency. (Bir seyahat acentesinde çalışıyor.) 2. The environmental protection agency (çevre koruma kurumu) 3. I got the job through an employment agency. (İşe bir istihdam bürosu aracılığıyla girdim.)"},{word:"agenda",type:"İsim",meaning:"1. Gündem. 2. Ajanda, yapılacaklar listesi. 3. Gizli amaç, plan.",guide:"Toplantıda tartışılacak maddelerin listesi veya birinin öncelikli hedefleri.",examples:"1. The first item on the agenda is the budget. (Gündemin ilk maddesi bütçe.) 2. He has a hidden political agenda. (Onun gizli bir siyasi gündemi var.) 3. What's on your agenda for today? (Bugünkü ajandanda neler var?)"},{word:"agent",type:"İsim",meaning:"1. Temsilci, acente. 2. Ajan, casus. 3. Etken, faktör (kimya).",guide:"Bir başkası adına iş yapan kişi veya bir şeye neden olan etken.",examples:"1. I contacted the real estate agent. (Emlakçıyla iletişime geçtim.) 2. He was a secret agent for the government. (Hükümet için gizli ajanlık yapıyordu.) 3. Soap is a cleaning agent. (Sabun bir temizlik maddesidir.)"},{word:"aggressive",type:"Sıfat",meaning:"1. Saldırgan, agresif. 2. Hırslı, atılgan (ticaret). 3. Şiddetli (hastalık).",guide:"Fiziksel veya sözlü saldırıya hazır olan; pazarlama vb.'de çok iddialı ve baskın olan.",examples:"1. The dog became aggressive. (Köpek saldırganlaştı.) 2. The company has an aggressive marketing campaign. (Şirketin iddialı bir pazarlama kampanyası var.) 3. aggressive cancer treatment (şiddetli kanser tedavisi)"},{word:"ago",type:"Zarf",meaning:"1. Önce (geçmiş zaman).",guide:"Şu andan geriye doğru belirli bir süre önceyi ifade eder. Her zaman geçmiş zamanla kullanılır.",examples:"1. I saw him two days ago. (Onu iki gün önce gördüm.) 2. She left a long time ago. (O çok uzun zaman önce gitti.) 3. How long ago did it happen? (Bu ne kadar zaman önce oldu?)"},{word:"agree",type:"Fiil",meaning:"1. Aynı fikirde olmak, katılmak. 2. Anlaşmak, uzlaşmak. 3. (Yemeğin) yaramak, iyi gelmek.",guide:"Bir fikre veya öneriye onay vermek veya bir konuda mutabık kalmak.",examples:"1. I agree with you completely. (Sana tamamen katılıyorum.) 2. They finally agreed on a price. (Sonunda bir fiyatta anlaştılar.) 3. Spicy food doesn't agree with me. (Baharatlı yemek bana dokunuyor.)"},{word:"agreement",type:"İsim",meaning:"1. Anlaşma, mutabakat. 2. Sözleşme, kontrat. 3. Uyum, ahenk.",guide:"İki veya daha fazla taraf arasında varılan resmi veya gayriresmi uzlaşma.",examples:"1. We have an agreement not to discuss this. (Bunu tartışmama konusunda bir anlaşmamız var.) 2. Please sign the agreement. (Lütfen sözleşmeyi imzalayın.) 3. There is little agreement among experts. (Uzmanlar arasında çok az fikir birliği var.)"},{word:"ah",type:"Ünlem",meaning:"1. Ah! (şaşırma, anlama, acı). 2. A! (fark etme, memnuniyet). 3. Hımm (düşünme).",guide:"Ani bir duygu (şaşkınlık, acı, memnuniyet, farkına varma) ifade eden bir ünlem.",examples:"1. Ah, now I understand! (Ah, şimdi anladım!) 2. Ah, that feels good! (Ah, bu iyi geldi!) 3. Ah, I see what you mean. (Ah, ne demek istediğini anlıyorum.)"},{word:"ahead",type:"Zarf/Sıfat",meaning:"1. İleride, önde (zarf). 2. Önceden, erkenden (zarf). 3. Gelecekte (sıfat).",guide:"Mekanda veya zamanda daha ileri bir konumu belirtir.",examples:"1. The road ahead is clear. (İlerideki yol açık.) 2. We need to plan ahead. (Önceden plan yapmamız gerekiyor.) 3. There are difficult times ahead. (Önümüzde zor zamanlar var.)"},{word:"aid",type:"İsim/Fiil",meaning:"1. Yardım, destek (isim). 2. Yardım etmek (fiil). 3. Yardımcı alet (isim).",guide:"Birine veya bir şeye yardım etme eylemi veya yardımın kendisi.",examples:"1. The country receives foreign aid. (Ülke dış yardım alıyor.) 2. This medicine aids digestion. (Bu ilaç sindirime yardımcı olur.) 3. Hearing aids are getting smaller. (İşitme cihazları küçülüyor.)"},{word:"aim",type:"Fiil/İsim",meaning:"1. Amaçlamak, hedeflemek (fiil). 2. Nişan almak (fiil). 3. Amaç, hedef (isim).",guide:"Bir şeyi başarmayı hedeflemek veya bir silahı bir şeye doğrultmak.",examples:"1. We aim to finish by Friday. (Cuma gününe kadar bitirmeyi hedefliyoruz.) 2. He aimed the camera at the bird. (Kamerayı kuşa doğrulttu.) 3. Her main aim in life is to be happy. (Hayattaki temel amacı mutlu olmak.)"},{word:"air",type:"İsim/Fiil",meaning:"1. Hava (isim). 2. Havalandırmak, yayınlamak (fiil). 3. Görünüm, hava, tavır (isim).",guide:"Soluduğumuz gaz karışımı. Fiil olarak bir fikri dile getirmek veya bir programı yayınlamak anlamına gelir.",examples:"1. The air is fresh in the mountains. (Dağlarda hava temizdir.) 2. She aired her grievances. (Şikayetlerini dile getirdi.) 3. He has an air of confidence. (Kendinden emin bir havası var.)"},{word:"aircraft",type:"İsim",meaning:"1. Hava aracı, uçak.",guide:"Uçak, helikopter gibi havada uçabilen her türlü taşıt. Tekil ve çoğul hali aynıdır.",examples:"1. Military aircraft flew overhead. (Askeri uçaklar başımızın üzerinden uçtu.) 2. The aircraft landed safely. (Hava aracı güvenle indi.)"},{word:"airline",type:"İsim",meaning:"1. Havayolu şirketi.",guide:"Yolcu ve yük taşıyan hava taşımacılığı şirketi.",examples:"1. Which airline are you flying with? (Hangi havayolu ile uçuyorsun?) 2. A new low-cost airline started operations. (Yeni bir düşük maliyetli havayolu seferlere başladı.)"},{word:"airport",type:"İsim",meaning:"1. Havaalanı.",guide:"Uçakların kalkıp indiği, yolcuların biniş-iniş yaptığı tesisler kompleksi.",examples:"1. We need to get to the airport two hours early. (Havaalanına iki saat önce varmamız gerekiyor.) 2. The airport was very crowded. (Havaalanı çok kalabalıktı.)"},{word:"alarm",type:"İsim/Fiil",meaning:"1. Alarm (isim). 2. Telaş, endişe (isim). 3. Endişelendirmek, telaşlandırmak (fiil).",guide:"Tehlikeyi bildiren sesli cihaz veya korku, endişe duygusu.",examples:"1. The fire alarm went off. (Yangın alarmı çaldı.) 2. There is no cause for alarm. (Telaşlanacak bir durum yok.) 3. His silence alarmed me. (Sessizliği beni endişelendirdi.)"},{word:"album",type:"İsim",meaning:"1. Albüm (müzik/fotoğraf). 2. Derleme, koleksiyon.",guide:"Müzik kayıtlarının veya fotoğrafların bir arada bulunduğu koleksiyon.",examples:"1. They just released their new album. (Yeni albümlerini çıkardılar.) 2. I found an old photo album in the attic. (Tavan arasında eski bir fotoğraf albümü buldum.)"},{word:"alcohol",type:"İsim",meaning:"1. Alkol (içki). 2. (Kimya) alkol.",guide:"Şarap, bira, rakı gibi içkilerde bulunan ve sarhoşluk veren madde.",examples:"1. He doesn't drink alcohol. (Alkol içmez.) 2. The drink contains 5% alcohol. (İçecek %5 alkol içerir.)"},{word:"alcoholic",type:"Sıfat/İsim",meaning:"1. Alkolik (sıfat/isim). 2. Alkol içeren (sıfat).",guide:"Alkol bağımlısı kişi veya alkol içeren herhangi bir şey.",examples:"1. He is a recovering alcoholic. (O, iyileşmekte olan bir alkolik.) 2. Alcoholic beverages are served here. (Burada alkollü içecekler servis edilir.)"},{word:"alive",type:"Sıfat",meaning:"1. Canlı, hayatta. 2. Hareketli, canlı (ortam). 3. Farkında, bilincinde (aware of).",guide:"Ölü olmama durumu. Ayrıca enerjik ve aktif olan şeyler için mecazi anlamda kullanılır.",examples:"1. Is the injured bird still alive? (Yaralı kuş hâlâ hayatta mı?) 2. The city centre is alive with tourists. (Şehir merkezi turistlerle canlı.) 3. He is alive to the dangers. (Tehlikelerin farkında.)"},{word:"all",type:"Belirteç/Zamir/Sıfat",meaning:"1. Tüm, bütün, hepsi. 2. Her, tamamen (zarf). 3. (all over) bitmiş, sona ermiş.",guide:'Bir grubun tamamını, her bir parçasını ifade eder. Zarf olarak "tamamen" anlamına gelir.',examples:"1. All students must register. (Tüm öğrenciler kayıt olmalı.) 2. I'm all wet. (Tamamen ıslandım.) 3. The game is all over. (Oyun bitti.)"},{word:"all right",type:"Sıfat/Zarf/Ünlem",meaning:"1. İyi, yolunda (sıfat). 2. Tamam, peki (onay/ümit). 3. Kabul edilebilir, idare eder (sıfat).",guide:"Bir şeyin kabul edilebilir veya sorunsuz olduğunu belirtir. Ayrıca onay veya teyit ifade eder.",examples:"1. Are you feeling all right? (Kendini iyi hissediyor musun?) 2. All right, I'll do it. (Peki, yapacağım.) 3. The movie was all right, but not great. (Film idare ederdi, ama harika değildi.)"},{word:"allow",type:"Fiil",meaning:"1. İzin vermek, müsaade etmek. 2. Olanak tanımak, sağlamak. 3. (Hesaba) dahil etmek, göz önünde bulundurmak.",guide:"Bir şeyin olmasına veya birinin bir şey yapmasına izin vermek.",examples:"1. Smoking is not allowed here. (Burada sigara içmeye izin verilmiyor.) 2. The schedule allows time for a break. (Program bir mola için zaman tanıyor.) 3. Allow me to introduce myself. (Kendimi tanıtmama izin verin.)"},{word:"almost",type:"Zarf",meaning:"1. Neredeyse, hemen hemen. 2. Az kalsın.",guide:"Bir şeyin tam olarak değil, çok yakın bir derecede gerçekleştiğini belirtir.",examples:"1. I almost forgot your birthday. (Neredeyse doğum gününü unutuyordum.) 2. Dinner is almost ready. (Akşam yemeği neredeyse hazır.) 3. It's almost impossible. (Neredeyse imkansız.)"},{word:"alone",type:"Sıfat/Zarf",meaning:"1. Yalnız, tek başına (sıfat). 2. Sadece, yalnızca (zarf). 3. Kendi halinde, rahatsız edilmemiş.",guide:'Başka kimse veya hiçbir şey olmadan. Vurgu için "sadece" anlamında da kullanılır.',examples:"1. She lives alone. (Yalnız yaşıyor.) 2. The price alone is reason enough to buy it. (Sadece fiyatı bile satın almak için yeterli bir sebep.) 3. Leave me alone! (Beni rahat bırak!)"},{word:"along",type:"Edat/Zarf",meaning:"1. Boyunca, yolunda (edat). 2. İlerleyerek, beraberinde (zarf). 3. (get along) anlaşmak, iyi geçinmek.",guide:"Bir çizgi veya yol üzerinde hareketi veya konumu ifade eder.",examples:"1. We walked along the river. (Nehir boyunca yürüdük.) 2. Come along with us. (Bizimle gel.) 3. How are you getting along with your new colleagues? (Yeni meslektaşlarınla nasıl anlaşıyorsun?)"},{word:"already",type:"Zarf",meaning:"1. Zaten, çoktan. 2. Şimdiden, daha şimdiden.",guide:"Beklenenden veya gerekenden daha önce olmuş bir şeyi ifade eder. Genellikle olumlu cümlelerde ve Perfect Tense'lerle kullanılır.",examples:"1. I have already seen that film. (O filmi zaten gördüm.) 2. Are you leaving already? (Şimdiden mi gidiyorsun?) 3. He's already finished his homework. (Ödevini çoktan bitirdi.)"},{word:"also",type:"Zarf",meaning:"1. Ayrıca, da, dahi. 2. Bunun yanı sıra.",guide:'Ek bir bilgi veya benzer bir durum ifade etmek için kullanılır. Genellikle fiilden önce, ama "be" fiilinden sonra gelir.',examples:"1. She speaks English and also French. (İngilizce ve ayrıca Fransızca konuşuyor.) 2. I was also there. (Ben de oradaydım.) 3. He not only sings, but also dances. (O sadece şarkı söylemez, aynı zamanda dans da eder.)"},{word:"alter",type:"Fiil",meaning:"1. Değiştirmek, başkalaştırmak. 2. (Giysi) değiştirmek, üzerinde değişiklik yapmak. 3. Değişmek.",guide:"Genellikle küçük veya önemli bir şekilde değişiklik yapmak.",examples:"1. We had to alter our plans due to the rain. (Yağmur nedeniyle planlarımızı değiştirmek zorunda kaldık.) 2. The dress needs to be altered. (Elbisenin değiştirilmesi gerekiyor.) 3. His attitude has altered significantly. (Tavrı önemli ölçüde değişti.)"},{word:"alternative",type:"İsim/Sıfat",meaning:"1. Alternatif, seçenek (isim). 2. Alternatif, başka (sıfat). 3. Geleneksel olmayan, farklı (sıfat).",guide:"Mevcut olan veya geleneksel olandan farklı bir seçim veya olasılık.",examples:"1. Do you have any alternatives? (Başka seçeneklerin var mı?) 2. We need to find an alternative solution. (Alternatif bir çözüm bulmamız gerekiyor.) 3. alternative medicine (alternatif tıp)"},{word:"although",type:"Bağlaç",meaning:"1. Rağmen, karşın, -mesine rağmen. 2. Gerçi, her ne kadar.",guide:'Zıt veya beklenmedik bir durumu tanıtmak için kullanılan bir zıtlık bağlacı. "Though" veya "even though" ile benzerdir.',examples:"1. Although it was raining, we went for a walk. (Yağmur yağmasına rağmen yürüyüşe çıktık.) 2. She accepted the job, although the salary was low. (Maaş düşük olmasına rağmen işi kabul etti.)"},{word:"always",type:"Zarf",meaning:"1. Her zaman, daima. 2. Sürekli, durmadan (olumsuzda). 3. (Can always) her halükarda yapabilmek.",guide:"Her seferinde, hiç istisna olmadan veya sürekli olarak.",examples:"1. The sun always rises in the east. (Güneş her zaman doğudan doğar.) 2. He is always complaining. (O sürekli şikayet ediyor.) 3. You can always stay with us. (Her halükarda bizde kalabilirsin.)"},{word:"amazed",type:"Sıfat",meaning:"1. Hayret etmiş, şaşırmış. 2. Hayran kalmış.",guide:"Çok büyük bir şaşkınlık veya hayranlık içinde olma durumu.",examples:"1. I was amazed by his knowledge. (Onun bilgisine hayret ettim.) 2. She looked amazed at the news. (Haber karşısında şaşkına dönmüş görünüyordu.) 3. We were amazed that he won. (Onun kazandığına şaşırdık.)"},{word:"amazing",type:"Sıfat",meaning:"1. İnanılmaz, harika, şaşırtıcı. 2. Hayranlık uyandıran.",guide:"Çok iyi, etkileyici veya şaşırtıcı olan şeyleri tanımlamak için kullanılan yaygın bir ifade.",examples:"1. The view from the top was amazing. (Tepedeki manzara inanılmazdı.) 2. You look amazing in that dress. (O elbisenin içinde harika görünüyorsun.) 3. It's amazing how fast time flies. (Zamanın ne kadar hızlı geçtiği inanılmaz.)"},{word:"ambition",type:"İsim",meaning:"1. Hırs, tutku, amaç. 2. İstek, arzu. 3. Büyük hedef.",guide:"Başarı veya güç elde etmek için güçlü bir istek veya bu isteğin hedefi.",examples:"1. His ambition is to become CEO. (Onun hırsı CEO olmak.) 2. She has no political ambitions. (Onun siyasi hırsları yok.) 3. Fulfilling a lifelong ambition (ömür boyu süren bir hedefi gerçekleştirmek)"},{word:"ambitious",type:"Sıfat",meaning:"1. Hırslı, tutkulu. 2. İddialı, iddialı (plan). 3. Büyük hedefleri olan.",guide:"Başarılı olmak için güçlü bir arzusu olan veya büyük çaba gerektiren.",examples:"1. She is very ambitious and hardworking. (O çok hırslı ve çalışkan.) 2. It's an ambitious project to rebuild the city. (Şehri yeniden inşa etmek iddialı bir proje.) 3. ambitious goals (iddialı hedefler)"},{word:"among",type:"Edat",meaning:"1. Arasında (ikiden fazla şey/kişi). 2. Arasında paylaşılan. 3. -in çoğunluğu arasında.",guide:'Bir grubun veya kitlenin içinde veya parçası olma durumunu ifade eder. "Between" ikili ilişkiler için kullanılırken, "among" üç veya daha fazlası için kullanılır.',examples:"1. She was sitting among friends. (Arkadaşlarının arasında oturuyordu.) 2. Divide the sweets among the children. (Şekerleri çocuklar arasında paylaştır.) 3. This is a common problem among teenagers. (Bu, gençler arasında yaygın bir sorundur.)"},{word:"amount",type:"İsim/Fiil",meaning:"1. Miktar, tutar (isim). 2. (amount to) -e varmak, -e eşdeğer olmak (fiil). 3. Toplam.",guide:"Ölçülebilir veya sayılabilir bir şeyin niceliği.",examples:"1. A large amount of money was stolen. (Büyük miktarda para çalındı.) 2. His debts amount to thousands of dollars. (Borçları binlerce dolara varıyor.) 3. Pay the full amount by the end of the month. (Ay sonuna kadar tam tutarı ödeyin.)"},{word:"analyse",type:"Fiil",meaning:"1. Çözümlemek, analiz etmek. 2. İncelemek, detaylıca düşünmek. 3. Psikanaliz yapmak.",guide:"Bir şeyi daha iyi anlamak için onu bileşenlerine ayırmak veya detaylıca incelemek.",examples:"1. We need to analyse the data carefully. (Veriyi dikkatlice analiz etmemiz gerekiyor.) 2. The doctor analysed the symptoms. (Doktor semptomları inceledi.) 3. He spent hours analysing the game. (Oyunu analiz etmek için saatler harcadı.)"},{word:"analysis",type:"İsim",meaning:"1. Çözümleme, analiz. 2. İnceleme, tahlil. 3. Psikanaliz.",guide:"Analiz etme eylemi veya bunun sonucunda ortaya çıkan detaylı inceleme/rapor.",examples:"1. The analysis of the samples took a week. (Numunelerin analizi bir hafta sürdü.) 2. I need to see a detailed analysis of the costs. (Maliyetlerin detaylı bir analizini görmem gerekiyor.) 3. market analysis (pazar analizi)"},{word:"ancient",type:"Sıfat",meaning:"1. Çok eski, antik, kadim. 2. Eskiden kalma. 3. (Şaka) köhne, çok yaşlı.",guide:"Çok uzun zaman öncesine ait, tarihi. Mizahi olarak çok yaşlı için de kullanılır.",examples:"1. We studied ancient Greek history. (Antik Yunan tarihi okuduk.) 2. He drives an ancient car. (Eskiden kalma bir araba kullanıyor.) 3. My computer is ancient! (Benim bilgisayarım antika!)"},{word:"and",type:"Bağlaç",meaning:"1. Ve, ile. 2. Ayrıca, bir de. 3. (Sonuç bildirir) böylece, ve.",guide:"Kelimeleri, cümleleri veya fikirleri birbirine bağlamak için kullanılan temel bağlaç.",examples:"1. bread and butter (ekmek ve tereyağı) 2. She smiled and waved. (Gülümsedi ve el salladı.) 3. Work hard and you will succeed. (Sıkı çalış ve başaracaksın.)"},{word:"anger",type:"İsim/Fiil",meaning:"1. Öfke, kızgınlık (isim). 2. Öfkelendirmek, kızdırmak (fiil).",guide:"Güçlü bir hoşnutsuzluk ve düşmanlık duygusu.",examples:"1. He couldn't hide his anger. (Öfkesini gizleyemedi.) 2. Her words angered him deeply. (Sözleri onu derinden öfkelendirdi.) 3. public anger over the decision (karara karşı kamu öfkesi)"},{word:"angle",type:"İsim",meaning:"1. Açı. 2. Bakış açısı, görüş. 3. Köşe, yön.",guide:"Geometrik açı veya bir konuya yaklaşma şekli.",examples:"1. The two lines form a right angle. (İki çizgi bir dik açı oluşturur.) 2. Let's look at this problem from a different angle. (Bu soruna farklı bir açıdan bakalım.) 3. He took a photo from a low angle. (Alçak bir açıdan fotoğraf çekti.)"},{word:"angry",type:"Sıfat",meaning:"1. Kızgın, öfkeli, sinirli. 2. (Hava) fırtınalı, hiddetli. 3. (Yara) iltihaplı, kızarmış.",guide:"Birine veya bir şeye karşı öfke veya kızgınlık duyma durumu.",examples:"1. Why are you so angry? (Neden bu kadar kızgınsın?) 2. My father was angry with me. (Babam bana kızmıştı.) 3. an angry red rash (kızarmış kırmızı bir döküntü)"},{word:"animal",type:"İsim",meaning:"1. Hayvan. 2. Hayvani, vahşi (davranış). 3. Kişi, tip (aşağılayıcı).",guide:"İnsan dışında, genellikle hareket eden ve beslenen canlı. Mecazi olarak vahşi veya aşağılayıcı anlamda da kullanılır.",examples:"1. Lions are wild animals. (Aslanlar vahşi hayvanlardır.) 2. He was treated like an animal. (O bir hayvan gibi muamele gördü.) 3. She has an animal magnetism. (Hayvansı bir çekiciliği var.)"},{word:"ankle",type:"İsim",meaning:"1. Ayak bileği.",guide:"Bacağın ayakla birleştiği eklem.",examples:"1. I twisted my ankle while running. (Koşarken ayak bileğimi burktum.) 2. She wore a bracelet around her ankle. (Ayak bileğine bir bilezik taktı.)"},{word:"anniversary",type:"İsim",meaning:"1. Yıldönümü.",guide:"Bir olayın her yıl tekrarlanan anma günü (evlilik, kuruluş vb.).",examples:"1. Today is our wedding anniversary. (Bugün evlilik yıldönümümüz.) 2. The company celebrated its 50th anniversary. (Şirket 50. yıldönümünü kutladı.)"},{word:"announce",type:"Fiil",meaning:"1. Duyurmak, ilan etmek. 2. Bildirmek, haber vermek. 3. (Gelişi) anons etmek.",guide:"Resmi veya kamuya açık bir şekilde bir haberi söylemek.",examples:"1. The government announced new taxes. (Hükümet yeni vergiler duyurdu.) 2. They announced their engagement. (Nişanlarını duyurdular.) 3. The flight attendant announced our arrival. (Kabin memuru varışımızı anons etti.)"},{word:"announcement",type:"İsim",meaning:"1. Duyuru, ilan. 2. Anons. 3. Resmi bildiri.",guide:"Duyurulan şey, genellikle yazılı veya sözlü açıklama.",examples:"1. I have an important announcement to make. (Yapmam gereken önemli bir duyuru var.) 2. Listen for the announcement at the station. (İstasyondaki anonsu dinleyin.)"},{word:"annoy",type:"Fiil",meaning:"1. Sinirlendirmek, rahatsız etmek. 2. Canını sıkmak. 3. Taciz etmek.",guide:"Hafif veya sürekli bir rahatsızlık veya kızgınlık yaratmak.",examples:"1. Loud music really annoys me. (Yüksek sesli müzik beni gerçekten sinirlendirir.) 2. Stop annoying your sister! (Kız kardeşini rahatsız etmeyi bırak!)"},{word:"annoyed",type:"Sıfat",meaning:"1. Sinirlenmiş, rahatsız olmuş. 2. Canı sıkkın.",guide:"Bir şey veya biri yüzünden hafifçe kızgın veya rahatsız hissetme durumu.",examples:"1. I was annoyed by the constant noise. (Sürekli gürültüden rahatsız oldum.) 2. She gave him an annoyed look. (Ona sinirli bir bakış attı.)"},{word:"annoying",type:"Sıfat",meaning:"1. Sinir bozucu, rahatsız edici. 2. Can sıkıcı.",guide:"Sinirlenmeye veya rahatsızlığa neden olan şeyleri tanımlar.",examples:"1. That buzzing sound is very annoying. (O vızıltı sesi çok sinir bozucu.) 2. He has some annoying habits. (Bazı can sıkıcı alışkanlıkları var.)"},{word:"annual",type:"Sıfat",meaning:"1. Yıllık, senede bir olan. 2. Bir yıllık süre için. 3. Yıllık bitki (botanik).",guide:"Her yıl tekrarlanan veya bir yıl için geçerli olan.",examples:"1. The company holds its annual meeting in June. (Şirket yıllık toplantısını Haziran'da yapar.) 2. What is your annual income? (Yıllık geliriniz nedir?) 3. annual leave (yıllık izin)"},{word:"another",type:"Belirteç/Zamir",meaning:"1. Bir başka, bir diğer. 2. Ek bir, fazladan bir. 3. Farklı bir.",guide:"Zaten var olandan farklı veya ek bir şeyi ifade eder.",examples:"1. Would you like another cup of tea? (Bir bardak daha çay ister misiniz?) 2. That's another matter entirely. (Bu tamamen farklı bir mesele.) 3. We'll have to try another day. (Başka bir gün denemek zorunda kalacağız.)"},{word:"answer",type:"İsim/Fiil",meaning:"1. Cevap, yanıt (isim). 2. Cevap vermek, yanıtlamak (fiil). 3. (Sorunu) çözmek, halletmek (fiil).",guide:"Bir soruya veya probleme verilen sözlü, yazılı veya eylemsel karşılık.",examples:"1. I'm waiting for an answer to my email. (E-postama bir cevap bekliyorum.) 2. Could you answer the phone, please? (Telefona bakar mısın lütfen?) 3. This new drug may answer the problem. (Bu yeni ilaç sorunu çözebilir.)"},{word:"anxious",type:"Sıfat",meaning:"1. Endişeli, kaygılı. 2. İstekli, hevesli. 3. Tedirgin, huzursuz.",guide:"Kötü bir şey olacağından korkma nedeniyle gergin veya endişeli hissetmek. Ayrıca bir şeyi çok istemek.",examples:"1. I'm anxious about the exam results. (Sınav sonuçları konusunda endişeliyim.) 2. She is anxious to start her new job. (Yeni işine başlamak için hevesli.) 3. an anxious wait (endişeli bir bekleyiş)"},{word:"any",type:"Belirteç/Zamir/Sıfat",meaning:"1. Hiç, herhangi bir (soru/olumsuz). 2. Her, hiçbir fark olmaksızın (olumlu). 3. Biraz, herhangi bir miktar.",guide:'Olumsuz ve soru cümlelerinde "hiç" anlamına gelir. Olumlu cümlelerde "herhangi" vurgusu yapar.',examples:"1. Do you have any money? (Hiç paran var mı?) 2. You can call me any time. (Bana her zaman telefon edebilirsin.) 3. If there are any problems, let me know. (Herhangi bir sorun olursa, bana haber ver.)"},{word:"anybody",type:"Zamir",meaning:"1. Hiç kimse (olumsuz). 2. Herhangi biri (soru/olumlu).",guide:'"Anyone" ile tamamen aynı anlamda ve kullanımdadır. Günlük konuşmada daha yaygındır.',examples:"1. I didn't see anybody. (Hiç kimseyi görmedim.) 2. Does anybody have a pen? (Bir kalemi olan var mı?) 3. Anybody can learn to cook. (Herkes yemek yapmayı öğrenebilir.)"},{word:"anyone",type:"Zamir",meaning:"1. Hiç kimse (olumsuz). 2. Herhangi biri (soru/olumlu). 3. Önemli biri.",guide:'"Anybody" ile aynı anlama gelir. Yazı dilinde biraz daha yaygın olabilir.',examples:"1. Is anyone there? (Orada kimse var mı?) 2. It's so easy anyone could do it. (O kadar kolay ki herkes yapabilir.) 3. He never became anyone important. (Asla önemli biri olamadı.)"},{word:"anything",type:"Zamir",meaning:"1. Hiçbir şey (olumsuz). 2. Herhangi bir şey (soru/olumlu). 3. (anything but) kesinlikle ... değil.",guide:'"Something"in soru ve olumsuz hallerinde kullanılan karşılığı.',examples:"1. I don't know anything about it. (Onun hakkında hiçbir şey bilmiyorum.) 2. Would you like anything to drink? (İçecek bir şey ister misiniz?) 3. He's anything but lazy. (O tembel falan değil, kesinlikle.)"},{word:"anyway",type:"Zarf",meaning:"1. Neyse, her neyse. 2. Zaten, nasıl olsa. 3. (Konuyu değiştirirken) bu arada.",guide:"Konuşmada bir konuyu kapatmak, vurgulamak veya konuyu değiştirmek için sıklıkla kullanılır.",examples:"1. Anyway, let's get back to the main point. (Neyse, asıl konuya dönelim.) 2. I don't need a car; I can't drive anyway. (Arabaya ihtiyacım yok; zaten araba kullanamıyorum.) 3. It's too late now, anyway. (Nasıl olsa artık çok geç.)"},{word:"anywhere",type:"Zarf",meaning:"1. Hiçbir yerde (olumsuz). 2. Herhangi bir yerde (soru/olumlu). 3. (or anywhere) falan, filan.",guide:"Bir yer belirtmeden, herhangi bir yeri ifade eder.",examples:"1. I can't find my keys anywhere. (Anahtarlarımı hiçbir yerde bulamıyorum.) 2. We can sit anywhere we like. (İstediğimiz herhangi bir yere oturabiliriz.) 3. Would you like to go to the cinema or anywhere? (Sinemaya falan gitmek ister misin?)"},{word:"apart",type:"Zarf",meaning:"1. Ayrı, uzak. 2. Parçalara ayrılmış. 3. (apart from) -den başka, hariç.",guide:"Birbirinden ayrı veya uzak olma durumu.",examples:"1. The two houses are far apart. (İki ev birbirinden çok uzak.) 2. He took the clock apart to fix it. (Onarmak için saati parçalarına ayırdı.) 3. Apart from the cost, it's a great idea. (Maliyet hariç, harika bir fikir.)"},{word:"apartment",type:"İsim",meaning:"1. Daire, apartman dairesi. 2. (Geniş) kat, daire.",guide:"Bir binada, genellikle bir katı kaplayan, başka dairelerle yan yana olan konut birimi.",examples:"1. They rent a small apartment in the city centre. (Şehir merkezinde küçük bir daire kiralıyorlar.) 2. a luxury apartment (lüks bir daire)"},{word:"apologize",type:"Fiil",meaning:"1. Özür dilemek. 2. Mazeret bildirmek.",guide:"Bir hata veya kabahat için üzüntü ifade etmek.",examples:"1. I think you should apologize to her. (Ondan özür dilemen gerektiğini düşünüyorum.) 2. He apologized for being late. (Geç kaldığı için özür diledi.)"},{word:"app",type:"İsim",meaning:"1. Uygulama (application'ın kısaltması).",guide:"Akıllı telefon veya tablette çalışan, belirli bir işlevi olan yazılım programı.",examples:"1. There's a useful app for learning vocabulary. (Kelime öğrenmek için yararlı bir uygulama var.) 2. I downloaded a fitness tracking app. (Bir fitness takip uygulaması indirdim.)"},{word:"apparent",type:"Sıfat",meaning:"1. Görünür, belli, açık. 2. Görünüşteki, zahiri.",guide:"Hemen görülebilen veya anlaşılabilen; gerçek olup olmadığı kesin olmayan.",examples:"1. For no apparent reason, he started laughing. (Hiçbir sebep yokken gülmeye başladı.) 2. Her apparent confidence hid her nervousness. (Onun görünürdeki özgüveni, aslında gizlediği gerginliğiydi.) 3. It soon became apparent that he was lying. (Onun yalan söylediği kısa sürede belli oldu.)"},{word:"apparently",type:"Zarf",meaning:"1. Görünüşe göre, anlaşılan. 2. Belli ki, anlaşıldığı kadarıyla.",guide:"Bir şeyin duyulduğuna, göründüğüne veya söylendiğine (ama mutlak kesinlik taşımadığına) göre anlamı verir.",examples:"1. Apparently, she's leaving her job. (Görünüşe göre işinden ayrılıyormuş.) 2. He's apparently very rich. (Anlaşılan o ki çok zengin.) 3. The door was apparently unlocked. (Kapı görünüşe göre kilitli değildi.)"},{word:"appeal",type:"İsim/Fiil",meaning:"1. Cazibe, çekicilik (isim). 2. Rica, yalvarma (isim). 3. Temyize başvurmak, itiraz etmek (fiil).",guide:"Bir şeyin hoşa gitme, ilgi çekme özelliği. Ayrıca resmi bir ricada bulunma veya bir karara itiraz etme.",examples:"1. The idea has a certain appeal. (Fikrin belli bir cazibesi var.) 2. She made an appeal for help. (Yardım için bir ricada bulundu.) 3. They decided to appeal the court's decision. (Mahkemenin kararına itiraz etmeye karar verdiler.)"},{word:"appear",type:"Fiil",meaning:"1. Görünmek, ortaya çıkmak. 2. Gözükmek, görünmek (gibi). 3. (Mahkemede) görünmek.",guide:"Gözle görülür hale gelmek veya bir izlenim yaratmak.",examples:"1. A ship appeared on the horizon. (Ufukta bir gemi göründü.) 2. She appears to be very happy. (Çok mutlu gözüküyor.) 3. He had to appear in court. (Mahkemeye çıkmak zorunda kaldı.)"},{word:"appearance",type:"İsim",meaning:"1. Görünüş, dış görünüş. 2. Ortaya çıkma, görünme. 3. (Kamusal) görünme, katılma.",guide:"Birinin veya bir şeyin dıştan görünme şekli veya bir yerde görünme eylemi.",examples:"1. Don't judge by appearances. (Görünüşe göre karar verme.) 2. His sudden appearance surprised everyone. (Aniden ortaya çıkışı herkesi şaşırttı.) 3. This is his first public appearance since the election. (Bu, onun seçimden bu yana ilk kamusal görünüşü.)"},{word:"apple",type:"İsim",meaning:"1. Elma. 2. (the apple of someone's eye) birinin göz bebeği.",guide:"Yaygın bir meyve. Mecazi anlamda sevilen şey/kişi.",examples:"1. An apple a day keeps the doctor away. (Günde bir elma doktoru uzak tutar.) 2. His daughter is the apple of his eye. (Kızı onun göz bebeğidir.)"},{word:"application",type:"İsim",meaning:"1. Başvuru. 2. Uygulama, tatbik. 3. (Bilgisayar) uygulama, program.",guide:"Bir şey için resmi istek; bir prensibin veya yöntemin kullanılması.",examples:"1. I submitted my job application yesterday. (İş başvurumu dün gönderdim.) 2. The application of this theory is difficult. (Bu teorinin uygulanması zordur.) 3. a useful software application (yararlı bir yazılım uygulaması)"},{word:"apply",type:"Fiil",meaning:"1. Başvurmak. 2. Uygulamak, tatbik etmek. 3. Sürmek, uygulamak (krem/kural).",guide:"Bir şey için resmen talep etmek veya bir şeyi belirli bir duruma, amaca veya yere kullanmak.",examples:"1. You should apply for that job. (O işe başvurmalısın.) 2. Apply the rules fairly. (Kuralları adil bir şekilde uygula.) 3. Apply the cream twice a day. (Kremi günde iki kez sürün.)"},{word:"appointment",type:"İsim",meaning:"1. Randevu. 2. Atama, tayin (iş). 3. Görevlendirilmiş pozisyon.",guide:"Birisiyle buluşmak için kararlaştırılan zaman veya birine bir iş verilmesi.",examples:"1. I have a dentist appointment at 3 PM. (Saat 3'te dişçi randevum var.) 2. His appointment as manager was announced today. (Onun müdür olarak atanması bugün duyuruldu.)"},{word:"appreciate",type:"Fiil",meaning:"1. Takdir etmek, değerini bilmek. 2. Minnettar olmak, teşekkür etmek. 3. (Değer) artmak, yükselmek.",guide:"Bir şeyin değerini veya birinin iyiliğini anlamak ve ona göre davranmak.",examples:"1. I really appreciate your help. (Yardımını gerçekten takdir ediyorum.) 2. We would appreciate it if you could reply soon. (Yakında cevap verebilirseniz minnettar oluruz.) 3. Property values have appreciated recently. (Emlak değerleri son zamanlarda arttı.)"},{word:"approach",type:"Fiil/İsim",meaning:"1. Yaklaşmak (fiil). 2. Yaklaşım, yöntem (isim). 3. Başvurmak, görüşmek (fiil).",guide:"Fiziksel olarak yakınlaşmak veya bir soruna nasıl yaklaşıldığı.",examples:"1. The train is approaching the station. (Tren istasyona yaklaşıyor.) 2. We need a new approach to this problem. (Bu soruna yeni bir yaklaşıma ihtiyacımız var.) 3. He was approached about the job. (O, iş hakkında görüşülmek üzere arandı.)"},{word:"appropriate",type:"Sıfat/Fiil",meaning:"1. Uygun, yerinde (sıfat). 2. El koymak, tahsis etmek (fiil). 3. (Para) ayırmak.",guide:"Belirli bir durum, kişi veya yer için doğru veya uygun olan.",examples:"1. Casual clothes are not appropriate for a wedding. (Gündelik kıyafetler bir düğün için uygun değildir.) 2. The government appropriated funds for education. (Hükümet eğitim için fon ayırdı.) 3. Please use appropriate language. (Lütfen uygun bir dil kullanın.)"},{word:"approval",type:"İsim",meaning:"1. Onay, tasvip. 2. Beğeni. 3. (on approval) beğenilirse alınmak üzere.",guide:"Bir şeyin kabul edilebilir veya yeterli bulunması.",examples:"1. We need your approval to proceed. (İlerlemek için onayınıza ihtiyacımız var.) 2. He nodded in approval. (Onaylar şekilde başını salladı.) 3. The plan met with general approval. (Plan genel onayla karşılandı.)"},{word:"approve",type:"Fiil",meaning:"1. Onaylamak, uygun bulmak. 2. Beğenmek, tasvip etmek. 3. (approve of) -den hoşlanmak, onaylamak.",guide:"Resmi olarak kabul etmek veya olumlu bir görüş belirtmek.",examples:"1. The committee approved the proposal. (Komite öneriyi onayladı.) 2. I don't approve of smoking. (Sigara içmeyi onaylamıyorum.) 3. Do you approve of my new haircut? (Yeni saç kesimimi beğendin mi?)"},{word:"approximately",type:"Zarf",meaning:"1. Yaklaşık olarak, aşağı yukarı. 2. Tahminen.",guide:'Tam olmayan, ama çok yakın bir sayı veya miktarı belirtir. "About" ile benzerdir, biraz daha resmidir.',examples:"1. The journey takes approximately three hours. (Yolculuk yaklaşık üç saat sürer.) 2. It cost approximately £50. (Yaklaşık 50 sterline mal oldu.)"},{word:"April",type:"İsim",meaning:"1. Nisan (ay).",guide:"Yılın dördüncü ayı.",examples:"1. My birthday is in April. (Doğum günüm Nisan'da.) 2. April showers bring May flowers. (Nisan yağmurları Mayıs çiçeklerini getirir.)"},{word:"architect",type:"İsim",meaning:"1. Mimar. 2. Tasarlayan, planlayan kişi.",guide:"Binaları tasarlayan kişi. Mecazi olarak, bir sistemin veya fikrin yaratıcısı.",examples:"1. The architect presented the plans for the new house. (Mimar yeni evin planlarını sundu.) 2. He was the chief architect of the peace agreement. (Barış anlaşmasının baş mimarıydı.)"},{word:"architecture",type:"İsim",meaning:"1. Mimarlık. 2. Mimarî, yapı tarzı. 3. (Bilgisayar) mimari, yapı.",guide:"Binaları tasarlama ve inşa etme sanatı ve bilimi; veya bir şeyin temel yapısı.",examples:"1. She studied architecture at university. (Üniversitede mimarlık okudu.) 2. I love the architecture of old churches. (Eski kiliselerin mimarisini seviyorum.) 3. the architecture of a computer system (bir bilgisayar sisteminin mimarisi)"},{word:"area",type:"İsim",meaning:"1. Alan, bölge, saha. 2. Yüzölçümü. 3. Konu, alan (çalışma).",guide:"Belirli sınırları olan bir yer veya bir konu/faaliyet dalı.",examples:"1. There's a picnic area near the lake. (Gölün yakınında bir piknik alanı var.) 2. The area of the room is 20 square metres. (Odanın alanı 20 metrekaredir.) 3. Her main area of interest is history. (Onun ana ilgi alanı tarihtir.)"},{word:"argue",type:"Fiil",meaning:"1. Tartışmak, münakaşa etmek. 2. Savunmak, iddia etmek (fikir). 3. İkna etmeye çalışmak.",guide:"Fikir ayrılığı nedeniyle hararetle konuşmak veya bir fikri nedenleriyle savunmak.",examples:"1. They always argue about politics. (Onlar her zaman politika hakkında tartışırlar.) 2. He argued that taxes should be lowered. (Vergilerin düşürülmesi gerektiğini savundu.) 3. She argued him into changing his mind. (Onu fikrini değiştirmeye ikna etti.)"},{word:"argument",type:"İsim",meaning:"1. Tartışma, münakaşa. 2. Sav, kanıt, delil. 3. (for/against) lehte/aleyhte neden.",guide:"Fikir ayrılığından doğan sözlü çatışma veya bir iddiayı desteklemek için kullanılan mantıksal nedenler dizisi.",examples:"1. They had a big argument last night. (Dün gece büyük bir tartışmaları oldu.) 2. He presented a convincing argument. (İkna edici bir sav sundu.) 3. What are the arguments for and against the plan? (Plan lehinde ve aleyhindeki deliller nelerdir?)"},{word:"arise",type:"Fiil",meaning:"1. Ortaya çıkmak, doğmak. 2. (Sorun) çıkmak, belirmek. 3. (arise from) -den kaynaklanmak.",guide:"Özellikle bir sorun veya fırsat olarak meydana gelmek, ortaya çıkmak.",examples:"1. A new problem has arisen. (Yeni bir sorun ortaya çıktı.) 2. The opportunity arose to study abroad. (Yurtdışında okuma fırsatı doğdu.) 3. The conflict arose from a misunderstanding. (Çatışma bir yanlış anlamadan kaynaklandı.)"},{word:"arm",type:"İsim/Fiil",meaning:"1. Kol (isim). 2. Silahlandırmak (fiil). 3. Kolu (sandalye/koltuk).",guide:"Vücudun omuzdan ele kadar olan bölümü. Fiil olarak silah vermek anlamına gelir.",examples:"1. She broke her arm. (Kolunu kırdı.) 2. The country was arming for war. (Ülke savaş için silahlanıyordu.) 3. the arm of a chair (bir sandalyenin kolu)"},{word:"armed",type:"Sıfat",meaning:"1. Silahlı. 2. Donanımlı, hazırlıklı. 3. (Mücadele) silahlı.",guide:"Silah taşıyan veya bir şeyle donatılmış olan.",examples:"1. Armed police surrounded the building. (Silahlı polis binayı kuşattı.) 2. He entered the room armed with information. (Bilgiyle donanmış olarak odaya girdi.) 3. armed conflict (silahlı çatışma)"},{word:"arms",type:"İsim (çoğul)",meaning:"1. Silahlar. 2. Savaş, çatışma. 3. (Coat of arms) arma, hanedan arması.",guide:"Savaş araçları, ateşli silahlar.",examples:"1. The treaty aimed to limit the spread of arms. (Anlaşma, silahların yayılmasını sınırlamayı amaçlıyordu.) 2. They laid down their arms. (Silahlarını bıraktılar.)"},{word:"army",type:"İsim",meaning:"1. Ordu. 2. Kalabalık, büyük grup.",guide:"Bir ülkenin kara kuvvetleri. Mecazi olarak çok büyük bir grup.",examples:"1. He joined the army when he was eighteen. (On sekiz yaşındayken orduya katıldı.) 2. An army of volunteers helped clean up the park. (Bir ordu gönüllü parkı temizlemeye yardım etti.)"},{word:"around",type:"Edat/Zarf",meaning:"1. Etrafında, çevresinde (edat). 2. Yaklaşık, civarında (zarf). 3. Her yerde, etrafta (zarf).",guide:"Bir şeyin çevresindeki alanı veya yaklaşık bir zamanı/sayıyı ifade eder.",examples:"1. We sat around the table. (Masanın etrafında oturduk.) 2. It costs around $20. (Yaklaşık 20 dolara mal oluyor.) 3. Is there a bank around here? (Buralarda bir banka var mı?)"},{word:"arrange",type:"Fiil",meaning:"1. Düzenlemek, ayarlamak. 2. Planlamak, organize etmek. 3. (Müzik) düzenlemek, aranje etmek.",guide:"Bir şeyi belirli bir sıraya veya düzene koymak veya bir etkinliğin gerçekleşmesini sağlamak.",examples:"1. She arranged the flowers in a vase. (Çiçekleri bir vazoda düzenledi.) 2. Can you arrange a meeting for next week? (Gelecek hafta için bir toplantı ayarlayabilir misin?) 3. He arranged the song for piano. (Şarkıyı piyano için düzenledi.)"},{word:"arrangement",type:"İsim",meaning:"1. Düzenleme, tertip. 2. Plan, ayarlama. 3. Anlaşma, uzlaşma.",guide:"Düzenleme eylemi veya varılan plan/anlaşma.",examples:"1. The arrangement of furniture in the room. (Odadaki mobilyaların düzeni.) 2. We have an arrangement to share the costs. (Masrafları paylaşmak için bir anlaşmamız var.) 3. Travel arrangements have been made. (Seyahat düzenlemeleri yapıldı.)"},{word:"arrest",type:"Fiil/İsim",meaning:"1. Tutuklamak (fiil). 2. Durdurmak, engellemek (fiil). 3. Tutuklama (isim).",guide:"Polisin birini suç şüphesiyle gözaltına alması veya bir süreci durdurması.",examples:"1. The police arrested the suspect. (Polis şüpheliyi tutukladı.) 2. The new drug could arrest the spread of the disease. (Yeni ilaç hastalığın yayılmasını durdurabilir.) 3. He was placed under arrest. (Tutuklandı.)"},{word:"arrival",type:"İsim",meaning:"1. Varış, geliş. 2. Yeni gelen kişi/şey. 3. (Bebek) doğum.",guide:"Bir yere varma eylemi veya yeni gelen kişi/şey.",examples:"1. We apologize for the late arrival of the train. (Trenin geç varışı için özür dileriz.) 2. The new manager is a recent arrival. (Yeni müdür yakın zamanda geldi.) 3. on his arrival at the hotel (otele varışında)"},{word:"arrive",type:"Fiil",meaning:"1. Varmak, gelmek, ulaşmak. 2. (Zaman) gelmek. 3. (Başarı) elde etmek, varmak.",guide:"Bir yere ulaşmak, gelmek. Mecazi olarak bir hedefe ulaşmak.",examples:"1. What time does your flight arrive? (Uçuşunuz saat kaçta varıyor?) 2. The great day finally arrived. (O büyük gün nihayet geldi.) 3. He felt he had arrived when he got the promotion. (Terfiyi aldığında başarıya ulaştığını hissetti.)"},{word:"art",type:"İsim",meaning:"1. Sanat. 2. Beceri, hüner, ustalık. 3. (çoğul) beşeri bilimler.",guide:"Resim, heykel, müzik gibi yaratıcı ifade biçimleri veya bir işi yapma becerisi.",examples:"1. Modern art can be confusing. (Modern sanat kafa karıştırıcı olabilir.) 2. Cooking is an art. (Yemek pişirmek bir sanattır.) 3. She has a degree in arts. (Beşeri bilimlerde bir derecesi var.)"},{word:"article",type:"İsim",meaning:"1. Makale, yazı. 2. Madde, nesne, eşya. 3. (Dilbilgisi) tanımlık (the, a/an).",guide:"Gazete/dergide yayınlanan yazı; veya belirli bir nesne.",examples:"1. Did you read the article about climate change? (İklim değişikliği hakkındaki makaleyi okudun mu?) 2. She bought several articles of clothing. (Birkaç giysi eşyası satın aldı.) 3. the definite article (belirli tanımlık)"},{word:"artificial",type:"Sıfat",meaning:"1. Yapay, suni. 2. Sahte, yapmacık. 3. Yapma, insan yapımı.",guide:"Doğal olmayan, insanlar tarafından yapılmış olan. Duygular için samimiyetsiz anlamında da kullanılır.",examples:"1. This drink contains artificial sweeteners. (Bu içecek yapay tatlandırıcılar içerir.) 2. She had an artificial smile. (Yapmacık bir gülümsemesi vardı.) 3. an artificial lake (yapay bir göl)"},{word:"artist",type:"İsim",meaning:"1. Sanatçı (ressam, heykeltıraş vb.). 2. Usta, becerikli kişi.",guide:"Sanat eserleri yaratan kişi veya bir işte çok yetenekli olan kişi.",examples:"1. Van Gogh was a famous artist. (Van Gogh ünlü bir sanatçıydı.) 2. He's a real artist in the kitchen. (Mutfakta gerçek bir ustadır.)"},{word:"artistic",type:"Sıfat",meaning:"1. Sanatsal, artistik. 2. Yaratıcı, estetik. 3. Sanatla ilgili.",guide:"Sanata veya sanatçılara özgü olan; yaratıcı yeteneği olan.",examples:"1. She comes from a very artistic family. (O çok sanatsal bir aileden geliyor.) 2. He has an artistic temperament. (Sanatsal bir mizacı var.) 3. artistic expression (sanatsal ifade)"},{word:"as",type:"Bağlaç/Edat/Zarf",meaning:"1. Olarak, -ken (bağlaç). 2. Gibi, kadar (edat/bağlaç). 3. Çünkü, madem (bağlaç).",guide:"Benzerlik, zaman, neden veya rol belirtmek için kullanılan çok yönlü bir kelime.",examples:"1. He works as a teacher. (Öğretmen olarak çalışıyor.) 2. She is as tall as her brother. (O, erkek kardeşi kadar uzun.) 3. As you were out, I left a message. (Dışarıda olduğun için bir mesaj bıraktım.)"},{word:"ashamed",type:"Sıfat",meaning:"1. Utanmış, mahcup. 2. Utanç duymuş. 3. (ashamed of) -den utanmak.",guide:"Yaptığı veya başına gelen bir şeyden dolayı suçluluk ve utanç hissetme durumu.",examples:"1. I'm ashamed of my behaviour last night. (Dün geceki davranışımdan utandım.) 2. You should be ashamed of yourself! (Kendinden utanmalısın!) 3. He was ashamed to admit his mistake. (Hatâsını itiraf etmeye utandı.)"},{word:"ask",type:"Fiil",meaning:"1. Sormak. 2. Rica etmek, istemek. 3. Davet etmek.",guide:"Bir soru sormak veya bir şeyin yapılmasını istemek.",examples:"1. Can I ask you a question? (Sana bir soru sorabilir miyim?) 2. She asked for a glass of water. (Bir bardak su istedi.) 3. They've asked us to the wedding. (Bizi düğüne davet ettiler.)"},{word:"asleep",type:"Sıfat",meaning:"1. Uyuyan, uykuda. 2. Uyuşmuş, hissiz (kol/bacak). 3. (fall asleep) uykuya dalmak.",guide:'Uyku halinde olma durumu. "Sleeping" ile benzerdir, ama genellikle "be" veya "fall" fiilleriyle kullanılır.',examples:"1. The baby is asleep. (Bebek uyuyor.) 2. My foot is asleep. (Ayağım uyuşmuş.) 3. I fell asleep during the movie. (Film sırasında uyuyakaldım.)"},{word:"aspect",type:"İsim",meaning:"1. Yön, görünüş, açı. 2. Cephe, bakış (binaya). 3. (Dilbilgisi) zaman görünüşü.",guide:"Bir durum, fikir veya planın belirli bir yönü veya tarafı.",examples:"1. We need to consider every aspect of the problem. (Sorunun her yönünü düşünmemiz gerekiyor.) 2. The house has a southern aspect. (Evin güneye bakan bir cephesi var.) 3. an important aspect of learning a language (bir dil öğrenmenin önemli bir yönü)"},{word:"assess",type:"Fiil",meaning:"1. Değerlendirmek. 2. (Vergi) tarh etmek. 3. Tahmin etmek, kestirmek.",guide:"Bir şeyin niteliği, değeri veya miktarı hakkında bir yargıya varmak için dikkatlice incelemek.",examples:"1. The teacher will assess your writing skills. (Öğretmen yazma becerilerinizi değerlendirecek.) 2. They assessed the damage after the storm. (Fırtınadan sonra hasarı değerlendirdiler.) 3. It's difficult to assess the impact of the new law. (Yeni yasanın etkisini değerlendirmek zor.)"},{word:"assessment",type:"İsim",meaning:"1. Değerlendirme. 2. Tahmin, kestirme. 3. (Vergi) tarhiyat.",guide:"Değerlendirme eylemi veya bu eylemin sonucu.",examples:"1. The final assessment will be an exam. (Son değerlendirme bir sınav olacak.) 2. What's your assessment of the situation? (Durumla ilgili değerlendirmeniz nedir?) 3. a tax assessment (vergi tarhiyatı)"},{word:"assignment",type:"İsim",meaning:"1. Ödev, görev. 2. Atama, tayin. 3. Görevlendirme.",guide:"Özellikle okulda verilen bir iş veya birine verilen resmi görev.",examples:"1. I have a history assignment due tomorrow. (Yarın teslim etmem gereken bir tarih ödevim var.) 2. His latest assignment is in the sales department. (Onun son ataması satış departmanında.)"},{word:"assist",type:"Fiil",meaning:"1. Yardım etmek, destek olmak. 2. (Spor) asist yapmak.",guide:"Birine bir şeyi yapmasında yardımcı olmak, genellikle ikincil bir rol oynamak.",examples:"1. Can you assist me with this heavy box? (Bu ağır kutuda bana yardım eder misin?) 2. The nurse assisted the doctor during the operation. (Hemşire ameliyat sırasında doktora yardım etti.) 3. He assisted in the goal. (Golde asist yaptı.)"},{word:"assistant",type:"İsim/Sıfat",meaning:"1. Asistan, yardımcı (isim). 2. Yardımcı, muavin (sıfat).",guide:"Birine yardım eden kişi veya daha düşük seviyeli bir pozisyon.",examples:"1. She works as a shop assistant. (Bir mağaza asistanı olarak çalışıyor.) 2. He is the assistant manager. (O yardımcı müdürdür.)"},{word:"associate",type:"Fiil/İsim/Sıfat",meaning:"1. İlişkilendirmek, bağdaştırmak (fiil). 2. Ortak, iş arkadaşı (isim). 3. Yardımcı, alt (sıfat).",guide:"Zihinsel veya sosyal olarak bağlantı kurmak. İsim olarak iş ortağı veya meslektaş.",examples:"1. I associate the smell of rain with spring. (Yağmur kokusunu baharla ilişkilendiririm.) 2. He is a business associate of mine. (O benim bir iş ortağım.) 3. an associate professor (doçent)"},{word:"associated",type:"Sıfat",meaning:"1. İlişkili, bağlantılı. 2. İlgili, alakalı. 3. (be associated with) -ile ilişkili olmak.",guide:"Bir şeyle bağlantısı veya ilişkisi olan.",examples:"1. The risks associated with smoking are well known. (Sigara içmeyle ilişkili riskler iyi bilinmektedir.) 2. the associated costs (ilişkili maliyetler)"},{word:"association",type:"İsim",meaning:"1. Dernek, birlik. 2. İlişki, bağlantı. 3. Çağrışım.",guide:"Resmi bir organizasyon veya iki şey arasındaki bağ.",examples:"1. He is a member of the residents' association. (O, site sakinleri derneğinin bir üyesi.) 2. There is a strong association between diet and health. (Diyet ve sağlık arasında güçlü bir ilişki vardır.) 3. The place holds happy associations for me. (Burası benim için mutlu çağrışımlar barındırıyor.)"},{word:"assume",type:"Fiil",meaning:"1. Varsaymak, farz etmek. 2. Üstlenmek (sorumluluk). 3. Takınmak (tavır).",guide:"Kanıt olmadan doğru olduğunu kabul etmek veya bir rol veya sorumluluğu almak.",examples:"1. I assume you've finished your work. (İşini bitirdiğini varsayıyorum.) 2. She will assume the role of director. (Müdür rolünü üstlenecek.) 3. He assumed an air of confidence. (Kendinden emin bir hava takındı.)"},{word:"at",type:"Edat",meaning:"1. -de, -da (konum). 2. -de, -da (zaman). 3. -e, -a (yön/hedef).",guide:"Kesin bir noktayı (yer, zaman, fiyat) belirtmek için kullanılan temel edat.",examples:"1. Meet me at the station. (Benimle istasyonda buluş.) 2. The movie starts at 7 o'clock. (Film saat 7'de başlıyor.) 3. Look at that! (Şuna bak!)"},{word:"athlete",type:"İsim",meaning:"1. Atlet, sporcu.",guide:"Atletizm veya başka bir spor dalında yarışan veya antrenman yapan kişi.",examples:"1. Olympic athletes train for years. (Olimpik sporcular yıllarca antrenman yapar.) 2. She is a talented athlete. (O yetenekli bir sporcu.)"},{word:"atmosphere",type:"İsim",meaning:"1. Atmosfer, hava küre. 2. Ortam, hava, atmosfer. 3. (Fizik) basınç birimi.",guide:"Dünyayı çevreleyen gaz tabakası veya bir yerin genel havası, duygusal çevre.",examples:"1. Pollution damages the atmosphere. (Kirlilik atmosfere zarar verir.) 2. The restaurant has a romantic atmosphere. (Restoranın romantik bir atmosferi var.) 3. There was a tense atmosphere in the room. (Odada gergin bir hava vardı.)"},{word:"attach",type:"Fiil",meaning:"1. İliştirmek, eklemek, takmak. 2. Bağlamak, tutturmak. 3. (Önem) atfetmek, vermek.",guide:"Bir şeyi başka bir şeye fiziksel olarak veya manen bağlamak.",examples:"1. Please attach your photo to the application form. (Lütfen fotoğrafınızı başvuru formuna iliştirin.) 2. I attach great importance to this meeting. (Bu toplantıya büyük önem veriyorum.) 3. The dog is attached to its owner. (Köpek sahibine bağlı.)"},{word:"attack",type:"İsim/Fiil",meaning:"1. Saldırmak, hücum etmek (fiil). 2. Saldırı, hücum (isim). 3. (Hastalık) nöbeti.",guide:"Fiziksel veya sözlü şiddetle karşı koymak; bir işe hevesle başlamak.",examples:"1. The dog attacked the intruder. (Köpek davetsiz misafire saldırdı.) 2. The country came under attack. (Ülke saldırı altına alındı.) 3. a heart attack (kalp krizi)"},{word:"attempt",type:"İsim/Fiil",meaning:"1. Girişim, teşebbüs (isim). 2. Denemek, teşebbüs etmek (fiil). 3. (Suikast) girişimi.",guide:"Bir şeyi başarmak için çaba göstermek, genellikle başarısız olma olasılığıyla birlikte.",examples:"1. This is my second attempt at learning the guitar. (Bu, gitar öğrenmek için ikinci girişimim.) 2. He attempted to climb the mountain. (Dağı tırmanmaya teşebbüs etti.) 3. an attempt on his life (ona yönelik bir suikast girişimi)"},{word:"attend",type:"Fiil",meaning:"1. Katılmak, iştirak etmek. 2. Devam etmek (okula). 3. (Hasta) bakmak, ilgilenmek.",guide:"Bir etkinlikte bulunmak veya birine/ihtiyaca bakmak.",examples:"1. Over 100 people attended the wedding. (100'den fazla kişi düğüne katıldı.) 2. Which school did you attend? (Hangi okula devam ettin?) 3. The nurse attended to the wounded. (Hemşire yaralılarla ilgilendi.)"},{word:"attention",type:"İsim",meaning:"1. Dikkat. 2. İlgi, alaka. 3. (Askeri) hazır ol.",guide:"Zihinsel odaklanma veya birine gösterilen ilgi.",examples:"1. Pay attention to what I'm saying. (Söylediklerime dikkat et.) 2. Her loud voice drew everyone's attention. (Yüksek sesi herkesin dikkatini çekti.) 3. The soldier stood at attention. (Asker hazır olda durdu.)"},{word:"attitude",type:"İsim",meaning:"1. Tavır, davranış, tutum. 2. Görüş, düşünce. 3. (Havacılık) duruş, meyil.",guide:"Bir kişi, olay veya konu hakkında düşünme, hissetme veya davranma şekli.",examples:"1. He has a very positive attitude. (Çok olumlu bir tutumu var.) 2. I don't like your attitude. (Tavrını beğenmiyorum.) 3. changing public attitudes towards recycling (geri dönüşüme karşı kamu tutumlarını değiştirmek)"},{word:"attract",type:"Fiil",meaning:"1. Çekmek, cezbetmek. 2. İlgi uyandırmak. 3. (Fizik) çekmek.",guide:"İlgi, beğeni veya fiziksel yakınlık yaratmak.",examples:"1. The city attracts millions of tourists every year. (Şehir her yıl milyonlarca turist çeker.) 2. He was attracted to her sense of humour. (Onun mizah anlayışından etkilendi.) 3. Opposite poles attract. (Zıt kutuplar birbirini çeker.)"},{word:"attraction",type:"İsim",meaning:"1. Cazibe, çekicilik. 2. Çekim, ilgi. 3. (Turistik) çekim merkezi.",guide:"Çeken şeyin niteliği veya çeken şeyin kendisi (turistik yer).",examples:"1. The main attraction of the job is the salary. (İşin başlıca cazibesi maaşıdır.) 2. There's a strong physical attraction between them. (Aralarında güçlü bir fiziksel çekim var.) 3. The castle is the town's biggest tourist attraction. (Kale, kasabanın en büyük turistik çekim merkezidir.)"},{word:"attractive",type:"Sıfat",meaning:"1. Çekici, alıml
