t öldürmek anlamına gelir.", "examples": "1. She listened to music while studying. (Ders çalışırken müzik dinledi.)\n2. I haven't seen him for a while. (Onu bir süredir görmedim.)\n3. We whiled away the afternoon playing cards. (Öğleden sonrayı iskambil oynayarak geçirdik.)", "rank": 134}, {"word": "world", "type": "İsim", "meaning": "1. Dünya, alem", "full_meaning": "1. Dünya, alem\n2. Dünya (insanlık/medeniyet) (isim)\n3. Çok, pek çok (a world of)", "guide": "Gezegenimiz veya üzerinde yaşayan canlılar ve medeniyet. Mecazi olarak, belirli bir alan veya çok fazla miktar anlamında kullanılır.", "examples": "1. They traveled around the world. (Dünyayı dolaştılar.)\n2. The ancient world is fascinating. (Antik dünya büyüleyicidir.)\n3. There's a world of difference between them. (Aralarında dünya kadar fark var.)", "rank": 135}, {"word": "each", "type": "Belirteç/Zamir", "meaning": "1. Her bir, her biri.", "full_meaning": "1. Her bir, her biri.\n2. (each other) Birbirini, birbirine.", "guide": "İki veya daha fazla sayıda olan şeylerin tek tek her birini vurgular. \"Each other\" karşılıklı ilişkiyi ifade eder.", "examples": "1. Each student received a certificate. (Her bir öğrenci bir sertifika aldı.)\n2. They love each other very much. (Birbirlerini çok seviyorlar.)", "rank": 136}, {"word": "state", "type": "İsim / Fiil / Sıfat", "meaning": "1. (İ) Durum, hal.", "full_meaning": "1. (İ) Durum, hal.\n2. (İ) Devlet, eyalet.\n3. (F) Beyan etmek, ifade etmek.", "guide": "Bir şeyin belirli bir zamandaki koşulları veya siyasi bir birim. Fiil olarak resmi olarak söylemek.", "examples": "1. The building is in a poor state. (Bina kötü bir durumda.)\n2. California is a state in the USA. (Kaliforniya ABD'de bir eyalettir.)\n3. Please state your name. (Lütfen adınızı söyleyin/belirtin.)", "rank": 137}, {"word": "manage", "type": "Fiil", "meaning": "1. İdare etmek, yönetmek.", "full_meaning": "1. İdare etmek, yönetmek.\n2. (Zor bir şeyi) başarmak, becermek, halletmek.\n3. (Zorlukla) idare etmek, geçinmek.", "guide": "Kontrol altında tutmak, sorumluluğunu almak veya bir zorluğun üstesinden gelmek anlamlarını taşır.", "examples": "1. She manages a team of twenty people. (Yirmi kişilik bir ekibi yönetiyor.)\n2. Did you manage to fix the computer? (Bilgisayarı tamir etmeyi başardın mı?)\n3. We have to manage with less money this month. (Bu ay daha az parayla idare etmek zorundayız.)", "rank": 138}, {"word": "home", "type": "İsim, Sıfat, Zarf", "meaning": "1. (İsim) Ev, yuva.", "full_meaning": "1. (İsim) Ev, yuva.\n2. (Sıfat) Ev ile ilgili.\n3. (Zarf) Eve, eve doğru.", "guide": "Yaşanılan yer, ailenin olduğu yer. Eve ait olan. Eve yönelik hareketi belirtir.", "examples": "1. There's no place like home. (Ev gibisi yoktur.) [İsim]\n2. What is your home address? (Ev adresiniz nedir?) [Sıfat]\n3. I'm going home now. (Şimdi eve gidiyorum.) [Zarf]", "rank": 139}, {"word": "however", "type": "Bağlaç, Zarf", "meaning": "1. Ancak, fakat, bununla birlikte.", "full_meaning": "1. Ancak, fakat, bununla birlikte.\n2. Ne kadar ... olursa olsun.\n3. Nasıl olursa olsun.", "guide": "Bir önceki cümleye zıt veya sınırlayıcı bir fikir getirir. Bir zarf veya sıfatın önüne gelerek \"her ne kadar\" anlamı verir.", "examples": "1. I'd like to go; however, I'm too busy. (Gitmek isterdim; ancak çok meşgulüm.)\n2. However hard he tries, he can't do it. (Ne kadar çok denerse denesin, yapamıyor.)\n3. However you do it, just get it done. (Nasıl yaparsan yap, sadece hallet.)", "rank": 140}, {"word": "might", "type": "Yardımcı Fiil / İsim", "meaning": "1. (Olasılık - daha düşük) -ebilir, -abilir (may'den daha zayıf).", "full_meaning": "1. (Olasılık - daha düşük) -ebilir, -abilir (may'den daha zayıf).\n2. (Geçmiş izin/olasılık) -ebilirdi.\n3. Güç, kuvvet.", "guide": "\"May\" yardımcı fiilinin geçmiş zaman hali gibi görünse de, genellikle daha düşük olasılık veya geçmişteki olasılık için kullanılır. İsim olarak \"güç\" demektir.", "examples": "1. It might rain, so take an umbrella. (Yağmur yağabilir, şemsiyeni al.)\n2. He said he might be late. (Geç kalabileceğini söyledi.)\n3. He pushed with all his might. (Tüm gücüyle itti.)", "rank": 141}, {"word": "another", "type": "Belirteç/Zamir", "meaning": "1. Bir başka, bir diğer.", "full_meaning": "1. Bir başka, bir diğer.\n2. Ek bir, fazladan bir.\n3. Farklı bir.", "guide": "Zaten var olandan farklı veya ek bir şeyi ifade eder.", "examples": "1. Would you like another cup of tea? (Bir bardak daha çay ister misiniz?)\n2. That's another matter entirely. (Bu tamamen farklı bir mesele.)\n3. We'll have to try another day. (Başka bir gün denemek zorunda kalacağız.)", "rank": 142}, {"word": "area", "type": "İsim", "meaning": "1. Alan, bölge, saha.", "full_meaning": "1. Alan, bölge, saha.\n2. Yüzölçümü.\n3. Konu, alan (çalışma).", "guide": "Belirli sınırları olan bir yer veya bir konu/faaliyet dalı.", "examples": "1. There's a picnic area near the lake. (Gölün yakınında bir piknik alanı var.)\n2. The area of the room is 20 square metres. (Odanın alanı 20 metrekaredir.)\n3. Her main area of interest is history. (Onun ana ilgi alanı tarihtir.)", "rank": 143}, {"word": "include", "type": "Fiil", "meaning": "1. İçermek, kapsamak.", "full_meaning": "1. İçermek, kapsamak.\n2. Dahil etmek, katmak.\n3. (Fiyata) Dahil olmak.", "guide": "Bir şeyi bir bütünün parçası olarak saymak. Birine veya bir şeye yer vermek. Bir fiyatın içinde olmak.", "examples": "1. Does the price include breakfast? (Fiyata kahvaltı dahil mi?)\n2. Please include me in your plans. (Lütfen beni planlarına dahil et.)\n3. Tax is included. (Vergi dahildir.)", "rank": 144}, {"word": "life", "type": "İsim", "meaning": "1. Yaşam, hayat.", "full_meaning": "1. Yaşam, hayat.\n2. Canlılık, hareketlilik.\n3. Ömür, yaşam süresi.", "guide": "İnsan, hayvan veya bitkinin doğumdan ölüme kadar olan varlığı. Bir şeyin var olma süresi veya enerjisi.", "examples": "1. Life is full of surprises. (Hayat sürprizlerle doludur.)\n2. The new manager brought life into the company. (Yeni müdür şirkete canlılık getirdi.)\n3. What do you want to do with your life? (Hayatınla ne yapmak istiyorsun?)", "rank": 145}, {"word": "ask", "type": "Fiil", "meaning": "1. Sormak.", "full_meaning": "1. Sormak.\n2. Rica etmek, istemek.\n3. Davet etmek.", "guide": "Bir soru sormak veya bir şeyin yapılmasını istemek.", "examples": "1. Can I ask you a question? (Sana bir soru sorabilir miyim?)\n2. She asked for a glass of water. (Bir bardak su istedi.)\n3. They've asked us to the wedding. (Bizi düğüne davet ettiler.)", "rank": 146}, {"word": "write", "type": "Fiil", "meaning": "1. Yazmak", "full_meaning": "1. Yazmak\n2. Mektup yazmak\n3. Bestelemek, yazmak (çek/sözleşme)", "guide": "Kalem, klavye vb. kullanarak kelimeler veya semboller oluşturmak. Birine mektup yazmak veya müzik/çek yazmak anlamına da gelir.", "examples": "1. Please write your name here. (Lütfen adınızı buraya yazın.)\n2. She writes in her journal every day. (Her gün günlüğüne yazar.)\n3. He wrote a letter to his friend. (Arkadaşına bir mektup yazdı.)", "rank": 147}, {"word": "help", "type": "Fiil, İsim", "meaning": "1. Yardım etmek.", "full_meaning": "1. Yardım etmek.\n2. (İsim) Yardım, imdat.\n3. (can't help) Kendini tutamamak, elinde olmamak.", "guide": "Birinin bir işi yapmasına katkıda bulunmak. Destek, asist. \"Can't help doing\" yapısı \"yapmaktan kendini alamamak\" anlamındadır.", "examples": "1. Can you help me carry this? (Bunu taşımama yardım eder misin?)\n2. Thank you for your help. (Yardımın için teşekkürler.)\n3. I can't help laughing when I see that. (Onu görünce gülmeden edemiyorum.)", "rank": 148}, {"word": "interest", "type": "İsim, Fiil", "meaning": "1. (İsim) İlgi, alaka.", "full_meaning": "1. (İsim) İlgi, alaka.\n2. (İsim) Faiz.\n3. (Fiil) İlgilendirmek, ilgisini çekmek.", "guide": "Bir şeye duyulan merak veya dikkat. Borç alınan paraya uygulanan ek ücret. İlgi uyandırmak.", "examples": "1. I have no interest in sports. (Spora hiç ilgim yok.)\n2. The bank charges high interest rates. (Banka yüksek faiz oranları uyguluyor.)\n3. Does this topic interest you? (Bu konu seni ilgilendiriyor mu?)", "rank": 149}, {"word": "hold", "type": "Fiil, İsim", "meaning": "1. Tutmak, elinde bulundurmak.", "full_meaning": "1. Tutmak, elinde bulundurmak.\n2. Düzenlemek, yapmak (toplantı).\n3. (İsim) Tutuş, kavrama.", "guide": "Bir şeyi elle veya kolla sıkıca bulundurmak. Bir etkinliğe ev sahipliği yapmak. Tutma şekli.", "examples": "1. Hold my hand, please. (Lütfen elimi tut.)\n2. The meeting will be held in the main hall. (Toplantı ana salonda yapılacak/düzenlenecek.)\n3. He has a strong hold. (Güçlü bir tutuşu var.)", "rank": 150}, {"word": "possible", "type": "Sıfat", "meaning": "1. Mümkün, olası.", "full_meaning": "1. Mümkün, olası.\n2. Makul, kabul edilebilir.\n3. En iyi, mümkün olan.", "guide": "Olabilir, gerçekleşebilir. Makul ölçüler içinde yapılabilir.", "examples": "1. Is it possible to finish by Friday? (Cuma gününe kadar bitirmek mümkün mü?)\n2. Come as soon as possible. (Mümkün olan en kısa sürede gel.)\n3. We had the best possible time. (Mümkün olan en iyi zamanı geçirdik.)", "rank": 151}, {"word": "again", "type": "Zarf", "meaning": "1. Tekrar, yeniden, bir daha.", "full_meaning": "1. Tekrar, yeniden, bir daha.\n2. Ayrıca, üstelik.\n3. (then again) Öte yandan.", "guide": "Bir kez daha, bir önceki duruma dönerek.", "examples": "1. Please say that again. (Lütfen onu tekrar söyle.)\n2. It's nice, but then again, it's expensive. (Güzel, ama öte yandan pahalı.)\n3. I won't do it again. (Bir daha yapmayacağım.)", "rank": 152}, {"word": "course", "type": "İsim", "meaning": "1. Kurs, ders.", "full_meaning": "1. Kurs, ders.\n2. Yol, rota.\n3. (Yemek) tabak, servis.", "guide": "Belirli bir konuda eğitim programı veya bir şeyin izlediği yol.", "examples": "1. I'm taking a French course. (Bir Fransızca kursuna gidiyorum.)\n2. The plane changed course. (Uçak rotasını değiştirdi.)\n3. a three-course meal (üç çeşit yemek)", "rank": 153}, {"word": "pay", "type": "Fiil/İsim", "meaning": "1. (Fiil) Ödemek (para).", "full_meaning": "1. (Fiil) Ödemek (para).\n2. (Fiil) Fayda sağlamak, değmek.\n3. (İsim) Maaş, ücret.", "guide": "Para vermek karşılığında bir şey almak veya borç kapatmak. Mecazi olarak \"karşılığını vermek\". İsim olarak alınan para.", "examples": "1. (Fiil) I need to pay the electricity bill. (Elektrik faturasını ödemem gerekiyor.)\n2. (Fiil) It pays to be honest in the long run. (Uzun vadede dürüst olmak kârlı çıkar.)\n3. (İsim) The pay is good, but the hours are long. (Maaş iyi ama çalışma saatleri uzun.)", "rank": 154}, {"word": "problem", "type": "İsim", "meaning": "1. Sorun, problem.", "full_meaning": "1. Sorun, problem.\n2. Matematik sorusu.\n3. (Argo) Sorunlu kişi/şey.", "guide": "Çözülmesi gereken güçlük veya istenmeyen durum. Okulda çözülen alıştırma sorusu.", "examples": "1. We have a problem with the car. (Arabayla ilgili bir sorunumuz var.)\n2. Can you help me with this math problem? (Bu matematik sorusunda bana yardım edebilir misin?)\n3. That guy is nothing but trouble – a real problem. (O adam baş belasından başka bir şey değil – gerçek bir sorun.)", "rank": 155}, {"word": "service", "type": "İsim", "meaning": "1. Hizmet.", "full_meaning": "1. Hizmet.\n2. Servis, bakım.\n3. Dini ayin.", "guide": "İhtiyaçları karşılamak için yapılan iş veya faaliyet.", "examples": "1. The customer service is excellent. (Müşteri hizmetleri mükemmel.)\n2. My car needs a service. (Arabamın bakıma/servise ihtiyacı var.)\n3. We attended the morning service. (Sabah ayinine katıldık.)", "rank": 156}, {"word": "relate", "type": "Fiil", "meaning": "1. İlişkilendirmek, bağlantı kurmak.", "full_meaning": "1. İlişkilendirmek, bağlantı kurmak.\n2. Anlatmak, aktarmak.\n3. Anlayış göstermek, iyi geçinmek.", "guide": "İki şey arasında bağlantı kurmak veya bir hikaye anlatmak.", "examples": "1. \"It's difficult to relate these two events.\" (Bu iki olayı ilişkilendirmek zor.)\n2. \"He related the story of his adventures.\" (Maceralarının hikayesini anlattı.)\n3. \"I find it hard to relate to people who are much younger.\" (Benden çok genç insanlarla anlaşmakta zorlanıyorum.)", "rank": 157}, {"word": "report", "type": "Fiil / İsim", "meaning": "1. (Fiil) Bildirmek, rapor etmek.", "full_meaning": "1. (Fiil) Bildirmek, rapor etmek.\n2. (Fiil) Şikayet etmek.\n3. (İsim) Rapor, haber.", "guide": "Bir şey hakkında resmi veya resmi olmayan bilgi vermek veya bu bilginin yazılı/sözlü hali.", "examples": "1. \"Report any problems to the supervisor.\" (Herhangi bir sorunu amire bildirin.)\n2. \"I'll report you to the teacher!\" (Seni öğretmene şikayet edeceğim!)\n3. \"Did you read the financial report?\" (Finansal raporu okudun mu?)", "rank": 158}, {"word": "large", "type": "Sıfat", "meaning": "1. Büyük, geniş.", "full_meaning": "1. Büyük, geniş.\n2. Kapsamlı, kapsayıcı.\n3. (Giysi) Büyük beden.", "guide": "Fiziksel boyut veya miktar olarak ortalamanın üzerinde olan.", "examples": "1. They live in a large house. (Büyük bir evde yaşıyorlar.)\n2. A large number of people attended the concert. (Konsere çok sayıda insan katıldı.)\n3. Do you have this shirt in a large? (Bu gömleğin büyük bedeni var mı?)", "rank": 159}, {"word": "provide", "type": "Fiil", "meaning": "1. Sağlamak, temin etmek.", "full_meaning": "1. Sağlamak, temin etmek.\n2. (İhtiyaçları) karşılamak, geçindirmek.\n3. Şart koşmak, hükme bağlamak.", "guide": "Birine veya bir şeye gerekli olan bir şeyi vermek. Bir aileyi geçindirmek. Yasa veya sözleşmede belirtmek.", "examples": "1. The hotel provides free Wi-Fi. (Otel ücretsiz Wi-Fi sağlar.)\n2. He has to provide for his family. (Ailesini geçindirmek zorunda.)\n3. The contract provides that payments must be made on time. (Sözleşme, ödemelerin zamanında yapılması gerektiğini hükme bağlar.)", "rank": 160}, {"word": "form", "type": "İsim/Fiil", "meaning": "1. Form, şekil (isim).", "full_meaning": "1. Form, şekil (isim).\n2. Form, belge (isim).\n3. Oluşturmak, biçim vermek (fiil).", "guide": "Bir şeyin dış görünüşü veya yapısı. Doldurulacak resmi belge. Varlığa getirmek veya bir şeyin parçası olmak.", "examples": "1. The sculpture has an interesting form. (Heykelin ilginç bir şekli var.)\n2. Please fill out this application form. (Lütfen bu başvuru formunu doldurun.)\n3. Clouds began to form in the sky. (Gökyüzünde bulutlar oluşmaya başladı.)", "rank": 161}, {"word": "against", "type": "Edat", "meaning": "1. Karşı, aleyhinde.", "full_meaning": "1. Karşı, aleyhinde.\n2. -e dayalı, -e yaslanmış.\n3. -e karşı (mücadele).", "guide": "Karşıtlık, direnç veya fiziksel teması ifade eder.", "examples": "1. I'm against the new policy. (Yeni politikaya karşıyım.)\n2. He leaned against the wall. (Duvara yaslandı.)\n3. We played against a strong team. (Güçlü bir takıma karşı oynadık.)", "rank": 162}, {"word": "try", "type": "Fiil / İsim", "meaning": "Fiil: 1. Denemek, çabalamak.", "full_meaning": "Fiil: 1. Denemek, çabalamak.\n2. (Hukuk) Yargılamak.\n3. Tadına bakmak, test etmek.\nİsim: 4. Deneme, teşebbüs.", "guide": "Bir şeyi yapmayı veya başarmayı denemek.", "examples": "1. Try to be on time. (Zamanında olmaya çalış.)\n2. Try this cake; it's delicious. (Bu pastanın tadına bak; çok lezzetli.)\n3. He was tried for murder. (Cinayetten yargılandı.)", "rank": 163}, {"word": "open", "type": "Sıfat / Fiil", "meaning": "1. Açık.", "full_meaning": "1. Açık.\n2. Açmak.\n3. Dürüst, şeffaf.", "guide": "Kapalı olmayan, erişilebilir olan. Fiil olarak bir şeyi açma eylemi.", "examples": "1. The door is open. (Kapı açık.)\n2. Open the window, please. (Pencereyi açın lütfen.)\n3. Let's have an open discussion. (Açık bir tartışma yapalım.)", "rank": 164}, {"word": "meet", "type": "Fiil", "meaning": "1. Buluşmak, görüşmek.", "full_meaning": "1. Buluşmak, görüşmek.\n2. Tanışmak, ilk kez karşılaşmak.\n3. (Bir gerekliliği) karşılamak, yerine getirmek.", "guide": "Bir araya gelmek veya karşılaşmak anlamındadır. Ayrıca bir ihtiyacı veya standardı sağlamak için de kullanılır.", "examples": "1. Let's meet at the cinema at 7. (Saat 7'de sinemada buluşalım.)\n2. Nice to meet you! (Tanıştığımıza memnun oldum!)\n3. Does this meet your requirements? (Bu sizin gereksinimlerinizi karşılıyor mu?)", "rank": 165}, {"word": "school", "type": "İsim", "meaning": "1. Okul.", "full_meaning": "1. Okul.\n2. Ekol, akım (düşünce).\n3. Balık sürüsü.", "guide": "Eğitim kurumu. Mecazi olarak belirli bir düşünce veya sanat tarzını takip eden grup.", "examples": "1. My children go to school here. (Çocuklarım burada okula gidiyor.)\n2. He belongs to the impressionist school. (O, izlenimci ekole mensuptur.)\n3. A school of fish swam by. (Bir sürü balık yanından geçti.)", "rank": 166}, {"word": "general", "type": "Sıfat, İsim", "meaning": "1. (Sıfat) Genel, yaygın.", "full_meaning": "1. (Sıfat) Genel, yaygın.\n2. (Sıfat) Ayrıntılı olmayan, ana hatları olan.\n3. (İsim) General (ordu).", "guide": "Belirli bir şeye değil, bütüne, çoğunluğa veya ana fikre ait olan. Askeri rütbe olarak da kullanılır.", "examples": "1. That's a general problem, not just ours. (Bu genel bir sorun, sadece bizim değil.)\n2. Can you give me a general idea of the plan? (Bana planla ilgili genel bir fikir verebilir misin?)\n3. He was promoted to the rank of general. (General rütbesine terfi ettirildi.)", "rank": 167}, {"word": "turn", "type": "Fiil / İsim", "meaning": "Fiil: 1. Dönmek, çevirmek.", "full_meaning": "Fiil: 1. Dönmek, çevirmek.\n2. Olmak, dönüşmek.\n3. Sırası gelmek.\nİsim: 4. Dönüş, dönemeç.\n5. Sıra.", "guide": "Yön değiştirme eylemi veya bir durumdan başka bir duruma geçme.", "examples": "1. Turn left at the traffic lights. (Trafik ışıklarında sola dön.)\n2. The leaves turn red in autumn. (Yapraklar sonbaharda kırmızıya döner.)\n3. It's your turn to wash the dishes. (Bulaşıkları yıkama sırası sende.)", "rank": 168}, {"word": "party", "type": "İsim", "meaning": "1. Parti, eğlence.", "full_meaning": "1. Parti, eğlence.\n2. Siyasi parti.\n3. (Hukuk) taraf.", "guide": "En yaygın anlamı kutlama veya sosyal buluşma amaçlı toplantı. Siyasi organizasyon ve hukuki anlaşmazlıktaki kişiler için de kullanılır.", "examples": "1. We're having a birthday party on Saturday. (Cumartesi doğum günü partisi veriyoruz.)\n2. Which political party do you support? (Hangi siyasi partiyi destekliyorsun?)\n3. Both parties signed the contract. (İki taraf da sözleşmeyi imzaladı.)", "rank": 169}, {"word": "run", "type": "Fiil / İsim", "meaning": "1. (Fiil) Koşmak.", "full_meaning": "1. (Fiil) Koşmak.\n2. (Fiil) İşletmek, yönetmek (iş).\n3. (İsim) Koşu, kaçamak.", "guide": "Ayakları hızlı hareket ettirerek ilerlemek veya bir organizasyonun sorumluluğunu üstlenmek.", "examples": "1. \"I run every morning.\" (Her sabah koşarım.)\n2. \"She runs a small business.\" (Küçük bir işletme işletiyor.)\n3. \"Let's go for a run.\" (Hadi bir koşuya çıkalım.)", "rank": 170}, {"word": "per", "type": "Edat", "meaning": "1. -başına, her bir... için.", "full_meaning": "1. -başına, her bir... için.\n2. ...yoluyla, vasıtasıyla.\n3. ...göre, uygun olarak.", "guide": "Oran, fiyat veya dağıtım ifade ederken kullanılır. \"Her\" anlamı verir.", "examples": "1. The cost is $10 per person. (Maliyet kişi başına 10 dolardır.)\n2. I sent the document per email. (Belgeyi e-posta yoluyla gönderdim.)\n3. As per our agreement, payment is due today. (Anlaşmamıza göre, ödeme bugün son gün.)", "rank": 171}, {"word": "nation", "type": "İsim", "meaning": "1. Ulus, millet.", "full_meaning": "1. Ulus, millet.\n2. Ülke.\n3. Halk, topluluk.", "guide": "Ortak bir dil, tarih, kültür veya toprakla bağlı büyük insan topluluğu.", "examples": "1. The president spoke to the nation. (Başkan ulusa hitap etti.)\n2. The United Nations has many member nations. (Birleşmiş Milletler'in birçok üye ülkesi var.)", "rank": 172}, {"word": "member", "type": "İsim", "meaning": "1. Üye.", "full_meaning": "1. Üye.\n2. Uzv, organ (vücut).\n3. (Yapı) parçası, eleman.", "guide": "Bir grup, kulüp veya organizasyona dahil olan kişi. Ayrıca bir bütünün parçası.", "examples": "1. He is a member of the football club. (O, futbol kulübünün bir üyesidir.)\n2. Exercise every member of your body. (Vücudunun her uzvunu çalıştır.)", "rank": 173}, {"word": "never", "type": "Edat/Zarf", "meaning": "1. Asla, hiçbir zaman.", "full_meaning": "1. Asla, hiçbir zaman.\n2. Kesinlikle hayır.\n3. (Hiç) ...-mez/-maz (vurgu için).", "guide": "Geçmişte, şu anda veya gelecekte hiçbir zaman olmama durumu. Çok güçlü bir olumsuzluk ifadesidir.", "examples": "1. I have never been to Paris. (Hiç Paris'te bulunmadım.)\n2. \"Will you tell him?\" \"Never!\" (\"Ona söyler misin?\" \"Asla!\")\n3. He never so much as apologized. (Özür bile dilemedi.)", "rank": 174}, {"word": "small", "type": "Sıfat", "meaning": "1. Küçük.", "full_meaning": "1. Küçük.\n2. Ufak, az.\n3. Önemsiz, küçük (sorun).", "guide": "Boyut veya miktar olarak normalden veya ortalamadan daha az olan.", "examples": "1. A small dog. (Küçük bir köpek.)\n2. A small amount of sugar. (Az miktarda şeker.)\n3. It's a small problem. (Küçük bir sorun.)", "rank": 175}, {"word": "build", "type": "Fiil/İsim", "meaning": "1. İnşa etmek, yapmak (fiil).", "full_meaning": "1. İnşa etmek, yapmak (fiil).\n2. Vücut yapısı, bünye (isim).\n3. (up) artırmak, güçlendirmek.", "guide": "Bir şeyi parçaları bir araya getirerek oluşturmak.", "examples": "1. They plan to build a new school. (Yeni bir okul inşa etmeyi planlıyorlar.)\n2. He has a strong build. (Güçlü bir vücut yapısı var.)\n3. Tension is building. (Gerginlik artıyor.)", "rank": 176}, {"word": "start", "type": "Fiil / İsim", "meaning": "1. (F) Başlamak.", "full_meaning": "1. (F) Başlamak.\n2. (F) (Motoru) Çalıştırmak.\n3. (İ) Başlangıç.", "guide": "Bir şeyin ilk bölümünü yapmak veya bir hareketi başlatmak.", "examples": "1. Let's start the meeting. (Toplantıyı başlatalım.)\n2. The car won't start. (Araba çalışmıyor.)\n3. It was a good start. (İyi bir başlangıçtı.)", "rank": 177}, {"word": "early", "type": "Zarf/Sıfat", "meaning": "1. Erken (zarf).", "full_meaning": "1. Erken (zarf).\n2. Erken, ilk (sıfat).\n3. Sabah, günün ilk saatleri.", "guide": "Planlanan, beklenen veya normal zamandan önce. Bir dönemin başlangıcına yakın.", "examples": "1. I woke up early today. (Bugün erken uyandım.)\n2. in the early morning (sabahın erken saatlerinde)\n3. the early 1990s (1990'ların başı)", "rank": 178}, {"word": "keep", "type": "Fiil", "meaning": "1. Tutmak, saklamak, elinde bulundurmak.", "full_meaning": "1. Tutmak, saklamak, elinde bulundurmak.\n2. Devam ettirmek, sürdürmek.\n3. (Bir şeyi bir yerde/ durumda) Korumak.", "guide": "Sahip olmaya devam etmek, elden çıkarmamak. Bir eylemi veya durumu sürdürmek.", "examples": "1. You can keep the change. (Üstü kalsın.)\n2. Keep walking until you see the post office. (Postaneyi görene kadar yürümeye devam et.)\n3. It's hard to keep the house clean with kids. (Çocuklarla evi temiz tutmak zordur.)", "rank": 179}, {"word": "particular", "type": "Sıfat", "meaning": "1. Belirli, özel, belli bir.", "full_meaning": "1. Belirli, özel, belli bir.\n2. Titiz, seçici, ayrıntıcı.\n3. Olağandışı, dikkat çekici.", "guide": "Genellikle spesifik ve diğerlerinden ayrılan bir şeyi vurgular. İnsanlar için \"aşırı titiz\" anlamında da kullanılır.", "examples": "1. Is there a particular book you're looking for? (Aradığın belirli bir kitap var mı?)\n2. He's very particular about his food. (Yemek konusunda çok titizdir.)\n3. There was nothing particular about that day. (O gün dikkat çekici hiçbir şey yoktu.)", "rank": 180}, {"word": "week", "type": "İsim", "meaning": "1. Hafta", "full_meaning": "1. Hafta\n2. Çalışma haftası (Pazartesi-Cuma)", "guide": "Yedi günden oluşan zaman dilimi. Çoğunlukla Pazartesi'den Pazar'a olan süre veya çalışma günlerini ifade eder.", "examples": "1. There are 52 weeks in a year. (Bir yılda 52 hafta vardır.)\n2. I'll see you next week. (Gelecek hafta görüşürüz.)\n3. I work a 40-hour week. (40 saatlik bir hafta çalışıyorum.)", "rank": 181}, {"word": "begin", "type": "Fiil", "meaning": "1. Başlamak.", "full_meaning": "1. Başlamak.\n2. Ortaya çıkmak.\n3. (To begin with) ilk olarak, öncelikle.", "guide": "Bir şeyi yapmaya veya olmaya başlamak. \"Start\" ile benzerdir.", "examples": "1. The concert begins at eight. (Konser sekizde başlıyor.)\n2. Where shall I begin? (Nereden başlayayım?)\n3. To begin with, we need more money. (İlk olarak, daha fazla paraya ihtiyacımız var.)", "rank": 182}, {"word": "head", "type": "İsim, Fiil", "meaning": "1. Baş, kafa.", "full_meaning": "1. Baş, kafa.\n2. Lider, şef.\n3. (Fiil) -e doğru gitmek, yönelmek.", "guide": "Vücudun üst kısmı. Bir kuruluşun en üst düzey yöneticisi. Fiil olarak belirli bir yöne gitmek.", "examples": "1. She has a pain in her head. (Başı ağrıyor.)\n2. She is the head of the department. (O bölümün şefidir.)\n3. We're heading home now. (Şimdi eve gidiyoruz.)", "rank": 183}, {"word": "local", "type": "Sıfat / İsim", "meaning": "1. Yerel, mahalli.", "full_meaning": "1. Yerel, mahalli.\n2. (İsim) Yerli, yöre sakini.\n3. Yerel pub/bar.", "guide": "Belirli bir bölge veya komşulukla sınırlı olan. O bölgede yaşayan kişi.", "examples": "1. I read the local newspaper. (Yerel gazeteyi okuyorum.)\n2. The locals are very friendly to tourists. (Yerliler turistlere çok dostane davranır.)\n3. Let's go for a pint at the local. (Hadi mahalledeki bara bir bardak bira içmeye gidelim.)", "rank": 184}, {"word": "person", "type": "İsim", "meaning": "1. Kişi, insan.", "full_meaning": "1. Kişi, insan.\n2. Birey.\n3. Vücut, beden.", "guide": "Bireysel bir insan. Ayrıca fiziksel varlık anlamında da kullanılır.", "examples": "1. She's a very kind person. (O çok kibar bir insan.)\n2. The right to vote belongs to each person. (Oy kullanma hakkı her bireye aittir.)\n3. He had a gun on his person. (Üzerinde (bedeninde) bir silahı vardı.)", "rank": 185}, {"word": "win", "type": "Fiil, İsim", "meaning": "1. Kazanmak (fiil)", "full_meaning": "1. Kazanmak (fiil)\n2. Galibiyet, zafer (isim)\n3. Kazanmak (desteğini/özlemini) (fiil)", "guide": "Bir yarışma, savaş veya mücadelede galip gelmek. Ayrıca, birinin sevgisini veya desteğini kazanmak anlamında da kullanılır.", "examples": "1. Which team do you think will win? (Hangi takımın kazanacağını düşünüyorsun?)\n2. Our team had three wins this season. (Takımımızın bu sezon üç galibiyeti var.)\n3. Her speech won the hearts of the audience. (Konuşması seyircilerin kalbini kazandı.)", "rank": 186}, {"word": "different", "type": "Sıfat", "meaning": "1. Farklı, başka.", "full_meaning": "1. Farklı, başka.\n2. Çeşitli, değişik.\n3. Alışılmadık, tuhaf.", "guide": "Aynı olmayan, benzerlik göstermeyen. \"Different from/to/than\" kullanımları İngiliz İngilizcesi ve Amerikan İngilizcesinde değişiklik gösterir.", "examples": "1. She's very different from her sister. (Kız kardeşinden çok farklı.)\n2. They visited many different countries. (Birçok farklı ülkeyi ziyaret ettiler.)\n3. He's a bit different, but very nice. (Biraz farklı/tiptir ama çok iyidir.)", "rank": 187}, {"word": "since", "type": "Edat / Bağlaç / Zarf", "meaning": "1. (Edat) -den beri (zamanda).", "full_meaning": "1. (Edat) -den beri (zamanda).\n2. (Bağ.) -dığı için, mademki.\n3. (Zarf) O zamandan beri.", "guide": "Bir olayın başlangıç noktasını belirtir veya bir neden bildirir.", "examples": "1. I've lived here since 2010. (2010'dan beri burada yaşıyorum.)\n2. Since you're here, can you help me? (Madem buradasın, bana yardım eder misin?)\n3. He left and hasn't returned since. (Gitti ve o zamandan beri dönmedi.)", "rank": 188}, {"word": "power", "type": "İsim", "meaning": "1. Güç, iktidar.", "full_meaning": "1. Güç, iktidar.\n2. Enerji, elektrik.\n3. Yetki.", "guide": "Bir şeyi yapma veya kontrol etme kapasitesi veya yetkisi. Fiziksel enerji veya elektrik.", "examples": "1. He has the power to make decisions. (Karar verme yetkisi var.)\n2. The storm cut off the power. (Fırtına elektriği kesti.)\n3. The president was voted into power. (Başkan iktidara seçildi.)", "rank": 189}, {"word": "increase", "type": "Fiil, İsim", "meaning": "1. (Fiil) Artmak, çoğalmak.", "full_meaning": "1. (Fiil) Artmak, çoğalmak.\n2. (İsim) Artış, yükselme.\n3. (Fiil) Artırmak, yükseltmek.", "guide": "Miktar, sayı veya derece olarak büyümek. Artma eylemi veya miktarı. Bir şeyi artırmak.", "examples": "1. The population is increasing rapidly. (Nüfus hızla artıyor.)\n2. There has been a sharp increase in prices. (Fiyatlarda keskin bir artış oldu.)\n3. The company will increase salaries next year. (Şirket gelecek yıl maaşları artıracak.)", "rank": 190}, {"word": "why", "type": "Zarf, Ünlem, İsim", "meaning": "1. Neden? Niçin? (soru zarfı)", "full_meaning": "1. Neden? Niçin? (soru zarfı)\n2. -nın nedeni (göreceli zarf)\n3. Vay canına! (şaşkınlık) (ünlem)", "guide": "Bir eylemin veya durumun nedenini, amacını sormak veya açıklamak için kullanılır.", "examples": "1. Why are you crying? (Neden ağlıyorsun?)\n2. That is the reason why I left early. (Erken ayrılmamın nedeni işte budur.)\n3. Why, I didn't expect to see you here! (Vay canına, seni burada görmeyi beklemiyordum!)", "rank": 191}, {"word": "country", "type": "İsim", "meaning": "1. Ülke, memleket.", "full_meaning": "1. Ülke, memleket.\n2. Kırsal, taşra.\n3. (Müzik türü) country.", "guide": "Bir ulusun toprakları veya şehir dışındaki kırsal alan.", "examples": "1. Which country are you from? (Hangi ülkedensiniz?)\n2. We live in the country. (Kırsalda yaşıyoruz.)\n3. country music (country müzik)", "rank": 192}, {"word": "plan", "type": "İsim/Fiil", "meaning": "1. (İsim) Plan, tasarı.", "full_meaning": "1. (İsim) Plan, tasarı.\n2. (İsim) Kroki, çizim.\n3. (Fiil) Planlamak, tasarlamak.", "guide": "Gelecekteki bir eylem için düşünülmüş ayrıntılı program. Fiil olarak bu programı yapmak.", "examples": "1. What are your plans for the weekend? (Hafta sonu için planların ne?)\n2. The architect showed us the plans for the house. (Mimar bize evin planlarını gösterdi.)\n3. We're planning a trip to Italy. (İtalya'ya bir gezi planlıyoruz.)", "rank": 193}, {"word": "away", "type": "Zarf/Sıfat", "meaning": "1. Uzakta, uzak.", "full_meaning": "1. Uzakta, uzak.\n2. Dışarı, başka yerde.\n3. (Spor) deplasman.", "guide": "Bir yerden başka bir yerde olma veya bir mesafe kadar uzak olma durumu.", "examples": "1. He lives far away. (O uzakta yaşıyor.)\n2. She's away on business. (İş seyahatinde.)\n3. an away game (deplasman maçı)", "rank": 194}, {"word": "clear", "type": "Sıfat/Fiil/Zarf", "meaning": "1. Açık, net (sıfat).", "full_meaning": "1. Açık, net (sıfat).\n2. Temizlemek, açıklığa kavuşturmak (fiil).\n3. Açıkça (zarf).", "guide": "Anlaşılması veya görülmesi kolay olan. Fiil olarak engelleri kaldırmak.", "examples": "1. The instructions are very clear. (Talimatlar çok net.)\n2. Clear the table, please. (Masayı temizleyin lütfen.)\n3. The sky is clear. (Gökyüzü açık.)", "rank": 195}, {"word": "face", "type": "İsim/Fiil", "meaning": "1. Yüz, çehre (isim).", "full_meaning": "1. Yüz, çehre (isim).\n2. Yüzleşmek, karşı karşıya gelmek (fiil).\n3. (Bir şeyin) Ön yüzü, yüzey (isim).", "guide": "Bir insanın veya hayvanın başının ön kısmı. Zor bir durum veya kişiyle başa çıkmak zorunda kalmak. Bir nesnenin dış tarafı.", "examples": "1. She has a smiling face. (Gülen bir yüzü var.)\n2. We must face the truth. (Gerçeklerle yüzleşmeliyiz.)\n3. the face of a clock (bir saatin yüzü)", "rank": 196}, {"word": "add", "type": "Fiil", "meaning": "1. Eklemek, katmak, ilave etmek.", "full_meaning": "1. Eklemek, katmak, ilave etmek.\n2. (Matematik) toplamak.\n3. (add up) Anlam ifade etmek, mantıklı olmak.", "guide": "Bir şeye bir şey daha koymak veya söylemek.", "examples": "1. Add some salt to the soup. (Çorbaya biraz tuz ekle.)\n2. If you add 5 and 3, you get 8. (5 ile 3'ü toplarsan, 8 eder.)\n3. His story just doesn't add up. (Onun hikayesi bir türlü tutarlı gelmiyor.)", "rank": 197}, {"word": "left", "type": "Sıfat / İsim / Zarf", "meaning": "1. Sol, soldaki.", "full_meaning": "1. Sol, soldaki.\n2. Kalan, geriye kalan (past of leave).\n3. Sola, sola doğru.", "guide": "Vücudun kalbin olduğu tarafın ters yönü. \"Leave\" fiilinin geçmiş zamanı (bırakılmış).", "examples": "1. Write with your left hand. (Sol elinle yaz.)\n2. There's no milk left. (Hiç süt kalmadı.)\n3. Turn left at the traffic lights. (Trafik ışıklarında sola dönün.)", "rank": 198}, {"word": "able", "type": "Sıfat", "meaning": "1. Yapabilen, muktedir.", "full_meaning": "1. Yapabilen, muktedir.\n2. Yetenekli, becerikli.\n3. (be able to) -ebilmek (yeterlilik).", "guide": "Genellikle \"be able to\" yapısıyla, bir şeyi yapma gücüne veya fırsatına sahip olmak anlamında kullanılır. Tek başına \"yetkin\" anlamı da vardır.", "examples": "1. Will you be able to come to the meeting? (Toplantıya gelebilecek misin?)\n2. He is a very able surgeon. (O çok yetenekli bir cerrah.)\n3. After the repair, the car was able to start again. (Tamirdan sonra araba tekrar çalışabildi.)", "rank": 199}, {"word": "order", "type": "İsim / Fiil", "meaning": "1. Sipariş vermek, ısmarlamak.", "full_meaning": "1. Sipariş vermek, ısmarlamak.\n2. Düzen, tertip.\n3. Emir, talimat.\n4. Sıra, dizi.", "guide": "Bir şeyin istenmesi, bir düzen içinde olması veya bir yönergedir.", "examples": "1. I'd like to order a pizza. (Bir pizza sipariş etmek istiyorum.)\n2. Please keep your desk in order. (Lütfen masanızı düzenli tutun.)\n3. He gave the order to attack. (Saldırı emrini verdi.)\n4. List the items in alphabetical order. (Nesneleri alfabetik sırayla listeleyin.)", "rank": 200}, {"word": "term", "type": "İsim / Fiil", "meaning": "İsim: 1. Dönem, süre.", "full_meaning": "İsim: 1. Dönem, süre.\n2. Terim, ifade.\n3. Koşul, şart.\nFiil: 4. Adlandırmak, nitelemek.", "guide": "Belirli bir zaman dilimi, özel bir kelime veya anlaşmanın bir parçası. Fiil olarak, bir şekilde tanımlamak anlamına gelir.", "examples": "1. The school term ends in June. (Okul dönemi Haziran'da bitiyor.)\n2. \"Quantum\" is a scientific term. (\"Kuantum\" bilimsel bir terimdir.)\n3. We agreed to the terms of the contract. (Sözleşmenin koşullarını kabul ettik.)", "rank": 201}, {"word": "support", "type": "Fiil / İsim", "meaning": "1. (F) Desteklemek.", "full_meaning": "1. (F) Desteklemek.\n2. (İ) Destek, yardım.\n3. (F) Geçindirmek, bakmak.", "guide": "Bir şeyi veya birini fiziksel, duygusal veya finansal olarak ayakta tutmak.", "examples": "1. I support your decision. (Kararını destekliyorum.)\n2. Thank you for your support. (Desteğin için teşekkürler.)\n3. He has to support his family. (Ailesini geçindirmek zorunda.)", "rank": 202}, {"word": "really", "type": "Zarf", "meaning": "1. Gerçekten, hakikaten.", "full_meaning": "1. Gerçekten, hakikaten.\n2. Cidden, sahiden mi? (soru).\n3. Oldukça, epey.", "guide": "Bir şeyin doğruluğunu veya derecesini vurgulamak için kullanılır.", "examples": "1. \"I'm really tired.\" (Gerçekten yorgunum.)\n2. \"You're leaving? Really?\" (Gidiyor musun? Cidden mi?)\n3. \"It was a really good movie.\" (Oldukça iyi bir filmdi.)", "rank": 203}, {"word": "few", "type": "Sıfat/Zamir", "meaning": "1. Az, birkaç.", "full_meaning": "1. Az, birkaç.\n2. (a few) Birkaç, birkaç tane.\n3. (few and far between) Seyrek, nadir.", "guide": "Sayıca az, küçük bir miktar. \"A few\" olumlu bir miktar ifade eder (\"birkaç tane\"), \"few\" ise olumsuz (\"neredeyse hiç\").", "examples": "1. Few people understand this. (Bunu çok az kişi anlar.)\n2. I have a few friends coming over. (Üstüme gelecek birkaç arkadaşım var.)\n3. Such opportunities are few and far between. (Böyle fırsatlar çok nadirdir.)", "rank": 204}, {"word": "certain", "type": "Sıfat/Zamir", "meaning": "1. Kesin, emin.", "full_meaning": "1. Kesin, emin.\n2. Belirli, belli.\n3. (a certain) bir, birtakım.", "guide": "Kuşku duyulmayan veya belirli, ama tam olarak belirtilmeyen.", "examples": "1. I'm certain that I locked the door. (Kapıyı kilitlediğimden eminim.)\n2. To a certain extent, I agree. (Belli bir dereceye kadar katılıyorum.)\n3. a certain Mr. Smith (Bay Smith adında biri)", "rank": 205}, {"word": "six", "type": "Sayı / İsim", "meaning": "1. Altı.", "full_meaning": "1. Altı.\n2. Altılı, altı sayısı.\n3. (Kriket) Altı sayılık vuruş.", "guide": "Beşten sonra ve yediden önce gelen sayı.", "examples": "1. I have six apples. (Altı elmam var.)\n2. The child is six years old. (Çocuk altı yaşında.)\n3. He hit a six! (Bir altılık vuruş yaptı!)", "rank": 206}, {"word": "inform", "type": "Fiil", "meaning": "1. Bilgi vermek, haberdar etmek.", "full_meaning": "1. Bilgi vermek, haberdar etmek.\n2. (Resmi) Bildirmek, ihbar etmek.\n3. (inspire) Şekillendirmek, etkilemek.", "guide": "Birine bir şey hakkında bilgi vermek. Resmi olarak yetkililere bilgi vermek. Bir şeyin karakterini oluşturmak (daha çok 'informed' olarak).", "examples": "1. Please inform me of any changes. (Lütfen herhangi bir değişiklikten beni haberdar et.)\n2. He informed the police about the theft. (Hırsızlık hakkında polise bilgi verdi.)\n3. His decision was informed by years of experience. (Kararı yılların tecrübesiyle şekillendi.)", "rank": 207}, {"word": "within", "type": "Edat, Zarf", "meaning": "1. İçinde, dahilinde (zaman/mekan)", "full_meaning": "1. İçinde, dahilinde (zaman/mekan)\n2. İçeride, içerisinde (zarf)", "guide": "Belirli bir sınır, alan veya sürenin içinde anlamına gelir.", "examples": "1. You must finish within one hour. (Bir saat içinde bitirmelisin.)\n2. We live within the city limits. (Şehir sınırları içinde yaşıyoruz.)\n3. The answer lies within yourself. (Cevap kendi içinde yatıyor.)", "rank": 208}, {"word": "employ", "type": "Fiil", "meaning": "1. İşe almak, istihdam etmek.", "full_meaning": "1. İşe almak, istihdam etmek.\n2. Kullanmak, yararlanmak (yöntem/teknik).", "guide": "Birine para karşılığı iş vermek. Bir şeyi belirli bir amaç için kullanmak.", "examples": "1. The company employs over 500 people. (Şirket 500'den fazla kişiyi istihdam ediyor.)\n2. She employed various techniques to solve the problem. (Sorunu çözmek için çeşitli teknikler kullandı.)", "rank": 209}, {"word": "next", "type": "Sıfat / Edat/Zarf / İsim", "meaning": "1. Sıradaki, bir sonraki.", "full_meaning": "1. Sıradaki, bir sonraki.\n2. Yanındaki, bitişik.\n3. Gelecek (hafta, ay).\n4. Bir sonraki kişi/şey.", "guide": "Zaman veya sıra olarak en yakın olan. Mekan olarak hemen yanında olan.", "examples": "1. See you next week! (Gelecek hafta görüşürüz!)\n2. She sat next to me. (Yanıma oturdu.)\n3. Who's next? (Sırada kim var?)", "rank": 210}, {"word": "read", "type": "Fiil", "meaning": "1. Okumak.", "full_meaning": "1. Okumak.\n2. Anlamını çıkarmak, yorumlamak.\n3. (Göstergede) Yazmak, göstermek.", "guide": "Yazılı veya basılı materyalden bilgi almak veya bir şeyi belirli bir şekilde anlamlandırmak.", "examples": "1. \"I read a book every week.\" (Haftada bir kitap okurum.)\n2. \"I can read the disappointment on his face.\" (Yüzündeki hayal kırıklığını okuyabiliyorum.)\n3. \"The thermometer reads 30 degrees.\" (Termometre 30 derece gösteriyor.)", "rank": 211}, {"word": "word", "type": "İsim, Fiil", "meaning": "1. Kelime, söz (isim)", "full_meaning": "1. Kelime, söz (isim)\n2. Söz, vaad (isim)\n3. İfade etmek (fiil)", "guide": "Bir dilin temel anlam birimi. Ayrıca, bir vaadi, haberi veya kısa konuşmayı ifade eder. Fiil olarak, bir şeyi belirli bir biçimde söylemek anlamına gelir.", "examples": "1. What does this word mean? (Bu kelime ne anlama geliyor?)\n2. He gave me his word that he would come. (Geleceği konusunda bana söz verdi.)\n3. How should I word this email? (Bu e-postayı nasıl ifade etmeliyim?)", "rank": 212}, {"word": "without", "type": "Edat", "meaning": "1. -sız, -siz, olmadan", "full_meaning": "1. -sız, -siz, olmadan\n2. Dışında, hariç", "guide": "Bir şeyin yokluğu veya eksikliğini ifade eder.", "examples": "1. I can't live without music. (Müzik olmadan yaşayamam.)\n2. He left without saying goodbye. (Hoşça kal demeden ayrıldı.)\n3. Three days without food is a long time. (Üç gün yiyeceksiz kalmak uzun bir süredir.)", "rank": 213}, {"word": "always", "type": "Zarf", "meaning": "1. Her zaman, daima.", "full_meaning": "1. Her zaman, daima.\n2. Sürekli, durmadan (olumsuzda).\n3. (Can always) her halükarda yapabilmek.", "guide": "Her seferinde, hiç istisna olmadan veya sürekli olarak.", "examples": "1. The sun always rises in the east. (Güneş her zaman doğudan doğar.)\n2. He is always complaining. (O sürekli şikayet ediyor.)\n3. You can always stay with us. (Her halükarda bizde kalabilirsin.)", "rank": 214}, {"word": "politics", "type": "İsim (çoğul/tekil)", "meaning": "1. Siyaset, politika.", "full_meaning": "1. Siyaset, politika.\n2. Siyasi görüşler.\n3. (Örgüt içi) çıkar ilişkileri, oyunlar.", "guide": "Devleti yönetme sanatı veya bilimi. Kişinin siyasi düşünceleri. Herhangi bir gruptaki güç ilişkileri.", "examples": "1. He's studying politics at university. (Üniversitede siyaset bilimi okuyor.)\n2. I don't discuss politics with friends. (Arkadaşlarımla siyaset tartışmam.)\n3. Office politics can be very draining. (Ofis politikaları çok yorucu olabilir.)", "rank": 215}, {"word": "though", "type": "Bağlaç / Zarf", "meaning": "Bağlaç: 1. Rağmen, -sa da / -se de (karşıtlık).", "full_meaning": "Bağlaç: 1. Rağmen, -sa da / -se de (karşıtlık).\nZarf: 2. Yine de, ama, ancak (cümle sonunda).", "guide": "Bir zıtlık veya istisna belirtir. Cümle sonunda kullanıldığında daha günlük bir üslup katar.", "examples": "1. Though it was raining, we went for a walk. (Yağmur yağmasına rağmen yürüyüşe çıktık.)\n2. It's expensive. I want it, though. (Pahalı. Yine de istiyorum.)\n3. She's very kind, though a bit shy. (Çok kibar, ama biraz utangaç.)", "rank": 216}, {"word": "question", "type": "İsim / Fiil", "meaning": "1. (İsim) Soru.", "full_meaning": "1. (İsim) Soru.\n2. (İsim) Sorun, mesele, şüphe.\n3. (Fiil) Sormak, sorgulamak.", "guide": "Bilgi almak için sorulan ifade veya bir şeyin doğruluğundan şüphe duymak ve onu incelemek anlamına gelir.", "examples": "1. \"She asked a difficult question.\" (Zor bir soru sordu.)\n2. \"There's no question about his honesty.\" (Onun dürüstlüğü konusunda hiç şüphe yok.)\n3. \"The police questioned the witness.\" (Polis tanığı sorguladı.)", "rank": 217}, {"word": "social", "type": "Sıfat", "meaning": "1. Sosyal, toplumsal.", "full_meaning": "1. Sosyal, toplumsal.\n2. Toplulukçu, sosyal.\n3. Sosyal (medya).", "guide": "Toplum veya insanlar arasındaki etkileşimle ilgili olan.", "examples": "1. Social issues are important. (Sosyal konular önemlidir.)\n2. She has a busy social life. (Yoğun bir sosyal hayatı var.)\n3. Social media is everywhere. (Sosyal medya her yerde.)", "rank": 218}, {"word": "result", "type": "İsim / Fiil", "meaning": "1. (İsim) Sonuç, netice.", "full_meaning": "1. (İsim) Sonuç, netice.\n2. (İsim) Skor, derece.\n3. (Fiil) Sonuçlanmak, -e yol açmak.", "guide": "Bir eylem veya olayın sebep olduğu şey.", "examples": "1. \"What was the result of the test?\" (Testin sonucu neydi?)\n2. \"The football result was 2-1.\" (Futbol skoru 2-1'di.)\n3. \"Eating too much can result in weight gain.\" (Çok yemek kilo alımıyla sonuçlanabilir.)", "rank": 219}, {"word": "care", "type": "İsim/Fiil", "meaning": "1. Özen, dikkat (isim).", "full_meaning": "1. Özen, dikkat (isim).\n2. Bakım (isim).\n3. Umursamak, aldırmak (fiil).", "guide": "Dikkatli ve sorumlu olma hali veya bir şeye önem verme.", "examples": "1. Handle with care. (Dikkatle taşıyınız.)\n2. She is in need of medical care. (Tıbbi bakıma ihtiyacı var.)\n3. I don't care what you think. (Ne düşündüğün umurumda değil.)", "rank": 220}, {"word": "during", "type": "Edat", "meaning": "1. Boyunca, süresince.", "full_meaning": "1. Boyunca, süresince.\n2. Sırasında, esnasında.", "guide": "Belirli bir süre içinde, o süre devam ederken olan bir şeyi ifade eder.", "examples": "1. It rained during the night. (Gece boyunca yağmur yağdı.)\n2. He fell asleep during the movie. (Film sırasında uyuyakaldı.)", "rank": 221}, {"word": "around", "type": "Edat/Zarf", "meaning": "1. Etrafında, çevresinde (edat).", "full_meaning": "1. Etrafında, çevresinde (edat).\n2. Yaklaşık, civarında (zarf).\n3. Her yerde, etrafta (zarf).", "guide": "Bir şeyin çevresindeki alanı veya yaklaşık bir zamanı/sayıyı ifade eder.", "examples": "1. We sat around the table. (Masanın etrafında oturduk.)\n2. It costs around $20. (Yaklaşık 20 dolara mal oluyor.)\n3. Is there a bank around here? (Buralarda bir banka var mı?)", "rank": 222}, {"word": "market", "type": "İsim / Fiil", "meaning": "1. Pazar, çarşı.", "full_meaning": "1. Pazar, çarşı.\n2. Piyasa, talep.\n3. Pazarlamak, piyasaya sürmek.", "guide": "Mal alım satımının yapıldığı fiziksel yer veya ekonomik ortam. Fiil olarak bir ürünü satışa sunma sürecini ifade eder.", "examples": "1. We buy fresh vegetables from the local market. (Taze sebzeleri yerel pazardan alıyoruz.)\n2. There's a big market for electric cars. (Elektrikli arabalar için büyük bir piyasa var.)\n3. The company will market the product globally. (Şirket ürünü küresel olarak pazarlayacak.)", "rank": 223}, {"word": "example", "type": "İsim", "meaning": "1. Örnek.", "full_meaning": "1. Örnek.\n2. Örnek teşkil eden kişi/şey.\n3. (for example) Örneğin.", "guide": "Benzer şeyleri açıklamak veya göstermek için kullanılan tipik bir şey. Taklit edilmesi gereken model.", "examples": "1. Can you give me an example? (Bana bir örnek verebilir misin?)\n2. She is an example to us all. (O hepimiz için bir örnektir.)\n3. Many countries, for example Mexico and Japan, have volcanoes. (Birçok ülke, örneğin Meksika ve Japonya, yanardağlara sahiptir.)", "rank": 224}, {"word": "month", "type": "İsim", "meaning": "1. Ay (zaman birimi).", "full_meaning": "1. Ay (zaman birimi).\n2. Takvim ayı.\n3. Yaklaşık dört haftalık süre.", "guide": "Yılı oluşturan, yaklaşık 30 veya 31 günlük on iki zaman diliminden biri.", "examples": "1. I'll be on vacation next month. (Önümüzdeki ay tatilde olacağım.)\n2. January is the first month of the year. (Ocak yılın ilk ayıdır.)", "rank": 225}, {"word": "full", "type": "Sıfat", "meaning": "1. Dolu, tam.", "full_meaning": "1. Dolu, tam.\n2. Tam, bütün.\n3. Bol, geniş (giysi).", "guide": "İçinde boş yer kalmamış. Eksiksiz, tamamlanmış. Vücuda tam oturmayan.", "examples": "1. The glass is full of water. (Bardak su ile dolu.)\n2. in full view (tam görüş alanında)\n3. a full skirt (bol bir etek)", "rank": 226}, {"word": "economy", "type": "İsim", "meaning": "1. Ekonomi, iktisat.", "full_meaning": "1. Ekonomi, iktisat.\n2. Tasarruf, ekonomi.\n3. (Uçak) Ekonomi sınıfı.", "guide": "Bir bölge veya ülkenin mal ve hizmet üretim ve tüketim sistemi. Para, zaman veya kaynaklardan tasarruf etme.", "examples": "1. The global economy is growing. (Küresel ekonomi büyüyor.)\n2. We need to make some economies. (Biraz tasarruf yapmamız gerekiyor.)\n3. I'm flying economy class. (Ekonomi sınıfında uçuyorum.)", "rank": 227}, {"word": "although", "type": "Bağlaç", "meaning": "1. Rağmen, karşın, -mesine rağmen.", "full_meaning": "1. Rağmen, karşın, -mesine rağmen.\n2. Gerçi, her ne kadar.", "guide": "Zıt veya beklenmedik bir durumu tanıtmak için kullanılan bir zıtlık bağlacı. \"Though\" veya \"even though\" ile benzerdir.", "examples": "1. Although it was raining, we went for a walk. (Yağmur yağmasına rağmen yürüyüşe çıktık.)\n2. She accepted the job, although the salary was low. (Maaş düşük olmasına rağmen işi kabul etti.)", "rank": 228}, {"word": "control", "type": "İsim/Fiil", "meaning": "1. Kontrol, denetim (isim).", "full_meaning": "1. Kontrol, denetim (isim).\n2. Kontrol etmek, yönetmek (fiil).\n3. (Duygularını) kontrol etmek.", "guide": "Bir şeyi veya birini yönetme veya yönlendirme gücü.", "examples": "1. Who is in control here? (Burada kontrol kimde?)\n2. The government controls the price of bread. (Hükümet ekmek fiyatını kontrol ediyor.)\n3. control panel (kontrol paneli)", "rank": 229}, {"word": "bring", "type": "Fiil", "meaning": "1. Getirmek.", "full_meaning": "1. Getirmek.\n2. Neden olmak, yol açmak.\n3. (bring up) yetiştirmek, gündeme getirmek.", "guide": "Bir şeyi veya birini bulunduğun yere taşımak. \"Take\" (götürmek) ile karıştırılmamalıdır.", "examples": "1. Can you bring me a glass of water? (Bana bir bardak su getirir misin?)\n2. The news brought joy to everyone. (Haber herkese neşe getirdi.)\n3. She brought up three children on her own. (Üç çocuğu tek başına büyüttü.)", "rank": 230}, {"word": "family", "type": "İsim/Sıfat", "meaning": "1. Aile (isim).", "full_meaning": "1. Aile (isim).\n2. (Biyoloji) Familya (isim).\n3. Ailevi, aileye ait (sıfat).", "guide": "Anne, baba ve çocuklardan oluşan grup; akrabalar. Benzer organizmalar grubu. Aile ile ilgili.", "examples": "1. She comes from a large family. (Büyük bir aileden geliyor.)\n2. Lions belong to the cat family. (Aslanlar kedi familyasına aittir.)\n3. a family business (bir aile işletmesi)", "rank": 231}, {"word": "product", "type": "İsim", "meaning": "1. Ürün, mamül.", "full_meaning": "1. Ürün, mamül.\n2. Sonuç, eser.\n3. (Matematik) çarpım.", "guide": "Üretilmiş veya doğal olarak elde edilmiş şey. Bir sürecin sonucu.", "examples": "1. This is a new product from our company. (Bu, şirketimizin yeni bir ürünüdür.)\n2. His novels are the product of a vivid imagination. (Onun romanları canlı bir hayal gücünün ürünüdür.)\n3. The product of 5 and 6 is 30. (5 ve 6'nın çarpımı 30'dur.)", "rank": 232}, {"word": "side", "type": "İsim / Sıfat", "meaning": "1. (İ) Yan, taraf.", "full_meaning": "1. (İ) Yan, taraf.\n2. (İ) Kenar.\n3. (S) Yan, yan taraftaki.", "guide": "Bir nesnenin veya alanın sol, sağ, ön, arka gibi bölümlerinden biri.", "examples": "1. He sat by my side. (Benim yanıma/yanımda oturdu.)\n2. Write on both sides of the paper. (Kağıdın her iki yanına/kenarına da yaz.)\n3. Use the side door. (Yan kapıyı kullan.)", "rank": 233}, {"word": "fact", "type": "İsim", "meaning": "1. Gerçek, olgu.", "full_meaning": "1. Gerçek, olgu.\n2. (in fact) Aslında, doğrusu.\n3. (matter of fact) Bilinen gerçek, sıradan şey.", "guide": "Doğruluğu kanıtlanmış veya herkesçe kabul edilmiş bilgi parçası.", "examples": "1. It's a fact that smoking is harmful. (Sigara içmenin zararlı olduğu bir gerçektir.)\n2. He seems happy, but in fact he's very sad. (Mutlu görünüyor ama aslında çok üzgün.)", "rank": 234}, {"word": "operate", "type": "Fiil", "meaning": "1. Çalıştırmak, işletmek.", "full_meaning": "1. Çalıştırmak, işletmek.\n2. Ameliyat etmek.\n3. Faaliyet göstermek, işlemek.", "guide": "Bir makineyi kullanmak, tıbbi müdahale yapmak veya bir iş yürütmek.", "examples": "1. Do you know how to operate this machine? (Bu makineyi nasıl çalıştıracağını biliyor musun?)\n2. The surgeon will operate tomorrow. (Cerrah yarın ameliyat edecek.)\n3. The company operates in 20 countries. (Şirket 20 ülkede faaliyet gösteriyor.)", "rank": 235}, {"word": "name", "type": "İsim / Fiil", "meaning": "1. İsim, ad.", "full_meaning": "1. İsim, ad.\n2. Ün, şöhret.\n3. Adlandırmak, isim vermek.", "guide": "Bir kişi, yer veya şeyi tanımlayan sözcük. Fiil olarak birine/şeye isim vermek veya belirtmek.", "examples": "1. What's your name? (Adın ne?)\n2. He made a name for himself as a writer. (Kendine bir yazar olarak ün yaptı.)\n3. They named their daughter Emma. (Kızlarına Emma adını verdiler.)", "rank": 236}, {"word": "study", "type": "Fiil / İsim", "meaning": "1. (F) Çalışmak, ders çalışmak.", "full_meaning": "1. (F) Çalışmak, ders çalışmak.\n2. (İ) Çalışma, araştırma.\n3. (İ) Çalışma odası.", "guide": "Bilgi edinmek için okumak, öğrenmek. İsim olarak detaylı araştırma veya çalışma alanı.", "examples": "1. I need to study for the exam. (Sınava çalışmam gerekiyor.)\n2. A scientific study. (Bilimsel bir çalışma.)\n3. The book is in my study. (Kitap çalışma odamda.)", "rank": 237}, {"word": "level", "type": "İsim / Sıfat / Fiil", "meaning": "(İsim): 1. Seviye, düzey.", "full_meaning": "(İsim): 1. Seviye, düzey.\n2. Yükseklik, kot.\n3. Düz arazı, düzlük.\n(Sıfat): 4. Düz, yatay.\n(Fiil): 5. Düzleştirmek, eşitlemek.", "guide": "(İsim) Bir ölçüm skalasındaki konum. (Sıfat) Eğimi olmayan. (Fiil) Bir yüzeyi düz hale getirmek.", "examples": "1. Her English is at an advanced level. (İngilizcesi ileri seviyede.)\n2. The water level in the dam is rising. (Barajdaki su seviyesi yükseliyor.)\n3. We need to level the ground before we build. (İnşa etmeden önce zemini düzleştirmeliyiz.)\n4. Make sure the shelf is level. (Rafın düz olduğundan emin olun.)", "rank": 238}, {"word": "rather", "type": "Zarf", "meaning": "1. Oldukça, bir hayli.", "full_meaning": "1. Oldukça, bir hayli.\n2. Tercihen, ...-se daha iyi.\n3. Daha doğrusu.", "guide": "Bir sıfatı veya zarfla birlikte derece belirtir veya iki şey arasında tercihi ifade eder.", "examples": "1. \"It's rather cold today.\" (Bugün oldukça soğuk.)\n2. \"I'd rather stay home tonight.\" (Bu gece evde kalmayı tercih ederim.)\n3. \"He's not lazy; rather, he's very careful.\" (O tembel değil; daha doğrusu, çok dikkatli.)", "rank": 239}, {"word": "reason", "type": "İsim / Fiil", "meaning": "1. (İsim) Neden, sebep.", "full_meaning": "1. (İsim) Neden, sebep.\n2. (İsim) Mantık, akıl.\n3. (Fiil) Mantık yürütmek, akıl etmek.", "guide": "Bir olay veya davranışın niçin olduğunu açıklayan şey veya düşünme ve mantık yürütme yeteneği.", "examples": "1. \"The reason for the delay is bad weather.\" (Gecikmenin nedeni kötü havadır.)\n2. \"Use reason, not emotion, to decide.\" (Karar vermek için duygu değil, mantık kullan.)\n3. \"Humans can reason and solve problems.\" (İnsanlar mantık yürütebilir ve problem çözebilir.)", "rank": 240}, {"word": "less", "type": "Zarf / Sıfat / Edat", "meaning": "1. Daha az (miktar).", "full_meaning": "1. Daha az (miktar).\n2. Eksik, -siz, -sız (without).", "guide": "\"Little\"ın karşılaştırmalı hali. Daha küçük bir miktar veya derecede olan.", "examples": "1. I earn less money than you. (Senden daha az para kazanıyorum.)\n2. Try to make less noise. (Daha az gürültü yapmaya çalışın.)\n3. It's less a house, more a palace. (O bir ev değil, daha çok bir saray.)", "rank": 241}, {"word": "far", "type": "Zarf/Sıfat", "meaning": "1. Uzak, uzakta (zarf/sıfat).", "full_meaning": "1. Uzak, uzakta (zarf/sıfat).\n2. Çok, epey (zarf, karşılaştırmada).\n3. (so far) Şimdiye kadar.", "guide": "Büyük bir mesafede. Karşılaştırmalarda dereceyi vurgular (\"far better\").", "examples": "1. How far is the station? (İstasyon ne kadar uzakta?)\n2. This is far more difficult. (Bu çok daha zor.)\n3. So far, so good. (Şimdiye kadar iyi gidiyor.)", "rank": 242}, {"word": "young", "type": "Sıfat, İsim", "meaning": "1. Genç (sıfat)", "full_meaning": "1. Genç (sıfat)\n2. Yavru (hayvan) (sıfat)\n3. Gençler (topluluk) (çoğul isim)", "guide": "Yaşı az olan, hayatının erken dönemlerinde. Hayvanların yavrularını tanımlar. İsim olarak (çoğunlukla çoğul), genç insanlar grubunu ifade eder.", "examples": "1. She looks very young for her age. (Yaşına göre çok genç görünüyor.)\n2. The young birds have left the nest. (Yavru kuşlar yuvayı terk etti.)\n3. This music is popular with the young. (Bu müzik gençler arasında popüler.)", "rank": 243}, {"word": "street", "type": "İsim", "meaning": "1. Sokak, cadde.", "full_meaning": "1. Sokak, cadde.\n2. Yol, cadde.\n3. Sokağın halkı.", "guide": "Binaların sıralandığı, genellikle araç ve yayaların kullandığı genel yol.", "examples": "1. I live on this street. (Bu sokakta yaşıyorum.)\n2. Be careful crossing the street. (Sokaktan karşıya geçerken dikkatli ol.)\n3. The whole street was talking about it. (Bütün mahalle onun hakkında konuşuyordu.)", "rank": 244}, {"word": "continue", "type": "Fiil", "meaning": "1. Devam etmek, sürmek.", "full_meaning": "1. Devam etmek, sürmek.\n2. (Sona ermeden) sürdürmek.\n3. (Konuşmaya) devam etmek.", "guide": "Bir şeyi yapmayı veya bir durumda olmayı sürdürmek.", "examples": "1. The rain continued all day. (Yağmur bütün gün devam etti.)\n2. He continued working despite being tired. (Yorgun olmasına rağmen çalışmaya devam etti.)\n3. To be continued... (Devam edecek...)", "rank": 245}, {"word": "public", "type": "Sıfat/İsim", "meaning": "1. (Sıfat) Kamusal, halka açık.", "full_meaning": "1. (Sıfat) Kamusal, halka açık.\n2. (Sıfat) Genel, herkesçe bilinen.\n3. (İsim) Halk, kamuoyu.", "guide": "Herkesin erişimine veya bilgisine açık olan. Devlete ait. Toplumun geneli.", "examples": "1. Public transportation is very good here. (Burada toplu taşıma çok iyi.)\n2. The news became public knowledge. (Haber herkesin malumu oldu.)\n3. The museum is open to the public. (Müze halka açıktır.)", "rank": 246}, {"word": "important", "type": "Sıfat", "meaning": "1. Önemli, mühim.", "full_meaning": "1. Önemli, mühim.\n2. Nüfuzlu, sözü geçen.\n3. Ciddi, büyük (miktar/derece).", "guide": "Değerli, dikkate alınması gereken. Etkili veya güçlü. Önemli miktarda.", "examples": "1. It's important to tell the truth. (Doğruyu söylemek önemlidir.)\n2. He met with important people. (Nüfuzlu kişilerle görüştü.)\n3. An important part of the budget. (Bütçenin önemli/büyük bir kısmı.)", "rank": 247}, {"word": "agree", "type": "Fiil", "meaning": "1. Aynı fikirde olmak, katılmak.", "full_meaning": "1. Aynı fikirde olmak, katılmak.\n2. Anlaşmak, uzlaşmak.\n3. (Yemeğin) yaramak, iyi gelmek.", "guide": "Bir fikre veya öneriye onay vermek veya bir konuda mutabık kalmak.", "examples": "1. I agree with you completely. (Sana tamamen katılıyorum.)\n2. They finally agreed on a price. (Sonunda bir fiyatta anlaştılar.)\n3. Spicy food doesn't agree with me. (Baharatlı yemek bana dokunuyor.)", "rank": 248}, {"word": "talk", "type": "Fiil / İsim", "meaning": "Fiil: 1. Konuşmak.", "full_meaning": "Fiil: 1. Konuşmak.\n2. Görüşmek, müzakereler yapmak.\nİsim: 3. Konuşma, sohbet.\n4. Resmi konuşma, seminer.", "guide": "İki veya daha fazla kişi arasındaki sözlü iletişimi ifade eder. Fiil olarak daha yaygındır.", "examples": "1. Can I talk to you for a minute? (Seninle bir dakika konuşabilir miyim?)\n2. The two companies are talking about a merger. (İki şirket bir birleşme görüşmesi yapıyor.)\n3. We had a long talk about our future. (Geleceğimiz hakkında uzun bir konuşma/sohbet ettik.)", "rank": 249}, {"word": "council", "type": "İsim", "meaning": "1. Belediye, meclis.", "full_meaning": "1. Belediye, meclis.\n2. Konsey, kurul.\n3. Danışma kurulu.", "guide": "Yerel yönetim birimi veya danışma/karar organı.", "examples": "1. the local council (yerel belediye)\n2. the city council (şehir meclisi)\n3. the student council (öğrenci konseyi)", "rank": 250}, {"word": "until", "type": "Edat, Bağlaç", "meaning": "1. -e kadar (zamanda)", "full_meaning": "1. -e kadar (zamanda)\n2. -e kadar (bir eylemin başka bir eylem olana kadar devam ettiğini belirtir)", "guide": "Bir eylemin veya durumun belirli bir zamana veya başka bir olaya kadar devam ettiğini gösterir. \"Up to the time of\" ifadesine karşılık gelir.", "examples": "1. The shop is open until 9 PM. (Dükkan akşam 9'a kadar açık.)\n2. Wait here until I come back. (Ben dönene kadar burada bekle.)\n3. He didn't realize his mistake until it was too late. (Hatasını çok geç olana kadar fark etmedi.)", "rank": 251}, {"word": "quite", "type": "Zarf", "meaning": "1. Oldukça, epey.", "full_meaning": "1. Oldukça, epey.\n2. Tamamen, bütünüyle.\n3. Hakikaten, gerçekten.", "guide": "Bir sıfat veya zarfın derecesini belirtmek için kullanılır; \"oldukça\" veya \"tamamen\" anlamına gelebilir.", "examples": "1. \"The movie was quite good.\" (Film oldukça iyiydi.)\n2. \"That's not quite what I meant.\" (Benim kastettiğim tam olarak o değil.)\n3. \"It was quite a surprise!\" (Gerçekten bir sürprizdi!)", "rank": 252}, {"word": "cost", "type": "İsim/Fiil", "meaning": "1. Maliyet, fiyat (isim).", "full_meaning": "1. Maliyet, fiyat (isim).\n2. Mal olmak, tutmak (fiil).\n3. (can cost) kaybettirmek, pahasına olmak.", "guide": "Bir şey için ödenen veya harcanan para. Fiil olarak belirli bir fiyatı olmak.", "examples": "1. The cost of living is high. (Yaşam maliyeti yüksek.)\n2. How much does it cost? (Ne kadar tutuyor?)\n3. at all costs (her ne pahasına olursa olsun)", "rank": 253}, {"word": "water", "type": "İsim, Fiil", "meaning": "1. Su (isim)", "full_meaning": "1. Su (isim)\n2. Sulamak (fiil)\n3. Gözleri sulanmak (fiil)", "guide": "H₂O, yaşam için temel sıvı. Fiil olarak, bitkilere su vermek veya gözlerin yaşarması anlamına gelir.", "examples": "1. Can I have a glass of water, please? (Bir bardak su alabilir miyim, lütfen?)\n2. Remember to water the plants. (Bitkileri sulamayı unutma.)\n3. The smoke made my eyes water. (Duman gözlerimin sulanmasına neden oldu.)", "rank": 254}, {"word": "eye", "type": "İsim/Fiil", "meaning": "1. Göz (isim).", "full_meaning": "1. Göz (isim).\n2. Bakış, nazar (isim).\n3. İncelemek, dikkatle bakmak (fiil).", "guide": "Görme organı. Bakış veya görüş açısı. Dikkatle veya şüpheyle bakmak.", "examples": "1. She has beautiful blue eyes. (Güzel mavi gözleri var.)\n2. in the eyes of the law (kanun nazarında)\n3. He eyed me suspiciously. (Bana şüpheyle baktı.)", "rank": 255}, {"word": "require", "type": "Fiil", "meaning": "1. Gerektirmek, gereksinim duymak.", "full_meaning": "1. Gerektirmek, gereksinim duymak.\n2. İstemek, talep etmek.\n3. Zorunlu kılmak.", "guide": "Bir şeyin olması veya yapılabilmesi için gerekli olmak, zorunlu kılmak.", "examples": "1. \"This job requires patience.\" (Bu iş sabır gerektirir.)\n2. \"You are required to show your ID.\" (Kimliğinizi göstermeniz gerekiyor.)", "rank": 256}, {"word": "book", "type": "İsim/Fiil", "meaning": "1. Kitap (isim).", "full_meaning": "1. Kitap (isim).\n2. Rezervasyon yapmak, ayırtmak (fiil).\n3. (defter) kaydetmek.", "guide": "Basılı veya dijital okuma materyali. Fiil olarak bir şey için yer ayırtmak.", "examples": "1. I'm reading a good book. (İyi bir kitap okuyorum.)\n2. I need to book a table for two. (İki kişilik bir masa ayırtmam gerekiyor.)\n3. an address book (bir adres defteri)", "rank": 257}, {"word": "organize", "type": "Fiil", "meaning": "1. Düzenlemek, organize etmek.", "full_meaning": "1. Düzenlemek, organize etmek.\n2. Planlamak, ayarlamak.\n3. Örgütlemek, bir araya getirmek.", "guide": "Bir şeyi düzenli ve verimli bir hale getirmek veya bir etkinlik planlamak.", "examples": "1. Can you organize the files on the desk? (Masadaki dosyaları düzenleyebilir misin?)\n2. We're organizing a party for her birthday. (Onun doğum günü için bir parti düzenliyoruz.)", "rank": 258}, {"word": "business", "type": "İsim", "meaning": "1. İş, ticaret.", "full_meaning": "1. İş, ticaret.\n2. İşletme, firma.\n3. Mesele, konu.", "guide": "Ticari faaliyet veya bir ticari kuruluş. Ayrıca kişisel bir mesele.", "examples": "1. He's in the hotel business. (Otel işiyle uğraşıyor.)\n2. She runs her own business. (Kendi işletmesini yönetiyor.)\n3. Mind your own business! (Kendi işine bak!)", "rank": 259}, {"word": "grow", "type": "Fiil", "meaning": "1. Büyümek.", "full_meaning": "1. Büyümek.\n2. Yetiştirmek (bitki).\n3. Olmak, -e dönüşmek (grow old/angry).", "guide": "Canlılar için doğal olarak boyut/yaş artışı göstermek. Bitki yetiştirmek. Bir duruma veya duyguya geçmek.", "examples": "1. Children grow so fast. (Çocuklar çok hızlı büyüyor.)\n2. We grow vegetables in our garden. (Bahçemizde sebze yetiştiriyoruz.)\n3. He grew tired of waiting. (Beklemekten sıkıldı.)", "rank": 260}, {"word": "night", "type": "İsim", "meaning": "1. Gece.", "full_meaning": "1. Gece.\n2. Akşam, gece vakti.\n3. Karanlık dönem, kötü zaman.", "guide": "Güneş battıktan doğana kadar olan zaman dilimi.", "examples": "1. I can't sleep at night. (Gece uyuyamıyorum.)\n2. We went out last night. (Dün gece dışarı çıktık.)\n3. He went through a dark night of the soul. (Ruhunun karanlık bir gecesinden geçti.)", "rank": 261}, {"word": "hear", "type": "Fiil", "meaning": "1. Duymak (kulakla).", "full_meaning": "1. Duymak (kulakla).\n2. Haber almak, öğrenmek.\n3. (Mahkeme) Davayı dinlemek.", "guide": "Sesleri kulakla algılamak. Bir şey hakkında bilgi edinmek. Resmi olarak bir davayı dinleyip karar vermek.", "examples": "1. Can you hear me? (Beni duyabiliyor musun?)\n2. I heard that you're moving. (Taşındığını duydum.)\n3. The judge will hear the case next week. (Hakim davayı önümüzdeki hafta görecek/dinleyecek.)", "rank": 262}, {"word": "consider", "type": "Fiil", "meaning": "1. Düşünmek, göz önünde bulundurmak.", "full_meaning": "1. Düşünmek, göz önünde bulundurmak.\n2. Saymak, kabul etmek.\n3. (consider doing) yapmayı düşünmek.", "guide": "Dikkatlice düşünmek veya bir şekilde değerlendirmek.", "examples": "1. We need to consider all the options. (Tüm seçenekleri düşünmemiz gerekiyor.)\n2. She is considered an expert. (O bir uzman olarak kabul edilir.)\n3. I'm considering changing my job. (İşimi değiştirmeyi düşünüyorum.)", "rank": 263}, {"word": "cent", "type": "İsim", "meaning": "1. Sent (para birimi).", "full_meaning": "1. Sent (para birimi).\n2. Yüzde bir.\n3. (not a red cent) beş para, metelik.", "guide": "Doların veya avronun yüzde biri. Çok küçük miktarlar için kullanılır.", "examples": "1. It costs 99 cents. (99 sente mal oluyor.)\n2. I don't have a cent to my name. (Adıma kayıtlı bir meteliğim yok.)\n3. per cent (yüzde)", "rank": 264}, {"word": "expect", "type": "Fiil", "meaning": "1. Beklemek, ummak.", "full_meaning": "1. Beklemek, ummak.\n2. (Birinden) Beklemek, istemek.\n3. (Hamile) Olmak.", "guide": "Bir şeyin olacağını düşünmek veya tahmin etmek. Birisinden belirli bir şekilde davranmasını veya bir şey yapmasını istemek. Hamile olmak.", "examples": "1. I expect he'll be here soon. (Sanırım birazdan burada olur.)\n2. Teachers expect students to be punctual. (Öğretmenler öğrencilerden dakik olmalarını bekler.)\n3. She's expecting a baby in June. (Haziran'da bebek bekliyor.)", "rank": 265}, {"word": "speak", "type": "Fiil", "meaning": "1. Konuşmak.", "full_meaning": "1. Konuşmak.\n2. (Bir dil) Bilmek, konuşabilmek.\n3. Söylev vermek.", "guide": "Sözlü olarak iletişim kurmak, kelimeler söylemek.", "examples": "1. Can I speak to the manager? (Müdürle konuşabilir miyim?)\n2. Do you speak English? (İngilizce biliyor/Konuşuyor musun?)\n3. She will speak at the conference. (Konferansta konuşma yapacak.)", "rank": 266}, {"word": "friend", "type": "İsim", "meaning": "1. Arkadaş, dost.", "full_meaning": "1. Arkadaş, dost.", "guide": "Birbirini seven ve birbirine destek olan kişi.", "examples": "1. She's my best friend. (O benim en iyi arkadaşım.)", "rank": 267}, {"word": "base", "type": "İsim/Fiil/Sıfat", "meaning": "1. Taban, temel, üs (isim).", "full_meaning": "1. Taban, temel, üs (isim).\n2. Dayandırmak (fiil).\n3. Adi, aşağılık (sıfat).", "guide": "Bir şeyin üzerine oturduğu, dayandığı kısım. Fiil olarak bir şeyi başka bir şeye dayandırmak.", "examples": "1. The lamp has a wide base. (Lambanın geniş bir tabanı var.)\n2. The story is based on real events. (Hikaye gerçek olaylara dayanıyor.)\n3. a military base (askeri üs)", "rank": 268}, {"word": "train", "type": "İsim / Fiil", "meaning": "İsim: 1. Tren.", "full_meaning": "İsim: 1. Tren.\n2. Dizi, silsile (düşünce).\n3. Uzun etek (gelinlik).\nFiil: 4. Eğitmek, antrenman yaptırmak.\n5. Yetiştirmek.", "guide": "Demiryolu taşıtı. Fiil olarak, bir beceriyi öğretmek veya geliştirmek.", "examples": "1. We took the train to London. (Londra'ya trenle gittik.)\n2. The interruption broke my train of thought. (Araya girmesi düşünce akışımı kırdı.)\n3. She trains for the marathon every day. (Maraton için her gün antrenman yapar.)", "rank": 269}, {"word": "industry", "type": "İsim", "meaning": "1. Endüstri, sanayi.", "full_meaning": "1. Endüstri, sanayi.\n2. Sektör, iş kolu.\n3. Çalışkanlık, gayret.", "guide": "Malların üretimi veya hizmetlerin sağlanmasıyla ilgili ekonomik faaliyet alanı. Belirli bir ticari faaliyet alanı. Sıkı çalışma.", "examples": "1. The car industry is important to the economy. (Otomobil endüstrisi/sanayii ekonomi için önemlidir.)\n2. She works in the film industry. (Film sektöründe çalışıyor.)\n3. He succeeded through hard work and industry. (Sıkı çalışma ve gayret sayesinde başardı.)", "rank": 270}, {"word": "line", "type": "İsim", "meaning": "1. Çizgi, hat.", "full_meaning": "1. Çizgi, hat.\n2. Sıra, kuyruk.\n3. (Telefon) Hat, hat.\n4. (İş kolu) Dal.", "guide": "İki nokta arasındaki ince ve uzun işaret. İnsanların veya nesnelerin arka arkaya dizilmesi.", "examples": "1. Draw a straight line. (Düz bir çizgi çiz.)\n2. Please wait in line. (Lütfen sırada bekleyin.)\n3. The line is busy; I'll call back later. (Hat meşgul; sonra tekrar ararım.)\n4. What line of work are you in? (Hangi iş kolundasınız?)", "rank": 271}, {"word": "half", "type": "İsim, Sıfat, Zarf", "meaning": "1. Yarım, buçuk.", "full_meaning": "1. Yarım, buçuk.\n2. (Futbol vb.) Devre.\n3. (Zarf) Yarı yarıya, kısmen.", "guide": "Bütünün iki eşit parçasından biri. Sporda oyun süresinin yarısı. Zarf olarak tam değil anlamında.", "examples": "1. Half of the cake is gone. (Yarısı gitti.) [İsim]\n2. The score was 1-0 at half-time. (Devre arası skor 1-0'dı.) [İsim]\n3. The glass is half full. (Bardak yarı dolu.) [Zarf]", "rank": 272}, {"word": "near", "type": "Edat / Sıfat / Fiil", "meaning": "1. Yakın, yakınında.", "full_meaning": "1. Yakın, yakınında.\n2. Yaklaşık.\n3. Yaklaşmak, yanaşmak.", "guide": "Uzak olmayan, kısa bir mesafede. Fiil olarak bir şeye yaklaşmak.", "examples": "1. The station is near my house. (İstasyon evime yakın.)\n2. It will cost in the near future. (Yakın gelecekte mal olacak.)\n3. The ship neared the harbor. (Gemi limana yaklaştı.)", "rank": 273}, {"word": "force", "type": "İsim/Fiil", "meaning": "1. Güç, kuvvet (isim).", "full_meaning": "1. Güç, kuvvet (isim).\n2. Zorlamak, mecbur etmek (fiil).\n3. (Polis/asker) Birlik, kuvvet (isim).", "guide": "Fiziksel güç veya enerji. Birini istemediği bir şeyi yapmaya zorlamak. Organize bir grup (police force).", "examples": "1. The force of the explosion shattered windows. (Patlamanın gücü camları kırdı.)\n2. He forced me to tell the truth. (Beni doğruyu söylemeye zorladı.)\n3. the armed forces (silahlı kuvvetler)", "rank": 274}, {"word": "nature", "type": "İsim", "meaning": "1. Doğa, tabiat.", "full_meaning": "1. Doğa, tabiat.\n2. Özellik, yapı, karakter.\n3. Tür, çeşit.", "guide": "İnsan eli değmemiş dünya veya bir şeyin temel karakteri.", "examples": "1. I love walking in nature. (Doğada yürümeyi seviyorum.)\n2. It's not in his nature to lie. (Yalan söylemek onun yapısında/doğasında yok.)\n3. Problems of this nature are hard to solve. (Bu türden problemleri çözmek zordur.)", "rank": 275}, {"word": "offer", "type": "Fiil / İsim", "meaning": "1. Teklif etmek, sunmak.", "full_meaning": "1. Teklif etmek, sunmak.\n2. (Fiyat) vermek.\n3. Teklif, öneri; fırsat.", "guide": "Bir şeyi vermeyi veya yapmayı önermek. İsim olarak bu önerinin kendisi.", "examples": "1. He offered me a drink. (Bana bir içecek teklif etti.)\n2. They offered £200,000 for the house. (Ev için 200.000 pound teklif ettiler.)\n3. Thank you for your kind offer. (Nazik teklifiniz için teşekkür ederim.)", "rank": 276}, {"word": "money", "type": "İsim", "meaning": "1. Para.", "full_meaning": "1. Para.\n2. Varlık, servet.\n3. (Argo) zenginlik, kazanç.", "guide": "Mal ve hizmetlerin alım satımında kullanılan genel kabul gören araç.", "examples": "1. How much money do you have? (Ne kadar paran var?)\n2. He made his money in real estate. (Parasını emlak işinden kazandı.)\n3. That car costs serious money. (O araba ciddi para tutuyor.)", "rank": 277}, {"word": "stand", "type": "Fiil / İsim", "meaning": "1. (F) Ayakta durmak.", "full_meaning": "1. (F) Ayakta durmak.\n2. (F) Katlanmak, dayanmak.\n3. (İ) Duruş, tutum.", "guide": "Dik pozisyonda olmak veya bir şeye tahammül etmek. İsim olarak duruş veya tezgah.", "examples": "1. Please stand up. (Lütfen ayağa kalkın.)\n2. I can't stand the noise. (Gürültüye dayanamıyorum.)\n3. He took a firm stand on the issue. (Konu üzerinde sert bir tutum aldı.)", "rank": 278}, {"word": "figure", "type": "İsim/Fiil", "meaning": "1. Şekil, rakam (isim).", "full_meaning": "1. Şekil, rakam (isim).\n2. (İnsan) Silüet, vücut yapısı (isim).\n3. Anlamak, çözmek (fiil, ABD).", "guide": "Sayısal bir değer. Bir insanın vücut formu. Bir şeyi anlamak veya hesaplamak.", "examples": "1. Check the figures in the report. (Raportaki rakamları kontrol edin.)\n2. She has a slim figure. (İnce bir fiziği var.)\n3. I can't figure out how to do this. (Bunu nasıl yapacağımı çözemiyorum.)", "rank": 279}, {"word": "room", "type": "İsim", "meaning": "1. Oda.", "full_meaning": "1. Oda.\n2. Yer, boş alan.\n3. İmkan, fırsat.", "guide": "Bir binanın duvarlarla ayrılmış bölümü veya bir şeyin sığabileceği alan.", "examples": "1. \"My room is on the second floor.\" (Benim odam ikinci katta.)\n2. \"Is there room for one more in the car?\" (Arabada bir kişilik yer var mı?)\n3. \"There's room for improvement.\" (Geliştirme imkanı var.)", "rank": 280}, {"word": "often", "type": "Edat/Zarf", "meaning": "1. Sık sık, çoğu zaman.", "full_meaning": "1. Sık sık, çoğu zaman.\n2. Sıklıkla.\n3. Birçok durumda.", "guide": "Bir şeyin birçok kez veya birçok durumda gerçekleştiğini ifade eder.", "examples": "1. I often go to the cinema. (Sık sık sinemaya giderim.)\n2. How often do you exercise? (Ne sıklıkla egzersiz yaparsın?)", "rank": 281}, {"word": "view", "type": "İsim, Fiil", "meaning": "1. Görüş, manzara (isim)", "full_meaning": "1. Görüş, manzara (isim)\n2. Görüş, fikir, düşünce (isim)\n3. Görmek, izlemek, bakmak (fiil)", "guide": "Gözle görülebilen şey (manzara) veya zihinsel bir bakış açısı, inanç anlamına gelir. Fiil olarak, bakmak, incelemek veya bir şekilde düşünmek demektir.", "examples": "1. The hotel room has a beautiful sea view. (Otel odasının güzel bir deniz manzarası var.)\n2. What is your view on this issue? (Bu konu hakkındaki görüşünüz nedir?)\n3. How do you view the future of the company? (Şirketin geleceğini nasıl görüyorsunuz?)", "rank": 282}, {"word": "once", "type": "Edat/Zarf / Bağlaç", "meaning": "1. Bir zamanlar, eskiden.", "full_meaning": "1. Bir zamanlar, eskiden.\n2. Bir kez, bir defa.\n3. (once...) bir kez ...-ince.", "guide": "Geçmişteki bir zamanı veya tek bir olayı ifade eder. Bağlaç olarak \"-ir ...-mez\" anlamına gelir.", "examples": "1. I once lived in Paris. (Bir zamanlar Paris'te yaşadım.)\n2. I've been there only once. (Oraya sadece bir kez gittim.)\n3. Once you learn, you never forget. (Bir kez öğrenince, asla unutmazsın.)", "rank": 283}, {"word": "allow", "type": "Fiil", "meaning": "1. İzin vermek, müsaade etmek.", "full_meaning": "1. İzin vermek, müsaade etmek.\n2. Olanak tanımak, sağlamak.\n3. (Hesaba) dahil etmek, göz önünde bulundurmak.", "guide": "Bir şeyin olmasına veya birinin bir şey yapmasına izin vermek.", "examples": "1. Smoking is not allowed here. (Burada sigara içmeye izin verilmiyor.)\n2. The schedule allows time for a break. (Program bir mola için zaman tanıyor.)\n3. Allow me to introduce myself. (Kendimi tanıtmama izin verin.)", "rank": 284}, {"word": "teach", "type": "Fiil", "meaning": "1. Öğretmek.", "full_meaning": "1. Öğretmek.\n2. Eğitmek, ders vermek.\n3. (Mecazi) İbret olmak, ders vermek.", "guide": "Bilgi veya beceri aktarma eylemidir. Genellikle resmi (okul) veya gayri resmi bağlamlarda kullanılır.", "examples": "1. She teaches mathematics at a high school. (Bir lisede matematik öğretiyor.)\n2. My father taught me how to drive. (Babam bana araba kullanmayı öğretti.)\n3. That experience taught him to be more careful. (O deneyim ona daha dikkatli olmayı öğretti.)", "rank": 285}, {"word": "appear", "type": "Fiil", "meaning": "1. Görünmek, ortaya çıkmak.", "full_meaning": "1. Görünmek, ortaya çıkmak.\n2. Gözükmek, görünmek (gibi).\n3. (Mahkemede) görünmek.", "guide": "Gözle görülür hale gelmek veya bir izlenim yaratmak.", "examples": "1. A ship appeared on the horizon. (Ufukta bir gemi göründü.)\n2. She appears to be very happy. (Çok mutlu gözüküyor.)\n3. He had to appear in court. (Mahkemeye çıkmak zorunda kaldı.)", "rank": 286}, {"word": "apply", "type": "Fiil", "meaning": "1. Başvurmak.", "full_meaning": "1. Başvurmak.\n2. Uygulamak, tatbik etmek.\n3. Sürmek, uygulamak (krem/kural).", "guide": "Bir şey için resmen talep etmek veya bir şeyi belirli bir duruma, amaca veya yere kullanmak.", "examples": "1. You should apply for that job. (O işe başvurmalısın.)\n2. Apply the rules fairly. (Kuralları adil bir şekilde uygula.)\n3. Apply the cream twice a day. (Kremi günde iki kez sürün.)", "rank": 287}, {"word": "let", "type": "Fiil", "meaning": "1. İzin vermek.", "full_meaning": "1. İzin vermek.\n2. (Kiraya) Vermek.\n3. (let's) Haydi (yapalım).", "guide": "Bir şeyin olmasına izin vermek veya müsaade etmek. Bir mülkü kiraya vermek.", "examples": "1. My parents won't let me go to the party. (Ailem partiden gitmeme izin vermiyor.)\n2. They let their flat to a student. (Dairelerini bir öğrenciye kiraladılar.)\n3. Let's go for a walk. (Haydi yürüyüşe çıkalım.)", "rank": 288}, {"word": "involve", "type": "Fiil", "meaning": "1. İçermek, kapsamak.", "full_meaning": "1. İçermek, kapsamak.\n2. Karıştırmak, bulaştırmak.\n3. Gerektirmek, mecbur etmek.", "guide": "Bir şeyin bir parçası olmak veya bir şeyi içine almak. Birini veya bir şeyi bir faaliyete veya duruma dahil etmek. Belirli bir eylemi veya sonucu zorunlu kılmak.", "examples": "1. The job involves a lot of travel. (İş çok fazla seyahat gerektiriyor.)\n2. Don't involve me in your personal problems. (Beni kişisel sorunlarına karıştırma.)\n3. The plan involves closing the factory. (Plan fabrikanın kapatılmasını içeriyor.)", "rank": 289}, {"word": "further", "type": "Zarf/Sıfat/Fiil", "meaning": "1. Daha ileri, daha fazla (zarf/sıfat).", "full_meaning": "1. Daha ileri, daha fazla (zarf/sıfat).\n2. Ayrıca, bunun yanında (zarf).\n3. Desteklemek, ilerletmek (fiil).", "guide": "\"Far\"ın karşılaştırma derecesi. Ek olarak. Bir şeyin gelişmesine yardım etmek.", "examples": "1. We can't go any further without a map. (Bir harita olmadan daha ileri gidemeyiz.)\n2. Further, I would like to add... (Ayrıca, şunu eklemek istiyorum...)\n3. He took the job to further his career. (Kariyerini ilerletmek için işi kabul etti.)", "rank": 290}, {"word": "leave", "type": "Fiil", "meaning": "1. Ayrılmak, terketmek.", "full_meaning": "1. Ayrılmak, terketmek.\n2. Bırakmak, unutmak.\n3. Vasiyet etmek, miras bırakmak.", "guide": "Bir yerden ayrılmak veya bir şeyi olduğu yerde bırakıp gitmek.", "examples": "1. What time does the train leave? (Tren saat kaçta kalkıyor?)\n2. I left my keys at home. (Anahtarlarımı evde bıraktım.)\n3. He left all his money to charity. (Tüm parasını hayır kurumlarına bıraktı.)", "rank": 291}, {"word": "record", "type": "İsim / Fiil", "meaning": "1. (İsim) Kayıt, belge.", "full_meaning": "1. (İsim) Kayıt, belge.\n2. (İsim) Rekor.\n3. (Fiil) Kaydetmek.", "guide": "Bilginin saklandığı şey veya en iyi/yüksek performans. Fiil olarak bir şeyi (ses, görüntü, veri) kaydetmek.", "examples": "1. \"Keep a record of your expenses.\" (Giderlerinizin kaydını tutun.)\n2. \"She broke the world record.\" (Dünya rekorunu kırdı.)\n3. \"I recorded the concert on my phone.\" (Konseri telefonuma kaydettim.)", "rank": 292}, {"word": "law", "type": "İsim", "meaning": "1. Kanun, yasa, hukuk.", "full_meaning": "1. Kanun, yasa, hukuk.\n2. Kural, ilke.\n3. (Bilim) Doğa yasası, kanun.", "guide": "Bir ülkenin yönetim organları tarafından konulan ve uyulması zorunlu kurallar bütünü. Evrensel bir gerçek veya ilke.", "examples": "1. It is against the law to drive without a license. (Ehliyetsiz araba kullanmak yasaya aykırıdır.)\n2. The laws of physics apply everywhere. (Fizik yasaları her yerde geçerlidir.)\n3. He is studying law at university. (Üniversitede hukuk okuyor.)", "rank": 293}, {"word": "best", "type": "Sıfat/Zarf/İsim", "meaning": "1. En iyi (sıfat).", "full_meaning": "1. En iyi (sıfat).\n2. En iyi şekilde (zarf).\n3. En iyisi (isim).", "guide": "\"Good\" ve \"well\"in en üstünlük derecesi.", "examples": "1. She's my best friend. (O benim en iyi arkadaşım.)\n2. I work best in the morning. (En iyi sabahları çalışırım.)\n3. We want
