m (Past Continuous)", "tr": "", "pattern": "I was + fiil-ing when ...", "want": "Bir şey olurken başka bir şey yaptığını anlatmak istiyorsan (ben yürürken telefon çaldı)", "say": "I was + fiil-ing when ...", "steps": ["Devam eden iş için I was + fiil-ing.", "Araya giren olay için when + kısa cümle."], "expandedTr": "", "expandedEn": "", "patternDesc": "", "examples": [{"tr": "Ders çalışırken telefon çaldı.", "en": "I was studying when the phone rang."}, {"tr": "Yemek yapıyordum.", "en": "I was cooking."}, {"tr": "Ne yapıyordun?", "en": "What were you doing?"}], "trap": {"title": "Dikkat", "wrong": "I was study when", "correct": "I was studying when", "detail": "was'dan sonra fiile -ing ekle."}, "practices": [{"tr": "Yürüyordum.", "en": "I was walking.", "keywords": []}, {"tr": "Uyuyordum.", "en": "I was sleeping.", "keywords": []}], "ord": 72, "why": "Uzun süren iş için was + -ing, araya giren kısa olay için basit geçmiş: I was studying when the phone rang. Uzun iş arka plandır, kısa olay ön plandadır."}, {"id": 40, "level": "S8", "title": "Bence ... / Belki", "tr": "", "pattern": "I think ...", "want": "Bir konuda ne düşündüğünü, emin değilken bile söylemek istiyorsan", "say": "I think ...  /  I don't think ...  /  Maybe ...", "steps": ["Fikir için I think + cümle: I think it's good.", "Katılmıyorsan I don't think + olumlu cümle."], "expandedTr": "", "expandedEn": "", "patternDesc": "", "examples": [{"tr": "Bence güzel.", "en": "I think it's nice."}, {"tr": "Bence doğru değil.", "en": "I don't think it's right."}, {"tr": "Belki yarın.", "en": "Maybe tomorrow."}], "trap": {"title": "Dikkat", "wrong": "I think it isn't good", "correct": "I don't think it's good", "detail": "Olumsuzluğu think'e koy."}, "practices": [{"tr": "Bence haklısın.", "en": "I think you're right.", "keywords": []}, {"tr": "Belki gelirim.", "en": "Maybe I'll come.", "keywords": []}], "ord": 82, "why": "Fikri yumuşatmak için I think ve Maybe kullan. Katılmıyorsan olumsuzu think'e koy: I don't think it's good."}, {"id": 41, "level": "S8", "title": "İyi olduğun ve korktuğun şeyler", "tr": "", "pattern": "I'm good at / interested in / afraid of + şey", "want": "Neyde iyi olduğunu, neyle ilgilendiğini ya da neden korktuğunu söylemek istiyorsan", "say": "I'm good at / interested in / afraid of + şey", "steps": ["Hepsinde be fiili + sıfat + edat: I'm good at.", "Edatın arkasına isim ya da fiil-ing koy."], "expandedTr": "", "expandedEn": "", "patternDesc": "", "examples": [{"tr": "Yemek yapmada iyiyim.", "en": "I'm good at cooking."}, {"tr": "Müzikle ilgileniyorum.", "en": "I'm interested in music."}, {"tr": "Köpeklerden korkarım.", "en": "I'm afraid of dogs."}], "trap": {"title": "Dikkat", "wrong": "I'm good in cooking", "correct": "I'm good at cooking", "detail": "good ile at kullan."}, "practices": [{"tr": "Resimde iyiyim.", "en": "I'm good at drawing.", "keywords": []}, {"tr": "Yüksekten korkarım.", "en": "I'm afraid of heights.", "keywords": []}], "ord": 85, "why": "Yetenek, ilgi ve korku için be + sıfat + edat kullanılır: good at, interested in, afraid of. Edat sıfata bağlıdır, kalıp olarak öğren."}, {"id": 42, "level": "S1", "title": "Anlamadım, tekrar eder misin", "tr": "", "pattern": "I don't understand", "want": "Karşındakini anlamadığında ya da yavaş konuşmasını istediğinde", "say": "I don't understand  /  Could you say that again?  /  Slowly, please", "steps": ["Anlamadıysan açıkça söyle: I don't understand.", "Tekrar ve yavaşlık iste: Could you repeat that, please?"], "expandedTr": "", "expandedEn": "", "patternDesc": "", "examples": [{"tr": "Anlamadım.", "en": "I don't understand."}, {"tr": "Tekrar eder misin?", "en": "Could you repeat that?"}, {"tr": "Daha yavaş konuşur musun?", "en": "Could you speak more slowly?"}], "trap": {"title": "Dikkat", "wrong": "I no understand", "correct": "I don't understand", "detail": "Olumsuz için don't kullan."}, "practices": [{"tr": "Ne dedin?", "en": "Sorry, what did you say?", "keywords": []}, {"tr": "Yavaş lütfen.", "en": "Slowly, please.", "keywords": []}], "ord": 2, "why": "Susmak yerine anlamadığını söylemek konuşmayı kurtarır. Anadili İngilizce olanlar tekrar istenmesini çok normal bulur."}, {"id": 43, "level": "S1", "title": "Özür ve teşekkür", "tr": "", "pattern": "Sorry", "want": "Özür dilemek, dikkat çekmek ya da teşekkür etmek istiyorsan", "say": "Sorry  /  Excuse me  /  Thank you  /  No problem", "steps": ["Hata yaptıysan Sorry, dikkat çekmek için Excuse me de.", "Teşekkür için Thank you, cevap için No problem."], "expandedTr": "", "expandedEn": "", "patternDesc": "", "examples": [{"tr": "Özür dilerim, geciktim.", "en": "Sorry, I'm late."}, {"tr": "Affedersiniz, geçebilir miyim?", "en": "Excuse me, can I pass?"}, {"tr": "Çok teşekkürler.", "en": "Thank you so much."}], "trap": {"title": "Dikkat", "wrong": "I'm sorry you", "correct": "I'm sorry", "detail": "Sorry kısa ve yeterlidir."}, "practices": [{"tr": "Sorun değil.", "en": "No problem.", "keywords": []}, {"tr": "Yardımın için sağ ol.", "en": "Thanks for your help.", "keywords": []}], "ord": 4, "why": "Hata yaptıysan Sorry, dikkat çekmek ya da geçmek için Excuse me de. Önceden \"affedersiniz\" Excuse me, sonradan \"pardon\" Sorry."}, {"id": 44, "level": "S8", "title": "Çok, fazla, yeterince", "tr": "", "pattern": "too + sıfat", "want": "Bir şeyin fazla, çok ya da yeterli olduğunu söylemek istiyorsan (çok pahalı, yeterince büyük)", "say": "too + sıfat  /  very + sıfat  /  sıfat + enough", "steps": ["Fazla ve istenmeyen için too: too expensive.", "Sadece çok için very, yeterli için sıfat + enough."], "expandedTr": "", "expandedEn": "", "patternDesc": "", "examples": [{"tr": "Bu çok pahalı.", "en": "It's too expensive."}, {"tr": "Çok güzel.", "en": "It's very nice."}, {"tr": "Yeterince büyük.", "en": "It's big enough."}], "trap": {"title": "Dikkat", "wrong": "too much expensive", "correct": "too expensive", "detail": "too ile much kullanma."}, "practices": [{"tr": "Çok soğuk.", "en": "It's too cold.", "keywords": []}, {"tr": "Yeterince hızlı değil.", "en": "It's not fast enough.", "keywords": []}], "ord": 88, "why": "too istenmeyen fazlalığı, very sadece dereceyi, enough yeterliliği anlatır. Aynı sıfatla anlam değişir."}, {"id": 45, "level": "S7", "title": "Süregelen zaman: iki yıldır yapıyorum (Present Perfect Continuous)", "tr": "", "pattern": "I've been + fiil-ing + for / since ...", "want": "Bir şeyi ne zamandır yaptığını söylemek istiyorsan (iki yıldır çalışıyorum)", "say": "I've been + fiil-ing + for / since ...", "steps": ["Süre için for: for two years.", "Başlangıç noktası için since: since 2020."], "expandedTr": "", "expandedEn": "", "patternDesc": "", "examples": [{"tr": "İki yıldır çalışıyorum.", "en": "I've been working for two years."}, {"tr": "Sabahtan beri bekliyorum.", "en": "I've been waiting since morning."}, {"tr": "Ne zamandır burada yaşıyorsun?", "en": "How long have you been living here?"}], "trap": {"title": "Dikkat", "wrong": "I work for two years", "correct": "I've been working for two years", "detail": "Süreli şimdiki durumda I've been -ing kullan."}, "practices": [{"tr": "Üç aydır öğreniyorum.", "en": "I've been learning for three months.", "keywords": []}, {"tr": "2020'den beri burada.", "en": "I've been here since 2020.", "keywords": []}], "ord": 76, "why": "İş hâlâ devam ediyorsa have been -ing kullan; for süreyi, since başlangıcı verir. Çünkü iş bugün de sürüyor."}, {"id": 46, "level": "S1", "title": "Selamlaşma", "pattern": "Hello! / Hi!", "want": "Birini selamlamak ya da nasılsın diye sormak istiyorsan", "say": "Hello! / Hi!  /  How are you?  →  I'm good, thanks. And you?", "steps": ["Selam için Hello ya da daha samimi Hi de.", "Hal hatır için How are you? sor, cevapta I'm good, thanks. And you? de."], "examples": [{"tr": "Merhaba!", "en": "Hello!"}, {"tr": "Nasılsın?", "en": "How are you?"}, {"tr": "İyiyim, sen nasılsın?", "en": "I'm good. And you?"}], "trap": {"title": "Dikkat", "wrong": "How are you? — I am fine you", "correct": "How are you? — I'm fine. And you?", "detail": "Cevaptan sonra And you? diyerek soruyu geri çevir."}, "practices": [{"tr": "Günaydın!", "en": "Good morning!", "keywords": []}, {"tr": "Görüşürüz.", "en": "See you later.", "keywords": []}], "ord": 1, "why": "Hello her ortamda, Hi arkadaşlarla söylenir. How are you? gerçek bir soru değil, selamın parçası: kısa cevap verip soruyu geri çevirirsin."}, {"id": 47, "level": "S2", "title": "Bu ne, şu ne", "pattern": "This is ...", "want": "Önündeki ya da uzaktaki bir şeyi göstermek istiyorsan (bu bir kitap, şu benim)", "say": "This is ...  /  That is ...  /  It is ...", "steps": ["Yakındaki için This, uzaktaki için That söyle.", "Arkasına is ve şeyi koy: This is my phone."], "examples": [{"tr": "Bu benim telefonum.", "en": "This is my phone."}, {"tr": "Şu bir araba.", "en": "That is a car."}, {"tr": "Bu ne?", "en": "What is this?"}], "trap": {"title": "Dikkat", "wrong": "This are my book", "correct": "This is my book", "detail": "Tek şeyle this is, çok şeyle these are."}, "practices": [{"tr": "Bu bir kalem.", "en": "This is a pen.", "keywords": []}, {"tr": "Şu benim evim.", "en": "That is my house.", "keywords": []}], "ord": 11, "why": "Yakındaki şey için this, uzaktaki için that. Türkçedeki bu / şu ayrımı gibi mesafeye bakarsın."}, {"id": 48, "level": "S4", "title": "O ve onlar", "pattern": "He is / She is", "want": "Başka birini ya da birkaç kişiyi anlatmak istiyorsan (o doktor, onlar evde)", "say": "He is / She is  /  They are / We are + ...", "steps": ["Erkek için He is, kadın için She is, birden fazla kişi için They are.", "Biz için We are, sen için You are."], "examples": [{"tr": "O bir doktor.", "en": "He is a doctor."}, {"tr": "O evde.", "en": "She is at home."}, {"tr": "Onlar mutlu.", "en": "They are happy."}], "trap": {"title": "Dikkat", "wrong": "She are tired", "correct": "She is tired", "detail": "He, she ve it ile is kullan."}, "practices": [{"tr": "Biz hazırız.", "en": "We are ready.", "keywords": []}, {"tr": "O öğretmen.", "en": "She is a teacher.", "keywords": []}], "ord": 30, "why": "Kimi anlattığına göre seç: He (erkek), She (kadın), They (birden fazla kişi). Fiil de buna göre değişir: he is, they are."}, {"id": 49, "level": "S4", "title": "Geniş zaman: yapar (Present Simple)", "pattern": "I + fiil", "want": "Alışkanlıklarını ve her gün yaptığın şeyleri söylemek istiyorsan", "say": "I + fiil  /  He, she + fiil-s", "steps": ["Düz fiil kullan: I work, I eat, I get up.", "O (he, she) olunca fiilin sonuna s ekle: she works."], "examples": [{"tr": "Her gün çalışırım.", "en": "I work every day."}, {"tr": "Sabah yedide kalkarım.", "en": "I get up at seven."}, {"tr": "O kahve içer.", "en": "He drinks coffee."}], "trap": {"title": "Dikkat", "wrong": "She work every day", "correct": "She works every day", "detail": "he, she ve it ile fiile s ekle."}, "practices": [{"tr": "Her sabah koşarım.", "en": "I run every morning.", "keywords": []}, {"tr": "O erken uyanır.", "en": "She wakes up early.", "keywords": []}], "ord": 38, "why": "Alışkanlıkta fiil düz kalır. Ama o (he / she / it) olunca fiile s eklenir: she works. Çünkü cümlede tek bir üçüncü kişi var."}, {"id": 50, "level": "S4", "title": "Geniş zaman olumsuz: yapmaz (don't / doesn't)", "pattern": "I don't + fiil", "want": "Bir şeyi yapmadığını ya da bilmediğini söylemek istiyorsan (kahve içmem, bilmiyorum)", "say": "I don't + fiil  /  He doesn't + fiil", "steps": ["Olumsuz için fiilin önüne don't koy: I don't know.", "O (he, she) için doesn't kullan, fiil düz kalır."], "examples": [{"tr": "Bilmiyorum.", "en": "I don't know."}, {"tr": "Kahve içmem.", "en": "I don't drink coffee."}, {"tr": "O sevmez.", "en": "He doesn't like it."}], "trap": {"title": "Dikkat", "wrong": "She doesn't likes", "correct": "She doesn't like", "detail": "doesn't'tan sonra fiile s eklenmez."}, "practices": [{"tr": "Anlamıyorum.", "en": "I don't get it.", "keywords": []}, {"tr": "Et yemez.", "en": "He doesn't eat meat.", "keywords": []}], "ord": 39, "why": "Olumsuzlukta don't ya da doesn't \"yapmıyorum\" işini üstlenir, asıl fiil değişmez: he doesn't work (works değil)."}, {"id": 51, "level": "S1", "title": "Saat ve sayılar", "pattern": "It's + saat", "want": "Saati, günü ya da fiyatı söylemek istiyorsan (saat beş, yedide, yirmi lira)", "say": "It's + saat  /  at + saat  /  sayı + lira", "steps": ["Saat kaç diye sormak için What time is it? de, cevapta It's five o'clock.", "Bir şeyin saatini söylerken at kullan: at seven."], "examples": [{"tr": "Saat beş.", "en": "It's five o'clock."}, {"tr": "Yedide buluşalım.", "en": "Let's meet at seven."}, {"tr": "Yirmi lira.", "en": "It's twenty lira."}], "trap": {"title": "Dikkat", "wrong": "in seven", "correct": "at seven", "detail": "Saatlerde at kullan, in değil."}, "practices": [{"tr": "Saat kaç?", "en": "What time is it?", "keywords": []}, {"tr": "Sekizde kalkarım.", "en": "I get up at eight.", "keywords": []}], "ord": 10, "why": "Saat bir noktadır, bu yüzden at kullanılır: at seven. Gün için on Monday gerekir ama başlangıçta sadece at yeterli."}, {"id": 52, "level": "S2", "title": "Alışverişte", "pattern": "How much is this?", "want": "Mağazada fiyat sormak, denemek ya da başka beden istemek istiyorsan", "say": "How much is this?  /  Can I try this on?  /  Do you have this in a bigger size?  /  I'll take it.", "steps": ["Fiyat için How much is this?, denemek için Can I try this on? de.", "Beğendiysen I'll take it, düşüneceksen I'll think about it de."], "examples": [{"tr": "Bunu deneyebilir miyim?", "en": "Can I try this on?"}, {"tr": "Bunun daha büyüğü var mı?", "en": "Do you have this in a bigger size?"}, {"tr": "Bunu alıyorum.", "en": "I'll take it."}], "trap": {"title": "Dikkat", "wrong": "I take it", "correct": "I'll take it", "detail": "Karar verdiğin anda I'll kullan."}, "practices": [{"tr": "Sadece bakıyorum.", "en": "I'm just looking.", "keywords": []}, {"tr": "Kartla ödeyebilir miyim?", "en": "Can I pay by card?", "keywords": []}], "ord": 18, "why": "Mağazada üç durum yaşarsın: soruyorsun (Can I ...?), karar veriyorsun (I'll take it), vazgeçiyorsun (I'll think about it). Her durumun kendi kalıbı var."}, {"id": 53, "level": "S2", "title": "Doktorda ve eczanede", "pattern": "I have a headache.", "want": "Ağrını anlatmak ya da doktora gitmen gerektiğini söylemek istiyorsan", "say": "I have a headache.  /  My ... hurts.  /  I need to see a doctor.", "steps": ["Ağrı için I have a + ağrı: I have a sore throat.", "Bir yerin ağrıyorsa My + yer + hurts de: My back hurts."], "examples": [{"tr": "Başım ağrıyor.", "en": "I have a headache."}, {"tr": "Sırtım ağrıyor.", "en": "My back hurts."}, {"tr": "Doktora görünmem lazım.", "en": "I need to see a doctor."}], "trap": {"title": "Dikkat", "wrong": "I have pain head", "correct": "I have a headache", "detail": "Baş ağrısı tek kelimedir: headache."}, "practices": [{"tr": "Ateşim var.", "en": "I have a fever.", "keywords": []}, {"tr": "Bana bir ağrı kesici verir misiniz?", "en": "Could I have some painkillers?", "keywords": []}], "ord": 20, "why": "Ağrıyı iki yolla söylersin: ağrının adıyla (I have a headache) ya da yeriyle (My back hurts). Aklına hangisi gelirse onu kullan."}, {"id": 54, "level": "S3", "title": "Yol sorma ve tarif etme", "pattern": "How do I get to ...?", "want": "Yol sormak ya da birine yol tarif etmek istiyorsan", "say": "How do I get to ...?  /  Go straight  /  Turn left / right  /  It's next to ...", "steps": ["Yol sorarken How do I get to + yer? de.", "Tarif ederken Go straight, Turn left, Turn right, It's next to ... de."], "examples": [{"tr": "İstasyona nasıl giderim?", "en": "How do I get to the station?"}, {"tr": "Düz git, sonra sola dön.", "en": "Go straight, then turn left."}, {"tr": "Bankanın yanında.", "en": "It's next to the bank."}], "trap": {"title": "Dikkat", "wrong": "Where is going station", "correct": "How do I get to the station?", "detail": "Yol için How do I get to kalıbını kullan."}, "practices": [{"tr": "Buraya uzak mı?", "en": "Is it far from here?", "keywords": []}, {"tr": "Sağa dön.", "en": "Turn right.", "keywords": []}], "ord": 27, "why": "Yol sorarken How do I get to kalıbı yeter. Tarif ederken kısa emir cümleleri kullanılır: Turn left. Nazik olmak için please ekle."}, {"id": 55, "level": "S4", "title": "Ne sıklıkla yaparsın", "pattern": "always / usually / often / sometimes / never + fiil", "want": "Bir şeyi ne sıklıkla yaptığını söylemek istiyorsan (genelde, bazen, asla)", "say": "always / usually / often / sometimes / never + fiil", "steps": ["Sıklık kelimesini fiilin önüne koy: I usually walk.", "Hiç yapmıyorsan never de: I never eat meat."], "examples": [{"tr": "Genelde erken kalkarım.", "en": "I usually get up early."}, {"tr": "Bazen dışarıda yerim.", "en": "I sometimes eat out."}, {"tr": "Et yemem.", "en": "I never eat meat."}], "trap": {"title": "Dikkat", "wrong": "I go usually", "correct": "I usually go", "detail": "Sıklık kelimesi fiilden önce gelir."}, "practices": [{"tr": "Her zaman kahve içerim.", "en": "I always drink coffee.", "keywords": []}, {"tr": "Nadiren televizyon izlerim.", "en": "I rarely watch TV.", "keywords": []}], "ord": 40, "why": "Sıklık kelimesi fiilin hemen önüne gelir, çünkü \"ne sıklıkla yapıyorum\" fiili tarif eder: I usually walk. Be fiilinden sonra gelir: I'm always tired."}, {"id": 56, "level": "S6", "title": "Buluşma ayarla", "pattern": "Are you free ...?", "want": "Biriyle görüşmek, boş mu diye sormak ya da saat ayarlamak istiyorsan", "say": "Are you free ...?  /  What time works for you?  /  See you at ...", "steps": ["Müsait mi diye Are you free tomorrow? sor.", "Saat için What time works for you? de, kapatırken See you at seven. de."], "examples": [{"tr": "Yarın boş musun?", "en": "Are you free tomorrow?"}, {"tr": "Sana hangi saat uyar?", "en": "What time works for you?"}, {"tr": "Yedide görüşürüz.", "en": "See you at seven."}], "trap": {"title": "Dikkat", "wrong": "We see us at seven", "correct": "See you at seven", "detail": "Görüşürüz için See you de."}, "practices": [{"tr": "Cuma müsait misin?", "en": "Are you free on Friday?", "keywords": []}, {"tr": "Tamam, bana uyar.", "en": "Sure, that works for me.", "keywords": []}], "ord": 61, "why": "Buluşma kurarken sırayla git: önce müsait mi diye sor (Are you free), sonra saati birlikte belirle (What time works), en son kapat (See you at ...)."}, {"id": 57, "level": "S7", "title": "Bir olayı anlat", "pattern": "First ... then ... after that ... suddenly ... in the end ...", "want": "Başından geçen bir olayı sırayla anlatmak istiyorsan", "say": "First ... then ... after that ... suddenly ... in the end ...", "steps": ["Olayları sırayla bağla: First, then, after that.", "Beklenmedik şey için Suddenly, sonuç için In the end de."], "examples": [{"tr": "Önce eve gittim, sonra yemek yedim.", "en": "First I went home, then I ate."}, {"tr": "Birden telefon çaldı.", "en": "Suddenly the phone rang."}, {"tr": "Sonunda uyuyakaldım.", "en": "In the end, I fell asleep."}], "trap": {"title": "Dikkat", "wrong": "At first then", "correct": "First, then", "detail": "Sıralamada First, then kullan."}, "practices": [{"tr": "Daha sonra onu aradım.", "en": "After that, I called him.", "keywords": []}, {"tr": "Sonunda anladım.", "en": "In the end, I understood.", "keywords": []}], "ord": 78, "why": "Olayı sırayla anlatırken bağlaçlar (first, then, suddenly) dinleyicinin sırayı takip etmesini sağlar. Fiiller geçmiş zamanda kalır."}, {"id": 58, "level": "S8", "title": "Katılıyorum, katılmıyorum", "pattern": "I agree.", "want": "Bir fikre katıldığını ya da katılmadığını söylemek istiyorsan", "say": "I agree.  /  Exactly!  /  Me too.  /  I'm not so sure.  /  I don't think so.", "steps": ["Katılıyorsan I agree, Exactly ya da Me too de.", "Katılmıyorsan nazikçe I'm not so sure ya da I don't think so de."], "examples": [{"tr": "Katılıyorum.", "en": "I agree."}, {"tr": "Ben de.", "en": "Me too."}, {"tr": "Pek emin değilim.", "en": "I'm not so sure."}], "trap": {"title": "Dikkat", "wrong": "I am agree", "correct": "I agree", "detail": "agree fiildir, am ekleme."}, "practices": [{"tr": "Kesinlikle!", "en": "Exactly!", "keywords": []}, {"tr": "Bence öyle değil.", "en": "I don't think so.", "keywords": []}], "ord": 83, "why": "Katılırken kısa kalıp, katılmazken yumuşatıcı (I'm not so sure) kullanmak tartışmayı sertleştirmez."}, {"id": 59, "level": "S5", "title": "Sohbeti sürdür", "pattern": "Really?", "want": "Karşındaki anlatırken ilgilendiğini göstermek istiyorsan", "say": "Really?  /  That's great!  /  I can't believe it!  /  What happened?", "steps": ["Şaşırınca Really? ya da I can't believe it! de.", "Sevinince That's great!, merak edince What happened? de."], "examples": [{"tr": "Gerçekten mi?", "en": "Really?"}, {"tr": "Çok güzel!", "en": "That's great!"}, {"tr": "Ne oldu?", "en": "What happened?"}], "trap": {"title": "Dikkat", "wrong": "Is it true really", "correct": "Really?", "detail": "Tek kelime yeter: Really?"}, "practices": [{"tr": "İnanamıyorum!", "en": "I can't believe it!", "keywords": []}, {"tr": "Sonra ne oldu?", "en": "What happened next?", "keywords": []}], "ord": 50, "why": "Karşındaki anlatırken kısa tepkiler verirsin, bu ilgilendiğini gösterir. Uzun cümle kurman gerekmez."}, {"id": 60, "level": "S1", "title": "Kısa ve doğal cevaplar", "pattern": "Yes, I do.", "want": "Bir soruya kısa, doğal cevap vermek istiyorsan (evet, hayır, tabii, pek değil)", "say": "Yes, I do.  /  No, I don't.  /  Sure.  /  Of course.  /  Not really.", "steps": ["Do you ...? sorusuna Yes, I do. ya da No, I don't. de.", "Daha rahat cevap için Sure, Of course, Not really kullan."], "examples": [{"tr": "Kahve içer misin? — Evet.", "en": "Do you drink coffee? — Yes, I do."}, {"tr": "Hazır mısın? — Evet.", "en": "Are you ready? — Yes, I am."}, {"tr": "Beğendin mi? — Pek değil.", "en": "Do you like it? — Not really."}], "trap": {"title": "Dikkat", "wrong": "Yes, I drink", "correct": "Yes, I do", "detail": "Kısa cevapta fiili tekrar etme, do de."}, "practices": [{"tr": "Tabii ki.", "en": "Of course.", "keywords": []}, {"tr": "Hayır, değilim.", "en": "No, I'm not.", "keywords": []}], "ord": 5, "why": "İngilizcede cevapta soruyu soran yardımcı kelimeyi tekrar edersin: Do you ...? → Yes, I do. Asıl fiili tekrar etmezsin."}, {"id": 61, "level": "S5", "title": "Aile ve arkadaşlarla sohbet", "pattern": "How's it going?", "want": "Aile ve arkadaşlarınla rahat konuşmak istiyorsan", "say": "How's it going?  /  Not bad.  /  Would you like to grab a coffee?  /  I miss you.  /  Take care.", "steps": ["Selamlaşırken How's it going? de, cevapta Not bad ya da Good, thanks de.", "Teklif için Would you like to ...?, ayrılırken Take care. de."], "examples": [{"tr": "Nasıl gidiyor? — Fena değil.", "en": "How's it going? — Not bad."}, {"tr": "Kahve içmeye gelir misin?", "en": "Would you like to grab a coffee?"}, {"tr": "Seni özledim.", "en": "I miss you."}], "trap": {"title": "Dikkat", "wrong": "I lost you", "correct": "I miss you", "detail": "Özlemek için miss kullan."}, "practices": [{"tr": "Kendine iyi bak.", "en": "Take care.", "keywords": []}, {"tr": "Yakında görüşürüz.", "en": "See you soon.", "keywords": []}], "ord": 47, "why": "Samimi ortamda kısa ve rahat kalıplar kullanılır. Resmi ortamda aynı şeyi How are you? ile söylersin."}, {"id": 62, "level": "S5", "title": "İş yerinde", "pattern": "Could you send me ...?", "want": "İş arkadaşınla konuşurken ya da yazışırken", "say": "Could you send me ...?  /  Let me check.  /  I'll get back to you.  /  I'm running late.", "steps": ["Bir şey isterken Could you send me ...? de.", "Zaman kazanmak için Let me check, sonra dönmek için I'll get back to you de."], "examples": [{"tr": "Bana dosyayı gönderir misin?", "en": "Could you send me the file?"}, {"tr": "Bir kontrol edeyim.", "en": "Let me check."}, {"tr": "Sana döneceğim.", "en": "I'll get back to you."}], "trap": {"title": "Dikkat", "wrong": "I return to you", "correct": "I'll get back to you", "detail": "Geri dönmek için get back kullan."}, "practices": [{"tr": "Geç kalıyorum.", "en": "I'm running late.", "keywords": []}, {"tr": "Toplantı kaçta?", "en": "What time is the meeting?", "keywords": []}], "ord": 48, "why": "İş yazışmasında kibarlık önemlidir: Could you ve Let me check çok kullanılır. I'll get back to you söz verir ama süre belirtmez."}, {"id": 63, "level": "S5", "title": "Telefonda konuşma", "pattern": "Hello, this is ...", "want": "Telefonda biriyle konuşmak istiyorsan", "say": "Hello, this is ...  /  Can I speak to ...?  /  Hold on.  /  I'll call you back.", "steps": ["Kendini tanıtmak için this is de: Hello, this is Ali.", "Birini istemek için Can I speak to ...? de."], "examples": [{"tr": "Merhaba, ben Ali.", "en": "Hello, this is Ali."}, {"tr": "Ayşe ile konuşabilir miyim?", "en": "Can I speak to Ayşe?"}, {"tr": "Seni sonra ararım.", "en": "I'll call you back."}], "trap": {"title": "Dikkat", "wrong": "I am Ali", "correct": "this is Ali", "detail": "Telefonda I am değil this is de."}, "practices": [{"tr": "Bir dakika bekle.", "en": "Hold on a second.", "keywords": []}, {"tr": "Sesin gelmiyor.", "en": "I can't hear you.", "keywords": []}], "ord": 49, "why": "Telefonda yüz yüze değilsin, bu yüzden I am yerine this is dersin. Karşı tarafı Can I speak to ...? ile istersin."}, {"id": 64, "level": "S5", "title": "Tebrik et, teselli et", "pattern": "Congratulations!", "want": "Birinin sevincini paylaşmak ya da üzüldüğünde teselli etmek istiyorsan", "say": "Congratulations!  /  I'm so happy for you.  /  I'm so sorry to hear that.  /  Don't worry.", "steps": ["Sevinç için Congratulations! ya da I'm so happy for you de.", "Üzüntü için I'm so sorry to hear that, sakinleştirmek için Don't worry de."], "examples": [{"tr": "Tebrikler!", "en": "Congratulations!"}, {"tr": "Buna çok üzüldüm.", "en": "I'm so sorry to hear that."}, {"tr": "Merak etme.", "en": "Don't worry."}], "trap": {"title": "Dikkat", "wrong": "I'm sorry you", "correct": "I'm so sorry to hear that", "detail": "Üzüntüde tam kalıbı kullan."}, "practices": [{"tr": "Senin adına çok sevindim.", "en": "I'm so happy for you.", "keywords": []}, {"tr": "Her şey düzelecek.", "en": "Everything will be okay.", "keywords": []}], "ord": 52, "why": "Mutlu haberde Congratulations, üzücü haberde I'm so sorry to hear that kullan. Haberin türü kalıbı belirler."}, {"id": 65, "level": "S4", "title": "Ali'nin arabası, annemin evi", "pattern": "kişi + 's + şey", "want": "Bir şeyin kime ait olduğunu söylemek istiyorsan (Ali'nin kırmızı arabası, annemin evi)", "say": "kişi + 's + şey  →  Ali's car  /  my mother's house", "steps": ["Türkçedeki -nin ekini 's yap ve eşyayı arkasına koy: Ali's car.", "Önce sahibi, sonra eşyayı söyle; renk gibi kelimeler araya girer: Ali's red car."], "examples": [{"tr": "Ali'nin kırmızı arabası", "en": "Ali's red car"}, {"tr": "Annemin evi", "en": "my mother's house"}, {"tr": "Bu kimin telefonu?", "en": "Whose phone is this?"}], "trap": {"title": "Dikkat", "wrong": "the car of Ali", "correct": "Ali's car", "detail": "Kişiler için of kullanma, 's ekle."}, "practices": [{"tr": "Bu Ayşe'nin çantası.", "en": "This is Ayşe's bag.", "keywords": []}, {"tr": "Arkadaşımın kardeşi", "en": "my friend's brother", "keywords": []}], "ord": 33, "why": "Sahip bir kişiyse 's eklersin, sahip bir nesneyse genelde of kullanırsın (the door of the room). Kişilerde 's en doğal yoldur."}, {"id": 66, "level": "S9", "title": "Beni arayan adam", "pattern": "the man who called me", "want": "Birini, yaptığı işle tarif etmek istiyorsan (beni arayan adam, burada çalışan insanlar)", "say": "the man who called me  /  the woman who is talking  /  the people who work here", "steps": ["Önce kişiyi söyle: the man.", "Sonra who koy. who, \"yapan kişi\" demektir: the man who ...", "En sona, o kişinin yaptığı işi, işin ne zaman olduğuna göre söyle: adam dün aradıysa called, şu an arıyorsa is calling, her gün arıyorsa calls. Sonuç: the man who called me."], "examples": [{"tr": "Beni arayan adam (dün aradı)", "en": "the man who called me"}, {"tr": "Şu an konuşan kadın", "en": "the woman who is talking"}, {"tr": "Burada çalışan insanlar", "en": "the people who work here"}], "trap": {"title": "Dikkat", "wrong": "the man who he called me", "correct": "the man who called me", "detail": "who zaten \"adam\"ın yerini tutuyor; arkasına he ekleme."}, "practices": [{"tr": "Bana yardım eden kadın", "en": "the woman who helped me", "keywords": []}, {"tr": "Burada çalışan insanlar", "en": "the people who work here", "keywords": []}], "ord": 93, "why": "Zamanı Türkçedeki ekten değil, işin gerçekte ne zaman olduğundan seç: adam dün aradıysa called, şu an arıyorsa is calling."}, {"id": 67, "level": "S9", "title": "Kelimeyi bulamadığında", "pattern": "It's a thing that ...", "want": "Aklına kelime gelmediğinde tarif ederek derdini anlatmak istiyorsan", "say": "It's a thing that ...  /  You know, the one who ...  /  What's it called?", "steps": ["Kelimeyi bilmiyorsan ne işe yaradığını anlat: It's a thing you use to cut.", "Karşındakine sor: What's it called? ya da You know, the one that ..."], "examples": [{"tr": "Kesmek için kullandığın şey", "en": "It's a thing you use to cut"}, {"tr": "Adı neydi?", "en": "What's it called?"}, {"tr": "Hani şu, o şey...", "en": "You know, the thing that..."}], "trap": {"title": "Dikkat", "wrong": "I don't know the word. (sustun)", "correct": "I don't know the word, but it's a thing that ...", "detail": "Susma; tarif et, karşındaki yardım eder."}, "practices": [{"tr": "Kapıyı açmak için kullanılan şey", "en": "It's the thing you use to open the door", "keywords": []}, {"tr": "Bunun İngilizcesi ne?", "en": "What's this called in English?", "keywords": []}], "ord": 92, "why": "Kelimeyi bilmiyorsan susmak yerine tarif et: ne işe yaradığını ya da neye benzediğini söyle. Dinleyen genelde yardım eder."}, {"id": 68, "level": "S8", "title": "Yine de, rağmen", "pattern": "but ... anyway", "want": "\"Yorgundum ama yine de gittim\", \"yağmura rağmen\" demek istiyorsan", "say": "but ... anyway  /  even though ...  /  still", "steps": ["En kolayı but ve anyway: I was tired, but I went anyway.", "Biraz daha güçlü: Even though I was tired, I went."], "examples": [{"tr": "Yorgundum ama yine de gittim.", "en": "I was tired, but I went anyway."}, {"tr": "Yağmura rağmen dışarı çıktık.", "en": "Even though it was raining, we went out."}, {"tr": "Hâlâ istiyorum.", "en": "I still want it."}], "trap": {"title": "Dikkat", "wrong": "Although I was tired, but I went", "correct": "Although I was tired, I went", "detail": "although ve but aynı cümlede kullanılmaz."}, "practices": [{"tr": "Pahalı olmasına rağmen aldım.", "en": "Even though it was expensive, I bought it.", "keywords": []}, {"tr": "Yine de gelmek istiyorum.", "en": "I still want to come.", "keywords": []}], "ord": 89, "why": "\"Yine de\" için but ile anyway yeterli. Daha güçlü istersen even though kullan, ama aynı cümlede but ekleme."}, {"id": 69, "level": "S9", "title": "Halının altındaki kitap", "pattern": "şey + yer", "want": "Bir şeyi bulunduğu yerle ya da özelliğiyle tarif etmek istiyorsan (halının altındaki kitap, kırmızı elbiseli kız)", "say": "şey + yer  →  the book under the carpet  /  the girl in the red dress", "steps": ["Türkçede asıl şey sonda gelir, İngilizcede başa al: the book.", "Sonra nerede olduğunu ya da neyle olduğunu ekle: under the carpet, on the sofa, in the red dress, with a beard."], "examples": [{"tr": "Halının altındaki kitap", "en": "the book under the carpet"}, {"tr": "Kanepedeki kedi", "en": "the cat on the sofa"}, {"tr": "Sakallı adam", "en": "the man with a beard"}], "trap": {"title": "Dikkat", "wrong": "the under the carpet book", "correct": "the book under the carpet", "detail": "Yeri Türkçedeki gibi başa koyma; önce şeyi söyle."}, "practices": [{"tr": "Masanın üstündeki telefon", "en": "the phone on the table", "keywords": []}, {"tr": "Kırmızı elbiseli kız", "en": "the girl in the red dress", "keywords": []}], "ord": 95, "why": "Türkçede açıklama önde, asıl şey sonda gelir. İngilizcede tersi: önce asıl şeyi söyle, açıklamayı sonra ekle."}, {"id": 70, "level": "S9", "title": "Araştırma yapan bilim insanları", "pattern": "kişi + fiil-ing", "want": "Bir kişinin ya da şeyin ne yaptığını söyleyerek tarif etmek istiyorsan (araştırma yapan bilim insanları, dışarıda bekleyen insanlar)", "say": "kişi + fiil-ing  →  scientists doing research  /  scientists who do research", "steps": ["Önce kişiyi söyle, sonra Türkçedeki -en / -an yerine fiile -ing ekle: people waiting outside.", "Daha rahat istersen who kullan: scientists who do research."], "examples": [{"tr": "Araştırma yapan bilim insanları", "en": "scientists doing research"}, {"tr": "Dışarıda bekleyen insanlar", "en": "the people waiting outside"}, {"tr": "Şapka takan kadın", "en": "a woman wearing a hat"}], "trap": {"title": "Dikkat", "wrong": "doing research scientists", "correct": "scientists doing research", "detail": "Fiil-ing kelimesi kişiden sonra gelir."}, "practices": [{"tr": "Dışarıda bekleyen insanlar", "en": "the people waiting outside", "keywords": []}, {"tr": "Şapka takan adam", "en": "the man wearing a hat", "keywords": []}], "ord": 96, "why": "fiil-ing aynı anda yapılan işi anlatır ve who ile kurulan cümlenin kısa hâlidir: scientists doing research = scientists who do research."}, {"id": 72, "level": "S9", "title": "Okuduğum kitap", "pattern": "the book that I read", "want": "Bir şeyi, senin onunla yaptığın işle tarif etmek istiyorsan (okuduğum kitap, dün gördüğüm film)", "say": "the book that I read  /  the book I'm reading  /  the movie I saw yesterday", "steps": ["Önce şeyi söyle: the book.", "Sonra that koy, ardından yapan kişiyi ve fiili ekle: the book that I read. Türkçede \"ben\" öne gelir (okuduğum), İngilizcede sonra gelir (that I read).", "Türkçedeki -dığım eki zamanı söylemez; zamanı sen seçersin: kitabı bitirdiysen I read, hâlâ okuyorsan I'm reading. İstersen that'i atabilirsin: the book I read."], "examples": [{"tr": "Okuduğum kitap (bitirdim)", "en": "the book that I read"}, {"tr": "Okuduğum kitap (şu an okuyorum)", "en": "the book that I'm reading"}, {"tr": "Dün gördüğüm film", "en": "the movie I saw yesterday"}], "trap": {"title": "Dikkat", "wrong": "the book that I read it", "correct": "the book that I read", "detail": "that zaten kitabın yerini tutuyor; sonuna it ekleme."}, "practices": [{"tr": "Aldığın hediye", "en": "the gift that you bought", "keywords": []}, {"tr": "Dün izlediğim film", "en": "the movie I watched yesterday", "keywords": []}], "ord": 94, "why": "who / that'ten sonra \"işi kim yapıyor?\" diye bak. Yapan başkasıysa who + fiil, sen yapıyorsan that + I + fiil."}, {"id": 73, "level": "S7", "title": "Biri şöyle dedi", "pattern": "He said (that) ...", "want": "Birinin söylediği bir şeyi başkasına aktarmak istiyorsan (yorgun olduğunu söyledi, böyle yapman lazım demiş)", "say": "He said (that) ...  /  She told me (that) ...", "steps": ["Önce kim söyledi: He said ya da She told me.", "Sonra söylenen şeyi ekle, that atılabilir: He said he was tired.", "Söylenen şey geçmişte kaldıysa fiili bir adım geçmişe al: am → was, can → could, will → would."], "examples": [{"tr": "Yorgun olduğunu söyledi.", "en": "He said he was tired."}, {"tr": "Böyle yapman lazım demiş.", "en": "She said you need to do it like this."}, {"tr": "Yarın geleceğini söyledi.", "en": "He said he would come tomorrow."}], "trap": {"title": "Dikkat", "wrong": "He said me he was tired", "correct": "He said he was tired  /  He told me he was tired", "detail": "said arkasına kişi almaz; kime dediğini söyleyeceksen told kullan."}, "practices": [{"tr": "Hasta olduğunu söyledi.", "en": "She said she was sick.", "keywords": []}, {"tr": "Bana yardım edeceğini söyledi.", "en": "He told me he would help me.", "keywords": []}], "why": "said ile told farkı: said + ne söylendi, told + kime + ne söylendi. Söz artık geçmişte kaldığı için fiil bir adım geçmişe kayar; ama bilgi hâlâ geçerliyse kaydırmasan da olur: She says she is tired.", "ord": 79}, {"id": 74, "level": "S7", "title": "Biri şöyle sordu", "pattern": "He asked if ...", "want": "Birinin sorduğu bir soruyu başkasına aktarmak istiyorsan (şu nasıl olur diye sormuş, hazır mıyım diye sordu)", "say": "He asked if ...  /  She asked how / what / where ...", "steps": ["Evet / hayır sorusunu aktarırken if koy: He asked me if I was ready.", "Soru kelimeli soruda o kelimeyi koru: She asked how it works.", "Aktardığın cümle artık soru değil, düz cümledir: Do / did ekleme, soru sırası kurma."], "examples": [{"tr": "Şu nasıl olur diye sordu.", "en": "He asked how that works."}, {"tr": "Hazır mıyım diye sordu.", "en": "He asked if I was ready."}, {"tr": "Nerede yaşadığımı sordu.", "en": "She asked where I lived."}], "trap": {"title": "Dikkat", "wrong": "He asked me where did I live", "correct": "He asked me where I lived", "detail": "Aktarılan soruda do / did kullanılmaz ve sıra düz cümle gibi olur."}, "practices": [{"tr": "Saat kaç olduğunu sordu.", "en": "He asked what time it was.", "keywords": []}, {"tr": "Gelip gelmeyeceğimi sordu.", "en": "She asked if I would come.", "keywords": []}], "why": "Aktarılan soru artık gerçek bir soru değil, anlattığın bir cümle olur. Bu yüzden soru işareti, do ve did kalkar. Zaman yine işin ne zaman olduğuna göre bir adım geçmişe kayar.", "ord": 80}, {"id": 75, "level": "S7", "title": "Biri sormuş, diğeri cevap vermiş", "pattern": "Someone asked ..., and the other person said ...", "want": "Duyduğun ya da okuduğun bir konuşmayı özetlemek istiyorsan (biri sormuş, diğeri böyle yap demiş; duydum ki; anlaşılan)", "say": "Someone asked ..., and the other person said ...  /  I heard that ...  /  Apparently, ...", "steps": ["Soran kişiyi söyle: Someone asked how it works.", "Cevap vereni ekle: and the other person said ... ya da and he replied ...", "Kendin görmediysen, duyduğunu ya da okuduğunu belirt: I heard that ... / I read that ... / Apparently, ..."], "examples": [{"tr": "Biri nasıl çalıştığını sormuş, diğeri böyle yapman lazım demiş.", "en": "Someone asked how it works, and the other person said you need to do it like this."}, {"tr": "Duydum ki yarın tatilmiş.", "en": "I heard that tomorrow is a holiday."}, {"tr": "Anlaşılan sınavı ertelemişler.", "en": "Apparently, they postponed the exam."}], "trap": {"title": "Dikkat", "wrong": "People says it is good", "correct": "People say it is good", "detail": "people çoğuldur, say s almaz."}, "practices": [{"tr": "Okuduğuma göre fiyatlar artmış.", "en": "I read that prices went up.", "keywords": []}, {"tr": "Biri nerede olduğunu sormuş.", "en": "Someone asked where it was.", "keywords": []}], "why": "Türkçedeki -miş eki \"ben görmedim, duydum\" anlamı taşır. İngilizcede fiil değişmez; bu bilgiyi I heard that, I read that, apparently ya da they say ile verirsin.", "ord": 81}, {"id": 76, "level": "S4", "title": "a mı, the mı", "pattern": "a / an + yeni bahsettiğin şey", "want": "Bir şeyden ilk kez mi bahsediyorsun, yoksa ikinizin de bildiği bir şeyden mi? (bir araba mı, o araba mı)", "say": "a / an + yeni bahsettiğin şey  /  the + ikinizin de bildiği şey", "steps": ["İlk kez söylüyorsan a de, sesli harfle başlıyorsa an de: I have a car.", "Karşındaki hangisini kastettiğini biliyorsa the de: The car is outside."], "examples": [{"tr": "Bir arabam var.", "en": "I have a car."}, {"tr": "Araba dışarıda.", "en": "The car is outside."}, {"tr": "Bir elma yedim.", "en": "I ate an apple."}], "trap": {"title": "Dikkat", "wrong": "I have car", "correct": "I have a car", "detail": "Tek sayılabilir şeyin önünde a, an ya da the olmalı."}, "practices": [{"tr": "Bir sorum var.", "en": "I have a question.", "keywords": []}, {"tr": "Kapıyı kapat.", "en": "Close the door.", "keywords": []}], "why": "Türkçede bu ayrım yok, o yüzden kendine \"karşımdaki hangisini biliyor?\" diye sor. Bilmiyorsa a, biliyorsa the. İlk söylerken a, ikinci söylerken the: I have a dog. The dog is big.", "ord": 31}, {"id": 77, "level": "S4", "title": "Beni, ona, bize", "pattern": "me / you / him / her / us / them", "want": "Bir işi kime yaptığını ya da kimin yaptığını söylemek istiyorsan (beni aradı, ona verdim, bize yardım et)", "say": "me / you / him / her / us / them  →  She called me.  /  I gave it to him.", "steps": ["İşi yapan için I, he, she, we, they; işten etkilenen için me, him, her, us, them kullan.", "Etkilenen kişiyi fiilin arkasına koy: She called me."], "examples": [{"tr": "Beni aradı.", "en": "She called me."}, {"tr": "Ona verdim.", "en": "I gave it to him."}, {"tr": "Bize yardım eder misin?", "en": "Can you help us?"}], "trap": {"title": "Dikkat", "wrong": "She called I", "correct": "She called me", "detail": "Fiilden sonra gelen kişi me, him, her gibi olur."}, "practices": [{"tr": "Onu görüyorum.", "en": "I see him.", "keywords": []}, {"tr": "Bana söyle.", "en": "Tell me.", "keywords": []}], "why": "Türkçede kişiye ek gelir (beni, ona). İngilizcede kelimenin kendisi değişir: I → me, he → him. Kişi işi yapıyorsa I / he, işten etkileniyorsa me / him.", "ord": 32}, {"id": 78, "level": "S4", "title": "in, on, at", "pattern": "at (nokta)", "want": "Bir şeyin nerede ya da ne zaman olduğunu söylemek istiyorsan (evde, masada, saat beşte, pazartesi)", "say": "at (nokta)  /  on (yüzey, gün)  /  in (içi, uzun süre)", "steps": ["Küçük bir nokta için at: at the door, at five.", "Yüzey ve günler için on: on the table, on Monday.", "İçi ve uzun süreler için in: in the kitchen, in July."], "examples": [{"tr": "Saat beşte.", "en": "at five"}, {"tr": "Pazartesi günü.", "en": "on Monday"}, {"tr": "Mutfakta.", "en": "in the kitchen"}], "trap": {"title": "Dikkat", "wrong": "in Monday", "correct": "on Monday", "detail": "Günlerde on kullan."}, "practices": [{"tr": "Masanın üstünde.", "en": "on the table", "keywords": []}, {"tr": "Temmuzda.", "en": "in July", "keywords": []}], "why": "Türkçedeki -de eki hepsini karşılar, İngilizce şekle bakar: nokta = at, düz yüzey = on, içi = in. Kafanda nokta, yüzey ve kutu hayal et.", "ord": 42}, {"id": 79, "level": "S4", "title": "Severim, nefret ederim", "pattern": "I like / love / hate / enjoy + fiil-ing", "want": "Neyi sevdiğini, sevmediğini ya da neden keyif aldığını söylemek istiyorsan", "say": "I like / love / hate / enjoy + fiil-ing  /  + şey", "steps": ["Sevgiyi derecelendir: like, love; sevmemek için don't like, hate.", "Yaptığın bir işi seviyorsan fiile -ing ekle: I enjoy cooking."], "examples": [{"tr": "Yemek yapmayı severim.", "en": "I enjoy cooking."}, {"tr": "Müziği çok severim.", "en": "I love music."}, {"tr": "Beklemekten nefret ederim.", "en": "I hate waiting."}], "trap": {"title": "Dikkat", "wrong": "I like to cooking", "correct": "I like cooking", "detail": "like ve enjoy'dan sonra -ing gelir, to gelmez."}, "practices": [{"tr": "Yürümeyi severim.", "en": "I like walking.", "keywords": []}, {"tr": "Kalabalığı sevmem.", "en": "I don't like crowds.", "keywords": []}], "why": "Bir faaliyeti sevdiğini söylerken -ing kullanırsın, çünkü \"yapmak\"ı bir şey gibi sayarsın: cooking = yemek yapmak. enjoy her zaman -ing ister.", "ord": 37}, {"id": 80, "level": "S2", "title": "Yardım teklif et", "pattern": "Can I help you?", "want": "Birine yardım etmeyi teklif etmek ya da yardıma ihtiyacı olup olmadığını sormak istiyorsan", "say": "Can I help you?  /  Do you need any help?  /  Would you like me to ...?  /  Let me ...", "steps": ["Genel teklif için Can I help you? ya da Do you need any help? de.", "Belli bir iş için Would you like me to + fiil? ya da Let me + fiil de."], "examples": [{"tr": "Yardım edebilir miyim?", "en": "Can I help you?"}, {"tr": "Yardıma ihtiyacın var mı?", "en": "Do you need any help?"}, {"tr": "Ben taşıyayım.", "en": "Let me carry it."}], "trap": {"title": "Dikkat", "wrong": "Do I help you?", "correct": "Can I help you?", "detail": "Teklif için Can I kullan."}, "practices": [{"tr": "Çantanı taşımamı ister misin?", "en": "Would you like me to carry your bag?", "keywords": []}, {"tr": "Bakayım.", "en": "Let me see.", "keywords": []}], "why": "Can I ... genel bir teklif, Would you like me to ... belli bir işi önerir ve daha kibardır. Let me ... ise teklifi karar gibi söyler.", "ord": 21}, {"id": 81, "level": "S7", "title": "Ne zaman oldu", "pattern": "yesterday / last week / 2 days ago", "want": "Bir şeyin ne zaman olduğunu söylemek istiyorsan (dün, iki gün önce, gelecek hafta)", "say": "yesterday / last week / 2 days ago  /  tomorrow / next week / in 2 days", "steps": ["Geçmiş için yesterday, last week ya da sayı + ago de: two days ago.", "Gelecek için tomorrow, next week ya da in + süre de: in two days."], "examples": [{"tr": "İki gün önce geldi.", "en": "He came two days ago."}, {"tr": "Gelecek hafta gidiyorum.", "en": "I'm going next week."}, {"tr": "İki gün sonra buluşuruz.", "en": "We'll meet in two days."}], "trap": {"title": "Dikkat", "wrong": "two days before", "correct": "two days ago", "detail": "Şimdiden geriye bakarken ago kullan, before değil."}, "practices": [{"tr": "Üç ay önce başladım.", "en": "I started three months ago.", "keywords": []}, {"tr": "Beş dakikaya geliyorum.", "en": "I'm coming in five minutes.", "keywords": []}], "why": "Türkçede \"önce\" ve \"sonra\" her yerde aynı. İngilizcede şimdiden bakıyorsan ago (geçmiş) ya da in (gelecek) kullanırsın. before ve after başka bir olaya göre kullanılır.", "ord": 68}, {"id": 82, "level": "S5", "title": "Sohbet aç", "pattern": "How was your weekend?", "want": "Biriyle karşılaştığında sohbet başlatmak istiyorsan (hafta sonu, hava, iş)", "say": "How was your weekend?  /  What do you do?  /  Nice weather today, isn't it?", "steps": ["Güvenli konularla başla: hafta sonu, hava, iş.", "Cevaptan sonra soruyu karşıdakine çevir: How about you?"], "examples": [{"tr": "Hafta sonun nasıldı?", "en": "How was your weekend?"}, {"tr": "Ne iş yapıyorsun?", "en": "What do you do?"}, {"tr": "Bugün hava güzel, değil mi?", "en": "Nice weather today, isn't it?"}], "trap": {"title": "Dikkat", "wrong": "How is your weekend?", "correct": "How was your weekend?", "detail": "Bitmiş hafta sonu için was kullan."}, "practices": [{"tr": "Günün nasıl geçti?", "en": "How was your day?", "keywords": []}, {"tr": "Sen ne dersin?", "en": "How about you?", "keywords": []}], "why": "İngilizce konuşanlar yabancıyla bile kısa sohbet açar. Konu önemli değil, sıcaklık önemli. Önce soruyu sorarsın, sonra aynı soruyu sana çevirirler.", "ord": 46}, {"id": 83, "level": "S1", "title": "Ne demek? İngilizcesi ne?", "pattern": "What does ... mean?", "want": "Bir kelimenin anlamını sormak ya da Türkçesini İngilizce söylemek istiyorsan", "say": "What does ... mean?  /  How do you say ... in English?  /  How do you spell ...?", "steps": ["Anlamını sormak için What does ... mean? de.", "İngilizcesini sormak için How do you say ... in English? de."], "examples": [{"tr": "“Appointment” ne demek?", "en": "What does “appointment” mean?"}, {"tr": "Bunun İngilizcesi ne?", "en": "How do you say this in English?"}, {"tr": "Nasıl yazılıyor?", "en": "How do you spell it?"}], "trap": {"title": "Dikkat", "wrong": "What means appointment?", "correct": "What does appointment mean?", "detail": "Soru kelimesinden sonra does ekle."}, "practices": [{"tr": "Bunun anlamı ne?", "en": "What does this mean?", "keywords": []}, {"tr": "Adını nasıl yazarsın?", "en": "How do you spell your name?", "keywords": []}], "why": "Bir kelimeyi bilmemek sorun değil, sormak konuşmayı hızlandırır. Anlamı soruyorsan mean, söyleyişi soruyorsan say kullanırsın.", "ord": 3}, {"id": 84, "level": "S5", "title": "Davet et, kabul et, reddet", "pattern": "Would you like to ...?", "want": "Birini bir şeye davet etmek, kabul etmek ya da kibarca reddetmek istiyorsan", "say": "Would you like to ...?  /  I'd love to!  /  I'd love to, but ...", "steps": ["Davet için Would you like to + fiil? de.", "Kabul için I'd love to!, ret için I'd love to, but ... + sebep de."], "examples": [{"tr": "Akşam yemeğine gelir misin?", "en": "Would you like to come for dinner?"}, {"tr": "Çok isterim!", "en": "I'd love to!"}, {"tr": "Çok isterdim ama çalışmam lazım.", "en": "I'd love to, but I have to work."}], "trap": {"title": "Dikkat", "wrong": "No, I can't", "correct": "I'd love to, but I can't", "detail": "Direkt ret sert durur; önce I'd love to, sonra sebebi söyle."}, "practices": [{"tr": "Kahveye gelir misin?", "en": "Would you like to come for coffee?", "keywords": []}, {"tr": "Maalesef gelemem.", "en": "I'm afraid I can't.", "keywords": []}], "why": "Davete direkt \"hayır\" demek İngilizcede sert gelir. Önce teşekkür et ya da I'd love to de, sonra sebebi söyle. Böylece ilişki bozulmaz.", "ord": 53}, {"id": 85, "level": "S6", "title": "Kesin değil: belki, muhtemelen", "pattern": "I might + fiil", "want": "Bir şeyin olabileceğini ama emin olmadığını söylemek istiyorsan (belki giderim, muhtemelen gelirim)", "say": "I might + fiil  /  I'll probably + fiil  /  I'm not sure", "steps": ["Yarı yarıya ihtimal için I might + fiil de.", "Daha yüksek ihtimal için I'll probably + fiil de."], "examples": [{"tr": "Belki giderim.", "en": "I might go."}, {"tr": "Muhtemelen geç kalırım.", "en": "I'll probably be late."}, {"tr": "Emin değilim.", "en": "I'm not sure."}], "trap": {"title": "Dikkat", "wrong": "I might to go", "correct": "I might go", "detail": "might'tan sonra to gelmez."}, "practices": [{"tr": "Yağmur yağabilir.", "en": "It might rain.", "keywords": []}, {"tr": "Muhtemelen eve giderim.", "en": "I'll probably go home.", "keywords": []}], "why": "will kesin söz verir, might ve probably kesinlik derecesini düşürür. Plan netleşmediyse will yerine bunları kullan.", "ord": 57}, {"id": 86, "level": "S7", "title": "Geçmişten önce olan: yapmıştım (Past Perfect)", "pattern": "I had + fiilin üçüncü hâli", "want": "Geçmişteki bir olaydan daha önce olmuş bir şeyi söylemek istiyorsan (ben gelmeden gitmişti, zaten yemiştim)", "say": "I had + fiilin üçüncü hâli  →  I had already eaten.  /  He had left before I came.", "steps": ["Önce hangisinin daha önce olduğunu bul. O olay için had + üçüncü hâl kullan (eaten, left, gone).", "Sonra olan den If kısmı \"bugünkü\" gibi şimdiki zamanda kalır. will sadece sonucu söyler. Gelecek zamanı iki yere birden koyma.", "ord": 64}, {"id": 88, "level": "S6", "title": "Koşul, her zaman: ... olursa yapar (If + geniş zaman)", "pattern": "If + geniş zaman, geniş zaman", "want": "Her zaman aynı sonucu veren şeyleri söylemek istiyorsan (yorgunsam erken yatarım, suyu ısıtırsan kaynar)", "say": "If + geniş zaman, geniş zaman  →  If I'm tired, I go to bed early.", "steps": ["If ile durumu söyle.", "Sonucu da geniş zamanda söyle. \"Her zaman böyle olur\" dediğin için will koyma."], "examples": [{"tr": "Yorgunsam erken yatarım.", "en": "If I'm tired, I go to bed early."}, {"tr": "Suyu ısıtırsan kaynar.", "en": "If you heat water, it boils."}, {"tr": "Yağmur yağarsa otobüsle giderim.", "en": "If it rains, I take the bus."}], "trap": {"title": "Dikkat", "wrong": "If I am tired, I will always go", "correct": "If I'm tired, I go to bed early", "detail": "Alışkanlıkta will kullanma."}, "practices": [{"tr": "Acıkırsan ye.", "en": "If you're hungry, eat.", "keywords": []}, {"tr": "Soğuksa ceket giyerim.", "en": "If it's cold, I wear a jacket.", "keywords": []}], "why": "Gerçek koşulda tek seferlik sonuç için will kullanırsın (yağarsa kalırım), her zaman olan şey için kullanmazsın. \"Bu seferlik mi, hep mi?\" diye sor.", "ord": 65}, {"id": 89, "level": "S9", "title": "Koşul, geçmişte: ... olsaydı yapardım (If I had ...)", "pattern": "If I had + üçüncü hâli, I would have + üçüncü hâli", "want": "Geçmişte olmayan bir şeyin sonucunu söylemek istiyorsan (bilseydim gelirdim, erken çıksaydın yetişirdin)", "say": "If I had + üçüncü hâli, I would have + üçüncü hâli  →  If I had known, I would have come.", "steps": ["Olmayan geçmiş şartı If I had + üçüncü hâl ile söyle: If I had known.", "Olmayan sonucu would have + üçüncü hâl ile söyle: I would have come."], "examples": [{"tr": "Bilseydim gelirdim.", "en": "If I had known, I would have come."}, {"tr": "Erken çıksaydın yetişirdin.", "en": "If <div class="row wrap" style="margin-top:10px"><button class="btn pri" data-act="pchk" id="pchk">Kontrol et</button><button class="btn" data-act="pshow">Cevabı göster</button><button class="btn" data-act="say" data-t="${esc(c.en)}" data-r="1">🔊</button><button class="btn sp" data-act="pnext">${PS.st==='idle'?'Atla':'Sonraki'} →</button></div>${PS.st!=='idle'?`<div class="res ${PS.st==='ok'?'good':''}"><b>${PS.st==='ok'?'Harika! ✓':'Doğrusu'}</b><div>${esc(c.en)}</div></div>`:''}</div>`;
const i=$('#pans');i.oninput=()=>PS.ans=i.value;i.onkeydown=e=>{if(e.key==='Enter')$('#pchk').click()};return}
const isW=d==='words',x=c.x,front=isW?x.word:x.verb,back=isW?x.meaning+(x.examples?'\n\n'+x.examples.split('\n').slice(0,2).join('\n'):''):x.meaning+'\n\n'+(x.example||'');
el.innerHTML=`<div class="big"><div class="row"><span class="tag">${S.srs[c.k]?'Kutu '+S.srs[c.k].b:'Yeni'}</span><span class="cnt sp">${PS.i+1} / ${PS.q.length}</span></div>${pr}<div class="box flip" data-act="pflip"><div><div class="q">${esc(front)}</div>${PS.flip?`<pre style="text-align:left;margin-top:8px">${esc(back)}</pre>`:'<span class="cnt">Çevirmek için dokun (Boşluk)</span>'}</div></div>
<div class="row wrap" style="margin-top:12px"><button class="btn" data-act="say" data-t="${esc(front)}" data-r="1">🔊 Dinle</button>${PS.flip?'<button class="btn sp" data-act="pgrade" data-v="0">✗ Bilmedim (1)</button><button class="btn pri" data-act="pgrade" data-v="1">✓ Bildim (2)</button>':'<button class="btn pri sp" data-act="pflip">Cevabı göster</button>'}</div></div>`}
function pCheck(){const c=PS.q[PS.i],an=norm(PS.ans).join(' ');if(!an)return toast('Önce bir cevap yaz');const kw=c.keywords||[],ok=kw.length?kw.every(k=>norm(k).every(w=>an.split(' ').includes(w))):(()=>{const tg=[...new Set(norm(c.en))],as=new Set(norm(PS.ans));return tg.filter(w=>as.has(w)).length/tg.length>=.8})();PS.st=ok?'ok':'show';PS.n++;if(ok){PS.ok++;act();save()}pView()}
function grade(ok){const c=PS.q[PS.i],r=S.srs[c.k]||{b:0,d:0};r.b=ok?Math.min(5,r.b+1):0;r.d=day()+INT[r.b];S.srs[c.k]=r;PS.n++;if(ok)PS.ok++;act();save();PS.i++;PS.flip=false;pView()}
/* Ekle / içe-dışa aktarma */
function csv(t){if(t.charCodeAt(0)===65279)t=t.slice(1);const l=t.split(/\r?\n/)[0]||'',d=[',',';','\t'].map(c=>[c,l.split(c).length]).sort((a,b)=>b[1]-a[1])[0][0];const rows=[];let r=[],f='',q=false;
for(let i=0;i<t.length;i++){const c=t[i];if(q){if(c==='"'){if(t[i+1]==='"'){f+='"';i++}else q=false}else f+=c}else if(c==='"')q=true;else if(c===d){r.push(f);f=''}else if(c==='\n'||c==='\r'){if(c==='\r'&&t[i+1]==='\n')i++;r.push(f);f='';if(r.some(x=>x.trim()))rows.push(r);r=[]}else f+=c}
r.push(f);if(r.some(x=>x.trim()))rows.push(r);if(rows.length&&/^(kelime|word|phrasal|verb|t[uü]rk[cç]e|turkish)$/i.test(rows[0][0].trim()))rows.shift();return rows.map(x=>x.map(s=>s.trim()))}
const dl=(name,txt,type='text/csv')=>{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob(['\ufeff'+txt],{type:type+';charset=utf-8'}));a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),500)};
const toCsv=(h,rows)=>[h,...rows].map(r=>r.map(s=>`"${String(s??'').replace(/"/g,'""')}"`).join(',')).join('\n');
const FORMS={w:{l:'Kelime',f:[['Kelime *','a'],['Anlam *','b'],['Tür','c'],['Örnek cümle','d']],fmt:'Kelime,Anlam,Tür,Örnek\nabandon,Terk etmek,Fiil,He abandoned the project'},
p:{l:'Phrasal',f:[['Phrasal verb *','a'],['Anlam *','b'],['Örnek cümle','c']],fmt:'Phrasal,Anlam,Örnek\nget up,kalkmak,I get up at 7am'},
t:{l:'Cümle',f:[['Türkçe *','a'],['İngilizce *','b']],fmt:'Türkçe,İngilizce\nBunu her gün kullanıyorum.,I use this every day.'}};
function mk(kind,r){if(kind==='w')return{word:r[0],meaning:r[1],full_meaning:r[1],type:r[2]||'Kelime',guide:'',examples:r[3]||'',rank:1e4+S.c.w.length+1,isCustom:true};if(kind==='p')return{verb:r[0],meaning:r[1],example:r[2]||'',isCustom:true};return{tr:r[0],en:r[1],isCustom:true}}
function addModal(kind=({kelimeler:'w',phrasal:'p',ceviri:'t'})[S.sec]||'w'){const F=FORMS[kind],n=S.c[kind].length;
const b=modal('Kendi içeriğini ekle',`<div class="tabs">${Object.entries(FORMS).map(([k,v])=>`<button class="btn ${k===kind?'on':''}" data-act="addtab" data-k="${k}">${v.l} (${S.c[k].length})</button>`).join('')}</div>
<div class="grid" style="grid-template-columns:1fr">${F.f.map(([p,id])=>`<input type="text" id="f_${id}" placeholder="${p}" autocomplete="off">`).join('')}</div><div class="row" style="margin-top:10px"><button class="btn pri" data-act="addone" data-k="${kind}">＋ Ekle</button></div>
<div class="sec"><b>CSV ile toplu ekle (Excel → CSV UTF-8)</b><pre class="box" style="font-size:12px">${esc(F.fmt)}</pre><div class="row wrap" style="margin-top:8px"><label class="btn">📄 Dosya seç<input type="file" id="csvf" accept=".csv,.txt" hidden></label><button class="btn" data-act="csvout" data-k="${kind}">⬇ Dışa aktar (${n})</button></div></div><p class="cnt">Eklediklerin bu cihazda kalıcı olarak saklanır.</p>`);
$('#csvf').onchange=async e=>{const f=e.target.files[0];if(!f)return;const t=await f.text();if(t.startsWith('PK'))return toast('xlsx okunamaz, CSV UTF-8 kaydet');const rows=csv(t).filter(r=>r[0]&&(kind==='p'||r[1]));S.c[kind].push(...rows.map(r=>mk(kind,r)));save();toast(rows.length+' öğe eklendi');closeModal();render()}}
function stats(){const w=W(),p=P(),t=day(),due=[...w.map(wk),...p.map(pk)].filter(k=>S.srs[k]&&S.srs[k].d<=t).length,pc=(a,b)=>`<div class="pb" style="margin-top:6px"><i style="width:${b?a/b*100:0}%"></i></div>`;
const kw=w.filter(x=>known(wk(x))).length,kp=p.filter(x=>known(pk(x))).length,kt=Object.keys(S.td).length,kl=doneN();
modal('İlerleme',`<div class="stats"><div class="stat"><b>🔥 ${S.streak}</b><span>gün seri</span></div><div class="stat"><b>${due}</b><span>bugün tekrar</span></div><div class="stat"><b>${Object.keys(S.fav).length}</b><span>favori</span></div></div>
${[['Dersler',kl,L().length],['Kelimeler',kw,w.length],['Phrasal',kp,p.length],['Çeviri',kt,T().length]].map(([n,a,b])=>`<div class="sec"><div class="row"><b style="margin:0">${n}</b><span class="sp">${a} / ${b}</span></div>${pc(a,b)}</div>`).join('')}`)}
function keys(){modal('Klavye kısayolları',`<div class="grid" style="grid-template-columns:1fr"><div><kbd>/</kbd> Aramaya git</div><div><kbd>Esc</kbd> Pencereyi kapat</div><div><kbd>Enter</kbd> Cevabı kontrol et</div><div><kbd>Boşluk</kbd> Kartı çevir (Pratik)</div><div><kbd>1</kbd> / <kbd>2</kbd> Bilmedim / Bildim (Pratik)</div><div><kbd>←</kbd> <kbd>→</kbd> Önceki / sonraki cümle (Çeviri)</div></div>`)}
function tools(a){menu(a,[{l:'Bugünün tekrarı',ic:'🔁',s:String(dueN()),id:'due'},{l:'Kaldığın dersten devam et',ic:'▶',id:'cont'},'-',{l:'Kendi içeriğimi ekle',ic:'➕',id:'add'},{l:'Yeni ders yaz',ic:'📝',id:'newl'},{l:'Düzensiz fiiller',ic:'📖',id:'irr'},{l:'İlerleme',ic:'📊',id:'stats'},'-',{l:'Tema: '+({light:'Açık',dark:'Koyu'})[S.theme],ic:'🌓',id:'theme'},{l:'Yedek indir (JSON)',ic:'⬇',id:'bk'},{l:'Yedek yükle',ic:'⬆',id:'rs'},'-',{l:'Klavye kısayolları',ic:'⌨',id:'keys'},{l:'İlerlemeyi sıfırla',ic:'🗑',id:'reset'}],o=>{
({due:()=>{S.f.deck='words';PS.q=null;go('pratik');if(dueN())startP()},cont:()=>{go('dersler');lesson((L().find(l=>!S.ld[l.id])||L()[0]).id)},add:()=>addModal(),newl:()=>{go('dersler');lessonEdit()},irr:irrModal,stats,keys,theme:()=>{S.theme={light:'dark',dark:'light'}[S.theme];save();render()},bk:()=>dl('ingilizce-yedek.json',JSON.stringify(S),'application/json'),rs:()=>{const i=document.createElement('input');i.type='file';i.accept='.json';i.onchange=async()=>{try{S=Object.assign({},structuredClone(def),JSON.parse((await i.files[0].text()).replace(/^\ufeff/,'')));S.c={...def.c,...S.c};S.f={...def.f,...S.f};save();render();toast('Yedek yüklendi')}catch{toast('Geçersiz yedek dosyası')}};i.click()},
reset:()=>{if(confirm('Tüm ilerleme ve eklediklerin silinecek. Emin misin?')){S=Object.assign({},structuredClone(def),{theme:S.theme});save();render()}}})[o.id]()})}
/* ---------- Olaylar ---------- */
const A={
irr:irrModal,close:closeModal,
go:t=>go(t.dataset.s),duego:()=>{S.f.deck='words';PS.q=null;go('pratik');startP()},toolmenu:tools,add:()=>S.sec==='dersler'?lessonEdit():addModal(),
dd:t=>{const k=t.dataset.k,o=DD[k].o();menu(t,o.map(([v,l])=>({l,on:v===S.f[k],id:v})),it=>{S.f[k]=it.id;LIM=60;TS.i=0;TS.rnd=null;TS.ans='';TS.st='idle';if(k==='deck'||k==='size'){PS.q=null}save();render()})},
lesson:t=>lesson(t.dataset.i),ldone:t=>{const i=t.dataset.i;S.ld[i]?delete S.ld[i]:S.ld[i]=1;save();t.textContent=S.ld[i]?'✓ Tamamlandı (geri al)':'Dersi tamamladım';render();toast(S.ld[i]?'Ders tamamlandı ✓':'Geri alındı')},lnav:t=>{closeModal();lesson(t.dataset.i);$('.wb').scrollTop=0},
ledit:t=>{closeModal();lessonEdit(t.dataset.i)},lenew:()=>lessonEdit(),
lesave:t=>{const id=+t.dataset.i||0,cur=id?L().find(x=>x.id===id):null,v=k=>$('#le_'+k).value.trim(),ln=k=>v(k).split('\n').map(s=>s.trim()).filter(Boolean),pairs=k=>ln(k).map(s=>{const i=s.indexOf('=');return i<0?null:[s.slice(0,i).trim(),s.slice(i+1).trim()]}).filter(p=>p&&p[0]&&p[1]);
if(!v('title')||!v('say'))return toast('Başlık ve İngilizce kalıp gerekli');
const o={level:v('level'),title:v('title'),pattern:v('pattern'),want:v('want'),say:v('say'),steps:ln('steps'),why:v('why'),examples:pairs('ex').map(([tr,en])=>({tr,en})),trap:{title:cur?.trap?.title||'Dikkat',wrong:v('wr'),correct:v('ok'),detail:v('dt')},practices:pairs('pr').map(([tr,en])=>({tr,en,keywords:(cur?.practices||[]).find(p=>p.en===en)?.keywords||[]}))};
let nid=id;if(!id){nid=Math.max(1000,...S.c.l.map(x=>x.id))+1;S.c.l.push({...o,id:nid,custom:true})}else if(cur.custom)S.c.l[S.c.l.findIndex(x=>x.id===id)]={...o,id,custom:true};else S.le[id]=o;
save();closeModal();render();lesson(nid);toast('Ders kaydedildi ✓')},
lereset:t=>{delete S.le[t.dataset.i];save();closeModal();render();lesson(t.dataset.i);toast('Orijinal ders geri yüklendi')},
ledel:t=>{const id=+t.dataset.i,cu=id>=1000;if(!confirm(cu?'Bu ders kalıcı olarak silinsin mi?':'Bu ders listeden kaldırılsın mı? İstersen "Silinenler" bölümünden geri getirebilirsin.'))return;if(cu){S.c.l=S.c.l.filter(x=>x.id!==id);delete S.ld[id]}else S.hid[id]=1;save();closeModal();render();toast('Ders silindi')},
lebin:()=>{const a=D.lessons.filter(l=>S.hid[l.id]);modal('Silinen dersler',a.length?`<div class="grid" style="grid-template-columns:1fr">${a.map(l=>`<div class="card row"><span>${esc(l.title)}</span><button class="btn sm sp" data-act="lerev" data-i="${l.id}">↩ Geri getir</button></div>`).join('')}</div>`:'<p class="cnt">Silinen ders yok.</p>')},
lerev:t=>{delete S.hid[t.dataset.i];save();closeModal();render();toast('Ders geri getirildi');if(Object.keys(S.hid).length)A.lebin()},
reveal:t=>{const r=t.closest('.box').querySelector('.res');r.hidden=!r.hidden;t.textContent=r.hidden?'Cevabı göster':'Gizle'},
say:t=>say(t.dataset.t,+t.dataset.r),word:t=>wordModal(+t.dataset.i),more:()=>{LIM+=60;(S.sec==='kelimeler'?fillW:fillP)()},
fav:t=>{const k=t.dataset.k;S.fav[k]?delete S.fav[k]:S.fav[k]=1;save();t.textContent=t.classList.contains('ico')?(S.fav[k]?'⭐':'☆'):(S.fav[k]?'⭐ Favori':'☆ Favori');S.sec==='phrasal'&&fillP()},
kn:t=>{S.known[t.dataset.k]=1;save();S.sec==='phrasal'?fillP():(closeModal(),fillW());toast('Öğrenildi ✓')},unk:t=>{const k=t.dataset.k;delete S.known[k];if(S.srs[k])S.srs[k].b=Math.min(S.srs[k].b,2);save();S.sec==='phrasal'?fillP():(closeModal(),fillW())},
delw:t=>{if(confirm('Bu kelime silinsin mi?')){S.c.w.splice(+t.dataset.i,1);save();closeModal();fillW()}},delp:t=>{if(confirm('Silinsin mi?')){S.c.p.splice(+t.dataset.i,1);save();fillP()}},
tchk:tCheck,tshow:()=>{TS.st='show';tView()},tnav:t=>{TS.i+=+t.dataset.d;TS.ans='';TS.st='idle';tView()},tlist:tList,tgo:t=>{TS.i=+t.dataset.i;TS.ans='';TS.st='idle';closeModal();tView()},
pstart:startP,pflip:()=>{PS.flip=!PS.flip;pView()},pgrade:t=>grade(t.dataset.v==='1'),pchk:pCheck,pshow:()=>{PS.st='show';pView()},pnext:()=>{PS.i++;PS.st='idle';PS.ans='';pView()},
addtab:t=>{closeModal();addModal(t.dataset.k)},
addone:t=>{const k=t.dataset.k,F=FORMS[k],v=F.f.map(([,id])=>$('#f_'+id).value.trim());if(!v[0]||(k!=='p'&&!v[1]))return toast('* işaretli alanlar gerekli');S.c[k].push(mk(k,v));save();toast('Eklendi ✓');closeModal();render()},
csvout:t=>{const k=t.dataset.k,a=S.c[k];dl(({w:'kelimelerim',p:'phrasal',t:'cumlelerim'})[k]+'.csv',k==='w'?toCsv(['Kelime','Anlam','Tür','Örnek'],a.map(x=>[x.word,x.meaning,x.type,x.examples])):k==='p'?toCsv(['Phrasal','Anlam','Örnek'],a.map(x=>[x.verb,x.meaning,x.example])):toCsv(['Türkçe','İngilizce'],a.map(x=>[x.tr,x.en])))}};
document.addEventListener('click',e=>{const t=e.target.closest('[data-act]');if(t)A[t.dataset.act]?.(t)});
let dbt;document.addEventListener('input',e=>{if(e.target.id==='iq')return irrFill();if(e.target.id!=='q')return;const k=S.sec==='kelimeler'?'w':'p';Q[k]=e.target.value;LIM=60;clearTimeout(dbt);dbt=setTimeout(()=>k==='w'?fillW():fillP(),150)});
document.addEventListener('keydown',e=>{const tag=document.activeElement?.tagName,typing=tag==='INPUT'||tag==='TEXTAREA';
if(e.key==='Escape'){if(document.querySelector('.pop')){closePop()}else if(mods.length)closeModal();return}
if(typing||e.ctrlKey||e.metaKey||mods.length)return;
if(e.key==='/'&&$('#q')){e.preventDefault();$('#q').focus()}
if(S.sec==='pratik'&&S.f.deck!=='lessons'&&PS.q&&PS.i<PS.q.length){if(e.key===' '){e.preventDefault();A.pflip()}if(PS.flip&&e.key==='1')grade(false);if(PS.flip&&e.key==='2')grade(true)}
if(S.sec==='ceviri'&&(e.key==='ArrowRight'||e.key==='ArrowLeft')){TS.i+=e.key==='ArrowRight'?1:-1;TS.ans='';TS.st='idle';tView()}});
render();
