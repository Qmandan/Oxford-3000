the best for our children. (Çocuklarımız için en iyisini istiyoruz.)", "rank": 294}, {"word": "process", "type": "İsim/Fiil", "meaning": "1. (İsim) Süreç, işlem.", "full_meaning": "1. (İsim) Süreç, işlem.\n2. (İsim) Yöntem, usul.\n3. (Fiil) İşlemek, işlemden geçirmek.", "guide": "Bir şeyin zaman içinde gerçekleşen aşamaları. Fiil olarak bir şeyi bir dizi işlemden geçirmek.", "examples": "1. Learning a language is a long process. (Bir dil öğrenmek uzun bir süreçtir.)\n2. We use a new manufacturing process. (Yeni bir üretim yöntemi kullanıyoruz.)\n3. It takes time to process the applications. (Başvuruları işlemek zaman alır.)", "rank": 295}, {"word": "issue", "type": "İsim, Fiil", "meaning": "1. (İsim) Sorun, mesele.", "full_meaning": "1. (İsim) Sorun, mesele.\n2. (İsim) Sayı, nüsha (dergi).\n3. (Fiil) Yayınlamak, çıkarmak (talimat/para).", "guide": "Tartışılan veya endişe verici bir konu. Bir gazete veya derginin belirli bir tarihli baskısı. Resmi olarak bir şeyi duyurmak veya dağıtmak.", "examples": "1. We need to discuss this issue. (Bu sorunu tartışmamız gerekiyor.)\n2. Have you read the latest issue? (Son sayıyı okudun mu?)\n3. The government will issue a statement. (Hükümet bir açıklama yayınlayacak.)", "rank": 296}, {"word": "educate", "type": "Fiil", "meaning": "1. Eğitmek, öğretmek.", "full_meaning": "1. Eğitmek, öğretmek.\n2. Bilinçlendirmek, aydınlatmak.", "guide": "Birine, özellikle okulda, düzenli bir şekilde bilgi ve beceri öğretmek. Kamuoyunu bir konuda bilgilendirmek.", "examples": "1. Parents want to educate their children well. (Ebeveynler çocuklarını iyi eğitmek ister.)\n2. We need to educate the public about recycling. (Halkı geri dönüşüm konusunda bilinçlendirmemiz gerekiyor.)", "rank": 297}, {"word": "whether", "type": "Bağlaç", "meaning": "1. -ip -mediği, olup olmadığı", "full_meaning": "1. -ip -mediği, olup olmadığı\n2. İster ... ister (whether ... or)", "guide": "İki veya daha fazla olasılık arasında bir seçim veya şüphe durumunu ifade eder. Genellikle dolaylı sorularda \"if\" yerine kullanılır.", "examples": "1. I don't know whether he will come. (Onun gelip gelmeyeceğini bilmiyorum.)\n2. We must decide whether to go or stay. (Gidip gitmemeye karar vermeliyiz.)\n3. Whether you like it or not, we have to do it. (İster beğen ister beğenme, bunu yapmak zorundayız.)", "rank": 298}, {"word": "policy", "type": "İsim", "meaning": "1. Politika, ilke.", "full_meaning": "1. Politika, ilke.\n2. Sigorta poliçesi.\n3. Yöntem, uygulama.", "guide": "Bir kuruluş veya hükümetin resmi planı veya eylem ilkesi. Ayrıca bir sigorta sözleşmesi.", "examples": "1. The company has a strict no-smoking policy. (Şirketin katı bir sigara yasağı politikası var.)\n2. Check your insurance policy to see what's covered. (Neyin kapsandığını görmek için sigorta poliçenizi kontrol edin.)\n3. It's my policy to be honest with everyone. (Herkesle dürüst olmak benim prensibimdir.)", "rank": 299}, {"word": "believe", "type": "Fiil", "meaning": "1. İnanmak.", "full_meaning": "1. İnanmak.\n2. Sanmak, zannetmek.\n3. Güvenmek.", "guide": "Bir şeyin doğru olduğunu düşünmek veya birine güvenmek.", "examples": "1. Do you believe in ghosts? (Hayaletlere inanır mısın?)\n2. I believe she's telling the truth. (Bence doğruyu söylüyor.)\n3. Believe in yourself! (Kendine inan!)", "rank": 300}, {"word": "round", "type": "Sıfat / İsim / Edat", "meaning": "1. (Sıfat) Yuvarlak.", "full_meaning": "1. (Sıfat) Yuvarlak.\n2. (İsim) Tur, devre.\n3. (Edat) Etrafında, çevresinde.", "guide": "Dairesel şekle sahip olan veya bir dizi olayın bir bölümü.", "examples": "1. \"The Earth is round.\" (Dünya yuvarlaktır.)\n2. \"They lost in the first round of the competition.\" (Yarışmanın ilk turunda kaybettiler.)\n3. \"We walked round the lake.\" (Gölün etrafında yürüdük.)", "rank": 301}, {"word": "better", "type": "Sıfat/Zarf/Fiil", "meaning": "1. Daha iyi (sıfat).", "full_meaning": "1. Daha iyi (sıfat).\n2. Daha iyi (zarf).\n3. Geliştirmek, iyileştirmek (fiil).", "guide": "\"Good\" ve \"well\"in karşılaştırma derecesi. Fiil olarak bir şeyi daha iyi hale getirmek.", "examples": "1. Your idea is better than mine. (Fikrin benimkinden daha iyi.)\n2. She sings better than I do. (O benden daha iyi şarkı söyler.)\n3. We must better our understanding. (Anlayışımızı geliştirmeliyiz.)", "rank": 302}, {"word": "effect", "type": "İsim", "meaning": "1. Etki, sonuç.", "full_meaning": "1. Etki, sonuç.\n2. İzlenim, görüntü.\n3. (put into effect) Yürürlüğe koymak.", "guide": "Bir eylemin veya durumun neden olduğu değişiklik veya sonuç. Özel bir izlenim yaratmak (sound effects).", "examples": "1. The medicine had no effect. (İlacın hiçbir etkisi olmadı.)\n2. The lighting created a dramatic effect. (Aydınlatma dramatik bir etki yarattı.)\n3. The new law will be put into effect next month. (Yeni yasa önümüzdeki ay yürürlüğe girecek.)", "rank": 303}, {"word": "real", "type": "Sıfat", "meaning": "1. Gerçek, hakiki.", "full_meaning": "1. Gerçek, hakiki.\n2. Asıl, gerçek.\n3. (Konuşma dilinde) Çok, aşırı.", "guide": "Hayal ürünü veya sahte olmayan; doğada veya gerçeklikte var olan.", "examples": "1. \"Is that a real diamond?\" (O gerçek bir elmas mı?)\n2. \"Tell me your real name.\" (Bana gerçek adını söyle.)\n3. \"That was a real surprise!\" (Bu gerçekten bir sürprizdi!)", "rank": 304}, {"word": "produce", "type": "Fiil/İsim", "meaning": "1. (Fiil) Üretmek, meydana getirmek.", "full_meaning": "1. (Fiil) Üretmek, meydana getirmek.\n2. (Fiil) Ortaya çıkarmak, göstermek.\n3. (İsim) Tarım ürünleri, sebze/meyve.", "guide": "Yapmak, oluşturmak. Bir belge veya kanıt göstermek. Çiftçilerin sattığı taze meyve ve sebzeler.", "examples": "1. (Fiil) The factory produces cars. (Fabrika araba üretir.)\n2. (Fiil) He couldn't produce a valid ticket. (Geçerli bir bilet gösteremedi.)\n3. (İsim) We buy fresh produce from the market. (Pazardan taze sebze meyve alıyoruz.)", "rank": 305}, {"word": "court", "type": "İsim/Fiil", "meaning": "1. Mahkeme (isim).", "full_meaning": "1. Mahkeme (isim).\n2. Kort (tenis) (isim).\n3. (Kraliyet) sarayı (isim).", "guide": "Adalet dağıtılan yer veya spor alanı. Fiil olarak kur yapmak.", "examples": "1. The case will go to court. (Dava mahkemeye gidecek.)\n2. a tennis court (bir tenis kortu)\n3. He is courting disaster. (Felakete davetiye çıkarıyor.)", "rank": 306}, {"word": "car", "type": "İsim", "meaning": "1. Araba, otomobil.", "full_meaning": "1. Araba, otomobil.\n2. Vagon, vagon (tren).\n3. Asansör kabini.", "guide": "Karayolunda insan taşımak için kullanılan motorlu taşıt.", "examples": "1. I go to work by car. (İşe arabayla gidiyorum.)\n2. a sleeping car on a train (bir trende yataklı vagon)", "rank": 307}, {"word": "special", "type": "Sıfat / İsim", "meaning": "1. (S) Özel.", "full_meaning": "1. (S) Özel.\n2. (S) Önemli, özel gün.\n3. (İ) Özel menü, indirim.", "guide": "Sıradan, olağan veya genelden farklı olan, özgü.", "examples": "1. Today is a special occasion. (Bugün özel bir gün.)\n2. She has special needs. (Özel ihtiyaçları var.)\n3. Ask about today's special. (Bugünün menüsünü/özel yemeğini sor.)", "rank": 308}, {"word": "rate", "type": "İsim / Fiil", "meaning": "1. (İsim) Oran, hız.", "full_meaning": "1. (İsim) Oran, hız.\n2. (İsim) Ücret, fiyat.\n3. (Fiil) Derecelendirmek, değerlendirmek.", "guide": "Bir şeyin ne sıklıkta veya ne hızda olduğunu gösteren ölçü veya bir şeyin değerini belirlemek.", "examples": "1. \"The unemployment rate is falling.\" (İşsizlik oranı düşüyor.)\n2. \"What's the daily rate for car rental?\" (Araba kiralama günlük ücreti ne kadar?)\n3. \"How would you rate the service on a scale of 1 to 10?\" (Hizmeti 1'den 10'a kadar nasıl derecelendirirsiniz?)", "rank": 309}, {"word": "value", "type": "İsim, Fiil", "meaning": "1. Değer, kıymet (isim)", "full_meaning": "1. Değer, kıymet (isim)\n2. Değer vermek, kıymetini bilmek (fiil)\n3. Fiyat, karşılık (isim)", "guide": "Bir şeyin maddi veya manevi önemini, karşılığını ifade eder. Fiil olarak, bir şeyi önemsemek, takdir etmek veya parasal değer biçmek anlamına gelir.", "examples": "1. The sentimental value of this gift is huge. (Bu hediyenin duygusal değeri çok büyük.)\n2. I really value your friendship. (Arkadaşlığına gerçekten değer veriyorum.)\n3. The value of the property has increased. (Mülkün değeri arttı.)", "rank": 310}, {"word": "difficult", "type": "Sıfat", "meaning": "1. Zor, güç.", "full_meaning": "1. Zor, güç.\n2. (İnsan) Geçimsiz, zor beğenen.\n3. Sıkıntılı, çetin (durum).", "guide": "Yapılması veya anlaşılması çaba gerektiren. İş birliği yapmayan, huysuz kişiler için kullanılır.", "examples": "1. This is a difficult question. (Bu zor bir soru.)\n2. He can be a difficult person to work with. (Onunla çalışmak zor bir kişi olabilir.)\n3. We are going through difficult times. (Zor zamanlardan geçiyoruz.)", "rank": 311}, {"word": "simple", "type": "Sıfat", "meaning": "1. Basit, kolay.", "full_meaning": "1. Basit, kolay.\n2. Sade, gösterişsiz.\n3. Saf, sade (kişi).", "guide": "Karmaşık olmayan, anlaşılması veya yapılması kolay olan.", "examples": "1. The instructions are simple. (Talimatlar basit.)\n2. She leads a simple life. (Sade bir hayat sürüyor.)\n3. He's a simple man. (O saf/sade bir adamdır.)", "rank": 312}, {"word": "love", "type": "İsim / Fiil", "meaning": "1. Sevmek, aşk.", "full_meaning": "1. Sevmek, aşk.\n2. Çok hoşlanmak, bayılmak.\n3. (Spor) Skorsuz (love).", "guide": "Derin sevgi ve bağlılık duygusu. Bir şeyden çok zevk almak. Teniste sıfır anlamında.", "examples": "1. I love my family. (Ailemi seviyorum.)\n2. She loves chocolate. (Çikolataya bayılır.)\n3. The score is fifteen-love. (Skor on beş-sıfır.)", "rank": 313}, {"word": "suggest", "type": "Fiil", "meaning": "1. Önermek, teklif etmek.", "full_meaning": "1. Önermek, teklif etmek.\n2. İma etmek, düşündürmek.\n3. Akla getirmek.", "guide": "Bir fikir veya planı düşünülmesi için sunmak.", "examples": "1. I suggest we leave early. (Erken ayrılmamızı öneriyorum.)\n2. The evidence suggests he is guilty. (Kanıtlar onun suçlu olduğunu düşündürüyor.)\n3. The smell suggests spring. (Koku baharı akla getiriyor.)", "rank": 314}, {"word": "yet", "type": "Zarf, Bağlaç", "meaning": "1. Henüz, hala (olumsuz cümlede) (zarf)", "full_meaning": "1. Henüz, hala (olumsuz cümlede) (zarf)\n2. Şimdiye kadar (soru cümlesinde) (zarf)\n3. Ancak, fakat (bağlaç)", "guide": "Zarf olarak, bir şeyin beklenildiği halde henüz olmadığını veya şu ana kadar olup olmadığını sorar. Bağlaç olarak, \"but\" (ama) ile benzer anlamdadır, ancak daha resmi veya vurgulayıcıdır.", "examples": "1. He hasn't arrived yet. (O henüz gelmedi.)\n2. Have you finished your homework yet? (Ödevini şimdiye kadar bitirdin mi?)\n3. It's a small car, yet it's very powerful. (Küçük bir araba, ancak çok güçlü.)", "rank": 315}, {"word": "active", "type": "Sıfat", "meaning": "1. Aktif, etkin, faal.", "full_meaning": "1. Aktif, etkin, faal.\n2. Hareketli, enerjik.\n3. (Dilbilgisi) etken (edilgenin zıttı).", "guide": "Fiziksel olarak hareketli olmayı veya bir şeye katılmayı, dahil olmayı ifade eder.", "examples": "1. She leads an active social life. (Aktif bir sosyal hayatı var.)\n2. Volcanoes can be active or dormant. (Yanardağlar aktif veya uyuyan olabilir.)\n3. He's very active for his age. (Yaşına göre çok hareketli.)", "rank": 316}, {"word": "hope", "type": "Fiil, İsim", "meaning": "1. Umut etmek, dilemek.", "full_meaning": "1. Umut etmek, dilemek.\n2. (İsim) Umut, ümit.\n3. (İsim) Umut kaynağı.", "guide": "Olmasını istemek, beklemek. Olumlu bir beklenti duygusu. Bu duyguyu veren şey.", "examples": "1. I hope you feel better soon. (Yakında iyileşeceğini umuyorum.)\n2. Don't give up hope. (Umudunu kaybetme.)\n3. You are our only hope. (Sen bizim tek umudumuzsun.)", "rank": 317}, {"word": "concern", "type": "Fiil/İsim", "meaning": "1. Endişelendirmek, kaygılandırmak (fiil).", "full_meaning": "1. Endişelendirmek, kaygılandırmak (fiil).\n2. İlgilendirmek (fiil).\n3. Endişe, ilgi (isim).", "guide": "Birini endişelendirmek veya bir şeyle ilgili olmak. İsim olarak endişe veya işletme.", "examples": "1. His health concerns me. (Onun sağlığı beni endişelendiriyor.)\n2. This matter concerns all of us. (Bu mesele hepimizi ilgilendirir.)\n3. There is growing concern about pollution. (Kirlilik konusunda artan bir endişe var.)", "rank": 318}, {"word": "big", "type": "Sıfat", "meaning": "1. Büyük, iri.", "full_meaning": "1. Büyük, iri.\n2. Önemli, mühim.\n3. Yaşça büyük.", "guide": "Fiziksel boyut veya önem bakımından büyük.", "examples": "1. They live in a big house. (Büyük bir evde yaşıyorlar.)\n2. This is a big decision. (Bu önemli bir karar.)\n3. my big brother (benim abim)", "rank": 319}, {"word": "perhaps", "type": "Zarf", "meaning": "1. Belki.", "full_meaning": "1. Belki.\n2. Muhtemelen, olasılıkla.", "guide": "Bir şeyin kesin olmadığını, olasılık içerdiğini ifade eder. \"Belki\"nin biraz daha resmi karşılığıdır.", "examples": "1. Perhaps we should wait a bit longer. (Belki biraz daha beklemeliyiz.)\n2. He is, perhaps, the best player on the team. (O, muhtemelen takımdaki en iyi oyuncu.)", "rank": 320}, {"word": "return", "type": "Fiil / İsim", "meaning": "1. (Fiil) Geri dönmek.", "full_meaning": "1. (Fiil) Geri dönmek.\n2. (Fiil) İade etmek, geri vermek.\n3. (İsim) Dönüş, geri gelme.", "guide": "Geldiği yere gitmek veya aldığı şeyi geri vermek.", "examples": "1. \"She will return home tomorrow.\" (Yarın eve dönecek.)\n2. \"I need to return this book to the library.\" (Bu kitabı kütüphaneye iade etmem gerekiyor.)\n3. \"We look forward to your return.\" (Dönüşünüzü dört gözle bekliyoruz.)", "rank": 321}, {"word": "free", "type": "Sıfat/Zarf/Fiil", "meaning": "1. Özgür, serbest (sıfat).", "full_meaning": "1. Özgür, serbest (sıfat).\n2. Ücretsiz, bedava (sıfat).\n3. Serbest bırakmak, kurtarmak (fiil).", "guide": "Kısıtlanmamış, bağımsız. Para ödemeden alınan veya verilen. Tutukluluktan veya bir şeyden kurtarmak.", "examples": "1. a free country (özgür bir ülke)\n2. Admission is free. (Giriş ücretsizdir.)\n3. They freed the hostages. (Rehineleri serbest bıraktılar.)", "rank": 322}, {"word": "understand", "type": "Fiil", "meaning": "1. Anlamak, kavramak (bir şeyin manasını)", "full_meaning": "1. Anlamak, kavramak (bir şeyin manasını)\n2. Anlamak, farkında olmak (bir durumu/gerekliliği)\n3. Anlayış göstermek, empati kurmak", "guide": "Bir şeyin anlamını veya nedenini zihinsel olarak kavramak demektir. Sadece bilgi değil, bir durumu, insanı veya duyguyu kavrama, takdir etme ve empati kurma anlamlarını da taşır.", "examples": "1. I don't understand the instructions. (Talimatları anlamıyorum.)\n2. We understand the need for urgent action. (Acil eylem ihtiyacının farkındayız.)\n3. I hope you can understand my situation. (Umarım durumumu anlayabilirsin.)", "rank": 323}, {"word": "already", "type": "Zarf", "meaning": "1. Zaten, çoktan.", "full_meaning": "1. Zaten, çoktan.\n2. Şimdiden, daha şimdiden.", "guide": "Beklenenden veya gerekenden daha önce olmuş bir şeyi ifade eder. Genellikle olumlu cümlelerde ve Perfect Tense'lerle kullanılır.", "examples": "1. I have already seen that film. (O filmi zaten gördüm.)\n2. Are you leaving already? (Şimdiden mi gidiyorsun?)\n3. He's already finished his homework. (Ödevini çoktan bitirdi.)", "rank": 324}, {"word": "deal", "type": "Fiil/İsim", "meaning": "1. Uğraşmak, ilgilenmek (fiil, with ile).", "full_meaning": "1. Uğraşmak, ilgilenmek (fiil, with ile).\n2. Anlaşma, pazarlık (isim).\n3. Dağıtmak (fiil, kart).", "guide": "Bir sorun veya durumla baş etmek. İsim olarak yapılan resmi veya gayri resmi anlaşma.", "examples": "1. I can't deal with this stress. (Bu stresle baş edemiyorum.)\n2. We made a deal: I cook, you clean. (Bir anlaşma yaptık: Ben yemek yaparım, sen temizlik yaparsın.)\n3. It's your turn to deal the cards. (Kartları dağıtma sırası sende.)", "rank": 325}, {"word": "war", "type": "İsim, Fiil", "meaning": "1. Savaş (isim)", "full_meaning": "1. Savaş (isim)\n2. Mücadele, çatışma (soyut) (isim)\n3. Savaşmak (fiil)", "guide": "Devletler veya gruplar arasında silahlı çatışma. Mecazi olarak, herhangi bir yoğun mücadele veya karşıtlık için kullanılır.", "examples": "1. The country has been at war for five years. (Ülke beş yıldır savaş halinde.)\n2. The government declared war on poverty. (Hükümet yoksulluğa karşı savaş ilan etti.)\n3. The two factions have been warring for decades. (İki fraksiyon on yıllardır savaşıyor.)", "rank": 326}, {"word": "carry", "type": "Fiil", "meaning": "1. Taşımak, götürmek.", "full_meaning": "1. Taşımak, götürmek.\n2. (Yürürlükte) olmak, geçerli olmak.\n3. (Onay) almak, kabul ettirmek.", "guide": "Bir şeyi bir yerden başka bir yere götürmek. Ayrıca bir planı uygulamak veya oylamayı kazanmak.", "examples": "1. Can you help me carry these bags? (Bu çantaları taşımama yardım eder misin?)\n2. The law carries a heavy penalty. (Yasa ağır bir ceza taşır.)\n3. The motion was carried unanimously. (Öneri oybirliğiyle kabul edildi.)", "rank": 327}, {"word": "mind", "type": "İsim / Fiil", "meaning": "1. Zihin, akıl.", "full_meaning": "1. Zihin, akıl.\n2. (Bir şeyi) umursamak, aldırmak.\n3. (Bir şeye) bakmak, göz kulak olmak.", "guide": "Düşünme ve algılama yetisi. Fiil olarak \"itiraz etmek/sakıncası olmak\" veya \"dikkat etmek\" anlamlarındadır.", "examples": "1. He has a very sharp mind. (Çok keskin bir zihni var.)\n2. Do you mind if I open the window? (Pencereyi açmamın sakıncası var mı?)\n3. Could you mind my bag for a moment? (Çantamı bir dakika göz kulak olur musun?)", "rank": 328}, {"word": "body", "type": "İsim", "meaning": "1. Vücut, beden.", "full_meaning": "1. Vücut, beden.\n2. Ceset, naaş.\n3. Grup, kuruluş.", "guide": "Bir insanın veya hayvanın fiziksel yapısı. Mecazi olarak bir grup veya ana kısım.", "examples": "1. Regular exercise is good for your body. (Düzenli egzersiz vücudunuz için iyidir.)\n2. They found a body in the river. (Nehirde bir ceset buldular.)\n3. a governing body (bir yönetim organı)", "rank": 329}, {"word": "age", "type": "İsim/Fiil", "meaning": "1. Yaş (isim).", "full_meaning": "1. Yaş (isim).\n2. Çağ, devir (isim).\n3. Yaşlanmak (fiil).", "guide": "Bir canlının veya şeyin var olduğu süre. Ayrıca tarihsel dönem.", "examples": "1. What is your age? (Yaşınız nedir?)\n2. We live in the digital age. (Dijital çağda yaşıyoruz.)\n3. Fine wine ages well. (Kaliteli şarap iyi yaşlanır.)", "rank": 330}, {"word": "main", "type": "Sıfat", "meaning": "1. En önemli, başlıca, temel.", "full_meaning": "1. En önemli, başlıca, temel.\n2. En büyük, ana.\n3. (Elektrik/Su) şebeke hattı, ana hat.", "guide": "Bir şeyin en önemli, en büyük veya merkezi parçasını tanımlamak için kullanılır. \"Ana\" kelimesi ile karşılık bulur.", "examples": "1. What is the main idea of the story? (Hikayenin ana fikri nedir?)\n2. The main entrance is on the north side. (Ana giriş kuzey tarafındadır.)\n3. The storm caused a break in the water main. (Fırtına, ana su hattında bir kırılmaya neden oldu.)", "rank": 331}, {"word": "fall", "type": "Fiil/İsim", "meaning": "1. Düşmek (fiil).", "full_meaning": "1. Düşmek (fiil).\n2. Sonbahar (isim, ABD).\n3. Düşüş, azalma (isim).", "guide": "Yerçekimi nedeniyle yere doğru hareket etmek. Sonbahar mevsimi. Miktar veya seviyedeki azalma.", "examples": "1. Be careful not to fall! (Düşmemeye dikkat et!)\n2. I love the colors in the fall. (Sonbahardaki renkleri seviyorum.)\n3. a sharp fall in prices (fiyatlarda keskin bir düşüş)", "rank": 332}, {"word": "whole", "type": "Sıfat, İsim", "meaning": "1. Bütün, tüm (sıfat)", "full_meaning": "1. Bütün, tüm (sıfat)\n2. Tam, eksiksiz (sıfat)\n3. Bütün, tamamı (isim)", "guide": "Parçalara ayrılmamış, eksiksiz ve tam. İsim olarak, bir şeyin tümünü ifade eder.", "examples": "1. I ate the whole pizza by myself. (Bütün pizzayı tek başıma yedim.)\n2. We spent the whole day at the beach. (Bütün günü plajda geçirdik.)\n3. Two halves make a whole. (İki yarım bir bütün yapar.)", "rank": 333}, {"word": "actual", "type": "Sıfat", "meaning": "1. Gerçek, asıl, mevcut.", "full_meaning": "1. Gerçek, asıl, mevcut.\n2. Fiili, gerçekte var olan.\n3. Şu andaki.", "guide": "Hayali veya teorik olanın aksine, var olan, gerçek ve doğru olanı vurgular.", "examples": "1. The actual cost was higher than estimated. (Gerçek maliyet tahmin edilenden yüksekti.)\n2. What were his actual words? (Onun asıl sözleri neydi?)\n3. In actual fact, I disagree. (Aslına bakarsanız, katılmıyorum.)", "rank": 334}, {"word": "job", "type": "İsim", "meaning": "1. İş, meslek.", "full_meaning": "1. İş, meslek.\n2. Görev, vazife.\n3. (Argo) Bir şey, durum (ör. \"It's a tough job\").", "guide": "Düzenli olarak yapılan ve genellikle para kazanılan aktivite. Ayrıca yapılması gereken belirli bir iş veya görev.", "examples": "1. He found a new job in marketing. (Pazarlamada yeni bir iş buldu.)\n2. You did a great job cleaning the house. (Evi temizleme işini harika yaptın.)\n3. It's a tough job being a parent. (Ebeveyn olmak zor bir iş.)", "rank": 335}, {"word": "road", "type": "İsim", "meaning": "1. Yol.", "full_meaning": "1. Yol.\n2. Karayolu.\n3. (Mecazen) Yol, yöntem.", "guide": "Bir yerden başka bir yere gitmek için kullanılan, özellikle araçlar için düzleştirilmiş yol.", "examples": "1. \"Be careful when you cross the road.\" (Yolu geçerken dikkatli ol.)\n2. \"The road to success is not easy.\" (Başarıya giden yol kolay değildir.)", "rank": 336}, {"word": "hour", "type": "İsim", "meaning": "1. Saat (60 dakika).", "full_meaning": "1. Saat (60 dakika).\n2. Vakit, zaman, saat.\n3. Çalışma saati.", "guide": "Altmış dakikalık zaman birimi. Belirli bir zaman. Mesai saati.", "examples": "1. The film is two hours long. (Film iki saat uzunluğunda.)\n2. At that hour, the streets were empty. (O saatte sokaklar bomboştu.)\n3. Office hours are 9 to 5. (Ofis saatleri 9'dan 5'e kadardır.)", "rank": 337}, {"word": "lot", "type": "İsim / Zarf", "meaning": "1. Bir sürü, çok miktarda (a lot of).", "full_meaning": "1. Bir sürü, çok miktarda (a lot of).\n2. Arsa, parsel.\n3. (Çekiliş) Kura, çekiliş.", "guide": "Büyük miktar veya sayı. Arazi parçası.", "examples": "1. She has a lot of friends. (Bir sürü arkadaşı var.)\n2. We bought a vacant lot to build a house. (Ev yapmak için boş bir arsa aldık.)\n3. They drew lots to decide who would go first. (Kimin önce gideceğine karar vermek için kura çektiler.)", "rank": 338}, {"word": "drive", "type": "Fiil/İsim", "meaning": "1. Araba sürmek (fiil).", "full_meaning": "1. Araba sürmek (fiil).\n2. Sürücü yolu (isim).\n3. İçgüdü, dürtü (isim).", "guide": "Bir taşıtı (araba, otobüs) kontrol ederek yönlendirmek. Özel araç yolu. Bir şeyi yapma konusundaki güçlü istek veya enerji.", "examples": "1. Can you drive? (Araba kullanabilir misin?)\n2. He parked in the drive. (Özel yola park etti.)\n3. She has a strong drive to succeed. (Başarılı olmak için güçlü bir dürtüsü var.)", "rank": 339}, {"word": "idea", "type": "İsim", "meaning": "1. Fikir, düşünce.", "full_meaning": "1. Fikir, düşünce.\n2. Kanı, tahmin.\n3. Amaç, niyet.", "guide": "Zihinde oluşan düşünce veya plan. Bir şey hakkındaki görüş veya inanç.", "examples": "1. That's a great idea! (Bu harika bir fikir!)\n2. I have an idea why he's upset. (Onun neden üzgün olduğu hakkında bir fikrim var.)\n3. The idea is to finish by Friday. (Amaç Cuma'ya kadar bitirmek.)", "rank": 340}, {"word": "eight", "type": "Sayı", "meaning": "1. Sekiz (sayı).", "full_meaning": "1. Sekiz (sayı).\n2. Sekiz rakamı.\n3. Sekizli takım/grup.", "guide": "Yedi ile dokuz arasındaki sayı.", "examples": "1. She has eight cats. (Sekiz kedisi var.)\n2. He wears the number eight on his shirt. (Formasında sekiz numarasını taşıyor.)", "rank": 341}, {"word": "minister", "type": "İsim / Fiil", "meaning": "1. Bakan.", "full_meaning": "1. Bakan.\n2. Papaz, din adamı.\n3. (Bir ihtiyaca) hizmet etmek, yardım etmek.", "guide": "Bir hükümet departmanının başındaki kişi veya dini lider. Fiil olarak resmi bir şekilde yardım etmek anlamındadır.", "examples": "1. The Minister of Education gave a speech. (Eğitim Bakanı bir konuşma yaptı.)\n2. They were married by a minister. (Onları bir papaz evlendirdi.)\n3. Nurses minister to the sick. (Hemşireler hastalara hizmet eder.)", "rank": 342}, {"word": "happen", "type": "Fiil", "meaning": "1. Olmak, meydana gelmek.", "full_meaning": "1. Olmak, meydana gelmek.\n2. Tesadüfen olmak.\n3. (happen to) -e uğramak, başına gelmek.", "guide": "Planlı veya plansız bir şekilde vuku bulmak. Şans eseri gerçekleşmek.", "examples": "1. The accident happened last night. (Kaza dün gece oldu.)\n2. I happened to see her at the market. (Onu pazarda tesadüfen gördüm.)\n3. What happened to your car? (Arabana ne oldu?)", "rank": 343}, {"word": "history", "type": "İsim", "meaning": "1. Tarih (bilim).", "full_meaning": "1. Tarih (bilim).\n2. Geçmiş, mazi.\n3. Öykü, geçmiş özgeçmiş.", "guide": "Geçmiş olayların kaydı veya incelenmesi. Bir kişinin veya şeyin geçmişi.", "examples": "1. I love reading about ancient history. (Antik tarih okumayı severim.)\n2. This house has a interesting history. (Bu evin ilginç bir geçmişi var.)\n3. He has a history of heart problems. (Kalp sorunları geçmişi var.)", "rank": 344}, {"word": "price", "type": "İsim/Fiil", "meaning": "1. (İsim) Fiyat.", "full_meaning": "1. (İsim) Fiyat.\n2. (İsim) Bedel, maliyet.\n3. (Fiil) Fiyatını belirlemek/etiketlemek.", "guide": "Bir şey için ödenen veya istenen para miktarı. Soyut bir fedakarlık veya kayıp. Fiil olarak fiyat koymak.", "examples": "1. What's the price of this car? (Bu arabanın fiyatı nedir?)\n2. The price of success is hard work. (Başarının bedeli sıkı çalışmaktır.)\n3. The items are priced too high. (Ürünler çok yüksek fiyatlandırılmış.)", "rank": 345}, {"word": "experience", "type": "İsim/Fiil", "meaning": "1. Deneyim, tecrübe (isim).", "full_meaning": "1. Deneyim, tecrübe (isim).\n2. Yaşamak, başından geçmek (fiil).\n3. Tecrübe etmek, hissetmek (fiil).", "guide": "Belirli bir işi yaparken veya yaşarken edinilen bilgi ve beceri. Bir olayı yaşamak veya maruz kalmak. Bir duygu hissetmek.", "examples": "1. She has a lot of experience in teaching. (Öğretmenlikte çok deneyimi var.)\n2. The city experienced a lot of growth. (Şehir büyük bir büyüme yaşadı.)\n3. I experienced a feeling of joy. (Bir sevinç hissi yaşadım.)", "rank": 346}, {"word": "remain", "type": "Fiil", "meaning": "1. Kalmak.", "full_meaning": "1. Kalmak.\n2. Geriye kalmak, artakalmak.\n3. (Durumunu) Korumak, sürdürmek.", "guide": "Bir yerde veya durumda kalmaya devam etmek, gitmemek veya değişmemek.", "examples": "1. \"Please remain seated.\" (Lütfen yerinizde kalın.)\n2. \"Only a few minutes remain.\" (Sadece birkaç dakika kaldı.)\n3. \"He remained calm during the crisis.\" (Kriz sırasında sakin kaldı.)", "rank": 347}, {"word": "complete", "type": "Sıfat/Fiil", "meaning": "1. Tam, bütün (sıfat).", "full_meaning": "1. Tam, bütün (sıfat).\n2. Tamamlamak, bitirmek (fiil).\n3. Eksiksiz, kusursuz (sıfat).", "guide": "Tüm parçaları olan, eksiksiz. Fiil olarak sona erdirmek.", "examples": "1. The complete works of Shakespeare (Shakespeare'in tüm eserleri)\n2. Please complete the application form. (Lütfen başvuru formunu doldurun.)\n3. a complete surprise (tam bir sürpriz)", "rank": 348}, {"word": "final", "type": "Sıfat/İsim", "meaning": "1. Son, nihai (sıfat).", "full_meaning": "1. Son, nihai (sıfat).\n2. (Spor) Final (isim).\n3. (Üniversite) Final sınavı (isim).", "guide": "Daha fazla değişmeyecek veya olmayacak olan. Bir yarışmanın son karşılaşması. Dönem sonu sınavı.", "examples": "1. This is my final decision. (Bu benim nihai kararım.)\n2. the World Cup final (Dünya Kupası finali)\n3. I have three finals next week. (Gelecek hafta üç finalim var.)", "rank": 349}, {"word": "buy", "type": "Fiil/İsim", "meaning": "1. Satın almak (fiil).", "full_meaning": "1. Satın almak (fiil).\n2. (buy into) inanmak, kanmak.\n3. İyi alışveriş, kelepir (isim).", "guide": "Para karşılığında bir şey elde etmek. Mecazi olarak bir fikri kabul etmek.", "examples": "1. I need to buy some milk. (Biraz süt almam gerekiyor.)\n2. He didn't buy my excuse. (Mazeretime inanmadı.)\n3. That car was a great buy. (O araba harika bir alışverişti.)", "rank": 350}, {"word": "door", "type": "İsim", "meaning": "1. Kapı.", "full_meaning": "1. Kapı.\n2. Giriş, geçit.\n3. (out of doors) Dışarı, açık havada.", "guide": "Bir binanın, odanın veya aracın girişini/çıkışını kapatan ve açılan panel. Fırsat anlamında da kullanılır.", "examples": "1. Please close the door. (Lütfen kapıyı kapat.)\n2. Education is the door to opportunity. (Eğitim fırsatların kapısıdır.)\n3. Let's spend the day out of doors. (Günü açık havada geçirelim.)", "rank": 351}, {"word": "create", "type": "Fiil", "meaning": "1. Yaratmak, oluşturmak.", "full_meaning": "1. Yaratmak, oluşturmak.\n2. (Durum) yaratmak, neden olmak.\n3. (Unvan) vermek.", "guide": "Var olmayan bir şeyi meydana getirmek.", "examples": "1. Artists create beautiful things. (Sanatçılar güzel şeyler yaratır.)\n2. The new law created confusion. (Yeni yasa kafa karışıklığı yarattı.)\n3. create a file on the computer (bilgisayarda bir dosya oluşturmak)", "rank": 352}, {"word": "matter", "type": "İsim / Fiil", "meaning": "1. Madde, cisim.", "full_meaning": "1. Madde, cisim.\n2. Konu, mesele, sorun.\n3. Önemli olmak, önemi olmak.", "guide": "Fiziksel şeylerin yapı taşı olan madde veya tartışılan bir konuyu ifade eder. Fiil olarak bir şeyin önemli olduğunu belirtir.", "examples": "1. Organic matter enriches the soil. (Organik madde toprağı zenginleştirir.)\n2. We need to discuss an important matter. (Önemli bir konuyu tartışmamız gerekiyor.)\n3. Your opinion matters to me. (Senin fikrin benim için önemli.)", "rank": 353}, {"word": "claim", "type": "Fiil/İsim", "meaning": "1. İddia etmek (fiil).", "full_meaning": "1. İddia etmek (fiil).\n2. Talep etmek (fiil).\n3. İddia, talep (isim).", "guide": "Bir şeyin doğru olduğunu söylemek veya bir hak talep etmek.", "examples": "1. He claims to be an expert. (Kendisinin bir uzman olduğunu iddia ediyor.)\n2. You can claim your expenses back. (Masraflarınızı geri talep edebilirsiniz.)\n3. false claims (yanlış iddialar)", "rank": 354}, {"word": "usual", "type": "Sıfat", "meaning": "1. Her zamanki, olağan, alışılagelmiş", "full_meaning": "1. Her zamanki, olağan, alışılagelmiş", "guide": "Normal, tipik veya alışılmış olan şeyleri tanımlar. Beklenen standart veya rutini ifade eder.", "examples": "1. I'll meet you at the usual time. (Seninle her zamanki saatte buluşacağım.)\n2. He ordered his usual drink at the bar. (Barda her zamanki içeceğini sipariş etti.)\n3. As usual, she was the first to arrive. (Her zamanki gibi, ilk gelen oydu.)", "rank": 355}, {"word": "authority", "type": "İsim", "meaning": "1. Yetki, otorite.", "full_meaning": "1. Yetki, otorite.\n2. Otorite, yetkili makam.\n3. Uzman, otorite (kişi).", "guide": "Bir şeyi yapma veya emretme hakkı ve gücü; veya bu güce sahip kişi veya kurum.", "examples": "1. She has no authority to make that decision. (O kararı verme yetkisi yok.)\n2. The local authorities were informed. (Yerel yetkililere bilgi verildi.)\n3. He is an authority on ancient Rome. (O, antik Roma konusunda bir otoritedir.)", "rank": 356}, {"word": "enough", "type": "Sıfat/Zarf/Zamir", "meaning": "1. Yeterli, yeteri kadar (sıfat/zamir).", "full_meaning": "1. Yeterli, yeteri kadar (sıfat/zamir).\n2. Yeterince, yeteri kadar (zarf).\n3. (fair enough) Haklısın, peki.", "guide": "Gereken miktarda veya derecede. İhtiyacı karşılayacak kadar. \"Fair enough\" bir görüşü kabul ettiğini gösterir.", "examples": "1. Do we have enough time? (Yeterli zamanımız var mı?)\n2. Is the coffee sweet enough? (Kahve yeterince tatlı mı?)\n3. \"I'm too tired to go.\" \"Fair enough.\" (\"Gidecek kadar yorgun değilim.\" \"Haklısın.\")", "rank": 357}, {"word": "research", "type": "İsim / Fiil", "meaning": "1. (İsim) Araştırma.", "full_meaning": "1. (İsim) Araştırma.\n2. (Fiil) Araştırmak, incelemek.", "guide": "Bilgi edinmek veya bir konuyu anlamak için sistematik çalışma yapmak.", "examples": "1. \"He is doing research on climate change.\" (İklim değişikliği üzerine araştırma yapıyor.)\n2. \"You should research the company before the interview.\" (Mülakattan önce şirketi araştırmalısın.)", "rank": 358}, {"word": "subject", "type": "İsim / Sıfat / Fiil", "meaning": "1. (İ) Konu, ders.", "full_meaning": "1. (İ) Konu, ders.\n2. (İ) Özne (dilbilgisi).\n3. (F) Maruz bırakmak.", "guide": "Bir tartışmanın, yazının veya düşüncenin ana teması. Dilbilgisinde cümlenin öznesi.", "examples": "1. What is the subject of the meeting? (Toplantının konusu nedir?)\n2. The subject of the sentence is 'the cat'. (Cümlenin öznesi 'kedi'dir.)\n3. He was subjected to criticism. (Eleştiriye maruz kaldı.)", "rank": 359}, {"word": "easy", "type": "Sıfat/Zarf", "meaning": "1. Kolay, basit (sıfat).", "full_meaning": "1. Kolay, basit (sıfat).\n2. Rahat, stressiz (sıfat).\n3. Yavaşça, sakin (zarf, \"take it easy\").", "guide": "Yapılması veya anlaşılması zor olmayan. Zorlanmadan, rahat bir şekilde. \"Take it easy\" rahat ol veya kendini yorma anlamında.", "examples": "1. The test was very easy. (Test çok kolaydı.)\n2. an easy life (rahat bir hayat)\n3. Take it easy and relax. (Sakin ol ve rahatla.)", "rank": 360}, {"word": "art", "type": "İsim", "meaning": "1. Sanat.", "full_meaning": "1. Sanat.\n2. Beceri, hüner, ustalık.\n3. (çoğul) beşeri bilimler.", "guide": "Resim, heykel, müzik gibi yaratıcı ifade biçimleri veya bir işi yapma becerisi.", "examples": "1. Modern art can be confusing. (Modern sanat kafa karıştırıcı olabilir.)\n2. Cooking is an art. (Yemek pişirmek bir sanattır.)\n3. She has a degree in arts. (Beşeri bilimlerde bir derecesi var.)", "rank": 361}, {"word": "refer", "type": "Fiil", "meaning": "1. Atıfta bulunmak, bahsetmek.", "full_meaning": "1. Atıfta bulunmak, bahsetmek.\n2. Yönlendirmek, sevk etmek.\n3. Başvurmak (kaynağa).", "guide": "Bir konuya veya kişiye değinmek veya birini başka bir kişi/kuruma yönlendirmek.", "examples": "1. \"He referred to your earlier comment.\" (Senin önceki yorumuna atıfta bulundu.)\n2. \"The doctor referred me to a specialist.\" (Doktor beni bir uzmana sevk etti.)\n3. \"Refer to the manual for instructions.\" (Talimatlar için kılavuza başvurun.)", "rank": 362}, {"word": "nine", "type": "İsim / Sıfat", "meaning": "1. Dokuz (sayı).", "full_meaning": "1. Dokuz (sayı).\n2. Dokuz rakamı/lâkabı.\n3. Saat dokuz.", "guide": "Sekizden sonra ve ondan önce gelen sayı.", "examples": "1. There are nine planets in the solar system? (Güneş sisteminde dokuz gezegen mi var? [eskiden])\n2. She wears the number nine. (Dokuz numarayı giyiyor.)", "rank": 363}, {"word": "bit", "type": "İsim", "meaning": "1. Parça, küçük bir miktar.", "full_meaning": "1. Parça, küçük bir miktar.\n2. (Bilgisayar) bit.\n3. (a bit) biraz, azıcık.", "guide": "Küçük bir parça veya miktar. \"A bit\" biraz anlamında sıkça kullanılır.", "examples": "1. Would you like a bit of cake? (Biraz kek ister misin?)\n2. Wait a bit! (Biraz bekle!)\n3. I'm feeling a bit tired. (Biraz yorgun hissediyorum.)", "rank": 364}, {"word": "cause", "type": "İsim/Fiil", "meaning": "1. Neden, sebep (isim).", "full_meaning": "1. Neden, sebep (isim).\n2. Dava, amaç (isim).\n3. Neden olmak, sebebiyet vermek (fiil).", "guide": "Bir olayı veya durumu meydana getiren şey veya savunulan amaç.", "examples": "1. The cause of the fire is unknown. (Yangının nedeni bilinmiyor.)\n2. She fights for a good cause. (İyi bir dava için mücadele ediyor.)\n3. Smoking can cause cancer. (Sigara içmek kansere neden olabilir.)", "rank": 365}, {"word": "sure", "type": "Sıfat / Zarf", "meaning": "1. (S) Emin, kesin.", "full_meaning": "1. (S) Emin, kesin.\n2. (Z) Elbette, tabii.\n3. (S) Güvenilir, sağlam.", "guide": "Şüphe duymadan bilinen veya güvenilen. Zarf olarak onay veya kesinlik ifade eder.", "examples": "1. Are you sure? (Emin misin?)\n2. Sure, I can help you. (Tabii ki, sana yardım edebilirim.)\n3. A sure way to succeed. (Başarmanın kesin bir yolu.)", "rank": 366}, {"word": "sit", "type": "Fiil", "meaning": "1. Oturmak.", "full_meaning": "1. Oturmak.\n2. Toplanmak, oturum yapmak (meclis).\n3. (Sınav) Girmek, oturmak.", "guide": "Vücudu kalçaların üzerine yerleştirerek bir sandalye, yer vb. üzerinde durmak.", "examples": "1. Please sit down. (Lütfen oturun.)\n2. The court sits next week. (Mahkeme gelecek hafta toplanıyor.)\n3. I have to sit an exam tomorrow. (Yarın bir sınava girmem gerekiyor.)", "rank": 367}, {"word": "almost", "type": "Zarf", "meaning": "1. Neredeyse, hemen hemen.", "full_meaning": "1. Neredeyse, hemen hemen.\n2. Az kalsın.", "guide": "Bir şeyin tam olarak değil, çok yakın bir derecede gerçekleştiğini belirtir.", "examples": "1. I almost forgot your birthday. (Neredeyse doğum gününü unutuyordum.)\n2. Dinner is almost ready. (Akşam yemeği neredeyse hazır.)\n3. It's almost impossible. (Neredeyse imkansız.)", "rank": 368}, {"word": "least", "type": "Zarf / İsim", "meaning": "1. En az (miktar).", "full_meaning": "1. En az (miktar).\n2. En önemsiz, en küçük.\n3. Hiç değilse (at least).", "guide": "\"Little\"ın en üstünlük hali. En küçük miktar, derece veya önemde olan.", "examples": "1. He did the least amount of work. (En az işi o yaptı.)\n2. That's the least of my worries. (Bu endişelerimin en küçüğü.)\n3. At least we tried. (Hiç değilse denedik.)", "rank": 369}, {"word": "lose", "type": "Fiil", "meaning": "1. Kaybetmek.", "full_meaning": "1. Kaybetmek.\n2. Kaçırmak (otobüs/fırsat).\n3. Zayıflamak, kilo vermek.", "guide": "Sahip olduğun bir şeyi artık bulamamak veya elinden alınması. Bir yarışmada yenilmek.", "examples": "1. I don't want to lose my keys again. (Anahtarlarımı tekrar kaybetmek istemiyorum.)\n2. Hurry up, or we'll lose the train! (Acele et, yoksa treni kaçıracağız!)\n3. She's trying to lose weight. (Kilo vermeye çalışıyor.)", "rank": 370}, {"word": "walk", "type": "Fiil, İsim", "meaning": "1. Yürümek (fiil)", "full_meaning": "1. Yürümek (fiil)\n2. Yürüyüş (isim)\n3. Yürütmek, gezdirmek (köpek) (fiil)", "guide": "Ayakta, yürüyerek ilerlemek. Aynı zamanda, bir yeri yürüyerek geçmeyi veya bir hayvanı gezdirme eylemini ifade eder.", "examples": "1. I walk to work every day. (Her gün işe yürüyerek giderim.)\n2. Let's go for a walk in the park. (Parkta bir yürüyüşe çıkalım.)\n3. He walks his dog twice a day. (Köpeğini günde iki kez gezdirir.)", "rank": 371}, {"word": "probably", "type": "Zarf", "meaning": "1. Muhtemelen, büyük ihtimalle.", "full_meaning": "1. Muhtemelen, büyük ihtimalle.\n2. Sanırım, galiba.", "guide": "Bir şeyin yüksek olasılıkla doğru veya gerçekleşeceğini ifade eder. \"Perhaps\"ten daha güçlü bir kesinlik içerir.", "examples": "1. It will probably rain later. (Muhtemelen daha sonra yağmur yağacak.)\n2. He's probably at home by now. (Şu anda muhtemelen evdedir.)", "rank": 372}, {"word": "rise", "type": "Fiil / İsim", "meaning": "1. (Fiil) Yükselmek, kalkmak.", "full_meaning": "1. (Fiil) Yükselmek, kalkmak.\n2. (Fiil) Artmak, çoğalmak.\n3. (İsim) Yükseliş, artış.", "guide": "Yukarı doğru hareket etmek veya miktar/ seviye olarak artmak.", "examples": "1. \"The sun rises in the east.\" (Güneş doğudan doğar.)\n2. \"Prices are rising.\" (Fiyatlar yükseliyor.)\n3. \"There's been a sharp rise in unemployment.\" (İşsizlikte keskin bir yükseliş oldu.)", "rank": 373}, {"word": "class", "type": "İsim/Fiil", "meaning": "1. Sınıf (okul) (isim).", "full_meaning": "1. Sınıf (okul) (isim).\n2. Sınıf, tabaka (toplumsal) (isim).\n3. Sınıflandırmak (fiil).", "guide": "Öğrencilerin öğrenim gördüğü grup veya sosyal/ekonomik derece.", "examples": "1. I have a math class at 10. (Saat 10'da bir matematik dersim var.)\n2. working class (işçi sınıfı)\n3. first-class service (birinci sınıf hizmet)", "rank": 374}, {"word": "top", "type": "İsim / Sıfat / Fiil", "meaning": "İsim: 1. Üst, tepe.", "full_meaning": "İsim: 1. Üst, tepe.\n2. En üst düzey, lider.\nSıfat: 3. En üst, en iyi.\nFiil: 4. Üstün gelmek, geçmek.\n5. Üstüne koymak.", "guide": "En yüksek nokta veya seviye. Sıfat olarak en iyiyi ifade eder. Fiil olarak, bir şeyi aşmak veya üzerini kapamak.", "examples": "1. The book is on the top shelf. (Kitap en üst rafta.)\n2. She is at the top of her class. (Sınıfının en iyisi/birincisi.)\n3. Can you top this story? (Bu hikayeyi daha iyi anlatabilir/geçebilir misin?)", "rank": 375}, {"word": "together", "type": "Zarf", "meaning": "1. Birlikte, beraber.", "full_meaning": "1. Birlikte, beraber.\n2. Aynı anda.\n3. Bir araya getirilmiş.", "guide": "İnsanların veya nesnelerin bir grup oluşturması veya bir işin ortaklaşa yapılması.", "examples": "1. Let's work together on this project. (Bu projede birlikte çalışalım.)\n2. They arrived together. (Birlikte geldiler.)\n3. Mix the ingredients together. (Malzemeleri birbirine karıştırın.)", "rank": 376}, {"word": "sort", "type": "İsim / Fiil", "meaning": "1. (İ) Tür, çeşit.", "full_meaning": "1. (İ) Tür, çeşit.\n2. (F) Sıralamak, ayırmak.\n3. (İ) Kişi, tip (biraz küçümseyici).", "guide": "Benzer özelliklere sahip şeylerin kategorisi. Fiil olarak düzenlemek.", "examples": "1. What sort of music do you like? (Ne tür müzik seversin?)\n2. Sort the papers by date. (Kâğıtları tarihe göre sırala.)\n3. He's a strange sort. (O tuhaf bir tip.)", "rank": 377}, {"word": "limit", "type": "İsim / Fiil", "meaning": "1. Sınır, limit.", "full_meaning": "1. Sınır, limit.\n2. Azami, üst sınır.\n3. Sınırlamak, kısıtlamak.", "guide": "İzin verilen veya mümkün olan en son nokta veya derece. Bir şeyin miktarını veya boyutunu kontrol altına almak.", "examples": "1. What's the speed limit on this road? (Bu yoldaki hız sınırı nedir?)\n2. There's a limit to my patience. (Sabrımın bir sınırı var.)\n3. We must limit our spending this month. (Bu ay harcamalarımızı kısıtlamalıyız.)", "rank": 378}, {"word": "likely", "type": "Sıfat / Zarf", "meaning": "1. Olası, muhtemel.", "full_meaning": "1. Olası, muhtemel.\n2. Büyük ihtimalle.\n3. Uygun, elverişli.", "guide": "Yüksek bir olasılıkla gerçekleşecek olan. \"Probably\" ile benzer anlamda.", "examples": "1. Rain is likely tomorrow. (Yarın yağmur muhtemel.)\n2. She is likely to be late. (Büyük olasılıkla geç kalacak.)\n3. This is the most likely explanation. (Bu en olası açıklama.)", "rank": 379}, {"word": "visit", "type": "Fiil, İsim", "meaning": "1. Ziyaret etmek (fiil)", "full_meaning": "1. Ziyaret etmek (fiil)\n2. Ziyaret (isim)\n3. Denetlemek, gözden geçirmek (fiil)", "guide": "Bir yere veya birine gitmek, genellikle belirli bir süre kalmak. Daha resmi anlamda bir denetim veya inceleme yapmak için de kullanılır.", "examples": "1. We will visit our grandparents this weekend. (Bu hafta sonu büyük anne ve büyük babamızı ziyaret edeceğiz.)\n2. Thank you for your visit! (Ziyaretiniz için teşekkür ederim!)\n3. The health inspector will visit the restaurant tomorrow. (Sağlık müfettişi yarın restoranı denetleyecek.)", "rank": 380}, {"word": "period", "type": "İsim", "meaning": "1. Dönem, devir.", "full_meaning": "1. Dönem, devir.\n2. Süre, zaman dilimi.\n3. (ABD) Nokta (noktalama işareti).\n4. Regl, adet dönemi.", "guide": "Belirli bir zaman aralığı. ABD İngilizcesinde cümle sonundaki nokta işaretinin adıdır. Ayrıca regl dönemi için de kullanılır.", "examples": "1. The Victorian period was a time of great change. (Viktorya dönemi büyük değişim zamanıydı.)\n2. We will be closed for a short period. (Kısa bir süreliğine kapalı olacağız.)\n3. (US) Don't forget to put a period at the end of the sentence. (Cümlenin sonuna nokta koymayı unutma.)\n4. She has bad cramps during her period. (Regl döneminde şiddetli krampları oluyor.)", "rank": 381}, {"word": "design", "type": "Fiil/İsim", "meaning": "1. Tasarlamak (fiil).", "full_meaning": "1. Tasarlamak (fiil).\n2. Tasarım, plan (isim).\n3. Amaç, niyet (isim).", "guide": "Bir şeyin nasıl görüneceğini, çalışacağını veya yapılacağını planlamak ve çizmek.", "examples": "1. She designed her own wedding dress. (Kendi gelinliğini tasarladı.)\n2. I like the modern design of this building. (Bu binanın modern tasarımını beğeniyorum.)\n3. He did it by design, not by accident. (Onu kaza ile değil, kasten yaptı.)", "rank": 382}, {"word": "labour", "type": "İsim / Fiil", "meaning": "(İsim): 1. Emek, işgücü.", "full_meaning": "(İsim): 1. Emek, işgücü.\n2. Doğum sancısı, doğum.\n3. İşçi sınıfı.\n(Fiil): 4. Zahmetle çalışmak, uğraşmak.", "guide": "Fiziksel veya zihinsel çaba. Ayrıca bir bebeğin doğum süreci. Fiil olarak zorlanarak bir iş yapmak.", "examples": "1. The project required a lot of manual labour. (Proje çok fazla beden işçiliği gerektirdi.)\n2. She went into labour in the early morning. (Sabahın erken saatlerinde doğum sancıları başladı.)\n3. The party has strong support from the labour movement. (Parti, işçi hareketinden güçlü destek alıyor.)\n4. I laboured over the report all night. (Rapor üzerinde bütün gece uğraştım.)", "rank": 383}, {"word": "share", "type": "Fiil / İsim", "meaning": "1. (F) Paylaşmak.", "full_meaning": "1. (F) Paylaşmak.\n2. (İ) Pay, hisse.\n3. (İ) Hissedar payı.", "guide": "Bir şeyin bir kısmını başkasına vermek veya ortak kullanmak. İsim olarak bir bölünmüş şeyin parçası veya şirket hissesi.", "examples": "1. Can I share your umbrella? (Şemsiyeni paylaşabilir miyim?)\n2. Everyone should do their share of the work. (Herkes işin kendi payına düşeni yapmalı.)\n3. He bought 100 shares in Apple. (Apple'da 100 hisse satın aldı.)", "rank": 384}, {"word": "success", "type": "İsim", "meaning": "1. Başarı.", "full_meaning": "1. Başarı.\n2. Başarılı sonuç.\n3. Başarılı kişi veya şey.", "guide": "Bir şeyi başarmış olma durumu veya iyi sonuçlanmış bir girişim.", "examples": "1. The project was a great success. (Proje büyük bir başarıydı.)\n2. I wish you success. (Sana başarılar dilerim.)\n3. The party was a success. (Parti bir başarıydı.)", "rank": 385}, {"word": "trade", "type": "İsim / Fiil", "meaning": "İsim: 1. Ticaret, alışveriş.", "full_meaning": "İsim: 1. Ticaret, alışveriş.\n2. Meslek, zanaat.\nFiil: 3. Ticaret yapmak, takas etmek.\n4. (Spor) Takas etmek.", "guide": "Mal veya hizmet alışverişi. Bir iş veya meslek.", "examples": "1. International trade is important for the economy. (Uluslararası ticaret ekonomi için önemlidir.)\n2. He is a carpenter by trade. (Mesleği olarak marangozdur.)\n3. Would you trade seats with me? (Benimle koltuk değiş tokuşu yapar mısın?)", "rank": 386}, {"word": "office", "type": "İsim", "meaning": "1. Ofis, büro.", "full_meaning": "1. Ofis, büro.\n2. Görev, makam (resmi).\n3. (the office) kamu dairesi.", "guide": "Çalışma yeri veya resmi bir pozisyon.", "examples": "1. I’ll be in my office all day. (Bütün gün ofisimde olacağım.)\n2. He held the office of mayor for four years. (Dört yıl boyunca belediye başkanlığı görevini yürüttü.)", "rank": 387}, {"word": "represent", "type": "Fiil", "meaning": "1. Temsil etmek.", "full_meaning": "1. Temsil etmek.\n2. Simgelemek, ifade etmek.\n3. (Resmi) Olarak bulunmak.", "guide": "Bir kişi veya grubun adına hareket etmek veya bir şeyi sembolize etmek.", "examples": "1. \"She represents our company at the conference.\" (O, şirketimizi konferansta temsil ediyor.)\n2. \"The dove represents peace.\" (Güvercin barışı simgeler.)\n3. \"You will need a lawyer to represent you in court.\" (Mahkemede sizi temsil edecek bir avukata ihtiyacınız olacak.)", "rank": 388}, {"word": "available", "type": "Sıfat", "meaning": "1. Mevcut, var olan.", "full_meaning": "1. Mevcut, var olan.\n2. Müsait, uygun.\n3. Elde edilebilir, kullanılabilir.", "guide": "Kullanıma, satın almaya hazır olan veya birisiyle görüşmeye uygun olan.", "examples": "1. Is this dress available in a larger size? (Bu elbise daha büyük bir bedende mevcut mu?)\n2. I'm available for a meeting tomorrow. (Yarınki bir toplantı için müsaitim.)\n3. The information is available online. (Bilgi çevrimiçi olarak mevcuttur.)", "rank": 389}, {"word": "individual", "type": "Sıfat, İsim", "meaning": "1. (Sıfat) Bireysel, kişisel.", "full_meaning": "1. (Sıfat) Bireysel, kişisel.\n2. (Sıfat) Tek, ayrı ayrı.\n3. (İsim) Birey, fert.", "guide": "Bir gruba değil, tek bir kişiye veya şeye ait olan. Her biri ayrı olan. Tek bir insan.", "examples": "1. Each individual student has different needs. (Her bireysel öğrencinin farklı ihtiyaçları vardır.)\n2. Serve the cakes on individual plates. (Pastaları ayrı/tek tek tabaklarda servis yapın.)\n3. The rights of the individual are important. (Bireyin hakları önemlidir.)", "rank": 390}, {"word": "draw", "type": "Fiil/İsim", "meaning": "1. Çizmek (resim) (fiil).", "full_meaning": "1. Çizmek (resim) (fiil).\n2. Çekmek (ilgi/dikkat) (fiil).\n3. Berabere bitmek (isim/fiil).", "guide": "Kalem, tebeşir vb. ile resim yapmak. Bir şeyi kendine doğru hareket ettirmek veya ilgi toplamak. Bir yarışmada eşit sonuçlanmak.", "examples": "1. The child can draw very well. (Çocuk çok güzel çizebiliyor.)\n2. The concert drew a large crowd. (Konser büyük bir kalabalık çekti.)\n3. The game ended in a 1-1 draw. (Maç 1-1 berabere bitti.)", "rank": 391}, {"word": "hard", "type": "Sıfat, Zarf", "meaning": "1. (Sıfat) Sert, katı.", "full_meaning": "1. (Sıfat) Sert, katı.\n2. (Sıfat) Zor, güç.\n3. (Zarf) Sıkı, şiddetle, çok.", "guide": "Yumuşak olmayan, fiziksel olarak katı. Yapılması zor, zahmetli. Zarf olarak yoğun bir çaba ile.", "examples": "1. The ground is very hard. (Zemin çok sert.) [Sıfat]\n2. It's a hard question. (Zor bir soru.) [Sıfat]\n3. He works very hard. (Çok sıkı çalışıyor.) [Zarf]", "rank": 392}, {"word": "health", "type": "İsim", "meaning": "1. Sağlık.", "full_meaning": "1. Sağlık.\n2. Sağlık durumu.\n3. Refah, iyi olma hali.", "guide": "Fiziksel ve zihinsel iyilik hali. Birinin genel durumu.", "examples": "1. Health is more important than wealth. (Sağlık zenginlikten daha önemlidir.)\n2. He is in poor health. (Onun sağlık durumu kötü.)\n3. The health of the economy is improving. (Ekonominin sağlığı/refahı iyileşiyor.)", "rank": 393}, {"word": "cover", "type": "Fiil/İsim", "meaning": "1. Örtmek, kaplamak (fiil).", "full_meaning": "1. Örtmek, kaplamak (fiil).\n2. Kapak (kitap) (isim).\n3. (Sigorta) kapsamak (fiil).", "guide": "Bir şeyin üzerini başka bir şeyle kapatmak veya bir alanı içermek.", "examples": "1. Cover the pot with a lid. (Tencereyi bir kapakla ört.)\n2. The book has a red cover. (Kitabın kırmızı bir kapağı var.)\n3. Does your insurance cover this? (Sigortanız bunu kapsıyor mu?)", "rank": 394}, {"word": "accept", "type": "Fiil", "meaning": "1. Kabul etmek (teklif/hediye).", "full_meaning": "1. Kabul etmek (teklif/hediye).\n2. Kabul etmek, onaylamak (fikir/durum).\n3. Katlanmak, sineye çekmek.", "guide": "Bir şeyi almaya veya bir gerçeği/durumu doğru veya kaçınılmaz olarak kabul etmeye razı olmak.", "examples": "1. I gladly accept your invitation. (Davetinizi memnuniyetle kabul ediyorum.)\n2. He found it hard to accept the truth. (Gerçeği kabullenmekte zorlandı.)\n3. You have to accept the consequences of your actions. (Eylemlerinin sonuçlarına katlanmak zorundasın.)", "rank": 395}, {"word": "seven", "type": "Sayı / İsim", "meaning": "1. Yedi.", "full_meaning": "1. Yedi.\n2. Yedili, yedi sayısı.", "guide": "Altıdan sonra ve sekizden önce gelen sayı.", "examples": "1. There are seven days in a week. (Bir haftada yedi gün vardır.)\n2. She is seven years old. (O yedi yaşında.)\n3. Roll a seven. (Yedi at.)", "rank": 396}, {"word": "mother", "type": "İsim / Fiil", "meaning": "1. Anne, ana.", "full_meaning": "1. Anne, ana.\n2. (Bir şeyin) kaynağı, kökeni.\n3. (Birine) annelik yapmak, şefkat göstermek.", "guide": "Bir çocuğu doğuran veya büyüten kadın. Mecazi olarak bir şeyin kökenini ifade eder. Fiil olarak aşırı korumacı davranmak.", "examples": "1. My mother is a teacher. (Annem öğretmendir.)\n2. Necessity is the mother of invention. (İhtiyaç icadın anasıdır.)\n3. She tends to mother her younger brothers. (Küçük kardeşlerine annelik yapma eğilimindedir.)", "rank": 397}, {"word": "land", "type": "İsim / Fiil", "meaning": "(İsim): 1. Kara, toprak, arazi.", "full_meaning": "(İsim): 1. Kara, toprak, arazi.\n2. Ülke, diyar.\n(Fiil): 3. İnmek, konmak (uçak/kuş).\n4. (İş/Bela) Bulmak, kapmak.", "guide": "(İsim) Denizin olmadığı yeryüzü parçası veya mülk olarak toprak. (Fiil) Uçan bir şeyin yere temas etmesi veya (argo) bir şeyi elde etmek.", "examples": "1. After weeks at sea, we finally saw land. (Haftalarca denizde kaldıktan sonra nihayet kara gördük.)\n2. He owns a lot of land in the countryside. (Kırsalda çok arazisi var.)\n3. The plane will land in twenty minutes. (Uçak yirmi dakika içinde inecek.)\n4. He landed a great job at a tech company. (Bir teknoloji şirketinde harika bir iş buldu.)", "rank": 398}, {"word": "major", "type": "Sıfat / İsim", "meaning": "1. Büyük, önemli, ciddi.", "full_meaning": "1. Büyük, önemli, ciddi.\n2. (Eğitimde) ana dal, branş.\n3. (Askeri rütbe) Binbaşı.", "guide": "Sıfat olarak boyut, önem veya ciddiyet belirtir. İsim olarak üniversitede ana çalışma alanı veya askeri bir rütbedir.", "examples": "1. There has been a major change in plans. (Planlarda büyük bir değişiklik oldu.)\n2. Her major is computer science. (Onun ana dalı bilgisayar bilimi.)\n3. He was promoted to the rank of major. (Binbaşı rütbesine terfi ettirildi.)", "rank": 399}, {"word": "account", "type": "İsim/Fiil", "meaning": "1. Hesap (banka, hesap özeti).", "full_meaning": "1. Hesap (banka, hesap özeti).\n2. Açıklama, anlatım, rapor (isim).\n3. (account for) Açıklamak, hesap vermek (fiil).", "guide": "Günlük dilde çoğunlukla banka hesabı veya bir olayın anlatımı anlamındadır.", "examples": "1. I need to check my bank account. (Banka hesabımı kontrol etmem gerekiyor.)\n2. He gave a detailed account of what happened. (Olanlarla ilgili detaylı bir anlatımda bulundu.)\n3. How do you account for your actions? (Eylemlerini nasıl açıklarsın?)", "rank": 400}, {"word": "break", "type": "Fiil/İsim", "meaning": "1. Kırmak, bozmak (fiil).", "full_meaning": "1. Kırmak, bozmak (fiil).\n2. Mola, ara (isim).\n3. (Kuralları) çiğnemek.", "guide": "Bir şeyi parçalara ayırmak veya bir sürekliliği kesmek.", "examples": "1. Be careful not to break the glass. (Camı kırmamaya dikkat et.)\n2. Let's take a break. (Bir mola verelim.)\n3. He broke the world record. (Dünya rekorunu kırdı.)", "rank": 401}, {"word": "short", "type": "Sıfat / Zarf", "meaning": "1. (S) Kısa.", "full_meaning": "1. (S) Kısa.\n2. (S) Kısa boylu.\n3. (Z) Aniden, birdenbire.", "guide": "Uzunluğu, süresi veya boyu az olan. Zarf olarak eksik, noksan anlamında.", "examples": "1. She has short hair. (Kısa saçları var.)\n2. He is shorter than his brother. (Erkek kardeşinden daha kısa boylu.)\n3. The car stopped short. (Araba aniden durdu.)", "rank": 402}, {"word": "note", "type": "İsim / Fiil", "meaning": "1. Not, kısa yazı.", "full_meaning": "1. Not, kısa yazı.\n2. Nota (müzik).\n3. Banknot, kâğıt para.\n4. Not etmek, kaydetmek; dikkat etmek.", "guide": "Kısa yazılı mesaj veya müzikal ses. Fiil olarak bir şeyi yazmak veya fark etmek.", "examples": "1. She left me a note on the table. (Masada bana bir not bıraktı.)\n2. Can you read musical notes? (Müzik notalarını okuyabilir misin?)\n3. a £10 note (10 poundluk banknot)\n4. Please note that the office will be closed tomorrow. (Lütfen ofisin yarın kapalı olacağını not edin.)", "rank": 403}, {"word": "finance", "type": "İsim/Fiil", "meaning": "1. Finans, maliye (isim).", "full_meaning": "1. Finans, maliye (isim).\n2. Finanse etmek, parasını sağlamak (fiil).", "guide": "Para yönetimi, özellikle büyük miktarlarda veya devlet/hükümet düzeyinde. Bir proje veya satın alma için para sağlamak.", "examples": "1. the Minister of Finance (Maliye Bakanı)\n2. The project was financed by a bank loan. (Proje bir banka kredisi ile finanse edildi.)", "rank": 404}, {"word": "million", "type": "İsim / Sıfat", "meaning": "1. Milyon (1.000.000).", "full_meaning": "1. Milyon (1.000.000).\n2. Çok büyük sayı, pek çok.\n3. (millions of) Sayısız, milyonlarca.", "guide": "Sayısal değer olarak bin kere bin. Mecazi olarak çok büyük bir miktarı ifade etmek için kullanılır.", "examples": "1. The city has a population of two million. (Şehrin nüfusu iki milyon.)\n2. I've told you a million times! (Sana milyon kere söyledim!)\n3. There were millions of stars in the sky. (Gökyüzünde milyonlarca yıldız vardı.)", "rank": 405}, {"word": "police", "type": "İsim (çoğul)/Fiil", "meaning": "1. (İsim) Polis (kurum/güç).", "full_meaning": "1. (İsim) Polis (kurum/güç).\n2. (Fiil) Denetlemek, kontrol etmek.\n3. (Fiil) Polislik yapmak (bir bölgede).", "guide": "Kanun ve düzeni sağlamakla görevli resmi kuruluş. Fiil olarak bir alanı kontrol altında tutmak.", "examples": "1. Call the police! (Polisi arayın!)\n2. The meeting was policed by security guards. (Toplantı güvenlik görevlileri tarafından denetlendi.)\n3. The area is well policed at night. (Bölge gece iyi polislik yapılıyor.)", "rank": 406}, {"word": "position", "type": "İsim/Fiil", "meaning": "1. (İsim) Konum, yer.", "full_meaning": "1. (İsim) Konum, yer.\n2. (İsim) Pozisyon, iş/görev.\n3. (Fiil) Yerleştirmek, konumlandırmak.", "guide": "Bir şeyin bulunduğu yer. Bir organizasyondaki rol veya statü. Fiil olarak bir yere koymak.", "examples": "1. Please indicate your position on the map. (Lütfen haritadaki konumunuzu işaretleyin.)\n2. She was offered a position as manager. (Ona yönetici pozisyonu teklif edildi.)\n3. He positioned the camera carefully. (Kamerayı dikkatlice konumlandırdı.)", "rank": 407}, {"word": "cut", "type": "Fiil/İsim", "meaning": "1. Kesmek (fiil).", "full_meaning": "1. Kesmek (fiil).\n2. Azaltmak, kısmak (fiil).\n3. Kesik, yara (isim).", "guide": "Bir şeyi keskin bir aletle ayırmak veya miktarını azaltmak.", "examples": "1. Cut the bread into slices. (Ekmeği dilimlere kes.)\n2. We need to cut costs. (Maliyetleri kısmamız gerekiyor.)\n3. a deep cut on his finger (parmağında derin bir kesik)", "rank": 408}, {"word": "exist", "type": "Fiil", "meaning": "1. Var olmak, mevcut olmak.", "full_meaning": "1. Var olmak, mevcut olmak.\n2. Yaşamak, geçinmek.\n3. (Sadece) Olmak, bulunmak.", "guide": "Gerçek veya fiziksel olarak bulunmak. Belli koşullar altında hayatta kalmak. Çok basit veya sınırlı bir şekilde olmak.", "examples": "1. Do you believe that ghosts exist? (Hayaletlerin var olduğuna inanıyor musun?)\n2. They exist on a diet of rice and vegetables. (Pirinç ve sebze diyetiyle yaşıyorlar.)\n3. The problem only exists in your mind. (Sorun sadece senin zihninde var.)", "rank": 409}, {"word": "wide", "type": "Sıfat, Zarf", "meaning": "1. Geniş (sıfat)", "full_meaning": "1. Geniş (sıfat)\n2. Geniş, kapsamlı (sıfat)\n3. Tamamen, sonuna kadar (açık) (zarf)", "guide": "Bir yandan diğer yana olan mesafenin büyük olduğunu belirtir. Mecazi olarak çeşitlilik ifade eder. Zarf olarak, tamamen açık anlamında kullanılır.", "examples": "1. The river is very wide here. (Nehir burada çok geniş.)\n2. She has a wide range of interests. (Geniş bir ilgi alanı var.)\n3. Open your mouth wide. (Ağzını iyice aç.)", "rank": 410}, {"word": "stop", "type": "Fiil / İsim", "meaning": "1. (F) Durmak, durdurmak.", "full_meaning": "1. (F) Durmak, durdurmak.\n2. (İ) Durak.\n3. (F) Son vermek, bırakmak.", "guide": "Hareket etmeyi bırakmak veya bir şeyin devam etmesini engellemek.", "examples": "1. Stop the car! (Arabayı durdur!)\n2. I'll get off at the next stop. (Bir sonraki durakta ineceğim.)\n3. He stopped smoking. (Sigara içmeyi bıraktı.)", "rank": 411}, {"word": "rule", "type": "İsim / Fiil", "meaning": "1. (İsim) Kural.", "full_meaning": "1. (İsim) Kural.\n2. (Fiil) Yönetmek, hükmetmek.\n3. (Fiil) Karar vermek (mahkeme).", "guide": "Davranışı yöneten ilke veya bir ülkeyi/grubu kontrol etmek.", "examples": "1. \"You must follow the rules.\" (Kurallara uymalısın.)\n2. \"The king ruled for forty years.\" (Kral kırk yıl hüküm sürdü.)\n3. \"The judge ruled in his favor.\" (Hakim onun lehine karar verdi.)", "rank": 412}, {"word": "society", "type": "İsim", "meaning": "1. Toplum.", "full_meaning": "1. Toplum.\n2. Dernek, cemiyet.\n3. Yüksek sosyete.", "guide": "Belirli bir bölgede yaşayan, ortak kültür ve kurumları paylaşan insan grubu.", "examples": "1. We live in a modern society. (Modern bir toplumda yaşıyoruz.)\n2. He's a member of the historical society. (Tarih derneğinin bir üyesidir.)\n3. They moved in high society. (Yüksek sosyetede dolaştılar.)", "rank": 413}, {"word": "city", "type": "İsim", "meaning": "1. Şehir, kent.", "full_meaning": "1. Şehir, kent.\n2. (the City) Londra'nın finans merkezi.\n3. Şehir merkezi.", "guide": "Büyük ve önemli bir kasabadan daha büyük yerleşim yeri.", "examples": "1. New York is a big city. (New York büyük bir şehirdir.)\n2. I work in the City. (Londra finans merkezinde çalışıyorum.)", "rank": 414}, {"word": "recent", "type": "Sıfat", "meaning": "1. Yakın zamanda olan, yeni, son.", "full_meaning": "1. Yakın zamanda olan, yeni, son.\n2. Güncel.", "guide": "Çok zaman geçmeden önce meydana gelen veya var olan.", "examples": "1. \"In recent years, technology has advanced rapidly.\" (Son yıllarda teknoloji hızla ilerledi.)\n2. \"What is the most recent news?\" (En son haber nedir?)", "rank": 415}, {"word": "century", "type": "İsim", "meaning": "1. Yüzyıl, asır.", "full_meaning": "1. Yüzyıl, asır.\n2. (Kriket) yüz sayı.\n3. Yüzlük.", "guide": "100 yıllık zaman dilimi.", "examples": "1. We live in the 21st century. (21. yüzyılda yaşıyoruz.)\n2. a 19th-century building (19. yüzyıldan kalma bir bina)", "rank": 416}, {"word": "ever", "type": "Zarf", "meaning": "1. Hiç (soru/olumsuz).", "full_meaning": "1. Hiç (soru/olumsuz).\n2. Her zaman, daima (always'dan vurgulu).\n3. (than ever) Hiç olmadığı kadar.", "guide": "Geçmişte veya gelecekte herhangi bir zamanda. Süreklilik vurgusu yapar. Karşılaştırmalarda \"hiç olmadığı kadar\" anlamı verir.", "examples": "1. Have you ever been to Paris? (Hiç Paris'e gittin mi?)\n2. He is ever hopeful. (O her zaman umutludur.)\n3. It's colder than ever today. (Bugün hiç olmadığı kadar soğuk.)", "rank": 417}, {"word": "argue", "type": "Fiil", "meaning": "1. Tartışmak, münakaşa etmek.", "full_meaning": "1. Tartışmak, münakaşa etmek.\n2. Savunmak, iddia etmek (fikir).\n3. İkna etmeye çalışmak.", "guide": "Fikir ayrılığı nedeniyle hararetle konuşmak veya bir fikri nedenleriyle savunmak.", "examples": "1. They always argue about politics. (Onlar her zaman politika hakkında tartışırlar.)\n2. He argued that taxes should be lowered. (Vergilerin düşürülmesi gerektiğini savundu.)\n3. She argued him into changing his mind. (Onu fikrini değiştirmeye ikna etti.)", "rank": 418}, {"word": "black", "type": "Sıfat/İsim", "meaning": "1. Siyah, kara (sıfat/isim).", "full_meaning": "1. Siyah, kara (sıfat/isim).\n2. Koyu, karanlık.\n3. (coffee) sade, şekersiz.", "guide": "En koyu renk, ışığın yokluğu. Kahve için sade anlamına gelir.", "examples": "1. She was wearing a black dress. (Siyah bir elbise giyiyordu.)\n2. Black coffee, please. (Sade kahve, lütfen.)\n3. The room was in blackness. (Oda kapkaranlıktı.)", "rank": 419}, {"word": "type", "type": "İsim / Fiil", "meaning": "İsim: 1. Tür, çeşit.", "full_meaning": "İsim: 1. Tür, çeşit.\n2. (Baskı) Harf, font.\nFiil: 3. Daktilo ile yazmak, bilgisayarda yazmak.\n4. (type into) Yazıya dökmek.", "guide": "Belirli özellikleri paylaşan kategori veya sınıf. Ayrıca, yazma eylemi.", "examples": "1. What type of music do you like? (Ne tür müzik seversin?)\n2. Please type your essay. (Lütfen makalenizi yazın/daktilo edin.)\n3. She's not my type. (O benim tipim değil.)", "rank": 420}, {"word": "doctor", "type": "İsim", "meaning": "1. Doktor, hekim.", "full_meaning": "1. Doktor, hekim.\n2. Doktora sahibi kişi.\n3. Tamirci, usta (argo, \"tamir etmek\" anlamında).", "guide": "Tıp doktoru (MD). Akademik doktora derecesi (PhD) sahibi. Bozuk bir şeyi onarmak (to doctor something up).", "examples": "1. You should see a doctor about that cough. (Bu öksürük için bir doktora görünmelisin.)\n2. Dr. Smith has a doctorate in history. (Dr. Smith'in tarih alanında doktorası var.)", "rank": 421}, {"word": "community", "type": "İsim", "meaning": "1. Topluluk, cemiyet.", "full_meaning": "1. Topluluk, cemiyet.\n2. (Belirli bir grup) camia.\n3. Ortaklık, benzerlik.", "guide": "Aynı bölgede yaşayan veya ortak özellikleri paylaşan insan grubu.", "examples": "1. the local community (yerel topluluk)\n2. the business community (iş dünyası)\n3. a sense of community (bir topluluk duygusu)", "rank": 422}, {"word": "condition", "type": "İsim/Fiil", "meaning": "1. Durum, hal (isim).", "full_meaning": "1. Durum, hal (isim).\n2. Koşul, şart (isim).\n3. Şartlandırmak, koşullandırmak (fiil).", "guide": "Bir şeyin mevcut durumu veya bir şeyin gerçekleşmesi için gerekli olan şart.", "examples": "1. The car is in good condition. (Araba iyi durumda.)\n2. One condition of the job is that you travel. (İşin bir koşulu seyahat etmenizdir.)\n3. a medical condition (tıbbi bir durum)", "rank": 423}, {"word": "either", "type": "Bağlaç/Zamir/Sıfat", "meaning": "1. (Olumsuz) ... de (bağlaç).", "full_meaning": "1. (Olumsuz) ... de (bağlaç).\n2. İkisinden biri (zamir).\n3. İki, her iki (sıfat).", "guide": "Olumsuz cümlelerde \"de/da\" anlamında (\"I don't like it either.\"). İki seçenekten herhangi birini ifade eder (\"either one\").", "examples": "1. I don't like coffee, and I don't like tea either. (Kahve sevmiyorum, çayı da sevmiyorum.)\n2. You can choose either of the two options. (İki seçenekten birini seçebilirsin.)\n3. There are trees on either side of the road. (Yolun her iki tarafında ağaçlar var.)", "rank": 424}, {"word": "voice", "type": "İsim, Fiil", "meaning": "1. Ses (insan) (isim)", "full_meaning": "1. Ses (insan) (isim)\n2. Görüş, söz hakkı (isim)\n3. İfade etmek, dile getirmek (fiil)", "guide": "İnsanın konuşma veya şarkı söyleme sesi. Mecazi olarak, bir fikri ifade etme hakkı veya yetkisi anlamına gelir. Fiil olarak, bir görüşü dile getirmek demektir.", "examples": "1. She has a beautiful singing voice. (Güzel bir şarkı söyleme sesi var.)\n2. Employees should have a voice in company decisions. (Çalışanların şirket kararlarında söz hakkı olmalı.)\n3. Many people voiced their concerns about the plan. (Birçok insan planla ilgili endişelerini dile getirdi.)", "rank": 425}, {"word": "among", "type": "Edat", "meaning": "1. Arasında (ikiden fazla şey/kişi).", "full_meaning": "1. Arasında (ikiden fazla şey/kişi).\n2. Arasında paylaşılan.\n3. -in çoğunluğu arasında.", "guide": "Bir grubun veya kitlenin içinde veya parçası olma durumunu ifade eder. \"Between\" ikili ilişkiler için kullanılırken, \"among\" üç veya daha fazlası için kullanılır.", "examples": "1. She was sitting among friends. (Arkadaşlarının arasında oturuyordu.)\n2. Divide the sweets among the children. (Şekerleri çocuklar arasında paylaştır.)\n3. This is a common problem among teenagers. (Bu, gençler arasında yaygın bir sorundur.)", "rank": 426}, {"word": "white", "type": "Sıfat, İsim", "meaning": "1. Beyaz (sıfat)", "full_meaning": "1. Beyaz (sıfat)\n2. Beyaz (ırk/renk) (isim)\n3. Yumurta akı (isim)", "guide": "Kar veya süt rengi, en açık renk. İnsan ırkını veya yumurtanın beyaz kısmını tanımlamak için de kullanılır.", "examples": "1. She wore a beautiful white dress. (Güzel bir beyaz elbise giydi.)\n2. The walls were painted white. (Duvarlar beyaza boyandı.)\n3. Separate the egg white from the yolk. (Yumurta akını sarısından ayırın.)", "rank": 427}, {"word": "learn", "type": "Fiil", "meaning": "1. Öğrenmek.", "full_meaning": "1. Öğrenmek.\n2. Haber almak, duymak.\n3. Ezberlemek.", "guide": "Bilgi veya beceri edinmek. Bir şeyin farkına varmak veya haberdar olmak.", "examples": "1. Children learn languages quickly. (Çocuklar dilleri hızlı öğrenir.)\n2. I was sorry to learn about your loss. (Kaybınızı öğrendiğim için üzüldüm.)\n3. He learned the poem by heart. (Şiiri ezberledi.)", "rank": 428}, {"word": "sell", "type": "Fiil", "meaning": "1. Satmak.", "full_meaning": "1. Satmak.\n2. (Bir fikri) Kabul ettirmek, satmak.\n3. (Argo) Aldatmak, kandırmak.", "guide": "Bir mal veya hizmeti para karşılığında vermek. Mecazi olarak ikna etmek anlamında da kullanılır.", "examples": "1. I want to sell my car. (Arabamı satmak istiyorum.)\n2. You need to sell your idea to the team. (Fikrini ekibe kabul ettirmen gerekiyor.)\n3. He sold me a broken phone. (Bana bozuk bir telefon sattı/yalan söyledi.)", "rank": 429}, {"word": "spend", "type": "Fiil", "meaning": "1. Harcamak (para).", "full_meaning": "1. Harcamak (para).\n2. Geçirmek (zaman).\n3. Tüketmek, bitirmek.", "guide": "Para ödemek veya zamanı bir şekilde geçirmek.", "examples": "1. I spent too much money. (Çok fazla para harcadım.)\n2. How did you spend your holiday? (Tatilini nasıl geçirdin?)\n3. Don't spend all your energy at once. (Tüm enerjini bir anda tüketme.)", "rank": 430}, {"word": "mark", "type": "İsim / Fiil", "meaning": "1. İşaret, iz, leke.", "full_meaning": "1. İşaret, iz, leke.\n2. Not, puan (sınav).\n3. İşaretlemek, belirlemek.", "guide": "Bir yüzeydeki görünür iz veya sembolik bir gösterge olabilir. Fiil olarak işaret koymak veya önemli bir anı belirtmek anlamındadır.", "examples": "1. There's a dirty mark on your shirt. (Gömleğinde kirli bir leke var.)\n2. She got a high mark on the test. (Sınavdan yüksek bir not aldı.)\n3. Please mark the important dates. (Lütfen önemli tarihleri işaretleyin.)", "rank": 431}, {"word": "present", "type": "Sıfat/İsim/Fiil", "meaning": "1. (Sıfat) Mevcut, şimdiki.", "full_meaning": "1. (Sıfat) Mevcut, şimdiki.\n2. (İsim) Hediye.\n3. (Fiil) Sunmak, takdim etmek.\n4. (Fiil) Ortaya çıkarmak.", "guide": "Şu anda olan. Verilen hediye. Bir şeyi resmi olarak göstermek veya tanıtmak.", "examples": "1. (Sıfat) The present situation is difficult. (Mevcut durum zor.)\n2. (İsim) I bought you a birthday present. (Sana bir doğum günü hediyesi aldım.)\n3. (Fiil) She will present her findings tomorrow. (Bulgularını yarın sunacak.)\n4. (Fiil) This problem presents a real challenge. (Bu problem gerçek bir meydan okuma sunuyor.)", "rank": 432}, {"word": "elect", "type": "Fiil", "meaning": "1. Seçmek (oyla).", "full_meaning": "1. Seçmek (oyla).\n2. Seçmek, karar vermek (yapmak için).", "guide": "Resmi bir oylama ile birine bir görev vermek. Bir şeyi yapmaya karar vermek.", "examples": "1. The president was elected last year. (Başkan geçen yıl seçildi.)\n2. He elected to take early retirement. (Erken emekliliği seçti.)", "rank": 433}, {"word": "treat", "type": "Fiil / İsim", "meaning": "Fiil: 1. Davranmak, muamele etmek.", "full_meaning": "Fiil: 1. Davranmak, muamele etmek.\n2. Tedavi etmek.\n3. İkram etmek, ödüllendirmek.\nİsim: 4. İkram, ödül, ziyafet.", "guide": "Birisine belirli bir şekilde davranmak veya hoş bir şey sunmak. İsim olarak, bu hoş şeyin kendisi.", "examples": "1. You should treat others with respect. (Başkalarına saygıyla davranmalısın.)\n2. The doctor will treat your injury. (Doktor yaralanmanızı tedavi edecek.)\n3. I'll treat you to lunch. (Sana öğle yemeği ısmarlayacağım.)", "rank": 434}, {"word": "discuss", "type": "Fiil", "meaning": "1. Tartışmak, görüşmek.", "full_meaning": "1. Tartışmak, görüşmek.\n2. Ele almak, üzerinde konuşmak.", "guide": "Bir konu hakkında fikir alışverişinde bulunmak, konuşarak incelemek.", "examples": "1. We need to discuss the details. (Ayrıntıları tartışmamız gerekiyor.)\n2. The book discusses various social issues. (Kitap çeşitli sosyal meseleleri ele alıyor.)", "rank": 435}, {"word": "north", "type": "İsim / Sıfat / Edat/Zarf", "meaning": "1. Kuzey (yön).", "full_meaning": "1. Kuzey (yön).\n2. Kuzey bölgesi.\n3. Kuzeye doğru.", "guide": "Dört ana yönden biri, pusulanın N (North) yönü.", "examples": "1. The wind is coming from the north. (Rüzgar kuzeyden geliyor.)\n2. She lives in the north of England. (İngiltere'nin kuzeyinde yaşıyor.)\n3. We drove north for two hours. (İki saat kuzeye doğru sürdük.)", "rank": 436}, {"word": "south", "type": "İsim / Sıfat / Zarf", "meaning": "1. (İ) Güney.", "full_meaning": "1. (İ) Güney.\n2. (S) Güneydeki.\n3. (Z) Güneye doğru.", "guide": "Dört ana yönden biri, kuzeyin karşısındaki yön.", "examples": "1. The sun rises in the east and sets in the west, but it's south that's warm. (Güneş doğudan doğar batıdan batar, ama ılık olan güneydir.)\n2. The south side of the building gets more sun. (Binanın güney tarafı daha fazla güneş alır.)\n3. We drove south for hours. (Saatlerce güneye doğru sürdük.)", "rank": 437}, {"word": "test", "type": "İsim / Fiil", "meaning": "İsim: 1. Test, sınav.", "full_meaning": "İsim: 1. Test, sınav.\n2. Deneme, kontrol.\nFiil: 3. Test etmek, denemek.\n4. Sınamak, zorlamak.", "guide": "Bilgiyi veya bir şeyin işleyişini kontrol etme eylemi veya bu işlemin kendisi.", "examples": "1. I have a math test tomorrow. (Yarın bir matematik sınavım var.)\n2. The car passed its safety test. (Araba güvenlik testini geçti.)\n3. The teacher tested us on vocabulary. (Öğretmen bizi kelime bilgisi konusunda test etti.)", "rank": 438}, {"word": "today", "type": "Zarf / İsim", "meaning": "Zarf: 1. Bugün.", "full_meaning": "Zarf: 1. Bugün.\n2. Günümüzde.\nİsim: 3. Bugün, günümüz.", "guide": "İçinde bulunulan gün veya çağ.", "examples": "1. What are you doing today? (Bugün ne yapıyorsun?)\n2. Today's weather is lovely. (Bugünün havası çok güzel.)\n3. Young people today have different challenges. (Günümüzdeki gençlerin farklı zorlukları var.)", "rank": 439}, {"word": "remember", "type": "Fiil", "meaning": "1. Hatırlamak, anımsamak.", "full_meaning": "1. Hatırlamak, anımsamak.\n2. Anmak, yad etmek.\n3. (Birine) Hediyede bulunmak.", "guide": "Hafızada saklanan bir bilgiyi zihinde canlandırmak.", "examples": "1. \"I can't remember her phone number.\" (Onun telefon numarasını hatırlayamıyorum.)\n2. \"We remember those who died in the war.\" (Savaşta ölenleri anıyoruz.)\n3. \"He remembered me in his will.\" (Vasiyetinde bana pay ayırdı.)", "rank": 440}, {"word": "explain", "type": "Fiil", "meaning": "1. Açıklamak, izah etmek.", "full_meaning": "1. Açıklamak, izah etmek.\n2. Nedenini açıklamak.\n3. (explain yourself) Kendini savunmak, açıklama yapmak.", "guide": "Bir şeyin nedenini, nasılını veya anlamını net ve anlaşılır hale getirmek.", "examples": "1. Can you explain how this machine works? (Bu makinenin nasıl çalıştığını açıklar mısınız?)\n2. He explained why he was late. (Neden geç kaldığını açıkladı.)\n3. You'd better explain yourself. (Kendini açıklasan iyi olur.)", "rank": 441}, {"word": "foot", "type": "İsim", "meaning": "1. Ayak.", "full_meaning": "1. Ayak.\n2. (Ölçü) Fit (30.48 cm).\n3. Alt, dip (tepenin).", "guide": "Bacağın bilekten aşağısı. Uzunluk ölçü birimi. Bir şeyin en alt kısmı.", "examples": "1. My foot hurts. (Ayağım ağrıyor.)\n2. He's six feet tall. (Boyu altı fit.)\n3. at the foot of the mountain (dağın eteğinde)", "rank": 442}, {"word": "past", "type": "İsim/Sıfat/Edat", "meaning": "1. (İsim) Geçmiş.", "full_meaning": "1. (İsim) Geçmiş.\n2. (Sıfat) Geçmişte olan, eski.\n3. (Edat) Geçe, ötesinde (zaman/mekan).", "guide": "Şu andan önceki zaman dilimi. Sıfat olarak geçmişe ait. Edat olarak bir noktayı geçmek anlamında.", "examples": "1. (İsim) I try not to dwell on the past. (Geçmişte takılıp kalmamaya çalışıyorum.)\n2. (Sıfat) In past years, this was a quiet village. (Geçmiş yıllarda burası sessiz bir köydü.)\n3. (Edat) It's half past two. (Saat iki buçuk.) He walked past the shop. (Dükkânın yanından geçip gitti.)", "rank": 443}, {"word": "decision", "type": "İsim", "meaning": "1. Karar.", "full_meaning": "1. Karar.\n2. Kararlılık, azim.\n3. Yargı, sonuç (spor/hukuk).", "guide": "Verilen kararın kendisi veya karar verme eylemi. Ayrıca birinin kararlı tavrını ifade eder.", "examples": "1. Making a decision was difficult. (Karar vermek zordu.)\n2. She acted with decision. (Kararlılıkla hareket etti.)\n3. The referee's decision is final. (Hakemin kararı nihaidir.)", "rank": 444}, {"word": "associate", "type": "Fiil/İsim/Sıfat", "meaning": "1. İlişkilendirmek, bağdaştırmak (fiil).", "full_meaning": "1. İlişkilendirmek, bağdaştırmak (fiil).\n2. Ortak, iş arkadaşı (isim).\n3. Yardımcı, alt (sıfat).", "guide": "Zihinsel veya sosyal olarak bağlantı kurmak. İsim olarak iş ortağı veya meslektaş.", "examples": "1. I associate the smell of rain with spring. (Yağmur kokusunu baharla ilişkilendiririm.)\n2. He is a business associate of mine. (O benim bir iş ortağım.)\n3. an associate professor (doçent)", "rank": 445}, {"word": "necessary", "type": "Sıfat / İsim", "meaning": "1. Gerekli, zorunlu, lüzumlu.", "full_meaning": "1. Gerekli, zorunlu, lüzumlu.\n2. Kaçınılmaz.\n3. (the necessary) gerekli olan şey(ler), para (argo).", "guide": "Yapılması şart olan, olmazsa olmaz.", "examples": "1. Is it necessary to book in advance? (Önceden rezervasyon yaptırmak gerekli mi?)\n2. They took the necessary steps. (Gerekli adımları attılar.)\n3. Have you got the necessary for the trip? (Yolculuk için gerekenler (para) sende var mı?)", "rank": 446}, {"word": "reduce", "type": "Fiil", "meaning": "1. Azaltmak, indirmek.", "full_meaning": "1. Azaltmak, indirmek.\n2. Küçültmek.\n3. (Yemek) Koyulaştırmak (sos).", "guide": "Bir şeyin miktarını, boyutunu, fiyatını veya şiddetini daha düşük bir seviyeye getirmek.", "examples": "1. \"We need to reduce our expenses.\" (Giderlerimizi azaltmamız gerekiyor.)\n2. \"The image was reduced to half its size.\" (Görsel boyutunun yarısına küçültüldü.)\n3. \"Reduce the sauce by simmering it.\" (Sosu kısık ateşte kaynatarak koyulaştırın.)", "rank": 447}, {"word": "else", "type": "Zarf", "meaning": "1. Başka, diğer.", "full_meaning": "1. Başka, diğer.\n2. Yoksa, aksi takdirde (or else).\n3. (somewhere/anyone else) Başka bir yerde/biri.", "guide": "Daha önce bahsedilmemiş veya bilinmeyen bir ek şeyi ifade eder. Genellikle \"-ever\" soru zamirleriyle veya \"something\", \"nothing\" gibi kelimelerle kullanılır.", "examples": "1. Would you like anything else? (Başka bir şey ister misiniz?)\n2. Hurry up, or else we'll be late. (Acele et, yoksa geç kalacağız.)\n3. Is anyone else coming? (Başka biri geliyor mu?)", "rank": 448}, {"word": "god", "type": "İsim (Özel isim olarak: God)", "meaning": "1. Tanrı, ilah.", "full_meaning": "1. Tanrı, ilah.\n2. (Ünlem) Aman Tanrım! (God!)\n3. Putperest tanrısı.", "guide": "Yüce varlık, yaratıcı. Hristiyanlık, Musevilik ve İslam'da tek tanrıyı (God) ifade eder. Çoğul hali (gods) farklı inanç sistemlerindeki tanrılar için kullanılır.", "examples": "1. They prayed to God for help. (Yardım için Tanrı'ya dua ettiler.)\n2. Oh my God! Look at that! (Aman Tanrım! Şuna bak!)\n3. Poseidon was the Greek god of the sea. (Poseidon, Yunan deniz tanrısıydı.)", "rank": 449}, {"word": "establish", "type": "Fiil", "meaning": "1. Kurmak, tesis etmek.", "full_meaning": "1. Kurmak, tesis etmek.\n2. Kanıtlamak, ispatlamak.\n3. Yerleştirmek, oturtmak (itibar).", "guide": "Yeni bir organizasyon, sistem veya durum yaratmak. Bir şeyin doğru veya var olduğunu göstermek.", "examples": "1. The company was established in 1995. (Şirket 1995'te kuruldu.)\n2. The police could not establish his whereabouts. (Polis onun yerini tespit edemedi.)\n3. She quickly established herself as a leader. (Kendini hızla bir lider olarak kabul ettirdi.)", "rank": 450}, {"word": "structure", "type": "İsim / Fiil", "meaning": "1. (İ) Yapı.", "full_meaning": "1. (İ) Yapı.\n2. (İ) Organizasyon, düzen.\n3. (F) Yapılandırmak, düzenlemek.", "guide": "Bir şeyin parçalarının bir araya gelme biçimi veya inşa edilmiş bina.", "examples": "1. The structure of the building is sound. (Binanın yapısı sağlam.)\n2. The company has a flat structure. (Şirketin düz bir organizasyon yapısı var.)\n3. You need to structure your essay better. (Makaleni daha iyi yapılandırmalısın.)", "rank": 451}, {"word": "pass", "type": "Fiil", "meaning": "1. Geçmek (yanından, içinden).", "full_meaning": "1. Geçmek (yanından, içinden).\n2. Geçmek (sınav, test).\n3. Uzatmak, vermek (eldeki şeyi).", "guide": "Bir şeyin ötesine gitme/hareket etme eylemi. Bir standardı aşmak (başarılı olmak) veya bir nesneyi birinden diğerine iletmek anlamında da yaygındır.", "examples": "1. You pas
