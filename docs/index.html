ounty of Devon (Devon ili)\n2. county council (il meclisi)", "rank": 858}, {"word": "advertise", "type": "Fiil", "meaning": "1. Reklamını yapmak, ilan etmek.", "full_meaning": "1. Reklamını yapmak, ilan etmek.\n2. Duyurmak.\n3. (For ile) ilanla aramak.", "guide": "Bir ürün veya hizmeti satmak veya bir etkinliği duyurmak için halka bildirmek.", "examples": "1. Companies spend millions to advertise their products. (Şirketler ürünlerini reklam etmek için milyonlar harcar.)\n2. The job was advertised in the local paper. (İş yerel gazetede ilan edildi.)\n3. We're advertising for a new secretary. (Yeni bir sekreter için ilan veriyoruz.)", "rank": 859}, {"word": "avoid", "type": "Fiil", "meaning": "1. Kaçınmak, sakınmak.", "full_meaning": "1. Kaçınmak, sakınmak.\n2. Önlemek, engellemek.\n3. (Cevap) vermekten kaçınmak.", "guide": "Kasıtlı olarak bir şeyden uzak durmak veya onun olmasını engellemek.", "examples": "1. Try to avoid fatty foods. (Yağlı yiyeceklerden kaçınmaya çalış.)\n2. He avoided eye contact. (Göz temasından kaçındı.)\n3. She avoided answering the question. (Soruyu cevaplamaktan kaçındı.)", "rank": 860}, {"word": "dog", "type": "İsim", "meaning": "1. Köpek, it.", "full_meaning": "1. Köpek, it.\n2. Erkek köpek.\n3. (Argo) Adam, herif (kaba).", "guide": "Evcil hayvan olarak bilinen dört ayaklı hayvan. Erkek köpek. Aşağılayıcı bir şekilde erkek için kullanılır.", "examples": "1. Their dog is very friendly. (Onların köpeği çok arkadaş canlısı.)\n2. Is your dog a male or female? (Köpeğin erkek mi dişi mi?)\n3. He's a lucky dog. (O şanslı bir herif.)", "rank": 861}, {"word": "fill", "type": "Fiil", "meaning": "1. Doldurmak.", "full_meaning": "1. Doldurmak.\n2. (Boşluğu) Doldurmak, kapamak.\n3. (İş) Üstlenmek, yerine getirmek.", "guide": "Bir kabın veya boşluğun içini tamamen veya kısmen bir şeyle kaplamak. Bir boşluğu veya eksikliği gidermek. Bir görevi yapmak.", "examples": "1. Fill the glass with water. (Bardak su ile doldurun.)\n2. He filled the hole with cement. (Delik çimento ile doldurdu.)\n3. She filled the position temporarily. (Pozisyonu geçici olarak doldurdu.)", "rank": 862}, {"word": "exercise", "type": "İsim/Fiil", "meaning": "1. Egzersiz, idman (isim).", "full_meaning": "1. Egzersiz, idman (isim).\n2. Alıştırma (isim).\n3. Yapmak, uygulamak (fiil).", "guide": "Fiziksel sağlığı geliştirmek için yapılan aktivite. Bir beceriyi geliştirmek için yapılan pratik. Bir hak, yetki veya seçeneği kullanmak.", "examples": "1. Regular exercise is important for health. (Düzenli egzersiz sağlık için önemlidir.)\n2. a vocabulary exercise (bir kelime alıştırması)\n3. You should exercise more caution. (Daha fazla dikkat göstermelisin.)", "rank": 863}, {"word": "concept", "type": "İsim", "meaning": "1. Kavram, fikir.", "full_meaning": "1. Kavram, fikir.\n2. Düşünce, anlayış.\n3. Tasarım, konsept.", "guide": "Zihinde oluşan genel ve soyut fikir.", "examples": "1. the concept of freedom (özgürlük kavramı)\n2. a new concept in car design (araba tasarımında yeni bir konsept)\n3. I understand the concept. (Kavramı anlıyorum.)", "rank": 864}, {"word": "campaign", "type": "İsim/Fiil", "meaning": "1. Seçim kampanyası (isim).", "full_meaning": "1. Seçim kampanyası (isim).\n2. Askeri harekât (isim).\n3. Kampanya yürütmek (fiil).", "guide": "Belirli bir amaca yönelik planlı faaliyetler dizisi (siyasi, askeri, reklam).", "examples": "1. He is running an election campaign. (Bir seçim kampanyası yürütüyor.)\n2. an advertising campaign (bir reklam kampanyası)\n3. They are campaigning for cleaner streets. (Daha temiz sokaklar için kampanya yürütüyorlar.)", "rank": 865}, {"word": "sleep", "type": "Fiil / İsim", "meaning": "1. (F) Uyumak.", "full_meaning": "1. (F) Uyumak.\n2. (İ) Uyku.\n3. (İ) Uyku süresi.", "guide": "Bilinç ve beden faaliyetlerinin dinlenme durumunda olduğu doğal süreç.", "examples": "1. I need to sleep. (Uyumam gerekiyor.)\n2. I didn't get much sleep last night. (Dün gece çok uyku uyuyamadım.)\n3. Have a good sleep! (İyi uykular!)", "rank": 866}, {"word": "task", "type": "İsim / Fiil", "meaning": "İsim: 1. Görev, iş.", "full_meaning": "İsim: 1. Görev, iş.\nFiil: 2. Görevlendirmek, bir iş yüklemek.", "guide": "Yapılması gereken, genellikle belirli ve tanımlanmış bir çalışma parçasıdır.", "examples": "1. My main task today is to write the report. (Bugünkü ana görevim raporu yazmak.)\n2. Completing the paperwork was a difficult task. (Evrak işlerini tamamlamak zor bir işti.)\n3. She was tasked with organizing the event. (Etkinliği organize etmekle görevlendirildi.)", "rank": 867}, {"word": "hall", "type": "İsim", "meaning": "1. Hol, koridor.", "full_meaning": "1. Hol, koridor.\n2. Salon, büyük oda (toplantı/konser).\n3. (Üniversite) Yurt binası.", "guide": "Bir binanın giriş alanı veya geçiş koridoru. Büyük etkinlikler için kullanılan geniş alan.", "examples": "1. Leave your coat in the hall. (Ceketini hole bırak.)\n2. The concert will be held in the town hall. (Konser belediye salonunda yapılacak.)\n3. She lives in a student hall of residence. (Bir öğrenci yurdunda kalıyor.)", "rank": 868}, {"word": "apparent", "type": "Sıfat", "meaning": "1. Görünür, belli, açık.", "full_meaning": "1. Görünür, belli, açık.\n2. Görünüşteki, zahiri.", "guide": "Hemen görülebilen veya anlaşılabilen; gerçek olup olmadığı kesin olmayan.", "examples": "1. For no apparent reason, he started laughing. (Hiçbir sebep yokken gülmeye başladı.)\n2. Her apparent confidence hid her nervousness. (Onun görünürdeki özgüveni, aslında gizlediği gerginliğiydi.)\n3. It soon became apparent that he was lying. (Onun yalan söylediği kısa sürede belli oldu.)", "rank": 869}, {"word": "prefer", "type": "Fiil", "meaning": "1. Tercih etmek, yeğlemek.", "full_meaning": "1. Tercih etmek, yeğlemek.\n2. Daha çok sevmek.", "guide": "İki veya daha fazla şey arasından birini diğerine göre daha fazla istemek.", "examples": "1. I prefer tea to coffee. (Kahveye kıyasla çayı tercih ederim.)\n2. Would you prefer to stay in tonight? (Bu gece evde kalmayı tercih eder misin?)", "rank": 870}, {"word": "progress", "type": "İsim/Fiil", "meaning": "1. (İsim) İlerleme, gelişme.", "full_meaning": "1. (İsim) İlerleme, gelişme.\n2. (İsim) Seyir, yol alma.\n3. (Fiil) İlerlemek, gelişmek.", "guide": "Zamanla daha iyiye veya hedefe doğru gitme durumu. Hareket halinde olma. Fiil olarak ilerlemek.", "examples": "1. We are making good progress on the project. (Projede iyi ilerleme kaydediyoruz.)\n2. The traffic slowed our progress. (Trafik ilerleyişimizi yavaşlattı.)\n3. His English is progressing rapidly. (İngilizcesi hızla ilerliyor.)", "rank": 871}, {"word": "closed", "type": "Sıfat", "meaning": "1. Kapalı.", "full_meaning": "1. Kapalı.\n2. Kapanmış, sona ermiş.\n3. Gizli, kapalı (toplantı).", "guide": "Açık olmayan, iş yapmayan veya erişilemeyen.", "examples": "1. The museum is closed on Mondays. (Müze Pazartesi günleri kapalıdır.)\n2. a closed door (kapalı bir kapı)\n3. a closed meeting (kapalı bir toplantı)", "rank": 872}, {"word": "blue", "type": "Sıfat/İsim", "meaning": "1. Mavi (sıfat/isim).", "full_meaning": "1. Mavi (sıfat/isim).\n2. Mutsuz, hüzünlü.\n3. Müstehcen, açık saçık.", "guide": "Gökyüzü ve denizin rengi. Duygu durumu olarak hüzünlü anlamına gelir.", "examples": "1. She has beautiful blue eyes. (Güzel mavi gözleri var.)\n2. I'm feeling a bit blue today. (Bugün biraz hüzünlü hissediyorum.)\n3. a blue joke (müstehcen bir şaka)", "rank": 873}, {"word": "college", "type": "İsim", "meaning": "1. Kolej, yüksekokul.", "full_meaning": "1. Kolej, yüksekokul.\n2. (Üniversite içinde) kolej.\n3. (US) üniversite.", "guide": "Özellikle mesleki eğitim veren yükseköğretim kurumu. ABD'de üniversite anlamına da gelir.", "examples": "1. She's studying at a secretarial college. (Bir sekreterlik okulunda okuyor.)\n2. a college of further education (bir yükseköğretim koleji)", "rank": 874}, {"word": "shape", "type": "İsim / Fiil", "meaning": "1. (İ) Şekil, biçim.", "full_meaning": "1. (İ) Şekil, biçim.\n2. (İ) Durum, form (fiziksel).\n3. (F) Şekil vermek, biçimlendirmek.", "guide": "Bir nesnenin dış çizgileri veya görünümü. Fiil olarak bir şeyi şekillendirmek veya etkilemek.", "examples": "1. What shape is it? (Ne şekli var?)\n2. I need to get in shape. (Forma girmem gerekiyor.)\n3. Childhood experiences shape our personality. (Çocukluk deneyimleri kişiliğimizi şekillendirir.)", "rank": 875}, {"word": "essential", "type": "Sıfat/İsim", "meaning": "1. Temel, esas, gerekli (sıfat).", "full_meaning": "1. Temel, esas, gerekli (sıfat).\n2. Zorunlu, şart (sıfat).\n3. Temel unsur, gereklilik (isim).", "guide": "Bir şey için kesinlikle gerekli olan, vazgeçilmez. Çok önemli.", "examples": "1. Food is essential for life. (Yiyecek yaşam için temeldir.)\n2. It is essential that you arrive on time. (Zamanında varmanız şarttır.)\n3. the essentials of English grammar (İngilizce dilbilgisinin temelleri)", "rank": 876}, {"word": "forget", "type": "Fiil", "meaning": "1. Unutmak.", "full_meaning": "1. Unutmak.\n2. (to do) Unutmak (yapmayı).\n3. (about) Aklından çıkarmak, boş vermek.", "guide": "Bilgiyi veya bir niyeti hatırlayamamak. Yapılması gereken bir şeyi yapmayı unutmak. Bir şeyi düşünmemeye çalışmak.", "examples": "1. I forget his name. (Onun adını unuttum.)\n2. Don't forget to lock the door. (Kapıyı kilitlemeyi unutma.)\n3. Let's forget about our differences. (Farklılıklarımızı unutalım.)", "rank": 877}, {"word": "print", "type": "Fiil/İsim", "meaning": "1. (Fiil) Basmak, yazdırmak.", "full_meaning": "1. (Fiil) Basmak, yazdırmak.\n2. (Fiil) Harfle yazmak (el yazısı değil).\n3. (İsim) Baskı, basılı şey.\n4. (İsim) Parmak/ayak izi.", "guide": "Matbaa makinesiyle çoğaltmak. Bilgisayardan kâğıda çıktı almak. Basılı materyal.", "examples": "1. They print newspapers overnight. (Gazeteleri gece boyunca basarlar.)\n2. Please print your name clearly. (Lütfen adınızı harflerle açıkça yazın.)\n3. I saw your article in print. (Yazınızı basılı halde gördüm.)\n4. The police found his prints at the scene. (Polis onun izlerini olay yerinde buldu.)", "rank": 878}, {"word": "lady", "type": "İsim", "meaning": "1. Hanımefendi, bayan.", "full_meaning": "1. Hanımefendi, bayan.\n2. (Saygı ifadesi) Kadın.\n3. (Soyluluk) Leydi.", "guide": "Kibar, nazik veya soylu bir kadın için kullanılan bir hitap şekli. Genel olarak yetişkin kadın.", "examples": "1. Good morning, ladies and gentlemen! (Günaydın, bayanlar ve baylar!)\n2. There's a lady here to see you. (Sizi görmek için burada bir hanımefendi var.)\n3. Lady Diana was beloved by many. (Leydi Diana birçok kişi tarafından seviliyordu.)", "rank": 879}, {"word": "worse", "type": "Sıfat, Zarf (karşılaştırma)", "meaning": "1. Daha kötü, daha fena (sıfat)", "full_meaning": "1. Daha kötü, daha fena (sıfat)\n2. Daha kötü bir şekilde (zarf)", "guide": "\"Bad\" ve \"ill\" sıfatlarının ve \"badly\" zarfının karşılaştırma derecesidir. \"Worst\" en üstün derecedir.", "examples": "1. The weather got worse in the afternoon. (Hava öğleden sonra daha kötüye gitti.)\n2. His cough is worse than mine. (Onun öksürüğü benimkinden daha kötü.)\n3. She performed worse in the second test. (İkinci testte daha kötü performans gösterdi.)", "rank": 880}, {"word": "independent", "type": "Sıfat", "meaning": "1. Bağımsız, özerk.", "full_meaning": "1. Bağımsız, özerk.\n2. Kendi kendine yeten, özgür.\n3. Tarafsız, yansız.", "guide": "Başka bir kişi veya şey tarafından kontrol edilmeyen veya onlara bağlı olmayan. Kendi ihtiyaçlarını karşılayabilen. Önyargısız.", "examples": "1. The country became independent in 1923. (Ülke 1923'te bağımsız oldu.)\n2. She is a very independent person. (Çok bağımsız/özgür bir kişidir.)\n3. We need an independent opinion. (Tarafsız bir görüşe ihtiyacımız var.)", "rank": 881}, {"word": "prevent", "type": "Fiil", "meaning": "1. Önlemek, engellemek.", "full_meaning": "1. Önlemek, engellemek.\n2. (Birini bir şeyden) alıkoymak.", "guide": "Bir şeyin olmasını durdurmak veya olmasına izin vermemek.", "examples": "1. Vaccines help prevent serious diseases. (Aşılar ciddi hastalıkları önlemeye yardımcı olur.)\n2. Nothing can prevent me from going. (Hiçbir şey beni gitmekten alıkoyamaz.)", "rank": 882}, {"word": "primary", "type": "Sıfat", "meaning": "1. Birincil, ana, temel.", "full_meaning": "1. Birincil, ana, temel.\n2. İlkokul (UK).\n3. İlk, en erken.", "guide": "En önemli veya temel olan. İngiltere'de ilköğretim.", "examples": "1. Our primary concern is safety. (Birincil kaygımız güvenliktir.)\n2. (UK) She teaches at a primary school. (Bir ilkokulda öğretmenlik yapıyor.)\n3. The primary cause of the accident was speed. (Kazanın birincil nedeni hızdı.)", "rank": 883}, {"word": "hit", "type": "Fiil, İsim", "meaning": "1. Vurmak, çarpmak.", "full_meaning": "1. Vurmak, çarpmak.\n2. (İsim) Vuruş, darbe.\n3. (İsim) Büyük başarı, hit.", "guide": "Fiziksel bir temasla vurmak. İsim olarak bu vuruş veya darbe. Çok popüler olan şarkı/film.", "examples": "1. The car hit a tree. (Araba bir ağaca çarptı.)\n2. He took a hit to the head. (Kafasına bir darbe aldı.)\n3. That song was a big hit. (O şarkı büyük bir hit oldu.)", "rank": 884}, {"word": "clean", "type": "Sıfat/Fiil", "meaning": "1. Temiz (sıfat).", "full_meaning": "1. Temiz (sıfat).\n2. Temizlemek (fiil).\n3. Adil, kuralsız olmayan (spor).", "guide": "Kirli veya lekesi olmayan. Fiil olarak temizlik yapmak.", "examples": "1. Keep your room clean. (Odanı temiz tut.)\n2. I need to clean the windows. (Pencereleri temizlemem gerekiyor.)\n3. a clean driving licence (cezası olmayan bir ehliyet)", "rank": 885}, {"word": "react", "type": "Fiil", "meaning": "1. Tepki vermek.", "full_meaning": "1. Tepki vermek.\n2. (Kimyasal) Tepkimeye girmek.", "guide": "Bir uyarana, olaya veya söze karşı davranışsal, duygusal veya fiziksel bir karşılık göstermek.", "examples": "1. \"How did he react to the news?\" (Habere nasıl tepki verdi?)\n2. \"Iron reacts with oxygen to form rust.\" (Demir, oksijenle tepkimeye girerek pas oluşturur.)", "rank": 886}, {"word": "exact", "type": "Sıfat/Fiil", "meaning": "1. Tam, kesin (sıfat).", "full_meaning": "1. Tam, kesin (sıfat).\n2. (exact a price) Almak, çıkarmak (fiil, zorla).\n3. (exact revenge) İntikam almak.", "guide": "En küçük ayrıntısına kadar doğru, hatasız. Bir şeyi (özellikle para veya intikam) güç kullanarak almak.", "examples": "1. What is the exact time? (Tam saat kaç?)\n2. The kidnappers exacted a huge ransom. (Fidyeciler büyük bir fidye aldı.)\n3. He swore to exact revenge. (İntikam alacağına yemin etti.)", "rank": 887}, {"word": "glass", "type": "İsim", "meaning": "1. Cam.", "full_meaning": "1. Cam.\n2. Bardak.\n3. Gözlük (çoğul: glasses).", "guide": "Şeffaf malzeme. İçecek konulan kap. Görme için kullanılan lens çifti (her zaman çoğul).", "examples": "1. The window is made of glass. (Pencere camdan yapılmış.)\n2. Can I have a glass of water? (Bir bardak su alabilir miyim?)\n3. I can't read without my glasses. (Gözlüğüm olmadan okuyamam.)", "rank": 888}, {"word": "prime", "type": "Sıfat/İsim", "meaning": "1. (Sıfat) En iyi, birinci kalite.", "full_meaning": "1. (Sıfat) En iyi, birinci kalite.\n2. (Sıfat) Başlıca, asıl.\n3. (İsim) Başbakan.\n4. (İsim) En güzel/verimli dönem.", "guide": "En yüksek kalite veya öneme sahip. Başbakan'ın kısaltması. Bir şeyin en iyi zamanı.", "examples": "1. This is a prime example of good design. (Bu, iyi tasarımın en iyi örneğidir.)\n2. He is the prime suspect in the case. (O, davadaki baş şüphelidir.)\n3. The prime minister will address the nation. (Başbakan ulusa hitap edecek.)\n4. He is in the prime of his life. (Hayatının en güzel döneminde.)", "rank": 889}, {"word": "photograph", "type": "İsim/Fiil", "meaning": "1. (İsim) Fotoğraf.", "full_meaning": "1. (İsim) Fotoğraf.\n2. (Fiil) Fotoğrafını çekmek.", "guide": "Fotoğraf. Fiil olarak fotoğraf çekme eylemi. \"Photo\"dan daha resmidir.", "examples": "1. This is a photograph of my grandparents. (Bu, büyükannemle büyükbabamın bir fotoğrafı.)\n2. He photographed wildlife in Africa. (Afrika'da yaban hayatını fotoğrafladı.)", "rank": 890}, {"word": "worry", "type": "Fiil, İsim", "meaning": "1. Endişelenmek (fiil)", "full_meaning": "1. Endişelenmek (fiil)\n2. Endişe, kaygı (isim)\n3. Üzmek, endişelendirmek (fiil)", "guide": "Bir şey hakkında sürekli düşünerek kaygı duymak veya böyle hissettirmek.", "examples": "1. Don't worry about the small stuff. (Küçük şeyler için endişelenme.)\n2. Money is a constant source of worry for them. (Para onlar için sürekli bir endişe kaynağı.)\n3. It worries me that he's always late. (Onun her zaman geç kalması beni endişelendiriyor.)", "rank": 891}, {"word": "title", "type": "İsim / Fiil", "meaning": "İsim: 1. Başlık, isim.", "full_meaning": "İsim: 1. Başlık, isim.\n2. Unvan.\n3. Şampiyonluk.\nFiil: 4. İsim vermek, başlıklandırmak.", "guide": "Bir kitabın, filmin vs. adı. Ayrıca bir kişinin statüsünü veya bir yarışmadaki birinciliği gösterir.", "examples": "1. What's the title of that book? (O kitabın adı ne?)\n2. Her official title is \"Director of Marketing\". (Resmi unvanı \"Pazarlama Direktörü\"dür.)\n3. They won the league title. (Lig şampiyonluğunu kazandılar.)", "rank": 892}, {"word": "survive", "type": "Fiil", "meaning": "1. Hayatta kalmak, sağ kalmak.", "full_meaning": "1. Hayatta kalmak, sağ kalmak.\n2. Atlatmak, dayanmak.\n3. (Ölenden) Daha uzun yaşamak.", "guide": "Zor veya tehlikeli bir durumdan canlı çıkmak veya bir şeyden sonra da var olmaya devam etmek.", "examples": "1. Only two people survived the crash. (Kazadan sadece iki kişi sağ kurtuldu.)\n2. Plants need water to survive. (Bitkilerin hayatta kalması için suya ihtiyacı vardır.)\n3. She survived her husband by ten years. (Kocasından on yıl daha uzun yaşadı.)", "rank": 893}, {"word": "mention", "type": "Fiil / İsim", "meaning": "1. Bahsetmek, söz etmek.", "full_meaning": "1. Bahsetmek, söz etmek.\n2. (Don't mention it) Bir şey değil, rica ederim.\n3. (Resmi) anma, belirtme.", "guide": "Kısaca veya resmi olarak bir konudan söz etmek.", "examples": "1. Did she mention my name? (Benim adımdan bahsetti mi?)\n2. \"Thank you!\" \"Don't mention it.\" (\"Teşekkür ederim!\" \"Bir şey değil.\")\n3. The report made no mention of the problem. (Raporda sorundan hiç bahsedilmedi.)", "rank": 894}, {"word": "transfer", "type": "Fiil / İsim", "meaning": "Fiil: 1. Aktarmak, nakletmek.", "full_meaning": "Fiil: 1. Aktarmak, nakletmek.\n2. Transfer olmak.\nİsim: 3. Transfer, aktarma.\n4. (Bono) Havale.", "guide": "Bir yerden başka bir yere taşımak veya hareket ettirmek.", "examples": "1. Please transfer the files to the new computer. (Lütfen dosyaları yeni bilgisayara aktarın.)\n2. He transferred to a different department. (Farklı bir departmana transfer oldu.)\n3. We have a bank transfer to make. (Yapacağımız bir banka havalesi var.)", "rank": 895}, {"word": "dress", "type": "Fiil/İsim", "meaning": "1. Giyinmek (fiil).", "full_meaning": "1. Giyinmek (fiil).\n2. Elbise (kadın) (isim).\n3. (Yara) Sarıp sarmalamak (fiil).", "guide": "Üzerine giysiler giymek. Bir kadının tek parça giysisi. Bir yarayı temizleyip bandajlamak.", "examples": "1. It only takes me five minutes to dress. (Giyinmem sadece beş dakikamı alır.)\n2. She wore a beautiful red dress. (Güzel bir kırmızı elbise giymişti.)\n3. The nurse dressed his wound. (Hemşire onun yarasını sardı.)", "rank": 896}, {"word": "store", "type": "İsim / Fiil", "meaning": "1. (İ) Mağaza, dükkan.", "full_meaning": "1. (İ) Mağaza, dükkan.\n2. (F) Depolamak, saklamak.\n3. (İ) Stok, rezerv.", "guide": "Malların satıldığı yer veya bir şeyi gelecekte kullanmak üzere saklama eylemi.", "examples": "1. I bought this at the grocery store. (Bunu marketten aldım.)\n2. We store data in the cloud. (Verileri bulutta depoluyoruz.)\n3. A store of firewood for winter. (Kış için bir stok odun.)", "rank": 897}, {"word": "gain", "type": "İsim, Fiil", "meaning": "1. (İsim) Kazanç, artış, fayda.", "full_meaning": "1. (İsim) Kazanç, artış, fayda.\n2. (Fiil) Kazanmak, elde etmek (çaba/plan sonucu).\n3. (Fiil) Artmak, çoğalmak (ağırlık, hız, değer olarak).", "guide": "Çoğunlukla olumlu bir çaba, büyüme veya artışı ifade eder. \"Get\"ten farkı, genellikle aktif bir çaba, emek veya zaman içeren bir edinme/artma sürecini vurgular.", "examples": "1. (İsim) The company reported significant gains in profit this quarter. (Şirket bu çeyrekte kârında önemli kazançlar bildirdi.)\n2. (Fiil) She gained valuable experience from that internship. (O stajdan değerli deneyim kazandı.)\n3. (Fiil) I've gained five kilos since the holidays. (Tatilden beri beş kilo aldım [arttırdım].)", "rank": 898}, {"word": "stone", "type": "İsim / Fiil", "meaning": "1. (İ) Taş.", "full_meaning": "1. (İ) Taş.\n2. (İ) Çekirdek (meyve).\n3. (F) Taşlamak.", "guide": "Doğal olarak oluşan sert, mineral madde. Meyvenin ortasındaki sert çekirdek.", "examples": "1. The house is made of stone. (Ev taştan yapılmıştır.)\n2. Remove the stones from the cherries. (Kirazların çekirdeklerini çıkar.)\n3. In the past, people were stoned as punishment. (Eskiden insanlar ceza olarak taşlanırdı.)", "rank": 899}, {"word": "image", "type": "İsim", "meaning": "1. Görüntü, resim, imge.", "full_meaning": "1. Görüntü, resim, imge.\n2. İzlenim, imaj.\n3. Benzerlik, suret.", "guide": "Bir şeyin görsel temsili (fotoğraf, çizim, yansıma). Kamuoyundaki algı veya itibar. Bir şeyin kopyası veya benzeri.", "examples": "1. He captured a stunning image of the mountains. (Dağların muhteşem bir görüntüsünü yakaladı.)\n2. The company is trying to improve its image. (Şirket imajını iyileştirmeye çalışıyor.)\n3. She is the image of her mother. (Annesinin aynısı/tıpkısı.)", "rank": 900}, {"word": "advance", "type": "İsim/Fiil/Sıfat", "meaning": "1. İlerleme, gelişme (isim).", "full_meaning": "1. İlerleme, gelişme (isim).\n2. Avans, peşin ödeme (isim).\n3. İlerlemek, gelişmek (fiil).", "guide": "İleri doğru hareket veya bir alandaki gelişme. Ayrıca önceden yapılan bir ödeme.", "examples": "1. Medical advances have saved many lives. (Tıbbi ilerlemeler birçok hayat kurtardı.)\n2. I need an advance on my salary. (Maaşımdan avans almam gerekiyor.)\n3. The troops advanced towards the city. (Birlikler şehre doğru ilerledi.)", "rank": 901}, {"word": "thirty", "type": "Sayı / İsim", "meaning": "1. Otuz (30).", "full_meaning": "1. Otuz (30).", "guide": "29'dan sonra ve 31'den önce gelen sayı.", "examples": "1. The journey takes thirty minutes. (Yolculuk otuz dakika sürüyor.)\n2. He is in his thirties. (O, otuzlu yaşlarında.)\n3. I paid thirty euros for it. (Onun için otuz euro ödedim.)", "rank": 902}, {"word": "proper", "type": "Sıfat", "meaning": "1. Uygun, doğru.", "full_meaning": "1. Uygun, doğru.\n2. Gerçek, tam anlamıyla.\n3. (UK, argo) Tam, müthiş.", "guide": "Bir durum veya standart için doğru ve uygun olan. Tam ve eksiksiz. UK'de \"gerçekten büyük\" anlamında argo.", "examples": "1. Is this the proper way to do it? (Bunu yapmanın doğru yolu bu mu?)\n2. We didn't have a proper meal all day. (Bütün gün doğru düzgün bir yemek yemedik.)\n3. (UK) That was a proper mess! (O tam bir karmaşaydı!)", "rank": 903}, {"word": "slight", "type": "Sıfat / Fiil", "meaning": "1. (S) Hafif, küçük.", "full_meaning": "1. (S) Hafif, küçük.\n2. (S) Zayıf, ince.\n3. (F) Hafife almak, saygısızlık etmek.", "guide": "Çok büyük veya önemli olmayan. Fiil olarak (eskimiş) birine hakaret etmek.", "examples": "1. There's a slight problem. (Küçük/Hafif bir sorun var.)\n2. He is of slight build. (İnce/Zayıf bir yapıya sahiptir.)\n3. He felt slighted by their comments. (Yorumlarından dolayı hafife alınmış hissetti.)", "rank": 904}, {"word": "survey", "type": "İsim / Fiil", "meaning": "1. (İ) Anket, araştırma.", "full_meaning": "1. (İ) Anket, araştırma.\n2. (İ) İnceleme, gözden geçirme.\n3. (F) Anket yapmak, incelemek.", "guide": "Bir konu hakkında bilgi toplamak için yapılan soruşturma veya bir alanı geniş bir açıdan inceleme.", "examples": "1. We conducted a survey about customer habits. (Müşteri alışkanlıkları hakkında bir anket yaptık.)\n2. A geological survey. (Jeolojik bir inceleme.)\n3. Survey the damage after the storm. (Fırtınadan sonra hasarı gözden geçirin.)", "rank": 905}, {"word": "strategy", "type": "İsim", "meaning": "1. Strateji.", "full_meaning": "1. Strateji.\n2. Plan, yöntem.\n3. Askeri plan.", "guide": "Uzun vadeli bir amaca ulaşmak için tasarlanmış ayrıntılı plan veya yöntem.", "examples": "1. We need a new marketing strategy. (Yeni bir pazarlama stratejisine ihtiyacımız var.)\n2. What's your strategy for passing the exam? (Sınavı geçmek için planın nedir?)\n3. Military strategy. (Askeri strateji.)", "rank": 906}, {"word": "distribute", "type": "Fiil", "meaning": "1. Dağıtmak, paylaştırmak.", "full_meaning": "1. Dağıtmak, paylaştırmak.\n2. Yaymak, dağılımını sağlamak.\n3. (Matematik) Dağıtmak, açmak.", "guide": "Bir şeyi bir grup insan, yer veya şey arasında paylaştırmak veya ulaştırmak.", "examples": "1. Volunteers distributed food to the homeless. (Gönüllüler evsizlere yiyecek dağıttı.)\n2. The company distributes its products worldwide. (Şirket ürünlerini dünya çapında dağıtır.)\n3. Remember to distribute the negative sign. (Eksi işaretini dağıtmayı unutma.)", "rank": 907}, {"word": "leg", "type": "İsim", "meaning": "1. Bacak.", "full_meaning": "1. Bacak.\n2. (Mobilya) Ayak.\n3. (Yarış/Yol) Etap, kısım.", "guide": "İnsan veya hayvan vücudunda yürümeye yarayan uzuv. Bir yolculuğun veya yarışın bir bölümü.", "examples": "1. She broke her leg in a skiing accident. (Kayak kazasında bacağını kırdı.)\n2. One of the table legs is wobbly. (Masanın ayaklarından biri sallanıyor.)\n3. The final leg of the journey was the most tiring. (Yolculuğun son etabı en yorucuydu.)", "rank": 908}, {"word": "duty", "type": "İsim", "meaning": "1. Görev, vazife.", "full_meaning": "1. Görev, vazife.\n2. (Vergi) Gümrük vergisi.\n3. (on/off duty) Nöbette/nöbet dışı.", "guide": "Yapılması gerekli olan, ahlaki veya yasal sorumluluk. İthal edilen mallardan alınan vergi.", "examples": "1. It is my duty to inform you. (Sizi bilgilendirmek benim görevimdir.)\n2. You have to pay duty on alcohol. (Alkol üzerine gümrük vergisi ödemek zorundasınız.)\n3. The doctor is on duty tonight. (Doktor bu gece nöbette.)", "rank": 909}, {"word": "star", "type": "İsim / Fiil", "meaning": "1. (İ) Yıldız.", "full_meaning": "1. (İ) Yıldız.\n2. (İ) Yıldız (ünlü).\n3. (F) Başrolde oynamak.", "guide": "Gece gökyüzünde görünen parlak gök cismi veya çok ünlü kişi.", "examples": "1. Look at the stars. (Yıldızlara bak.)\n2. She is a movie star. (O bir sinema yıldızıdır.)\n3. He starred in the new film. (Yeni filmde başrolde oynadı.)", "rank": 910}, {"word": "address", "type": "İsim/Fiil", "meaning": "1. Adres (isim).", "full_meaning": "1. Adres (isim).\n2. Hitap etmek, seslenmek (fiil).\n3. (Sorunu) ele almak, çözmeye çalışmak (fiil).", "guide": "Konuşma dilinde genellikle fiziksel veya e-posta adresi anlamında isim olarak kullanılır. Fiil olarak birine söz söylemek veya bir sorunla ilgilenmek anlamına gelir.", "examples": "1. What's your home address? (Ev adresin nedir?)\n2. He addressed the crowd calmly. (Kalabalığa sakin bir şekilde hitap etti.)\n3. We need to address this issue immediately. (Bu sorunu derhal ele almamız gerekiyor.)", "rank": 911}, {"word": "promote", "type": "Fiil", "meaning": "1. Terfi ettirmek.", "full_meaning": "1. Terfi ettirmek.\n2. Tanıtmak, reklamını yapmak.\n3. Teşvik etmek, desteklemek.", "guide": "Birini daha yüksek bir pozisyona getirmek. Bir ürünü veya fikri yaygınlaştırmak.", "examples": "1. She was promoted to manager. (Müdür olarak terfi ettirildi.)\n2. They are promoting their new product on TV. (Yeni ürünlerini TV'de tanıtıyorlar.)\n3. The campaign promotes healthy eating. (Kampanya sağlıklı beslenmeyi teşvik ediyor.)", "rank": 912}, {"word": "army", "type": "İsim", "meaning": "1. Ordu.", "full_meaning": "1. Ordu.\n2. Kalabalık, büyük grup.", "guide": "Bir ülkenin kara kuvvetleri. Mecazi olarak çok büyük bir grup.", "examples": "1. He joined the army when he was eighteen. (On sekiz yaşındayken orduya katıldı.)\n2. An army of volunteers helped clean up the park. (Bir ordu gönüllü parkı temizlemeye yardım etti.)", "rank": 913}, {"word": "complex", "type": "Sıfat/İsim", "meaning": "1. Karmaşık, kompleks (sıfat).", "full_meaning": "1. Karmaşık, kompleks (sıfat).\n2. Site, kompleks (binalar) (isim).\n3. (Psikoloji) kompleks.", "guide": "Birçok bağlantılı parçası olan ve anlaşılması zor olan.", "examples": "1. a complex problem (karmaşık bir sorun)\n2. a sports complex (bir spor kompleksi)\n3. an inferiority complex (bir aşağılık kompleksi)", "rank": 914}, {"word": "july", "type": "İsim", "meaning": "Temmuz ayı.", "full_meaning": "Temmuz ayı.", "guide": "Miladi takvime göre yılın 7. ayıdır.", "examples": "1. We're going on holiday in July. (Temmuz ayında tatile gidiyoruz.)\n2. July is usually the hottest month here. (Temmuz genelde buradaki en sıcak aydır.)\n3. The festival takes place on the 4th of July. (Festival 4 Temmuz'da yapılır.)", "rank": 915}, {"word": "attend", "type": "Fiil", "meaning": "1. Katılmak, iştirak etmek.", "full_meaning": "1. Katılmak, iştirak etmek.\n2. Devam etmek (okula).\n3. (Hasta) bakmak, ilgilenmek.", "guide": "Bir etkinlikte bulunmak veya birine/ihtiyaca bakmak.", "examples": "1. Over 100 people attended the wedding. (100'den fazla kişi düğüne katıldı.)\n2. Which school did you attend? (Hangi okula devam ettin?)\n3. The nurse attended to the wounded. (Hemşire yaralılarla ilgilendi.)", "rank": 916}, {"word": "guide", "type": "Fiil, İsim", "meaning": "1. (Fiil) Rehberlik etmek, yol göstermek.", "full_meaning": "1. (Fiil) Rehberlik etmek, yol göstermek.\n2. (İsim) Rehber (kitap/kişi).\n3. Kılavuz, yol gösterici ilke.", "guide": "Birine yol göstermek veya öğretmek. Bilgi veren kitap veya kişi. Davranışları yönlendiren şey.", "examples": "1. She guided us through the old city. (Bize eski şehri gezdirdi/rehberlik etti.)\n2. I bought a travel guide for Istanbul. (İstanbul için bir gezi rehberi aldım.)\n3. Let your conscience be your guide. (Vicdanını kılavuzun olsun.)", "rank": 917}, {"word": "warm", "type": "Sıfat, Fiil", "meaning": "1. Ilık, sıcak (sıfat)", "full_meaning": "1. Ilık, sıcak (sıfat)\n2. Sıcakkanlı, samimi (sıfat)\n3. Isınmak, ısıtmak (fiil)", "guide": "Sıcaklığı hoş, aşırı sıcak (hot) olmayan. İnsanlar için dostça ve samimi anlamında kullanılır. Fiil olarak, sıcaklığını artırmak demektir.", "examples": "1. The weather is warm and sunny today. (Hava bugün ılık ve güneşli.)\n2. She gave us a warm welcome. (Bize sıcak bir karşılama yaptı.)\n3. Warm up the soup before serving. (Servis etmeden önce çorbayı ısıtın.)", "rank": 918}, {"word": "box", "type": "İsim/Fiil", "meaning": "1. Kutu (isim).", "full_meaning": "1. Kutu (isim).\n2. Boks yapmak (fiil).\n3. (TV) televizyon.", "guide": "Genellikle dikdörtgen şeklinde, saklama kabı. Spor olarak yumruk dövüşü.", "examples": "1. a cardboard box (bir karton kutu)\n2. He boxes as a hobby. (Hobi olarak boks yapar.)\n3. What's on the box tonight? (Bu gece televizyonda ne var?)", "rank": 919}, {"word": "division", "type": "İsim", "meaning": "1. Bölme, bölünme.", "full_meaning": "1. Bölme, bölünme.\n2. Bölüm, kısım (şirket/spor).\n3. Anlaşmazlık, ayrılık.", "guide": "Bölme eylemi veya sonucu. Büyük bir organizasyonun alt birimi. Fikir ayrılığı.", "examples": "1. cell division (hücre bölünmesi)\n2. He works in the sales division. (Satış bölümünde çalışıyor.)\n3. The issue caused division within the family. (Konu aile içinde anlaşmazlığa neden oldu.)", "rank": 920}, {"word": "video", "type": "İsim, Fiil, Sıfat", "meaning": "1. Video (görüntü kaydı) (isim)", "full_meaning": "1. Video (görüntü kaydı) (isim)\n2. Video çekmek (fiil)\n3. Video ile ilgili (sıfat)", "guide": "Hareketli görüntülerin kaydedildiği ve oynatıldığı teknoloji ve içeriğin genel adı. Fiil olarak, video kaydı yapmak anlamına gelir.", "examples": "1. I watched a funny video online. (İnternette komik bir video izledim.)\n2. She videotaped the entire concert. (Tüm konseri videoya kaydetti.)\n3. We had a video call with our grandparents. (Büyükannelerimiz ve büyükbabalarımızla bir video görüşmesi yaptık.)", "rank": 921}, {"word": "oil", "type": "İsim / Fiil", "meaning": "1. Yağ (yemek, motor).", "full_meaning": "1. Yağ (yemek, motor).\n2. Petrol.\n3. Yağlamak, yağ sürmek.", "guide": "Yemek pişirmede, makine çalıştırmada veya yakıt olarak kullanılan sıvı. Fiil olarak yağlamak.", "examples": "1. Add a tablespoon of olive oil. (Bir yemek kaşığı zeytinyağı ekleyin.)\n2. The country is rich in oil. (Ülke petrol açısından zengindir.)\n3. You should oil that squeaky door. (O gıcırdayan kapıyı yağlamalısın.)", "rank": 922}, {"word": "reveal", "type": "Fiil", "meaning": "1. Ortaya çıkarmak, göstermek.", "full_meaning": "1. Ortaya çıkarmak, göstermek.\n2. Açıklamak, ifşa etmek.\n3. (Gizli şeyi) Göstermek.", "guide": "Gizli, örtülü veya bilinmeyen bir şeyi görünür veya bilinir kılmak.", "examples": "1. \"The investigation revealed new evidence.\" (Soruşturma yeni kanıtlar ortaya çıkardı.)\n2. \"He revealed his true intentions.\" (Gerçek niyetlerini açıkladı.)\n3. \"The curtain rose to reveal the stage.\" (Perde kalktı ve sahneyi gösterdi.)", "rank": 923}, {"word": "estimate", "type": "Fiil/İsim", "meaning": "1. Tahmin etmek (fiil).", "full_meaning": "1. Tahmin etmek (fiil).\n2. Tahmin, keşif (isim).\n3. (inşaat) Keşif, fiyat teklifi.", "guide": "Tam olarak bilinmeyen bir miktar veya değer hakkında kabaca hesaplama yapmak. Yapılan tahmin veya bir işin maliyet tahmini.", "examples": "1. I estimate the cost to be around $100. (Maliyeti yaklaşık 100 dolar olarak tahmin ediyorum.)\n2. According to official estimates, the population is 5 million. (Resmi tahminlere göre nüfus 5 milyondur.)\n3. We need to get an estimate for the repairs. (Tamirat için bir keşif almamız gerekiyor.)", "rank": 924}, {"word": "trouble", "type": "İsim / Fiil", "meaning": "İsim: 1. Sorun, bela.", "full_meaning": "İsim: 1. Sorun, bela.\n2. Zahmet, uğraş.\n3. Rahatsızlık, arıza.\nFiil: 4. Endişelendirmek, rahatsız etmek.\n5. Zahmet vermek.", "guide": "Zorluk, sıkıntı veya rahatsızlık veren durum.", "examples": "1. I'm having trouble with my computer. (Bilgisayarımla sorun yaşıyorum.)\n2. Sorry to trouble you, but can I ask a question? (Sizi rahatsız ettiğim için özür dilerim, ama bir soru sorabilir miyim?)\n3. He's always getting into trouble. (O her zaman başı belaya giriyor.)", "rank": 925}, {"word": "double", "type": "Sıfat/İsim/Fiil", "meaning": "1. İki kat, çift (sıfat).", "full_meaning": "1. İki kat, çift (sıfat).\n2. İkili, çift (isim).\n3. İkiye katlamak (fiil).", "guide": "İki tane olan veya iki katı kadar olan. Teniste bir çift oyuncu. Miktarı iki ile çarpmak.", "examples": "1. We need a double room. (Çift kişilik bir odaya ihtiyacımız var.)\n2. They won the women's doubles. (Kadınlar çiftlerde kazandılar.)\n3. The company doubled its profits. (Şirket kârını ikiye katladı.)", "rank": 926}, {"word": "nor", "type": "Bağlaç", "meaning": "1. Ne de (olumsuz cümlelerde).", "full_meaning": "1. Ne de (olumsuz cümlelerde).\n2. ... de yok (cümle başında devrik yapı).", "guide": "\"Neither\" ile birlikte veya olumsuz bir cümleden sonra ikinci bir olumsuz öğeyi bağlamak için kullanılır.", "examples": "1. He neither called nor wrote. (Ne aradı ne de yazdı.)\n2. I don't want to go, nor does she. (Ben gitmek istemiyorum, o da istemiyor.)", "rank": 927}, {"word": "alternative", "type": "İsim/Sıfat", "meaning": "1. Alternatif, seçenek (isim).", "full_meaning": "1. Alternatif, seçenek (isim).\n2. Alternatif, başka (sıfat).\n3. Geleneksel olmayan, farklı (sıfat).", "guide": "Mevcut olan veya geleneksel olandan farklı bir seçim veya olasılık.", "examples": "1. Do you have any alternatives? (Başka seçeneklerin var mı?)\n2. We need to find an alternative solution. (Alternatif bir çözüm bulmamız gerekiyor.)\n3. alternative medicine (alternatif tıp)", "rank": 928}, {"word": "miss", "type": "Fiil / İsim", "meaning": "1. Özlemek, hasretini çekmek.", "full_meaning": "1. Özlemek, hasretini çekmek.\n2. Kaçırmak (otobüs, fırsat).\n3. Iskalemek, vuramamak.\n4. Bayan (hitap).", "guide": "Bir kişi veya şeyin yokluğunda üzüntü duymak. Ayrıca bir hedefe ulaşamamak veya bir fırsatı yakalayamamak.", "examples": "1. I miss you so much. (Seni çok özledim.)\n2. Hurry, or we'll miss the train! (Acele et, yoksa treni kaçıracağız!)\n3. He missed the target completely. (Hedefi tamamen ıskaladı.)\n4. Good morning, Miss Jones. (Günaydın, Bayan Jones.)", "rank": 929}, {"word": "scale", "type": "İsim / Fiil", "meaning": "1. (İ) Ölçek.", "full_meaning": "1. (İ) Ölçek.\n2. (İ) Terazi.\n3. (F) Tırmanmak.", "guide": "Bir şeyin boyutunu gösteren oran (ölçek) veya tartma aleti (terazi). Fiil olarak dik bir yüzeye tırmanmak anlamına gelir.", "examples": "1. The map is drawn to scale. (Harita ölçekli çizilmiştir.)\n2. I weighed myself on the scale. (Kendimi terazide tarttım.)\n3. They scaled the mountain. (Dağa tırmandılar.)", "rank": 930}, {"word": "gold", "type": "İsim, Sıfat", "meaning": "1. Altın (metal).", "full_meaning": "1. Altın (metal).\n2. (Sıfat) Altından yapılmış.\n3. (Sıfat) Altın rengi.", "guide": "Değerli sarı metal. Sıfat olarak bu metalden yapılmış veya rengi olan şeyleri tanımlar.", "examples": "1. The ring is made of gold. (Yüzük altından yapılmış.)\n2. She wore gold earrings. (Altın küpeler taktı.)\n3. Her hair was a beautiful gold color. (Saçları güzel bir altın rengiydi.)", "rank": 931}, {"word": "military", "type": "Sıfat / İsim", "meaning": "1. Askeri, orduya ait.", "full_meaning": "1. Askeri, orduya ait.\n2. Ordu, silahlı kuvvetler.\n3. Askeri disiplinli, sert.", "guide": "Ordu, savaş veya askerlerle ilgili olan. İsim olarak \"ordu\" anlamında toplu şekilde kullanılır.", "examples": "1. He comes from a military family. (Askeri bir aileden geliyor.)\n2. The military was called in to help. (Yardım için ordu çağrıldı.)\n3. He has a military bearing. (Askeri bir duruşu var.)", "rank": 932}, {"word": "memory", "type": "İsim", "meaning": "1. Hafıza, bellek.", "full_meaning": "1. Hafıza, bellek.\n2. Anı, hatıra.\n3. (Bilgisayar) bellek, depolama alanı.", "guide": "Hatırlama yetisi veya hatırlanan şey. Teknolojide veri depolama birimi.", "examples": "1. She has a good memory for names. (İsimleri hatırlama konusunda iyi bir hafızası var.)\n2. I have fond memories of my childhood. (Çocukluğuma dair güzel anılarım var.)\n3. My phone is running out of memory. (Telefonumun belleği doluyor.)", "rank": 933}, {"word": "document", "type": "İsim/Fiil", "meaning": "1. Belge, doküman (isim).", "full_meaning": "1. Belge, doküman (isim).\n2. Belgelerle kanıtlamak (fiil).\n3. (Film) Belgesel çekmek.", "guide": "Resmi veya yazılı bilgi, ispat içeren kağıt veya dosya. Bir şeyi ayrıntılı olarak kayıt altına almak.", "examples": "1. Please bring all necessary documents. (Lütfen tüm gerekli belgeleri getirin.)\n2. The report documents the effects of climate change. (Rapor, iklim değişikliğinin etkilerini belgeliyor.)", "rank": 934}, {"word": "correct", "type": "Sıfat/Fiil", "meaning": "1. Doğru, yanlışsız (sıfat).", "full_meaning": "1. Doğru, yanlışsız (sıfat).\n2. Düzeltmek (fiil).\n3. Uygun, yerinde (sıfat).", "guide": "Gerçeğe veya kurallara uygun olan. Fiil olarak hataları gidermek.", "examples": "1. Is this the correct answer? (Bu doğru cevap mı?)\n2. Please correct any mistakes. (Lütfen hataları düzeltin.)\n3. correct behaviour (uygun davranış)", "rank": 935}, {"word": "element", "type": "İsim", "meaning": "1. Element, öğe.", "full_meaning": "1. Element, öğe.\n2. Bileşen, unsur.\n3. (the elements) Doğa koşulları (hava).", "guide": "Periyodik tablodaki saf kimyasal madde. Bir bütünün parçası. Kötü hava şartları.", "examples": "1. Oxygen is a chemical element. (Oksijen bir kimyasal elementtir.)\n2. Trust is a key element in a relationship. (Güven bir ilişkide kilit unsurdur.)\n3. They battled against the elements. (Hava koşullarına karşı mücadele ettiler.)", "rank": 936}, {"word": "admit", "type": "Fiil", "meaning": "1. Kabul etmek, itiraf etmek.", "full_meaning": "1. Kabul etmek, itiraf etmek.\n2. (İçeri) almak, girişine izin vermek.\n3. (Hastane) yatırmak.", "guide": "Bir gerçeği, genellikle hoş olmayan bir gerçeği söylemek veya birinin bir yere girmesine izin vermek.", "examples": "1. I must admit I was wrong. (Yanıldığımı itiraf etmeliyim.)\n2. This ticket admits two people. (Bu bilet iki kişiyi içeri alır.)\n3. He was admitted to the hospital with chest pains. (Göğüs ağrılarıyla hastaneye yatırıldı.)", "rank": 937}, {"word": "summer", "type": "İsim", "meaning": "1. Yaz.", "full_meaning": "1. Yaz.\n2. Yaz mevsimi.\n3. En parlak/güçlü dönem.", "guide": "İlkbahardan sonra ve sonbahardan önce gelen, genellikle en sıcak mevsim.", "examples": "1. I love the summer. (Yazı severim.)\n2. We go to the beach every summer. (Her yaz sahile gideriz.)\n3. The summer of her life. (Hayatının en güzel/yaz dönemi.)", "rank": 938}, {"word": "husband", "type": "İsim", "meaning": "1. Koca, eş (erkek).", "full_meaning": "1. Koca, eş (erkek).", "guide": "Evli bir kadının erkek eşi.", "examples": "1. Her husband is a doctor. (Onun kocası bir doktor.)", "rank": 939}, {"word": "fast", "type": "Sıfat/Zarf", "meaning": "1. Hızlı, çabuk (sıfat/zarf).", "full_meaning": "1. Hızlı, çabuk (sıfat/zarf).\n2. Sıkı, sıkıca (sıfat).\n3. Oruç tutmak (fiil).", "guide": "Hareketin veya işlemin hızı yüksek olan. Güçlü bir şekilde bağlı veya sabit. Bir süre yemek yememek.", "examples": "1. a fast car (hızlı bir araba) / Don't drive so fast! (Bu kadar hızlı sürme!)\n2. Hold fast to the rope. (İpe sıkıca tutun.)\n3. Muslims fast during Ramadan. (Müslümanlar Ramazan'da oruç tutar.)", "rank": 940}, {"word": "perfect", "type": "Sıfat", "meaning": "1. Mükemmel, kusursuz.", "full_meaning": "1. Mükemmel, kusursuz.\n2. İdeal, tam istenilen gibi.\n3. (Dilbilgisi) -miş'li geçmiş zaman.", "guide": "Bir şeyin hiçbir eksiği veya hatası olmadığını, en iyi halde olduğunu ifade eder. Dilbilgisinde bir zaman kipi.", "examples": "1. The weather was perfect for a picnic. (Piknik için hava mükemmeldi.)\n2. He's the perfect candidate for the job. (O, iş için ideal aday.)\n3. 'Have eaten' is an example of the present perfect tense. ('Have eaten' şimdiki öğrenilen geçmiş zaman kipine bir örnektir.)", "rank": 941}, {"word": "library", "type": "İsim", "meaning": "1. Kütüphane.", "full_meaning": "1. Kütüphane.\n2. (Bilgisayar) Yazılım kütüphanesi, kitaplık.\n3. Koleksiyon.", "guide": "Kitapların, dergilerin ve bazen müzik, film gibi materyallerin saklandığı, ödünç alınabildiği yer. Bilgisayarda program parçacıkları koleksiyonu.", "examples": "1. I borrowed this book from the public library. (Bu kitabı halk kütüphanesinden ödünç aldım.)\n2. This software uses a graphics library. (Bu yazılım bir grafik kütüphanesi kullanıyor.)\n3. He has a vast library of jazz records. (Geniş bir caz plak koleksiyonu var.)", "rank": 942}, {"word": "procedure", "type": "İsim", "meaning": "1. Prosedür, işlem, yöntem.", "full_meaning": "1. Prosedür, işlem, yöntem.\n2. (Tıbbi) ameliyat, girişim.", "guide": "Resmi veya standart bir şekilde yapılması gereken işlemler dizisi.", "examples": "1. What's the procedure for applying for a visa? (Vize başvurusu prosedürü nedir?)\n2. He underwent a minor surgical procedure. (Küçük bir cerrahi işlem geçirdi.)", "rank": 943}, {"word": "mum", "type": "İsim (İngiliz İngilizcesi)", "meaning": "1. Anne, anneciğim.", "full_meaning": "1. Anne, anneciğim.", "guide": "\"Mother\" kelimesinin gayriresmi, samimi hali. Amerikan İngilizcesinde genellikle \"mom\" kullanılır.", "examples": "1. I'll ask my mum. (Anneme soracağım.)\n2. Hi, Mum! (Merhaba, Anne!)", "rank": 944}, {"word": "throw", "type": "Fiil / İsim", "meaning": "Fiil: 1. Fırlatmak, atmak.", "full_meaning": "Fiil: 1. Fırlatmak, atmak.\n2. (Hızlıca) giymek, örtmek (throw on).\n3. Düzenlemek (parti).\nİsim: 4. Atış.", "guide": "Elindeki bir şeyi güçle ileriye doğru hareket ettirmek. Birçok deyimsel kullanımı vardır.", "examples": "1. Throw me the ball! (Bana topu at!)\n2. She threw a coat on and ran out. (Üzerine bir ceket attı/geçirdi ve dışarı fırladı.)\n3. They are throwing a party next week. (Gelecek hafta bir parti veriyorlar/düzenliyorlar.)", "rank": 945}, {"word": "extreme", "type": "Sıfat/İsim", "meaning": "1. Aşırı, uç (sıfat).", "full_meaning": "1. Aşırı, uç (sıfat).\n2. Uç nokta, aşırılık (isim).\n3. (çoğul) Aşırılıklar.", "guide": "Olağan veya makul sınırların ötesinde olan. Bir şeyin en yüksek veya en düşük derecesi. Karşıt uçlardaki durumlar.", "examples": "1. extreme heat (aşırı sıcak)\n2. He goes from one extreme to the other. (Bir uçtan diğer uca gidiyor.)\n3. the extremes of wealth and poverty (zenginlik ve fakirliğin uç noktaları)", "rank": 946}, {"word": "sector", "type": "İsim", "meaning": "1. Sektör, kesim (ekonomik).", "full_meaning": "1. Sektör, kesim (ekonomik).\n2. Bölge, alan.\n3. (Geometri/Askeri) Dilim, bölge.", "guide": "Ekonomide benzer işler yapan işletmeler grubu veya belirli bir alan.", "examples": "1. He works in the private sector. (Özel sektörde çalışıyor.)\n2. The army advanced in the northern sector. (Ordu kuzey bölgesinde ilerledi.)\n3. Divide the circle into sectors. (Daireyi dilimlere bölün.)", "rank": 947}, {"word": "river", "type": "İsim", "meaning": "1. Nehir, ırmak.", "full_meaning": "1. Nehir, ırmak.\n2. Akarsu.", "guide": "Genellikle denize veya göle dökülen büyük doğal su yatağı.", "examples": "1. \"The Thames is a river that flows through London.\" (Thames, Londra'dan geçen bir nehirdir.)", "rank": 948}, {"word": "spirit", "type": "İsim", "meaning": "1. Ruh.", "full_meaning": "1. Ruh.\n2. Canlılık, heyecan.\n3. İçki, alkol (ruh).", "guide": "İnsanın maddi olmayan yönü; ayrıca cesaret veya karakter anlamında.", "examples": "1. They believe in the human spirit. (İnsan ruhuna inanırlar.)\n2. She played with great spirit. (Büyük bir canlılık/coşkuyla oynadı.)\n3. He doesn't drink spirits. (Alkollü içki/rakı içmez.)", "rank": 949}, {"word": "challenge", "type": "İsim/Fiil", "meaning": "1. Meydan okuma, zorluk (isim).", "full_meaning": "1. Meydan okuma, zorluk (isim).\n2. İtiraz etmek, sorgulamak (fiil).\n3. Düelloya çağırmak.", "guide": "Zorlu bir görev veya bir iddiaya karşı çıkma.", "examples": "1. Climbing the mountain was a great challenge. (Dağa tırmanmak büyük bir meydan okumaydı.)\n2. I challenge you to a game of chess. (Seni bir satranç oyununa davet ediyorum.)\n3. She challenged the decision in court. (Karara mahkemede itiraz etti.)", "rank": 950}, {"word": "daughter", "type": "İsim", "meaning": "1. Kız evlat.", "full_meaning": "1. Kız evlat.\n2. Bir yerden/kurumdan doğan şey (mecazi).", "guide": "Bir kişinin kız çocuğu. Bazen bir kurumun veya fikrin ürünü anlamında da kullanılır.", "examples": "1. Their daughter just started school. (Kızları daha yeni okula başladı.)\n2. The company is a daughter of a larger corporation. (Bu şirket daha büyük bir şirketin kolu.)", "rank": 951}, {"word": "quarter", "type": "İsim", "meaning": "1. Çeyrek, dörtte bir.", "full_meaning": "1. Çeyrek, dörtte bir.\n2. (Zaman) On beş dakika, çeyrek saat.\n3. (Para) Yirmi beş sent.", "guide": "Bir bütünün dört eşit parçasından birini ifade eder. Zaman, para ve mekan için yaygın kullanılır.", "examples": "1. \"A quarter of the students were absent.\" (Öğrencilerin dörtte biri yoktu.)\n2. \"It's a quarter past three.\" (Saat üçü çeyrek geçiyor.)\n3. \"Do you have a quarter for the parking meter?\" (Parkmetre için yirmi beş sentin var mı?)", "rank": 952}, {"word": "february", "type": "İsim", "meaning": "1. Şubat ayı.", "full_meaning": "1. Şubat ayı.", "guide": "Gregoryen takviminin ikinci ayı.", "examples": "1. My birthday is in February. (Doğum günüm Şubat ayında.)", "rank": 953}, {"word": "aspect", "type": "İsim", "meaning": "1. Yön, görünüş, açı.", "full_meaning": "1. Yön, görünüş, açı.\n2. Cephe, bakış (binaya).\n3. (Dilbilgisi) zaman görünüşü.", "guide": "Bir durum, fikir veya planın belirli bir yönü veya tarafı.", "examples": "1. We need to consider every aspect of the problem. (Sorunun her yönünü düşünmemiz gerekiyor.)\n2. The house has a southern aspect. (Evin güneye bakan bir cephesi var.)\n3. an important aspect of learning a language (bir dil öğrenmenin önemli bir yönü)", "rank": 954}, {"word": "physical", "type": "Sıfat", "meaning": "1. Fiziksel, bedensel.", "full_meaning": "1. Fiziksel, bedensel.\n2. Maddi, somut.\n3. Doğa yasalarıyla ilgili.", "guide": "Vücutla veya maddeyle ilgili olan, zihinsel veya ruhsal olmayan.", "examples": "1. He has great physical strength. (Büyük bir fiziksel gücü var.)\n2. We need physical evidence. (Somut kanıta ihtiyacımız var.)\n3. It's a physical impossibility. (Bu fiziksel olarak imkansız.)", "rank": 955}, {"word": "bar", "type": "İsim/Fiil", "meaning": "1. Bar, içkili mekan (isim).", "full_meaning": "1. Bar, içkili mekan (isim).\n2. Çubuk, parça (isim).\n3. Engel olmak, yasaklamak (fiil).", "guide": "İçki içilen yer; uzun, sert bir nesne; bir şeyi engelleme.", "examples": "1. Let's meet at the bar. (Barda buluşalım.)\n2. a bar of chocolate (bir parça çikolata)\n3. He was barred from entering the club. (Klübe girmesi yasaklandı.)", "rank": 956}, {"word": "advise", "type": "Fiil", "meaning": "1. Öğüt vermek, tavsiye etmek.", "full_meaning": "1. Öğüt vermek, tavsiye etmek.\n2. Bilgilendirmek, haber vermek.\n3. (Resmi) danışmanlık yapmak.", "guide": "Birine bir şey yapmasını önermek veya ona bilgi vermek.", "examples": "1. I'd advise you to see a lawyer. (Bir avukat görmeni tavsiye ederim.)\n2. We are advised to arrive early. (Bize erken gelmemiz söylendi.)\n3. He advises the government on economic matters. (Hükümete ekonomik konularda danışmanlık yapıyor.)", "rank": 957}, {"word": "customer", "type": "İsim", "meaning": "1. Müşteri.", "full_meaning": "1. Müşteri.\n2. (Bir tür) tip, adam.", "guide": "Bir mağazadan veya işletmeden bir şey satın alan kişi.", "examples": "1. The customer is always right. (Müşteri her zaman haklıdır.)\n2. a regular customer (daimi bir müşteri)\n3. customer service (müşteri hizmetleri)", "rank": 958}, {"word": "client", "type": "İsim", "meaning": "1. Müşteri, alıcı.", "full_meaning": "1. Müşteri, alıcı.\n2. Danışan, vekil altındaki kişi.\n3. (Bilgisayar) istemci.", "guide": "Bir profesyonelden hizmet alan kişi veya kuruluş (avukat, banka, muhasebeci).", "examples": "1. The lawyer met with her client. (Avukat müvekkiliyle görüştü.)\n2. a regular client (daimi bir müşteri)", "rank": 959}, {"word": "entire", "type": "Sıfat", "meaning": "1. Bütün, tüm, tam.", "full_meaning": "1. Bütün, tüm, tam.\n2. Eksiksiz, tamamen.", "guide": "Hiçbir parçası eksik olmayan, hepsi. \"Whole\" ile benzer anlamdadır.", "examples": "1. The entire village was covered in snow. (Bütün köy karla kaplıydı.)\n2. I spent the entire day cleaning. (Bütün günümü temizlik yaparak geçirdim.)", "rank": 960}, {"word": "beat", "type": "Fiil/İsim", "meaning": "1. Yenmek, dövmek (fiil).", "full_meaning": "1. Yenmek, dövmek (fiil).\n2. Vurmak, çarpmak (kalp) (fiil).\n3. Ritim, vuruş (isim).", "guide": "Bir yarışma veya mücadelede galip gelmek; düzenli olarak vurmak.", "examples": "1. Our team beat theirs. (Takımımız onlarınkini yendi.)\n2. My heart beats fast when I run. (Koştuğumda kalbim hızlı atar.)\n3. I love the beat of this song. (Bu şarkının ritmini seviyorum.)", "rank": 961}, {"word": "intend", "type": "Fiil", "meaning": "1. Niyet etmek, planlamak.", "full_meaning": "1. Niyet etmek, planlamak.\n2. Amaçlamak, kasdetmek.\n3. (Bir şey için) Tasarlanmak.", "guide": "Bir şeyi yapmayı planlamak veya düşünmek. Belirli bir amaca veya kişiye yönelik olmak.", "examples": "1. I intend to finish this project by Friday. (Bu projeyi Cuma'ya kadar bitirmeyi planlıyorum.)\n2. This gift is intended for you. (Bu hediye senin içindir.)\n3. The comment was not intended to be rude. (Yorum kaba olması için/kast edilerek söylenmedi.)", "rank": 962}, {"word": "tape", "type": "İsim / Fiil", "meaning": "İsim: 1. Bant (yapışkanlı).", "full_meaning": "İsim: 1. Bant (yapışkanlı).\n2. Şerit, kaset (ses/video).\nFiil: 3. Bantlamak, yapıştırmak.\n4. Kaydetmek (kasetle).", "guide": "Fiziksel bir bant veya manyetik kayıt ortamını ifade eder. Fiil olarak, bu nesneleri kullanma eylemidir.", "examples": "1. I need some sticky tape to wrap this gift. (Bu hediyeyi sarmak için biraz yapışkan bant lazım.)\n2. I found an old music tape from the 90s. (90'lardan kalma eski bir müzik kaseti buldum.)\n3. Could you tape this poster to the wall? (Bu posteri duvara bantlar mısın?)", "rank": 963}, {"word": "object", "type": "İsim / Fiil", "meaning": "1. Nesne, cisim.", "full_meaning": "1. Nesne, cisim.\n2. Amaç, gaye.\n3. İtiraz etmek, karşı çıkmak.", "guide": "Fiziksel bir şey veya bir eylemin amacı. Fiil olarak bir fikre karşı çıkmak.", "examples": "1. He picked up a shiny object. (Parıltılı bir nesneyi aldı.)\n2. The object of the game is to score points. (Oyunun amacı puan kazanmaktır.)\n3. Do you object if I smoke? (Sigara içmeme itirazın var mı?)", "rank": 964}, {"word": "exchange", "type": "Fiil/İsim", "meaning": "1. Değiş tokuş etmek, takas etmek (fiil).", "full_meaning": "1. Değiş tokuş etmek, takas etmek (fiil).\n2. Döviz bürosu, borsa (isim).\n3. (Sözlü) Tartışmak (fikir).", "guide": "Bir şeyi başka bir şeyle değiştirmek. Para veya mal alım satımının yapıldığı yer. Fikir alışverişi.", "examples": "1. Can I exchange this shirt for a larger size? (Bu gömleği daha büyük bedenle değiştirebilir miyim?)\n2. a stock exchange (bir borsa)\n3. a heated exchange of views (fikirlerin hararetli bir şekilde alışverişi)", "rank": 965}, {"word": "demonstrate", "type": "Fiil", "meaning": "1. Göstermek, sergilemek.", "full_meaning": "1. Göstermek, sergilemek.\n2. Açıklamak, gösterek anlatmak.\n3. Gösteri yapmak, protesto etmek.", "guide": "Bir şeyin nasıl çalıştığını veya yapıldığını pratik olarak göstermek. Bir duygu veya niteliği açıkça ortaya koymak.", "examples": "1. Can you demonstrate how to use this app? (Bu uygulamanın nasıl kullanılacağını gösterebilir misin?)\n2. He demonstrated great courage. (Büyük bir cesaret sergiledi.)\n3. Thousands demonstrated against the new law. (Binlerce kişi yeni yasaya karşı gösteri yaptı.)", "rank": 966}, {"word": "beyond", "type": "Edat/Zarf", "meaning": "1. Ötesinde, öte (edat).", "full_meaning": "1. Ötesinde, öte (edat).\n2. Üzerinde, fazlasıyla (edat).\n3. Daha öte, ilerisi (zarf).", "guide": "Bir şeyin diğer tarafında veya bir sınırın/olasılığın ötesinde olma durumu.", "examples": "1. The village is beyond the mountains. (Köy dağların ötesindedir.)\n2. The situation is beyond my control. (Durum benim kontrolümün ötesinde.)\n3. and beyond (ve ötesi)", "rank": 967}, {"word": "strength", "type": "İsim", "meaning": "1. Güç, kuvvet.", "full_meaning": "1. Güç, kuvvet.\n2. Dayanıklılık, mukavemet.\n3. Avantaj, güçlü yan.", "guide": "Fiziksel veya zihinsel güç, bir şeye dayanma kapasitesi.", "examples": "1. He has great physical strength. (Büyük bir fiziksel gücü var.)\n2. The strength of the material is tested. (Malzemenin dayanıklılığı test edilir.)\n3. Patience is her greatest strength. (Sabır onun en büyük güçlü yanıdır.)", "rank": 968}, {"word": "laugh", "type": "Fiil / İsim", "meaning": "1. Gülmek / Kahkaha.", "full_meaning": "1. Gülmek / Kahkaha.\n2. Eğlenmek, gülüp eğlenmek.", "guide": "Neşe, eğlence veya alay ifadesi olarak sesli bir şekilde gülmek.", "examples": "1. That joke always makes me laugh. (Bu şaka beni her zaman güldürür.)\n2. We had a good laugh about it. (Bu konuda iyice güldük.)\n3. He gave a nervous laugh. (Gergin bir kahkaha attı.)", "rank": 969}, {"word": "baby", "type": "İsim", "meaning": "1. Bebek.", "full_meaning": "1. Bebek.\n2. En küçük/kıdemli kişi.\n3. Sevgili (hitap).", "guide": "Çok küçük çocuk. Mecazi olarak bir grubun en genç veya en tecrübesiz üyesi.", "examples": "1. They just had a new baby. (Yeni bir bebekleri oldu.)\n2. He's the baby of the family. (O ailenin bebeği/en küçüğüdür.)\n3. Hey baby, what's up? (Hey bebeğim, naber?)", "rank": 970}, {"word": "assume", "type": "Fiil", "meaning": "1. Varsaymak, farz etmek.", "full_meaning": "1. Varsaymak, farz etmek.\n2. Üstlenmek (sorumluluk).\n3. Takınmak (tavır).", "guide": "Kanıt olmadan doğru olduğunu kabul etmek veya bir rol veya sorumluluğu almak.", "examples": "1. I assume you've finished your work. (İşini bitirdiğini varsayıyorum.)\n2. She will assume the role of director. (Müdür rolünü üstlenecek.)\n3. He assumed an air of confidence. (Kendinden emin bir hava takındı.)", "rank": 971}, {"word": "surface", "type": "İsim / Fiil", "meaning": "1. (İ) Yüzey.", "full_meaning": "1. (İ) Yüzey.\n2. (İ) Dış görünüş.\n3. (F) Su yüzüne çıkmak, ortaya çıkmak.", "guide": "Bir cismin en dış katmanı veya sınırı. Fiil olarak ortaya çıkmak.", "examples": "1. The surface of the moon is rocky. (Ay'ın yüzeyi kayalıktır.)\n2. On the surface, everything seemed fine. (Dışarıdan/Görünüşte her şey iyi görünüyordu.)\n3. The submarine surfaced. (Denizaltı su yüzüne çıktı.)", "rank": 972}, {"word": "length", "type": "İsim", "meaning": "1. Uzunluk, boy.", "full_meaning": "1. Uzunluk, boy.\n2. Süre.\n3. (Bir şeyin) Tamamı, tüm detayları.", "guide": "Bir şeyin bir uçtan diğer uca olan ölçüsü. Bir olayın veya nesnenin süresi.", "examples": "1. What is the length of the pool? (Havuzun uzunluğu ne?)\n2. He was frustrated by the length of the meeting. (Toplantının uzunluğundan dolayı hayal kırıklığına uğradı.)\n3. She explained the situation at length. (Durumu uzun uzadıya açıkladı.)", "rank": 973}, {"word": "promise", "type": "İsim/Fiil", "meaning": "1. (İsim) Söz, vaat.", "full_meaning": "1. (İsim) Söz, vaat.\n2. (İsim) Umut verici işaret, potansiyel.\n3. (Fiil) Söz vermek.", "guide": "Bir şeyi yapacağına veya yapmayacağına dair söz verme. İyiye işaret eden belirti.", "examples": "1. He made a promise to be on time. (Zamanında olacağına söz verdi.)\n2. She shows great promise as a musician. (Bir müzisyen olarak büyük potansiyel gösteriyor.)\n3. I promise I won't tell anyone. (Kimseye söylemeyeceğime söz veriyorum.)", "rank": 974}, {"word": "goal", "type": "İsim", "meaning": "1. Gol (spor).", "full_meaning": "1. Gol (spor).\n2. Amaç, hedef.\n3. Kale (spor).", "guide": "Futbol vb. sporlarda sayı kazanma eylemi veya yeri. Hayattaki veya bir projedeki istenilen sonuç.", "examples": "1. He scored the winning goal. (Kazanma golünü attı.)\n2. My goal is to learn Spanish. (Hedefim İspanyolca öğrenmek.)\n3. The ball hit the goal post. (Top kale direğine çarptı.)", "rank": 975}, {"word": "extend", "type": "Fiil", "meaning": "1. Uzatmak, genişletmek.", "full_meaning": "1. Uzatmak, genişletmek.\n2. (Süre) Uzatmak.\n3. (Yardım) Sunmak, teklif etmek.", "guide": "Fiziksel olarak daha uzun veya daha geniş hale getirmek. Bir süreyi daha uzun yapmak. Bir şeyi (örneğin tebrikler) sunmak.", "examples": "1. They plan to extend the building. (Binayı genişletmeyi planlıyorlar.)\n2. Can we extend the deadline? (Son teslim tarihini uzatabilir miyiz?)\n3. I'd like to extend my thanks to everyone. (Herkes teşekkürlerimi sunmak istiyorum.)", "rank": 976}, {"word": "equipment", "type": "İsim", "meaning": "1. Ekipman, donanım, teçhizat.", "full_meaning": "1. Ekipman, donanım, teçhizat.\n2. Malzeme, araç-gereç.", "guide": "Belirli bir faaliyet veya amaç için gerekli olan araçların, makinelerin veya diğer eşyaların tamamı. Çoğul olarak kullanılır, tekil fiil alır.", "examples": "1. The laboratory has the latest equipment. (Laboratuvarın en son ekipmanları var.)\n2. camping equipment (kamp ekipmanı)", "rank": 977}, {"word": "push", "type": "Fiil/İsim", "meaning": "1. (Fiil) İtmek.", "full_meaning": "1. (Fiil) İtmek.\n2. (Fiil) Zorlamak, baskı yapmak.\n3. (İsim) İtme, hamle.\n4. (İsim) Gayret, çaba.", "guide": "Uzaklaştırmak için kuvvet uygulamak. Bir şeyi yapması için zorlamak. Fiziksel veya mecazi itme.", "examples": "1. Push the door, don't pull it. (Kapıyı itin, çekmeyin.)\n2. My parents pushed me to study harder. (Ailem daha sıkı çalışmam için beni zorladı.)\n3. Give the car a push to get it started. (Arabayı çalıştırmak için bir itme ver.)\n4. We need one last push to finish the project. (Projeyi bitirmek için son bir gayrete ihtiyacımız var.)", "rank": 978}, {"word": "search", "type": "Fiil / İsim", "meaning": "1. (F) Aramak.", "full_meaning": "1. (F) Aramak.\n2. (İ) Arama.\n3. (F) Didik didik etmek, üstünü aramak.", "guide": "Dikkatle ve sistematik olarak bir şeyi bulmaya çalışmak.", "examples": "1. I need to search for my keys. (Anahtarlarımı aramam gerekiyor.)\n2. The search for the missing child continues. (Kayıp çocuk araması devam ediyor.)\n3. The police searched his bag. (Polis onun çantasını aradı.)", "rank": 979}, {"word": "speed", "type": "İsim / Fiil", "meaning": "1. (İ) Hız.", "full_meaning": "1. (İ) Hız.\n2. (F) Hız yapmak, hızlı gitmek.\n3. (İ) Sürat, çabukluk.", "guide": "Bir cismin birim zamanda aldığı yol. Fiil olarak çok hızlı hareket etmek.", "examples": "1. What's the speed limit? (Hız sınırı nedir?)\n2. The car sped past us. (Araba yanımızdan hızla geçti.)\n3. He finished the work with incredible speed. (İşi inanılmaz bir hızla bitirdi.)", "rank": 980}, {"word": "pain", "type": "İsim", "meaning": "1. Ağrı, acı (fiziksel).", "full_meaning": "1. Ağrı, acı (fiziksel).\n2. Üzüntü, keder, ıstırap (duygusal).\n3. (Argo) Can sıkıcı/sorun çıkaran kişi veya şey.", "guide": "Genellikle fiziksel bir ağrıyı tanımlar. Duygusal acı için de yaygın kullanılır.", "examples": "1. I have a sharp pain in my back. (Sırtımda keskin bir ağrı var.)\n2. The memory brought her great pain. (Anı ona büyük bir acı getirdi.)\n3. My little brother is a real pain sometimes. (Küçük kardeşim bazen tam bir baş belası.)", "rank": 981}, {"word": "direction", "type": "İsim", "meaning": "1. Yön, istikamet.", "full_meaning": "1. Yön, istikamet.\n2. Talimat, yönerge.\n3. Yönetim, idare.", "guide": "Bir şeyin hareket ettiği, baktığı veya hedeflediği çizgi. Ne yapılacağına dair sözlü veya yazılı emir. Bir organizasyonun kontrolü.", "examples": ahiplikte am kullanılmaz. Direkt I have."}, "practices": [{"tr": "İki kardeşim var", "en": "I have two brothers", "keywords": ["have", "brothers"]}, {"tr": "Fikrim yok", "en": "I don't have an idea", "keywords": ["don't", "idea"]}, {"tr": "Köpeğim var", "en": "I have a dog", "keywords": ["have", "dog"]}], "want": "Bir şeyin var ya da yok olduğunu söylemek istiyorsan (arabam var, param yok)", "say": "I have + şey  /  I don't have + şey  →  I have a car", "steps": ["Var → I have, yok → I don't have.", "Türkçede şey başta, İngilizcede kişi başta: arabam var → I have a car."], "ord": 14, "why": "Türkçede \"bende var\" diyip sahibi başa koymazsın, İngilizcede ise kişi önce gelir: I have. Yok demek için fiilin önüne don't koyarsın."}, {"id": 4, "level": "S3", "title": "Nerede? ve izin isteme", "tr": "nerede rica", "pattern": "Where is ...? / Can I ...?", "patternDesc": "Yer sormak ve kibarca izin istemek için iki sihirli başlangıç.", "thinkTr": "Nerede? / ...bilir miyim?", "thinkEn": "Where is? / Can I?", "expandedTr": "Tuvalet nerede / oturabilir miyim / menüyü alabilir miyim demek için yani yer sormak rica etmek için", "expandedEn": "Where is the bathroom? / Can I sit here? / Can I have the menu? de", "examples": [{"tr": "Tuvalet nerede?", "en": "Where is the bathroom?"}, {"tr": "Buraya oturabilir miyim?", "en": "Can I sit here?"}, {"tr": "Menüyü alabilir miyim?", "en": "Can I have the menu?"}], "trap": {"title": "Where is are karıştırma", "wrong": "Where are the bathroom?", "correct": "Where is the bathroom?", "detail": "Tuvalet tekil, is kullan. Çoğul olsaydı are."}, "practices": [{"tr": "İstasyon nerede?", "en": "Where is the station?", "keywords": ["Where", "station"]}, {"tr": "Sana yardım edebilir miyim?", "en": "Can I help you?", "keywords": ["Can", "help"]}, {"tr": "Pencereyi açabilir miyim?", "en": "Can I open the window?", "keywords": ["Can", "open"]}], "want": "Bir yeri sormak (tuvalet nerede?) ya da kibarca izin istemek (oturabilir miyim?) istiyorsan", "say": "Where is + yer?  /  Can I + fiil?  →  Where is the bathroom?", "steps": ["Yer soracaksan Where is ile başla, yeri sona koy.", "İzin isteyeceksen Can I ile başla, fiili ekle: Can I sit here?"], "ord": 25, "why": "Yer sorarken Where is, izin isterken Can I kullanırsın. İkisi de \"bir bilgi ya da izin istiyorum\" demenin kısa yolu."}, {"id": 5, "level": "S7", "title": "Geçmiş zaman: idim (was / were)", "tr": "geçmişte durum", "pattern": "I was / You were + sıfat / yer", "patternDesc": "Dün, geçen hafta nasıldın, neredeydin demek için am/is/are'nin geçmişi was/were.", "thinkTr": "Dün ...ydim", "thinkEn": "I was ... yesterday", "expandedTr": "Dün yorgundum / oradaydım / evdeydim demek için yani geçmişte durumunu söylemek için", "expandedEn": "I was tired yesterday / I was there / I was at home de", "examples": [{"tr": "Dün yorgundum", "en": "I was tired yesterday"}, {"tr": "Oradaydım", "en": "I was there"}, {"tr": "Evdeydim", "en": "I was at home"}], "trap": {"title": "was mı were mı", "wrong": "You was there", "correct": "You were there", "detail": "I/he/she/it -> was, you/we/they -> were."}, "practices": [{"tr": "Dün hastaydım", "en": "I was sick yesterday", "keywords": ["was", "sick"]}, {"tr": "Partideydik", "en": "We were at the party", "keywords": ["were", "party"]}, {"tr": "Çok meşguldüm", "en": "I was very busy", "keywords": ["was", "busy"]}], "want": "Geçmişte nasıl ya da nerede olduğunu söylemek istiyorsan (yorgundum, evdeydim)", "say": "I was / You were + nasıl / nerede  →  I was tired yesterday", "steps": ["I, he, she, it ile was; you, we, they ile were kullan.", "Zamanı sona ekleyebilirsin: yesterday, last week."], "ord": 69, "why": "Şimdi için am / is / are, geçmiş için was / were. I, he, she, it ile was; you, we, they ile were gelir."}, {"id": 6, "level": "S7", "title": "Geçmiş zaman: yaptım (Past Simple)", "tr": "dün yaptım", "pattern": "I + fiil 2.hali (went/saw/came)", "patternDesc": "Dün ne yaptığını söyle. Go->went, see->saw, come->came. Ezberlik 3 fiil.", "thinkTr": "Dün gittim / gördüm / geldim", "thinkEn": "I went / saw / came", "expandedTr": "Dün geldim / gördüm / gittim demek için yani geçmişte yaptığını söylemek için", "expandedEn": "I came yesterday / I saw it / I went there de", "examples": [{"tr": "Dün geldim", "en": "I came yesterday"}, {"tr": "Onu gördüm", "en": "I saw it"}, {"tr": "Oraya gittim", "en": "I went there"}], "trap": {"title": "did went değil", "wrong": "I did went", "correct": "I went", "detail": "Olumlu geçmişte did kullanma. Sadece I went."}, "practices": [{"tr": "Seni gördüm", "en": "I saw you", "keywords": ["saw", "you"]}, {"tr": "Eve gittim", "en": "I went home", "keywords": ["went", "home"]}, {"tr": "Geç geldim", "en": "I came late", "keywords": ["came", "late"]}], "want": "Dün ya da geçen hafta yaptığın bir şeyi anlatmak istiyorsan (gittim, gördüm, geldim)", "say": "I + fiilin geçmiş hali  →  I went, I saw, I came", "steps": ["Önce kişiyi söyle: I.", "Fiili geçmiş haliyle koy: go → went, see → saw, come → came. Araya did koyma."], "ord": 70, "why": "Geçmişte bitmiş bir iş için fiilin geçmiş hâlini kullan: went, saw, came. Cümlede yesterday ya da last week varsa geçmiş zaman kullan."}, {"id": 7, "level": "S4", "title": "Şimdiki zaman: yapıyor (Present Continuous)", "tr": "şu an", "pattern": "I am + Fiil-ing", "patternDesc": "Şu anda ne yapıyorsun? Tam şu an. am working = çalışıyorum.", "thinkTr": "Şu an ...yorum", "thinkEn": "I am ...ing now", "expandedTr": "Şu an çalışıyorum / geliyorum / okuyorum demek için yani şu an yaptığını söylemek için", "expandedEn": "I am working now / I am coming / I am reading de", "examples": [{"tr": "Şu an çalışıyorum", "en": "I am working now"}, {"tr": "Geliyorum", "en": "I am coming"}, {"tr": "Okuyorum", "en": "I am reading"}], "trap": {"title": "ing unutma", "wrong": "I am work", "correct": "I am working", "detail": "am'den sonra fiile mutlaka -ing ekle."}, "practices": [{"tr": "Yemek yapıyorum", "en": "I am cooking", "keywords": ["cooking"]}, {"tr": "Seni bekliyorum", "en": "I am waiting for you", "keywords": ["waiting"]}, {"tr": "Öğreniyorum", "en": "I am learning", "keywords": ["learning"]}], "want": "Şu anda yaptığın bir şeyi söylemek istiyorsan (çalışıyorum, okuyorum)", "say": "I am + fiil-ing  →  I am working now", "steps": ["Önce I am de.", "Fiilin sonuna -ing ekle: work → working, read → reading."], "ord": 41, "why": "Şu an olan iş için am + fiil-ing, alışkanlık için düz fiil. \"Şu an\" varsa -ing, \"her gün\" varsa düz fiil."}, {"id": 8, "level": "S6", "title": "Gelecek zaman: yapacağım (will)", "tr": "gelecek", "pattern": "I will + fiil", "patternDesc": "Yarın ne yapacaksın? Gelecek için will yeterli. Söz veriyorsun.", "thinkTr": "...eceğim / ...acağım", "thinkEn": "I will ...", "expandedTr": "Yarın gideceğim / yapacağım / geleceğim demek için yani gelecek planını söylemek için", "expandedEn": "I will go tomorrow / I will do it / I will come de", "examples": [{"tr": "Yarın gideceğim", "en": "I will go tomorrow"}, {"tr": "Yapacağım", "en": "I will do it"}, {"tr": "Geleceğim", "en": "I will come"}], "trap": {"title": "will to yok", "wrong": "I will to go", "correct": "I will go", "detail": "will'den sonra to gelmez. Direkt fiil."}, "practices": [{"tr": "Seni arayacağım", "en": "I will call you", "keywords": ["will", "call"]}, {"tr": "Orada olacağım", "en": "I will be there", "keywords": ["will", "there"]}, {"tr": "Yardım edeceğim", "en": "I will help", "keywords": ["help"]}], "want": "İleride yapacağın ya da söz verdiğin bir şeyi söylemek istiyorsan (yarın gideceğim)", "say": "I will + fiil  →  I will go tomorrow", "steps": ["Türkçedeki -ecek / -acak ekini will yap.", "will'den sonra fiil düz kalır, to koyma: I will go."], "ord": 56, "why": "will, konuşurken verdiğin anlık kararı ya da sözü anlatır. Önceden planladıysan going to kullan."}, {"id": 9, "level": "S2", "title": "Yapabilirim / yapamam", "tr": "yetenek", "pattern": "I can / can't + fiil", "patternDesc": "Yapabiliyorum / yapamıyorum demek için can. En güçlü kelimelerden biri.", "thinkTr": "Yapabilirim / yapamam", "thinkEn": "I can / I can't", "expandedTr": "Yüzebilirim / gelemem / yapabilirim demek için yani yapabildiğini veya yapamadığını söylemek için", "expandedEn": "I can swim / I can't come / I can do it de", "examples": [{"tr": "Yüzebilirim", "en": "I can swim"}, {"tr": "Gelemem", "en": "I can't come"}, {"tr": "Yapabilirim", "en": "I can do it"}], "trap": {"title": "can to yok", "wrong": "I can to swim", "correct": "I can swim", "detail": "can'den sonra to gelmez. can + fiil direkt."}, "practices": [{"tr": "Araba sürebilirim", "en": "I can drive", "keywords": ["drive"]}, {"tr": "Seni duyamıyorum", "en": "I can't hear you", "keywords": ["hear"]}, {"tr": "İngilizce konuşabilirim", "en": "I can speak English", "keywords": ["speak"]}], "want": "Yapabildiğini ya da yapamadığını söylemek istiyorsan (yüzebilirim, gelemem)", "say": "I can + fiil  /  I can't + fiil  →  I can swim", "steps": ["Yapabilirim → I can, yapamam → I can't.", "Fiil düz kalır: I can swim (can to swim değil)."], "ord": 13, "why": "can bir yeteneği ya da izni anlatır ve arkasındaki fiil hiç değişmez. Kişi kim olursa olsun can aynı kalır."}, {"id": 11, "level": "S4", "title": "Orada ... var", "tr": "var", "pattern": "There is / are + şey + yer", "patternDesc": "Bir yerde bir şey var demek için. There is tekil, there are çoğul.", "thinkTr": "Orada ... var", "thinkEn": "There is / are ...", "expandedTr": "Masada kitap var / çok insan var / sorun var demek için yani bir yerde bir şey olduğunu söylemek için", "expandedEn": "There is a book on the table / There are many people / There is a problem de", "examples": [{"tr": "Masada kitap var", "en": "There is a book on the table"}, {"tr": "Çok insan var", "en": "There are many people"}, {"tr": "Sorun var", "en": "There is a problem"}], "trap": {"title": "there is are uyumu", "wrong": "There is many people", "correct": "There are many people", "detail": "people çoğul, are kullan."}, "practices": [{"tr": "Buzdolabında süt var", "en": "There is milk in the fridge", "keywords": ["milk"]}, {"tr": "Parkta çocuklar var", "en": "There are kids in the park", "keywords": ["kids"]}, {"tr": "Zamanımız var", "en": "There is time", "keywords": ["time"]}], "want": "Bir yerde bir şey olduğunu söylemek istiyorsan (masada kitap var, sorun var)", "say": "There is + tek şey  /  There are + çok şey  →  There is a book on the table", "steps": ["Türkçedeki 'var' → There is (tek) ya da There are (çok).", "Önce şeyi, en sonda yeri söyle."], "ord": 34, "why": "Bir şeyin var olduğunu söylerken there is (tek şey) ya da there are (çok şey) kullan. Türkçede \"var\" tek kelime, İngilizcede sayıya bakarsın."}, {"id": 12, "level": "S3", "title": "Ne kadar? Kaç tane?", "tr": "miktar", "pattern": "How much / many / long ...?", "patternDesc": "Miktar sormanın yolu. Sayılamayan için much, sayılan için many, süre için long.", "thinkTr": "Ne kadar? Kaç tane?", "thinkEn": "How much / many / long?", "expandedTr": "Ne kadar / kaç tane / ne kadar sürer demek için yani miktar sormak için", "expandedEn": "How much is it? / How many do you have? / How long does it take? de", "examples": [{"tr": "Bu ne kadar?", "en": "How much is it?"}, {"tr": "Kaç tane var?", "en": "How many do you have?"}, {"tr": "Ne kadar sürer?", "en": "How long does it take?"}], "trap": {"title": "much many karıştırma", "wrong": "How many money?", "correct": "How much money?", "detail": "money sayılamaz, much sorulur."}, "practices": [{"tr": "Kaç kardeşin var?", "en": "How many brothers do you have?", "keywords": ["How many"]}, {"tr": "Ne kadar şeker?", "en": "How much sugar?", "keywords": ["How much"]}, {"tr": "Ne kadar uzak?", "en": "How far is it?", "keywords": ["How far"]}], "want": "Fiyat, adet ya da süre sormak istiyorsan (ne kadar? kaç tane?)", "say": "How much (para, su)  /  How many (sayılanlar)  /  How long (süre)", "steps": ["Sayamadığın şeylerde How much: How much is it?", "Tek tek sayabildiklerinde How many, süre i , "correct": "Could you help me?", "detail": "Could ve can'den sonra to gelmez."}, "practices": [{"tr": "Sesi kısar mısın?", "en": "Could you turn it down, please?", "keywords": []}, {"tr": "Bana su verir misin?", "en": "Can you give me some water?", "keywords": []}], "ord": 15, "why": "Can you samimi ortamda, Could you daha kibar ortamda kullanılır. Tanımadığın birine ya da iş ortamında Could seç."}, {"id": 32, "level": "S6", "title": "Öner: Let's, How about", "tr": "", "pattern": "Let's + fiil", "want": "Birine bir şey yapmayı önermek istiyorsan (gidelim mi, yapalım mı?)", "say": "Let's + fiil  /  How about + şey  /  Why don't we + fiil?", "steps": ["Direkt öneri için Let's: Let's go.", "Nazik öneri için How about veya Why don't we."], "expandedTr": "", "expandedEn": "", "patternDesc": "", "examples": [{"tr": "Yürüyüşe çıkalım.", "en": "Let's go for a walk."}, {"tr": "Kahve içmeye ne dersin?", "en": "How about a coffee?"}, {"tr": "Neden bir film izlemiyoruz?", "en": "Why don't we watch a movie?"}], "trap": {"title": "Dikkat", "wrong": "Let's to go", "correct": "Let's go", "detail": "Let's'den sonra düz fiil gelir."}, "practices": [{"tr": "Yemek yiyelim.", "en": "Let's eat.", "keywords": []}, {"tr": "Yarın buluşsak mı?", "en": "How about meeting tomorrow?", "keywords": []}], "ord": 60, "why": "Let's direkt öneri, How about nazik soru, Why don't we daha yumuşak önerir. Kime önerdiğine göre seç."}, {"id": 33, "level": "S2", "title": "Restoranda sipariş", "tr": "", "pattern": "I'll have + şey", "want": "Restoranda, kafede ya da dükkânda bir şey almak istiyorsan", "say": "I'll have + şey  /  Can I get + şey?", "steps": ["Sipariş verirken I'll have de: I'll have a coffee.", "Daha rahat istersen Can I get ... ? de."], "expandedTr": "", "expandedEn": "", "patternDesc": "", "examples": [{"tr": "Bir kahve alayım.", "en": "I'll have a coffee."}, {"tr": "Hesabı alabilir miyim?", "en": "Can I get the bill?"}, {"tr": "Bu kadar, teşekkürler.", "en": "That's all, thanks."}], "tra
