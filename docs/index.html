tlendirmek, teşvik etmek.\n2. Özendirmek, desteklemek.\n3. (Davranış) Pekıştırmak.", "guide": "Birine bir şeyi yapması için güven veya umut vermek. Bir şeyin olmasını veya gelişmesini desteklemek.", "examples": "1. My teacher encouraged me to apply for the job. (Öğretmenim işe başvurmam için beni cesaretlendirdi.)\n2. The government encourages investment. (Hükümet yatırımı teşvik ediyor.)", "rank": 768}, {"word": "attract", "type": "Fiil", "meaning": "1. Çekmek, cezbetmek.", "full_meaning": "1. Çekmek, cezbetmek.\n2. İlgi uyandırmak.\n3. (Fizik) çekmek.", "guide": "İlgi, beğeni veya fiziksel yakınlık yaratmak.", "examples": "1. The city attracts millions of tourists every year. (Şehir her yıl milyonlarca turist çeker.)\n2. He was attracted to her sense of humour. (Onun mizah anlayışından etkilendi.)\n3. Opposite poles attract. (Zıt kutuplar birbirini çeker.)", "rank": 769}, {"word": "damage", "type": "İsim/Fiil", "meaning": "1. Hasar, zarar (isim).", "full_meaning": "1. Hasar, zarar (isim).\n2. Bozmak, hasar vermek (fiil).\n3. (Çoğul) Tazminat, zarar ödemesi (isim).", "guide": "Fiziksel bir şeye verilen zararı ifade edebileceği gibi (kırılma, çizilme), itibar, ilişki gibi soyut şeylere verilen zararı da ifade edebilir.", "examples": "1. The storm caused a lot of damage to the roof. (Fırtına çatıya çok fazla hasar verdi.)\n2. Be careful not to damage the books. (Kitaplara zarar vermemeye dikkat et.)\n3. He sued the company for damages. (Şirkete tazminat davası açtı.)", "rank": 770}, {"word": "corporate", "type": "Sıfat", "meaning": "1. Kurumsal, şirkete ait.", "full_meaning": "1. Kurumsal, şirkete ait.\n2. Tüzel, tüzel kişilik.\n3. Birlikte yapılan, ortak.", "guide": "Bir şirket veya büyük ticari organizasyonla ilgili olan.", "examples": "1. corporate finance (kurumsal finans)\n2. corporate culture (kurum kültürü)\n3. corporate responsibility (kurumsal sorumluluk)", "rank": 771}, {"word": "commit", "type": "Fiil", "meaning": "1. İşlemek, yapmak (suç/hata).", "full_meaning": "1. İşlemek, yapmak (suç/hata).\n2. Söz vermek, taahhüt etmek.\n3. (Kendini) adamak.", "guide": "Bir eylemde bulunmak, özellikle yanlış veya yasa dışı bir eylem. Bir şeye söz vermek.", "examples": "1. He committed a crime. (Bir suç işledi.)\n2. The government is committed to improving healthcare. (Hükümet sağlık hizmetlerini iyileştirmeye kararlıdır.)\n3. She didn't want to commit to a relationship. (Bir ilişkiye bağlanmak istemedi.)", "rank": 772}, {"word": "heavy", "type": "Sıfat", "meaning": "1. Ağır.", "full_meaning": "1. Ağır.\n2. Yoğun, şiddetli (yağmur/trafik).\n3. Ciddi, ağır (soru/konu).", "guide": "Hafif olmayan, çok ağırlığı olan. Büyük miktar veya derecede. Düşünmeyi gerektiren, derin.", "examples": "1. This box is too heavy to lift. (Bu kutu kaldırmak için çok ağır.)\n2. We're stuck in heavy traffic. (Yoğun trafikte sıkıştık kaldık.)\n3. They had a heavy discussion about politics. (Siyaset hakkında ciddi/ağır bir tartışma yaptılar.)", "rank": 773}, {"word": "village", "type": "İsim", "meaning": "1. Köy", "full_meaning": "1. Köy\n2. Köy halkı, topluluk\n3. Mahalle (şehir içi)", "guide": "Genellikle kırsal bir alanda bulunan, kasabadan daha küçük yerleşim birimidir. Bazen şehirde belirli bir alan veya topluluk için de kullanılır.", "examples": "1. He grew up in a small fishing village. (Küçük bir balıkçı köyünde büyüdü.)\n2. The whole village came to the celebration. (Bütün köy halkı kutlamaya geldi.)\n3. We live in Greenwich Village in New York. (New York'ta Greenwich Village'de yaşıyoruz.)", "rank": 774}, {"word": "construct", "type": "Fiil", "meaning": "1. İnşa etmek, yapmak.", "full_meaning": "1. İnşa etmek, yapmak.\n2. (Cümle/teori) kurmak.\n3. Çizmek (geometri).", "guide": "Bir şeyi parçaları bir araya getirerek oluşturmak.", "examples": "1. They plan to construct a new bridge. (Yeni bir köprü inşa etmeyi planlıyorlar.)\n2. a well-constructed argument (iyi kurulmuş bir argüman)", "rank": 775}, {"word": "settle", "type": "Fiil", "meaning": "1. Yerleşmek.", "full_meaning": "1. Yerleşmek.\n2. Halletmek, çözmek.\n3. Ödemek (borç).", "guide": "Bir yere kalıcı olarak yerleşmek veya bir sorunu/borcu sonuçlandırmak.", "examples": "1. They settled in Canada. (Kanada'ya yerleştiler.)\n2. We need to settle this argument. (Bu tartışmayı halletmemiz gerekiyor.)\n3. I'll settle the bill. (Hesabı ödeyeceğim.)", "rank": 776}, {"word": "evening", "type": "İsim", "meaning": "1. Akşam.", "full_meaning": "1. Akşam.\n2. Akşam vakti.\n3. Akşam eğlencesi.", "guide": "Gün batımından gece yarısına kadar olan zaman dilimi. Sosyal bir etkinliğin akşam yapılan kısmı.", "examples": "1. I'll see you this evening. (Seni bu akşam görürüm.)\n2. a pleasant summer evening (hoş bir yaz akşamı)", "rank": 777}, {"word": "parliament", "type": "İsim", "meaning": "1. Parlamento, meclis.", "full_meaning": "1. Parlamento, meclis.\n2. (İngiltere'de) Parlamento binası.", "guide": "Bir ülkenin yasama organı. Büyük harfle, İngiltere'nin yasama organının özel adıdır.", "examples": "1. The new law was passed by parliament. (Yeni yasa parlamento tarafından kabul edildi.)\n2. A tour of the Houses of Parliament. (Parlamento Binaları turu.)", "rank": 778}, {"word": "affect", "type": "Fiil", "meaning": "1. Etkilemek.", "full_meaning": "1. Etkilemek.\n2. (Duygusal) etkilemek, üzmek.\n3. (Hastalık) vurmak, yakalamak.", "guide": "Bir şeyin veya birinin üzerinde bir değişiklik veya etki yaratmak. Genellikle \"effect\" (etki, sonuç) ismi ile karıştırılır.", "examples": "1. The bad weather affected our plans. (Kötü hava planlarımızı etkiledi.)\n2. The news deeply affected her. (Haber onu derinden etkiledi.)\n3. The disease affects the central nervous system. (Hastalık merkezi sinir sistemini etkiler.)", "rank": 779}, {"word": "series", "type": "İsim", "meaning": "1. Dizi, seri.", "full_meaning": "1. Dizi, seri.\n2. (TV) Dizi.\n3. Ardışık olaylar.", "guide": "Benzer veya ilişkili şeylerin bir araya geldiği grup veya olaylar zinciri.", "examples": "1. He published a series of articles. (Bir dizi makale yayınladı.)\n2. Are you watching that new series? (O yeni diziyi izliyor musun?)\n3. A series of mistakes led to the accident. (Bir dizi hata kazaya yol açtı.)", "rank": 780}, {"word": "danger", "type": "İsim", "meaning": "1. Tehlike, risk.", "full_meaning": "1. Tehlike, risk.\n2. Zarar görme olasılığı.\n3. Tehlike kaynağı.", "guide": "Yaralanma, hasar veya kayıp riski taşıyan durum veya şey.", "examples": "1. There is a danger of falling rocks. (Düşen taş tehlikesi var.)\n2. His life is in danger. (Onun hayatı tehlikede.)\n3. Smoking is a danger to health. (Sigara içmek sağlık için bir tehlikedir.)", "rank": 781}, {"word": "basic", "type": "Sıfat", "meaning": "1. Temel, esas.", "full_meaning": "1. Temel, esas.\n2. Basit, sade.\n3. (İhtiyaç) asgari, zaruri.", "guide": "En gerekli, en önemli veya en az karmaşık olan.", "examples": "1. You need to learn the basic rules first. (Önce temel kuralları öğrenmen gerek.)\n2. The accommodation is very basic. (Konaklama yeri çok sade.)\n3. basic human rights (temel insan hakları)", "rank": 782}, {"word": "threat", "type": "İsim", "meaning": "1. Tehdit.", "full_meaning": "1. Tehdit.\n2. Tehlike, risk.", "guide": "Zarar verme veya kötülük yapma niyetini bildirme. Ayrıca, potansiyel bir tehlike kaynağı anlamına da gelir.", "examples": "1. He received a death threat. (Bir ölüm tehdidi aldı.)\n2. Pollution is a major threat to the environment. (Kirlilik, çevre için büyük bir tehdit/tehlikedir.)\n3. Her job is under threat due to budget cuts. (Bütçe kesintileri yüzünden işi tehlike altında.)", "rank": 783}, {"word": "energy", "type": "İsim", "meaning": "1. Enerji, güç.", "full_meaning": "1. Enerji, güç.\n2. Canlılık, hareketlilik.\n3. (Fizik) Enerji.", "guide": "İş yapabilme kapasitesi (fiziksel veya zihinsel). Kişinin canlı ve aktif olma hali.", "examples": "1. I don't have the energy to go out tonight. (Bu gece dışarı çıkacak enerjim yok.)\n2. Children are full of energy. (Çocuklar enerji doludur.)\n3. renewable energy sources (yenilenebilir enerji kaynakları)", "rank": 784}, {"word": "reflect", "type": "Fiil", "meaning": "1. Yansıtmak.", "full_meaning": "1. Yansıtmak.\n2. Düşünmek, derinlemesine düşünmek.\n3. İfade etmek, göstermek.", "guide": "Işığın, sesin veya bir görüntünün bir yüzeyden geri dönmesi veya bir şey üzerine dikkatlice düşünmek.", "examples": "1. \"The water reflected the moonlight.\" (Su ay ışığını yansıttı.)\n2. \"I need time to reflect on your proposal.\" (Teklifiniz üzerine düşünmek için zamana ihtiyacım var.)\n3. \"His actions reflect his true character.\" (Onun hareketleri gerçek karakterini yansıtıyor.)", "rank": 785}, {"word": "worth", "type": "Sıfat, İsim", "meaning": "1. Değerinde, ... değerinde (sıfat)", "full_meaning": "1. Değerinde, ... değerinde (sıfat)\n2. Değer, kıymet (isim)", "guide": "Belirli bir parasal değere sahip olan. Mecazi olarak, bir çaba veya riske değer olan anlamında kullanılır.", "examples": "1. This house is worth a lot of money. (Bu ev çok para eder.)\n2. The movie is definitely worth seeing. (Film kesinlikle görülmeye değer.)\n3. He proved his worth to the team. (Takıma olan değerini kanıtladı.)", "rank": 786}, {"word": "station", "type": "İsim / Fiil", "meaning": "1. (İ) İstasyon, durak.", "full_meaning": "1. (İ) İstasyon, durak.\n2. (İ) İstasyon, merkez (polis/radyo).\n3. (F) Konuşlandırmak.", "guide": "Tren, otobüs vb. taşıtların durduğu yer veya belirli bir hizmet merkezi.", "examples": "1. I'll meet you at the train station. (Seninle tren istasyonunda buluşacağım.)\n2. Turn to the news station. (Haber istasyonuna/kanalına dön.)\n3. Soldiers were stationed abroad. (Askerler yurt dışına konuşlandırıldı.)", "rank": 787}, {"word": "discover", "type": "Fiil", "meaning": "1. Keşfetmek, bulmak.", "full_meaning": "1. Keşfetmek, bulmak.\n2. Fark etmek, öğrenmek.\n3. (Yeteneği) Ortaya çıkarmak.", "guide": "Daha önce bilinmeyen bir şeyi ilk kez bulmak veya fark etmek. Yeni bir bilgi edinmek.", "examples": "1. Columbus discovered America in 1492. (Columbus Amerika'yı 1492'de keşfetti.)\n2. I discovered that I had left my keys at home. (Anahtarlarımı evde unuttuğumu fark ettim.)\n3. She was discovered by a talent agent. (Bir yetenek ajanı tarafından keşfedildi.)", "rank": 788}, {"word": "basis", "type": "İsim", "meaning": "1. Temel, dayanak, esas.", "full_meaning": "1. Temel, dayanak, esas.\n2. (on a ... basis) esasına göre.", "guide": "Bir şeyin üzerine kurulduğu ilke, neden veya sistem.", "examples": "1. Trust is the basis of a good relationship. (Güven, iyi bir ilişkinin temelidir.)\n2. We're paid on a weekly basis. (Haftalık esasına göre ödeme alıyoruz.)", "rank": 789}, {"word": "despite", "type": "Edat", "meaning": "1. Rağmen, karşın.", "full_meaning": "1. Rağmen, karşın.\n2. -e aldırmaksızın.", "guide": "Bir engel veya zıt durum olmasına rağmen, bir şeyin doğru olduğunu göstermek için kullanılır. Ardından isim veya fiil-ing gelir.", "examples": "1. We went out despite the rain. (Yağmura rağmen dışarı çıktık.)\n2. Despite feeling tired, she finished the race. (Yorgun hissetmesine rağmen yarışı bitirdi.)", "rank": 790}, {"word": "news", "type": "İsim (tekil)", "meaning": "1. Haber, haberler.", "full_meaning": "1. Haber, haberler.\n2. Yeni bilgi, gelişme.\n3. (the news) Haber bülteni.", "guide": "Yeni veya güncel olaylarla ilgili bilgi. Her zaman tekil fiil alır.", "examples": "1. Have you heard the news? (Haberi duydun mu?)\n2. Any news from your brother? (Kardeşinden bir haber var mı?)\n3. I watch the news every evening. (Her akşam haberleri izlerim.)", "rank": 791}, {"word": "nice", "type": "Sıfat", "meaning": "1. İyi, hoş, güzel.", "full_meaning": "1. İyi, hoş, güzel.\n2. Kibar, nazik.\n3. İnce, nüanslı (nice distinction).", "guide": "Genel beğeni veya onay ifade eden bir sıfat. Çok yaygın ve geniş kullanımlıdır.", "examples": "1. We had a nice time at the party. (Partide hoş vakit geçirdik.)\n2. It was very nice of you to help. (Yardım etmeniz çok kibardı.)\n3. management. (Yönetim üzerinde çok etkisi var.)", "rank": 800}, {"word": "behaviour", "type": "İsim", "meaning": "1. Davranış, tavır, hareket tarzı.", "full_meaning": "1. Davranış, tavır, hareket tarzı.\n2. (Hayvan) davranışları.", "guide": "Bir kişinin veya hayvanın hareket tarzı, tutumu.", "examples": "1. His behaviour was unacceptable. (Onun davranışı kabul edilemezdi.)\n2. animal behaviour (hayvan davranışı)", "rank": 801}, {"word": "drop", "type": "Fiil/İsim", "meaning": "1. Düşürmek, bırakmak (fiil).", "full_meaning": "1. Düşürmek, bırakmak (fiil).\n2. Damla (isim).\n3. Küçük miktar (isim).", "guide": "Bir şeyi, özellikle yanlışlıkla, düşürmek. Küçük yuvarlak sıvı parçası. Çok az miktar (a drop in the ocean).", "examples": "1. Be careful not to drop the glass. (Bardağı düşürmemeye dikkat et.)\n2. A drop of rain fell on my head. (Başıma bir damla yağmur düştü.)\n3. There's not a drop of milk left. (Bir damla süt kalmadı.)", "rank": 802}, {"word": "ready", "type": "Sıfat", "meaning": "1. Hazır.", "full_meaning": "1. Hazır.\n2. İstekli, hazır olan.\n3. Çabuk, hemen.", "guide": "Bir şeyi yapmak veya bir şeyin olması için tamamen uygun, hazır durumda olmak.", "examples": "1. \"Dinner is ready.\" (Akşam yemeği hazır.)\n2. \"I'm ready to help.\" (Yardım etmeye hazırım.)\n3. \"She has a ready answer for everything.\" (Her şeye hazır bir cevabı var.)", "rank": 803}, {"word": "december", "type": "İsim", "meaning": "1. Aralık ayı.", "full_meaning": "1. Aralık ayı.", "guide": "Gregoryen takviminin on ikinci ve son ayı.", "examples": "1. My birthday is in December. (Doğum günüm Aralık ayında.)\n2. December is usually cold here. (Aralık ayı burada genellikle soğuk olur.)", "rank": 804}, {"word": "beauty", "type": "İsim", "meaning": "1. Güzellik.", "full_meaning": "1. Güzellik.\n2. Güzel şey/kişi.\n3. Güzellik ürünü.", "guide": "Güzel olma niteliği veya güzel olan şeyin kendisi.", "examples": "1. We admired the beauty of the landscape. (Manzaranın güzelliğine hayran kaldık.)\ e from her job. (İşinden düzenli bir geliri var.)\n2. They live on a low income. (Düşük bir gelirle geçiniyorlar.)", "rank": 809}, {"word": "potential", "type": "Sıfat/İsim", "meaning": "1. (Sıfat) Potansiyel, olası.", "full_meaning": "1. (Sıfat) Potansiyel, olası.\n2. (İsim) Potansiyel, gizli güç/kapasite.", "guide": "Henüz gerçekleşmemiş ama mümkün olan. Bir şeyin veya kişinin gelecekteki başarı veya gelişme kapasitesi.", "examples": "1. (Sıfat) He is a potential candidate for the job. (O, iş için potansiyel bir aday.)\n2. (İsim) The young athlete has great potential. (Genç sporcunun büyük bir potansiyeli var.)", "rank": 810}, {"word": "access", "type": "İsim/Fiil", "meaning": "1. Erişim, giriş (isim).", "full_meaning": "1. Erişim, giriş (isim).\n2. (Bilgisayar) erişmek, açmak (fiil).\n3. (Bir yere) ulaşım imkanı.", "guide": "Bir yere girebilme, bir şeyi kullanabilme veya elde edebilme imkanı veya hakkı.", "examples": "1. The building has wheelchair access. (Binada tekerlekli sandalye erişimi var.)\n2. Can you access the file on the server? (Sunucudaki dosyaya erişebilir misin?)\n3. The house has easy access to the motorway. (Evin otoyola kolay ulaşımı var.)", "rank": 811}, {"word": "relative", "type": "İsim / Sıfat", "meaning": "1. (İsim) Akraba.", "full_meaning": "1. (İsim) Akraba.\n2. (Sıfat) Göreceli, nispi.\n3. (Sıfat) İlgili, ait.", "guide": "Aile bağı olan kişi veya başka bir şeyle karşılaştırıldığında var olan, mutlak olmayan.", "examples": "1. \"We're visiting relatives this weekend.\" (Bu hafta sonu akrabaları ziyaret ediyoruz.)\n2. \"The concept of beauty is relative.\" (Güzellik kavramı görecelidir.)\n3. \"Please keep your comments relative to the topic.\" (Lütfen yorumlarınızı konuyla ilgili tutun.)", "rank": 812}, {"word": "september", "type": "İsim", "meaning": "2025-09-01 00:00:00", "full_meaning": "2025-09-01 00:00:00", "guide": "Yılın dokuzuncu ayı, Ağustos'tan sonra ve Ekim'den önce gelir.", "examples": "1. School starts in September. (Okul Eylü ring aids are getting smaller. (İşitme cihazları küçülüyor.)", "rank": 817}, {"word": "choice", "type": "İsim/Sıfat", "meaning": "1. Seçim, seçenek (isim).", "full_meaning": "1. Seçim, seçenek (isim).\n2. Seçme hakkı (isim).\n3. Seçkin, kaliteli (sıfat).", "guide": "Seçme eylemi veya seçilebilecek şeyler. Sıfat olarak en iyi kalitede.", "examples": "1. You have a choice between tea and coffee. (Çay ve kahve arasında bir seçimin var.)\n2. It's your choice. (Bu senin seçimin.)\n3. choice cuts of meat (seçilmiş, kaliteli et parçaları)", "rank": 818}, {"word": "investigate", "type": "Fiil", "meaning": "1. Araştırmak, incelemek.", "full_meaning": "1. Araştırmak, incelemek.\n2. Soruşturmak.\n3. (Bilimsel) İncelemek.", "guide": "Bir konuyu veya olayı detaylı bir şekilde incelemek. Bir suç veya şüpheli durumu soruşturmak.", "examples": "1. Scientists are investigating the causes of climate change. (Bilim insanları iklim değişikliğinin nedenlerini araştırıyor.)\n2. The police will investigate the robbery. (Polis soygunu soruşturacak.)\n3. We need to investigate all possibilities. (Tüm olasılıkları araştırmalıyız.)", "rank": 819}, {"word": "tour", "type": "İsim / Fiil", "meaning": "İsim: 1. Tur, gezi.", "full_meaning": "İsim: 1. Tur, gezi.\n2. (Spor) Tur, turnuva.\nFiil: 3. Gezmek, turlamak.", "guide": "Bir yerleri görme amaçlı gezi veya bir sanatçının konser gezisi.", "examples": "1. We went on a guided tour of the museum. (Müzenin rehberli bir turuna çıktık.)\n2. The band is on a world tour. (Grup dünya turnesinde.)\n3. We toured Italy last summer. (Geçen yaz İtalya'yı gezdik.)", "rank": 820}, {"word": "attention", "type": "İsim", "meaning": "1. Dikkat.", "full_meaning": "1. Dikkat.\n2. İlgi, alaka.\n3. (Askeri) hazır ol.", "guide": "Zihinsel odaklanma veya birine gösterilen ilgi.", "examples": "1. Pay attention to what I'm saying. (Söylediklerime dikkat et.)\n2. Her loud voice drew everyone's attention. (Yüksek sesi herkesin dikkatini çekti.)\n3. The soldier stood at attention. (Asker hazır olda durdu.)", "rank": 821}, {"word": "alone", "type": "Sıfat/Zarf", "meaning": "1. Yalnız, tek başına (sıfat).", "full_meaning": "1. Yalnız, tek başına (sıfat).\n2. Sadece, yalnızca (zarf).\n3. Kendi halinde, rahatsız edilmemiş.", "guide": "Başka kimse veya hiçbir şey olmadan. Vurgu için \"sadece\" anlamında da kullanılır.", "examples": "1. She lives alone. (Yalnız yaşıyor.)\n2. The price alone is reason enough to buy it. (Sadece fiyatı bile satın almak için yeterli bir sebep.)\n3. Leave me alone! (Beni rahat bırak!)", "rank": 822}, {"word": "season", "type": "İsim / Fiil", "meaning": "1. (İ) Mevsim.", "full_meaning": "1. (İ) Mevsim.\n2. (İ) Sezon, dönem.\n3. (F) Baharatlamak, tatlandırmak.", "guide": "Yılın dört bölümünden biri (ilkbahar, yaz, sonbahar, kış) veya bir aktivitenin yapıldığı dönem.", "examples": "1. Autumn is my favorite season. (Sonbahar benim en sevdiğim mevsim.)\n2. The football season starts soon. (Futbol sezonu yakında başlıyor.)\n3. Season the meat with salt and pepper. (Eti tuz ve biberle baharatla.)", "rank": 823}, {"word": "cell", "type": "İsim", "meaning": "1. Hücre (biyolojik).", "full_meaning": "1. Hücre (biyolojik).\n2. Hücre (cezaevi).\n3. (Telefon) pil, cep telefonu.", "guide": "Canlının temel yapı taşı veya küçük, kapalı oda.", "examples": "1. All living things are made of cells. (Tüm canlılar hücrelerden oluşur.)\n2. The prisoner was put in a cell. (Mahkum bir hücreye konuldu.)\n3. My cell phone is dead. (Cep telefonumun şarjı bitti.)", "rank": 824}, {"word": "trust", "type": "İsim / Fiil", "meaning": "İsim: 1. Güven.", "full_meaning": "İsim: 1. Güven.\n2. (Hukuk) Vakıf, tröst.\nFiil: 3. Güvenmek, itimat etmek.\n4. Emanet etmek.", "guide": "Birinin dürüstlüğüne veya bir şeyin güvenilirliğine inanmak.", "examples": "1. You have to earn my trust. (Güvenimi kazanman gerek.)\n2. I trust you to do the right thing. (Doğru olanı yapacağına güveniyorum.)\n3. Can I trust you with a secret? (Sana bir sır emanet edebilir miyim?)", "rank": 825}, {"word": "review", "type": "İsim / Fiil", "meaning": "1. (İsim) İnceleme, eleştiri yazısı.", "full_meaning": "1. (İsim) İnceleme, eleştiri yazısı.\n2. (Fiil) Gözden geçirmek, yeniden değerlendirmek.\n3. (Fiil) İncelemek, eleştirmek (kitap/film).", "guide": "Dikkatli bir şekilde yeniden bakmak, değerlendirmek veya bu değerlendirmenin yazılı hali.", "examples": "1. \"The movie got good reviews.\" (Film iyi eleştiriler aldı.)\n2. \"Let's review what we've learned.\" (Öğrendiklerimizi gözden geçirelim.)\n3. \"She reviews books for a newspaper.\" (Bir gazete için kitap eleştirileri yazıyor.)", "rank": 826}, {"word": "resource", "type": "İsim", "meaning": "1. Kaynak.", "full_meaning": "1. Kaynak.\n2. Beceri, yetenek.\n3. Çare, yol.", "guide": "Bir şeyi yapmak veya üretmek için kullanılan doğal veya insani varlık.", "examples": "1. \"The country is rich in natural resources.\" (Ülke doğal kaynaklar bakımından zengindir.)\n2. \"Time is our most valuable resource.\" (Zaman bizim en değerli kaynağımızdır.)\n3. \"She is a person of great resource.\" (O, büyük becerilere sahip bir insandır.)", "rank": 827}, {"word": "hotel", "type": "İsim", "meaning": "1. Otel.", "full_meaning": "1. Otel.", "guide": "Konaklama hizmeti veren ticari bina.", "examples": "1. We booked a room at a beach hotel. (Bir plaj otelinde oda ayırttık.)", "rank": 828}, {"word": "effort", "type": "İsim", "meaning": "1. Çaba, gayret.", "full_meaning": "1. Çaba, gayret.\n2. Girişim, teşebbüs.\n3. (make an effort) Çaba göstermek.", "guide": "Bir şeyi başarmak için gösterilen fiziksel veya zihinsel enerji. Yapılan bir deneme.", "examples": "1. It takes a lot of effort to learn a language. (Bir dil öğrenmek çok çaba gerektirir.)\n2. His first effort was unsuccessful. (İlk girişimi başarısız oldu.)\n3. Please make an effort to be on time. (Lütfen zamanında olmak için çaba gösterin.)", "rank": 829}, {"word": "male", "type": "Sıfat / İsim", "meaning": "1. Erkek (cinsiyet).", "full_meaning": "1. Erkek (cinsiyet).\n2. (Biyolojide) eril, erkek.\n3. (Teknik bağlamda) erkek priz/parça.", "guide": "Canlıların cinsiyetini belirtmek için kullanılır. Teknik bağlamda dişi (female) parçayla birleşen tarafı tanımlar.", "examples": "1. The male lion has a large mane. (Erkek aslanın büyük bir yelesi vardır.)\n2. The study included both male and female participants. (Çalışmaya hem erkek hem kadın katılımcılar dahil edildi.)\n3. Plug the male connector into the female port. (Erkek konnektörü dişi porta takın.)", "rank": 830}, {"word": "regular", "type": "Sıfat", "meaning": "1. Düzenli, muntazam.", "full_meaning": "1. Düzenli, muntazam.\n2. Normal, olağan.\n3. Sürekli gelen, daimi müşteri.", "guide": "Belli aralıklarla tekrarlanan, standart veya alışılagelmiş olan.", "examples": "1. \"He makes regular visits to his grandmother.\" (Büyükannesini düzenli olarak ziyaret eder.)\n2. \"What's the regular procedure for this?\" (Bunun için normal prosedür nedir?)\n3. \"He's a regular at this café.\" (O, bu kafenin daimi müşterisi.)", "rank": 831}, {"word": "wood", "type": "İsim", "meaning": "1. Odun, kereste", "full_meaning": "1. Odun, kereste\n2. Orman, koru (çoğul)", "guide": "Ağaç gövdesinin sert malzemesi. Çoğul hali (woods), küçük bir orman veya ağaçlık alan anlamına gelir.", "examples": "1. The table is made of solid wood. (Masa katı odun/ahşaptan yapılmıştır.)\n2. We went for a walk in the woods. (Ormanda/ağaçlıkta yürüyüşe gittik.)\n3. Put some more wood on the fire. (Ateşe biraz daha odun koy.)", "rank": 832}, {"word": "concentrate", "type": "Fiil/İsim", "meaning": "1. Konsantre olmak, yoğunlaşmak (fiil).", "full_meaning": "1. Konsantre olmak, yoğunlaşmak (fiil).\n2. Toplamak, bir yere yığmak (fiil).\n3. Konsantre, yoğunlaştırılmış şey (isim).", "guide": "Dikkatini bir şey üzerinde toplamak veya bir şeyi belirli bir alanda biriktirmek.", "examples": "1. Concentrate on your work! (İşine konsantre ol!)\n2. Power is concentrated in the hands of a few. (Güç birkaç kişinin elinde toplanmış.)\n3. orange juice concentrate (portakal suyu konsantresi)", "rank": 833}, {"word": "connect", "type": "Fiil", "meaning": "1. Bağlamak, birleştirmek.", "full_meaning": "1. Bağlamak, birleştirmek.\n2. (Telefon) bağlamak.\n3. İlişkilendirmek.", "guide": "İki şeyi fiziksel veya soyut olarak birbirine bağlamak.", "examples": "1. Connect the printer to the computer. (Yazıcıyı bilgisayara bağlayın.)\n2. I was connected to the wrong department. (Yanlış departmana bağlandım.)\n3. The two events are connected. (İki olay birbiriyle bağlantılı.)", "rank": 834}, {"word": "combine", "type": "Fiil", "meaning": "1. Birleştirmek, kombine etmek.", "full_meaning": "1. Birleştirmek, kombine etmek.\n2. Karıştırmak.\n3. (Combine with) -le birleşmek.", "guide": "İki veya daha fazla şeyi bir araya getirerek tek bir şey oluşturmak.", "examples": "1. Combine the eggs and flour. (Yumurtaları ve unu karıştırın.)\n2. The two companies combined to form a larger one. (İki şirket birleşerek daha büyük bir şirket oluşturdu.)\n3. work combined with pleasure (iş ile zevkin birleşimi)", "rank": 835}, {"word": "cold", "type": "Sıfat/İsim", "meaning": "1. Soğuk (sıfat).", "full_meaning": "1. Soğuk (sıfat).\n2. Soğuk algınlığı (isim).\n3. Duygusuz, soğuk (sıfat).", "guide": "Düşük sıcaklığa sahip olan. İsim olarak nezle.", "examples": "1. It's very cold today. (Bugün hava çok soğuk.)\n2. I've caught a cold. (Soğuk algınlığına yakalandım.)\n3. a cold response (soğuk bir tepki)", "rank": 836}, {"word": "touch", "type": "Fiil / İsim", "meaning": "Fiil: 1. Dokunmak.", "full_meaning": "Fiil: 1. Dokunmak.\n2. Duygulandırmak, etkilemek.\nİsim: 3. Dokunma, temas.\n4. İnce ayar, nüans.\n5. Az miktar.", "guide": "Fiziksel temas veya duygusal bir etki. 'A touch of' ifadesi az miktar anlamına gelir.", "examples": "1. Don't touch the hot stove! (Sıcak sobanın dokunma!)\n2. His kindness touched my heart. (Nezaketi kalbime dokundu/duygulandırdı.)\n3. Add a touch of salt. (Bir tutam/azıcık tuz ekleyin.)", "rank": 837}, {"word": "listen", "type": "Fiil", "meaning": "1. Dinlemek, kulak vermek.", "full_meaning": "1. Dinlemek, kulak vermek.\n2. Söyleneni yapmak, kulak asmak.\n3. (Radyo) Dinlemek.", "guide": "Dikkatle ses veya söz işitmeye çalışmak, duymak için çaba göstermek.", "examples": "1. Listen carefully to the instructions. (Talimatları dikkatlice dinleyin.)\n2. I told him to be careful, but he never listens. (Ona dikkatli olmasını söyledim ama o asla dinlemez.)\n3. I like to listen to music while I work. (Çalışırken müzik dinlemeyi severim.)", "rank": 838}, {"word": "release", "type": "Fiil / İsim", "meaning": "1. (Fiil) Serbest bırakmak, salıvermek.", "full_meaning": "1. (Fiil) Serbest bırakmak, salıvermek.\n2. (Fiil) Yayımlamak, piyasaya sürmek.\n3. (İsim) Serbest bırakma, çıkış (film/albüm).", "guide": "Tutulan bir şeyi serbest bırakmak veya halka sunmak.", "examples": "1. \"The hostages were finally released.\" (Rehineler nihayet serbest bırakıldı.)\n2. \"The band will release a new album soon.\" (Grup yakında yeni bir albüm yayımlayacak.)\n3. \"The movie's release date is in June.\" (Filmin çıkış tarihi Haziran'da.)", "rank": 839}, {"word": "balance", "type": "İsim/Fiil", "meaning": "1. Denge (isim/fiil).", "full_meaning": "1. Denge (isim/fiil).\n2. Bakiye, kalan miktar (isim).\n3. Dengelemek (fiil).", "guide": "Fiziksel denge veya farklı unsurların eşit/uyumlu olması. Ayrıca banka hesap bakiyesi.", "examples": "1. She lost her balance and fell. (Dengesini kaybetti ve düştü.)\n2. My bank balance is low. (Banka bakiyem düşük.)\n3. It's hard to balance work and family life. (İş ve aile hayatını dengelemek zordur.)", "rank": 840}, {"word": "lack", "type": "İsim / Fiil", "meaning": "1. Eksiklik, yokluk.", "full_meaning": "1. Eksiklik, yokluk.\n2. Olmamak, bulunmamak.", "guide": "Gereken veya istenen bir şeyin olmaması durumu. Fiil olarak sahip olmamak.", "examples": "1. The project failed due to a lack of funding. (Proje, fon eksikliği yüzünden başarısız oldu.)\n2. He lacks confidence when speaking in public. (Topluluk önünde konuşurken özgüveni yok.)\n3. There is no lack of talent in this team. (Bu takımda yetenek eksikliği yok.)", "rank": 841}, {"word": "check", "type": "Fiil/İsim", "meaning": "1. Kontrol etmek (fiil).", "full_meaning": "1. Kontrol etmek (fiil).\n2. Çek (bank) (isim).\n3. (US) kareli desen (isim).", "guide": "Doğrulamak veya incelemek. Amerikan İngilizcesinde banka çeki veya desen anlamı vardır.", "examples": "1. Check the oil level. (Yağ seviyesini kontrol et.)\n2. Can I pay by check? (Çekle ödeyebilir miyim?)\n3. a check shirt (kareli bir gömlek)", "rank": 842}, {"word": "chief", "type": "İsim/Sıfat", "meaning": "1. Şef, reis, baş (isim).", "full_meaning": "1. Şef, reis, baş (isim).\n2. Baş, ana, esas (sıfat).\n3. (Kabile) reisi.", "guide": "Bir organizasyondaki en yüksek rütbeli kişi veya en önemli unsur.", "examples": "1. She is the chief of police. (Polis şefidir.)\n2. The chief reason for my decision is cost. (Kararımın başlıca nedeni maliyettir.)\n3. a chief engineer (bir baş mühendis)", "rank": 843}, {"word": "imagine", "type": "Fiil", "meaning": "1. Hayal etmek, düşlemek.", "full_meaning": "1. Hayal etmek, düşlemek.\n2. Sanmak, zannetmek, tahmin etmek.\n3. Farz etmek, varsaymak.", "guide": "Zihinde bir resim veya fikir oluşturmak. Bir şeyin doğru olduğunu düşünmek.", "examples": "1. Can you imagine living on Mars? (Mars'ta yaşamayı hayal edebiliyor musun?)\n2. I imagine she'll be here soon. (Sanırım birazdan burada olur.)\n3. Imagine that you won the lottery. (Piyangoyu kazandığını varsay.)", "rank": 844}, {"word": "partner", "type": "İsim", "meaning": "1. Eş, hayat arkadaşı.", "full_meaning": "1. Eş, hayat arkadaşı.\n2. Ortak, iş ortağı.\n3. Partner (dans, spor).", "guide": "Bir ilişki, evlilik veya iş bağlamında diğer kişi. Dans veya oyunlarda beraber olunan kişi.", "examples": "1. My partner and I have been together for ten years. (Eşimle ben on yıldır birlikteyiz.)\n2. He's a partner in a law firm. (Bir avukatlık firmasında ortak.)\n3. Choose a partner for the next exercise. (Sonraki egzersiz için bir partner seçin.)", "rank": 845}, {"word": "dead", "type": "Sıfat", "meaning": "1. Ölü, cansız.", "full_meaning": "1. Ölü, cansız.\n2. İşlemeyen, çalışmayan.\n3. Tamamen, kesinlikle (argo, vurgu için).", "guide": "Yaşam belirtisi göstermeyen. Ayrıca aktif olmayan, bitmiş, tükenmiş şeyler için mecazi olarak kullanılır.", "examples": "1. Unfortunately, the plant is dead. (Ne yazık ki bitki ölmüş.)\n2. The batteries are dead. (Piller bitti.)\n3. You're dead right about that. (Bu konuda kesinlikle/tamamen haklısın.)", "rank": 846}, {"word": "seat", "type": "İsim / Fiil", "meaning": "1. (İ) Koltuk, oturak.", "full_meaning": "1. (İ) Koltuk, oturak.\n2. (İ) Yer, koltuk (mecliste).\n3. (F) Oturtmak.", "guide": "Oturmak için kullanılan mobilya parçası veya resmi bir pozisyon. Fiil olarak oturtmak, yerleştirmek.", "examples": "1. Please take a seat. (Lütfen bir koltuk alın/oturun.)\n2. She won a seat in parliament. (Parlamentoda bir koltuk/yer kazandı.)\n3. The hall can seat 500 people. (Salon 500 kişiyi oturtabilir.)", "rank": 847}, {"word": "communicate", "type": "Fiil", "meaning": "1. İletişim kurmak.", "full_meaning": "1. İletişim kurmak.\n2. Bildirmek, iletmek.\n3. (Hastalık) bulaştırmak.", "guide": "Bilgi, düşünce veya duyguları birinden diğerine aktarmak.", "examples": "1. We need to communicate better. (Daha iyi iletişim kurmamız gerekiyor.)\n2. He finds it hard to communicate his feelings. (Duygularını ifade etmekte zorlanıyor.)\n3. The disease is easily communicated. (Hastalık kolayca bulaşır.)", "rank": 848}, {"word": "brother", "type": "İsim", "meaning": "1. Erkek kardeş.", "full_meaning": "1. Erkek kardeş.\n2. Yoldaş, dost (din/kardeşlik).\n3. Rahip (bazı tarikatlarda).", "guide": "Aynı ebeveynleri paylaşan erkek çocuk. Mecazi anlamda yakın dost.", "examples": "1. My brother is older than me. (Erkek kardeşim benden büyük.)\n2. Brother John is a monk. (Kard
