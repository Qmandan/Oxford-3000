<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>İngilizce Öğren • 28 Ders, Kelime, Phrasal, Çeviri</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,800&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#fff8ec;--sf:#fff;--sf2:#fff1d6;--ink:#2a2350;--ink2:#5d5785;--ink3:#8f89ad;--bd:#f0e2c4;--acx:#fff;--yel:#ffe9a8;--ok:#14804f;--okb:#dcf7e8;--bad:#d6336c;--badb:#ffe8f0;--sh:0 12px 34px rgba(90,60,170,.18);--a:#7c5cff}
:root[data-theme=dark]{--bg:#1d1840;--sf:#2a2460;--sf2:#352e78;--ink:#fff7e6;--ink2:#d4cdf5;--ink3:#a39bd6;--bd:#43398f;--acx:#1d1840;--yel:#6b5a14;--ok:#7ee2a8;--okb:#1d4a37;--bad:#ff8fb3;--badb:#5a2447;--sh:0 12px 34px rgba(0,0,0,.45)}
html[data-sec=ana]{--a:#7c5cff}html[data-sec=dersler]{--a:#2f7bff}html[data-sec=kelimeler]{--a:#ff8a1f}html[data-sec=phrasal]{--a:#12a971}html[data-sec=ceviri]{--a:#ff4f8b}html[data-sec=pratik]{--a:#00a8c6}
*{box-sizing:border-box}html{color-scheme:light}html[data-theme=dark]{color-scheme:dark}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 "Plus Jakarta Sans",system-ui,sans-serif;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
h1,h2,h3,.fr{font-family:Fraunces,Georgia,serif;margin:0}button,input,textarea{font:inherit;color:inherit}button{cursor:pointer}
header{position:sticky;top:env(safe-area-inset-top,0);z-index:20;background:color-mix(in srgb,var(--bg) 90%,transparent);backdrop-filter:blur(14px);border-bottom:1px solid var(--bd)}
.hw{max-width:1100px;margin:auto;padding:10px 16px;display:flex;align-items:center;gap:10px}
.logo{width:36px;height:36px;border-radius:12px;background:var(--ac);color:var(--acx);display:grid;place-items:center;font:800 16px Fraunces,serif}
.ttl{flex:1;min-width:0}.ttl b{display:block;font:800 17px Fraunces,serif;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.ttl small{color:var(--ink3);font-size:11px}
.btn{border:1px solid var(--bd);background:var(--sf);border-radius:999px;padding:8px 14px;font-weight:600;font-size:13px;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.btn:hover{border-color:var(--ink)}.btn.pri{background:var(--ac);color:var(--acx);border-color:var(--ac)}.btn.sm{padding:5px 11px;font-size:12px}.btn.ico{padding:8px 11px}
.btn:focus-visible,input:focus-visible,.card:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.nav{max-width:1100px;margin:auto;display:flex;gap:6px;overflow-x:auto;padding:0 16px 10px;scrollbar-width:none}.nav::-webkit-scrollbar{display:none}.nav .btn{flex:0 0 auto}.nav .btn.on{background:var(--ac);color:var(--acx);border-color:var(--ac)}.nav .btn small{opacity:.65;font-weight:600}
main{max-width:1100px;margin:auto;padding:16px 16px 110px}
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:14px}.bar h2{font-size:22px;margin-right:auto}.cnt{color:var(--ink3);font-size:12px}
input[type=search],input[type=text],textarea{background:var(--sf);border:1px solid var(--bd);border-radius:14px;padding:10px 14px;width:100%;outline:none}input:focus,textarea:focus{border-color:var(--ink)}
.bar input[type=search]{width:220px;max-width:100%}
.grid{display:grid;gap:10px;grid-template-columns:repeat(auto-fill,minmax(250px,1fr))}
.card{text-align:left;background:var(--sf);border:1px solid var(--bd);border-radius:16px;padding:14px;display:block;width:100%}.card:hover{border-color:var(--ink)}
.card.mine{background:var(--yel)}.row{display:flex;gap:8px;align-items:center}.sp{margin-left:auto}.wrap{flex-wrap:wrap}
.tag{font-size:10px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;border:1px solid var(--bd);background:var(--sf2);border-radius:999px;padding:2px 8px;white-space:nowrap}
.card .w{font:700 17px Fraunces,serif}.card p{margin:6px 0 0;color:var(--ink2);font-size:13px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.lv{margin:22px 0 10px}.lv h2{font-size:22px}.lv p{margin:2px 0 0;color:var(--ink2);font-size:13px}
.ok{color:var(--ok);font-weight:700}
.big{background:var(--sf);border:1px solid var(--bd);border-radius:22px;padding:22px;max-width:720px;margin:0 auto}
.q{font:600 24px/1.25 Fraunces,serif;margin:10px 0}.res{margin-top:12px;padding:12px;border-radius:14px;background:var(--yel)}.res.good{background:var(--okb);color:var(--ok)}
.pb{height:6px;border-radius:9px;background:var(--sf2);overflow:hidden}.pb i{display:block;height:100%;background:var(--ac)}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:8px}.stat{background:var(--sf2);border-radius:14px;padding:12px}.stat b{font:800 24px Fraunces,serif;display:block}.stat span{font-size:11px;color:var(--ink3)}
.fab{position:fixed;right:max(16px,env(safe-area-inset-right));bottom:max(16px,env(safe-area-inset-bottom));z-index:15;box-shadow:var(--sh);padding:12px 18px}
.ov{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.45);backdrop-filter:blur(3px);display:grid;place-items:center;padding:14px}
.win{background:var(--bg);border:1px solid var(--bd);border-radius:22px;width:min(640px,100%);max-height:calc(100dvh - 28px);display:flex;flex-direction:column;box-shadow:var(--sh);animation:pop .16s ease-out}
.win.lg{width:min(780px,100%)}.wh{display:flex;align-items:center;gap:10px;padding:14px 18px;border-bottom:1px solid var(--bd)}.wh h3{flex:1;font-size:20px}.wb{padding:16px 18px 20px;overflow:auto}
.x{width:34px;height:34px;border-radius:50%;border:1px solid var(--bd);background:var(--sf)}
.sec{margin-top:14px}.sec>b{display:block;font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink3);margin-bottom:4px}
.box{background:var(--sf);border:1px solid var(--bd);border-radius:14px;padding:12px}pre{margin:0;white-space:pre-wrap;font:inherit;word-break:break-word}
.trap{background:var(--badb);border:1px solid color-mix(in srgb,var(--bad) 35%,transparent);border-radius:14px;padding:12px}.wr{text-decoration:line-through;color:var(--bad)}
.pop-b{position:fixed;inset:0;z-index:60}.pop{position:fixed;z-index:61;background:var(--sf);border:1px solid var(--bd);border-radius:16px;box-shadow:var(--sh);padding:6px;min-width:220px;max-width:min(340px,calc(100vw - 20px));max-height:70dvh;overflow:auto;animation:pop .12s ease-out}
.pop button{display:flex;width:100%;align-items:center;gap:10px;text-align:left;background:none;border:0;border-radius:10px;padding:10px 12px}.pop button:hover,.pop button:focus-visible{background:var(--sf2);outline:0}
.pop button.on{font-weight:700}.pop button.on:after{content:"✓";margin-left:auto}.pop small{color:var(--ink3);margin-left:auto}.pop hr{border:0;border-top:1px solid var(--bd);margin:4px 6px}
@media(max-width:600px){.pop-b{background:rgba(0,0,0,.4)}.pop{left:8px!important;right:8px;top:auto!important;bottom:calc(8px + env(safe-area-inset-bottom));max-width:none;border-radius:20px;animation:up .18s ease-out}.ttl small{display:none}.ov{align-items:end;padding:0}.win{border-radius:22px 22px 0 0;max-height:92dvh}}
@keyframes pop{from{opacity:0;transform:scale(.97)}}@keyframes up{from{transform:translateY(30px);opacity:0}}
.tabs{display:flex;gap:6px;margin-bottom:12px}.tabs .btn.on{background:var(--ac);color:var(--acx)}
.toast{position:fixed;left:50%;bottom:78px;transform:translateX(-50%);background:var(--ac);color:var(--acx);padding:9px 16px;border-radius:999px;font-size:13px;z-index:70}
.flip{min-height:150px;display:grid;place-items:center;text-align:center;cursor:pointer;user-select:none}
.say{background:var(--yel);border-color:transparent}.k{display:block;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink2);margin-bottom:2px}
.st{margin:6px 0 0;padding-left:22px}.st li{margin:6px 0}.btn[disabled]{opacity:.4;pointer-events:none}
kbd{border:1px solid var(--bd);border-bottom-width:2px;border-radius:6px;padding:0 6px;font-size:12px;background:var(--sf2)}

body{background:radial-gradient(circle at 100% 0,color-mix(in srgb,var(--a) 16%,transparent),transparent 45%),radial-gradient(circle at 0 60%,color-mix(in srgb,var(--a) 8%,transparent),transparent 40%),var(--bg);background-attachment:fixed}
header{background:var(--sf);border-bottom:0;box-shadow:0 2px 0 var(--bd)}header:before{content:"";display:block;height:5px;background:linear-gradient(90deg,#7c5cff,#2f7bff,#12a971,#ffc233,#ff8a1f,#ff4f8b)}
.logo{background:linear-gradient(135deg,#7c5cff,#ff4f8b);color:#fff;font-size:22px}
.btn{border-width:2px}.btn:hover{border-color:var(--a)}.btn.pri{background:var(--a);border-color:var(--a);color:#fff}.btn:focus-visible,input:focus-visible,.card:focus-visible{outline-color:var(--a)}
.nav .btn{padding:9px 15px;font-size:14px;--a:#7c5cff}.nav .btn:hover{border-color:var(--a)}.nav .btn.on{background:var(--a);border-color:var(--a);color:#fff}
.tabs .btn.on{background:var(--a);border-color:var(--a);color:#fff}.pb i{background:var(--a)}.pb{height:8px}
.card{border-width:2px;border-top:5px solid var(--c,var(--a));border-radius:18px;transition:transform .12s,box-shadow .12s}.card:hover{border-color:var(--c,var(--a));transform:translateY(-2px);box-shadow:var(--sh)}
.card.mine{background:var(--yel)}.tag{background:color-mix(in srgb,var(--c,var(--a)) 14%,var(--sf));border-color:transparent}
.num{width:30px;height:30px;border-radius:50%;background:var(--c,var(--a));color:#fff;display:grid;place-items:center;font-weight:800;font-size:13px}
.wh{background:color-mix(in srgb,var(--a) 14%,var(--bg));border-radius:22px 22px 0 0}.big{border:2px solid var(--bd);border-radius:26px}
input[type=search]:focus,input[type=text]:focus,textarea:focus{border-color:var(--a)}.toast{background:var(--a);color:#fff}
.hero{background:linear-gradient(135deg,#7c5cff,#ff4f8b 70%,#ff8a1f);color:#fff;border-radius:26px;padding:22px;display:flex;gap:16px;flex-wrap:wrap;align-items:center;justify-content:space-between;margin-bottom:16px;box-shadow:var(--sh)}
.hero h1{font-size:30px}.hero p{margin:4px 0 0;opacity:.95;max-width:420px}.hero .chip{display:inline-block;margin-top:10px;background:rgba(255,255,255,.25);border-radius:999px;padding:4px 12px;font-weight:700;font-size:13px}
.goal{background:rgba(255,255,255,.22);border-radius:18px;padding:12px 16px;min-width:180px}.goal b{font:800 26px Fraunces,serif;display:block}.goal span{font-size:12px}.goal .pb{background:rgba(255,255,255,.3);margin-top:6px}.goal .pb i{background:#fff}
.card p{-webkit-line-clamp:3}.tile .em{font-size:36px;line-height:1;display:block;margin-bottom:6px}.tile .w{font-size:19px}.tile p{-webkit-line-clamp:3}
.row2{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));margin-bottom:6px}.row2 .card{display:flex;flex-direction:column;gap:6px}.row2 .btn{align-self:flex-start;margin-top:auto}
</style>
</head>
<body>
<header><div class="hw">
<div class="logo">28</div>
<div class="ttl"><b>İngilizce Öğren</b><small id="sub"></small></div>
<button class="btn ico" data-act="toolmenu" aria-haspopup="menu" aria-label="Araçlar">⋯</button>
</div><nav class="nav" id="nav" aria-label="Ana menü"></nav></header>
<main id="main"></main>
<button class="btn pri fab" data-act="add">＋ Ekle</button>
<script>
const D={"words": [{"word": "be", "type": "Fiil", "meaning": "1. Olmak (var olma/durum).", "full_meaning": "1. Olmak (var olma/durum).\n2. -dır, -dir (tanımlama).\n3. (yardımcı fiil) -mekte, -yor.", "guide": "Varlık, durum veya kimlik bildiren temel fiil. Süreklilik, edilgenlik gibi zamanları oluşturmak için yardımcı fiil olarak da kullanılır.", "examples": "1. I want to be happy. (Mutlu olmak istiyorum.)\n2. She is a doctor. (O bir doktordur.)\n3. They are sleeping. (Onlar uyuyorlar.)", "rank": 1}, {"word": "of", "type": "Edat", "meaning": "1. -in, -nın (aitlik).", "full_meaning": "1. -in, -nın (aitlik).\n2. Hakkında, ile ilgili.\n3. -den, -dan (yapılmış).", "guide": "Aitlik, miktar, malzeme, konu gibi birçok ilişkiyi kurmak için kullanılan temel bir edat.", "examples": "1. the roof of the house (evin çatısı)\n2. a story of love (bir aşk hikayesi)\n3. a ring of gold (altından bir yüzük)", "rank": 2}, {"word": "to", "type": "Edat / Mastar Eki", "meaning": "Edat: 1. -e / -a (yönelme).", "full_meaning": "Edat: 1. -e / -a (yönelme).\n2. -e / -a (zaman).\n3. -e / -a (karşılaştırma).\nMastar: 4. Fiillerin mastar hali (to do).", "guide": "En yaygın edattır. Yön, zaman, alıcı, amaç gibi birçok ilişkiyi kurar. Ayrıca mastar eki olarak kullanılır.", "examples": "1. I'm going to the supermarket. (Süpermarkete gidiyorum.)\n2. It's ten to five. (Saat beşe on var.)\n3. I want to learn Spanish. (İspanyolca öğrenmek istiyorum.)", "rank": 3}, {"word": "in", "type": "Edat, Zarf", "meaning": "1. İçinde, -de/-da (yer).", "full_meaning": "1. İçinde, -de/-da (yer).\n2. İçine, -e/-a (yönelme).\n3. ...de/-da (zaman).", "guide": "Bir şeyin iç mekanını veya sınırlarını belirtir. Bir yöne doğru hareketi belirtir. Zaman dilimini belirtir.", "examples": "1. The book is in the bag. (Kitap çantanın içinde.) [Edat]\n2. Come in! (İçeri gel!) [Zarf]\n3. I'll see you in an hour. (Seni bir saat içinde/sonra göreceğim.) [Edat]", "rank": 4}, {"word": "have", "type": "Fiil, Yardımcı Fiil", "meaning": "1. Sahip olmak.", "full_meaning": "1. Sahip olmak.\n2. (Yardımcı Fiil) -miş/-mış (Perfect Tense).\n3. Yemek/içmek, yapmak (have breakfast/a shower).", "guide": "Mülkiyet bildirir. Perfect tense'lerde yardımcı fiil olarak kullanılır. Birçok deyimsel fiilin parçasıdır.", "examples": "1. I have two brothers. (İki erkek kardeşim var.)\n2. She has finished her work. (İşini bitirdi.)\n3. Let's have dinner. (Akşam yemeği yiyelim.)", "rank": 5}, {"word": "for", "type": "Edat/Bağlaç", "meaning": "1. İçin, -e (edat).", "full_meaning": "1. İçin, -e (edat).\n2. (Süre) -dır, -dir (edat).\n3. Çünkü, zira (bağlaç).", "guide": "Bir şeyin amacını, yararlanıcısını veya nedenini belirtir. Bir sürenin ne kadar olduğunu belirtir. \"Because\" anlamında, daha resmi.", "examples": "1. This gift is for you. (Bu hediye senin için.)\n2. I lived there for five years. (Orada beş yıl yaşadım.)\n3. I couldn't stay, for I was late. (Kalamadım, çünkü geç kalmıştım.)", "rank": 6}, {"word": "not", "type": "Edat/Zarf", "meaning": "1. ...-ma/-me (olumsuzluk eki).", "full_meaning": "1. ...-ma/-me (olumsuzluk eki).\n2. Değil.\n3. Hiç, asla (vurgu için).", "guide": "Fiilleri, sıfatları veya diğer zarfları olumsuz yapmak için kullanılan temel edat.", "examples": "1. I do not know. (Bilmiyorum.)\n2. She is not happy. (O mutlu değil.)\n3. Not a single person came. (Tek bir kişi bile gelmedi.)", "rank": 7}, {"word": "on", "type": "Edat / Edat/Zarf / Sıfat", "meaning": "1. Üzerinde, üstünde.", "full_meaning": "1. Üzerinde, üstünde.\n2. Hakkında, ile ilgili.\n3. Açık, çalışır durumda (cihaz).\n4. Devam etmekte olan.", "guide": "Temas, konu, zaman veya aktif durum belirtir.", "examples": "1. The book is on the table. (Kitap masanın üzerinde.)\n2. a book on history (tarih hakkında bir kitap)\n3. Turn the light on. (Işığı aç.)\n4. The film is still on. (Film hâlâ devam ediyor.)", "rank": 8}, {"word": "with", "type": "Edat", "meaning": "1. İle, birlikte", "full_meaning": "1. İle, birlikte\n2. -lı, -sız (sahiplik/özellik)\n3. Kullanarak, ile", "guide": "Birliktelik, araç, neden veya sahip olma durumunu gösteren çok yönlü bir edattır.", "examples": "1. I went to the cinema with my friends. (Arkadaşlarımla sinemaya gittim.)\n2. The man with the glasses is my teacher. (Gözlüklü adam benim öğretmenim.)\n3. Cut it with a knife. (Onu bir bıçakla kes.)", "rank": 9}, {"word": "as", "type": "Bağlaç/Edat/Zarf", "meaning": "1. Olarak, -ken (bağlaç).", "full_meaning": "1. Olarak, -ken (bağlaç).\n2. Gibi, kadar (edat/bağlaç).\n3. Çünkü, madem (bağlaç).", "guide": "Benzerlik, zaman, neden veya rol belirtmek için kullanılan çok yönlü bir kelime.", "examples": "1. He works as a teacher. (Öğretmen olarak çalışıyor.)\n2. She is as tall as her brother. (O, erkek kardeşi kadar uzun.)\n3. As you were out, I left a message. (Dışarıda olduğun için bir mesaj bıraktım.)", "rank": 10}, {"word": "do", "type": "Yardımcı Fiil/Ana Fiil", "meaning": "1. (Yardımcı fiil) Soru/olumsuz yapmak.", "full_meaning": "1. (Yardımcı fiil) Soru/olumsuz yapmak.\n2. Yapmak, etmek (ana fiil).\n3. (Yeterlilik) Yetmek, iş görmek (\"That will do\").", "guide": "En yaygın kullanımı soru ve olumsuz cümlelerde yardımcı fiil olmaktır. Ana fiil olarak çok geniş bir \"eylem\" anlamı taşır.", "examples": "1. Do you like coffee? (Kahve sever misin?)\n2. I need to do my homework. (Ödevimi yapmam gerekiyor.)\n3. \"Is that enough?\" \"Yes, that'll do.\" (\"Bu kadar yeter mi?\" \"Evet, yeter.\")", "rank": 11}, {"word": "at", "type": "Edat", "meaning": "1. -de, -da (konum).", "full_meaning": "1. -de, -da (konum).\n2. -de, -da (zaman).\n3. -e, -a (yön/hedef).", "guide": "Kesin bir noktayı (yer, zaman, fiyat) belirtmek için kullanılan temel edat.", "examples": "1. Meet me at the station. (Benimle istasyonda buluş.)\n2. The movie starts at 7 o'clock. (Film saat 7'de başlıyor.)\n3. Look at that! (Şuna bak!)", "rank": 12}, {"word": "by", "type": "Edat/Zarf", "meaning": "1. Tarafından, - ile (edat).", "full_meaning": "1. Tarafından, - ile (edat).\n2. Yanında, yakınında (edat).\n3. Kadar, yoluyla (edat).", "guide": "Faili, konumu, zamanı, yöntemi veya miktarı belirtir.", "examples": "1. a painting by Van Gogh (Van Gogh tarafından yapılmış bir resim)\n2. Sit by me. (Yanıma otur.)\n3. I go to work by train. (İşe trenle gidiyorum.)", "rank": 13}, {"word": "from", "type": "Edat", "meaning": "1. -den, -dan (kaynak).", "full_meaning": "1. -den, -dan (kaynak).\n2. -den beri (zaman başlangıcı).\n3. -den dolayı (neden).", "guide": "Bir şeyin kaynağını, başlangıç noktasını veya nedenini gösterir.", "examples": "1. I'm from Turkey. (Türkiye'denim.)\n2. from Monday to Friday (Pazartesi'den Cuma'ya)\n3. She suffered from a cold. (Soğuk algınlığından mustaripti.)", "rank": 14}, {"word": "which", "type": "Zamir, Sıfat", "meaning": "1. Hangi? Hangisi? (soru)", "full_meaning": "1. Hangi? Hangisi? (soru)\n2. Ki o, ki onu (göreceli zamir)", "guide": "Sınırlı bir grup içinden birini veya birkaçını seçmek için soru sormada veya ek bilgi veren cümleciklerde kullanılır.", "examples": "1. Which color do you prefer? (Hangi rengi tercih edersiniz?)\n2. This is the book which I told you about. (Bu sana bahsettiğim kitap.)\n3. He didn't say which way to go. (Hangi yoldan gideceğimizi söylemedi.)", "rank": 15}, {"word": "will", "type": "Yardımcı Fiil, İsim", "meaning": "1. -ecek, -acak (gelecek zaman) (yard. fiil)", "full_meaning": "1. -ecek, -acak (gelecek zaman) (yard. fiil)\n2. İrade, kararlılık (isim)\n3. Vasiyetname (isim)", "guide": "Gelecek zamanı oluşturur. Ayrıca, bir şeyi yapma niyeti, kararlılığı veya miras bırakma belgesi anlamına gelir.", "examples": "1. I will call you tomorrow. (Seni yarın arayacağım.)\n2. Where there's a will, there's a way. (İsteyen bir yol bulur. (İrade varsa, bir çözüm vardır.))\n3. He left his house to his son in his will. (Evi oğluna vasiyetnamesinde bıraktı.)", "rank": 16}, {"word": "say", "type": "Fiil", "meaning": "1. Söylemek, demek.", "full_meaning": "1. Söylemek, demek.\n2. İfade etmek.\n3. (Tahmin) Demek, sanmak.", "guide": "Sözlü olarak bir şeyi ifade etmek, belirtmek.", "examples": "1. What did you say? (Ne dedin?)\n2. The look on his face said it all. (Yüzündeki ifade her şeyi anlatıyordu.)\n3. I'd say it's about 5 km. (Sanırım yaklaşık 5 km.)", "rank": 17}, {"word": "one", "type": "Sayı / Zamir", "meaning": "1. Bir (sayı).", "full_meaning": "1. Bir (sayı).\n2. Bir tane, herhangi biri.\n3. (Belirsiz kişi) insan, birisi.", "guide": "Sayı veya belirsiz bir kişi/nesneyi ifade eden zamir.", "examples": "1. I have one brother. (Bir erkek kardeşim var.)\n2. I need a pen. Do you have one? (Bir kaleme ihtiyacım var. Sende var mı?)\n3. One should always be polite. (İnsan her zaman kibar olmalıdır.)", "rank": 18}, {"word": "all", "type": "Belirteç/Zamir/Sıfat", "meaning": "1. Tüm, bütün, hepsi.", "full_meaning": "1. Tüm, bütün, hepsi.\n2. Her, tamamen (zarf).\n3. (all over) bitmiş, sona ermiş.", "guide": "Bir grubun tamamını, her bir parçasını ifade eder. Zarf olarak \"tamamen\" anlamına gelir.", "examples": "1. All students must register. (Tüm öğrenciler kayıt olmalı.)\n2. I'm all wet. (Tamamen ıslandım.)\n3. The game is all over. (Oyun bitti.)", "rank": 19}, {"word": "some", "type": "Sıfat / Zamir", "meaning": "1. (S) Biraz, bir miktar.", "full_meaning": "1. (S) Biraz, bir miktar.\n2. (S) Bazı.\n3. (Z) Yaklaşık, aşağı yukarı.", "guide": "Belirsiz miktar veya sayıda olan. Sayılabilen çoğul isimlerle \"bazı\", sayılamayanlarla \"biraz\" anlamı verir.", "examples": "1. I need some help. (Biraz yardıma ihtiyacım var.)\n2. Some people disagree. (Bazı insanlar katılmıyor.)\n3. It happened some twenty years ago. (Yaklaşık yirmi yıl önce oldu.)", "rank": 20}, {"word": "no", "type": "Ünlem / Sıfat", "meaning": "1. Hayır (olumsuz cevap).", "full_meaning": "1. Hayır (olumsuz cevap).\n2. Hiç, hiçbir (sıfat).\n3. Yasak.", "guide": "Bir soruya verilen olumsuz cevap veya hiç miktarını gösteren sıfat.", "examples": "1. \"Are you tired?\" \"No, I'm not.\" (\"Yorgun musun?\" \"Hayır, değilim.\")\n2. There is no milk left. (Hiç süt kalmadı.)\n3. No smoking. (Sigara içmek yasaktır.)", "rank": 21}, {"word": "if", "type": "Bağlaç", "meaning": "1. Eğer, -se/-sa.", "full_meaning": "1. Eğer, -se/-sa.\n2. ...ip ...mediğini (dolaylı soru).\n3. Keşke (if only).", "guide": "Bir koşul veya olasılık belirtir. \"Whether\" anlamında dolaylı sorularda kullanılır. \"If only\" ile pişmanlık/istemek.", "examples": "1. If it rains, we'll stay home. (Eğer yağmur yağarsa, evde kalacağız.)\n2. I wonder if she's coming. (Onun gelip gelmediğini merak ediyorum.)\n3. If only I had studied harder! (Keşke daha sıkı çalışsaydım!)", "rank": 22}, {"word": "what", "type": "Zamir, Sıfat, Ünlem", "meaning": "1. Ne? (soru zamiri)", "full_meaning": "1. Ne? (soru zamiri)\n2. Ne...! (şaşkınlık/ünlem)\n3. Ki o, neyi (bağlacı zamir)", "guide": "Bilgi edinmek için soru sormada veya şaşkınlık ifade etmede kullanılan temel bir soru kelimesi.", "examples": "1. What is your name? (Adın ne?)\n2. What a beautiful day! (Ne güzel bir gün!)\n3. I saw what you did. (Ne yaptığını gördüm.)", "rank": 23}, {"word": "would", "type": "Yardımcı Fiil", "meaning": "1. -erdi (geçmiş alışkanlık)", "full_meaning": "1. -erdi (geçmiş alışkanlık)\n2. -erdi (koşul cümleleri)\n3. Rica, nazik istek", "guide": "\"Will\" yardımcı fiilinin geçmiş zaman hali. Geçmiş alışkanlık, koşul cümleleri ve nazik istek/soru ifade etmek için kullanılır.", "examples": "1. When I was young, I would visit my grandmother every Sunday. (Gençken, her Pazar büyükannemi ziyaret ederdim.)\n2. I would help you if I could. (Yapabilseydim sana yardım ederdim.)\n3. Would you please close the door? (Kapıyı kapatır mısınız lütfen?)", "rank": 24}, {"word": "go", "type": "Fiil", "meaning": "1. Gitmek.", "full_meaning": "1. Gitmek.\n2. Çalışmak, işlemek (makine).\n3. Olmak, haline gelmek, devam etmek.", "guide": "Bir yerden başka bir yere hareket etmek. Ayrıca, bir durumda olmak veya bir eylemin devam ettiğini göstermek için kullanılır. Çok sayıda deyim vardır.", "examples": "1. I go to work by bus. (İşe otobüsle giderim.)\n2. The car won't go. (Araba çalışmıyor.)\n3. a) How did it go? (Nasıl geçti?) b) The milk has gone sour. (Süt ekşimiş.) c) Keep going! (Devam et!)", "rank": 25}, {"word": "so", "type": "Zarf / Bağlaç", "meaning": "1. (Z) Çok, o kadar.", "full_meaning": "1. (Z) Çok, o kadar.\n2. (Bağ.) Bu yüzden, bundan dolayı.\n3. (Z) Öyle, böyle.", "guide": "Bir derece veya sonuç ifade eder. \"Therefore\" (bu yüzden) anlamında bağlaç olarak kullanılır.", "examples": "1. I'm so tired. (Çok yorgunum.)\n2. It was raining, so we stayed home. (Yağmur yağıyordu, bu yüzden evde kaldık.)\n3. Is that so? (Öyle mi?)", "rank": 26}, {"word": "who", "type": "Zamir", "meaning": "1. Kim? (soru zamiri)", "full_meaning": "1. Kim? (soru zamiri)\n2. Ki o, ki onu (göreceli zamir)", "guide": "İnsanlar hakkında soru sormak veya onlarla ilgili ek bilgi vermek için kullanılan göreceli ve soru zamiri.", "examples": "1. Who is that? (O kim?)\n2. The woman who called you is my boss. (Seni arayan kadın benim patronum.)\n3. I wonder who will win. (Kimin kazanacağını merak ediyorum.)", "rank": 27}, {"word": "out", "type": "Edat/Zarf / Sıfat / İsim", "meaning": "1. Dışarı, dışarıda.", "full_meaning": "1. Dışarı, dışarıda.\n2. Bitti, tükendi.\n3. Açık, ortada (gizli değil).\n4. (Spor) aut, oyun dışı.", "guide": "İçerinin tersi; bir şeyin dışarıda, tükenmiş veya modasının geçmiş olduğunu ifade eder.", "examples": "1. Let's go out for dinner. (Akşam yemeği için dışarı çıkalım.)\n2. We're out of milk. (Sütümüz bitti.)\n3. The secret is out. (Sır açığa çıktı.)\n4. The ball is out. (Top aut.)", "rank": 28}, {"word": "make", "type": "Fiil", "meaning": "1. Yapmak, üretmek, inşa etmek.", "full_meaning": "1. Yapmak, üretmek, inşa etmek.\n2. (Bir şeyi) sebep olmak, neden olmak.\n3. (Para) kazanmak; (toplam) etmek.", "guide": "En temel anlamı bir şeyi oluşturmak veya meydana getirmektir. Aynı zamanda bir sonuca yol açmak veya bir miktarı ifade etmek için de yaygın kullanılır.", "examples": "1. She made a delicious cake. (Lezzetli bir kek yaptı.)\n2. The news made him very happy. (Haber onu çok mutlu etti.)\n3. He makes a good salary. (İyi bir maaş kazanıyor.)", "rank": 29}, {"word": "up", "type": "Edat, Zarf, Sıfat, Fiil, İsim", "meaning": "1. Yukarı, yukarıya (yön/zarf)", "full_meaning": "1. Yukarı, yukarıya (yön/zarf)\n2. Yukarıda, yukarı (konum/edat)\n3. Tamamen, bitmiş (tüketim/zarf); Artmak (fiil)", "guide": "En temel anlamı yukarı yönü veya konumu gösterir. Çok sayıda mecazi kullanımı vardır: bir şeyin arttığını, tamamen bittiğini veya konu olduğunu (What's up?) ifade edebilir.", "examples": "1. Look up at the sky! (Gökyüzüne bak! (yukarı))\n2. Her office is up the stairs. (Onun ofisi merdivenlerin yukarısında.)\n3. The inflation rate has gone up. (Enflasyon oranı arttı.)\n4. He ate up all the cookies. (Tüm kurabiyeleri yiyip bitirdi.)", "rank": 30}, {"word": "get", "type": "Fiil", "meaning": "1. Elde etmek/almak (çaba sonucu). OBTAIN", "full_meaning": "1. Elde etmek/almak (çaba sonucu). OBTAIN\n2. Almak (sana verilmesi). RECEIVE\n3. Olmak, -e gelmek/-e gitmek (ulaşım), anlamak.", "guide": "En yaygın fiillerden biridir. Bağlamına göre birçok anlamı vardır. Temelde bir şeyi \"elde etme\" veya bir duruma \"gelme/gitme\" eylemini ifade eder. \"Have got\" kalıbıyla \"sahip olmak\" anlamında da kullanılır.", "examples": "1. I need to get a new passport. (Yeni bir pasaport almam/elde etmem gerek.) [OBTAIN]\n2. I got a letter from my bank today. (Bugün bankamdan bir mektup aldım.) [RECEIVE]\n3. a) It's getting cold. (Hava soğuyor.) [OLMAK] b) How do I get to the station? (İstasyona nasıl giderim?) [ULAŞIM] c) I don't get the joke. (Şakayı anlamıyorum.) [ANLAMAK]", "rank": 31}, {"word": "when", "type": "Zarf, Bağlaç", "meaning": "1. Ne zaman? (soru zarfı)", "full_meaning": "1. Ne zaman? (soru zarfı)\n2. -dığı zaman, -ince (bağlaç)\n3. O zaman (göreceli zarf)", "guide": "Zamana ilişkin soru sormak veya iki olayın zaman ilişkisini kurmak için kullanılır.", "examples": "1. When did you arrive? (Ne zaman vardınız?)\n2. Call me when you get home. (Eve vardığında beni ara.)\n3. Sunday is the day when we relax. (Pazar, dinlendiğimiz gündür.)", "rank": 32}, {"word": "more", "type": "Sıfat / Zamir / Edat/Zarf", "meaning": "1. Daha fazla, daha çok.", "full_meaning": "1. Daha fazla, daha çok.\n2. Ek, ilave.\n3. (more than) -den daha fazla, -den çok.", "guide": "Miktar, sayı veya derece bakımından artışı ifade eder. Karşılaştırma yaparken kullanılır.", "examples": "1. I need more time. (Daha fazla zamana ihtiyacım var.)\n2. Would you like some more tea? (Biraz daha çay ister misiniz?)\n3. She is more intelligent than him. (O ondan daha zekidir.)", "rank": 33}, {"word": "time", "type": "İsim / Fiil", "meaning": "İsim: 1. Zaman, vakit.", "full_meaning": "İsim: 1. Zaman, vakit.\n2. Kez, defa.\n3. (Spor) Süre.\nFiil: 4. Zamanlamak, ayarlamak.\n5. Saat tutmak.", "guide": "Soyut bir süreç veya belirli bir an. Ayrıca bir olayın tekrar sayısı. Fiil olarak, planlamak anlamına gelir.", "examples": "1. Time flies when you're having fun. (Eğlenirken zaman su gibi akar.)\n2. I've been there three times. (Oraya üç kez gittim.)\n3. She timed her arrival perfectly. (Varışını mükemmel zamanladı.)", "rank": 34}, {"word": "about", "type": "Edat/Zarf", "meaning": "1. Hakkında, ile ilgili (edat).", "full_meaning": "1. Hakkında, ile ilgili (edat).\n2. Yaklaşık olarak, aşağı yukarı (zarf).\n3. Etrafta, civarda (edat/zarf).", "guide": "Bir konu hakkında konuşurken veya tahmini bir miktar/zaman belirtirken en sık kullanılır. \"Etrafta olmak\" anlamında da yaygındır.", "examples": "1. What are you talking about? (Neyden bahsediyorsun?)\n2. It costs about 50 dollars. (Yaklaşık 50 dolar tutuyor.)\n3. Is there a bank about here? (Buralarda bir banka var mı?)", "rank": 35}, {"word": "know", "type": "Fiil", "meaning": "1. Bilmek (gerçek/bilgi).", "full_meaning": "1. Bilmek (gerçek/bilgi).\n2. Tanımak, aşina olmak.\n3. Ayırt etmek, fark etmek.", "guide": "Bir şey hakkında bilgi sahibi olmak veya bir kişiyle daha önce karşılaşmış/onunla zaman geçirmiş olmak.", "examples": "1. I know the answer to that question. (O sorunun cevabını biliyorum.)\n2. Do you know David? He works in accounting. (David'i tanıyor musun? Muhasebede çalışıyor.)\n3. You'll know him by his bright red hat. (Onu parlak kırmızı şapkasından tanıyacaksın.)", "rank": 36}, {"word": "see", "type": "Fiil", "meaning": "1. Görmek.", "full_meaning": "1. Görmek.\n2. Anlamak, fark etmek.\n3. Görüşmek, ziyaret etmek.", "guide": "Gözlerle algılamak veya zihinsel olarak kavramak, anlamak.", "examples": "1. I can see the mountains. (Dağları görebiliyorum.)\n2. Oh, I see what you mean now. (Ah, şimdi ne demek istediğini anlıyorum.)\n3. I'll see my doctor tomorrow. (Yarın doktorumu göreceğim.)", "rank": 37}, {"word": "use", "type": "Fiil, İsim", "meaning": "1. Kullanmak (fiil)", "full_meaning": "1. Kullanmak (fiil)\n2. Kullanım, yararlanma (isim)\n3. Fayda, yarar (isim)", "guide": "Fiil olarak, bir şeyi bir amaç için hizmete sokmak demektir. İsim olarak, kullanma eylemi veya kullanışlılık, fayda anlamına gelir.", "examples": "1. Do you know how to use this software? (Bu yazılımı nasıl kullanacağını biliyor musun?)\n2. The use of mobile phones is prohibited. (Cep telefonlarının kullanımı yasaktır.)\n3. This tool is of no use to me. (Bu alet bana hiçbir fayda sağlamıyor.)", "rank": 38}, {"word": "any", "type": "Belirteç/Zamir/Sıfat", "meaning": "1. Hiç, herhangi bir (soru/olumsuz).", "full_meaning": "1. Hiç, herhangi bir (soru/olumsuz).\n2. Her, hiçbir fark olmaksızın (olumlu).\n3. Biraz, herhangi bir miktar.", "guide": "Olumsuz ve soru cümlelerinde \"hiç\" anlamına gelir. Olumlu cümlelerde \"herhangi\" vurgusu yapar.", "examples": "1. Do you have any money? (Hiç paran var mı?)\n2. You can call me any time. (Bana her zaman telefon edebilirsin.)\n3. If there are any problems, let me know. (Herhangi bir sorun olursa, bana haber ver.)", "rank": 39}, {"word": "other", "type": "Sıfat / Zamir", "meaning": "1. Diğer, başka, öteki.", "full_meaning": "1. Diğer, başka, öteki.\n2. (the other) öbürü, diğeri.\n3. Geçen, önceki (the other day).", "guide": "Belirli bir kişi veya şey dışında kalanları ifade eder.", "examples": "1. Do you have any other questions? (Başka sorunuz var mı?)\n2. One shoe is here, the other is missing. (Bir ayakkabı burada, diğeri kayıp.)\n3. I saw him the other day. (Onu geçen gün gördüm.)", "rank": 40}, {"word": "year", "type": "İsim", "meaning": "1. Yıl, sene", "full_meaning": "1. Yıl, sene\n2. Yaş\n3. Öğretim yılı", "guide": "Dünyanın Güneş etrafındaki bir tam turu, yaklaşık 365 gün. Bir insanın veya şeyin yaşını veya bir okul dönemini ifade etmek için de kullanılır.", "examples": "1. There are twelve months in a year. (Bir yılda on iki ay vardır.)\n2. She is ten years old. (O on yaşında.)\n3. He's in his final year at university. (Üniversitede son yılında.)", "rank": 41}, {"word": "take", "type": "Fiil", "meaning": "1. Almak (fiziksel olarak eline almak veya bir yere götürmek).", "full_meaning": "1. Almak (fiziksel olarak eline almak veya bir yere götürmek).\n2. Çaba/plan sonucu elde etmek, almak (obtain).\n3. (Zaman) almak, gerektirmek.\n4. (Taşıma) bir yere götürmek.\n5. Kabul etmek.", "guide": "Çok geniş kullanımı vardır. Almak eylemi genellikle aktif bir harekete işaret eder (\"on the table\"den almak). \"Elde etmek\" anlamında plan/çaba vardır (sınavdan not almak). \"Zaman almak\" veya \"birini bir yere götürmek\" gibi mecazi ve pratik kullanımları çok yaygındır.", "examples": "1. Take a cookie from the plate. (Tabaktan bir kurabiye al.)\n2. She took the first prize in the competition. (Yarışmada birinci ödülü aldı.)\n3. It takes about an hour to get there by train. (Oraya trenle gitmek yaklaşık bir saat sürer/alır.)\n4. Could you take me to the airport? (Beni havaalanına götürebilir misin?)\n5. I decided to take the job offer. (İş teklifini kabul etmeye karar verdim.)", "rank": 42}, {"word": "work", "type": "Fiil, İsim", "meaning": "1. Çalışmak (fiil)", "full_meaning": "1. Çalışmak (fiil)\n2. İş (isim)\n3. Eser, yapıt (isim)", "guide": "Fiziksel veya zihinsel çaba harcamak, bir iş yapmak. İsim olarak, yapılan aktivite, meslek veya sanatsal üründür.", "examples": "1. She works in a bank. (Bir bankada çalışıyor.)\n2. He has a lot of work to do. (Yapacak çok işi var.)\n3. This painting is a famous work of art. (Bu tablo ünlü bir sanat eseridir.)", "rank": 43}, {"word": "two", "type": "Sayı / İsim", "meaning": "1. İki (2).", "full_meaning": "1. İki (2).", "guide": "1'den sonra ve 3'ten önce gelen sayı.", "examples": "1. I have two hands. (İki elim var.)\n2. It takes two to tango. (Tango yapmak için iki kişi gerekir.)\n3. Let's meet at two o'clock. (Saat ikide buluşalım.)", "rank": 44}, {"word": "think", "type": "Fiil", "meaning": "1. Düşünmek.", "full_meaning": "1. Düşünmek.\n2. Sanmak, zannetmek.\n3. İnanmak, fikrinde olmak.", "guide": "Zihinsel bir faaliyet, bir fikre sahip olmak veya bir inancı ifade etmek.", "examples": "1. I need to think about this decision. (Bu karar hakkında düşünmem gerekiyor.)\n2. I think it's going to rain. (Sanırım yağmur yağacak.)\n3. What do you think of this idea? (Bu fikir hakkında ne düşünüyorsun?)", "rank": 45}, {"word": "could", "type": "Yardımcı Fiil", "meaning": "1. -ebilmek (geçmiş genel yetenek).", "full_meaning": "1. -ebilmek (geçmiş genel yetenek).\n2. -ebilirdi (olasılık/izin).\n3. (Rica) -ebilir misiniz?", "guide": "\"Can\"in geçmiş zaman hali. Yetenek, olasılık veya nazik ricada kullanılır.", "examples": "1. When I was young, I could run fast. (Gençken hızlı koşabilirdim.)\n2. It could rain later. (Daha sonra yağmur yağabilir.)\n3. Could you pass the salt, please? (Tuzu uzatabilir misiniz lütfen?)", "rank": 46}, {"word": "into", "type": "Edat", "meaning": "1. İçine, -e/-a (yönelme, içeri).", "full_meaning": "1. İçine, -e/-a (yönelme, içeri).\n2. ...e dönüşmek (değişim).\n3. -e karşı, -e doğru (tutum).", "guide": "Bir şeyin içine doğru hareket veya yönelme. Bir durumdan başka bir duruma geçiş. Bir şeye karşı olma.", "examples": "1. She walked into the room. (Odaya girdi.)\n2. The caterpillar turned into a butterfly. (Tırtıl bir kelebeğe dönüştü.)\n3. He's into classical music. (Klasik müziğe meraklı/ilgili.)", "rank": 47}, {"word": "then", "type": "Zarf / Sıfat", "meaning": "Zarf: 1. O zaman, sonra.", "full_meaning": "Zarf: 1. O zaman, sonra.\n2. O halde, öyleyse.\nSıfat: 3. O zamanki, o döneme ait.", "guide": "Zaman dizisinde bir sonraki noktayı veya mantıksal bir sonucu işaret eder.", "examples": "1. We had dinner, and then we watched a movie. (Akşam yemeği yedik, sonra bir film izledik.)\n2. If you're tired, then you should rest. (Eğer yorgunsan, o halde dinlenmelisin.)\n3. The then president made an important decision. (O dönemki başkan önemli bir karar verdi.)", "rank": 48}, {"word": "well", "type": "Zarf, Sıfat, Ünlem, İsim", "meaning": "1. İyi, güzel (zarf)", "full_meaning": "1. İyi, güzel (zarf)\n2. İyi, sağlıklı (sıfat)\n3. Peki, şey (konuşmaya başlarken) (ünlem)\n4. Kuyu (isim)", "guide": "Bir şeyin iyi bir şekilde yapıldığını belirten temel bir zarf. Sıfat olarak, sağlıklı olmayı ifade eder. Ayrıca, konuşma dolgusu veya su kuyusu anlamına gelir.", "examples": "1. She sings very well. (O çok iyi şarkı söyler.)\n2. I don't feel well today. (Bugün kendimi iyi hissetmiyorum.)\n3. Well, what do you think? (Peki, ne düşünüyorsun?)\n4. They get water from an old well. (Eski bir kuyudan su alıyorlar.)", "rank": 49}, {"word": "only", "type": "Edat/Zarf / Sıfat / Bağlaç", "meaning": "1. Sadece, yalnızca.", "full_meaning": "1. Sadece, yalnızca.\n2. Tek, biricik.\n3. Ancak, ama.", "guide": "Bir şeyin tek veya sınırlı olduğunu belirtir.", "examples": "1. I only have five pounds. (Sadece beş poundum var.)\n2. She is an only child. (O tek çocuktur.)\n3. I'd help you, only I'm too busy. (Sana yardım ederdim, ama çok meşgulüm.)", "rank": 50}, {"word": "come", "type": "Fiil", "meaning": "1. Gelmek.", "full_meaning": "1. Gelmek.\n2. (come from) -li olmak, -den gelmek.\n3. (come true) gerçekleşmek.", "guide": "Konuşmacının bulunduğu yere doğru hareket etmek veya bir kaynağa sahip olmak.", "examples": "1. Come here! (Buraya gel!)\n2. Where do you come from? (Nerelisin?)\n3. My dream has come true. (Hayalim gerçek oldu.)", "rank": 51}, {"word": "yes", "type": "Ünlem, İsim", "meaning": "1. Evet (olumlu cevap/onay)", "full_meaning": "1. Evet (olumlu cevap/onay)\n2. Kabul oyu (isim)", "guide": "Bir soruya olumlu cevap vermek, bir şeyi onaylamak veya rıza göstermek için kullanılan temel ünlem. İsim olarak, olumlu oy anlamına gelir.", "examples": "1. \"Can you help me?\" \"Yes, of course.\" (\"Bana yardım edebilir misin?\" \"Evet, tabii ki.\")\n2. Please answer with a yes or no. (Lütfen evet veya hayır şeklinde cevaplayın.)\n3. The yes votes won the election. (Evet oyları seçimi kazandı.)", "rank": 52}, {"word": "than", "type": "Edat / Bağlaç", "meaning": "1. -den / -dan (karşılaştırma).", "full_meaning": "1. -den / -dan (karşılaştırma).", "guide": "İki şeyi karşılaştırırken kullanılır.", "examples": "1. She is taller than her brother. (O, erkek kardeşinden daha uzun.)\n2. I would rather stay home than go out. (Dışarı çıkmaktansa evde kalmayı tercih ederim.)\n3. More than 100 people attended. (100'den fazla kişi katıldı.)", "rank": 53}, {"word": "now", "type": "Edat/Zarf / Bağlaç", "meaning": "1. Şimdi, şu anda.", "full_meaning": "1. Şimdi, şu anda.\n2. Hemen, derhal.\n3. (Konuşmayı bağlamak için) şimdi, peki.", "guide": "İçinde bulunulan zamanı ifade eder. Konuşmada geçiş yapmak için kullanılır.", "examples": "1. I'm busy now. (Şu anda meşgulüm.)\n2. Do it now! (Hemen yap!)\n3. Now, let's move on to the next topic. (Pekala, şimdi bir sonraki konuya geçelim.)", "rank": 54}, {"word": "over", "type": "Edat / Edat/Zarf / Sıfat", "meaning": "1. Üzerinde, üstünde (temas yok).", "full_meaning": "1. Üzerinde, üstünde (temas yok).\n2. Bitmiş, sona ermiş.\n3. Boyunca, her yerinde.\n4. Fazla, aşırı.", "guide": "Üstten geçme, bir sürecin bitmesi veya bir miktarın aşılması anlamlarını taşır.", "examples": "1. The plane flew over the city. (Uçak şehrin üzerinden uçtu.)\n2. The game is over. (Oyun bitti.)\n3. They traveled all over Europe. (Tüm Avrupa'yı dolaştılar.)\n4. Children over 12 must pay full price. (12 yaşın üzerindeki çocuklar tam ücret ödemelidir.)", "rank": 55}, {"word": "new", "type": "Sıfat", "meaning": "1. Yeni.", "full_meaning": "1. Yeni.\n2. Modern, çağdaş.\n3. Tanışık olunmayan, alışılmamış.", "guide": "Daha önce var olmayan, yakın zamanda yapılan veya edinilen.", "examples": "1. I bought a new car. (Yeni bir araba aldım.)\n2. They use new teaching methods. (Yeni öğretim yöntemleri kullanıyorlar.)\n3. The job was a new experience for me. (İş benim için yeni bir deneyimdi.)", "rank": 56}, {"word": "give", "type": "Fiil", "meaning": "1. Vermek, hediye etmek.", "full_meaning": "1. Vermek, hediye etmek.\n2. Sunmak, sağlamak (bilgi, söz).\n3. (Fiil + isim) Yapmak (örn: give a speech).", "guide": "Bir şeyi birine geçirmek, ona sahip olma hakkını veya sorumluluğunu bırakmak. Birçok deyimsel fiilin bir parçasıdır.", "examples": "1. I gave her a book for her birthday. (Ona doğum günü için bir kitap verdim.)\n2. Can you give me some advice? (Bana biraz tavsiye verebilir misin?)\n3. He gave a great presentation. (Harika bir sunum yaptı.)", "rank": 57}, {"word": "may", "type": "Yardımcı Fiil", "meaning": "1. (Olasılık) -ebilir, -abilir.", "full_meaning": "1. (Olasılık) -ebilir, -abilir.\n2. (İzin) -ebilirsiniz, -abilirsiniz.\n3. (Dilek) ...-sın diye (may you...).", "guide": "Olasılık veya izin ifade etmek için kullanılan bir yardımcı fiildir. Resmi dilek ifadelerinde de kullanılır.", "examples": "1. It may rain later. (Sonra yağmur yağabilir.)\n2. You may leave the room. (Odadan çıkabilirsiniz.)\n3. May all your dreams come true. (Tüm hayalleriniz gerçek olsun.)", "rank": 58}, {"word": "just", "type": "Zarf / Sıfat", "meaning": "1. Tam, tam olarak.", "full_meaning": "1. Tam, tam olarak.\n2. Biraz önce, demin.\n3. Sadece, yalnızca.\n4. Adil, hakkaniyetli (sıfat).", "guide": "(Zarf) Zaman, miktar veya vurgulama için kullanılır. (Sıfat) Adil, doğru ve makul olan.", "examples": "1. That's just what I wanted! (İşte tam da istediğim buydu!)\n2. She has just left. (Az önce çıktı.)\n3. I'm just looking, thanks. (Sadece bakıyorum, teşekkürler.)\n4. He is a just and fair leader. (O adil ve tarafsız bir liderdir.)", "rank": 59}, {"word": "first", "type": "Sıra Sayısı/Zarf", "meaning": "1. Birinci, ilk (sıra sayısı).", "full_meaning": "1. Birinci, ilk (sıra sayısı).\n2. Önce, ilk olarak (zarf).\n3. (at first) İlk başta, başlangıçta.", "guide": "Sırada en önde gelen. Başka şeylerden önce.", "examples": "1. She won first prize. (Birinci ödülü kazandı.)\n2. First, let me introduce myself. (Öncelikle, kendimi tanıtayım.)\n3. At first, I didn't like him. (İlk başta ondan hoşlanmadım.)", "rank": 60}, {"word": "look", "type": "Fiil / İsim", "meaning": "(Fiil): 1. Bakmak.", "full_meaning": "(Fiil): 1. Bakmak.\n2. Görünmek, ... gibi görünmek.\n3. Aramak.\n(İsim): 4. Bakış, nazar.\n5. Görünüş, tarz.", "guide": "(Fiil) Gözleri bir şeye yöneltmek. (İsim) Bakma eylemi veya birinin genel görünümü.", "examples": "1. Look at that beautiful sunset! (Şu güzel gün batımına bak!)\n2. You look tired today. (Bugün yorgun görünüyorsun.)\n3. I'm looking for my keys. (Anahtarlarımı arıyorum.)\n4. She gave me an angry look. (Bana kızgın bir bakış attı.)", "rank": 61}, {"word": "also", "type": "Zarf", "meaning": "1. Ayrıca, da, dahi.", "full_meaning": "1. Ayrıca, da, dahi.\n2. Bunun yanı sıra.", "guide": "Ek bir bilgi veya benzer bir durum ifade etmek için kullanılır. Genellikle fiilden önce, ama \"be\" fiilinden sonra gelir.", "examples": "1. She speaks English and also French. (İngilizce ve ayrıca Fransızca konuşuyor.)\n2. I was also there. (Ben de oradaydım.)\n3. He not only sings, but also dances. (O sadece şarkı söylemez, aynı zamanda dans da eder.)", "rank": 62}, {"word": "people", "type": "İsim (çoğul)", "meaning": "1. İnsanlar.", "full_meaning": "1. İnsanlar.\n2. Halk, bir yerde yaşayan topluluk.\n3. Millet, ulus.", "guide": "Genel olarak insanlar anlamında kullanılır. Belirli bir grubu veya ulusu tanımlamak için de kullanılabilir.", "examples": "1. Many people enjoy traveling. (Birçok insan seyahat etmekten hoşlanır.)\n2. The local people are very friendly. (Yerel halk çok dost canlısı.)\n3. The Turkish people are known for their hospitality. (Türk milleti misafirperverliğiyle tanınır.)", "rank": 63}, {"word": "very", "type": "Zarf, Sıfat", "meaning": "1. Çok, oldukça (zarf)", "full_meaning": "1. Çok, oldukça (zarf)\n2. Aynı, tam (sıfat, 'the very')\n3. Gerçek, hakiki (sıfat)", "guide": "Bir sıfat veya zarfın derecesini abartmak, güçlendirmek için kullanılan temel bir zarf. Sıfat olarak, vurgu yapmak için \"tam olarak o, aynı\" anlamında kullanılır.", "examples": "1. The movie was very interesting. (Film çok ilginçti.)\n2. You're the very person I wanted to see. (Tam da görmek istediğim kişisin.)\n3. She was determined to find the very truth. (Gerçeğin ta kendisini bulmaya kararlıydı.)", "rank": 64}, {"word": "after", "type": "Edat/Bağlaç/Zarf", "meaning": "1. Sonra, ardından (edat/zarf).", "full_meaning": "1. Sonra, ardından (edat/zarf).\n2. -den sonra (edat).\n3. Peşinden, ardından (zarf).", "guide": "Zaman veya sıra bakımından daha sonra olmayı ifade eder.", "examples": "1. We'll go for a walk after lunch. (Öğle yemeğinden sonra yürüyüşe çıkacağız.)\n2. After you left, it started to rain. (Sen gittikten sonra yağmur yağmaya başladı.)\n3. He arrived shortly after. (Kısa bir süre sonra geldi.)", "rank": 65}, {"word": "because", "type": "Bağlaç", "meaning": "1. Çünkü.", "full_meaning": "1. Çünkü.\n2. (because of) -den dolayı, yüzünden.", "guide": "Bir eylemin veya durumun nedenini açıklamak için kullanılan bağlaç.", "examples": "1. I'm late because the traffic was bad. (Geç kaldım çünkü trafik kötüydü.)\n2. The match was cancelled because of rain. (Maç yağmur yüzünden iptal edildi.)", "rank": 66}, {"word": "way", "type": "İsim", "meaning": "1. Yol, güzergah", "full_meaning": "1. Yol, güzergah\n2. Yöntem, tarz\n3. Mesafe, yol (zaman)", "guide": "Bir yerden bir yere giden rota veya yol. Ayrıca, bir şeyi yapma biçimi veya uzaklık/zaman ifade etmek için kullanılır.", "examples": "1. Can you tell me the way to the station? (Bana istasyona giden yolu söyler misiniz?)\n2. That's not the right way to do it. (Bunu yapmanın doğru yolu bu değil.)\n3. We still have a long way to go. (Gidilecek daha çok yolumuz var.)", "rank": 67}, {"word": "three", "type": "Sayı / İsim", "meaning": "1. Üç (3).", "full_meaning": "1. Üç (3).", "guide": "2'den sonra ve 4'ten önce gelen sayı.", "examples": "1. I have three brothers. (Üç erkek kardeşim var.)\n2. We'll meet at three o'clock. (Saat üçte buluşacağız.)\n3. The answer is on page three. (Cevap üçüncü sayfada.)", "rank": 68}, {"word": "back", "type": "İsim/Sıfat/Zarf/Fiil", "meaning": "1. Sırt, arka (isim).", "full_meaning": "1. Sırt, arka (isim).\n2. Geri, arkaya (zarf).\n3. Desteklemek, geriye doğru gitmek (fiil).", "guide": "Vücudun arkası; geri yön; geçmiş bir zamana dönüş. Fiil olarak desteklemek veya geri gitmek.", "examples": "1. My back hurts. (Sırtım ağrıyor.)\n2. Please come back soon. (Lütfen yakında geri gel.)\n3. I'll back you up on this decision. (Bu kararında seni destekleyeceğim.)", "rank": 69}, {"word": "should", "type": "Yardımcı Fiil", "meaning": "1. ...meli, ...malı (tavsiye/zorunluluk).", "full_meaning": "1. ...meli, ...malı (tavsiye/zorunluluk).\n2. (Olasılık) ...mesi gerekir.\n3. (Geçmişte yapılmayan) ...meliydi.", "guide": "Bir eylemin iyi, doğru veya gerekli olduğunu ifade eder. Ayrıca zayıf bir olasılık veya geçmişe yönelik pişmanlık bildirir.", "examples": "1. You should see a doctor. (Bir doktora gitmelisin.)\n2. They should be here by now. (Şimdiye kadar burada olmaları gerekirdi.)\n3. I should have studied more. (Daha fazla çalışmalıydım.)", "rank": 70}, {"word": "where", "type": "Zarf, Bağlaç", "meaning": "1. Nerede? Nereye? (soru zarfı)", "full_meaning": "1. Nerede? Nereye? (soru zarfı)\n2. -dığı yerde, -diği yere (bağlaç)", "guide": "Yere veya konuma ilişkin soru sormak veya bir yeri işaret etmek için kullanılır.", "examples": "1. Where do you live? (Nerede yaşıyorsun?)\n2. This is the house where I grew up. (Burası büyüdüğüm ev.)\n3. I don't know where he went. (Nereye gittiğini bilmiyorum.)", "rank": 71}, {"word": "day", "type": "İsim", "meaning": "1. Gün (24 saat).", "full_meaning": "1. Gün (24 saat).\n2. Gündüz vakti.\n3. Çağ, dönem.", "guide": "Gece yarısından ertesi gece yarısına kadar olan süre. Ayrıca güneşin gökte olduğu aydınlık saatler.", "examples": "1. There are seven days in a week. (Bir haftada yedi gün vardır.)\n2. I prefer to work during the day. (Gündüz çalışmayı tercih ederim.)\n3. In my day, things were different. (Benim zamanımda/işler farklıydı.)", "rank": 72}, {"word": "such", "type": "Sıfat / Zamir", "meaning": "1. (S) Böyle, öyle.", "full_meaning": "1. (S) Böyle, öyle.\n2. (S) Bu kadar, o kadar.\n3. (Z) ... gibi.", "guide": "Benzerlik veya derece belirtir. \"Like that/this\" (bunun gibi) anlamında kullanılır.", "examples": "1. I've never seen such a beautiful sunset. (Hiç böyle güzel bir gün batımı görmedim.)\n2. He is such a kind person. (O çok kibar bir insan.)\n3. Things such as books and pens. (Kitaplar ve kalemler gibi şeyler.)", "rank": 73}, {"word": "most", "type": "Sıfat / Zamir / Edat/Zarf", "meaning": "1. En çok, en fazla (üstünlük derecesi).", "full_meaning": "1. En çok, en fazla (üstünlük derecesi).\n2. Çoğu, büyük kısmı.\n3. (the most) en (üstünlük belirten).", "guide": "\"Many/much\" kelimelerinin en üstünlük halidir. Ayrıca bir bütünün büyük kısmını ifade eder.", "examples": "1. This is the most interesting book I've ever read. (Bu, okuduğum en ilginç kitap.)\n2. Most people think so. (Çoğu insan öyle düşünüyor.)\n3. What I need most is sleep. (En çok ihtiyacım olan şey uyku.)", "rank": 74}, {"word": "find", "type": "Fiil/İsim", "meaning": "1. Bulmak (fiil).", "full_meaning": "1. Bulmak (fiil).\n2. (Mahkeme) Hüküm vermek (fiil).\n3. Keşif, buluntu (isim).", "guide": "Kayıp veya saklı bir şeyi arayıp ortaya çıkarmak. Resmi bir karara varmak. Değerli veya ilginç bir bulgu.", "examples": "1. I can't find my keys. (Anahtarlarımı bulamıyorum.)\n2. The court found him guilty. (Mahkeme onu suçlu buldu.)\n3. an archaeological find (arkeolojik bir buluntu)", "rank": 75}, {"word": "man", "type": "İsim / Fiil", "meaning": "1. Erkek insan, adam.", "full_meaning": "1. Erkek insan, adam.\n2. İnsan, insanoğlu (genel).\n3. (Bir yeri/ekipmanı) işletmek, donatmak.", "guide": "En yaygın anlamı yetişkin erkek insandır. Ayrıca genel olarak \"insan\" anlamında da kullanılır. Fiil olarak bir görevi yerine getirmek anlamına gelir.", "examples": "1. That man is waiting for the bus. (Şu adam otobüs bekliyor.)\n2. Man has explored the moon. (İnsanoğlu ayı keşfetti.)\n3. We need someone to man the reception desk. (Resepsiyonu işletecek birine ihtiyacımız var.)", "rank": 76}, {"word": "how", "type": "Zarf, Bağlaç", "meaning": "1. Nasıl, ne şekilde.", "full_meaning": "1. Nasıl, ne şekilde.\n2. Ne kadar, ne derece.\n3. (Selam) Nasılsın?", "guide": "Bir şeyin yöntemini, durumunu veya derecesini sorar. \"How are you?\" selamlaşmada kullanılır.", "examples": "1. How do you make this cake? (Bu pastayı nasıl yapıyorsun?)\n2. How old are you? (Kaç yaşındasın?)\n3. How are you? (Nasılsın?)", "rank": 77}, {"word": "down", "type": "Edat/Zarf", "meaning": "1. Aşağı, aşağıya (zarf).", "full_meaning": "1. Aşağı, aşağıya (zarf).\n2. Aşağıya doğru, boyunca (edat).\n3. Üzgün, keyifsiz (sıfat).", "guide": "Daha düşük bir konuma veya seviyeye doğru hareket. Bir çizgi boyunca (down the street). Mutsuz hissetmek.", "examples": "1. Sit down, please. (Lütfen oturun.)\n2. He walked down the road. (Yol boyunca yürüdü.)\n3. I'm feeling a bit down today. (Bugün biraz keyifsiz hissediyorum.)", "rank": 78}, {"word": "through", "type": "Edat / Zarf / Sıfat", "meaning": "Edat: 1. Boyunca, içinden (fiziksel).", "full_meaning": "Edat: 1. Boyunca, içinden (fiziksel).\n2. Sayesinde, vasıtasıyla.\n3. (Sebep) Yüzünden.\nZarf: 4. Baştan sona.\nSıfat: 5. Bitmiş, tamamlanmış.", "guide": "Bir şeyin bir tarafından girip diğer tarafından çıkmak. Aracılık, neden veya bir sürecin tamamlanması anlamlarında kullanılır.", "examples": "1. We walked through the forest. (Ormandan içinden/geçerek yürüdük.)\n2. I got the job through a friend. (İşi bir arkadaş vasıtasıyla/sayesinde buldum.)\n3. Are you through with your homework? (Ödevini bitirdin mi?)", "rank": 79}, {"word": "right", "type": "Sıfat / Zarf / İsim", "meaning": "1. (Sıfat) Doğru, yanlış olmayan.", "full_meaning": "1. (Sıfat) Doğru, yanlış olmayan.\n2. (Sıfat) Sağ (yön).\n3. (İsim) Hak, yetki.", "guide": "Doğruluk, yön veya ahlaki/legal olarak adil olan şey.", "examples": "1. \"That's the right answer.\" (Bu doğru cevap.)\n2. \"Turn right at the corner.\" (Köşeden sağa dön.)\n3. \"You have the right to remain silent.\" (Sessiz kalma hakkınız var.)", "rank": 80}, {"word": "need", "type": "Fiil / İsim", "meaning": "1. İhtiyaç duymak, gereksinmek.", "full_meaning": "1. İhtiyaç duymak, gereksinmek.\n2. Gerek olmak, zorunlu olmak.\n3. İhtiyaç, gereksinim.", "guide": "Bir şeye sahip olma gerekliliği veya isteği.", "examples": "1. I need a new phone. (Yeni bir telefona ihtiyacım var.)\n2. You need to see a doctor. (Bir doktora görünmen gerek.)\n3. There's a need for more hospitals. (Daha fazla hastaneye ihtiyaç var.)", "rank": 81}, {"word": "want", "type": "Fiil, İsim", "meaning": "1. İstemek, arzulamak (fiil)", "full_meaning": "1. İstemek, arzulamak (fiil)\n2. İhtiyacı olmak (fiil)\n3. İstek, eksiklik (isim)", "guide": "Bir şeye sahip olmayı veya bir şeyin olmasını arzulamak. Ayrıca, bir şeyin gerekliliğini (\"The car wants washing\") veya yoksunluğu ifade eder.", "examples": "1. I want a new phone for my birthday. (Doğum günüm için yeni bir telefon istiyorum.)\n2. This plant wants water. (Bu bitkinin suya ihtiyacı var.)\n3. The project failed for want of funding. (Proje fon eksikliğinden dolayı başarısız oldu.)", "rank": 82}, {"word": "mean", "type": "Fiil / Sıfat / İsim", "meaning": "1. Anlamına gelmek, demek istemek.", "full_meaning": "1. Anlamına gelmek, demek istemek.\n2. Cimri, pinti.\n3. Kaba, zalim, kötü niyetli.\n4. (İsim) Ortalama, orta nokta.", "guide": "Çok anlamlı bir kelimedir. En yaygın fiil anlamı \"demek/ifade etmek\", sıfat anlamları ise \"cimri\" veya \"kaba\"dır.", "examples": "1. What does this word mean? (Bu kelime ne anlama geliyor?)\n2. He's too mean to buy a round of drinks. (Bir tur içki ısmarlayamayacak kadar cimri.)\n3. That was a mean thing to say. (Söylenmesi çok kaba bir şeydi.)\n4. The mean of 2, 7, and 9 is 6. (2, 7 ve 9'un ortalaması 6'dır.)", "rank": 83}, {"word": "much", "type": "Sıfat / Zamir / Edat/Zarf", "meaning": "1. Çok, fazla (sayılamayanlarla).", "full_meaning": "1. Çok, fazla (sayılamayanlarla).\n2. (how much?) ne kadar?\n3. Epeyce, hayli.", "guide": "Büyük miktar, ölçü veya dereceyi ifade eder. Sayılamayan isimlerle kullanılır.", "examples": "1. We don't have much time. (Çok zamanımız yok.)\n2. How much does it cost? (Ne kadar tutuyor?)\n3. Thank you very much. (Çok teşekkür ederim.)", "rank": 84}, {"word": "between", "type": "Edat", "meaning": "1. Arasında (iki şey/kişi).", "full_meaning": "1. Arasında (iki şey/kişi).\n2. Ortaklaşa, birlikte.\n3. Arasında seçim yapmak.", "guide": "İki nokta, kişi, şey veya zaman arasındaki ilişkiyi gösterir.", "examples": "1. The bank is between the post office and the library. (Banka postane ile kütüphane arasında.)\n2. We shared the money between us. (Parayı aramızda paylaştık.)\n3. Choose between these two options. (Bu iki seçenek arasından seçim yap.)", "rank": 85}, {"word": "many", "type": "Sıfat / Zamir", "meaning": "1. Çok sayıda, birçok.", "full_meaning": "1. Çok sayıda, birçok.\n2. Pek çok (sayılabilen isimlerle).\n3. Çoğu, birçoğu.", "guide": "Sayılabilir nesnelerin büyük bir miktarını belirtmek için kullanılır. \"Much\" sayılamayanlar için, \"many\" sayılabilenler içindir.", "examples": "1. Many people think so. (Birçok insan öyle düşünüyor.)\n2. How many apples do you want? (Kaç tane elma istiyorsun?)\n3. Many of us were tired. (Birçoğumuz yorgunduk.)", "rank": 86}, {"word": "even", "type": "Zarf/Sıfat", "meaning": "1. Hatta, bile (zarf).", "full_meaning": "1. Hatta, bile (zarf).\n2. Düz, dümdüz (sıfat).\n3. Eşit, dengeli (sıfat).", "guide": "Beklenmeyen veya şaşırtıcı bir ek bilgi verirken kullanılır. Pürüzsüz, engebesiz. Aynı seviyede.", "examples": "1. He didn't even say thank you. (Teşekkür bile etmedi.)\n2. an even surface (düz bir yüzey)\n3. The scores are even. (Skorlar eşit.)", "rank": 87}, {"word": "before", "type": "Edat/Bağlaç/Zarf", "meaning": "1. Önce, evvel (edat/zarf).", "full_meaning": "1. Önce, evvel (edat/zarf).\n2. -den önce (bağlaç).\n3. Önünde (edat).", "guide": "Zaman veya sıra bakımından daha önce olmayı ifade eder.", "examples": "1. I saw her the day before yesterday. (Onu dünden önceki gün gördüm.)\n2. Wash your hands before you eat. (Yemekten önce ellerini yıka.)\n3. He stood before the judge. (Hakimin önünde durdu.)", "rank": 88}, {"word": "good", "type": "Sıfat, İsim", "meaning": "1. (Sıfat) İyi, kaliteli.", "full_meaning": "1. (Sıfat) İyi, kaliteli.\n2. (Sıfat) Uygun, yararlı.\n3. (İsim) İyilik, fayda.", "guide": "Olumlu bir değerlendirme, yüksek kalite veya ahlaki doğruluk ifade eder. \"For good\" kalıbıyla \"sonsuza kadar\" anlamına gelir.", "examples": "1. She is a good friend. (O iyi bir arkadaştır.)\n2. Milk is good for your bones. (Süt kemikleriniz için iyidir/faydalıdır.)\n3. He does a lot of good for the community. (Topluluk için çok iyilik yapar.)", "rank": 89}, {"word": "every", "type": "Belirteç", "meaning": "1. Her (bir).", "full_meaning": "1. Her (bir).\n2. Tüm, bütün.\n3. (every other) Bir atlayarak, her diğer.", "guide": "Bir gruptaki tüm bireyleri tek tek ifade eder. Belirli aralıklarla tekrarlanan şeyler için kullanılır.", "examples": "1. Every child deserves love. (Her çocuk sevgiyi hak eder.)\n2. I go to the gym every day. (Her gün spor salonuna gidiyorum.)\n3. The magazine comes out every other week. (Dergi iki haftada bir çıkar.)", "rank": 90}, {"word": "part", "type": "İsim/Fiil", "meaning": "1. (İsim) Parça, bölüm.", "full_meaning": "1. (İsim) Parça, bölüm.\n2. (İsim) Rol (tiyatro/sinemada).\n3. (Fiil) Ayrılmak, parçalara ayırmak.", "guide": "Bir bütünün bölümlerinden biri. Ayrıca bir oyundaki rol. Fiil olarak ayırma eylemi.", "examples": "1. The hardest part of the job is over. (İşin en zor kısmı bitti.)\n2. She played the part of Juliet. (Juliet rolünü oynadı.)\n3. The crowd parted to let them through. (Kalabalık onların geçmesine izin vermek için ikiye ayrıldı.)", "rank": 91}, {"word": "govern", "type": "Fiil", "meaning": "1. Yönetmek, idare etmek.", "full_meaning": "1. Yönetmek, idare etmek.\n2. Belirlemek, etkilemek (kural/ilke).\n3. (Dilbilgisi) Yönetmek (bir edat/bir hal).", "guide": "Bir ülke, kurum veya grubun kontrolünü ve yönlendirilmesini sağlamak. Bir ilkenin bir şeyi kontrol etmesi.", "examples": "1. The elected officials govern the country. (Seçilmiş yetkililer ülkeyi yönetir.)\n2. The rules that govern the competition are strict. (Yarışmayı yöneten/düzenleyen kurallar katıdır.)\n3. This verb governs the accusative case. (Bu fiil -i halini yönetir.)", "rank": 92}, {"word": "off", "type": "Edat / Edat/Zarf / Sıfat", "meaning": "1. Kapalı, devre dışı, sönük.", "full_meaning": "1. Kapalı, devre dışı, sönük.\n2. Uzakta, dışarıda.\n3. İşten/okuldan) izinli.\n4. -den uzak, -den ayrı.", "guide": "Bir şeyin aktif/çalışır durumda olmadığını, bir yerden ayrılmayı veya mesafeyi ifade eder.", "examples": "1. Turn the lights off. (Işıkları kapat.)\n2. He’s off on holiday. (Tatilde, uzakta.)\n3. I have the day off tomorrow. (Yarın izinliyim.)\n4. Keep off the grass. (Çimlere basmayın.)", "rank": 93}, {"word": "thing", "type": "İsim", "meaning": "1. Şey, nesne.", "full_meaning": "1. Şey, nesne.\n2. Olay, durum.\n3. (things) Eşyalar, kişisel eşyalar.", "guide": "Belirsiz veya adı anılmayan herhangi bir nesne, fikir veya durumu ifade etmek için kullanılan genel bir kelime.", "examples": "1. What is that thing on the table? (Masadaki o şey nedir?)\n2. The funniest thing happened today. (Bugün en komik şey/olay oldu.)\n3. Pack your things; we're leaving. (Eşyalarını topla; gidiyoruz.)", "rank": 94}, {"word": "high", "type": "Sıfat, Zarf, İsim", "meaning": "1. (Sıfat) Yüksek.", "full_meaning": "1. (Sıfat) Yüksek.\n2. (Sıfat) Büyük, fazla (fiyat/derece).\n3. (İsim) En yüksek seviye, zirve.", "guide": "Yerden yukarı doğru büyük mesafesi olan. Miktar veya derece olarak fazla. İsim olarak rekor seviye.", "examples": "1. The mountain is very high. (Dağ çok yüksek.) [Sıfat]\n2. They charge high prices. (Yüksek fiyatlar talep ediyorlar.) [Sıfat]\n3. Oil prices reached a new high. (Petrol fiyatları yeni bir zirve yaptı.) [İsim]", "rank": 95}, {"word": "company", "type": "İsim", "meaning": "1. Şirket, firma.", "full_meaning": "1. Şirket, firma.\n2. Arkadaşlık, birliktelik.\n3. Misafir, ziyaretçi.", "guide": "Ticari faaliyette bulunan organizasyon veya birinin yanında olma durumu.", "examples": "1. He works for an insurance company. (Bir sigorta şirketinde çalışıyor.)\n2. I enjoy your company. (Seninle birlikte olmaktan hoşlanıyorum.)\n3. We're expecting company tonight. (Bu gece misafirimiz var.)", "rank": 96}, {"word": "tell", "type": "Fiil", "meaning": "1. Söylemek, anlatmak.", "full_meaning": "1. Söylemek, anlatmak.\n2. Söylemek (emir, bilgi).\n3. Ayırt etmek, farkını söylemek (tell apart).\n4. Belli etmek, göstermek (emotion).", "guide": "Bilgiyi sözlü olarak iletmek. Ayrıca, farkı anlamak veya bir şeyi açığa vurmak anlamlarında da kullanılır.", "examples": "1. Tell me a story. (Bana bir hikaye anlat.)\n2. He told me to wait here. (Bana burada beklememi söyledi.)\n3. Can you tell the difference between them? (Aralarındaki farkı ayırt edebiliyor musun?)", "rank": 97}, {"word": "child", "type": "İsim", "meaning": "1. Çocuk.", "full_meaning": "1. Çocuk.\n2. Evlat.\n3. (child's play) çok kolay iş.", "guide": "Genç insan, bebeklik ile ergenlik arasında.", "examples": "1. They have three children. (Üç çocukları var.)\n2. She is an only child. (O tek çocuktur.)\n3. This job is child's play for her. (Bu iş onun için çocuk oyuncağı.)", "rank": 98}, {"word": "old", "type": "Sıfat", "meaning": "1. Yaşlı, ihtiyar.", "full_meaning": "1. Yaşlı, ihtiyar.\n2. Eski, köhnemiş.\n3. ... yaşında.", "guide": "Uzun süredir var olan, yaşı ilerlemiş veya yeni olmayan.", "examples": "1. My old teacher retired. (Benim eski öğretmenim emekli oldu.)\n2. This is a very old building. (Bu çok eski bir bina.)\n3. How old are you? (Kaç yaşındasın?)", "rank": 99}, {"word": "still", "type": "Zarf / Sıfat", "meaning": "1. (Z) Hâlâ, henüz.", "full_meaning": "1. (Z) Hâlâ, henüz.\n2. (S) Hareketsiz, durgun.\n3. (Z) Bununla birlikte, yine de.", "guide": "Devam eden bir durumu veya hareketsizliği ifade eder. Ayrıca \"buna rağmen\" anlamında bağlaç gibi kullanılır.", "examples": "1. Are you still here? (Hâlâ burada mısın?)\n2. Please stand still. (Lütfen hareketsiz dur.)\n3. It was raining. Still, we went out. (Yağmur yağıyordu. Yine de dışarı çıktık.)", "rank": 100}, {"word": "feel", "type": "Fiil/İsim", "meaning": "1. Hissetmek (fiil).", "full_meaning": "1. Hissetmek (fiil).\n2. Dokunmak, ellemek (fiil).\n3. Hissiyat, duygu (isim).", "guide": "Fiziksel veya duygusal bir duyguya sahip olmak. Elle temas ederek anlamaya çalışmak. Bir şey hakkındaki genel izlenim.", "examples": "1. I feel tired. (Kendimi yorgun hissediyorum.)\n2. Feel how soft this fabric is. (Bu kumaşın ne kadar yumuşak olduğunu hissedin.)\n3. The room has a cozy feel. (Odanın sıcak bir havası var.)", "rank": 101}, {"word": "house", "type": "İsim, Fiil", "meaning": "1. (İsim) Ev, konut.", "full_meaning": "1. (İsim) Ev, konut.\n2. (İsim) Meclis, şirket.\n3. (Fiil) Barındırmak, yerleştirmek.", "guide": "İnsanların yaşadığı bina. Bir organizasyon veya yasama meclisi. İnsanlara veya şeylere barınak sağlamak.", "examples": "1. They live in a big house. (Büyük bir evde yaşıyorlar.)\n2. She works for a publishing house. (Bir yayın evinde çalışıyor.)\n3. The building can house up to 500 students. (Bina 500 öğrenciyi barındırabilir.)", "rank": 102}, {"word": "act", "type": "Fiil/İsim", "meaning": "1. Hareket etmek, davranmak (fiil).", "full_meaning": "1. Hareket etmek, davranmak (fiil).\n2. Rol yapmak, oynamak (fiil).\n3. Davranış, hareket; kanun; perde (isim).", "guide": "Bir şey yapmak veya bir şey yapıyormuş gibi davranmak. İsim olarak eylem veya tiyatro perdesi anlamına gelir.", "examples": "1. We must act quickly. (Hızlı hareket etmeliyiz.)\n2. He acted surprised, but he already knew. (Şaşırmış gibi davrandı, ama zaten biliyordu.)\n3. It was an act of kindness. (Bu bir iyilik hareketiydi.)", "rank": 103}, {"word": "great", "type": "Sıfat, Ünlem", "meaning": "1. Büyük, muazzam.", "full_meaning": "1. Büyük, muazzam.\n2. Harika, çok iyi.\n3. Önemli, ünlü.", "guide": "Boyut, derece veya kalite olarak yüksek seviyede olan. Çok olumlu bir değerlendirme yapar.", "examples": "1. The Great Wall of China is impressive. (Çin Seddi muazzamdır.)\n2. That's a great idea! (Bu harika bir fikir!)\n3. He is one of the great composers. (O, büyük bestecilerden biridir.)", "rank": 104}, {"word": "must", "type": "Yardımcı Fiil / İsim", "meaning": "1. (Zorunluluk) -meli, -malı.", "full_meaning": "1. (Zorunluluk) -meli, -malı.\n2. (Kesinlik) -mış olmalı, kesinlikle.\n3. (İsim) Zorunluluk, şart.", "guide": "Güçlü bir zorunluluk veya yüksek olasılık ifade eder. İsim olarak vazgeçilmez şey anlamındadır.", "examples": "1. You must wear a seatbelt. (Emniyet kemeri takmalısın.)\n2. You must be tired after your long journey. (Uzun yolculuğunuzdan sonra yorgun olmalısınız.)\n3. Warm clothes are a must in winter. (Sıcak giysiler kışın bir zorunluluktur.)", "rank": 105}, {"word": "change", "type": "Fiil/İsim", "meaning": "1. Değiştirmek (fiil).", "full_meaning": "1. Değiştirmek (fiil).\n2. Bozdurmak (para) (fiil).\n3. Değişiklik, bozuk para (isim).", "guide": "Bir şeyi başka bir şeyle değiştirmek veya farklı hale getirmek. Para üstü anlamında da kullanılır.", "examples": "1. I need to change my clothes. (Kıyafetlerimi değiştirmem gerekiyor.)\n2. Can you change a €20 note? (20 euroluk banknotu bozabilir misiniz?)\n3. There has been a change of plan. (Planda bir değişiklik oldu.)", "rank": 106}, {"word": "show", "type": "Fiil / İsim", "meaning": "1. (F) Göstermek.", "full_meaning": "1. (F) Göstermek.\n2. (İ) Gösteri, şov.\n3. (F) Ortaya çıkarmak, kanıtlamak.", "guide": "Bir şeyi görünür kılmak veya bir yeteneği sergilemek. İsim olarak eğlence programı.", "examples": "1. Can you show me the way? (Bana yolu gösterebilir misin?)\n2. We watched a great show on TV. (TV'de harika bir şov izledik.)\n3. The data shows a clear trend. (Veriler açık bir eğilim gösteriyor.)", "rank": 107}, {"word": "four", "type": "Sayı", "meaning": "1. Dört (sayı).", "full_meaning": "1. Dört (sayı).", "guide": "Üç ile beş arasındaki sayı.", "examples": "1. There are four seasons in a year. (Bir yılda dört mevsim vardır.)", "rank": 108}, {"word": "place", "type": "İsim/Fiil", "meaning": "1. (İsim) Yer, mekan.", "full_meaning": "1. (İsim) Yer, mekan.\n2. (İsim) Sıra, pozisyon.\n3. (Fiil) Yerleştirmek, koymak.", "guide": "Belirli bir konum veya alan. Ayrıca bir sıralamadaki pozisyon. Fiil olarak bir şeyi bir yere koymak.", "examples": "1. This is my favorite place in the city. (Burası şehirdeki en sevdiğim yer.)\n2. She finished in second place. (İkinci sırada bitirdi.)\n3. Place the book on the table. (Kitabı masanın üzerine koy.)", "rank": 109}, {"word": "own", "type": "Sıfat / Zamir / Fiil", "meaning": "1. Kendi, kendisinin.", "full_meaning": "1. Kendi, kendisinin.\n2. Sahip olmak.\n3. İtiraf etmek, kabullenmek.", "guide": "Bir şeyin birine ait olduğunu vurgular. Fiil olarak sahip olmak veya bir şeyi kabul etmek.", "examples": "1. I saw it with my own eyes. (Onu kendi gözlerimle gördüm.)\n2. He owns three restaurants. (Üç restorana sahiptir.)\n3. She owned that she had made a mistake. (Bir hata yaptığını kabul etti.)", "rank": 110}, {"word": "develop", "type": "Fiil", "meaning": "1. Geliştirmek, ilerletmek.", "full_meaning": "1. Geliştirmek, ilerletmek.\n2. Gelişmek, büyümek.\n3. (Fotoğraf) Banyo etmek.", "guide": "Zaman içinde daha büyük, daha gelişmiş veya daha karmaşık hale getirmek veya gelmek. Bir problemin veya durumun ortaya çıkması.", "examples": "1. They developed a new software. (Yeni bir yazılım geliştirdiler.)\n2. The child is developing normally. (Çocuk normal bir şekilde gelişiyor.)\n3. I need to develop this film. (Bu filmi banyo etmem gerekiyor.)", "rank": 111}, {"word": "put", "type": "Fiil", "meaning": "1. Koymak, yerleştirmek.", "full_meaning": "1. Koymak, yerleştirmek.\n2. İfade etmek, söylemek.\n3. (Bir duruma) sokmak.", "guide": "Bir şeyi belirli bir konuma veya duruma getirmek. Bir düşünceyi kelimelere dökmek.", "examples": "1. Put the book on the table. (Kitabı masanın üzerine koy.)\n2. Let me put it this way: I disagree. (Şöyle diyeyim: Katılmıyorum.)\n3. His words put me in a difficult position. (Onun sözleri beni zor bir duruma soktu.)", "rank": 112}, {"word": "both", "type": "Belirteç/Zamir", "meaning": "1. Her ikisi de, ikisi birden.", "full_meaning": "1. Her ikisi de, ikisi birden.\n2. Hem ... hem (de).", "guide": "İki şeyin, kişinin tamamını ifade eder.", "examples": "1. Both children are at school. (Her iki çocuk da okulda.)\n2. She is both intelligent and kind. (O hem zeki hem de kibar.)\n3. I like them both. (Her ikisini de seviyorum.)", "rank": 113}, {"word": "end", "type": "İsim/Fiil", "meaning": "1. Son, bitiş (isim).", "full_meaning": "1. Son, bitiş (isim).\n2. Son vermek, bitirmek (fiil).\n3. Uç, taraf (isim).", "guide": "Bir şeyin en son kısmı veya zamanı. Bir şeyin bitmesine neden olmak. Bir şeyin fiziksel sınırı.", "examples": "1. The end of the movie was surprising. (Filmin sonu şaşırtıcıydı.)\n2. Let's end this discussion now. (Bu tartışmaya şimdi son verelim.)\n3. Go to the other end of the street. (Sokağın diğer ucuna git.)", "rank": 114}, {"word": "too", "type": "Zarf", "meaning": "1. Çok, aşırı.", "full_meaning": "1. Çok, aşırı.\n2. De / da, ayrıca.\n3. (Olumsuz) ...bile.", "guide": "Aşırılık belirtir veya olumlu bir ekleme yapar.", "examples": "1. This coffee is too hot. (Bu kahve çok sıcak.)\n2. I want to come, too. (Ben de gelmek istiyorum.)\n3. It's never too late to learn. (Öğrenmek için asla geç değildir.)", "rank": 115}, {"word": "five", "type": "Sayı", "meaning": "1. Beş (sayı).", "full_meaning": "1. Beş (sayı).", "guide": "Dört ile altı arasındaki sayı.", "examples": "1. I'll be there in five minutes. (Beş dakika içinde orada olacağım.)", "rank": 116}, {"word": "become", "type": "Fiil", "meaning": "1. Olmak, haline gelmek.", "full_meaning": "1. Olmak, haline gelmek.\n2. Yakışmak, gitmek (birine).\n3. (Become of) -e olmak, başına gelmek.", "guide": "Bir durumdan başka bir duruma geçmek, dönüşmek.", "examples": "1. He wants to become a pilot. (Pilot olmak istiyor.)\n2. That dress really becomes you. (O elbise sana gerçekten çok yakışıyor.)\n3. What will become of us? (Bize ne olacak?)", "rank": 117}, {"word": "late", "type": "Sıfat / Zarf", "meaning": "1. Geç, gecikmiş.", "full_meaning": "1. Geç, gecikmiş.\n2. Merhum, rahmetli.\n3. Son dönemlerdeki, geç (dönem).", "guide": "Planlanan, beklenen veya normal zamandan sonra olan. Vefat etmiş bir kişi için saygı ifadesi.", "examples": "1. The train is ten minutes late. (Tren on dakika geç kaldı.)\n2. She is always late for appointments. (Randevularına her zaman geç kalır.)\n3. The late president was greatly respected. (Rahmetli cumhurbaşkanı büyük saygı görürdü.)", "rank": 118}, {"word": "move", "type": "Fiil / İsim", "meaning": "1. Hareket etmek, kımıldamak.", "full_meaning": "1. Hareket etmek, kımıldamak.\n2. Taşınmak (ev).\n3. (Duygusal) etkilemek.\n4. Hamle (satranç, iş).", "guide": "Yer değiştirmek veya bir şeyi yerinden oynatmak. İsim olarak bir hareket veya yapılan bir eylem.", "examples": "1. Don't move! (Kımıldama!)\n2. We're moving to a new house next month. (Önümüzdeki ay yeni bir eve taşınıyoruz.)\n3. The story moved me to tears. (Hikaye beni gözyaşlarına boğdu.)\n4. That was a smart move. (Bu akıllıca bir hamleydi.)", "rank": 119}, {"word": "call", "type": "Fiil/İsim", "meaning": "1. Aramak (telefon) (fiil).", "full_meaning": "1. Aramak (telefon) (fiil).\n2. Çağırmak, seslenmek (fiil).\n3. Çağrı, arama (isim).", "guide": "Birine telefon etmek veya seslenmek. İsim olarak telefon konuşması veya ziyaret.", "examples": "1. I'll call you later. (Seni sonra ararım.)\n2. What do you call this in English? (Buna İngilizcede ne denir?)\n3. I got a call from the school. (Okuldan bir arama aldım.)", "rank": 120}, {"word": "point", "type": "İsim/Fiil", "meaning": "1. (İsim) Nokta.", "full_meaning": "1. (İsim) Nokta.\n2. (İsim) Ana fikir, amaç.\n3. (Fiil) İşaret etmek, göstermek.", "guide": "Belirli bir yer veya an. Bir konuşmanın temel amacı. Fiil olarak parmakla göstermek.", "examples": "1. We're meeting at this point on the map. (Haritada bu noktada buluşuyoruz.)\n2. I don't see the point of waiting any longer. (Daha fazla beklemenin anlamını göremiyorum.)\n3. He pointed to the door. (Kapıyı işaret etti.)", "rank": 121}, {"word": "system", "type": "İsim", "meaning": "1. Sistem, düzen.", "full_meaning": "1. Sistem, düzen.\n2. Yöntem, usul.\n3. Vücut sistemi.", "guide": "Birbiriyle ilişkili parçalardan oluşan, bütün olarak çalışan düzenli yapı.", "examples": "1. The solar system. (Güneş sistemi.)\n2. We need a new filing system. (Yeni bir dosyalama sistemine ihtiyacımız var.)\n3. The digestive system. (Sindirim sistemi.)", "rank": 122}, {"word": "case", "type": "İsim", "meaning": "1. Durum, hal, vaka.", "full_meaning": "1. Durum, hal, vaka.\n2. Dava (hukuk).\n3. Kutu, kılıf, çanta.", "guide": "Belirli bir örnek veya durum; hukuki mesele; saklama kabı.", "examples": "1. In that case, we should leave early. (O halde, erken ayrılmalıyız.)\n2. a court case (bir mahkeme davası)\n3. Put your glasses in the case. (Gözlüklerini kılıfına koy.)", "rank": 123}, {"word": "under", "type": "Edat/Zarf", "meaning": "1. Altında, aşağısında (yer)", "full_meaning": "1. Altında, aşağısında (yer)\n2. Altında, emrinde (kontrol/hakimiyet)\n3. Az, daha az (yaş, miktar, süre); Gereğinden az", "guide": "Bir şeyin fiziksel olarak başka bir şeyin altında olduğunu belirtir. Mecazi olarak, bir otoriteye tabi olmayı, bir kurala göre hareket etmeyi veya belirli bir sınırın/standartın altında kalmayı ifade eder.", "examples": "1. The cat is hiding under the table. (Kedi masanın altına saklanıyor.)\n2. She has ten people working under her. (Onun emrinde/altında çalışan on kişi var.)\n3. It's illegal to sell alcohol to anyone under 18. (18 yaşın altındaki herhangi birine alkol satmak yasadışıdır.)", "rank": 124}, {"word": "group", "type": "İsim, Fiil", "meaning": "1. Grup, topluluk.", "full_meaning": "1. Grup, topluluk.\n2. (Fiil) Gruplandırmak, sınıflandırmak.\n3. Müzik grubu.", "guide": "Ortak özellikleri olan insan veya nesne topluluğu. Fiil olarak bir araya getirmek.", "examples": "1. A group of students entered the room. (Bir grup öğrenci odaya girdi.)\n2. Group the books by author. (Kitapları yazara göre gruplandırın.)\n3. My favorite group is performing tonight. (En sevdiğim grup bu gece performans sergiliyor.)", "rank": 125}, {"word": "follow", "type": "Fiil", "meaning": "1. Takip etmek, izlemek.", "full_meaning": "1. Takip etmek, izlemek.\n2. Anlamak, kavramak.\n3. (Kurallar) Uymak, riayet etmek.", "guide": "Fiziksel olarak birinin arkasından gitmek. Bir açıklamayı veya mantığı anlamak. Bir kural veya talimatı yerine getirmek.", "examples": "1. The dog followed me home. (Köpek beni eve kadar takip etti.)\n2. I don't follow your logic. (Mantığınızı anlamıyorum.)\n3. You must follow the instructions. (Talimatlara uymalısınız.)", "rank": 126}, {"word": "little", "type": "Sıfat / Zarf", "meaning": "1. Küçük, ufak.", "full_meaning": "1. Küçük, ufak.\n2. Az, biraz.\n3. Kısa (süre).", "guide": "Boyut veya miktar olarak az olan. \"A little\" biraz anlamına gelirken, \"little\" neredeyse hiç/çok az anlamına gelir.", "examples": "1. She has a little dog. (Küçük bir köpeği var.)\n2. There is little hope of finding survivors. (Kurtulan bulma umudu çok az.) Can I have a little sugar, please? (Biraz şeker alabilir miyim lütfen?)\n3. I'll be back in a little while. (Birazdan döneceğim.)", "rank": 127}, {"word": "play", "type": "Fiil/İsim", "meaning": "1. (Fiil) Oynamak.", "full_meaning": "1. (Fiil) Oynamak.\n2. (Fiil) (Müzik aleti) çalmak.\n3. (İsim) Oyun, piyes.", "guide": "Eğlenmek için oyun oynamak. Bir enstrüman çalmak. Tiyatro oyunu.", "examples": "1. The children are playing in the garden. (Çocuklar bahçede oynuyor.)\n2. Can you play the guitar? (Gitar çalabiliyor musun?)\n3. We went to see a play at the theater. (Tiyatroda bir oyun izlemeye gittik.)", "rank": 128}, {"word": "hand", "type": "İsim, Fiil", "meaning": "1. El.", "full_meaning": "1. El.\n2. (Saat) Akrep/yelkovan.\n3. (Fiil) Uzatmak, vermek.", "guide": "Vücudun bilekten sonraki kısmı. Saatin ibresi. Fiil olarak bir şeyi birine vermek.", "examples": "1. She writes with her left hand. (Sol eliyle yazar.)\n2. The minute hand is broken. (Dakika akrebi kırık.)\n3. Can you hand me the salt? (Bana tuzu uzatır mısın?)", "rank": 129}, {"word": "number", "type": "İsim / Fiil", "meaning": "1. Sayı, rakam.", "full_meaning": "1. Sayı, rakam.\n2. Numara (telefon, ev).\n3. Miktar, sayı.\n4. Numaralamak, saymak; (belirli bir sayıda) olmak.", "guide": "Matematiksel birim veya miktar. Fiil olarak numaralandırmak veya belirli bir sayıya ulaşmak.", "examples": "1. Pick a number between one and ten. (Bir ile on arasında bir sayı seç.)\n2. What's your phone number? (Telefon numaran nedir?)\n3. A large number of people attended. (Çok sayıda insan katıldı.)\n4. The pages are numbered. (Sayfalar numaralandırılmış.)", "rank": 130}, {"word": "same", "type": "Sıfat / Zamir", "meaning": "1. Aynı, farksız.", "full_meaning": "1. Aynı, farksız.\n2. Değişmemiş.\n3. Yukarıda bahsedilen.", "guide": "İki veya daha fazla şeyin birbirinden farklı olmadığını, aynı olduğunu belirtir.", "examples": "1. We have the same car. (Aynı arabaya sahibiz.)\n2. He's the same as always. (O her zamanki gibi/Her zamanki aynı insan.)\n3. I'll have the same (as him). (Bana da aynısından (onunki gibi).)", "rank": 131}, {"word": "seem", "type": "Fiil", "meaning": "1. Görünmek, gibi gelmek.", "full_meaning": "1. Görünmek, gibi gelmek.\n2. Belli olmak, anlaşılmak.\n3. Görünüşe göre.", "guide": "Dışarıdan bir izlenim vermek, öyle görünmek. Gerçeği mutlak olarak ifade etmez.", "examples": "1. You seem tired. (Yorgun görünüyorsun.)\n2. It seems that we're lost. (Görünüşe göre kaybolduk.)\n3. There seems to be a problem. (Bir sorun var gibi görünüyor.)", "rank": 132}, {"word": "woman", "type": "İsim", "meaning": "1. Kadın", "full_meaning": "1. Kadın", "guide": "Yetişkin bir dişi insan.", "examples": "1. She is a strong and independent woman. (O güçlü ve bağımsız bir kadın.)\n2. A group of women started the business. (Bir grup kadın işi kurdu.)\n3. Women's rights are human rights. (Kadın hakları insan haklarıdır.)", "rank": 133}, {"word": "while", "type": "Bağlaç, İsim, Fiil", "meaning": "1. -iken, sırasında (bağlaç)", "full_meaning": "1. -iken, sırasında (bağlaç)\n2. Süre, vakit (isim)\n3. Vakit geçirmek (fiil, 'while away')", "guide": "Aynı anda gerçekleşen iki eylemi bağlar. İsim olarak, bir süreyi ifade eder. Fiil olarak (nadir), vaki
