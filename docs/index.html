nek.", "guide": "Kuşaktan kuşağa aktarılan inanç, davranış veya ritüel.", "examples": "1. It's a family tradition to have dinner together on Sundays. (Pazar günleri birlikte yemek yemek bir aile geleneğidir.)\n2. They broke with tradition and had a modern wedding. (Geleneği bozdular ve modern bir düğün yaptılar.)\n3. The festival is an ancient tradition. (Festival eski bir gelenektir.)", "rank": 610}, {"word": "publish", "type": "Fiil", "meaning": "1. Yayımlamak, basmak (kitap/gazete).", "full_meaning": "1. Yayımlamak, basmak (kitap/gazete).\n2. Açıklamak, duyurmak.\n3. (Yazar) eserini yayımlatmak.", "guide": "Bir kitap, makale veya haberi basılı veya dijital olarak halka sunmak. Resmi bir bilgiyi duyurmak.", "examples": "1. The company publishes educational books. (Şirket eğitim kitapları yayımlıyor.)\n2. The government published the unemployment figures. (Hükümet işsizlik rakamlarını açıkladı.)\n3. He hasn't published anything in years. (Yıllardır hiçbir şey yayımlamadı.)", "rank": 611}, {"word": "farm", "type": "İsim/Fiil", "meaning": "1. Çiftlik (isim).", "full_meaning": "1. Çiftlik (isim).\n2. Çiftçilik yapmak (fiil).\n3. (out) Başkasına yaptırmak (fiil).", "guide": "Tarım ve hayvancılık yapılan arazi ve binalar. Toprağı işleyip ürün yetiştirmek. Bir işi başka bir şirkete vermek.", "examples": "1. They live on a farm. (Bir çiftlikte yaşıyorlar.)\n2. His family has farmed this land for generations. (Ailesi nesillerdir bu toprağı işliyor.)\n3. We farm out our IT support. (BT desteğimizi dışarıya veriyoruz.)", "rank": 612}, {"word": "specific", "type": "Sıfat", "meaning": "1. Belirli, özgü.", "full_meaning": "1. Belirli, özgü.\n2. Spesifik, kesin.\n3. Ayrıntılı, açık.", "guide": "Genel değil, kesin ve net bir şekilde tanımlanmış olan.", "examples": "1. Do you have a specific time in mind? (Aklında belirli bir zaman var mı?)\n2. Give me specific examples. (Bana spesifik/kesin örnekler ver.)\n3. The instructions weren't specific enough. (Talimatlar yeterince ayrıntılı değildi.)", "rank": 613}, {"word": "wife", "type": "İsim", "meaning": "1. Eş (kadın), karı", "full_meaning": "1. Eş (kadın), karı", "guide": "Evli bir erkeğin kadın eşi.", "examples": "1. He introduced us to his wife. (Bizi eşiyle tanıştırdı.)\n2. They have been husband and wife for 20 years. (20 yıldır karı kocalar.)\n3. My wife is a doctor. (Eşim bir doktor.)", "rank": 614}, {"word": "plant", "type": "İsim/Fiil", "meaning": "1. (İsim) Bitki.", "full_meaning": "1. (İsim) Bitki.\n2. (İsim) Fabrika, tesis.\n3. (Fiil) Dikmek, ekmek.\n4. (Fiil) (Gizlice) yerleştirmek.", "guide": "Canlı bitki. Üretim yapılan fabrika. Fiil olarak toprağa ekmek veya gizlice bir şey koymak.", "examples": "1. I water my plants every day. (Bitkilerimi her gün sularım.)\n2. He works at an automobile plant. (Bir otomobil fabrikasında çalışıyor.)\n3. We planted trees in the garden. (Bahçeye ağaçlar diktik.)\n4. The spy planted a listening device. (Casus bir dinleme cihazı yerleştirdi.)", "rank": 615}, {"word": "unit", "type": "İsim", "meaning": "1. Birim (ölçü/hesap)", "full_meaning": "1. Birim (ölçü/hesap)\n2. Ünite, parça (bütünün parçası)\n3. Birlik (askeri/tıbbi)", "guide": "Ölçüm için standart bir miktarı (kilogram, litre), daha büyük bir bütünün ayrı bir bileşenini (daire ünitesi, kitap ünitesi) veya belirli bir işlevi olan örgütlü bir grubu (tıbbi ekip, askeri birlik) ifade eder.", "examples": "1. The meter is a unit of length. (Metre bir uzunluk birimidir.)\n2. We live in unit 4B of the apartment complex. (Apartman kompleksinin 4B numaralı dairesinde yaşıyoruz.)\n3. He served in a military intelligence unit. (Bir askeri istihbarat birliğinde görev yaptı.)", "rank": 616}, {"word": "fit", "type": "Fiil/Sıfat/İsim", "meaning": "1. Uymak, yakışmak (fiil).", "full_meaning": "1. Uymak, yakışmak (fiil).\n2. Formda, sağlıklı (sıfat).\n3. (Nöbet/öksürük) Kriz, nöbet (isim).", "guide": "Boyut, şekil veya amaç bakımından uygun olmak. Fiziksel olarak iyi durumda. Ani ve kontrol edilemeyen bir hareket veya duygu patlaması.", "examples": "1. These shoes don't fit me. (Bu ayakkabılar bana olmuyor.)\n2. He keeps fit by running. (Koşarak formda kalıyor.)\n3. a fit of laughter (bir kahkaha nöbeti)", "rank": 617}, {"word": "dark", "type": "Sıfat/İsim", "meaning": "1. Karanlık, ışıksız (sıfat).", "full_meaning": "1. Karanlık, ışıksız (sıfat).\n2. Koyu renk (sıfat).\n3. Karanlık, akşam (isim).", "guide": "Işığın yokluğu veya azlığı. Ayrıca siyaha yakın koyu renk tonlarını (dark blue) tanımlar. İsim olarak gecenin başlangıcını ifade eder.", "examples": "1. It gets dark early in winter. (Kışın hava erken kararır.)\n2. She has dark brown hair. (Koyu kahverengi saçları var.)\n3. Come home before dark. (Karanlık olmadan/akşamdan önce eve gel.)", "rank": 618}, {"word": "sir", "type": "İsim", "meaning": "1. Beyefendi, efendim (hitap).", "full_meaning": "1. Beyefendi, efendim (hitap).\n2. Sir (İngiliz şövalyelik unvanı).\n3. (Mektupta) Sayın.", "guide": "Bir erkeğe saygılı bir şekilde hitap etmek için kullanılır.", "examples": "1. Can I help you, sir? (Size yardım edebilir miyim, efendim?)\n2. Sir Paul McCartney. (Sir Paul McCartney.)\n3. Dear Sir or Madam. (Sayın Yetkili.)", "rank": 619}, {"word": "press", "type": "Fiil/İsim", "meaning": "1. (Fiil) Bastırmak, sıkmak.", "full_meaning": "1. (Fiil) Bastırmak, sıkmak.\n2. (Fiil) Israr etmek, üstelemek.\n3. (İsim) Basın, medya.\n4. (İsim) Pres, sıkma makinesi.", "guide": "Fiziksel baskı uygulamak. Bir konuda ısrarcı olmak. Gazete, dergi ve muhabirlerden oluşan topluluk.", "examples": "1. (Fiil) Press the button to start. (Başlatmak için düğmeye basın.)\n2. (Fiil) They pressed him for an answer. (Ona bir cevap için ısrar ettiler.)\n3. (İsim) The event attracted a lot of press attention. (Etkinlik basının büyük ilgisini çekti.)\n4. (İsim) a garlic press (bir sarımsak presi)", "rank": 620}, {"word": "data", "type": "İsim (Çoğul)", "meaning": "1. Veri, bilgi.", "full_meaning": "1. Veri, bilgi.\n2. Delil, dayanak.\n3. (Bilgisayar) İşlenmemiş enformasyon.", "guide": "Gerçekler, istatistikler veya bilgisayar tarafından işlenebilen bilgi parçacıkları. Tekil olarak \"datum\" kullanımı çok nadirdir, genelde \"data\" tekil fiil ile kullanılır.", "examples": "1. We need more data to reach a conclusion. (Bir sonuca varmak için daha fazla veriye ihtiyacımız var.)\n2. The data supports our theory. (Veriler teorimizi destekliyor.)\n3. Back up your data regularly. (Verilerinizi düzenli olarak yedekleyin.)", "rank": 621}, {"word": "indeed", "type": "Zarf, Ünlem", "meaning": "1. Gerçekten, hakikaten.", "full_meaning": "1. Gerçekten, hakikaten.\n2. Aslında, hatta, üstelik.\n3. (Ünlem) Öyle mi!/Hakikaten!", "guide": "Bir ifadeyi vurgulamak veya güçlendirmek için. Ek bilgi veya vurgu katmak için. Şaşkınlık veya onay ifade eder.", "examples": "1. Thank you very much indeed. (Gerçekten çok teşekkür ederim.)\n2. It is a good plan; indeed, it is excellent. (Bu iyi bir plan; aslında, mükemmel.)\n3. \"He won the race.\" \"Indeed?\" (\"Yarışı kazandı.\" \"Öyle mi?\")", "rank": 622}, {"word": "determine", "type": "Fiil", "meaning": "1. Belirlemek, saptamak.", "full_meaning": "1. Belirlemek, saptamak.\n2. Karar vermek, azmetmek.\n3. Etkilemek, şekillendirmek.", "guide": "Bir şeyin nasıl olacağını veya ne olacağını kesin bir şekilde kararlaştırmak veya etkilemek. Bir konuda kesin bir karara varmak.", "examples": "1. Age will be determined by a doctor. (Yaş bir doktor tarafından belirlenecek.)\n2. She determined to finish the project on time. (Projeyi zamanında bitirmeye karar verdi.)\n3. Genes determine our eye color. (Genler göz rengimizi belirler.)", "rank": 623}, {"word": "happy", "type": "Sıfat", "meaning": "1. Mutlu, mesut.", "full_meaning": "1. Mutlu, mesut.\n2. Memnun, sevinçli.\n3. Uygun, isabetli (seçim).", "guide": "Olumlu duygular içinde olmak, sevinçli. Bir şeyden hoşnut olmak. Doğru veya yerinde olan.", "examples": "1. She has a happy smile. (Mutlu bir gülümsemesi var.)\n2. I'm happy with the results. (Sonuçlardan memnunum.)\n3. That wasn't a happy choice of words. (Bu kelime seçimi isabetli olmadı.)", "rank": 624}, {"word": "official", "type": "Sıfat / İsim", "meaning": "1. Resmi.", "full_meaning": "1. Resmi.\n2. Yetkili, görevli.\n3. Yetkili kişi, memur.", "guide": "Bir otorite tarafından onaylanmış veya yetki verilmiş kişi.", "examples": "1. This is the official website. (Bu resmi web sitesidir.)\n2. The news is not yet official. (Haber henüz resmi değil.)\n3. Government officials attended the meeting. (Hükümet yetkilileri toplantıya katıldı.)", "rank": 625}, {"word": "regard", "type": "Fiil / İsim", "meaning": "1. (Fiil) Olarak görmek, değerlendirmek.", "full_meaning": "1. (Fiil) Olarak görmek, değerlendirmek.\n2. (Fiil) İlgilendirmek, alakadar etmek.\n3. (İsim) Saygı, hürmet.", "guide": "Bir şeye veya birine belirli bir şekilde bakmak veya onun hakkında düşünmek.", "examples": "1. \"She is regarded as an expert in her field.\" (O, kendi alanında bir uzman olarak görülüyor.)\n2. \"This matter regards all of us.\" (Bu mesele hepimizi ilgilendirir.)\n3. \"He is held in high regard by his colleagues.\" (Meslektaşları tarafından çok saygı görür.)", "rank": 626}, {"word": "bed", "type": "İsim", "meaning": "1. Yatak.", "full_meaning": "1. Yatak.\n2. (Nehir/çiçek) yatağı.\n3. Taban, temel.", "guide": "Uyumak için kullanılan mobilya. Mecazi olarak bir şeyin üzerine oturduğu yer.", "examples": "1. It's time to go to bed. (Yatma zamanı.)\n2. a river bed (bir nehir yatağı)\n3. a flower bed (bir çiçek tarhı)", "rank": 627}, {"word": "wall", "type": "İsim, Fiil", "meaning": "1. Duvar (isim)", "full_meaning": "1. Duvar (isim)\n2. Çevirmek, duvarla kapatmak (fiil)\n3. Engel, sınır (mecazi)", "guide": "Bir yapıyı oluşturan veya bir alanı çevreleyen dikey yapı. Mecazi olarak, iletişimi engelleyen soyut bir şey veya duvar örme eylemi için kullanılır.", "examples": "1. Hang the picture on that wall. (Resmi şu duvara as.)\n2. The garden is walled in for privacy. (Bahçe mahremiyet için duvarla çevrilidir.)\n3. There seems to be a wall of misunderstanding between them. (Aralarında bir yanlış anlama duvarı var gibi görünüyor.)", "rank": 628}, {"word": "serious", "type": "Sıfat", "meaning": "1. Ciddi.", "full_meaning": "1. Ciddi.\n2. Ağır, önemli.\n3. Ciddi, şakacı olmayan.", "guide": "Önemli, dikkat gerektiren veya şaka içermeyen bir durumu ifade eder.", "examples": "1. This is a serious matter. (Bu ciddi bir konu.)\n2. He has a serious illness. (Ciddi/Ağır bir hastalığı var.)\n3. Are you serious? (Ciddi misin?)", "rank": 629}, {"word": "equal", "type": "Sıfat/Fiil/İsim", "meaning": "1. Eşit, aynı (sıfat).", "full_meaning": "1. Eşit, aynı (sıfat).\n2. Eşit olmak, denk gelmek (fiil).\n3. Eş, denk (isim).", "guide": "Aynı miktarda, boyutta, değerde veya statüde olan. Matematiksel olarak aynı değere sahip olmak. Birine eşit olan kişi.", "examples": "1. All people are equal. (Bütün insanlar eşittir.)\n2. Two plus two equals four. (İki artı iki eşittir dört.)\n3. She treats her employees as equals. (Çalışanlarına eşitmiş gibi davranır.)", "rank": 630}, {"word": "effective", "type": "Sıfat", "meaning": "1. Etkili, tesirli.", "full_meaning": "1. Etkili, tesirli.\n2. Fiilen geçerli, yürürlükte olan.\n3. (Görsel) Etkileyici, çarpıcı.", "guide": "İstenilen sonucu üreten, başarılı. Resmi olarak başlamış olan (tarih). Göze hoş gelen.", "examples": "1. an effective treatment (etkili bir tedavi)\n2. The agreement is effective from January 1st. (Anlaşma 1 Ocak'tan itibaren geçerlidir.)\n3. an effective use of color (renklerin etkileyici kullanımı)", "rank": 631}, {"word": "story", "type": "İsim", "meaning": "1. Hikaye, öykü.", "full_meaning": "1. Hikaye, öykü.\n2. Kat (bina).\n3. (Gazete) Haber.", "guide": "Gerçek veya hayali olayların anlatımı. Ayrıca binanın katı (ABD İngilizcesi).", "examples": "1. Tell me a story. (Bana bir hikaye anlat.)\n2. She lives on the third story. (Üçüncü katta yaşıyor.)\n3. The front-page story. (Manşet haberi.)", "rank": 632}, {"word": "culture", "type": "İsim", "meaning": "1. Kültür.", "full_meaning": "1. Kültür.\n2. (Bakteri) kültürü.\n3. Yetiştirme, üretme.", "guide": "Bir toplumun sanatı, inançları, gelenekleri ve sosyal davranışları.", "examples": "1. Japanese culture is fascinating. (Japon kültürü büyüleyicidir.)\n2. pop culture (popüler kültür)\n3. a blood culture (bir kan kültürü)", "rank": 633}, {"word": "legal", "type": "Sıfat", "meaning": "1. Yasal, kanuni.", "full_meaning": "1. Yasal, kanuni.\n2. Hukuki, hukukla ilgili.\n3. Geçerli, muteber.", "guide": "Yasaya uygun olan veya hukukla ilgili olan.", "examples": "1. Is it legal to park here? (Buraya park etmek yasal mı?)\n2. I need some legal advice. (Biraz hukuki tavsiyeye ihtiyacım var.)\n3. The document is not legal without a signature. (Belge imza olmadan geçerli değildir.)", "rank": 634}, {"word": "hospital", "type": "İsim", "meaning": "1. Hastane.", "full_meaning": "1. Hastane.", "guide": "Hasta ve yaralıların tedavi edildiği kurum.", "examples": "1. He was taken to hospital after the accident. (Kazadan sonra hastaneye kaldırıldı.)", "rank": 635}, {"word": "chapter", "type": "İsim", "meaning": "1. Bölüm (kitap).", "full_meaning": "1. Bölüm (kitap).\n2. Dönem, evre (hayat).\n3. Şube (organizasyon).", "guide": "Kitabın ana bölümlerinden biri veya hayatın bir dönemi.", "examples": "1. Read the first chapter for homework. (Ev ödevi için ilk bölümü okuyun.)\n2. a new chapter in my life (hayatımda yeni bir sayfa)\n3. the local chapter of the club (kulübün yerel şubesi)", "rank": 636}, {"word": "lay", "type": "Fiil", "meaning": "1. Yatırmak, koymak (yatay).", "full_meaning": "1. Yatırmak, koymak (yatay).\n2. (Yumurta) Yumurtlamak.\n3. Hazırlamak, sermek (sofra).", "guide": "Bir şeyi dikkatlice yatay veya düz bir konuma yerleştirmek. Kuş veya sürüngenlerin yumurta çıkarması.", "examples": "1. He laid the book on the table. (Kitabı masanın üzerine koydu.)\n2. Our hens lay eggs every day. (Tavuklarımız her gün yumurtlar.)\n3. Could you lay the table for dinner? (Akşam yemeği için masayı hazırlayabilir misin?)", "rank": 637}, {"word": "blood", "type": "İsim", "meaning": "1. Kan.", "full_meaning": "1. Kan.\n2. Soy, nesil.\n3. (in cold blood) soğukkanlılıkla.", "guide": "Damarlarda dolaşan kırmızı sıvı. Aile bağlarını ifade eder.", "examples": "1. He gave blood at the hospital. (Hastanede kan verdi.)\n2. They are related by blood. (Kan bağıyla akrabalar.)\n3. blood pressure (kan basıncı)", "rank": 638}, {"word": "function", "type": "İsim/Fiil", "meaning": "1. İşlev, görev (isim).", "full_meaning": "1. İşlev, görev (isim).\n2. (Matematik) Fonksiyon (isim).\n3. İşlemek, çalışmak (fiil).", "guide": "Belirli bir amaç veya rol. Matematiksel ilişki. Düzgün çalışmak veya çalışır durumda olmak.", "examples": "1. The function of the heart is to pump blood. (Kalbin işlevi kan pompalamaktır.)\n2. a linear function (doğrusal bir fonksiyon)\n3. My phone isn't functioning properly. (Telefonum düzgün çalışmıyor.)", "rank": 639}, {"word": "suppose", "type": "Fiil", "meaning": "1. Varsaymak, farz etmek.", "full_meaning": "1. Varsaymak, farz etmek.\n2. Sanmak, zannetmek.\n3. Gerektirmek, şart koşmak.", "guide": "Doğru olduğunu kesin olarak bilmeden bir şeyi kabul etmek veya düşünmek.", "examples": "1. I suppose you're right. (Sanırım haklısın.)\n2. Suppose we miss the train, what then? (Diyelim ki treni kaçırdık, o zaman ne olacak?)\n3. You're supposed to be here at nine. (Saat dokuzda burada olman gerekiyor.)", "rank": 640}, {"word": "fight", "type": "Fiil/İsim", "meaning": "1. Dövüşmek, kavga etmek (fiil).", "full_meaning": "1. Dövüşmek, kavga etmek (fiil).\n2. Savaşmak, mücadele etmek (fiil).\n3. Kavga, dövüş (isim).", "guide": "Fiziksel şiddetle mücadele etmek. Bir şeye karşı veya bir amaç için çabalamak. Fiziksel veya sözlü çatışma.", "examples": "1. The two boys were fighting. (İki çocuk kavga ediyordu.)\n2. We must fight against injustice. (Adaletsizlikle savaşmalıyız.)\n3. He got into a fight at school. (Okulda bir kavgaya karıştı.)", "rank": 641}, {"word": "indicate", "type": "Fiil", "meaning": "1. Göstermek, işaret etmek.", "full_meaning": "1. Göstermek, işaret etmek.\n2. Belirtmek, ifade etmek.\n3. (Araç) Sinyal vermek, dönüş lambasını yakmak.", "guide": "Bir şeyin varlığına, doğruluğuna işaret etmek veya onu göstermek. Açıkça söylemek veya sözle ifade etmek. Yön değiştireceğini sinyalle bildirmek.", "examples": "1. Research indicates that exercise is beneficial. (Araştırmalar egzersizin faydalı olduğunu gösteriyor.)\n2. He indicated his agreement with a nod. (Onayını başıyla belirtti.)\n3. Remember to indicate before you turn. (Dönmeden önce sinyal vermeyi unutma.)", "rank": 642}, {"word": "secretary", "type": "İsim", "meaning": "1. Sekreter.", "full_meaning": "1. Sekreter.\n2. Bakan (Siyasi).\n3. Yazman, genel sekreter.", "guide": "Yazışmaları yöneten, randevuları organize eden kişi veya bir organizasyonda idari lider.", "examples": "1. She works as a secretary. (Bir sekreter olarak çalışıyor.)\n2. The Secretary of State will visit. (Dışişleri Bakanı ziyaret edecek.)\n3. He is the secretary of the club. (O, kulübün genel sekreteridir.)", "rank": 643}, {"word": "choose", "type": "Fiil", "meaning": "1. Seçmek, tercih etmek.", "full_meaning": "1. Seçmek, tercih etmek.\n2. Karar vermek.\n3. (can't choose but) -mekten başka çaresi olmamak.", "guide": "Birkaç olasılık arasından birini seçmek.", "examples": "1. Choose the color you like best. (En çok beğendiğin rengi seç.)\n2. I chose to stay home. (Evde kalmayı tercih ettim.)\n3. You were chosen for the team. (Takım için seçildin.)", "rank": 644}, {"word": "officer", "type": "İsim", "meaning": "1. Subay, askeri personel.", "full_meaning": "1. Subay, askeri personel.\n2. Memur, yetkili (polis, devlet).\n3. (Gemi) zabiti.", "guide": "Askeri veya resmi bir organizasyonda yetkili kişi.", "examples": "1. He is an officer in the navy. (O, donanmada bir subaydır.)\n2. Please speak to the immigration officer. (Lütfen göçmenlik memuruyla konuşun.)", "rank": 645}, {"word": "drink", "type": "Fiil/İsim", "meaning": "1. İçmek (fiil).", "full_meaning": "1. İçmek (fiil).\n2. İçecek (isim).\n3. Alkol, içki (isim).", "guide": "Sıvıyı ağızdan almak. İçilen herhangi bir sıvı. Alkol içeren içecekler.", "examples": "1. Drink plenty of water. (Bol su iç.)\n2. Would you like a drink? (Bir içecek ister misiniz?)\n3. He doesn't touch drink. (İçkiye el sürmez.)", "rank": 646}, {"word": "join", "type": "Fiil", "meaning": "1. Katılmak, iştirak etmek.", "full_meaning": "1. Katılmak, iştirak etmek.\n2. Birleştirmek, bir araya getirmek.\n3. (Yola, yere) Ulaşmak, varmak.", "guide": "Bir gruba, organizasyona dahil olmak veya iki veya daha fazla şeyi fiziksel olarak birbirine bağlamak/eklemek.", "examples": "1. I decided to join the chess club. (Satranç kulübüne katılmaya karar verdim.)\n2. Join the two pieces of rope together. (İki ip parçasını birbirine birleştir.)\n3. I'll join you at the restaurant in ten minutes. (On dakikaya kadar restoranda size katılırım.)", "rank": 647}, {"word": "attack", "type": "İsim/Fiil", "meaning": "1. Saldırmak, hücum etmek (fiil).", "full_meaning": "1. Saldırmak, hücum etmek (fiil).\n2. Saldırı, hücum (isim).\n3. (Hastalık) nöbeti.", "guide": "Fiziksel veya sözlü şiddetle karşı koymak; bir işe hevesle başlamak.", "examples": "1. The dog attacked the intruder. (Köpek davetsiz misafire saldırdı.)\n2. The country came under attack. (Ülke saldırı altına alındı.)\n3. a heart attack (kalp krizi)", "rank": 648}, {"word": "cross", "type": "İsim/Fiil/Sıfat", "meaning": "1. Haç, çarpı işareti (isim).", "full_meaning": "1. Haç, çarpı işareti (isim).\n2. Geçmek, karşıya geçmek (fiil).\n3. Sinirli, kızgın (sıfat).", "guide": "İki çizginin kesiştiği şekil. Fiil olarak bir çizgiyi/ yolu geçmek.", "examples": "1. Make a cross next to the correct answer. (Doğru cevabın yanına bir çarpı işareti koyun.)\n2. Cross the road at the pedestrian crossing. (Yolu yaya geçidinden geçin.)\n3. Why are you so cross? (Neden bu kadar sinirlisin?)", "rank": 649}, {"word": "red", "type": "Sıfat / İsim", "meaning": "1. (Sıfat) Kırmızı.", "full_meaning": "1. (Sıfat) Kırmızı.\n2. (Sıfat) Kızıl saçlı.\n3. (İsim) Kırmızı renk, kızıl.", "guide": "Bir renk. Siyasi anlamda sol/sosyalist partileri de temsil eder.", "examples": "1. \"She was wearing a red dress.\" (Kırmızı bir elbise giyiyordu.)\n2. \"He has red hair and freckles.\" (Kızıl saçları ve çilleri var.)\n3. \"The room was painted in a bright red.\" (Oda parlak bir kırmızıya boyanmıştı.)", "rank": 650}, {"word": "smile", "type": "İsim / Fiil", "meaning": "1. (İ) Gülümseme.", "full_meaning": "1. (İ) Gülümseme.\n2. (F) Gülümsemek.\n3. (İ) İlgi, lütuf.", "guide": "Genellikle mutluluk, memnuniyet veya dostluk ifade etmek için dudakların kıvrılması.", "examples": "1. She has a beautiful smile. (Güzel bir gülümsemesi var.)\n2. He smiled at me. (Bana gülümsedi.)\n3. Fortune smiled on us that day. (O gün şans bize güldü.)", "rank": 651}, {"word": "scheme", "type": "İsim / Fiil", "meaning": "1. (İ) Plan, proje (resmi).", "full_meaning": "1. (İ) Plan, proje (resmi).\n2. (İ) Düzen, dolap.\n3. (F) Plan yapmak, düzen kurmak.", "guide": "Genellikle ayrıntılı ve bazen gizli bir plan. Çoğunlukla olumsuz, dolap anlamında kullanılır.", "examples": "1. The government introduced a new pension scheme. (Hükümet yeni bir emeklilik planı sundu.)\n2. He was involved in a fraud scheme. (Bir sahtekarlık düzenine karışmıştı.)\n3. They were scheming to take over the company. (Şirketi devralmak için plan yapıyorlardı.)", "rank": 652}, {"word": "due", "type": "Sıfat/İsim", "meaning": "1. Gereken, beklenen (sıfat).", "full_meaning": "1. Gereken, beklenen (sıfat).\n2. Vadesi gelmiş, ödenmesi gerekli (sıfat).\n3. (due to) -den dolayı.", "guide": "Planlanan zamanda gerçekleşmesi beklenen. Ödenecek bir borç veya ücret olan. Bir şeyin nedeni olarak.", "examples": "1. The report is due next Friday. (Rapor gelecek Cuma günü teslim edilecek.)\n2. The rent is due on the first of the month. (Kira ayın birinde ödenir.)\n3. The flight was cancelled due to bad weather. (Uçuş kötü hava koşulları nedeniyle iptal edildi.)", "rank": 653}, {"word": "foreign", "type": "Sıfat", "meaning": "1. Yabancı, dış.", "full_meaning": "1. Yabancı, dış.\n2. Yabancı ülkeye ait.\n3. Alışılmadık, tuhaf.", "guide": "Kendi ülkesi dışındaki bir ülkeye ait olan. Başka bir ülkeden gelen. Bir şeye yabancı olmak.", "examples": "1. a foreign language (bir yabancı dil)\n2. foreign trade (dış ticaret)\n3. Lying is foreign to his nature. (Yalan söylemek onun doğasına aykırıdır.)", "rank": 654}, {"word": "define", "type": "Fiil", "meaning": "1. Tanımlamak, tarif etmek.", "full_meaning": "1. Tanımlamak, tarif etmek.\n2. Sınırlarını çizmek, belirlemek.\n3. Karakterize etmek, simgesi olmak.", "guide": "Bir kelime veya kavramın anlamını açık ve kesin bir şekilde açıklamak. Bir şeyin sınırlarını veya niteliklerini netleştirmek.", "examples": "1. Can you define 'success'? ('Başarı'yı tanımlayabilir misin?)\n2. The treaty defined the border. (Antlaşma sınırı belirledi.)\n3. Hard work defines his character. (Sıkı çalışma onun karakterini tanımlar.)", "rank": 655}, {"word": "seek", "type": "Fiil", "meaning": "1. Aramak, peşinde olmak.", "full_meaning": "1. Aramak, peşinde olmak.\n2. İstemek, talep etmek.\n3. Çabalamak, gayret etmek.", "guide": "Bir şeyi aktif olarak bulmaya veya elde etmeye çalışmak. Resmi bir ifadedir.", "examples": "1. They are seeking a new manager. (Yeni bir müdür arıyorlar.)\n2. I seek your advice. (Tavsiyenizi istiyorum.)\n3. We must seek to improve. (Geliştirmek için çabalamalıyız.)", "rank": 656}, {"word": "especially", "type": "Zarf", "meaning": "1. Özellikle, bilhassa.", "full_meaning": "1. Özellikle, bilhassa.\n2. Olağanüstü, alışılmadık derecede.", "guide": "Diğerlerinden daha çok vurgulamak için kullanılır. Sıradanın üzerinde bir derecede.", "examples": "1. I love music, especially classical music. (Müziği, özellikle klasik müziği severim.)\n2. The weather was especially cold for May. (Hava Mayıs ayı için alışılmadık derecede soğuktu.)", "rank": 657}, {"word": "save", "type": "Fiil", "meaning": "1. Kurtarmak.", "full_meaning": "1. Kurtarmak.\n2. Tasarruf etmek, biriktirmek.\n3. (Bilgisayar) Kaydetmek.", "guide": "Bir şeyi tehlikeden veya kayıptan korumak veya gelecek için saklamak/biriktirmek anlamına gelir.", "examples": "1. The firefighter saved the cat. (İtfaiyeci kediyi kurtardı.)\n2. I'm saving money for a holiday. (Tatil için para biriktiriyorum.)\n3. Don't forget to save the document. (Dokümanı kaydetmeyi unutma.)", "rank": 658}, {"word": "feature", "type": "İsim/Fiil", "meaning": "1. Özellik, nitelik (isim).", "full_meaning": "1. Özellik, nitelik (isim).\n2. (Yüz) Hat, çizgi (isim).\n3. Yer vermek, öne çıkarmak (fiil).", "guide": "Bir şeyin dikkat çeken veya tipik bir parçası. Yüzün bir parçası (göz, burun vb.). Bir şeyde önemli bir yer vermek.", "examples": "1. The phone has many new features. (Telefonun birçok yeni özelliği var.)\n2. Her eyes are her best feature. (Gözleri onun en iyi özelliğidir.)\n3. The film features a famous actor. (Filmde ünlü bir aktör yer alıyor.)", "rank": 659}, {"word": "theory", "type": "İsim", "meaning": "1. Teori, kuram.", "full_meaning": "1. Teori, kuram.\n2. Nazariye, varsayım.\n3. (İn practice) Pratikte olmayan fikir.", "guide": "Gözlemlerle desteklenen, ancak kanıtlanmamış genel ilkeler veya bir şeyin nasıl çalıştığına dair fikir.", "examples": "1. Einstein's theory of relativity is famous. (Einstein'ın görelilik teorisi ünlüdür.)\n2. My theory is that he forgot about the meeting. (Varsayımım/Görüşüm, toplantıyı unuttuğu yönünde.)\n3. In theory, it should work, but in practice, it's difficult. (Teoride/Nazariyatta çalışması gerekir, ama pratikte zor.)", "rank": 660}, {"word": "arrive", "type": "Fiil", "meaning": "1. Varmak, gelmek, ulaşmak.", "full_meaning": "1. Varmak, gelmek, ulaşmak.\n2. (Zaman) gelmek.\n3. (Başarı) elde etmek, varmak.", "guide": "Bir yere ulaşmak, gelmek. Mecazi olarak bir hedefe ulaşmak.", "examples": "1. What time does your flight arrive? (Uçuşunuz saat kaçta varıyor?)\n2. The great day finally arrived. (O büyük gün nihayet geldi.)\n3. He felt he had arrived when he got the promotion. (Terfiyi aldığında başarıya ulaştığını hissetti.)", "rank": 661}, {"word": "identify", "type": "Fiil", "meaning": "1. Tanımlamak, kimliğini saptamak.", "full_meaning": "1. Tanımlamak, kimliğini saptamak.\n2. Özdeşleştirmek, kendini bir şeyle bir hissetmek.\n3. Belirlemek, tespit etmek (sorun).", "guide": "Bir şeyin veya birinin ne/nasıl olduğunu söylemek. Kendini bir gruba/duyguya ait hissetmek.", "examples": "1. Can you identify the man in this photo? (Bu fotoğraftaki adamı tanımlayabilir/tanıyabilir misin?)\n2. He identifies strongly with his cultural heritage. (Kendi kültürel mirasıyla güçlü bir şekilde özdeşleşiyor.)\n3. We need to identify the cause of the problem. (Sorunun nedenini belirlememiz gerekiyor.)", "rank": 662}, {"word": "poor", "type": "Sıfat", "meaning": "1. Fakir, yoksul.", "full_meaning": "1. Fakir, yoksul.\n2. Zavallı, acınası.\n3. Kalitesiz, kötü.", "guide": "Parası/imalkanı çok az olan. Kötü durumda olan veya kalitesi düşük olan.", "examples": "1. They come from a poor family. (Fakir bir aileden geliyorlar.)\n2. The poor dog was shivering in the cold. (Zavallı köpek soğukta titriyordu.)\n3. He's in poor health. (Sağlığı kötü.)", "rank": 663}, {"word": "picture", "type": "İsim/Fiil", "meaning": "1. (İsim) Resim, tablo.", "full_meaning": "1. (İsim) Resim, tablo.\n2. (İsim) Fotoğraf.\n3. (Fiil) Hayal etmek, tasavvur etmek.", "guide": "Görsel bir temsil. Fotoğraf, çizim veya boyama olabilir. Fiil olarak zihinde canlandırmak.", "examples": "1. He drew a picture of his house. (Evinin resmini çizdi.)\n2. Let me take a picture of you two. (İkinizin bir fotoğrafını çekeyim.)\n3. Can you picture yourself living here? (Kendini burada yaşarken hayal edebiliyor musun?)", "rank": 664}, {"word": "bill", "type": "İsim", "meaning": "1. Fatura, hesap.", "full_meaning": "1. Fatura, hesap.\n2. Kanun tasarısı.\n3. (Kuş) gagası.", "guide": "Ödenecek paranın yazılı olduğu liste veya parlamentoda tartışılan yasa önerisi.", "examples": "1. Can I have the bill, please? (Hesabı alabilir miyim lütfen?)\n2. The new tax bill was passed. (Yeni vergi tasarısı kabul edildi.)\n3. a duck's bill (bir ördeğin gagası)", "rank": 665}, {"word": "select", "type": "Fiil / Sıfat", "meaning": "1. (F) Seçmek, ayırmak.", "full_meaning": "1. (F) Seçmek, ayırmak.\n2. (S) Seçkin, özenle seçilmiş.\n3. (F) (Bilgisayar) Seçmek, işaretlemek.", "guide": "Bir grup içinden özenle veya dikkatle seçim yapmak. Sıfat olarak seçilmiş, kaliteli.", "examples": "1. Please select a color. (Lütfen bir renk seçin.)\n2. This is a select group of students. (Bu, seçkin bir öğrenci grubudur.)\n3. Select the text and press copy. (Metni seçin ve kopyala'ya basın.)", "rank": 666}, {"word": "depend", "type": "Fiil", "meaning": "1. Bağlı olmak, -e göre değişmek (on/upon).", "full_meaning": "1. Bağlı olmak, -e göre değişmek (on/upon).\n2. Güvenmek, itimat etmek (on).\n3. (İt depends) Duruma göre değişir.", "guide": "Bir şeyin gerçekleşmesi veya doğru olması için başka bir şeyin gerekli olması veya etkili olması.", "examples": "1. Success depends on hard work. (Başarı sıkı çalışmaya bağlıdır.)\n2. You can depend on me. (Bana güvenebilirsin.)\n3. \"Are you coming?\" \"It depends on the weather.\" (\"Geliyor musun?\" \"Havaya bağlı.\")", "rank": 667}, {"word": "recognize", "type": "Fiil", "meaning": "1. Tanımak, fark etmek.", "full_meaning": "1. Tanımak, fark etmek.\n2. Resmen kabul etmek, tanımak.\n3. Takdir etmek, onaylamak.", "guide": "Daha önce gördüğünüz veya bildiğiniz birini/bir şeyi fark etmek veya bir şeyin geçerliliğini/doğruluğunu resmen kabul etmek.", "examples": "1. \"I recognized her voice immediately.\" (Sesini hemen tanıdım.)\n2. \"The government refused to recognize the new state.\" (Hükümet yeni devleti tanımayı reddetti.)\n3. \"His hard work was recognized with an award.\" (Onun sıkı çalışması bir ödülle takdir edildi.)", "rank": 668}, {"word": "paint", "type": "Fiil/İsim", "meaning": "1. (Fiil) Boyamak.", "full_meaning": "1. (Fiil) Boyamak.\n2. (Fiil) (Bir şeyi) resmetmek, resmini yapmak.\n3. (İsim) Boya.", "guide": "Bir yüzeye renk vermek/boyamak eylemi. Resim sanatında kullanımı yaygındır. İsim olarak kullanılan madde.", "examples": "1. We're going to paint the walls white. (Duvarları beyaza boyayacağız.)\n2. She loves to paint landscapes. (Manzara resimleri yapmayı sever.)\n3. I need to buy some blue paint. (Biraz mavi boya almam gerekiyor.)", "rank": 669}, {"word": "vote", "type": "İsim, Fiil", "meaning": "1. Oy (isim)", "full_meaning": "1. Oy (isim)\n2. Oy vermek (fiil)\n3. Önermek, teklif etmek (fiil, 'vote to do')", "guide": "Bir seçimde tercihini belirtme eylemi veya bu tercihi temsil eden işaret. Fiil olarak, oy kullanmak veya bir şey için oylamak anlamına gelir.", "examples": "1. He won the election by a majority of votes. (Seçimi oy çoğunluğuyla kazandı.)\n2. Did you vote in the last election? (Son seçimde oy kullandın mı?)\n3. The committee voted to approve the plan. (Komite planı onaylamak için oy kullandı.)", "rank": 670}, {"word": "pack", "type": "Fiil", "meaning": "1. (Valiz, çanta) hazırlamak, eşya yerleştirmek.", "full_meaning": "1. (Valiz, çanta) hazırlamak, eşya yerleştirmek.\n2. Sıkıştırmak, doldurmak, tıka basa doldurmak.\n3. (Genellikle 'pack up') toplamak, işi bırakmak.", "guide": "Bir kabın içine eşya yerleştirme/doldurma eylemi. Mecazi olarak bir alanı kalabalıkla doldurmak için de kullanılır.", "examples": "1. I need to pack my suitcase for the trip. (Seyahat için valizimi hazırlamam gerekiyor.)\n2. The stadium was packed with fans. (Stadyum taraftarlarla tıka basa doluydu.)\n3. It's getting late; let's pack up and go home. (Geç oluyor; toplanalım ve eve gidelim.)", "rank": 671}, {"word": "style", "type": "İsim / Fiil", "meaning": "1. (İ) Tarz, stil.", "full_meaning": "1. (İ) Tarz, stil.\n2. (İ) Moda.\n3. (F) Tasarlamak, biçim vermek.", "guide": "Bir şeyin yapılma veya ifade edilme biçimi.", "examples": "1. I like your style of writing. (Yazı tarzını beğeniyorum.)\n2. Her hair is out of style. (Saçı moda değil.)\n3. She styled the photoshoot. (Fotoğraf çekimini tasarladı/stilize etti.)", "rank": 672}, {"word": "influence", "type": "İsim, Fiil", "meaning": "1. (İsim) Etki, nüfuz.", "full_meaning": "1. (İsim) Etki, nüfuz.\n2. (Fiil) Etkilemek.\n3. (İsim) Etkileyen kimse/şey.", "guide": "Bir kişi veya şeyin başkasının davranışı veya düşüncesi üzerindeki gücü. Bu gücü uygulamak. Etkileyen faktör.", "examples": "1. Her parents had a big influence on her. (Ailesinin onun üzerinde büyük bir etkisi oldu.)\n2. Don't let others influence your decision. (Başkalarının kararını etkilemesine izin verme.)\n3. He is a bad influence on his friends. (Arkadaşları üzerinde kötü bir etkisi var.)", "rank": 673}, {"word": "fail", "type": "Fiil", "meaning": "1. Başarısız olmak.", "full_meaning": "1. Başarısız olmak.\n2. (Sınav) Kalmak, geçememek.\n3. (Makine) Bozulmak, arızalanmak.", "guide": "Bir şeyi yapmayı başaramamak. Bir sınavda yeterli puan alamamak. Çalışmayı durdurmak.", "examples": "1. I tried to fix it, but I failed. (Onu tamir etmeyi denedim ama başaramadım.)\n2. He failed his driving test. (Ehliyet sınavında kaldı.)\n3. The brakes failed. (Frenler arızalandı.)", "rank": 674}, {"word": "observe", "type": "Fiil", "meaning": "1. Gözlemlemek, izlemek.", "full_meaning": "1. Gözlemlemek, izlemek.\n2. Fark etmek, dikkat etmek.\n3. (Yasa, geleneği) uymak, yerine getirmek.", "guide": "Dikkatle bakmak ve incelemek veya bir kurala uymak.", "examples": "1. Observe the birds in their natural habitat. (Kuşları doğal yaşam alanlarında gözlemleyin.)\n2. I observed that he was very nervous. (Onun çok gergin olduğunu fark ettim.)\n3. Do you observe Ramadan? (Ramazan orucunu tutar mısınız?)", "rank": 675}, {"word": "occur", "type": "Fiil", "meaning": "1. Meydana gelmek, olmak.", "full_meaning": "1. Meydana gelmek, olmak.\n2. (Fikir) aklına gelmek.\n3. Bulunmak, rastlanmak (doğada).", "guide": "Planlanmamış bir şekilde gerçekleşmek veya zihinde belirmek.", "examples": "1. The accident occurred at midnight. (Kaza gece yarısı meydana geldi.)\n2. It never occurred to me to ask for help. (Yardım istemek hiç aklıma gelmedi.)\n3. This plant occurs only in rainforests. (Bu bitki sadece yağmur ormanlarında bulunur.)", "rank": 676}, {"word": "garden", "type": "İsim, Fiil", "meaning": "1. Bahçe.", "full_meaning": "1. Bahçe.\n2. (Fiil) Bahçıvanlık yapmak.\n3. (Genellikle çoğul) Park, botanik bahçesi.", "guide": "Evin yakınındaki çiçek, sebze yetiştirilen veya dinlenilen açık alan. Fiil olarak bahçede çalışmak anlamındadır.", "examples": "1. The children are playing in the garden. (Çocuklar bahçede oynuyor.)\n2. My grandmother loves to garden. (Büyükannem bahçe işleri yapmayı çok sever.)\n3. We visited the Kew Gardens in London. (Londra'daki Kew Bahçelerini ziyaret ettik.)", "rank": 677}, {"word": "arrange", "type": "Fiil", "meaning": "1. Düzenlemek, ayarlamak.", "full_meaning": "1. Düzenlemek, ayarlamak.\n2. Planlamak, organize etmek.\n3. (Müzik) düzenlemek, aranje etmek.", "guide": "Bir şeyi belirli bir sıraya veya düzene koymak veya bir etkinliğin gerçekleşmesini sağlamak.", "examples": "1. She arranged the flowers in a vase. (Çiçekleri bir vazoda düzenledi.)\n2. Can you arrange a meeting for next week? (Gelecek hafta için bir toplantı ayarlayabilir misin?)\n3. He arranged the song for piano. (Şarkıyı piyano için düzenledi.)", "rank": 678}, {"word": "lower", "type": "Fiil / Sıfat", "meaning": "(Fiil): 1. İndirmek, alçaltmak.", "full_meaning": "(Fiil): 1. İndirmek, alçaltmak.\n2. Azaltmak, düşürmek.\n(Sıfat): 3. Daha aşağıdaki, alt.", "guide": "(Fiil) Bir şeyi daha aşağı bir seviyeye getirmek. (Sıfat) \"Low\"ın karşılaştırmalı hali.", "examples": "1. They lowered the flag at sunset. (Gün batımında bayrağı indirdiler.)\n2. The shop lowered its prices for the sale. (Mağaza indirim için fiyatlarını düşürdü.)\n3. He injured his lower back. (Alt sırtını incitti.)", "rank": 679}, {"word": "wrong", "type": "Sıfat, Zarf, İsim, Fiil", "meaning": "1. Yanlış, hatalı (sıfat)", "full_meaning": "1. Yanlış, hatalı (sıfat)\n2. Yanlış, kötü (ahlaken) (sıfat)\n3. Yanlış, hata (isim)", "guide": "Doğru, uygun veya ahlaki olmayan. İsim olarak, adaletsiz bir eylemi ifade eder. Fiil olarak, haksızlık etmek demektir.", "examples": "1. That's the wrong answer. (Bu yanlış cevap.)\n2. It is wrong to steal. (Çalmak yanlıştır.)\n3. You've done me a great wrong. (Bana büyük bir haksızlık yaptın.)\n4. She felt she had been wronged. (Haksızlığa uğradığını hissetti.)", "rank": 680}, {"word": "forward", "type": "Zarf/Sıfat/Fiil", "meaning": "1. İleri, öne doğru (zarf).", "full_meaning": "1. İleri, öne doğru (zarf).\n2. İleri, ön (sıfat).\n3. (E-posta) İletmek, yönlendirmek (fiil).", "guide": "Ön tarafa doğru hareket. Gelecekle ilgili. Bir mesajı başka birine göndermek.", "examples": "1. Move forward slowly. (Yavaşça ileri doğru hareket et.)\n2. forward planning (ileriye dönük planlama)\n3. Can you forward that email to me? (O e-postayı bana iletebilir misin?)", "rank": 681}, {"word": "examine", "type": "Fiil", "meaning": "1. İncelemek, muayene etmek.", "full_meaning": "1. İncelemek, muayene etmek.\n2. Sınav yapmak, sorgulamak.", "guide": "Bir şeyi dikkatle ve ayrıntılı olarak bakmak veya kontrol etmek. Bir öğrenciye sınav yapmak.", "examples": "1. The doctor examined the patient. (Doktor hastayı muayene etti.)\n2. The lawyer examined the witness. (Avukat tanığı sorguladı.)", "rank": 682}, {"word": "machine", "type": "İsim", "meaning": "1. Mekanik iş yapan cihaz, makine.", "full_meaning": "1. Mekanik iş yapan cihaz, makine.\n2. Verimli, duygusuz veya otomatik çalışan sistem veya organizasyon.\n3. (Siyasi) parti aparatı veya yapılanması.", "guide": "Genellikle fiziksel bir mekanizma veya cihaz için kullanılır. Aynı zamanda insanların kurduğu, duygusuz ve sistemli çalışan yapıları tanımlamak için mecazen kullanılır.", "examples": "1. This washing machine is very quiet. (Bu çamaşır makinesi çok sessiz.)\n2. He performed like a well-oiled machine. (Yağlanmış bir makine gibi performans gösterdi.)\n3. She rose through the party machine. (Parti yapılanması içinde yükseldi.)", "rank": 683}, {"word": "surprise", "type": "İsim / Fiil", "meaning": "1. (İ) Sürpriz, şaşkınlık.", "full_meaning": "1. (İ) Sürpriz, şaşkınlık.\n2. (F) Şaşırtmak.\n3. (İ) Beklenmedik olay.", "guide": "Beklenmedik bir şeyin neden olduğu şaşkınlık hissi veya böyle bir şey yapma eylemi.", "examples": "1. What a nice surprise! (Ne güzel bir sürpriz!)\n2. You surprised me! (Beni şaşırttın!)\n3. The news came as a complete surprise. (Haber tam bir sürpriz oldu.)", "rank": 684}, {"word": "property", "type": "İsim", "meaning": "1. Mülk, gayrimenkul.", "full_meaning": "1. Mülk, gayrimenkul.\n2. Özellik, nitelik.\n3. Sahiplik, mülkiyet.", "guide": "Ev, arazi gibi taşınmaz. Bir şeyin doğasında bulunan özellik. Sahip olma hakkı.", "examples": "1. He owns several properties in the city. (Şehirde birkaç mülkü var.)\n2. One of the properties of gold is that it doesn't rust. (Altının özelliklerinden biri paslanmamasıdır.)\n3. The concept of private property. (Özel mülkiyet kavramı.)", "rank": 685}, {"word": "link", "type": "İsim / Fiil", "meaning": "1. Bağlantı, bağ, halka.", "full_meaning": "1. Bağlantı, bağ, halka.\n2. (Bilgisayar) Bağlantı, link.\n3. Birleştirmek, bağlamak.", "guide": "İki şeyi birbirine fiziksel veya mantıksal olarak bağlayan şey. İnternette tıklanabilir adres.", "examples": "1. There is a strong link between diet and health. (Beslenme ve sağlık arasında güçlü bir bağ vardır.)\n2. Click on this link to visit our website. (Web sitemizi ziyaret etmek için bu bağlantıya tıklayın.)\n3. The bridge links the two sides of the city. (Köprü, şehrin iki yakasını birbirine bağlar.)", "rank": 686}, {"word": "notice", "type": "İsim / Fiil", "meaning": "1. Farkına varmak, dikkat etmek.", "full_meaning": "1. Farkına varmak, dikkat etmek.\n2. İhbar, bildirim (süresi).\n3. İlan, duyuru.", "guide": "Bir şeyi gözlemlemek veya fark etmek. İsim olarak resmi bir duyuru veya uyarı.", "examples": "1. Did you notice her new haircut? (Onun yeni saç kesimini fark ettin mi?)\n2. He gave his employer a month's notice. (İşverenine bir ay önceden haber verdi/istifa etti.)\n3. The notice on the board says the meeting is cancelled. (Panodaki duyuruda toplantının iptal olduğu yazıyor.)", "rank": 687}, {"word": "significant", "type": "Sıfat", "meaning": "1. Önemli, anlamlı.", "full_meaning": "1. Önemli, anlamlı.\n2. Kayda değer, dikkate değer.\n3. Manalı, bir şey ifade eden.", "guide": "Önemi veya etkisi büyük olan; dikkate değer.", "examples": "1. This is a significant discovery. (Bu önemli bir keşiftir.)\n2. There was a significant increase in sales. (Satışlarda kayda değer bir artış oldu.)\n3. She gave me a significant look. (Bana anlamlı/manalı bir bakış attı.)", "rank": 688}, {"word": "heart", "type": "İsim", "meaning": "1. Kalp (organ).", "full_meaning": "1. Kalp (organ).\n2. Yürek, cesaret, duygu.\n3. Öz, merkez.", "guide": "Vücuttaki hayati organ. Duyguların ve cesaretin sembolü. Bir şeyin en önemli veya merkezi kısmı.", "examples": "1. Her heart was beating fast. (Kalbi hızlı atıyordu.)\n2. He has a kind heart. (İyi bir kalbi/yüreği var.)\n3. Let's get to the heart of the matter. (Mesele'nin özüne/merkezine gelelim.)", "rank": 689}, {"word": "son", "type": "İsim", "meaning": "1. Oğul.", "full_meaning": "1. Oğul.\n2. Evlat (erkek).\n3. (Dini) Oğul (İsa).", "guide": "Bir erkeğin veya kadının erkek çocuğu.", "examples": "1. They have a son and a daughter. (Bir oğulları ve bir kızları var.)\n2. He is the son of a farmer. (O bir çiftçinin oğludur.)\n3. The Son of God. (Tanrı'nın Oğlu.)", "rank": 690}, {"word": "maintain", "type": "Fiil", "meaning": "1. Korumak, sürdürmek, aynı durumda tutmak.", "full_meaning": "1. Korumak, sürdürmek, aynı durumda tutmak.\n2. Bakımını yapmak.\n3. (Bir iddiayı, görüşü) savunmak, sürdürmek.", "guide": "Genellikle bir durumun, nesnenin veya fikrin devamlılığını sağlamak için yapılan eylemi ifade eder.", "examples": "1. It's hard to maintain a healthy lifestyle. (Sağlıklı bir yaşam tarzını sürdürmek zordur.)\n2. You need to maintain your car regularly. (Arabanızın düzenli bakımını yaptırmalısınız.)\n3. He maintains that he is innocent. (Masum olduğunu savunuyor.)", "rank": 691}, {"word": "site", "type": "İsim / Fiil", "meaning": "1. (İ) Yer, mekan.", "full_meaning": "1. (İ) Yer, mekan.\n2. (İ) İnşaat alanı.\n3. (F) Yerleştirmek, konumlandırmak.", "guide": "Belirli bir faaliyetin gerçekleştiği veya gerçekleşeceği yer. Fiil olarak bir yere kurmak.", "examples": "1. This is the site of the ancient city. (Burası antik kentin yeridir.)\n2. Hard hats must be worn on the site. (İnşaat alanında baret takılmalıdır.)\n3. They sited the new school near the park. (Yeni okulu parkın yanına yerleştirdiler.)", "rank": 692}, {"word": "separate", "type": "Fiil / Sıfat", "meaning": "1. (F) Ayırmak, bölmek.", "full_meaning": "1. (F) Ayırmak, bölmek.\n2. (S) Ayrı, farklı.\n3. (F) Ayrılmak (çiftler).", "guide": "Bir bütünü parçalara bölmek veya birbirinden uzaklaştırmak. Sıfat olarak birbirinden ayrı olan.", "examples": "1. Separate the egg yolk from the white. (Yumurta sarısını beyazından ayır.)\n2. They have separate rooms. (Ayrı odaları var.)\n3. My parents separated last year. (Ailem geçen yıl ayrıldı.)", "rank": 693}, {"word": "green", "type": "Sıfat, İsim", "meaning": "1. Yeşil (renk).", "full_meaning": "1. Yeşil (renk).\n2. Çevre dostu, ekolojik.\n3. Acemi, tecrübesiz.", "guide": "Renk. Çevreyle ilgili konularda doğa dostu anlamında. Kişi için deneyimsiz.", "examples": "1. She has beautiful green eyes. (Güzel yeşil gözleri var.)\n2. We need green energy solutions. (Çevre dostu/yeşil enerji çözümlerine ihtiyacımız var.)\n3. He's still green at this job. (Bu işte hâlâ acemi.)", "rank": 694}, {"word": "firm", "type": "Sıfat/İsim", "meaning": "1. Sert, katı (sıfat).", "full_meaning": "1. Sert, katı (sıfat).\n2. Kararlı, sarsılmaz (sıfat).\n3. Firma, şirket (isim).", "guide": "Yumuşak olmayan, baskıya direnen. Bir fikir veya kararda değişmeyen. Ticari bir işletme.", "examples": "1. a firm mattress (sert bir yatak)\n2. a firm believer in democracy (demokrasiye sarsılmaz bir inancı olan biri)\n3. a law firm (bir hukuk firması)", "rank": 695}, {"word": "size", "type": "İsim / Fiil", "meaning": "1. (İ) Boyut, büyüklük.", "full_meaning": "1. (İ) Boyut, büyüklük.\n2. (İ) Beden (giysi).\n3. (F) Boyutuna göre sıralamak.", "guide": "Bir şeyin ne kadar büyük veya küçük olduğunun ölçüsü.", "examples": "1. What size is your apartment? (Dairenizin büyüklüğü ne kadar?)\n2. I wear a medium size. (Orta beden giyerim.)\n3. Size the balls from smallest to largest. (Topları en küçükten en büyüğe boyutlarına göre sırala.)", "rank": 696}, {"word": "purpose", "type": "İsim", "meaning": "1. Amaç, gaye.", "full_meaning": "1. Amaç, gaye.\n2. Niyet, maksat.\n3. (Kararlılık) azim, irade.", "guide": "Bir şeyin yapılma nedeni veya hedefi. Bir şeyi yapmaktaki kararlılık.", "examples": "1. What is the purpose of your visit? (Ziyaretinizin amacı nedir?)\n2. He did it on purpose to annoy me. (Beni kızdırmak için bunu kasten yaptı.)\n3. She walks with a sense of purpose. (Bir amaç duygusuyla yürür.)", "rank": 697}, {"word": "immediate", "type": "Sıfat", "meaning": "1. Acil, ivedi.", "full_meaning": "1. Acil, ivedi.\n2. Yakın, bitişik (zaman/mekan).\n3. Doğrudan, dolaysız.", "guide": "Hiç gecikme olmadan yapılması gereken. Çok yakın olan. Arada başka bir şey olmadan.", "examples": "1. This matter requires immediate attention. (Bu konunun acil şekilde ele alınması gerekiyor.)\n2. My immediate family includes my parents and siblings. (Benim yakın/birinci derece ailem ebeveynlerimi ve kardeşlerimi kapsar.)\n3. The immediate cause of the accident was speeding. (Kazanın doğrudan nedeni hızdı.)", "rank": 698}, {"word": "fine", "type": "Sıfat/İsim/Fiil", "meaning": "1. İyi, güzel (sıfat).", "full_meaning": "1. İyi, güzel (sıfat).\n2. İnce, ince taneli (sıfat).\n3. Para cezası (isim).", "guide": "Yüksek kaliteli veya tatmin edici. Küçük veya hassas. Bir kural ihlali için ödenen para.", "examples": "1. I'm fine, thank you. (İyiyim, teşekkür ederim.)\n2. fine sand (ince kum)\n3. He got a parking fine. (Park cezası yedi.)", "rank": 699}, {"word": "strike", "type": "Fiil / İsim", "meaning": "1. (F) Vurmak, çarpmak.", "full_meaning": "1. (F) Vurmak, çarpmak.\n2. (İ) Grev.\n3. (F) Çalmak (saat).", "guide": "Sert bir şekilde vurmak. İsim olarak iş bırakma eylemi.", "examples": "1. The car struck a tree. (Araba bir ağaca çarptı.)\n2. The workers are on strike. (İşçiler grevde.)\n3. The clock struck three. (Saat üçü çaldı.)", "rank": 700}, {"word": "original", "type": "Sıfat / İsim", "meaning": "1. Orijinal, asıl, ilk.", "full_meaning": "1. Orijinal, asıl, ilk.\n2. Özgün, yaratıcı.\n3. Asıl nüsha, orijinali.", "guide": "Taklit olmayan, ilk yapılan veya yeni ve yaratıcı fikirler içeren.", "examples": "1. This is the original painting. (Bu resmin orijinalidir.)\n2. He has a very original mind. (Çok özgün bir zihni var.)\n3. Keep the original and send a copy. (Orijinalini saklayın ve bir kopyasını gönderin.)", "rank": 701}, {"word": "technology", "type": "İsim", "meaning": "1. Teknoloji.", "full_meaning": "1. Teknoloji.\n2. Teknolojik ürünler, cihazlar.", "guide": "Bilimsel bilginin pratik, özellikle endüstriyel amaçlarla uygulanması. Genel olarak modern cihaz ve sistemleri de ifade eder.", "examples": "1. Advances in technology have changed our lives. (Teknolojideki ilerlemeler hayatımızı değiştirdi.)\n2. The company invests heavily in new technology. (Şirket yeni teknolojiye büyük yatırım yapıyor.)\n3. I'm not very good with technology. (Teknolojiyle pek aram yok.)", "rank": 702}, {"word": "travel", "type": "Fiil / İsim", "meaning": "Fiil: 1. Seyahat etmek, yolculuk yapmak.", "full_meaning": "Fiil: 1. Seyahat etmek, yolculuk yapmak.\nİsim: 2. Seyahat, yolculuk.", "guide": "Uzak bir yere gitmek, özellikle tatil veya iş için.", "examples": "1. I love to travel to new countries. (Yeni ülkelere seyahat etmeyi seviyorum.)\n2. Safe travels! (İyi yolculuklar!)\n3. His job involves a lot of travel. (Onun işi çok seyahat içeriyor.)", "rank": 703}, {"word": "risk", "type": "İsim / Fiil", "meaning": "1. (İsim) Risk, tehlike.", "full_meaning": "1. (İsim) Risk, tehlike.\n2. (Fiil) Riske atmak, göze almak.\n3. (İsim) Olası zarar.", "guide": "Kötü bir şey olma olasılığı veya bu olasılığı kabul etmek.", "examples": "1. \"Smoking increases the risk of cancer.\" (Sigara içmek kanser riskini artırır.)\n2. \"He risked his life to save her.\" (Onu kurtarmak için hayatını riske attı.)\n3. \"Is it worth the risk?\" (Risk almaya değer mi?)", "rank": 704}, {"word": "space", "type": "İsim / Fiil", "meaning": "1. (İ) Uzay, boşluk.", "full_meaning": "1. (İ) Uzay, boşluk.\n2. (İ) Yer, alan.\n3. (F) Aralık bırakmak.", "guide": "Dünya atmosferinin ötesindeki sonsuz boşluk veya fiziksel olarak boş olan yer.", "examples": "1. Rockets travel into space. (Roketler uzaya seyahat eder.)\n2. Is there enough space for a table? (Bir masa için yeterli yer var mı?)\n3. Space the plants 30 cm apart. (Bitkileri 30 cm aralıklarla dikin.)", "rank": 705}, {"word": "march", "type": "İsim (Özel)", "meaning": "1. Yılın üçüncü ayı (Mart).", "full_meaning": "1. Yılın üçüncü ayı (Mart).\n2. (march) Yürüyüş, protesto yürüyüşü.", "guide": "Büyük harfle ay ismi olarak kullanılır. Küçük harfle (\"march\") yürüyüş veya ilerleme anlamına gelen farklı bir kelimedir.", "examples": "1. My birthday is in March. (Doğum günüm Mart ayında.)\n2. They organized a peace march. (Bir barış yürüyüşü düzenlediler.)", "rank": 706}, {"word": "slow", "type": "Sıfat / Fiil", "meaning": "1. (S) Yavaş.", "full_meaning": "1. (S) Yavaş.\n2. (S) Ağır (zihinsel).\n3. (F) Yavaşlamak.", "guide": "Hızı düşük olan, çabuk olmayan. Fiil olarak hızını azaltmak.", "examples": "1. The car is very slow. (Araba çok yavaş.)\n2. He's a bit slow to understand. (Anlaması biraz ağır.)\n3. Slow down! You're driving too fast! (Yavaşla! Çok hızlı sürüyorsun!)", "rank": 707}, {"word": "fish", "type": "İsim/Fiil", "meaning": "1. Balık (isim).", "full_meaning": "1. Balık (isim).\n2. Balık tutmak (fiil).\n3. (for) Arayıp taramak, dolaylı yoldan bilgi almaya çalışmak (fiil).", "guide": "Solungaçları olan su canlısı. Balık yakalamak. Birinden bilgi almaya çalışmak.", "examples": "1. We had fish for dinner. (Akşam yemeğinde balık yedik.)\n2. He goes fishing every weekend. (Her hafta sonu balık tutmaya gider.)\n3. She was fishing for compliments. (İltifat arayıp tarıyordu.)", "rank": 708}, {"word": "enjoy", "type": "Fiil", "meaning": "1. Keyif almak, hoşlanmak.", "full_meaning": "1. Keyif almak, hoşlanmak.\n2. (enjoy yourself) İyi vakit geçirmek.\n3. (Resmi) Sahip olmak, yararlanmak (hak).", "guide": "Bir şeyden zevk almak veya onun tadını çıkarmak.", "examples": "1. I really enjoy reading. (Okumaktan gerçekten keyif alıyorum.)\n2. Did you enjoy yourself at the party? (Partide iyi vakit geçirdin mi?)\n3. He enjoys a good reputation. (İyi bir itibara sahiptir.)", "rank": 709}, {"word": "royal", "type": "Sıfat", "meaning": "1. Kraliyete ait, kraliyet.", "full_meaning": "1. Kraliyete ait, kraliyet.\n2. Muhteşem, görkemli.\n3. (Britanya) Kraliyet ailesinden.", "guide": "Kral, kraliçe veya onların ailesiyle ilgili olan.", "examples": "1. \"The royal wedding was televised.\" (Kraliyet düğünü televizyonda yayınlandı.)\n2. \"We were given a royal welcome.\" (Bize muhteşem bir karşılama yapıldı.)", "rank": 710}, {"word": "modern", "type": "Sıfat", "meaning": "1. Modern, çağdaş.", "full_meaning": "1. Modern, çağdaş.\n2. Güncel, şimdiki.\n3. Modern tarzda, yeni moda.", "guide": "Günümüze ait, geleneksel olmayan, yeni teknik ve fikirleri kullanan.", "examples": "1. They live in a modern apartment. (Modern bir apartmanda yaşıyorlar.)\n2. Modern medicine can cure many diseases. (Modern tıp birçok hastalığı iyileştirebilir.)\n3. I prefer modern art. (Modern sanatı tercih ederim.)", "rank": 711}, {"word": "suit", "type": "İsim / Fiil", "meaning": "1. (İ) Takım elbise.", "full_meaning": "1. (İ) Takım elbise.\n2. (İ) Dava (hukuk).\n3. (F) Uymak, yakışmak.", "guide": "Ceket ve pantolondan oluşan resmi giysi veya mahkemede açılan dava.", "examples": "1. He wore a black suit. (Siyah bir takım elbise giydi.)\n2. She filed a suit against the company. (Şirkete karşı bir dava açtı.)\n3. This time suits me. (Bu zaman bana uyar.)", "rank": 712}, {"word": "chance", "type": "İsim/Sıfat", "meaning": "1. Şans, fırsat (isim).", "full_meaning": "1. Şans, fırsat (isim).\n2. Olasılık, ihtimal (isim).\n3. Tesadüfi, rastlantısal (sıfat).", "guide": "Olma ihtimali veya beklenmedik bir fırsat.", "examples": "1. You should give him a chance. (Ona bir şans vermelisin.)\n2. There's a chance of rain tomorrow. (Yarın yağmur ihtimali var.)\n3. a chance meeting (tesadüfi bir karşılaşma)", "rank": 713}, {"word": "hair", "type": "İsim", "meaning": "1. Saç, kıl.", "full_meaning": "1. Saç, kıl.\n2. Tüy, kürk.\n3. Çok küçük mesafe/fark (a hair's breadth).", "guide": "Kafadaki veya vücuttaki ince iplikçikler. Hayvanlarda kürk. \"Bir saç teli kalınlığı\" deyiminde çok az mesafe.", "examples": "1. She has long brown hair. (Uzun kahverengi saçları var.)\n2. The cat left white hairs on the sofa. (Kedi koltuğa beyaz tüyler bıraktı.)\n3. He missed the target by a hair. (Hedefi kıl payı ıskaladı.)", "rank": 714}, {"word": "wear", "type": "Fiil, İsim", "meaning": "1. Giyinmek, takmak (giysi/aksesuar) (fiil)", "full_meaning": "1. Giyinmek, takmak (giysi/aksesuar) (fiil)\n2. Eskimek, aşınmak (fiil)\n3. Giyim, kıyafet (isim)", "guide": "Vücuda giysi, ayakkabı, takı vb. takmak. Ayrıca, kullanımdan dolayı yıpranıp eskimek anlamına gelir. İsim olarak, giyilen şeyler veya aşınma durumudur.", "examples": "1. She wears glasses to read. (Okumak için gözlük takar.)\n2. The tires are wearing thin. (Lastikler inceliyor/aşınıyor.)\n3. Casual wear is acceptable in the office. (Ofiste gündelik giyim kabul edilebilir.)", "rank": 715}, {"word": "skill", "type": "İsim", "meaning": "1. Beceri, hüner.", "full_meaning": "1. Beceri, hüner.\n2. Maharet, yetenek.\n3. Ustalık.", "guide": "Eğitim veya deneyimle kazanılan bir şeyi iyi yapma yeteneği.", "examples": "1. Learning a language requires skill. (Bir dil öğrenmek beceri gerektirir.)\n2. He has great technical skills. (Harika teknik becerileri var.)\n3. It's a matter of skill, not strength. (Bu bir güç değil, ustalık meselesi.)", "rank": 716}, {"word": "opportunity", "type": "İsim", "meaning": "1. Fırsat, imkân.", "full_meaning": "1. Fırsat, imkân.\n2. Uygun zaman, elverişli durum.\n3. Şans.", "guide": "Bir şeyi yapmak için uygun veya elverişli bir zaman veya durum.", "examples": "1. This job is a great opportunity for you. (Bu iş senin için harika bir fırsat.)\n2. I'll take the opportunity to thank you all. (Hepinize teşekkür etme fırsatını değerlendireceğim.)", "rank": 717}, {"word": "eat", "type": "Fiil", "meaning": "1. Yemek yemek.", "full_meaning": "1. Yemek yemek.\n2. (away/into) Aşındırmak, kemirmek.\n3. (out) Dışarıda yemek.", "guide": "Yiyeceği ağızdan alıp çiğneyerek yutmak. Asit veya suyun bir şeyi yavaş yavaş yok etmesi. Restoranda yemek.", "examples": "1. What do you want to eat? (Ne yemek istersin?)\n2. Rust was eating away at the metal. (Pas metali yiyordu/kemiriyordu.)\n3. Let's eat out tonight. (Bu gece dışarıda yiyelim.)", "rank": 718}, {"word": "park", "type": "İsim/Fiil", "meaning": "1. (İsim) Park.", "full_meaning": "1. (İsim) Park.\n2. (Fiil) (Aracı) park etmek.\n3. (Fiil, argo) (Bir şeyi) bir yere koymak/bırakmak.", "guide": "Kamusal yeşil alan olan park. Aracı durdurmak ve bırakmak eylemi.", "examples": "1. Let's have a picnic in the park. (Parkta piknik yapalım.)\n2. I couldn't find anywhere to park the car. (Arabayı park edecek hiçbir yer bulamadım.)\n3. Just park your bag over there for now. (Çantanı şimdilik şuraya koy/bırak.)", "rank": 719}, {"word": "source", "type": "İsim", "meaning": "1. Kaynak.", "full_meaning": "1. Kaynak.\n2. Köken, menşei.\n3. Veri kaynağı, kişi.", "guide": "Bir şeyin çıktığı, başladığı veya elde edildiği yer.", "examples": "1. The river's source is in the mountains. (Nehrin kaynağı dağlardadır.)\n2. What is the source of this information? (Bu bilginin kaynağı nedir?)\n3. She is a reliable source. (O güvenilir bir kaynaktır.)", "rank": 720}, {"word": "grant", "type": "Fiil, İsim", "meaning": "1. (Fiil) Vermek, bahşetmek (resmi).", "full_meaning": "1. (Fiil) Vermek, bahşetmek (resmi).\n2. (Fiil) Kabul etmek, itiraf etmek.\n3. (İsim) Burs, hibe.", "guide": "Resmi olarak bir şeyi (izin, dilek, para) vermek. Ayrıca, bir gerçeği kabul etmek. İsim olarak verilen para.", "examples": "1. The judge granted him bail. (Hakim ona kefalet verdi.)\n2. I grant that your idea has some merit. (Fikrinizin bazı avantajları olduğunu kabul ediyorum.)\n3. She received a research grant. (Bir araştırma bursu/hibesi aldı.)", "rank": 721}, {"word": "fear", "type": "İsim/Fiil", "meaning": "1. Korku (isim).", "full_meaning": "1. Korku (isim).\n2. Korkmak, endişelenmek (fiil).\n3. (for) -den endişe etmek.", "guide": "Tehlikeli, kötü veya acı verici bir şeyin olacağına dair hoş olmayan duygu. Korku duymak.", "examples": "1. She was trembling with fear. (Korkudan titriyordu.)\n2. Many people fear change. (Birçok insan değişimden korkar.)\n3. I fear for his safety. (Onun güvenliğinden endişe ediyorum.)", "rank": 722}, {"word": "thousand", "type": "Sayı / İsim", "meaning": "1. Bin (1000).", "full_meaning": "1. Bin (1000).\n2. (thousands) Binlerce, çok fazla sayıda.", "guide": "999'dan sonra ve 1001'den önce gelen sayı. Çoğul haliyle belirsiz büyük bir miktarı ifade eder.", "examples": "1. The stadium holds fifty thousand people. (Stadyum elli bin kişi alır.)\n2. Thousands of people attended the concert. (Binlerce kişi konsere katıldı.)\n3. Thanks a thousand! (Bin kere teşekkürler!)", "rank": 723}, {"word": "pick", "type": "Fiil/İsim", "meaning": "1. (Fiil) Seçmek, tercih etmek.", "full_meaning": "1. (Fiil) Seçmek, tercih etmek.\n2. (Fiil) Toplamak (meyve, çiçek).\n3. (İsim) Kazma, kürdan.", "guide": "Bir grup içinden seçim yapmak veya bir şeyi yerinden almak/toplamak. İsim olarak bir alet.", "examples": "1. (Fiil) Pick any card you like. (İstediğin bir kartı seç.)\n2. (Fiil) We went to pick apples. (Elma toplamaya gittik.)\n3. (İsim) He used a pick to break the ice. (Buzu kırmak için bir kazma kullandı.)", "rank": 724}, {"word": "various", "type": "Sıfat", "meaning": "1. Çeşitli, farklı", "full_meaning": "1. Çeşitli, farklı\n2. Birkaç, birçok", "guide": "Birbiriyle aynı olmayan, birkaç farklı türden oluşan şeyleri tanımlar. \"Different\" kelimesinden daha resmi bir tona sahiptir.", "examples": "1. We discussed various topics during the meeting. (Toplantıda çeşitli konuları tartıştık.)\n2. The job attracts people from various backgrounds. (İş, çeşitli geçmişlerden insanları cezbediyor.)\n3. For various reasons, he decided to leave. (Çeşitli nedenlerden ötürü, ayrılmaya karar verdi.)", "rank": 725}, {"word": "occasion", "type": "İsim / Fiil", "meaning": "1. Durum, fırsat.", "full_meaning": "1. Durum, fırsat.\n2. Özel gün, tören.\n3. (Resmi) neden olmak, yol açmak.", "guide": "Belirli bir zaman veya olay, özellikle önemli olan. Fiil olarak resmi bir şekilde neden olmak.", "examples": "1. I've met him on several occasions. (Onunla birkaç kez karşılaştım.)\n2. A wedding is a happy occasion. (Düğün mutlu bir özel gündür.)\n3. His speech occasioned much discussion. (Konuşması çok tartışmaya neden oldu.)", "rank": 726}, {"word": "catch", "type": "Fiil/İsim", "meaning": "1. Yakalamak (fiil).", "full_meaning": "1. Yakalamak (fiil).\n2. Yetişmek (otobüs/tren) (fiil).\n3. Kanca, mandal (isim).", "guide": "Hareket halindeki bir şeyi ele geçirmek veya bir araca zamanında binmek.", "examples": "1. Try to catch the ball. (Topu yakalamaya çalış.)\n2. I have to catch the 8 o'clock train. (Saat 8 trenine yetişmem gerekiyor.)\n3. There must be a catch to this offer. (Bu teklifin bir altında yatan bir şey olmalı.)", "rank": 727}, {"word": "contribute", "type": "Fiil", "meaning": "1. Katkıda bulunmak.", "full_meaning": "1. Katkıda bulunmak.\n2. (Para) bağışlamak.\n3. (Yazı) yazmak (dergiye).", "guide": "Bir şeyin oluşmasına veya gelişmesine yardım etmek.", "examples": "1. Everyone contributed to the discussion. (Herkes tartışmaya katkıda bulundu.)\n2. He contributes to a charity. (Bir hayır kurumuna bağış yapıyor.)\n3. factors contributing to the accident (kazaya katkıda bulunan faktörler)", "rank": 728}, {"word": "character", "type": "İsim", "meaning": "1. Karakter, kişilik.", "full_meaning": "1. Karakter, kişilik.\n2. Karakter (roman/oyun).\n3. Harf, karakter (yazı).", "guide": "Bir kişinin veya şeyin ayırt edici nitelikleri; kurgusal kişi; alfabe sembolü.", "examples": "1. He has a strong character. (Güçlü bir karakteri var.)\n2. Who is your favourite character in the book? (Kitaptaki en sevdiğin karakter kim?)\n3. Chinese characters (Çin harfleri)", "rank": 729}, {"word": "oppose", "type": "Fiil", "meaning": "1. Karşı çıkmak, muhalefet etmek.", "full_meaning": "1. Karşı çıkmak, muhalefet etmek.\n2. Engel olmak, direnmek.\n3. (Bir şeye) karşı olmak.", "guide": "Bir fikre, plana veya eyleme karşı olmak ve bunu ifade etmek.", "examples": "1. Many people opposed the war. (Birçok insan savaşa karşı çıktı.)\n2. They opposed the building of the new road. (Yeni yolun yapımına karşı çıktılar.)", "rank": 730}, {"word": "loss", "type": "İsim", "meaning": "1. Kayıp, ziyan.", "full_meaning": "1. Kayıp, ziyan.\n2. Zarar, hasar.\n3. (Sevilen biri) Vefat, kayıp.", "guide": "Kaybetme eylemi veya kaybedilen şey. İşletmede para zararı.", "examples": "1. The loss of his job was a big shock. (İşini kaybetmesi büyük bir şok oldu.)\n2. The company reported a loss this quarter. (Şirket bu çeyrekte zarar bildirdi.)\n3. We were saddened by the loss of a great leader. (Büyük bir liderin kaybından dolayı üzüldük.)", "rank": 731}, {"word": "pattern", "type": "İsim", "meaning": "1. Desen, model.", "full_meaning": "1. Desen, model.\n2. Örüntü, düzen (tekrarlayan).\n3. Kalıp, şablon (dikim için).", "guide": "Tekrarlayan bir düzen veya şekil. Kumaş deseni, davranış örüntüsü veya kesim kalıbı olabilir.", "examples": "1. I love the floral pattern on this dress. (Bu elbisenin üzerindeki çiçek desenini seviyorum.)\n2. There's a pattern to his mistakes. (Onun hatalarında bir örüntü var.)\n3. She used a pattern to make the curtains. (Perdeleri yapmak için bir kalıp kullandı.)", "rank": 732}, {"word": "announce", "type": "Fiil", "meaning": "1. Duyurmak, ilan etmek.", "full_meaning": "1. Duyurmak, ilan etmek.\n2. Bildirmek, haber vermek.\n3. (Gelişi) anons etmek.", "guide": "Resmi veya kamuya açık bir şekilde bir haberi söylemek.", "examples": "1. The government announced new taxes. (Hükümet yeni vergiler duyurdu.)\n2. They announced their engagement. (Nişanlarını duyurdular.)\n3. The flight attendant announced our arrival. (Kabin memuru varışımızı anons etti.)", "rank": 733}, {"word": "response", "type": "İsim", "meaning": "1. Cevap, yanıt.", "full_meaning": "1. Cevap, yanıt.\n2. Tepki, karşılık.\n3. (Dini) İlahi, cevap.", "guide": "Bir soruya, isteğe veya duruma verilen sözlü, yazılı veya fiziksel karşılık.", "examples": "1. \"I'm waiting for a response to my application.\" (Başvuruma bir cevap bekliyorum.)\n2. \"The public response was overwhelming.\" (Kamuoyunun tepkisi muazzamdı.)", "rank": 734}, {"word": "middle", "type": "İsim / Sıfat", "meaning": "1. Orta, merkez.", "full_meaning": "1. Orta, merkez.\n2. Bel, karın bölgesi.\n3. Orta nokta, ara.", "guide": "Bir şeyin merkeze yakın kısmı veya başlangıç ile bitiş arasındaki nokta.", "examples": "1. He sat in the middle of the row. (Sıranın ortasına oturdu.)\n2. She had a pain in her middle. (Karnında/kalçasında bir ağrısı vardı.)\n3. Call me in the middle of the week. (Hafta ortasında beni ara.)", "rank": 735}, {"word": "sun", "type": "İsim / Fiil", "meaning": "1. (İ) Güneş.", "full_meaning": "1. (İ) Güneş.\n2. (İ) Güneş ışığı.\n3. (F) Güneşlenmek.", "guide": "Dünya'mızın ısı ve ışık kaynağı olan yıldız.", "examples": "1. The sun is shining. (Güneş parlıyor.)\n2. Sit in the sun. (Güneşe otur.)\n3. They were sunning themselves on the balcony. (Balkonda güneşleniyorlardı.)", "rank": 736}, {"word": "commission", "type": "İsim/Fiil", "meaning": "1. Komisyon (ücret) (isim).", "full_meaning": "1. Komisyon (ücret) (isim).\n2. Kurul, komisyon (isim).\n3. Sipariş vermek, ısmarlamak (fiil).", "guide": "Satış üzerinden alınan yüzde veya bir işi yaptırmak için resmi talimat verme.", "examples": "1. He gets a 10% commission on every sale. (Her satıştan %10 komisyon alır.)\n2. an official commission of inquiry (resmi bir soruşturma komisyonu)\n3. The artist was commissioned to paint a portrait. (Sanatçıya bir portre ısmarlanmıştı.)", "rank": 737}, {"word": "finish", "type": "Fiil/İsim", "meaning": "1. Bitirmek, tamamlamak (fiil).", "full_meaning": "1. Bitirmek, tamamlamak (fiil).\n2. Bitiş çizgisi, son (isim).\n3. (Yüzey) Cila, bitiş (isim).", "guide": "Bir şeyi yapmayı sona erdirmek. Bir yarışın son noktası. Bir yüzeyin görünümü veya dokusu.", "examples": "1. Have you finished your homework? (Ödevini bitirdin mi?)\n2. It was a close finish. (Yakın bir bitişti.)\n3. The table has a glossy finish. (Masanın parlak bir cilası var.)", "rank": 738}, {"word": "aware", "type": "Sıfat", "meaning": "1. Farkında, haberdar.", "full_meaning": "1. Farkında, haberdar.\n2. Bilinçli, uyanık.\n3. (Politik/sosyal) duyarlı.", "guide": "Bir şey hakkında bilgisi olma veya bir şeyi hissetme durumu.", "examples": "1. Are you aware of the problem? (Sorundan haberdar mısınız?)\n2. He was fully aware of the risks involved. (İlgili risklerin tamamen farkındaydı.)\n3. environmentally aware consumers (çevre bilincine sahip tüketiciler)", "rank": 739}, {"word": "aim", "type": "Fiil/İsim", "meaning": "1. Amaçlamak, hedeflemek (fiil).", "full_meaning": "1. Amaçlamak, hedeflemek (fiil).\n2. Nişan almak (fiil).\n3. Amaç, hedef (isim).", "guide": "Bir şeyi başarmayı hedeflemek veya bir silahı bir şeye doğrultmak.", "examples": "1. We aim to finish by Friday. (Cuma gününe kadar bitirmeyi hedefliyoruz.)\n2. He aimed the camera at the bird. (Kamerayı kuşa doğrulttu.)\n3. Her main aim in life is to be happy. (Hayattaki temel amacı mutlu olmak.)", "rank": 740}, {"word": "assess", "type": "Fiil", "meaning": "1. Değerlendirmek.", "full_meaning": "1. Değerlendirmek.\n2. (Vergi) tarh etmek.\n3. Tahmin etmek, kestirmek.", "guide": "Bir şeyin niteliği, değeri veya miktarı hakkında bir yargıya varmak için dikkatlice incelemek.", "examples": "1. The teacher will assess your writing skills. (Öğretmen yazma becerilerinizi değerlendirecek.)\n2. They assessed the damage after the storm. (Fırtınadan sonra hasarı değerlendirdiler.)\n3. It's difficult to assess the impact of the new law. (Yeni yasanın etkisini değerlendirmek zor.)", "rank": 741}, {"word": "animal", "type": "İsim", "meaning": "1. Hayvan.", "full_meaning": "1. Hayvan.\n2. Hayvani, vahşi (davranış).\n3. Kişi, tip (aşağılayıcı).", "guide": "İnsan dışında, genellikle hareket eden ve beslenen canlı. Mecazi olarak vahşi veya aşağılayıcı anlamda da kullanılır.", "examples": "1. Lions are wild animals. (Aslanlar vahşi hayvanlardır.)\n2. He was treated like an animal. (O bir hayvan gibi muamele gördü.)\n3. She has an animal magnetism. (Hayvansı bir çekiciliği var.)", "rank": 742}, {"word": "appeal", "type": "İsim/Fiil", "meaning": "1. Cazibe, çekicilik (isim).", "full_meaning": "1. Cazibe, çekicilik (isim).\n2. Rica, yalvarma (isim).\n3. Temyize başvurmak, itiraz etmek (fiil).", "guide": "Bir şeyin hoşa gitme, ilgi çekme özelliği. Ayrıca resmi bir ricada bulunma veya bir karara itiraz etme.", "examples": "1. The idea has a certain appeal. (Fikrin belli bir cazibesi var.)\n2. She made an appeal for help. (Yardım için bir ricada bulundu.)\n3. They decided to appeal the court's decision. (Mahkemenin kararına itiraz etmeye karar verdiler.)", "rank": 743}, {"word": "tend", "type": "Fiil", "meaning": "1. Eğiliminde olmak, meyilli olmak.", "full_meaning": "1. Eğiliminde olmak, meyilli olmak.\n2. Bakmak, ilgilenmek, meşgul olmak (tend to).", "guide": "Çoğunlukla belirli bir şekilde davranma eğilimini ifade eder. Ayrıca, bir şeye dikkat ve özen göstermek anlamına da gelir.", "examples": "1. I tend to go to bed early. (Erken yatma eğilimindeyim.)\n2. He tends to forget appointments. (Randevuları unutma eğilimindedir.)\n3. She tends to her garden every day. (Bahçesiyle her gün ilgilenir.)", "rank": 744}, {"word": "prove", "type": "Fiil", "meaning": "1. Kanıtlamak, ispat etmek.", "full_meaning": "1. Kanıtlamak, ispat etmek.\n2. Denemek, sınamak.\n3. (Kendini) göstermek, çıkmak.", "guide": "Bir şeyin doğruluğunu göstermek. Bir şeyin değerini veya kalitesini test etmek. Sonunda belirli bir durumda olduğu ortaya çıkmak.", "examples": "1. Can you prove that you were there? (Orada olduğunu kanıtlayabilir misin?)\n2. He proved his courage in battle. (Cesaretini savaşta gösterdi.)\n3. The rumor proved to be false. (Söylentinin yanlış olduğu ortaya çıktı.)", "rank": 745}, {"word": "april", "type": "İsim", "meaning": "1. Nisan (ay).", "full_meaning": "1. Nisan (ay).", "guide": "Yılın dördüncü ayı.", "examples": "1. My birthday is in April. (Doğum günüm Nisan'da.)\n2. April showers bring May flowers. (Nisan yağmurları Mayıs çiçeklerini getirir.)", "rank": 746}, {"word": "sudden", "type": "Sıfat", "meaning": "1. Ani, beklenmedik.", "full_meaning": "1. Ani, beklenmedik.\n2. Birdenbire olan.\n3. Hızlı ve şiddetli.", "guide": "Önceden uyarı veya hazırlık olmadan hızla meydana gelen.", "examples": "1. A sudden change of plan. (Planda bir ani değişiklik.)\n2. His death was very sudden. (Onun ölümü çok ani oldu.)\n3. A sudden noise made me jump. (Ani bir ses beni zıplattı.)", "rank": 747}, {"word": "pressure", "type": "İsim/Fiil", "meaning": "1. (İsim) Basınç.", "full_meaning": "1. (İsim) Basınç.\n2. (İsim) Baskı, stres.\n3. (Fiil) Baskı yapmak, zorlamak.", "guide": "Fiziksel kuvvet (hava/sıvı). Psikolojik stres veya zorlama. Fiil olarak birini bir şey yapmaya zorlamak.", "examples": "1. High blood pressure can be dangerous. (Yüksek tansiyon tehlikeli olabilir.)\n2. He's under a lot of pressure at work. (İşte çok baskı altında.)\n3. They pressured him into resigning. (Onu istifa etmeye zorladılar.)", "rank": 748}, {"word": "suffer", "type": "Fiil", "meaning": "1. Acı çekmek, ıstırap duymak.", "full_meaning": "1. Acı çekmek, ıstırap duymak.\n2. (Kayıp/zarar) Görmek.\n3. Katlanmak, çekmek.", "guide": "Fiziksel veya duygusal acı, zarar veya rahatsızlık yaşamak.", "examples": "1. He suffered from a headache. (Bir baş ağrısından acı çekti.)\n2. The company suffered heavy losses. (Şirket ağır kayıplar gördü.)\n3. She suffered in silence. (Sessizce katlandı.)", "rank": 749}, {"word": "couple", "type": "İsim/Fiil", "meaning": "1. Çift, iki (isim).", "full_meaning": "1. Çift, iki (isim).\n2. Çift (evli/partner) (isim).\n3. Birleştirmek, bağlamak (fiil).", "guide": "İki kişi veya şey. \"A couple of\" birkaç anlamında da kullanılır.", "examples": "1. I'll be there in a couple of minutes. (Birkaç dakika içinde orada olacağım.)\n2. a married couple (evli bir çift)\n3. The train cars were coupled together. (Tren vagonları birbirine bağlandı.)", "rank": 750}, {"word": "piece", "type": "İsim", "meaning": "1. Parça.", "full_meaning": "1. Parça.\n2. Bir bütünden ayrılmış kısım (pasta, ekmek).\n3. (Müzik) parça, eser.", "guide": "Bir bütünün bir bölümü veya kısmı. Ayrıca müzik, sanat eseri veya satranç taşı gibi şeyler için de kullanılır.", "examples": "1. The vase broke into a thousand pieces. (Vazo bin parçaya ayrıldı.)\n2. Would you like a piece of cake? (Bir parça kek ister misiniz?)\n3. She played a beautiful piece by Chopin. (Chopin'den güzel bir parça çaldı.)", "rank": 751}, {"word": "key", "type": "İsim / Sıfat", "meaning": "(İsim): 1. Anahtar.", "full_meaning": "(İsim): 1. Anahtar.\n2. (Klavye/ Piyano) Tuş.\n3. Çözüm, kilit nokta.\n(Sıfat): 4. Kilit, anahtar, çok önemli.", "guide": "(İsim) Bir kilidi açmaya yarayan araç veya bir şeyin anlaşılması/başarılması için temel unsur. (Sıfat) En önemli, esas olan.", "examples": "1. I can't find my car keys. (Araba anahtarlarımı bulamıyorum.)\n2. Press the 'Enter' key. ('Enter' tuşuna basın.)\n3. Communication is the key to a good relationship. (İletişim iyi bir ilişkinin anahtarıdır.)\n4. He is a key witness in the case. (Davadaki kilit tanıktır.)", "rank": 752}, {"word": "film", "type": "İsim/Fiil", "meaning": "1. Film, sinema (isim).", "full_meaning": "1. Film, sinema (isim).\n2. (Fotoğraf) Film (isim).\n3. Filme almak, çekmek (fiil).", "guide": "Hareketli görüntülerden oluşan bir hikaye veya kayıt. Fotoğraf çekmek için ışığa duyarlı şerit. Bir film veya video çekmek.", "examples": "1. We watched a funny film. (Komik bir film izledik.)\n2. I need to buy a new roll of film. (Yeni bir fotoğraf filmi rulosu almam gerekiyor.)\n3. They are filming a new series here. (Burada yeni bir dizi çekiyorlar.)", "rank": 753}, {"word": "profit", "type": "İsim/Fiil", "meaning": "1. (İsim) Kâr, kazanç.", "full_meaning": "1. (İsim) Kâr, kazanç.\n2. (İsim) Fayda, yarar.\n3. (Fiil) Kâr etmek, yararlanmak.", "guide": "Gelir ile gider arasındaki pozitif fark. Soyut fayda. Fiil olarak kazanç sağlamak.", "examples": "1. The company made a large profit this year. (Şirket bu yıl büyük bir kâr elde etti.)\n2. I read the book with great profit. (Kitabı büyük fayda ile okudum.)\n3. Who profits from this deal? (Bu anlaşmadan kim kâr ediyor?)", "rank": 754}, {"word": "june", "type": "İsim", "meaning": "Haziran ayı.", "full_meaning": "Haziran ayı.", "guide": "Miladi takvime göre yılın 6. ayıdır.", "examples": "1. Schools break up in June. (Okullar Haziran'da kapanır.)\n2. We got married last June. (Geçen Haziran evlendik.)\n3. June 21st is the longest day of the year. (21 Haziran yılın en uzun günüdür.)", "rank": 755}, {"word": "factor", "type": "İsim", "meaning": "1. Faktör, etken.", "full_meaning": "1. Faktör, etken.\n2. (Matematik) Çarpan.\n3. (Tıp) Faktör (kan pıhtılaşma faktörü gibi).", "guide": "Bir sonucu veya durumu etkileyen şey. Bir sayıyı tam bölen sayı.", "examples": "1. Cost was the main factor in our decision. (Maliyet kararımızdaki ana faktördü.)\n2. 2 and 3 are factors of 6. (2 ve 3, 6'nın çarpanlarıdır.)", "rank": 756}, {"word": "population", "type": "İsim", "meaning": "1. Nüfus.", "full_meaning": "1. Nüfus.\n2. (Belirli bir grup) topluluk.\n3. (İstatistik) evren.", "guide": "Bir bölgede yaşayan insan sayısı veya topluluğu.", "examples": "1. What is the population of Istanbul? (İstanbul'un nüfusu nedir?)\n2. The student population at the university is diverse. (Üniversitedeki öğrenci topluluğu çeşitlidir.)\n3. We surveyed a sample of the population. (Nüfusun bir örneğini anketledik.)", "rank": 757}, {"word": "sea", "type": "İsim", "meaning": "1. Deniz.", "full_meaning": "1. Deniz.\n2. Büyük, dalgalı kütle (örn: a sea of people).\n3. Açık deniz, okyanus.", "guide": "Büyük tuzlu su kütlesi, genellikle okyanustan daha küçük. Mecazi olarak çok büyük miktar.", "examples": "1. We swam in the sea. (Denizde yüzdük.)\n2. I saw a sea of faces in the crowd. (Kalabalıkta bir yüzler denizi gördüm.)\n3. The ship was lost at sea. (Gemi açık denizde kayboldu.)", "rank": 758}, {"word": "respect", "type": "İsim / Fiil", "meaning": "1. (İsim) Saygı, hürmet.", "full_meaning": "1. (İsim) Saygı, hürmet.\n2. (Fiil) Saygı duymak.\n3. (İsim) Husus, bakım, yön.", "guide": "Birinin nitelikleri veya hakları için duyulan takdir veya dikkate alma.", "examples": "1. \"You should show respect to your elders.\" (Büyüklerinize saygı göstermelisiniz.)\n2. \"I respect his opinion, even if I disagree.\" (Katılmasam da onun fikrine saygı duyuyorum.)\n3. \"In many respects, the plan is good.\" (Birçok bakımdan plan iyidir.)", "rank": 759}, {"word": "shoot", "type": "Fiil", "meaning": "1. Ateş etmek, vurmak.", "full_meaning": "1. Ateş etmek, vurmak.\n2. (Film/fotoğraf) Çekmek.\n3. Hızla gitmek, fırlamak.", "guide": "Bir silahtan mermi atmak veya bir hedefi vurmak. Ayrıca fotoğraf/film çekmek anlamına gelir.", "examples": "1. Don't shoot! (Ateş etme!)\n2. They will shoot the scene tomorrow. (Sahneyi yarın çekecekler.)\n3. He shot past me on his bike. (Bisikletiyle yanımdan hızla geçti.)", "rank": 760}, {"word": "october", "type": "İsim (Özel)", "meaning": "1. Ekim ayı.", "full_meaning": "1. Ekim ayı.", "guide": "Yılın onuncu ayı.", "examples": "1. Leaves fall in October. (Yapraklar Ekim ayında dökülür.)\n2. We’re getting married next October. (Önümüzdeki Ekim ayında evleniyoruz.)", "rank": 761}, {"word": "inside", "type": "Edat, İsim, Sıfat, Zarf", "meaning": "1. İçinde, içeride.", "full_meaning": "1. İçinde, içeride.\n2. (İsim) İç kısım, iç taraf.\n3. (Gayriresmi) Hapishane.", "guide": "Bir şeyin iç kısmında. Bir şeyin iç yüzeyi veya kısmı. Argo olarak hapishane.", "examples": "1. The keys are inside the drawer. (Anahtarlar çekmecenin içinde.) [Edat]\n2. The inside of the house is beautiful. (Evin içi güzel.) [İsim]\n3. He spent five years inside. (İçeride/hapiste beş yıl geçirdi.) [Zarf]", "rank": 762}, {"word": "knowledge", "type": "İsim", "meaning": "1. Bilgi, malumat.", "full_meaning": "1. Bilgi, malumat.\n2. Bilinç, farkındalık.\n3. İlim, bilim.", "guide": "Öğrenme, deneyim veya eğitim yoluyla edinilen gerçekler, bilgiler ve beceriler.", "examples": "1. He has extensive knowledge of history. (Geniş bir tarih bilgisine sahiptir.)\n2. The accident happened without my knowledge. (Kaza benim haberim olmadan gerçekleşti.)\n3. The pursuit of knowledge is important. (Bilgi peşinde koşmak önemlidir.)", "rank": 763}, {"word": "january", "type": "İsim", "meaning": "Yılın ilk ayı.", "full_meaning": "Yılın ilk ayı.", "guide": "Miladi takvime göre yılın 1. ayının adıdır. \"Ocak\" ayı olarak çevrilir.", "examples": "1. My birthday is in January. (Doğum günüm Ocak ayında.)\n2. We usually get a lot of snow in January. (Ocak ayında genelde çok kar alırız.)\n3. The new year starts on the first of January. (Yeni yıl bir Ocak'ta başlar.)", "rank": 764}, {"word": "tree", "type": "İsim", "meaning": "1. Ağaç.", "full_meaning": "1. Ağaç.\n2. Soy ağacı, şema (family tree).", "guide": "Uzun, odunsu bir bitki. Mecazi olarak, dallı budaklı bir diyagram.", "examples": "1. We planted a tree in the garden. (Bahçeye bir ağaç diktik.)\n2. The cat climbed up the tree. (Kedi ağaca tırmandı.)\n3. He researched his family tree. (Aile ağacını araştırdı.)", "rank": 765}, {"word": "ok", "type": "Ünlem / Sıfat / Fiil", "meaning": "1. Tamam, olur, peki (onay).", "full_meaning": "1. Tamam, olur, peki (onay).\n2. İyi, idare eder, fena değil.\n3. Onaylamak, tamam demek.", "guide": "Onay, rıza veya durumun kabul edilebilir olduğunu ifade eder. Dünyada en yaygın kabul gören kelimelerden biridir.", "examples": "1. \"Shall we go?\" \"OK.\" (\"Gidelim mi?\" \"Tamam.\")\n2. I feel OK now. (Şimdi kendimi iyi hissediyorum.)\n3. The manager OK'd the proposal. (Müdür teklifi onayladı.)", "rank": 766}, {"word": "mile", "type": "İsim", "meaning": "1. Mil (≈1,6 km).", "full_meaning": "1. Mil (≈1,6 km).\n2. Çok uzun mesafe, epeyce yol.\n3. (miles ahead/behind) Çok önde/geride.", "guide": "İngiliz uzunluk ölçü birimi. Mecazi olarak büyük bir fark veya mesafe belirtmek için kullanılır.", "examples": "1. The town is 10 miles away. (Kasaba 10 mil uzakta.)\n2. You could see for miles. (Kilometrelerce uzaklığı görebiliyordun.)\n3. Her new computer is miles faster. (Onun yeni bilgisayarı çok daha hızlı.)", "rank": 767}, {"word": "encourage", "type": "Fiil", "meaning": "1. Cesaretlendirmek, teşvik etmek.", "full_meaning": "1. Cesare
