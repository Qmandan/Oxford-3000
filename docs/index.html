ı. 2. Cazip, cezbedici. 3. Hoş, güzel.",guide:"Görsel olarak hoş veya faydalı/arzu edilir özelliklere sahip olan.",examples:"1. She is a very attractive woman. (Çok çekici bir kadın.) 2. They made me an attractive job offer. (Bana cazip bir iş teklifi yaptılar.) 3. an attractive price (cazip bir fiyat)"},{word:"audience",type:"İsim",meaning:"1. Seyirci, izleyici, dinleyici. 2. Okuyucu kitlesi. 3. (Hükümdarla) görüşme.",guide:"Bir gösteriyi, konuşmayı izleyen veya dinleyen kişiler topluluğu.",examples:"1. The audience applauded loudly. (Seyirci yüksek sesle alkışladı.) 2. This book is aimed at a young audience. (Bu kitap genç bir okuyucu kitlesini hedefliyor.) 3. The ambassador had an audience with the king. (Büyükelçi kral ile bir görüşme yaptı.)"},{word:"August",type:"İsim",meaning:"1. Ağustos (ay).",guide:"Yılın sekizinci ayı.",examples:"1. We usually go on holiday in August. (Genellikle Ağustos'ta tatile gideriz.) 2. August is often the hottest month. (Ağustos genellikle en sıcak aydır.)"},{word:"aunt",type:"İsim",meaning:"1. Teyze, hala, yenge. 2. (Argo) yaşlı kadın.",guide:"Birinin annesinin veya babasının kız kardeşi veya amcasının/dayısının eşi.",examples:"1. My aunt is coming to visit us. (Teyzem bizi ziyarete geliyor.) 2. He lives with his aunt and uncle. (Teyzesi ve eniştesiyle yaşıyor.)"},{word:"author",type:"İsim",meaning:"1. Yazar. 2. Yaratıcı, mucit. 3. Fail, sorumlu.",guide:"Kitap, makale veya benzeri bir eseri yazan kişi. Mecazi olarak bir şeyin nedeni.",examples:"1. Who is your favourite author? (En sevdiğin yazar kim?) 2. He is the author of several cookbooks. (Birkaç yemek kitabının yazarıdır.) 3. the author of this plan (bu planın yaratıcısı)"},{word:"authority",type:"İsim",meaning:"1. Yetki, otorite. 2. Otorite, yetkili makam. 3. Uzman, otorite (kişi).",guide:"Bir şeyi yapma veya emretme hakkı ve gücü; veya bu güce sahip kişi veya kurum.",examples:"1. She has no authority to make that decision. (O kararı verme yetkisi yok.) 2. The local authorities were informed. (Yerel yetkililere bilgi verildi.) 3. He is an authority on ancient Rome. (O, antik Roma konusunda bir otoritedir.)"},{word:"autumn",type:"İsim",meaning:"1. Sonbahar, güz.",guide:'Yaz ile kış arasındaki mevsim. Amerikan İngilizcesinde "fall" kullanılır.',examples:"1. The leaves change colour in autumn. (Yapraklar sonbaharda renk değiştirir.) 2. We're getting married next autumn. (Gelecek sonbahar evleniyoruz.)"},{word:"available",type:"Sıfat",meaning:"1. Mevcut, var olan. 2. Müsait, uygun. 3. Elde edilebilir, kullanılabilir.",guide:"Kullanıma, satın almaya hazır olan veya birisiyle görüşmeye uygun olan.",examples:"1. Is this dress available in a larger size? (Bu elbise daha büyük bir bedende mevcut mu?) 2. I'm available for a meeting tomorrow. (Yarınki bir toplantı için müsaitim.) 3. The information is available online. (Bilgi çevrimiçi olarak mevcuttur.)"},{word:"average",type:"İsim/Sıfat/Fiil",meaning:"1. Ortalama (isim/sıfat). 2. Sıradan, vasat (sıfat). 3. Ortalamak (fiil).",guide:"Bir grubun tipik değerini temsil eden sayı; ne çok iyi ne de çok kötü olan.",examples:"1. The average temperature in July is 25°C. (Temmuz ayındaki ortalama sıcaklık 25°C'dir.) 2. He's just an average student. (O sadece vasat bir öğrenci.) 3. The rainfall averages 500 mm per year. (Yağış yılda ortalama 500 mm'dir.)"},{word:"avoid",type:"Fiil",meaning:"1. Kaçınmak, sakınmak. 2. Önlemek, engellemek. 3. (Cevap) vermekten kaçınmak.",guide:"Kasıtlı olarak bir şeyden uzak durmak veya onun olmasını engellemek.",examples:"1. Try to avoid fatty foods. (Yağlı yiyeceklerden kaçınmaya çalış.) 2. He avoided eye contact. (Göz temasından kaçındı.) 3. She avoided answering the question. (Soruyu cevaplamaktan kaçındı.)"},{word:"award",type:"İsim/Fiil",meaning:"1. Ödül (isim). 2. Ödül vermek, takdim etmek (fiil). 3. (Mahkeme) vermek, hükmetmek (fiil).",guide:"Bir başarı veya kalite için verilen maddi/manevi ödül veya bu ödülü verme eylemi.",examples:"1. She won an award for best actress. (En iyi kadın oyuncu ödülünü kazandı.) 2. The jury awarded him first prize. (Jüri ona birincilik ödülünü verdi.) 3. The court awarded damages to the victim. (Mahkeme, mağdura tazminat ödenmesine hükmetti.)"},{word:"aware",type:"Sıfat",meaning:"1. Farkında, haberdar. 2. Bilinçli, uyanık. 3. (Politik/sosyal) duyarlı.",guide:"Bir şey hakkında bilgisi olma veya bir şeyi hissetme durumu.",examples:"1. Are you aware of the problem? (Sorundan haberdar mısınız?) 2. He was fully aware of the risks involved. (İlgili risklerin tamamen farkındaydı.) 3. environmentally aware consumers (çevre bilincine sahip tüketiciler)"},{word:"away",type:"Zarf/Sıfat",meaning:"1. Uzakta, uzak. 2. Dışarı, başka yerde. 3. (Spor) deplasman.",guide:"Bir yerden başka bir yerde olma veya bir mesafe kadar uzak olma durumu.",examples:"1. He lives far away. (O uzakta yaşıyor.) 2. She's away on business. (İş seyahatinde.) 3. an away game (deplasman maçı)"},{word:"awful",type:"Sıfat",meaning:"1. Berbat, çok kötü. 2. Korkunç, dehşet verici. 3. (Argo) çok, aşırı.",guide:"Çok kötü, hoş olmayan veya çok büyük miktarda olanı tanımlamak için kullanılan güçlü bir ifade.",examples:"1. The weather was awful. (Hava berbat.) 2. I have an awful headache. (Korkunç bir baş ağrım var.) 3. That's awful kind of you. (Bu sizin çok nazik olduğunuzu gösterir.)"},{word:"baby",type:"İsim",meaning:"1. Bebek. 2. En küçük/kıdemli kişi. 3. Sevgili (hitap).",guide:"Çok küçük çocuk. Mecazi olarak bir grubun en genç veya en tecrübesiz üyesi.",examples:"1. They just had a new baby. (Yeni bir bebekleri oldu.) 2. He's the baby of the family. (O ailenin bebeği/en küçüğüdür.) 3. Hey baby, what's up? (Hey bebeğim, naber?)"},{word:"back",type:"İsim/Sıfat/Zarf/Fiil",meaning:"1. Sırt, arka (isim). 2. Geri, arkaya (zarf). 3. Desteklemek, geriye doğru gitmek (fiil).",guide:"Vücudun arkası; geri yön; geçmiş bir zamana dönüş. Fiil olarak desteklemek veya geri gitmek.",examples:"1. My back hurts. (Sırtım ağrıyor.) 2. Please come back soon. (Lütfen yakında geri gel.) 3. I'll back you up on this decision. (Bu kararında seni destekleyeceğim.)"},{word:"background",type:"İsim",meaning:"1. Arka plan, fon. 2. Geçmiş, geçmiş deneyimler. 3. Art plandaki ses/gürültü.",guide:"Bir görüntünün arkasındaki kısım veya bir kişinin geçmişteki deneyimleri/eğitimi.",examples:"1. The photo has mountains in the background. (Fotoğrafta arka planda dağlar var.) 2. She has a strong academic background. (Güçlü bir akademik geçmişi var.) 3. I could hear music in the background. (Art planda müzik duyabiliyordum.)"},{word:"backwards",type:"Zarf",meaning:"1. Geriye doğru, geri geri. 2. Ters, yanlış yönde. 3. (bend over backwards) elinden geleni yapmak.",guide:"Sırt öne gelecek şekilde veya normal yönün tersine hareket.",examples:"1. He walked backwards. (Geri geri yürüdü.) 2. You've got your sweater on backwards. (Kazağını ters giymişsin.) 3. The UK drives backwards compared to Europe. (BK, Avrupa'ya kıyasla ters yönde araba kullanır - şaka yollu.)"},{word:"bacteria",type:"İsim (çoğul)",meaning:"1. Bakteriler.",guide:'Tek hücreli mikroorganizmalar. Tekili "bacterium" nadiren kullanılır.',examples:"1. Bacteria can cause infections. (Bakteriler enfeksiyona neden olabilir.) 2. Wash your hands to kill bacteria. (Ellerini yıka, bakterileri öldür.)"},{word:"bad",type:"Sıfat",meaning:"1. Kötü, fena. 2. Bozuk, çürük. 3. Şiddetli, ciddi.",guide:"Kalitesiz, istenmeyen veya ahlaken yanlış olan.",examples:"1. He's in a bad mood. (Kötü bir ruh hali içinde.) 2. This milk has gone bad. (Bu süt bozulmuş.) 3. a bad accident (ciddi bir kaza)"},{word:"badly",type:"Zarf",meaning:"1. Kötü bir şekilde, fena halde. 2. Çok, son derece. 3. Ciddi şekilde, ağır.",guide:'Kötü kalitede veya olumsuz bir şekilde. Ayrıca "çok" anlamını güçlendirir.',examples:"1. He played badly. (Kötü oynadı.) 2. I need this job badly. (Bu işe çok ihtiyacım var.) 3. She was badly injured. (Ağır şekilde yaralandı.)"},{word:"bag",type:"İsim",meaning:"1. Çanta, torba. 2. (Göz altı) torba. 3. Av, avlanan şey.",guide:"Taşımak için kullanılan, genellikle esnek kap.",examples:"1. a plastic shopping bag (plastik bir alışveriş torbası) 2. She has bags under her eyes. (Gözlerinin altında torbalar var.) 3. We had a good bag of fish today. (Bugün iyi bir av balık yakaladık.)"},{word:"bake",type:"Fiil",meaning:"1. Fırında pişirmek. 2. (Güneşte) kavurmak, pişirmek. 3. (Çamur/tuğla) kurutmak, pişirmek.",guide:"Özellikle fırında, genellikle kuru ısıda pişirme işlemi (ekmek, kek, pasta).",examples:"1. I'm going to bake a cake. (Bir kek pişireceğim.) 2. We were baking in the sun. (Güneşte kavruluyorduk.) 3. baked potatoes (fırınlanmış patates)"},{word:"balance",type:"İsim/Fiil",meaning:"1. Denge (isim/fiil). 2. Bakiye, kalan miktar (isim). 3. Dengelemek (fiil).",guide:"Fiziksel denge veya farklı unsurların eşit/uyumlu olması. Ayrıca banka hesap bakiyesi.",examples:"1. She lost her balance and fell. (Dengesini kaybetti ve düştü.) 2. My bank balance is low. (Banka bakiyem düşük.) 3. It's hard to balance work and family life. (İş ve aile hayatını dengelemek zordur.)"},{word:"ball",type:"İsim",meaning:"1. Top. 2. Yumak, topak. 3. Balo, danslı eğlence.",guide:"Yuvarlak, genellikle oyun veya spor için kullanılan nesne.",examples:"1. Throw the ball to me. (Topu bana at.) 2. a ball of wool (bir yumak yün) 3. They met at the Christmas ball. (Noel balosunda tanıştılar.)"},{word:"ban",type:"Fiil/İsim",meaning:"1. Yasaklamak (fiil). 2. Yasak (isim).",guide:"Resmi olarak bir şeyi yasaklamak veya yasağın kendisi.",examples:"1. Smoking is banned in restaurants. (Restoranlarda sigara içmek yasak.) 2. There is a ban on plastic bags. (Plastik poşetlere yasak getirildi.)"},{word:"banana",type:"İsim",meaning:"1. Muz. 2. (go bananas) çıldırmak, çok heyecanlanmak.",guide:"Sarı, eğri bir meyve. Argo olarak delirmek anlamında kullanılır.",examples:"1. A banana is a good source of potassium. (Muz iyi bir potasyum kaynağıdır.) 2. The kids will go bananas for this cake. (Çocuklar bu kek için çıldıracaklar.)"},{word:"band",type:"İsim",meaning:"1. Müzik grubu, orkestra. 2. Bant, şerit. 3. Grup, topluluk.",guide:"Müzisyenlerden oluşan grup veya düz, ince bir şerit.",examples:"1. He plays in a rock band. (Bir rock grubunda çalıyor.) 2. She wore a rubber band in her hair. (Saçına bir lastik bant taktı.) 3. a small band of rebels (küçük bir asi grubu)"},{word:"bank (money)",type:"İsim",meaning:"1. Banka. 2. (Kumar) banko, bank. 3. (Kan/veri) deposu.",guide:"Para saklama, ödünç alma/verme işleri yapan finans kuruluşu.",examples:"1. I need to go to the bank. (Bankaya gitmem gerekiyor.) 2. a blood bank (bir kan bankası)"},{word:"bank (river)",type:"İsim",meaning:"1. Kıyı, kenar. 2. Set, yığın. 3. (Uçak) yana yatırmak.",guide:"Nehir veya su yolu kenarındaki toprak yükseltisi.",examples:"1. We had a picnic on the river bank. (Nehir kıyısında piknik yaptık.) 2. The plane banked sharply. (Uçak sert bir şekilde yana yattı.)"},{word:"bar",type:"İsim/Fiil",meaning:"1. Bar, içkili mekan (isim). 2. Çubuk, parça (isim). 3. Engel olmak, yasaklamak (fiil).",guide:"İçki içilen yer; uzun, sert bir nesne; bir şeyi engelleme.",examples:"1. Let's meet at the bar. (Barda buluşalım.) 2. a bar of chocolate (bir parça çikolata) 3. He was barred from entering the club. (Klübe girmesi yasaklandı.)"},{word:"barrier",type:"İsim",meaning:"1. Bariyer, engel. 2. Mania, set. 3. (Soyut) engel.",guide:"Fiziksel veya soyut bir engel, sınır.",examples:"1. The police put up a barrier. (Polis bir bariyer koydu.) 2. Language can be a barrier to communication. (Dil, iletişimde bir engel olabilir.) 3. the sound barrier (ses bariyeri)"},{word:"base",type:"İsim/Fiil/Sıfat",meaning:"1. Taban, temel, üs (isim). 2. Dayandırmak (fiil). 3. Adi, aşağılık (sıfat).",guide:"Bir şeyin üzerine oturduğu, dayandığı kısım. Fiil olarak bir şeyi başka bir şeye dayandırmak.",examples:"1. The lamp has a wide base. (Lambanın geniş bir tabanı var.) 2. The story is based on real events. (Hikaye gerçek olaylara dayanıyor.) 3. a military base (askeri üs)"},{word:"baseball",type:"İsim",meaning:"1. Beyzbol (spor). 2. Beyzbol topu.",guide:"Topa sopayla vurularak oynanan bir takım sporu.",examples:"1. Do you like watching baseball? (Beyzbol izlemeyi sever misin?) 2. He threw the baseball to first base. (Beyzbol topunu birinci üsse attı.)"},{word:"based",type:"Sıfat",meaning:"1. Merkezli, üslü. 2. Dayalı, esaslı.",guide:"Faaliyetlerin merkezinin veya bir şeyin kaynağının nerede olduğunu belirtir.",examples:"1. She works for a London-based company. (Londra merkezli bir şirkette çalışıyor.) 2. evidence-based medicine (kanıta dayalı tıp)"},{word:"basic",type:"Sıfat",meaning:"1. Temel, esas. 2. Basit, sade. 3. (İhtiyaç) asgari, zaruri.",guide:"En gerekli, en önemli veya en az karmaşık olan.",examples:"1. You need to learn the basic rules first. (Önce temel kuralları öğrenmen gerek.) 2. The accommodation is very basic. (Konaklama yeri çok sade.) 3. basic human rights (temel insan hakları)"},{word:"basically",type:"Zarf",meaning:"1. Temelde, aslında, özünde. 2. Kısacası, yani.",guide:"Bir şeyin en önemli veya basit gerçeğini vurgulamak için kullanılır.",examples:"1. Basically, he's just lazy. (Temelde, o sadece tembel.) 2. So basically, we're lost. (Yani kısacası, kaybolduk.)"},{word:"basis",type:"İsim",meaning:"1. Temel, dayanak, esas. 2. (on a ... basis) esasına göre.",guide:"Bir şeyin üzerine kurulduğu ilke, neden veya sistem.",examples:"1. Trust is the basis of a good relationship. (Güven, iyi bir ilişkinin temelidir.) 2. We're paid on a weekly basis. (Haftalık esasına göre ödeme alıyoruz.)"},{word:"basketball",type:"İsim",meaning:"1. Basketbol (spor). 2. Basketbol topu.",guide:"Topun potaya atılmasıyla oynanan bir takım sporu.",examples:"1. He plays basketball for his school. (Okulu için basketbol oynuyor.) 2. Pass me the basketball. (Basketbol topunu bana at.)"},{word:"bath",type:"İsim",meaning:"1. Banyo, küvet. 2. Banyo yapma eylemi. 3. (Kimya) banyo.",guide:"Küvet veya küvette yıkanma eylemi.",examples:"1. I'm going to have a hot bath. (Sıcak bir banyo yapacağım.) 2. The bath is full. (Küvet dolu.)"},{word:"bathroom",type:"İsim",meaning:"1. Banyo (tuvalet ve yıkanma yeri). 2. Tuvalet (Amerikan kullanımı).",guide:"Tuvalet, lavabo ve banyo/duşun bulunduğu oda. Amerikan İngilizcesinde genellikle sadece tuvalet anlamında kullanılır.",examples:"1. Where is the bathroom, please? (Banyo nerede, lütfen?) 2. I need to use the bathroom. (Tuvaleti kullanmam gerekiyor.)"},{word:"battery",type:"İsim",meaning:"1. Pil, batarya. 2. (Hukuk) darp, saldırı. 3. (Topçu) batarya.",guide:"Elektrik enerjisi depolayan ve sağlayan cihaz.",examples:"1. The remote control needs new batteries. (Uzaktan kumandanın yeni pile ihtiyacı var.) 2. a car battery (bir araba aküsü)"},{word:"battle",type:"İsim/Fiil",meaning:"1. Savaş, muharebe (isim). 2. Mücadele, çaba (isim). 3. Savaşmak, mücadele etmek (fiil).",guide:"İki ordu/grup arasındaki silahlı çatışma veya herhangi bir zorlu mücadele.",examples:"1. They died in battle. (Savaşta öldüler.) 2. a legal battle (yasal bir mücadele) 3. She is battling cancer. (Kanserle savaşıyor.)"},{word:"be",type:"Fiil",meaning:"1. Olmak (var olma/durum). 2. -dır, -dir (tanımlama). 3. (yardımcı fiil) -mekte, -yor.",guide:"Varlık, durum veya kimlik bildiren temel fiil. Süreklilik, edilgenlik gibi zamanları oluşturmak için yardımcı fiil olarak da kullanılır.",examples:"1. I want to be happy. (Mutlu olmak istiyorum.) 2. She is a doctor. (O bir doktordur.) 3. They are sleeping. (Onlar uyuyorlar.)"},{word:"beach",type:"İsim",meaning:"1. Plaj, kumsal, sahil.",guide:"Deniz, göl veya nehir kenarındaki kumlu veya çakıllı alan.",examples:"1. Let's spend the day at the beach. (Günü plajda geçirelim.) 2. a sandy beach (kumlu bir plaj)"},{word:"bean",type:"İsim",meaning:"1. Fasulye, bakla. 2. (full of beans) enerji dolu. 3. (spill the beans) sırrı açığa vurmak.",guide:"Bir tür sebze tohumu. Argo deyimlerde kullanılır.",examples:"1. I love green beans. (Taze fasulyeyi severim.) 2. The kids are full of beans this morning. (Çocuklar bu sabah enerji dolu.) 3. Who spilled the beans about the party? (Parti hakkında sırrı kim açığa vurdu?)"},{word:"bear (deal with)",type:"Fiil",meaning:"1. Katlanmak, dayanmak, tahammül etmek. 2. Taşımak, yüklenmek. 3. Doğurmak, getirmek (meyve).",guide:"Hoş olmayan bir şeye tahammül etmek veya bir yükü taşımak.",examples:"1. I can't bear this pain. (Bu acıya dayanamıyorum.) 2. The document bears his signature. (Belge onun imzasını taşır.) 3. This tree bears fruit in the summer. (Bu ağaç yazın meyve verir.)"},{word:"bear (animal)",type:"İsim",meaning:"1. Ayı. 2. (Borsa) borsa düşüşçüsü, ayı.",guide:"Büyük, kürklü bir memeli hayvan. Finansta fiyatların düşeceğine inanan yatırımcı.",examples:"1. We saw a brown bear in the forest. (Ormanda bir boz ayı gördük.) 2. Bear markets can be tough for investors. (Ayı piyasaları yatırımcılar için zor olabilir.)"},{word:"beat",type:"Fiil/İsim",meaning:"1. Yenmek, dövmek (fiil). 2. Vurmak, çarpmak (kalp) (fiil). 3. Ritim, vuruş (isim).",guide:"Bir yarışma veya mücadelede galip gelmek; düzenli olarak vurmak.",examples:"1. Our team beat theirs. (Takımımız onlarınkini yendi.) 2. My heart beats fast when I run. (Koştuğumda kalbim hızlı atar.) 3. I love the beat of this song. (Bu şarkının ritmini seviyorum.)"},{word:"beautiful",type:"Sıfat",meaning:"1. Güzel. 2. Harika, muhteşem. 3. Çok hoş, nefis.",guide:"Görsel veya duygusal olarak çok hoşa giden, çekici.",examples:"1. She has a beautiful smile. (Çok güzel bir gülümsemesi var.) 2. What a beautiful day! (Ne güzel bir gün!) 3. The music was beautiful. (Müzik çok güzeldi.)"},{word:"beauty",type:"İsim",meaning:"1. Güzellik. 2. Güzel şey/kişi. 3. Güzellik ürünü.",guide:"Güzel olma niteliği veya güzel olan şeyin kendisi.",examples:"1. We admired the beauty of the landscape. (Manzaranın güzelliğine hayran kaldık.) 2. She was a great beauty in her youth. (Gençliğinde büyük bir güzeldi.) 3. a beauty salon (bir güzellik salonu)"},{word:"because",type:"Bağlaç",meaning:"1. Çünkü. 2. (because of) -den dolayı, yüzünden.",guide:"Bir eylemin veya durumun nedenini açıklamak için kullanılan bağlaç.",examples:"1. I'm late because the traffic was bad. (Geç kaldım çünkü trafik kötüydü.) 2. The match was cancelled because of rain. (Maç yağmur yüzünden iptal edildi.)"},{word:"become",type:"Fiil",meaning:"1. Olmak, haline gelmek. 2. Yakışmak, gitmek (birine). 3. (Become of) -e olmak, başına gelmek.",guide:"Bir durumdan başka bir duruma geçmek, dönüşmek.",examples:"1. He wants to become a pilot. (Pilot olmak istiyor.) 2. That dress really becomes you. (O elbise sana gerçekten çok yakışıyor.) 3. What will become of us? (Bize ne olacak?)"},{word:"bed",type:"İsim",meaning:"1. Yatak. 2. (Nehir/çiçek) yatağı. 3. Taban, temel.",guide:"Uyumak için kullanılan mobilya. Mecazi olarak bir şeyin üzerine oturduğu yer.",examples:"1. It's time to go to bed. (Yatma zamanı.) 2. a river bed (bir nehir yatağı) 3. a flower bed (bir çiçek tarhı)"},{word:"bedroom",type:"İsim",meaning:"1. Yatak odası.",guide:"Uyumak için kullanılan oda.",examples:"1. The house has three bedrooms. (Evin üç yatak odası var.) 2. My bedroom is upstairs. (Yatak odam üst katta.)"},{word:"bee",type:"İsim",meaning:"1. Arı. 2. (busy as a bee) arı gibi çalışkan. 3. (bee in one's bonnet) takıntı, sabit fikir.",guide:"Bal yapan kanatlı böcek. Deyimlerde çalışkanlık veya takıntı anlamında kullanılır.",examples:"1. A bee stung me. (Bir arı beni soktu.) 2. She's as busy as a bee preparing for the party. (Parti hazırlığı için arı gibi çalışıyor.)"},{word:"beef",type:"İsim",meaning:"1. Sığır eti, biftek. 2. (have a beef with) -den şikayeti olmak. 3. Şikayet, sızı.",guide:"İnek eti. Argo olarak şikayet veya anlaşmazlık anlamına gelir.",examples:"1. I'd like a beef burger, please. (Bir biftek burger istiyorum lütfen.) 2. What's your beef with him? (Onunla derdin ne?)"},{word:"beer",type:"İsim",meaning:"1. Bira. 2. Bir bardak/sise bira.",guide:"Arpa, şerbetçiotu ve sudan yapılan alkollü içecek.",examples:"1. Would you like a beer? (Bir bira ister misin?) 2. Two beers, please. (İki bira lütfen.)"},{word:"before",type:"Edat/Bağlaç/Zarf",meaning:"1. Önce, evvel (edat/zarf). 2. -den önce (bağlaç). 3. Önünde (edat).",guide:"Zaman veya sıra bakımından daha önce olmayı ifade eder.",examples:"1. I saw her the day before yesterday. (Onu dünden önceki gün gördüm.) 2. Wash your hands before you eat. (Yemekten önce ellerini yıka.) 3. He stood before the judge. (Hakimin önünde durdu.)"},{word:"beg",type:"Fiil",meaning:"1. Yalvarmak, dilenmek. 2. Rica etmek, istirham etmek. 3. (beg the question) soruyu cevaplamaktan kaçınmak.",guide:"Bir şey için çok acil ve alçakgönüllü bir şekilde istemek.",examples:"1. He begged for forgiveness. (Affetmesi için yalvardı.) 2. I beg you to reconsider. (Lütfen tekrar düşünmenizi rica ediyorum.) 3. She was begging on the street. (Sokakta dileniyordu.)"},{word:"begin",type:"Fiil",meaning:"1. Başlamak. 2. Ortaya çıkmak. 3. (To begin with) ilk olarak, öncelikle.",guide:'Bir şeyi yapmaya veya olmaya başlamak. "Start" ile benzerdir.',examples:"1. The concert begins at eight. (Konser sekizde başlıyor.) 2. Where shall I begin? (Nereden başlayayım?) 3. To begin with, we need more money. (İlk olarak, daha fazla paraya ihtiyacımız var.)"},{word:"beginning",type:"İsim",meaning:"1. Başlangıç. 2. Köken, kaynak. 3. İlk bölüm, giriş.",guide:"Bir şeyin başladığı nokta veya ilk kısmı.",examples:"1. I loved the book from the beginning. (Kitabı başlangıcından itibaren sevdim.) 2. the beginning of time (zamanın başlangıcı) 3. This is just the beginning. (Bu daha sadece başlangıç.)"},{word:"behave",type:"Fiil",meaning:"1. Davranmak, hareket etmek. 2. Uslu durmak, terbiyeli olmak. 3. (Makina) düzgün çalışmak.",guide:"Belirli bir şekilde hareket etmek, özellikle kabul edilebilir/kurallara uygun şekilde.",examples:"1. The children behaved very well. (Çocuklar çok iyi davrandılar.) 2. Behave yourself! (Uslu dur!/Terbiyeni takın!) 3. My computer is not behaving. (Bilgisayarım düzgün çalışmıyor.)"},{word:"behaviour",type:"İsim",meaning:"1. Davranış, tavır, hareket tarzı. 2. (Hayvan) davranışları.",guide:"Bir kişinin veya hayvanın hareket tarzı, tutumu.",examples:"1. His behaviour was unacceptable. (Onun davranışı kabul edilemezdi.) 2. animal behaviour (hayvan davranışı)"},{word:"behind",type:"Edat/Zarf",meaning:"1. Arkasında, gerisinde (edat). 2. Geride, arkada (zarf). 3. (Planın) arkasında, sorumlusu.",guide:"Bir şeyin arka tarafında veya zaman/açıdan geride olma durumu.",examples:"1. The cat hid behind the sofa. (Kedi kanepenin arkasına saklandı.) 2. I'm behind with my work. (İşimde gerideyim.) 3. What's the idea behind this project? (Bu projenin arkasındaki fikir nedir?)"},{word:"being",type:"İsim",meaning:"1. Varlık, yaratık. 2. Var olma, mevcudiyet. 3. Öz, tabiat.",guide:'Canlı bir organizma, özellikle insan. Ayrıca "olma" durumu.',examples:"1. a human being (bir insan) 2. The company came into being in 1995. (Şirket 1995'te kuruldu.) 3. Her whole being was focused on the task. (Tüm varlığı görev üzerinde odaklanmıştı.)"},{word:"belief",type:"İsim",meaning:"1. İnanç, itikat. 2. Kanı, kanaat, düşünce. 3. Güven, inanma.",guide:"Bir şeyin doğru olduğuna dair zihinsel kabul veya dini inanç.",examples:"1. Religious belief is important to her. (Dini inanç onun için önemlidir.) 2. It's my belief that he is innocent. (Onun masum olduğu kanaatindeyim.) 3. a strong belief in democracy (demokrasiye güçlü bir inanç)"},{word:"believe",type:"Fiil",meaning:"1. İnanmak. 2. Sanmak, zannetmek. 3. Güvenmek.",guide:"Bir şeyin doğru olduğunu düşünmek veya birine güvenmek.",examples:"1. Do you believe in ghosts? (Hayaletlere inanır mısın?) 2. I believe she's telling the truth. (Bence doğruyu söylüyor.) 3. Believe in yourself! (Kendine inan!)"},{word:"bell",type:"İsim",meaning:"1. Çan, zil. 2. (ring a bell) bir şeyi hatırlatmak. 3. (Saved by the bell) son anda kurtulmak.",guide:"Çalındığında ses çıkaran metal nesne. Deyimlerde kullanılır.",examples:"1. The church bell rings every hour. (Kilise çanı her saat başı çalar.) 2. Does that name ring a bell? (O isim bir şey hatırlatıyor mu?)"},{word:"belong",type:"Fiil",meaning:"1. Ait olmak. 2. Uygun olmak, yeri olmak. 3. (belong to) üyesi olmak.",guide:"Sahiplik, üyelik veya uygun bir yer/ortam ifade eder.",examples:"1. This book belongs to me. (Bu kitap bana ait.) 2. You don't belong here. (Senin burada yerin yok.) 3. She belongs to a chess club. (Bir satranç kulübünün üyesi.)"},{word:"below",type:"Edat/Zarf",meaning:"1. Altında, aşağısında (edat). 2. Aşağıda, aşağısında (zarf). 3. (Sıcaklık) altında, daha az.",guide:'Bir şeyin altında veya daha az bir değerde olma durumu. "Under" fiziksel temas vurgularken, "below" daha çok seviye/farklı düzlem belirtir.',examples:"1. The temperature is below zero. (Sıcaklık sıfırın altında.) 2. Please see the notes below. (Lütfen aşağıdaki notlara bakın.) 3. He ranked just below the captain. (Kaptanın hemen altında sıralandı.)"},{word:"belt",type:"İsim",meaning:"1. Kemer, kayış. 2. Kuşak, bölge. 3. (tighten one's belt) kemerleri sıkmak.",guide:"Pantolonu tutan veya makine parçalarını birleştiren şerit. Coğrafi bölge anlamı da vardır.",examples:"1. He tightened his belt. (Kemerini sıktı.) 2. the commuter belt (banliyö kuşağı) 3. the fan belt in a car (bir arabadaki fan kayışı)"},{word:"bend",type:"Fiil/İsim",meaning:"1. Bükmek, eğmek (fiil). 2. Dönemeç, viraj (isim). 3. (bend the rules) kuralları esnetmek.",guide:"Düz bir şeyi eğmek veya bir eğri oluşturmak.",examples:"1. Bend your knees when lifting. (Kaldırırken dizlerinizi bükün.) 2. a sharp bend in the road (yolda keskin bir viraj) 3. He bent down to pick up the coin. (Madalyonu almak için eğildi.)"},{word:"benefit",type:"İsim/Fiil",meaning:"1. Yarar, fayda (isim). 2. Sosyal yardım (isim). 3. Yararlanmak, faydalanmak (fiil).",guide:"Olumlu, faydalı bir sonuç veya devlet yardımı.",examples:"1. The benefits of exercise are well known. (Egzersizin yararları iyi bilinir.) 2. He is on unemployment benefit. (O, işsizlik yardımı alıyor.) 3. We all benefit from a good education. (Hepimiz iyi bir eğitimden yararlanırız.)"},{word:"bent",type:"Sıfat/İsim",meaning:"1. Eğri, bükülmüş (sıfat). 2. Eğilim, yetenek (isim). 3. (bent on) kararlı, azimli.",guide:"Düz olmayan şekil. İsim olarak bir şeye doğal yatkınlık.",examples:"1. a bent nail (eğri bir çivi) 2. She has a natural bent for music. (Onun doğal bir müzik yeteneği var.) 3. He is bent on winning. (Kazanmaya kararlı.)"},{word:"best",type:"Sıfat/Zarf/İsim",meaning:"1. En iyi (sıfat). 2. En iyi şekilde (zarf). 3. En iyisi (isim).",guide:'"Good" ve "well"in en üstünlük derecesi.',examples:"1. She's my best friend. (O benim en iyi arkadaşım.) 2. I work best in the morning. (En iyi sabahları çalışırım.) 3. We want the best for our children. (Çocuklarımız için en iyisini istiyoruz.)"},{word:"bet",type:"Fiil/İsim",meaning:"1. Bahse girmek (fiil). 2. Bahis, iddia (isim). 3. (I bet) Eminim, bahse girerim ki.",guide:"Para veya başka bir şey üzerine, bir olayın sonucu hakkında anlaşma yapmak. Konuşmada kesinlik ifade eder.",examples:"1. I bet £10 on the red horse. (Kırmızı at üzerine 10 sterline bahse girdim.) 2. It's a safe bet that it will rain. (Yağmur yağacağı kesin gibi.) 3. I bet you're tired. (Eminim yorgunsundur.)"},{word:"better",type:"Sıfat/Zarf/Fiil",meaning:"1. Daha iyi (sıfat). 2. Daha iyi (zarf). 3. Geliştirmek, iyileştirmek (fiil).",guide:'"Good" ve "well"in karşılaştırma derecesi. Fiil olarak bir şeyi daha iyi hale getirmek.',examples:"1. Your idea is better than mine. (Fikrin benimkinden daha iyi.) 2. She sings better than I do. (O benden daha iyi şarkı söyler.) 3. We must better our understanding. (Anlayışımızı geliştirmeliyiz.)"},{word:"between",type:"Edat",meaning:"1. Arasında (iki şey/kişi). 2. Ortaklaşa, birlikte. 3. Arasında seçim yapmak.",guide:"İki nokta, kişi, şey veya zaman arasındaki ilişkiyi gösterir.",examples:"1. The bank is between the post office and the library. (Banka postane ile kütüphane arasında.) 2. We shared the money between us. (Parayı aramızda paylaştık.) 3. Choose between these two options. (Bu iki seçenek arasından seçim yap.)"},{word:"beyond",type:"Edat/Zarf",meaning:"1. Ötesinde, öte (edat). 2. Üzerinde, fazlasıyla (edat). 3. Daha öte, ilerisi (zarf).",guide:"Bir şeyin diğer tarafında veya bir sınırın/olasılığın ötesinde olma durumu.",examples:"1. The village is beyond the mountains. (Köy dağların ötesindedir.) 2. The situation is beyond my control. (Durum benim kontrolümün ötesinde.) 3. and beyond (ve ötesi)"},{word:"bicycle",type:"İsim",meaning:"1. Bisiklet. 2. (bike) bisiklete binmek.",guide:"Pedallarla hareket ettirilen iki tekerlekli taşıt.",examples:"1. He goes to work by bicycle. (İşe bisikletle gidiyor.) 2. I need to repair my bicycle. (Bisikletimi tamir etmem gerekiyor.)"},{word:"big",type:"Sıfat",meaning:"1. Büyük, iri. 2. Önemli, mühim. 3. Yaşça büyük.",guide:"Fiziksel boyut veya önem bakımından büyük.",examples:"1. They live in a big house. (Büyük bir evde yaşıyorlar.) 2. This is a big decision. (Bu önemli bir karar.) 3. my big brother (benim abim)"},{word:"bike",type:"İsim/Fiil",meaning:"1. Bisiklet, motosiklet (isim). 2. Bisiklete binmek (fiil).",guide:'"Bicycle" veya "motorcycle"ın kısaltılmış, günlük kullanım şekli.',examples:"1. I rode my bike to school. (Okula bisikletimle gittim.) 2. Do you want to go for a bike ride? (Bisiklet sürmeye gitmek ister misin?)"},{word:"bill",type:"İsim",meaning:"1. Fatura, hesap. 2. Kanun tasarısı. 3. (Kuş) gagası.",guide:"Ödenecek paranın yazılı olduğu liste veya parlamentoda tartışılan yasa önerisi.",examples:"1. Can I have the bill, please? (Hesabı alabilir miyim lütfen?) 2. The new tax bill was passed. (Yeni vergi tasarısı kabul edildi.) 3. a duck's bill (bir ördeğin gagası)"},{word:"billion",type:"Sayı/İsim",meaning:"1. Milyar (1,000,000,000). 2. (Eskiden UK) trilyon. 3. Çok büyük sayı.",guide:"Sayısal değer (10^9). Eskiden İngiliz İngilizcesinde farklı anlamı vardı, artık evrenseldir.",examples:"1. The company is worth several billion dollars. (Şirket birkaç milyar dolar değerinde.) 2. billions of stars (milyarlarca yıldız)"},{word:"bin",type:"İsim (UK)",meaning:"1. Çöp kutusu, çöp tenekesi. 2. Depolama kabı. 3. (throw in the bin) çöpe atmak.",guide:"Çöp atmak veya bir şeyleri saklamak için kullanılan kap.",examples:"1. Put the rubbish in the bin. (Çöpleri çöp kutusuna at.) 2. a bread bin (bir ekmek kutusu)"},{word:"biology",type:"İsim",meaning:"1. Biyoloji.",guide:"Canlı organizmaları inceleyen bilim dalı.",examples:"1. She's studying biology at university. (Üniversitede biyoloji okuyor.) 2. marine biology (deniz biyolojisi)"},{word:"bird",type:"İsim",meaning:"1. Kuş. 2. (Argo UK) kız, hatun. 3. (a bird in the hand) eldeki bir şey.",guide:"Tüylü, kanatlı, yumurtlayan hayvan. Argo anlamı Britanya'da yaygındır.",examples:"1. I can hear a bird singing. (Bir kuşun şarkı söylediğini duyabiliyorum.) 2. He's always out with different birds. (O her zaman farklı kızlarla dışarıdadır.)"},{word:"birth",type:"İsim",meaning:"1. Doğum. 2. Başlangıç, köken. 3. Soy, nesep.",guide:"Bir bebeğin dünyaya gelmesi veya bir şeyin başlaması.",examples:"1. The birth of their son was a joyous occasion. (Oğullarının doğumu sevinçli bir olaydı.) 2. the birth of democracy (demokrasinin doğuşu) 3. She is French by birth. (Doğuştan Fransızdır.)"},{word:"birthday",type:"İsim",meaning:"1. Doğum günü.",guide:"Bir kişinin doğduğu günün yıldönümü.",examples:"1. Happy birthday! (Doğum günün kutlu olsun!) 2. My birthday is in July. (Doğum günüm Temmuz'da.)"},{word:"biscuit",type:"İsim (UK)",meaning:"1. Bisküvi, kurabiye. 2. (US) yumuşak ekmekçik.",guide:"Un, yağ ve şekerden yapılan küçük, sert veya gevrek hamur işi. Amerikan İngilizcesinde farklı bir şeydir.",examples:"1. Would you like a cup of tea and a biscuit? (Bir bardak çay ve bir bisküvi ister misiniz?) 2. chocolate biscuits (çikolatalı bisküviler)"},{word:"bit",type:"İsim",meaning:"1. Parça, küçük bir miktar. 2. (Bilgisayar) bit. 3. (a bit) biraz, azıcık.",guide:'Küçük bir parça veya miktar. "A bit" biraz anlamında sıkça kullanılır.',examples:"1. Would you like a bit of cake? (Biraz kek ister misin?) 2. Wait a bit! (Biraz bekle!) 3. I'm feeling a bit tired. (Biraz yorgun hissediyorum.)"},{word:"bite",type:"Fiil/İsim",meaning:"1. Isırmak (fiil). 2. Isırık (isim). 3. (balık) oltaya gelmek, vurmak.",guide:"Dişlerle koparmak veya sıkıştırmak. Balık avı için de kullanılır.",examples:"1. The dog bit the postman. (Köpek postacıyı ısırdı.) 2. He took a big bite of the apple. (Elmadan büyük bir ısırık aldı.) 3. The fish are not biting today. (Balıklar bugün vurmuyor.)"},{word:"bitter",type:"Sıfat",meaning:"1. Acı (tat). 2. Acı (duygu), sert, kırgın. 3. Şiddetli, keskin (soğuk).",guide:"Hoş olmayan keskin bir tat veya yoğun bir olumsuz duygu (nefret, hayal kırıklığı).",examples:"1. Black coffee tastes bitter. (Sade kahve acı tat verir.) 2. She felt bitter about losing the competition. (Yarışmayı kaybettiği için kırgın hissediyordu.) 3. a bitter wind (keskin bir rüzgar)"},{word:"black",type:"Sıfat/İsim",meaning:"1. Siyah, kara (sıfat/isim). 2. Koyu, karanlık. 3. (coffee) sade, şekersiz.",guide:"En koyu renk, ışığın yokluğu. Kahve için sade anlamına gelir.",examples:"1. She was wearing a black dress. (Siyah bir elbise giyiyordu.) 2. Black coffee, please. (Sade kahve, lütfen.) 3. The room was in blackness. (Oda kapkaranlıktı.)"},{word:"blame",type:"Fiil/İsim",meaning:"1. Suçlamak, ayıplamak (fiil). 2. Suç, kabahat (isim). 3. (be to blame) suçlu olmak.",guide:"Bir hata veya kötü bir şeyden sorumlu tutmak.",examples:"1. Don't blame me for your mistake. (Kendi hatan için beni suçlama.) 2. Who is to blame for this mess? (Bu karışıklık için kim suçlu?) 3. He took the blame for the accident. (Kaza için suçu üstlendi.)"},{word:"blank",type:"Sıfat/İsim",meaning:"1. Boş (sıfat). 2. Ifadesiz, donuk (sıfat). 3. Boşluk, boş kağıt (isim).",guide:"Üzerinde yazı, işaret vs. olmayan veya ifadesiz olan.",examples:"1. a blank sheet of paper (boş bir kağıt) 2. He gave me a blank look. (Bana ifadesiz bir bakış attı.) 3. My mind went blank. (Aklım tamamen boşaldı.)"},{word:"blind",type:"Sıfat/Fiil/İsim",meaning:"1. Kör (sıfat). 2. Kör etmek (fiil). 3. Jaluzi, stor (isim).",guide:"Göremeyen. Fiil olarak görme yetisini kaybettirmek veya mantığı perdelemek.",examples:"1. He is blind in one eye. (Bir gözü kördür.) 2. The bright lights blinded me for a moment. (Parlak ışıklar beni bir anlığına kör etti.) 3. Pull down the blinds. (Storları indir.)"},{word:"block",type:"İsim/Fiil",meaning:"1. Blok (bina/tahta) (isim). 2. Engel olmak, tıkamak (fiil). 3. (around the block) binanın çevresinde.",guide:"Büyük, katı bir kütle veya bir şeyin yolunu kesme eylemi.",examples:"1. a block of flats (bir apartman bloğu) 2. A fallen tree is blocking the road. (Devrilmiş bir ağaç yolu tıkıyor.) 3. a chopping block (bir doğrama tahtası)"},{word:"blog",type:"İsim/Fiil",meaning:"1. Blog, internet günlüğü (isim). 2. Blog yazmak (fiil).",guide:"Bir kişi veya grubun düzenli olarak yazı, resim vs. yayınladığı internet sitesi.",examples:"1. I read her travel blog every week. (Onun seyahat blogunu her hafta okurum.) 2. She blogs about food. (Yemek hakkında blog yazar.)"},{word:"blonde",type:"Sıfat/İsim",meaning:"1. Sarışın (sıfat). 2. Sarışın kişi (isim).",guide:'Açık sarı veya altın rengi saçlı. Geleneksel olarak kadınlar için "blonde", erkekler için "blond" kullanılır, ama bu ayrım artık çok katı değildir.',examples:"1. She has blonde hair. (Sarışındır.) 2. He's a tall blond. (Uzun boylu bir sarışın.)"},{word:"blood",type:"İsim",meaning:"1. Kan. 2. Soy, nesil. 3. (in cold blood) soğukkanlılıkla.",guide:"Damarlarda dolaşan kırmızı sıvı. Aile bağlarını ifade eder.",examples:"1. He gave blood at the hospital. (Hastanede kan verdi.) 2. They are related by blood. (Kan bağıyla akrabalar.) 3. blood pressure (kan basıncı)"},{word:"blow",type:"Fiil/İsim",meaning:"1. Üflemek, esmek (rüzgar) (fiil). 2. Darbe, vuruş (isim). 3. (blow up) patlatmak, havaya uçurmak.",guide:"Hava hareketi veya sert bir darbe.",examples:"1. The wind is blowing hard. (Rüzgar sert esiyor.) 2. He was knocked out by a blow to the head. (Kafasına bir darbe ile nakavt oldu.) 3. Blow out the candles. (Mumları üfle.)"},{word:"blue",type:"Sıfat/İsim",meaning:"1. Mavi (sıfat/isim). 2. Mutsuz, hüzünlü. 3. Müstehcen, açık saçık.",guide:"Gökyüzü ve denizin rengi. Duygu durumu olarak hüzünlü anlamına gelir.",examples:"1. She has beautiful blue eyes. (Güzel mavi gözleri var.) 2. I'm feeling a bit blue today. (Bugün biraz hüzünlü hissediyorum.) 3. a blue joke (müstehcen bir şaka)"},{word:"board",type:"İsim/Fiil",meaning:"1. Tahta, pano (isim). 2. (Uçak/gemi) binmek (fiil). 3. Kurul, yönetim kurulu (isim).",guide:"Düz, sert yüzey. Toplu taşıma aracına binmek anlamında fiil olarak kullanılır.",examples:"1. Write your name on the board. (Adınızı tahtaya yazın.) 2. We boarded the plane at 10 AM. (Uçağa saat 10'da bindik.) 3. the board of directors (yönetim kurulu)"},{word:"boat",type:"İsim",meaning:"1. Tekne, sandal, kayık. 2. (in the same boat) aynı durumda olmak.",guide:"Su üzerinde hareket eden, genellikle küçük taşıt.",examples:"1. We went fishing in a small boat. (Küçük bir tekneyle balığa gittik.) 2. They crossed the river by boat. (Nehri tekneyle geçtiler.)"},{word:"body",type:"İsim",meaning:"1. Vücut, beden. 2. Ceset, naaş. 3. Grup, kuruluş.",guide:"Bir insanın veya hayvanın fiziksel yapısı. Mecazi olarak bir grup veya ana kısım.",examples:"1. Regular exercise is good for your body. (Düzenli egzersiz vücudunuz için iyidir.) 2. They found a body in the river. (Nehirde bir ceset buldular.) 3. a governing body (bir yönetim organı)"},{word:"boil",type:"Fiil",meaning:"1. Kaynatmak, kaynamak. 2. (Öfkeden) köpürmek. 3. Çıban, sivilce (isim).",guide:"Suyun 100°C'de buhar çıkarması veya bir sıvıyı bu sıcaklığa getirmek.",examples:"1. Boil the water before drinking it. (İçmeden önce suyu kaynatın.) 2. I'm boiling with anger! (Öfkeden köpürüyorum!) 3. The water is boiling. (Su kaynıyor.)"},{word:"bomb",type:"İsim/Fiil",meaning:"1. Bomba (isim). 2. Bombalamak (fiil). 3. (go like a bomb) çok iyi gitmek/satılmak.",guide:"Patlayıcı cihaz. Argo olarak büyük başarı anlamına gelir.",examples:"1. The bomb exploded. (Bomba patladı.) 2. The planes bombed the city. (Uçaklar şehri bombaladı.) 3. The new play is a bomb. (Yeni oyun büyük bir başarı.)"},{word:"bond",type:"İsim/Fiil",meaning:"1. Bağ, bağlantı (isim). 2. Tahvil, bono (isim). 3. Bağ kurmak (fiil).",guide:"İki kişi/şey arasındaki güçlü bağ veya finansal bir yatırım aracı.",examples:"1. There is a strong bond between mother and child. (Anne ve çocuk arasında güçlü bir bağ vardır.) 2. government bonds (devlet tahvilleri) 3. The team bonded during the training camp. (Takım kamp sırasında kaynaştı.)"},{word:"bone",type:"İsim",meaning:"1. Kemik. 2. (have a bone to pick) hesap sormak istemek. 3. (make no bones about) çekinmeden söylemek.",guide:"İskeleti oluşturan sert doku. Deyimlerde kullanılır.",examples:"1. He broke a bone in his arm. (Kolunda bir kemik kırdı.) 2. a fish bone (bir balık kılçığı)"},{word:"book",type:"İsim/Fiil",meaning:"1. Kitap (isim). 2. Rezervasyon yapmak, ayırtmak (fiil). 3. (defter) kaydetmek.",guide:"Basılı veya dijital okuma materyali. Fiil olarak bir şey için yer ayırtmak.",examples:"1. I'm reading a good book. (İyi bir kitap okuyorum.) 2. I need to book a table for two. (İki kişilik bir masa ayırtmam gerekiyor.) 3. an address book (bir adres defteri)"},{word:"boot",type:"İsim (UK)",meaning:"1. Bot, çizme. 2. (Araba) bagaj (UK). 3. (Bilgisayar) açmak, yüklemek.",guide:`Ayakkabının yüksek bilekli türü. Britanya'da araba bagajına "boot" denir.`,examples:"1. She wore leather boots. (Deri botlar giydi.) 2. Put the luggage in the boot. (Bagajı bagaja koy.) 3. to boot up a computer (bir bilgisayarı açmak)"},{word:"border",type:"İsim/Fiil",meaning:"1. Sınır, hudut (isim). 2. Kenar, süs (isim). 3. Sınırı olmak, komşu olmak (fiil).",guide:"İki ülke veya bölgeyi ayıran hat veya bir şeyin kenar kısmı.",examples:"1. They crossed the border into Canada. (Kanada sınırını geçtiler.) 2. a handkerchief with a lace border (dantel kenarlı bir mendil) 3. The garden borders on the forest. (Bahçe ormana komşudur.)"},{word:"bored",type:"Sıfat",meaning:"1. Sıkılmış, canı sıkılmış. 2. Usanmış.",guide:"İlgi veya eğlence eksikliğinden dolayı hoşnutsuz hissetme durumu.",examples:"1. The children are getting bored. (Çocuklar sıkılmaya başlıyor.) 2. I'm bored with this movie. (Bu filmden sıkıldım.)"},{word:"boring",type:"Sıfat",meaning:"1. Sıkıcı, bayıcı. 2. Can sıkıcı.",guide:"İlgi veya heyecan uyandırmayan, monoton.",examples:"1. The lecture was very boring. (Ders çok sıkıcıydı.) 2. a boring job (sıkıcı bir iş)"},{word:"born",type:"Sıfat/Fiil (past participle)",meaning:"1. Doğmuş (sıfat). 2. Doğuştan, yaratılıştan. 3. (be born) doğmak.",guide:"Doğum eyleminin sonucu. Doğuştan gelen yetenekler için kullanılır.",examples:"1. I was born in London. (Londra'da doğdum.) 2. She is a born leader. (O doğuştan bir lider.) 3. a newly born baby (yeni doğmuş bir bebek)"},{word:"borrow",type:"Fiil",meaning:"1. Ödünç almak. 2. (Fikir/dil) almak, benimsemek.",guide:'Geçici olarak kullanmak veya harcamak üzere bir şeyi birinden almak (geri verme niyetiyle). "Lend" (ödünç vermek) ile karıştırılmamalıdır.',examples:"1. Can I borrow your pen? (Kalemini ödünç alabilir miyim?) 2. He borrowed money from the bank. (Bankadan para ödünç aldı.) 3. English has borrowed many words from French. (İngilizce, Fransızcadan birçok kelime almıştır.)"},{word:"boss",type:"İsim/Fiil",meaning:"1. Patron, amir, şef (isim). 2. Emretmek, yönetmek (fiil). 3. (around) buyruk yağdırmak.",guide:"Birini yöneten veya işveren olan kişi. Olumsuz anlamda emir vermek için fiil olarak kullanılır.",examples:"1. I need to speak to my boss. (Patronumla konuşmam gerekiyor.) 2. Stop bossing me around! (Bana emir vermeyi bırak!)"},{word:"both",type:"Belirteç/Zamir",meaning:"1. Her ikisi de, ikisi birden. 2. Hem ... hem (de).",guide:"İki şeyin, kişinin tamamını ifade eder.",examples:"1. Both children are at school. (Her iki çocuk da okulda.) 2. She is both intelligent and kind. (O hem zeki hem de kibar.) 3. I like them both. (Her ikisini de seviyorum.)"},{word:"bother",type:"Fiil/İsim",meaning:"1. Rahatsız etmek, canını sıkmak (fiil). 2. Zahmet etmek, uğraşmak (fiil). 3. Zahmet, sıkıntı (isim).",guide:"Birini rahatsız etmek veya bir şeyle uğraşmak için çaba göstermek.",examples:"1. Sorry to bother you, but can I ask a question? (Rahatsız ettiğim için özür dilerim, ama bir soru sorabilir miyim?) 2. Don't bother making tea for me. (Benim için çay yapma zahmetine girme.) 3. It's too much bother. (Bu çok fazla zahmet.)"},{word:"bottle",type:"İsim/Fiil",meaning:"1. Şişe (isim). 2. Şişelemek (fiil). 3. (bottle up) içine atmak, bastırmak (duygu).",guide:"Genellikle cam veya plastikten yapılmış, sıvı saklama kabı.",examples:"1. a bottle of water (bir şişe su) 2. The wine is bottled here. (Şarap burada şişelenir.) 3. Don't bottle up your feelings. (Duygularını içine atma.)"},{word:"bottom",type:"İsim/Sıfat",meaning:"1. Alt, dip (isim). 2. Popo, kıç (isim). 3. En alt, en aşağıdaki (sıfat).",guide:"Bir şeyin en alt kısmı veya vücudun oturulan kısmı.",examples:"1. The coin sank to the bottom of the pool. (Madeni para havuzun dibine battı.) 2. He sat on the bottom step. (En alt basamağa oturdu.) 3. the bottom of the page (sayfanın alt kısmı)"},{word:"bowl",type:"İsim",meaning:"1. Kase, çanak. 2. Kase dolusu. 3. (Amerikan futbolu) özel maç.",guide:"Genellikle yemek yemek için kullanılan, yuvarlak, derin kap.",examples:"1. a bowl of soup (bir kase çorba) 2. a fruit bowl (bir meyve kasesi)"},{word:"box",type:"İsim/Fiil",meaning:"1. Kutu (isim). 2. Boks yapmak (fiil). 3. (TV) televizyon.",guide:"Genellikle dikdörtgen şeklinde, saklama kabı. Spor olarak yumruk dövüşü.",examples:"1. a cardboard box (bir karton kutu) 2. He boxes as a hobby. (Hobi olarak boks yapar.) 3. What's on the box tonight? (Bu gece televizyonda ne var?)"},{word:"boy",type:"İsim",meaning:"1. Oğlan, erkek çocuk. 2. Delikanlı, genç adam. 3. (Ünlem) Vay canına!",guide:"Genç erkek. Şaşkınlık ifadesi olarak da kullanılır.",examples:"1. They have two boys and a girl. (İki oğulları ve bir kızları var.) 2. He's a local boy. (O buradan bir çocuk.) 3. Oh boy, that's amazing! (Vay canına, bu harika!)"},{word:"boyfriend",type:"İsim",meaning:"1. Erkek arkadaş, sevgili (erkek).",guide:"Bir kadının romantik veya cinsel partneri olan erkek.",examples:"1. She's going to the cinema with her boyfriend. (Erkek arkadaşıyla sinemaya gidiyor.) 2. my ex-boyfriend (eski erkek arkadaşım)"},{word:"brain",type:"İsim",meaning:"1. Beyin. 2. Zekâ, akıl. 3. (the brains) beyin takımı, planlayıcı.",guide:"Kafatasındaki sinir merkezi veya zihinsel kapasite.",examples:"1. The brain controls the body. (Beyin vücudu kontrol eder.) 2. Use your brain! (Aklını kullan!) 3. She's the brains behind the operation. (Operasyonun arkasındaki beyin o.)"},{word:"branch",type:"İsim/Fiil",meaning:"1. Dal (ağaç) (isim). 2. Şube (isim). 3. Dallanmak, ayrılmak (fiil).",guide:"Ağacın gövdeden ayrılan kısmı veya bir kuruluşun alt birimi.",examples:"1. The bird sat on a branch. (Kuş bir dala kondu.) 2. The bank has a new branch in town. (Bankanın şehirde yeni bir şubesi var.) 3. The road branches here. (Yol burada ikiye ayrılır.)"},{word:"brand",type:"İsim/Fiil",meaning:"1. Marka (isim). 2. Damga vurmak, yakmak (fiil). 3. Tür, çeşit.",guide:"Belirli bir üreticiye ait ticari isim veya bir hayvana işaret koymak.",examples:"1. What brand of coffee do you buy? (Hangi marka kahve alıyorsun?) 2. The experience branded him for life. (Bu deneyim onu ömür boyu etkiledi.) 3. a new brand of politics (yeni bir siyaset anlayışı)"},{word:"brave",type:"Sıfat/Fiil",meaning:"1. Cesur, yürekli (sıfat). 2. Göğüs germek, cesaretle karşılamak (fiil).",guide:"Korku veya tehlike karşısında korkusuz olan.",examples:"1. The firefighter made a brave rescue. (İtfaiyeci cesur bir kurtarma yaptı.) 2. She braved the storm to get help. (Yardım almak için fırtınaya göğüs gerdi.)"},{word:"bread",type:"İsim",meaning:"1. Ekmek. 2. (Argo) para, mangır. 3. Geçim kaynağı.",guide:"Un, su ve mayadan yapılan temel gıda. Argo olarak para anlamına gelir.",examples:"1. a loaf of bread (bir somun ekmek) 2. He earns his bread as a mechanic. (Geçimini tamirci olarak kazanıyor.)"},{word:"break",type:"Fiil/İsim",meaning:"1. Kırmak, bozmak (fiil). 2. Mola, ara (isim). 3. (Kuralları) çiğnemek.",guide:"Bir şeyi parçalara ayırmak veya bir sürekliliği kesmek.",examples:"1. Be careful not to break the glass. (Camı kırmamaya dikkat et.) 2. Let's take a break. (Bir mola verelim.) 3. He broke the world record. (Dünya rekorunu kırdı.)"},{word:"breakfast",type:"İsim",meaning:"1. Kahvaltı.",guide:"Günün ilk öğünü.",examples:"1. What do you usually have for breakfast? (Genellikle kahvaltıda ne yersin?) 2. Breakfast is served from 7 to 10. (Kahvaltı 7'den 10'a kadar servis edilir.)"},{word:"breast",type:"İsim",meaning:"1. Göğüs, meme. 2. (Kuş) göğüs eti. 3. Kalp, yürek (mecazi).",guide:"İnsan vücudunun ön üst kısmı veya bir kuşun göğüs bölgesi.",examples:"1. breast cancer (meme kanseri) 2. chicken breast (tavuk göğsü)"},{word:"breath",type:"İsim",meaning:"1. Nefes, soluk. 2. Hafif rüzgar, esinti. 3. (take one's breath away) nefesini kesmek.",guide:"Solunumla ciğerlere alınıp verilen hava.",examples:"1. Take a deep breath. (Derin bir nefes al.) 2. I'm out of breath. (Nefes nefese kaldım.) 3. The view took my breath away. (Manzara nefesimi kesti.)"},{word:"breathe",type:"Fiil",meaning:"1. Nefes almak, solumak. 2. (Hayat) vermek, esinlemek. 3. Fısıldamak.",guide:"Hava ciğerlere çekmek ve vermek.",examples:"1. Breathe in slowly. (Yavaşça nefes al.) 2. The poem breathes sadness. (Şiir hüzün soluyor.) 3. Don't breathe a word of this to anyone. (Bundan kimseye bir kelime bile bahsetme.)"},{word:"breathing",type:"İsim/Sıfat",meaning:"1. Nefes alma, solunum (isim). 2. Nefes alan (sıfat). 3. (breathing space) nefes alacak zaman/alan.",guide:"Nefes alma eylemi veya süreci.",examples:"1. Her breathing became steady. (Nefes alışı düzene girdi.) 2. a breathing difficulty (bir nefes alma güçlüğü)"},{word:"bride",type:"İsim",meaning:"1. Gelin.",guide:"Yeni evlenecek veya evlenmek üzere olan kadın.",examples:"1. The bride looked beautiful. (Gelin çok güzel görünüyordu.) 2. bride and groom (gelin ve damat)"},{word:"bridge",type:"İsim/Fiil",meaning:"1. Köprü (isim). 2. Köprü kurmak (fiil). 3. (Diş) köprüsü.",guide:"Bir engelin üzerinden geçiş sağlayan yapı veya iki şey arasında bağlantı kurma eylemi.",examples:"1. They built a bridge over the river. (Nehrin üzerine bir köprü inşa ettiler.) 2. Music can bridge cultural gaps. (Müzik kültürel uçurumları kapatabilir.) 3. a dental bridge (bir diş köprüsü)"},{word:"brief",type:"Sıfat/İsim/Fiil",meaning:"1. Kısa, öz (sıfat). 2. Talimat, brifing (isim). 3. Bilgilendirmek (fiil).",guide:"Uzun sürmeyen veya çok detaylı olmayan. İsim olarak yönergeler toplamı.",examples:"1. a brief meeting (kısa bir toplantı) 2. The lawyer received a brief on the case. (Avukat davayla ilgili bir brifing aldı.) 3. The manager briefed the team. (Müdür ekibi bilgilendirdi.)"},{word:"bright",type:"Sıfat",meaning:"1. Parlak, ışıltılı. 2. Zeki, parlak (zeka). 3. Canlı, neşeli (renk).",guide:"Çok fazla ışık yayan veya yansıtan; akıllı ve yetenekli.",examples:"1. The sun is very bright today. (Güneş bugün çok parlak.) 2. She's a very bright student. (Çok zeki bir öğrenci.) 3. bright red (canlı kırmızı)"},{word:"brilliant",type:"Sıfat",meaning:"1. Çok parlak, ışıldayan. 2. Çok zeki, dâhice. 3. Harika, müthiş.",guide:`Olağanüstü parlak veya olağanüstü zeki/başarılı. Britanya'da "harika" anlamında sıkça kullanılır.`,examples:"1. a brilliant diamond (parlak bir elmas) 2. He came up with a brilliant idea. (Dahice bir fikir buldu.) 3. That's brilliant! (Bu harika!)"},{word:"bring",type:"Fiil",meaning:"1. Getirmek. 2. Neden olmak, yol açmak. 3. (bring up) yetiştirmek, gündeme getirmek.",guide:'Bir şeyi veya birini bulunduğun yere taşımak. "Take" (götürmek) ile karıştırılmamalıdır.',examples:"1. Can you bring me a glass of water? (Bana bir bardak su getirir misin?) 2. The news brought joy to everyone. (Haber herkese neşe getirdi.) 3. She brought up three children on her own. (Üç çocuğu tek başına büyüttü.)"},{word:"broad",type:"Sıfat",meaning:"1. Geniş, enli. 2. Kapsamlı, genel. 3. Belirgin, bariz (aksan).",guide:"Dar olmayan, yaygın veya detaydan çok genel hatları olan.",examples:"1. a broad river (geniş bir nehir) 2. in broad daylight (güpegündüz) 3. a broad agreement (genel bir anlaşma)"},{word:"broadcast",type:"İsim/Fiil",meaning:"1. Yayın (isim). 2. Yayınlamak (fiil). 3. (Tohum) serpmek.",guide:"Radyo veya televizyon programı yayını veya yayınlama eylemi.",examples:"1. a live broadcast (canlı yayın) 2. The game will be broadcast nationwide. (Maç ülke çapında yayınlanacak.)"},{word:"broken",type:"Sıfat (past participle)",meaning:"1. Kırık, bozuk. 2. (Kalp) kırık. 3. Bozuk, düzgün olmayan (İngilizce).",guide:"Çalışmayan, parçalanmış veya düzensiz.",examples:"1. a broken window (kırık bir pencere) 2. broken English (bozuk İngilizce) 3. a broken promise (yerine getirilmemiş bir söz)"},{word:"brother",type:"İsim",meaning:"1. Erkek kardeş. 2. Yoldaş, dost (din/kardeşlik). 3. Rahip (bazı tarikatlarda).",guide:"Aynı ebeveynleri paylaşan erkek çocuk. Mecazi anlamda yakın dost.",examples:"1. My brother is older than me. (Erkek kardeşim benden büyük.) 2. Brother John is a monk. (Kardeş John bir keşiştir.)"},{word:"brown",type:"Sıfat/İsim",meaning:"1. Kahverengi (sıfat/isim). 2. Esmer (ten). 3. Kararmak, kızarmak (fiil).",guide:"Toprak, odun veya çikolata rengi.",examples:"1. She has brown eyes. (Kahverengi gözleri var.) 2. brown bread (kepekli/çavdar ekmeği) 3. Fry until brown. (Kızarana kadar kızartın.)"},{word:"brush",type:"İsim/Fiil",meaning:"1. Fırça (isim). 2. Fırçalamak (fiil). 3. Hafifçe dokunmak, sıyırmak.",guide:"Kıllardan yapılmış temizleme veya boyama aleti. Fiil olarak fırçalamak veya hafifçe değmek.",examples:"1. a toothbrush (diş fırçası) 2. Brush your teeth twice a day. (Günde iki kez dişlerini fırçala.) 3. The car brushed against the wall. (Araba duvara sıyırdı.)"},{word:"bubble",type:"İsim/Fiil",meaning:"1. Kabarcık, baloncuk (isim). 2. Fokurdama sesi (isim). 3. Köpürmek, fokurdamak (fiil).",guide:"İçi hava veya gaz dolu küçük, yuvarlak sıvı topu. Ekonomide spekülatif balon anlamı da vardır.",examples:"1. soap bubbles (sabun köpükleri) 2. The water began to bubble. (Su fokurdamağa başladı.) 3. the dot-com bubble (dot-com balonu)"},{word:"budget",type:"İsim/Sıfat/Fiil",meaning:"1. Bütçe (isim). 2. Ekonomik, uygun fiyatlı (sıfat). 3. Bütçe ayırmak, planlamak (fiil).",guide:"Belirli bir dönem için gelir ve gider planı. Sıfat olarak ucuz anlamına gelir.",examples:"1. We need to stick to our budget. (Bütçemize bağlı kalmamız gerekiyor.) 2. a budget airline (bir ucuz havayolu) 3. How much have you budgeted for food? (Yemek için ne kadar bütçe ayırdınız?)"},{word:"build",type:"Fiil/İsim",meaning:"1. İnşa etmek, yapmak (fiil). 2. Vücut yapısı, bünye (isim). 3. (up) artırmak, güçlendirmek.",guide:"Bir şeyi parçaları bir araya getirerek oluşturmak.",examples:"1. They plan to build a new school. (Yeni bir okul inşa etmeyi planlıyorlar.) 2. He has a strong build. (Güçlü bir vücut yapısı var.) 3. Tension is building. (Gerginlik artıyor.)"},{word:"building",type:"İsim",meaning:"1. Bina, yapı. 2. İnşa etme, yapım.",guide:"İçinde insanların yaşadığı veya çalıştığı kapalı yapı.",examples:"1. That building is over 100 years old. (O bina 100 yıldan eski.) 2. the building industry (inşaat sektörü)"},{word:"bullet",type:"İsim",meaning:"1. Mermi, kurşun. 2. Madde işareti (•). 3. (bite the bullet) dişini sıkmak, katlanmak.",guide:"Tabancadan ateşlenen metal parçası. Deyimde zor bir şeye katlanmak anlamı vardır.",examples:"1. He was hit by a bullet. (Bir kurşun ona isabet etti.) 2. a bullet point list (madde işaretli bir liste)"},{word:"bunch",type:"İsim/Fiil",meaning:"1. Demet, salkım (üzüm) (isim). 2. Grup, takım (isim). 3. Toplamak, demet yapmak (fiil).",guide:"Bir arada bağlanmış veya gruplanmış şeyler. İnsanlar için de kullanılır.",examples:"1. a bunch of grapes (bir salkım üzüm) 2. They're a great bunch of people. (Onlar harika bir insan grubu.) 3. a bunch of keys (bir demet anahtar)"},{word:"burn",type:"Fiil/İsim",meaning:"1. Yakmak, yanmak (fiil). 2. Yanık (isim). 3. (CD) yazmak.",guide:"Ateş veya ısı nedeniyle hasar görmek veya zarar vermek.",examples:"1. The house burned down. (Ev yanıp kül oldu.) 2. I have a burn on my finger. (Parmağımda bir yanık var.) 3. burn calories (kalori yakmak)"},{word:"bury",type:"Fiil",meaning:"1. Gömmek (ölü). 2. Saklamak, örtmek. 3. (Kendini) işe vermek.",guide:"Toprağın altına koymak veya bir şeyin içine gizlemek.",examples:"1. They will bury him tomorrow. (Onu yarın gömecekler.) 2. She buried her face in her hands. (Yüzünü ellerine gömdü.) 3. He buried himself in his work. (Kendini işine verdi.)"},{word:"bus",type:"İsim",meaning:"1. Otobüs.",guide:"Çok sayıda yolcu taşıyan büyük karayolu taşıtı.",examples:"1. I go to work by bus. (İşe otobüsle gidiyorum.) 2. Catch the number 10 bus. (10 numaralı otobüse bin.)"},{word:"bush",type:"İsim",meaning:"1. Çalı, funda. 2. (the bush) Afrika/Avustralya kırsalı. 3. (beat around the bush) lafı dolandırmak.",guide:"Ağaçtan küçük, dallı bitki.",examples:"1. a rose bush (bir gül fidanı) 2. They went hiking in the bush. (Kırsalda yürüyüşe gittiler.)"},{word:"business",type:"İsim",meaning:"1. İş, ticaret. 2. İşletme, firma. 3. Mesele, konu.",guide:"Ticari faaliyet veya bir ticari kuruluş. Ayrıca kişisel bir mesele.",examples:"1. He's in the hotel business. (Otel işiyle uğraşıyor.) 2. She runs her own business. (Kendi işletmesini yönetiyor.) 3. Mind your own business! (Kendi işine bak!)"},{word:"businessman / businesswoman",type:"İsim",meaning:"1. İş adamı / iş kadını.",guide:"Ticaret veya iş dünyasında çalışan kişi.",examples:"1. A successful businessman gave a talk at the school. (Başarılı bir iş adamı okulda bir konuşma yaptı.) 2. She is a shrewd businesswoman. (O, zeki bir iş kadınıdır.)"},{word:"busy",type:"Sıfat/Fiil",meaning:"1. Meşgul (sıfat). 2. Kalabalık, hareketli (yer) (sıfat). 3. (Kendini) meşgul etmek (fiil).",guide:"Bir işle uğraşan veya çok fazla aktivitenin olduğu yer.",examples:"1. I'm too busy to talk right now. (Şu anda konuşamayacak kadar meşgulüm.) 2. a busy street (kalabalık bir sokak) 3. She busied herself with preparations. (Kendini hazırlıklarla meşgul etti.)"},{word:"but",type:"Bağlaç/Edat/Zarf",meaning:"1. Ama, fakat, ancak (bağlaç). 2. Hariç, dışında (edat). 3. Sadece, yalnızca (zarf).",guide:'Zıtlık veya istisna bildirir. "Except" ile benzer şekilde kullanılabilir.',examples:"1. I wanted to go, but I was tired. (Gitmek istedim, ama yorgundum.) 2. Everyone but John was there. (John hariç herkes oradaydı.) 3. He is but a child. (O sadece bir çocuk.)"},{word:"butter",type:"İsim/Fiil",meaning:"1. Tereyağı (isim). 2. Tereyağı sürmek (fiil). 3. (butter up) yağ çekmek, pohpohlamak.",guide:"Sütten yapılan, yayılabilir yağ. Argo deyimde dalkavukluk anlamı vardır.",examples:"1. bread and butter (ekmek ve tereyağı) 2. Butter the toast while it's hot. (Tost sıcakken üzerine tereyağı sür.)"},{word:"button",type:"İsim/Fiil",meaning:"1. Düğme (isim). 2. Buton, tuş (isim). 3. İliklemek, düğmelemek (fiil).",guide:"Giysileri tutturmak için veya makinede basılan küçük nesne.",examples:"1. Sew a button on your shirt. (Gömleğine bir düğme dik.) 2. Press the start button. (Başlat düğmesine bas.) 3. Button up your coat; it's cold. (Montunu düğmele; hava soğuk.)"},{word:"buy",type:"Fiil/İsim",meaning:"1. Satın almak (fiil). 2. (buy into) inanmak, kanmak. 3. İyi alışveriş, kelepir (isim).",guide:"Para karşılığında bir şey elde etmek. Mecazi olarak bir fikri kabul etmek.",examples:"1. I need to buy some milk. (Biraz süt almam gerekiyor.) 2. He didn't buy my excuse. (Mazeretime inanmadı.) 3. That car was a great buy. (O araba harika bir alışverişti.)"},{word:"by",type:"Edat/Zarf",meaning:"1. Tarafından, - ile (edat). 2. Yanında, yakınında (edat). 3. Kadar, yoluyla (edat).",guide:"Faili, konumu, zamanı, yöntemi veya miktarı belirtir.",examples:"1. a painting by Van Gogh (Van Gogh tarafından yapılmış bir resim) 2. Sit by me. (Yanıma otur.) 3. I go to work by train. (İşe trenle gidiyorum.)"},{word:"bye",type:"Ünlem",meaning:"1. Hoşça kal, güle güle.",guide:'Vedalaşırken kullanılan kısa ve gayriresmi ifade. "Goodbye"ın kısaltmasıdır.',examples:"1. Bye! See you tomorrow. (Hoşça kal! Yarın görüşürüz.) 2. Bye for now! (Şimdilik hoşça kal!)"},{word:"cable",type:"İsim",meaning:"1. Kablo. 2. Telgraf. 3. Kablolu TV.",guide:"Elektrik iletimi veya sinyal taşıma için kullanılan kalın, güçlü tel.",examples:"1. The cable for the TV is damaged. (TV'nin kablosu hasarlı.) 2. We get our internet via cable. (İnternetimizi kabloyla alıyoruz.) 3. He sent a cable from abroad. (Yurtdışından bir telgraf gönderdi.)"},{word:"cafe",type:"İsim",meaning:"1. Kafe, çay bahçesi. 2. Kahvehane.",guide:"Genellikle hafif yemekler, içecekler servis edilen küçük restoran.",examples:"1. Let's meet at the cafe on the corner. (Köşedeki kafede buluşalım.) 2. an internet cafe (bir internet kafe)"},{word:"cake",type:"İsim",meaning:"1. Kek, pasta. 2. Kalıp, parça (sabun/çamur). 3. (a piece of cake) çok kolay iş.",guide:"Un, yumurta, şeker ve yağdan yapılan tatlı. Argo olarak çok kolay anlamına gelir.",examples:"1. She baked a chocolate cake for my birthday. (Doğum günüm için bir çikolatalı kek pişirdi.) 2. a cake of soap (bir kalıp sabun) 3. The exam was a piece of cake. (Sınav çok kolaydı.)"},{word:"calculate",type:"Fiil",meaning:"1. Hesaplamak. 2. Planlamak, tasarlamak. 3. (calculated risk) hesaplanmış risk.",guide:"Matematiksel işlemlerle sayısal bir sonuç bulmak veya dikkatlice plan yapmak.",examples:"1. Calculate the total cost, please. (Toplam maliyeti hesaplayın lütfen.) 2. The move was calculated to win votes. (Bu hamle oyları kazanmak için tasarlanmıştı.)"},{word:"call",type:"Fiil/İsim",meaning:"1. Aramak (telefon) (fiil). 2. Çağırmak, seslenmek (fiil). 3. Çağrı, arama (isim).",guide:"Birine telefon etmek veya seslenmek. İsim olarak telefon konuşması veya ziyaret.",examples:"1. I'll call you later. (Seni sonra ararım.) 2. What do you call this in English? (Buna İngilizcede ne denir?) 3. I got a call from the school. (Okuldan bir arama aldım.)"},{word:"calm",type:"Sıfat/Fiil",meaning:"1. Sakin (sıfat). 2. Durgun (deniz) (sıfat). 3. Sakinleştirmek (fiil).",guide:"Huzurlu, telaşsız veya hareket etmeyen.",examples:"1. Stay calm and tell me what happened. (Sakin ol ve bana ne olduğunu söyle.) 2. The sea is very calm today. (Deniz bugün çok durgun.) 3. She tried to calm the crying baby. (Ağlayan bebeği sakinleştirmeye çalıştı.)"},{word:"camera",type:"İsim",meaning:"1. Fotoğraf makinesi, kamera. 2. (on camera) kamera karşısında.",guide:"Fotoğraf veya video çeken cihaz.",examples:"1. Don't forget to bring your camera. (Kameranı getirmeyi unutma.) 2. security cameras (güvenlik kameraları)"},{word:"camp",type:"İsim/Fiil",meaning:"1. Kamp (isim). 2. Kamp yapmak, çadır kurmak (fiil). 3. (Siyasi) kamp, taraf.",guide:"Doğada geçici konaklama yeri veya burada kalma eylemi.",examples:"1. We set up camp by the river. (Nehrin kenarına kamp kurduk.) 2. The children are camping in the garden tonight. (Çocuklar bu gece bahçede kamp yapıyorlar.)"},{word:"campaign",type:"İsim/Fiil",meaning:"1. Seçim kampanyası (isim). 2. Askeri harekât (isim). 3. Kampanya yürütmek (fiil).",guide:"Belirli bir amaca yönelik planlı faaliyetler dizisi (siyasi, askeri, reklam).",examples:"1. He is running an election campaign. (Bir seçim kampanyası yürütüyor.) 2. an advertising campaign (bir reklam kampanyası) 3. They are campaigning for cleaner streets. (Daha temiz sokaklar için kampanya yürütüyorlar.)"},{word:"camping",type:"İsim",meaning:"1. Kamp yapma, kampçılık.",guide:"Çadırda veya açık havada geçici olarak yaşama aktivitesi.",examples:"1. Do you enjoy camping? (Kamp yapmaktan hoşlanır mısın?) 2. We went camping in the mountains. (Dağlarda kamp yapmaya gittik.)"},{word:"campus",type:"İsim",meaning:"1. Kampüs, üniversite arazisi.",guide:"Bir üniversite veya kolej binalarının ve arazisinin bulunduğu alan.",examples:"1. She lives on campus. (Kampüste yaşıyor.) 2. The new library is on the main campus. (Yeni kütüphane ana kampüste.)"},{word:"can 1",type:"Yardımcı Fiil",meaning:"1. -ebilmek (yetenek). 2. -ebilmek (izin). 3. (Olumsuz) -ememek.",guide:"Fiziksel/zeka yeteneği veya izin verme/vermeme ifade eder.",examples:"1. She can speak three languages. (O üç dil konuşabilir.) 2. Can I use your phone? (Telefonunu kullanabilir miyim?) 3. You can't smoke here. (Burada sigara içemezsin.)"},{word:"can 2",type:"İsim/Fiil",meaning:"1. Kutu, konserve kutusu (isim). 2. Teneke kutuya koymak (fiil). 3. (Argo US) tuvalet.",guide:"Metal saklama kabı, özellikle içecek veya yiyecek için.",examples:"1. a can of coke (bir kutu kola) 2. They can fruit to preserve it. (Meyveyi korumak için konserve yaparlar.)"},{word:"cancel",type:"Fiil",meaning:"1. İptal etmek. 2. (Bir şeyi) geçersiz kılmak. 3. (cancel out) birbirini götürmek, etkisiz kılmak.",guide:"Planlanmış bir şeyi yapmaktan vazgeçmek veya bir şeyi geçersiz saymak.",examples:"1. The flight was cancelled due to bad weather. (Uçuş kötü hava nedeniyle iptal edildi.) 2. Cancel my subscription, please. (Aboneliğimi iptal edin lütfen.) 3. The two effects cancel each other out. (İki etki birbirini götürür.)"},{word:"cancer",type:"İsim",meaning:"1. Kanser (hastalık). 2. (Zodyak) Yengeç burcu. 3. (Toplum için) yayılan kötülük.",guide:"Kontrolsüz hücre bölünmesi ile karakterize hastalık grubu.",examples:"1. He is being treated for lung cancer. (Akciğer kanseri tedavisi görüyor.) 2. She is a Cancer. (O bir Yengeç burcu.)"},{word:"candidate",type:"İsim",meaning:"1. Aday. 2. Sınava giren kişi. 3. Uygun kişi.",guide:"Bir pozisyon veya ödül için başvuran kişi.",examples:"1. There are three candidates for the job. (İş için üç aday var.) 2. examination candidates (sınav adayları)"},{word:"cannot",type:"Yardımcı Fiil",meaning:"1. -ememek, -amamak.",guide:'"Can"in olumsuz şekli. Yazı dilinde "can not" şeklinde de yazılabilir, ancak "cannot" daha yaygındır.',examples:"1. I cannot understand this. (Bunu anlayamıyorum.) 2. You cannot enter without a ticket. (Biletiniz olmadan giremezsiniz.)"},{word:"cap",type:"İsim/Fiil",meaning:"1. Şapka, kep (isim). 2. Kapak, tıpa (isim). 3. Sınırlamak, üst sınır koymak (fiil).",guide:"Başa giyilen giysi veya bir şişenin üst kısmı. Fiil olarak sınırlandırmak.",examples:"1. He was wearing a baseball cap. (Bir beyzbol şapkası takıyordu.) 2. Put the cap back on the bottle. (Şişenin kapağını geri tak.) 3. The government capped fuel prices. (Hükümet yakıt fiyatlarına üst sınır koydu.)"},{word:"capable",type:"Sıfat",meaning:"1. Yetenekli, muktedir. 2. (capable of) -ebilecek kapasitede. 3. Yeterli, elverişli.",guide:"Bir şeyi yapma gücüne, becerisine veya niteliğine sahip olan.",examples:"1. She is a very capable manager. (Çok yetenekli bir yöneticidir.) 2. This car is capable of high speeds. (Bu araba yüksek hızlara çıkabilir.) 3. a capable piece of software (yeterli bir yazılım parçası)"},{word:"capacity",type:"İsim",meaning:"1. Kapasite, hacim. 2. Yetenek, güç. 3. Sıfat, sıfatla (in his capacity as).",guide:"Bir şeyin alabileceği maksimum miktar veya birinin yapabileceği şeyler.",examples:"1. The stadium has a capacity of 50,000. (Stadyumun kapasitesi 50.000'dir.) 2. He has a great capacity for learning. (Onun öğrenme için büyük bir kapasitesi var.) 3. She spoke in her capacity as a doctor. (Bir doktor sıfatıyla konuştu.)"},{word:"capital",type:"İsim/Sıfat",meaning:"1. Başkent (isim). 2. Sermaye, anapara (isim). 3. Büyük harf (isim).",guide:"Bir ülkenin yönetim merkezi veya iş için kullanılan para.",examples:"1. London is the capital of England. (Londra, İngiltere'nin başkentidir.) 2. They need more capital to start the business. (İşe başlamak için daha fazla sermayeye ihtiyaçları var.) 3. Write your name in capitals. (Adınızı büyük harflerle yazın.)"},{word:"captain",type:"İsim/Fiil",meaning:"1. Kaptan (gemi/uçak) (isim). 2. Takım kaptanı (isim). 3. Kaptanlık etmek (fiil).",guide:"Bir geminin, uçağın veya spor takımının lideri.",examples:"1. The captain welcomed the passengers aboard. (Kaptan yolcuları gemide karşıladı.) 2. Who is the captain of the team? (Takımın kaptanı kim?) 3. She captained the side to victory. (Takımı zafere kaptanlık etti.)"},{word:"capture",type:"Fiil/İsim",meaning:"1. Yakalamak, ele geçirmek (fiil). 2. (Dikkat) çekmek (fiil). 3. Esir alma (isim).",guide:"Zorla veya zekayla ele geçirmek, kontrol altına almak.",examples:"1. The rebels captured the city. (Asiler şehri ele geçirdi.) 2. The story captured the public's imagination. (Hikaye kamuoyunun hayal gücünü yakaladı.) 3. the capture of enemy soldiers (düşman askerlerinin esir alınması)"},{word:"car",type:"İsim",meaning:"1. Araba, otomobil. 2. Vagon, vagon (tren). 3. Asansör kabini.",guide:"Karayolunda insan taşımak için kullanılan motorlu taşıt.",examples:"1. I go to work by car. (İşe arabayla gidiyorum.) 2. a sleeping car on a train (bir trende yataklı vagon)"},{word:"card",type:"İsim",meaning:"1. Kart (kredi/banka). 2. Tebrik kartı. 3. Oyun kartı.",guide:"İnce, dikdörtgen parça karton veya plastik (banka, kimlik, oyun).",examples:"1. Can I pay by credit card? (Kredi kartıyla ödeyebilir miyim?) 2. I sent her a birthday card. (Ona bir doğum günü kartı gönderdim.) 3. a pack of cards (bir deste iskambil kağıdı)"},{word:"care",type:"İsim/Fiil",meaning:"1. Özen, dikkat (isim). 2. Bakım (isim). 3. Umursamak, aldırmak (fiil).",guide:"Dikkatli ve sorumlu olma hali veya bir şeye önem verme.",examples:"1. Handle with care. (Dikkatle taşıyınız.) 2. She is in need of medical care. (Tıbbi bakıma ihtiyacı var.) 3. I don't care what you think. (Ne düşündüğün umurumda değil.)"},{word:"career",type:"İsim",meaning:"1. Kariyer, meslek hayatı. 2. Hızla ilerlemek (fiil).",guide:"Bir kişinin hayatı boyunca yaptığı iş veya mesleki ilerleme yolu.",examples:"1. He had a long career in teaching. (Öğretmenlikte uzun bir kariyeri oldu.) 2. She careered down the hill on her bike. (Bisikletiyle tepeden aşağı hızla indi.)"},{word:"careful",type:"Sıfat",meaning:"1. Dikkatli, özenli. 2. Titiz, dikkat eden. 3. (be careful) dikkatli ol.",guide:"Potansiyel tehlikeler veya hatalar konusunda tetikte olan.",examples:"1. Be careful crossing the road. (Yolu geçerken dikkatli ol.) 2. a careful driver (dikkatli bir sürücü) 3. careful planning (özenli planlama)"},{word:"carefully",type:"Zarf",meaning:"1. Dikkatlice, özenle. 2. İtina ile.",guide:"Hata veya zarardan kaçınmak için gösterilen özenle.",examples:"1. Listen carefully to the instructions. (Talimatları dikkatlice dinle.) 2. She carefully wrapped the gift. (Hediyeyi özenle paketledi.)"},{word:"careless",type:"Sıfat",meaning:"1. Dikkatsiz, savruk. 2. Kaygısız, tasasız. 3. Özensiz.",guide:"Yeterli dikkat veya düşünce göstermeyen.",examples:"1. A careless mistake cost him the game. (Dikkatsiz bir hata ona oyunu kaybettirdi.) 2. careless talk (düşüncesiz konuşma) 3. a careless attitude (kaygısız bir tavır)"},{word:"carpet",type:"İsim/Fiil",meaning:"1. Halı (isim). 2. Halı ile kaplamak (fiil). 3. (Soruşturma) örtmek.",guide:"Zemine serilen kalın tekstil örtüsü.",examples:"1. The living room has a red carpet. (Oturma odasında kırmızı bir halı var.) 2. The floor was carpeted. (Zemin halıyla kaplanmıştı.)"},{word:"carrot",type:"İsim",meaning:"1. Havuç. 2. (carrot and stick) ödül ve ceza yöntemi.",guide:"Turuncu, koni şeklinde bir kök sebze. Mecazi olarak teşvik anlamında kullanılır.",examples:"1. Carrots are good for your eyes. (Havuç gözleriniz için iyidir.) 2. The government is using a carrot and stick approach. (Hükümet ödül ve ceza yöntemini kullanıyor.)"},{word:"carry",type:"Fiil",meaning:"1. Taşımak, götürmek. 2. (Yürürlükte) olmak, geçerli olmak. 3. (Onay) almak, kabul ettirmek.",guide:"Bir şeyi bir yerden başka bir yere götürmek. Ayrıca bir planı uygulamak veya oylamayı kazanmak.",examples:"1. Can you help me carry these bags? (Bu çantaları taşımama yardım eder misin?) 2. The law carries a heavy penalty. (Yasa ağır bir ceza taşır.) 3. The motion was carried unanimously. (Öneri oybirliğiyle kabul edildi.)"},{word:"cartoon",type:"İsim",meaning:"1. Çizgi film, animasyon. 2. Karikatür. 3. Tasarım, eskiz.",guide:"Çizimlerle yapılan film veya mizahi çizim.",examples:"1. The kids are watching cartoons. (Çocuklar çizgi film izliyor.) 2. a political cartoon in the newspaper (gazetedeki politik bir karikatür)"},{word:"case",type:"İsim",meaning:"1. Durum, hal, vaka. 2. Dava (hukuk). 3. Kutu, kılıf, çanta.",guide:"Belirli bir örnek veya durum; hukuki mesele; saklama kabı.",examples:"1. In that case, we should leave early. (O halde, erken ayrılmalıyız.) 2. a court case (bir mahkeme davası) 3. Put your glasses in the case. (Gözlüklerini kılıfına koy.)"},{word:"cash",type:"İsim/Fiil",meaning:"1. Nakit, para (isim). 2. Nakde çevirmek, bozdurmak (fiil). 3. (cash in on) -den yararlanmak.",guide:"Banknot ve madeni para şeklindeki para.",examples:"1. Do you have any cash on you? (Üzerinde nakit para var mı?) 2. Can I cash a traveler's cheque here? (Burada bir seyahat çeki bozdurabilir miyim?)"},{word:"cast",type:"Fiil/İsim",meaning:"1. (Rol) vermek, oyuncu seçmek (fiil). 2. Atmak, fırlatmak (fiil). 3. Oyuncu kadrosu (isim).",guide:"Bir oyunda rol dağıtmak veya bir şeyi bir yöne doğru atmak.",examples:"1. He was cast as the villain. (Kötü adam rolüne seçildi.) 2. The tree cast a long shadow. (Ağaç uzun bir gölge düşürdü.) 3. The film has a strong cast. (Filmin güçlü bir oyuncu kadrosu var.)"},{word:"castle",type:"İsim",meaning:"1. Kale, şato. 2. (Satranç) kale. 3. (castles in the air) hayal, boş kuruntu.",guide:"Orta Çağ'da savunma amaçlı inşa edilmiş büyük, güçlü bina.",examples:"1. We visited a medieval castle. (Orta Çağ'dan kalma bir kale ziyaret ettik.) 2. He's building castles in the air about becoming famous. (Ünlü olma konusunda hayal kuruyor.)"},{word:"cat",type:"İsim",meaning:"1. Kedi. 2. (let the cat out of the bag) sırrı ağzından kaçırmak. 3. (it's raining cats and dogs) bardaktan boşanırcasına yağmur yağıyor.",guide:"Evcil, tüylü hayvan. Pek çok deyimde kullanılır.",examples:"1. The cat is sleeping on the sofa. (Kedi kanepede uyuyor.) 2. She let the cat out of the bag about the surprise party. (Sürpriz parti sırrını ağzından kaçırdı.)"},{word:"catch",type:"Fiil/İsim",meaning:"1. Yakalamak (fiil). 2. Yetişmek (otobüs/tren) (fiil). 3. Kanca, mandal (isim).",guide:"Hareket halindeki bir şeyi ele geçirmek veya bir araca zamanında binmek.",examples:"1. Try to catch the ball. (Topu yakalamaya çalış.) 2. I have to catch the 8 o'clock train. (Saat 8 trenine yetişmem gerekiyor.) 3. There must be a catch to this offer. (Bu teklifin bir altında yatan bir şey olmalı.)"},{word:"category",type:"İsim",meaning:"1. Kategori, sınıf, bölüm. 2. Tür, çeşit.",guide:"Ortak özellikleri paylaşan şeylerin grubu.",examples:"1. The books are divided into different categories. (Kitaplar farklı kategorilere ayrılmıştır.) 2. She won in the best actress category. (En iyi kadın oyuncu kategorisinde kazandı.)"},{word:"cause",type:"İsim/Fiil",meaning:"1. Neden, sebep (isim). 2. Dava, amaç (isim). 3. Neden olmak, sebebiyet vermek (fiil).",guide:"Bir olayı veya durumu meydana getiren şey veya savunulan amaç.",examples:"1. The cause of the fire is unknown. (Yangının nedeni bilinmiyor.) 2. She fights for a good cause. (İyi bir dava için mücadele ediyor.) 3. Smoking can cause cancer. (Sigara içmek kansere neden olabilir.)"},{word:"CD",type:"İsim",meaning:"1. CD, kompakt disk. 2. CD çalar.",guide:"Dijital veri (müzik, yazılım) saklamak için kullanılan optik disk.",examples:"1. I bought the album on CD. (Albümü CD olarak satın aldım.) 2. Do you have a CD player? (CD çaların var mı?)"},{word:"ceiling",type:"İsim",meaning:"1. Tavan. 2. Azami sınır, tavan (fiyat). 3. (Uçuş) tavanı.",guide:"Bir odanın üst sınırı. Ekonomide maksimum limit.",examples:"1. The light hangs from the ceiling. (Işık tavandan sarkıyor.) 2. The government set a price ceiling on bread. (Hükümet ekmeğe fiyat tavanı belirledi.)"},{word:"celebrate",type:"Fiil",meaning:"1. Kutlamak. 2. (Ayin) yapmak. 3. Övmek, yüceltmek.",guide:"Önemli bir günü veya olayı neşeli bir etkinlikle anmak.",examples:"1. How will you celebrate your birthday? (Doğum gününü nasıl kutlayacaksın?) 2. They celebrated their 25th wedding anniversary. (25. evlilik yıldönümlerini kutladılar.)"},{word:"celebration",type:"İsim",meaning:"1. Kutlama, tören. 2. Şenlik, eğlence.",guide:"Kutlama eylemi veya kutlama partisi.",examples:"1. The celebration went on until midnight. (Kutlama gece yarısına kadar devam etti.) 2. birthday celebrations (doğum günü kutlamaları)"},{word:"celebrity",type:"İsim",meaning:"1. Ünlü, şöhret. 2. Ünlülük, şöhret.",guide:"Kamuoyunda, özellikle eğlence sektöründe tanınan kişi.",examples:"1. The party was full of celebrities. (Parti ünlülerle doluydu.) 2. He achieved instant celebrity. (Anında ünlü oldu.)"},{word:"cell",type:"İsim",meaning:"1. Hücre (biyolojik). 2. Hücre (cezaevi). 3. (Telefon) pil, cep telefonu.",guide:"Canlının temel yapı taşı veya küçük, kapalı oda.",examples:"1. All living things are made of cells. (Tüm canlılar hücrelerden oluşur.) 2. The prisoner was put in a cell. (Mahkum bir hücreye konuldu.) 3. My cell phone is dead. (Cep telefonumun şarjı bitti.)"},{word:"cent",type:"İsim",meaning:"1. Sent (para birimi). 2. Yüzde bir. 3. (not a red cent) beş para, metelik.",guide:"Doların veya avronun yüzde biri. Çok küçük miktarlar için kullanılır.",examples:"1. It costs 99 cents. (99 sente mal oluyor.) 2. I don't have a cent to my name. (Adıma kayıtlı bir meteliğim yok.) 3. per cent (yüzde)"},{word:"central",type:"Sıfat",meaning:"1. Merkezi, orta. 2. Ana, esas, temel. 3. (Isıtma) merkezi.",guide:"Bir şeyin ortasında veya çekirdeğinde bulunan, en önemli olan.",examples:"1. The hotel is in a central location. (Otel merkezi bir konumda.) 2. This is a central issue in the debate. (Bu, tartışmadaki ana konudur.) 3. central heating (merkezi ısıtma)"},{word:"centre (US: center)",type:"İsim/Fiil",meaning:"1. Merkez, orta (isim). 2. (Faaliyet) merkezi (isim). 3. Ortalamak, merkeze almak (fiil).",guide:"Bir şeyin tam orta noktası veya bir faaliyetin odak noktası.",examples:"1. There's a fountain in the centre of the square. (Meydanın ortasında bir çeşme var.) 2. a shopping centre (bir alışveriş merkezi) 3. The discussion centred on climate change. (Tartışma iklim değişikliği üzerine odaklandı.)"},{word:"century",type:"İsim",meaning:"1. Yüzyıl, asır. 2. (Kriket) yüz sayı. 3. Yüzlük.",guide:"100 yıllık zaman dilimi.",examples:"1. We live in the 21st century. (21. yüzyılda yaşıyoruz.) 2. a 19th-century building (19. yüzyıldan kalma bir bina)"},{word:"ceremony",type:"İsim",meaning:"1. Tören, merasim. 2. Resmiyet, protokol. 3. (stand on ceremony) resmi davranmak.",guide:"Genellikle dini veya resmi nitelikte, belirli bir düzene göre yapılan toplantı.",examples:"1. a wedding ceremony (bir düğün töreni) 2. The award ceremony will be held tonight. (Ödül töreni bu gece yapılacak.) 3. Please, don't stand on ceremony. (Lütfen resmiyet yapmayın.)"},{word:"certain",type:"Sıfat/Zamir",meaning:"1. Kesin, emin. 2. Belirli, belli. 3. (a certain) bir, birtakım.",guide:"Kuşku duyulmayan veya belirli, ama tam olarak belirtilmeyen.",examples:"1. I'm certain that I locked the door. (Kapıyı kilitlediğimden eminim.) 2. To a certain extent, I agree. (Belli bir dereceye kadar katılıyorum.) 3. a certain Mr. Smith (Bay Smith adında biri)"},{word:"certainly",type:"Zarf",meaning:"1. Kesinlikle, elbette. 2. Muhakkak, hiç şüphesiz. 3. (Onay) tabii ki, evet.",guide:"Hiç şüphe olmadan veya onay verirken kullanılır.",examples:'1. I will certainly be there. (Kesinlikle orada olacağım.) 2. "Can I borrow your pen?" – "Certainly!" ("Kalemini ödünç alabilir miyim?" – "Tabii ki!")'},{word:"chain",type:"İsim/Fiil",meaning:"1. Zincir (isim). 2. Zincirleme dizi (isim). 3. Zincirlemek, bağlamak (fiil).",guide:"Birbirine bağlı halkalar dizisi veya bir dizi mağaza/olay.",examples:"1. She wore a gold chain around her neck. (Boynuna altın bir zincir takmıştı.) 2. a supermarket chain (bir süpermarket zinciri) 3. The dog was chained to the fence. (Köpek çite zincirlenmişti.)"},{word:"chair",type:"İsim/Fiil",meaning:"1. Sandalye, iskemle (isim). 2. Başkanlık (isim). 3. Başkanlık etmek (fiil).",guide:"Tek kişilik oturma mobilyası. Toplantıyı yönetme görevi veya eylemi.",examples:"1. Please have a chair. (Lütfen bir sandalye alın.) 2. Who is the chair of the meeting? (Toplantının başkanı kim?) 3. She will chair the committee. (Komiteye başkanlık edecek.)"},{word:"chairman / chairwoman / chairperson",type:"İsim",meaning:"1. Başkan.",guide:'Bir toplantının, komitenin veya kurulun yöneticisi. Cinsiyet nötr "chairperson" veya "chair" da kullanılır.',examples:"1. The chairman opened the meeting. (Başkan toplantıyı açtı.) 2. She was elected chairperson. (Başkan seçildi.)"},{word:"challenge",type:"İsim/Fiil",meaning:"1. Meydan okuma, zorluk (isim). 2. İtiraz etmek, sorgulamak (fiil). 3. Düelloya çağırmak.",guide:"Zorlu bir görev veya bir iddiaya karşı çıkma.",examples:"1. Climbing the mountain was a great challenge. (Dağa tırmanmak büyük bir meydan okumaydı.) 2. I challenge you to a game of chess. (Seni bir satranç oyununa davet ediyorum.) 3. She challenged the decision in court. (Karara mahkemede itiraz etti.)"},{word:"champion",type:"İsim/Fiil",meaning:"1. Şampiyon (isim). 2. Savunucu, destekçi (isim). 3. Savunmak, desteklemek (fiil).",guide:"Bir yarışmayı veya müsa
