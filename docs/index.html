sed me on the road. (Yolda beni geçtin.)\n2. I hope I pass the driving test. (Umarım direksiyon sınavını geçerim.)\n3. Could you pass the salt, please? (Tuzu uzatabilir misiniz, lütfen?)", "rank": 452}, {"word": "above", "type": "Edat/Zarf/Sıfat", "meaning": "1. Üstünde, yukarısında (edat).", "full_meaning": "1. Üstünde, yukarısında (edat).\n2. Daha fazla, üzerinde (miktar/yaş).\n3. Yukarıda, önceden belirtilen (sıfat/zarf).", "guide": "Temel fiziksel konum (üstünde) veya bir değerin (sayı, standart) üzerinde olma anlamında kullanılır.", "examples": "1. The picture is hanging above the fireplace. (Resim şöminenin üstünde asılı.)\n2. The temperature was above 30 degrees. (Sıcaklık 30 derecenin üzerindeydi.)\n3. Please refer to the above diagram. (Lütfen yukarıdaki şemaya bakınız.)", "rank": 453}, {"word": "practise", "type": "Fiil", "meaning": "1. Pratik yapmak, alıştırma yapmak.", "full_meaning": "1. Pratik yapmak, alıştırma yapmak.\n2. Uygulamak, yerine getirmek.\n3. (Meslek) icra etmek.", "guide": "Bir beceriyi geliştirmek için düzenli olarak çalışmak. Bir inancı veya mesleği uygulamak.", "examples": "1. I practise the piano every day. (Her gün piyano çalışırım.)\n2. It's important to practise what you preach. (Öğüt verdiğin şeyi uygulamak önemlidir.)\n3. He practises law in London. (Londra'da avukatlık yapıyor.)", "rank": 454}, {"word": "section", "type": "İsim", "meaning": "1. Bölüm, kısım.", "full_meaning": "1. Bölüm, kısım.\n2. Kesit.\n3. Grup, kesim (toplumun).", "guide": "Bir bütünün ayrılmış parçası veya belirli bir alan.", "examples": "1. Read the first section. (İlk bölümü oku.)\n2. The architect drew a cross-section. (Mimar bir kesit çizdi.)\n3. This policy affects a large section of society. (Bu politika toplumun geniş bir kesimini etkiliyor.)", "rank": 455}, {"word": "perform", "type": "Fiil", "meaning": "1. (Gösteri) Yapmak, sergilemek.", "full_meaning": "1. (Gösteri) Yapmak, sergilemek.\n2. Yerine getirmek (görev, iş).\n3. Çalışmak, işlev görmek (makine).", "guide": "Sahne sanatlarında seyirci önünde sergilemek. Bir sorumluluğu yerine getirmek veya bir şeyin nasıl çalıştığını ifade etmek.", "examples": "1. The band will perform tonight. (Grup bu gece performans sergileyecek.)\n2. He failed to perform his duties. (Görevlerini yerine getiremedi.)\n3. The car performs well in cold weather. (Araba soğuk havada iyi performans gösteriyor.)", "rank": 456}, {"word": "receive", "type": "Fiil", "meaning": "1. Almak, teslim almak.", "full_meaning": "1. Almak, teslim almak.\n2. (Ziyaretçi) Kabul etmek, ağırlamak.\n3. (Tepki) Görmek, almak.", "guide": "Pasif bir şekilde bir şeyin size verilmesi, gönderilmesi veya ulaştırılması. (\"Get\" fiilinin daha resmi halidir).", "examples": "1. \"Did you receive my email?\" (E-postamı aldın mı?)\n2. \"The ambassador received us in his office.\" (Büyükelçi bizi ofisinde kabul etti.)\n3. \"The proposal received widespread support.\" (Öneri geniş çaplı destek gördü.)", "rank": 457}, {"word": "king", "type": "İsim", "meaning": "1. Kral.", "full_meaning": "1. Kral.\n2. (Satranç) Şah.\n3. (Bir alanda) En iyi, en büyük, kral.", "guide": "Bir monarşide en yüksek rütbeli erkek hükümdar. Bir alanda en ünlü, güçlü veya önemli kişi.", "examples": "1. The king addressed the nation. (Kral ulusa seslendi.)\n2. You must protect your king in chess. (Satrançta şahını korumalısın.)\n3. He is known as the king of rock and roll. (O, rock'n roll'un kralı olarak bilinir.)", "rank": 458}, {"word": "range", "type": "İsim / Fiil", "meaning": "1. (İsim) Çeşitlilik, yelpaze.", "full_meaning": "1. (İsim) Çeşitlilik, yelpaze.\n2. (İsim) Menzil, erim, aralık.\n3. (Fiil) Değişmek, uzanmak (belirli sınırlar arasında).", "guide": "Belirli bir alandaki çeşitlerin tamamı veya en düşük ile en yüksek sınır arasındaki fark.", "examples": "1. \"The store offers a wide range of products.\" (Mağaza geniş bir ürün yelpazesi sunuyor.)\n2. \"The missile has a range of 500 km.\" (Füzenin menzili 500 km.)\n3. \"Prices range from $10 to $100.\" (Fiyatlar 10 ila 100 dolar arasında değişiyor.)", "rank": 459}, {"word": "union", "type": "İsim", "meaning": "1. Sendika", "full_meaning": "1. Sendika\n2. Birlik, ittifak (siyasi/sosyal)\n3. Evlilik, birleşme", "guide": "En yaygın kullanımı, çalışanların haklarını korumak için kurduğu sendikadır. Ayrıca, grupların veya ülkelerin resmi birliğini (örn. Avrupa Birliği) veya iki insanın evlilik yoluyla birleşmesini ifade eder.", "examples": "1. The factory workers joined a trade union. (Fabrika işçileri bir ticaret sendikasına katıldı.)\n2. The European Union is a political and economic union. (Avrupa Birliği siyasi ve ekonomik bir birliktir.)\n3. Their union was blessed with three children. (Evlilikleri/birliktelikleri üç çocukla kutsandı.)", "rank": 460}, {"word": "similar", "type": "Sıfat", "meaning": "1. Benzer.", "full_meaning": "1. Benzer.\n2. Aynı türden.\n3. Hemen hemen aynı.", "guide": "Tam olarak aynı olmasa da, birçok yönden birbirine benzeyen.", "examples": "1. Our tastes are similar. (Zevklerimiz benzer.)\n2. They have similar problems. (Benzer sorunları var.)\n3. The two houses are very similar. (İki ev birbirine çok benziyor.)", "rank": 461}, {"word": "send", "type": "Fiil", "meaning": "1. Göndermek.", "full_meaning": "1. Göndermek.\n2. Yollamak, iletmek.\n3. (Bir yere) Yollamak, göndermek.", "guide": "Bir şeyi bir yerden başka bir yere veya kişiye ulaştırmak için yollamak.", "examples": "1. I will send you an email. (Sana bir e-posta göndereceğim.)\n2. Send my regards to your family. (Ailene selamlarımı ilet.)\n3. They sent him to prison. (Onu hapishaneye gönderdiler.)", "rank": 462}, {"word": "decide", "type": "Fiil", "meaning": "1. Karar vermek.", "full_meaning": "1. Karar vermek.\n2. Sonucunu belirlemek.\n3. İkna etmek, karar verdirtmek.", "guide": "Bir seçenekler arasından birini seçmek veya bir sonuca varmak.", "examples": "1. I can't decide what to eat. (Ne yiyeceğime karar veremiyorum.)\n2. One mistake decided the game. (Bir hata maçın sonucunu belirledi.)\n3. Her argument decided me to vote yes. (Onun argümanı bana evet oyu verme kararını verdirdi.)", "rank": 463}, {"word": "moment", "type": "İsim", "meaning": "1. An, lahza.", "full_meaning": "1. An, lahza.\n2. Önem, değer.\n3. (Fizik) moment, kuvvetin döndürme etkisi.", "guide": "Çok kısa bir süre. Ayrıca bir şeyin önemini vurgulamak için kullanılır (\"of great moment\").", "examples": "1. Wait a moment, please. (Bir an bekleyin lütfen.)\n2. This is a moment of great joy. (Bu büyük bir sevinç anı.)\n3. At that moment, the phone rang. (Tam o anda telefon çaldı.)", "rank": 464}, {"word": "strong", "type": "Sıfat", "meaning": "1. Güçlü, kuvvetli.", "full_meaning": "1. Güçlü, kuvvetli.\n2. Sağlam, dayanıklı.\n3. Keskin, yoğun (koku/tat).", "guide": "Fiziksel gücü olan veya etkisi/yoğunluğu yüksek olan.", "examples": "1. He is very strong. (O çok güçlü.)\n2. Strong coffee. (Koyu/Kuvvetli kahve.)\n3. A strong argument. (Güçlü bir argüman.)", "rank": 465}, {"word": "total", "type": "Sıfat / İsim / Fiil", "meaning": "Sıfat: 1. Toplam, bütün.", "full_meaning": "Sıfat: 1. Toplam, bütün.\nİsim: 2. Toplam, yekün.\nFiil: 3. Toplamak.\n4. Tamamen mahvetmek.", "guide": "Bir bütünün tamamı. Fiil olarak, sayıları bir araya getirmek veya ağır hasar vermek.", "examples": "1. What is the total cost? (Toplam maliyet nedir?)\n2. The total came to 150 euros. (Toplam 150 euro tuttu.)\n3. Total the numbers in this column. (Bu sütundaki sayıları topla.)", "rank": 466}, {"word": "father", "type": "İsim/Fiil", "meaning": "1. Baba (isim).", "full_meaning": "1. Baba (isim).\n2. Kurucu, öncü (isim).\n3. Baba olmak (fiil).", "guide": "Bir erkeğin çocuğu. Bir alanın veya fikrin kurucusu. Bir çocuğun biyolojik babası olmak.", "examples": "1. My father is a teacher. (Babam bir öğretmen.)\n2. the father of modern physics (modern fiziğin babası)\n3. He fathered three children. (Üç çocuk babası oldu.)", "rank": 467}, {"word": "tax", "type": "İsim / Fiil", "meaning": "İsim: 1. Vergi.", "full_meaning": "İsim: 1. Vergi.\nFiil: 2. Vergilendirmek.\n3. Zorlamak, yıpratmak (mecazi).", "guide": "Devlete ödenen zorunlu ödeme. Mecazi olarak, bir şeyi aşırı zorlamak anlamında kullanılır.", "examples": "1. Income tax must be paid every year. (Gelir vergisi her yıl ödenmelidir.)\n2. The government may tax luxury goods more. (Hükümet lüks malları daha fazla vergilendirebilir.)\n3. The long journey taxed my patience. (Uzun yolculuk sabrımı zorladı/tüketti.)", "rank": 468}, {"word": "science", "type": "İsim", "meaning": "1. Bilim.", "full_meaning": "1. Bilim.\n2. Fen bilimleri.\n3. Sistemli bilgi dalı.", "guide": "Gözlem ve deney yoluyla doğal dünyaya ilişkin bilgi edinme ve bu bilgiyi düzenleme işi.", "examples": "1. He studies science. (Bilim okuyor.)\n2. Physics is a branch of science. (Fizik, fen bilimlerinin bir dalıdır.)\n3. There's a science to making perfect coffee. (Mükemmel kahve yapmanın bir bilimi vardır.)", "rank": 469}, {"word": "secure", "type": "Sıfat / Fiil", "meaning": "1. (S) Güvenli, emniyetli.", "full_meaning": "1. (S) Güvenli, emniyetli.\n2. (S) Sağlam, sabit.\n3. (F) Sağlamak, elde etmek.", "guide": "Tehlikeden uzak, korunmuş veya sabitlenmiş halde olma. Fiil olarak güvence altına almak, sağlamak.", "examples": "1. Make sure the door is secure. (Kapının güvenli/kitli olduğundan emin ol.)\n2. The ladder doesn't feel secure. (Merdiven sağlam hissettirmiyor.)\n3. He secured a loan from the bank. (Bankadan bir kredi sağladı.)", "rank": 470}, {"word": "detail", "type": "İsim", "meaning": "1. Ayrıntı, detay.", "full_meaning": "1. Ayrıntı, detay.\n2. Görev, detay (askeri).\n3. (in detail) Ayrıntılı olarak.", "guide": "Büyük bir bütünün küçük bir parçası veya bir konu hakkındaki küçük bilgi.", "examples": "1. Pay attention to the details. (Ayrıntılara dikkat edin.)\n2. He's on guard detail tonight. (Bu gece nöbet görevinde.)\n3. Explain it to me in detail. (Bunu bana ayrıntılı olarak açıkla.)", "rank": 471}, {"word": "reach", "type": "Fiil / İsim", "meaning": "1. (Fiil) Uzanmak, erişmek.", "full_meaning": "1. (Fiil) Uzanmak, erişmek.\n2. (Fiil) Varmak, ulaşmak.\n3. (İsim) Erişim, erişim alanı.", "guide": "Bir yere varmak, bir şeye dokunmak veya ona ulaşmak için eli uzatmak anlamına gelir.", "examples": "1. \"Can you reach the top shelf?\" (Üst rafa uzanabilir misin?)\n2. \"We reached the airport just in time.\" (Tam zamanında havaalanına vardık.)\n3. \"The bottle was out of reach.\" (Şişe erişim alanının dışındaydı.)", "rank": 472}, {"word": "charge", "type": "Fiil/İsim", "meaning": "1. Ücret almak, fiyatlandırmak (fiil).", "full_meaning": "1. Ücret almak, fiyatlandırmak (fiil).\n2. Suçlamak (fiil).\n3. Sorumluluk, şarj (isim).", "guide": "Para talep etmek veya resmi bir suç yöneltmek. Elektrik yükü veya sorumluluk anlamı da vardır.", "examples": "1. How much do you charge for a haircut? (Bir saç kesimi için ne kadar ücret alıyorsunuz?)\n2. He was charged with murder. (Cinayetle suçlandı.)\n3. Who is in charge here? (Burada kim sorumlu?)", "rank": 473}, {"word": "girl", "type": "İsim", "meaning": "1. Kız (çocuk veya genç kadın).", "full_meaning": "1. Kız (çocuk veya genç kadın).\n2. Kız arkadaş (gayriresmi).\n3. (Argo) Kızlar, arkadaş grubu.", "guide": "Genç bir dişi insan. Gayriresmi olarak romantik partner veya kadın arkadaş grubu için kullanılır.", "examples": "1. The girl is riding her bicycle. (Kız bisikletine biniyor.)\n2. He's going out with his girl. (Kız arkadaşıyla çıkıyor.)\n3. I'm going for a drink with the girls. (Kızlarla bir içkiye gidiyorum.)", "rank": 474}, {"word": "environment", "type": "İsim", "meaning": "1. Çevre, ortam.", "full_meaning": "1. Çevre, ortam.\n2. Doğal çevre.\n3. (Bilgisayar) Ortam, çalışma alanı.", "guide": "Canlıların etrafını saran ve onları etkileyen doğal koşullar. Belirli bir faaliyetin gerçekleştiği şartlar.", "examples": "1. We must protect the environment. (Çevreyi korumalıyız.)\n2. a learning environment (bir öğrenme ortamı)\n3. a software development environment (bir yazılım geliştirme ortamı)", "rank": 475}, {"word": "express", "type": "Fiil/Sıfat/İsim", "meaning": "1. İfade etmek, anlatmak (fiil).", "full_meaning": "1. İfade etmek, anlatmak (fiil).\n2. Ekspres, hızlı (sıfat).\n3. Ekspres (tren/kargo) (isim).", "guide": "Düşünce veya duyguları söz veya davranışla göstermek. Hızlı veya doğrudan olan. Hızlı bir servis türü.", "examples": "1. I can't express how grateful I am. (Ne kadar minnettar olduğumu ifade edemem.)\n2. an express train (bir ekspres tren)\n3. Send it by express mail. (Ekspres kargo ile gönder.)", "rank": 476}, {"word": "west", "type": "İsim, Sıfat, Zarf", "meaning": "1. Batı (yön) (isim)", "full_meaning": "1. Batı (yön) (isim)\n2. Batı, batıdaki (sıfat)\n3. Batıya doğru (zarf)", "guide": "Güneşin battığı ana yön. Belirli bir bölgenin batı kısmı veya batıya doğru hareketi ifade eder.", "examples": "1. The sun sets in the west. (Güneş batıda batar.)\n2. He lives on the west coast. (Batı sahilde yaşıyor.)\n3. They traveled west for three days. (Üç gün boyunca batıya doğru seyahat ettiler.)", "rank": 477}, {"word": "staff", "type": "İsim / Fiil", "meaning": "1. (İ) Personel, kadro.", "full_meaning": "1. (İ) Personel, kadro.\n2. (İ) Asa, baston.\n3. (F) Personel sağlamak.", "guide": "Bir kuruluşta çalışan kişilerin tümü. Ayrıca destek için kullanılan uzun sopa.", "examples": "1. The hotel staff were very helpful. (Otel personeli çok yardımcıydı.)\n2. The shepherd carried a staff. (Çoban bir asa taşıyordu.)\n3. The office is staffed 24 hours a day. (Ofis günde 24 saat personellendirilmiştir.)", "rank": 478}, {"word": "approach", "type": "Fiil/İsim", "meaning": "1. Yaklaşmak (fiil).", "full_meaning": "1. Yaklaşmak (fiil).\n2. Yaklaşım, yöntem (isim).\n3. Başvurmak, görüşmek (fiil).", "guide": "Fiziksel olarak yakınlaşmak veya bir soruna nasıl yaklaşıldığı.", "examples": "1. The train is approaching the station. (Tren istasyona yaklaşıyor.)\n2. We need a new approach to this problem. (Bu soruna yeni bir yaklaşıma ihtiyacımız var.)\n3. He was approached about the job. (O, iş hakkında görüşülmek üzere arandı.)", "rank": 479}, {"word": "across", "type": "Edat/Zarf", "meaning": "1. Karşısında, öbür tarafında (edat).", "full_meaning": "1. Karşısında, öbür tarafında (edat).\n2. Boyunca, her yerinde (edat).\n3. Karşıdan karşıya (zarf).", "guide": "Bir şeyin bir tarafından diğer tarafına doğru hareketi veya konumu ifade eder.", "examples": "1. He lives across the street. (Sokağın karşısında yaşıyor.)\n2. There are shops across the city. (Şehrin her yerinde dükkanlar var.)\n3. Can you swim across? (Karşıya yüzebilir misin?)", "rank": 480}, {"word": "common", "type": "Sıfat", "meaning": "1. Yaygın, sık rastlanan.", "full_meaning": "1. Yaygın, sık rastlanan.\n2. Ortak, müşterek.\n3. Sıradan, alelade.", "guide": "Çok sayıda yerde bulunan veya birçok kişi tarafından paylaşılan.", "examples": "1. It's a common mistake. (Yaygın bir hatadır.)\n2. We have a common goal. (Ortak bir hedefimiz var.)\n3. common sense (sağduyu)", "rank": 481}, {"word": "future", "type": "İsim/Sıfat", "meaning": "1. Gelecek, istikbal (isim).", "full_meaning": "1. Gelecek, istikbal (isim).\n2. Gelecek zamana ait (sıfat).\n3. (in future) Bundan sonra.", "guide": "Şu andan sonraki zaman. İleride olacak veya kullanılacak olan.", "examples": "1. No one can predict the future. (Kimse geleceği tahmin edemez.)\n2. future generations (gelecek nesiller)\n3. In future, please be more careful. (Bundan sonra lütfen daha dikkatli olun.)", "rank": 482}, {"word": "date", "type": "İsim/Fiil", "meaning": "1. Tarih (isim).", "full_meaning": "1. Tarih (isim).\n2. Randevu, buluşma (özellikle romantik) (isim).\n3. Çıkmak, görüşmek (fiil).", "guide": "Belirli bir gün, ay ve yıl. Ayrıca iki kişinin sosyal veya romantik bir amaçla planlı buluşması.", "examples": "1. What's the date today? (Bugünün tarihi ne?)\n2. I have a date on Friday night. (Cuma gecesi bir randevum var.)\n3. They've been dating for six months. (Altı aydır çıkıyorlar.)", "rank": 483}, {"word": "standard", "type": "İsim / Sıfat", "meaning": "1. (İ) Standart, norm.", "full_meaning": "1. (İ) Standart, norm.\n2. (S) Standart, normal.\n3. (İ) Bayrak, sancak.", "guide": "Genel kabul görmüş ölçü veya kalite düzeyi. Sıfat olarak olağan, normal.", "examples": "1. This is the industry standard. (Bu, sektör standardıdır.)\n2. The standard procedure is to fill out this form. (Standart prosedür bu formu doldurmaktır.)\n3. Raise the standard high. (Bayrağı/Sancağı yüksekte tut.)", "rank": 484}, {"word": "church", "type": "İsim", "meaning": "1. Kilise (bina).", "full_meaning": "1. Kilise (bina).\n2. Kilise (kurum).\n3. Ayin.", "guide": "Hıristiyanların ibadet ettiği bina veya Hıristiyanlık kurumu.", "examples": "1. They got married in a church. (Bir kilisede evlendiler.)\n2. Do you go to church? (Kiliseye gider misin?)", "rank": 485}, {"word": "human", "type": "İsim, Sıfat", "meaning": "1. (İsim) İnsan.", "full_meaning": "1. (İsim) İnsan.\n2. (Sıfat) İnsana ait, beşeri.\n3. İnsancıl, insani.", "guide": "Homo sapiens türünden canlı. İnsanlarla ilgili olan. İnsani duygulara sahip olan.", "examples": "1. Every human has the right to education. (Her insanın eğitim hakkı vardır.)\n2. We are studying human behavior. (İnsan davranışını inceliyoruz.)\n3. It's only human to make mistakes. (Hata yapmak insanidir.)", "rank": 486}, {"word": "team", "type": "İsim / Fiil", "meaning": "İsim: 1. Takım, ekip.", "full_meaning": "İsim: 1. Takım, ekip.\nFiil: 2. (up) Takım olmak, birleşmek.", "guide": "Ortak bir amaç için birlikte çalışan grup. Fiil olarak, işbirliği yapmak anlamına gelir.", "examples": "1. Our team won the championship. (Takımımız şampiyon oldu.)\n2. The project requires a team effort. (Proje bir takım çalışması gerektirir.)\n3. The two companies teamed up for the research. (İki şirket araştırma için birleşti/takım kurdu.)", "rank": 487}, {"word": "twenty", "type": "Sayı / İsim", "meaning": "1. Yirmi (20).", "full_meaning": "1. Yirmi (20).", "guide": "19'dan sonra ve 21'den önce gelen sayı.", "examples": "1. The book costs twenty dollars. (Kitap yirmi dolar.)\n2. She is in her twenties. (O, yirmili yaşlarında.)\n3. Page twenty is missing. (Yirminci sayfa eksik.)", "rank": 488}, {"word": "ground", "type": "İsim, Fiil", "meaning": "1. Yer, zemin, toprak.", "full_meaning": "1. Yer, zemin, toprak.\n2. Alan, saha (spor).\n3. (Fiil) Cezalandırmak (çocuğu), uçmasını yasaklamak (pilot).", "guide": "Dünyanın katı yüzeyi. Belirli bir amaç için kullanılan açık alan. Fiil olarak, birini evden çıkmaması için cezalandırmak.", "examples": "1. He fell to the ground. (Yere düştü.)\n2. The team has a strong record on their home ground. (Takımın kendi sahasında güçlü bir rekoru var.)\n3. His parents grounded him for a week. (Ailesi onu bir haftalığına sokağa yasakladı/cezalı kıldı.)", "rank": 489}, {"word": "sound", "type": "İsim / Fiil / Sıfat", "meaning": "1. (İ) Ses.", "full_meaning": "1. (İ) Ses.\n2. (F) ... gibi gelmek.\n3. (S) Sağlam, güvenilir.", "guide": "Kulakla algılanan titreşim. Fiil olarak bir izlenim vermek. Sıfat olarak sağlam, doğru.", "examples": "1. I heard a strange sound. (Tuhaf bir ses duydum.)\n2. That sounds like a good idea. (Bu iyi bir fikir gibi geliyor.)\n3. The building is sound and safe. (Bina sağlam ve güvenlidir.)", "rank": 490}, {"word": "front", "type": "İsim/Sıfat/Fiil", "meaning": "1. Ön, ön taraf (isim).", "full_meaning": "1. Ön, ön taraf (isim).\n2. (Hava) Cephe (isim).\n3. (for) Ön şirket olmak (fiil).", "guide": "Bir şeyin yüzü veya en önemli kısmı. Hava kütlelerinin buluştuğu sınır. Yasadışı bir faaliyeti gizlemek için kurulmuş görünen işletme.", "examples": "1. the front of the house (evin önü)\n2. a cold front (bir soğuk cephe)\n3. The shop was a front for drug dealing. (Dükkan uyuşturucu satışı için bir ön şirketti.)", "rank": 491}, {"word": "paper", "type": "İsim", "meaning": "1. Kağıt.", "full_meaning": "1. Kağıt.\n2. Gazete.\n3. (Akademik) tez, makale, sınav kağıdı.", "guide": "Temel anlamı üzerine yazı yazılan kağıt. Günlük haberlere ulaşılan basılı ürün (gazete) ve akademik yazılar için de kullanılır.", "examples": "1. Can you pass me a sheet of paper? (Bana bir kağıt uzatabilir misin?)\n2. I read about it in the paper. (Onun hakkında gazetede okudum.)\n3. She's writing a paper on climate change. (İklim değişikliği üzerine bir makale yazıyor.)", "rank": 492}, {"word": "international", "type": "Sıfat", "meaning": "1. Uluslararası.", "full_meaning": "1. Uluslararası.\n2. Dünya çapında.", "guide": "İki veya daha fazla ülkeyi ilgilendiren veya aralarında olan.", "examples": "1. English is an international language. (İngilizce uluslararası bir dildir.)\n2. The company has international offices. (Şirketin uluslararası ofisleri var.)", "rank": 493}, {"word": "serve", "type": "Fiil", "meaning": "1. Hizmet etmek.", "full_meaning": "1. Hizmet etmek.\n2. Servis atmak/sunmak (tenis/yemek).\n3. (Hapis) Yatmak, çekmek.", "guide": "Birine yardım veya hizmet sunmak. Sporda topu oyuna sokmak.", "examples": "1. The cafe serves great coffee. (Kafe harika kahve sunuyor.)\n2. It's your turn to serve. (Servis atma sırası sende.)\n3. He served five years in prison. (Hapiste beş yıl yattı/çekti.)", "rank": 494}, {"word": "along", "type": "Edat/Zarf", "meaning": "1. Boyunca, yolunda (edat).", "full_meaning": "1. Boyunca, yolunda (edat).\n2. İlerleyerek, beraberinde (zarf).\n3. (get along) anlaşmak, iyi geçinmek.", "guide": "Bir çizgi veya yol üzerinde hareketi veya konumu ifade eder.", "examples": "1. We walked along the river. (Nehir boyunca yürüdük.)\n2. Come along with us. (Bizimle gel.)\n3. How are you getting along with your new colleagues? (Yeni meslektaşlarınla nasıl anlaşıyorsun?)", "rank": 495}, {"word": "describe", "type": "Fiil", "meaning": "1. Tanımlamak, betimlemek.", "full_meaning": "1. Tanımlamak, betimlemek.\n2. Tasvir etmek, anlatmak.\n3. (Geometri) Çizmek, tarif etmek.", "guide": "Bir kişi, yer, olay veya duygu hakkında, onu zihinde canlandıracak şekilde ayrıntılı olarak konuşmak veya yazmak.", "examples": "1. Can you describe the man you saw? (Gördüğün adamı tanımlayabilir misin?)\n2. He described his journey in detail. (Yolculuğunu ayrıntılı olarak anlattı.)\n3. The line describes a circle. (Çizgi bir daire çizer.)", "rank": 496}, {"word": "several", "type": "Sıfat / Zamir", "meaning": "1. Birkaç.", "full_meaning": "1. Birkaç.\n2. Çeşitli.\n3. Birkaçı, bazıları.", "guide": "Üç ila yaklaşık yedi veya sekiz arasında, belirsiz ancak birden fazla sayıda olan.", "examples": "1. I've read this book several times. (Bu kitabı birkaç kez okudum.)\n2. Several people complained. (Birkaç/Bazı kişi şikayet etti.)\n3. I have several of his paintings. (Onun tablolarından birkaçına sahibim.)", "rank": 497}, {"word": "project", "type": "İsim/Fiil", "meaning": "1. (İsim) Proje.", "full_meaning": "1. (İsim) Proje.\n2. (İsim) Plan, tasarı.\n3. (Fiil) Yansıtmak, göstermek.\n4. (Fiil) Tahmin etmek, öngörmek.", "guide": "Belirli bir amaç için planlanmış iş. Fiil olarak bir ışık/görüntüyü yansıtmak veya gelecekle ilgili tahmin yapmak.", "examples": "1. We're working on a school project about the environment. (Çevre hakkında bir okul projesi üzerinde çalışıyoruz.)\n2. a housing development project (bir konut geliştirme projesi)\n3. The film was projected onto a large screen. (Film büyük bir ekrana yansıtıldı.)\n4. Sales are projected to rise next year. (Satışların gelecek yıl yükselmesi öngörülüyor.)", "rank": 498}, {"word": "collect", "type": "Fiil", "meaning": "1. Toplamak, biriktirmek.", "full_meaning": "1. Toplamak, biriktirmek.\n2. (Para) toplamak, tahsil etmek.\n3. (Kendini) toparlamak.", "guide": "Bir araya getirmek veya para toplamak.", "examples": "1. He collects stamps. (Pul biriktirir.)\n2. I need to collect the children from school. (Çocukları okuldan almam gerekiyor.)\n3. collect your thoughts (düşüncelerini topla)", "rank": 499}, {"word": "vary", "type": "Fiil", "meaning": "1. Değişmek, farklılaşmak", "full_meaning": "1. Değişmek, farklılaşmak\n2. Çeşitlendirmek\n3. Değiştirmek, ayarlamak", "guide": "Bir şeyin miktar, seviye veya biçim olarak farklı olması veya bu farklılıkları oluşturması demektir. Sürekli veya duruma göre değişkenlik gösteren şeyler için kullanılır.", "examples": "1. Prices may vary depending on the season. (Fiyatlar mevsime göre değişebilir.)\n2. Try to vary your exercise routine. (Egzersiz rutinini çeşitlendirmeyi dene.)\n3. You can vary the speed of the fan. (Fanın hızını ayarlayabilirsiniz.)", "rank": 500}, {"word": "answer", "type": "İsim/Fiil", "meaning": "1. Cevap, yanıt (isim).", "full_meaning": "1. Cevap, yanıt (isim).\n2. Cevap vermek, yanıtlamak (fiil).\n3. (Sorunu) çözmek, halletmek (fiil).", "guide": "Bir soruya veya probleme verilen sözlü, yazılı veya eylemsel karşılık.", "examples": "1. I'm waiting for an answer to my email. (E-postama bir cevap bekliyorum.)\n2. Could you answer the phone, please? (Telefona bakar mısın lütfen?)\n3. This new drug may answer the problem. (Bu yeni ilaç sorunu çözebilir.)", "rank": 501}, {"word": "table", "type": "İsim", "meaning": "1. Masa.", "full_meaning": "1. Masa.\n2. Tablo, çizelge.\n3. Yemek, sofradaki yemek.", "guide": "Genellikle fiziksel bir mobilya (masa) veya bilgilerin düzenli gösterimi (tablo) için kullanılır. \"Yemek\" anlamı genellikle \"at the table\" veya \"set the table\" gibi kalıplarla ortaya çıkar.", "examples": "1. Let's sit at that corner table. (Şu köşedeki masaya oturalım.)\n2. The data is summarized in Table 3 on page 10. (Veriler, 10. sayfadaki 3. Tablo'da özetlenmiştir.)\n3. His jokes always liven up the table. (Onun şakaları her zaman sofrayı/sohbeti neşelendirir.)", "rank": 502}, {"word": "department", "type": "İsim", "meaning": "1. Bölüm, şube, departman.", "full_meaning": "1. Bölüm, şube, departman.\n2. (Üniversite) Fakülte, bölüm.\n3. (ABD devlet) Bakanlık.", "guide": "Büyük bir organizasyonun (şirket, mağaza, üniversite, devlet) belirli bir işlevi yerine getiren alt birimi.", "examples": "1. She works in the sales department. (Satış departmanında çalışıyor.)\n2. He's the head of the history department. (Tarih bölümü başkanı.)\n3. the Department of Defense (Savunma Bakanlığı)", "rank": 503}, {"word": "upon", "type": "Edat", "meaning": "1. Üzerinde, üstünde (daha resmi bir on)", "full_meaning": "1. Üzerinde, üstünde (daha resmi bir on)\n2. Hemen sonra, -ir -irmez (upon + -ing)", "guide": "\"On\" ile hemen hemen aynı anlama gelir ancak daha resmi veya edebidir. Özellikle bir şeyin hemen ardından gerçekleştiğini belirtmek için kullanılır.", "examples": "1. The decision is based upon the available evidence. (Karar mevcut kanıtlara dayanmaktadır.)\n2. Upon hearing the news, she burst into tears. (Haberi duyar duymaz, gözyaşlarına boğuldu.)\n3. Once upon a time... (Bir varmış bir yokmuş...)", "rank": 504}, {"word": "watch", "type": "Fiil, İsim", "meaning": "1. İzlemek, seyretmek (fiil)", "full_meaning": "1. İzlemek, seyretmek (fiil)\n2. Kol saati (isim)\n3. Göz kulak olmak, bekçilik etmek (fiil)", "guide": "Dikkatle bakmak, gözlemlemek. Televizyon izlemek, bir maçı seyretmek. Ayrıca, zamanı gösteren alet veya birini/yeri koruma eylemidir.", "examples": "1. We watched a movie last night. (Dün gece bir film izledik.)\n2. My watch is broken. (Kol saatim bozuk.)\n3. Could you watch my bag for a minute? (Çantamı bir dakika göz kulak olur musun?)", "rank": 505}, {"word": "die", "type": "Fiil", "meaning": "1. Ölmek, vefat etmek.", "full_meaning": "1. Ölmek, vefat etmek.\n2. Sönmek, bitmek (mecazi).\n3. (for/to do) Çok istemek, can atmak (konuşma dili).", "guide": "Yaşamını yitirmek. Bir aktivitenin veya duygunun sona ermesi. Argo olarak bir şeyi çok fazla istemek.", "examples": "1. Plants die without water. (Bitkiler susuz ölür.)\n2. The laughter died on his lips. (Kahkahası dudaklarında söndü.)\n3. I'm dying for a cup of coffee. (Bir fincan kahve için can atıyorum.)", "rank": 506}, {"word": "therefore", "type": "Zarf", "meaning": "1. Bu nedenle, dolayısıyla, o halde.", "full_meaning": "1. Bu nedenle, dolayısıyla, o halde.", "guide": "Önceki ifadeden çıkan mantıksal sonucu veya nedeni belirtir. Resmi ve yazılı dilde daha yaygındır.", "examples": "1. He was late, therefore he missed the bus. (Geç kaldı, bu nedenle otobüsü kaçırdı.)\n2. The evidence is unclear; therefore, we cannot make a decision. (Kanıtlar net değil; dolayısıyla bir karar veremeyiz.)\n3. She is allergic to nuts and therefore avoids them. (O, kuruyemişe alerjisi var ve bu yüzden onlardan kaçınır.)", "rank": 507}, {"word": "hundred", "type": "Sayı, İsim", "meaning": "1. Yüz (100).", "full_meaning": "1. Yüz (100).\n2. (Çoğul) Yüzlerce.\n3. Yüzlük, yüz sayısı.", "guide": "10 x 10 sayısı. Belirsiz büyük sayıları ifade etmek için \"hundreds of\" kullanılır.", "examples": "1. There are one hundred cents in a dollar. (Bir dolarda yüz sent vardır.)\n2. Hundreds of people attended the concert. (Yüzlerce insan konsere katıldı.)", "rank": 508}, {"word": "town", "type": "İsim", "meaning": "1. Kasaba, ilçe.", "full_meaning": "1. Kasaba, ilçe.\n2. Şehir merkezi, downtown.\n3. (the town) Halk, kasaba halkı.", "guide": "Köyden büyük, şehirden küçük yerleşim yeri. Şehir merkezi veya sakinleri için de kullanılır.", "examples": "1. I grew up in a small town. (Küçük bir kasabada büyüdüm.)\n2. Let's go into town to do some shopping. (Biraz alışveriş yapmak için şehre/merkeze gidelim.)\n3. The whole town was talking about it. (Bütün kasaba onun hakkında konuşuyordu.)", "rank": 509}, {"word": "death", "type": "İsim", "meaning": "1. Ölüm, vefat.", "full_meaning": "1. Ölüm, vefat.\n2. Son, yok olma.\n3. Ölüm nedeni.", "guide": "Yaşamın sona ermesi. Soyut kavramların veya kuruluşların bitişini tanımlamak için de kullanılır.", "examples": "1. His death was a great loss. (Onun ölümü büyük bir kayıptı.)\n2. The failure meant the death of his dreams. (Başarısızlık, hayallerinin sonu anlamına geliyordu.)\n3. The death was ruled an accident. (Ölüm kaza olarak kayıtlara geçti.)", "rank": 510}, {"word": "page", "type": "İsim", "meaning": "1. Sayfa (kitap, dergi).", "full_meaning": "1. Sayfa (kitap, dergi).\n2. (Tarihi) sayfa, evre, dönem.\n3. (Otel, havaalanı gibi yerlerde) anonsla çağırmak.", "guide": "Çoğunlukla bir kitabın veya belgenin yüzey birimi. Mecazi olarak tarihteki bir dönemi ifade edebilir. Fiil olarak, birini hoparlörden anonsla aramak anlamına gelir.", "examples": "1. Please turn to page 45 in your textbook. (Lütfen ders kitabınızın 45. sayfasını açın.)\n2. This discovery opened a new page in science. (Bu keşif, bilimde yeni bir sayfa açtı.)\n3. They're paging Dr. Smith in the emergency room. (Acil serviste Dr. Smith'i anonsla arıyorlar.)", "rank": 511}, {"word": "demand", "type": "Fiil/İsim", "meaning": "1. Talep etmek, istemek (fiil).", "full_meaning": "1. Talep etmek, istemek (fiil).\n2. Talep, istek (isim).\n3. İhtiyaç, gereksinim (isim).", "guide": "Güçlü ve ısrarlı bir şekilde, genellikle bir hak olarak, bir şey istemek. Ekonomide müşterilerin istekleri.", "examples": "1. Workers demanded higher wages. (İşçiler daha yüksek ücret talep etti.)\n2. There is a high demand for skilled workers. (Kalifiye işçilere yüksek talep var.)\n3. The job makes great demands on your time. (İş zamanınız üzerinde büyük taleplerde bulunuyor.)", "rank": 512}, {"word": "ten", "type": "Sayı / İsim", "meaning": "1. On (sayı).", "full_meaning": "1. On (sayı).\n2. Onluk, on sayısını temsil eden şey.", "guide": "9'dan sonra ve 11'den önce gelen sayı.", "examples": "1. She has ten fingers. (Onun on parmağı var.)\n2. The bus leaves in ten minutes. (Otobüs on dakika içinde kalkıyor.)\n3. He scored a perfect ten. (Mükemmel bir on puan aldı.)", "rank": 513}, {"word": "field", "type": "İsim", "meaning": "1. Tarla, alan.", "full_meaning": "1. Tarla, alan.\n2. (Spor) Saha.\n3. (Uzmanlık) Alan, dal.", "guide": "Tarım yapılan açık arazi. Bir spor etkinliğinin yapıldığı yer. Çalışma veya ilgi alanı.", "examples": "1. a field of wheat (bir buğday tarlası)\n2. a football field (bir futbol sahası)\n3. She's an expert in the field of medicine. (O, tıp alanında bir uzmandır.)", "rank": 514}, {"word": "marry", "type": "Fiil", "meaning": "1. Evlenmek (biriyle).", "full_meaning": "1. Evlenmek (biriyle).\n2. Evlendirmek, nikah kıymak.\n3. (Fikirleri) birleştirmek, uyumlu hale getirmek.", "guide": "Evlilik bağı kurma eylemi. Hem evlenen kişi hem de nikahı kıyan kişi (örneğin rahip) için kullanılabilir.", "examples": "1. They plan to marry next spring. (Önümüzdeki bahar evlenmeyi planlıyorlar.)\n2. The priest will marry them in the chapel. (Rahip onları şapelde evlendirecek.)", "rank": 515}, {"word": "behind", "type": "Edat/Zarf", "meaning": "1. Arkasında, gerisinde (edat).", "full_meaning": "1. Arkasında, gerisinde (edat).\n2. Geride, arkada (zarf).\n3. (Planın) arkasında, sorumlusu.", "guide": "Bir şeyin arka tarafında veya zaman/açıdan geride olma durumu.", "examples": "1. The cat hid behind the sofa. (Kedi kanepenin arkasına saklandı.)\n2. I'm behind with my work. (İşimde gerideyim.)\n3. What's the idea behind this project? (Bu projenin arkasındaki fikir nedir?)", "rank": 516}, {"word": "deep", "type": "Sıfat/Zarf", "meaning": "1. Derin (sıfat).", "full_meaning": "1. Derin (sıfat).\n2. Yoğun, şiddetli (sıfat).\n3. Derinlerde, içten (zarf).", "guide": "Yüzeyden dibe/aşağıya veya öne doğru uzun mesafeli. Mecazi olarak duygu veya durumların güçlü olduğunu ifade eder.", "examples": "1. Be careful, the water is deep here. (Dikkat et, burada su derin.)\n2. He fell into a deep sleep. (Derin bir uykuya daldı.)\n3. She breathed deep to calm down. (Sakinleşmek için derin bir nefes aldı.)", "rank": 517}, {"word": "stage", "type": "İsim / Fiil", "meaning": "1. (İ) Sahne.", "full_meaning": "1. (İ) Sahne.\n2. (İ) Aşama, evre.\n3. (F) Sahnelemek, düzenlemek.", "guide": "Tiyatroda oyunun oynandığı platform veya bir sürecin belirli bir bölümü.", "examples": "1. The actor walked onto the stage. (Aktör sahneye çıktı.)\n2. The project is in its early stages. (Proje erken aşamalarında.)\n3. They will stage a protest tomorrow. (Yarın bir protesto düzenleyecekler.)", "rank": 518}, {"word": "committee", "type": "İsim", "meaning": "1. Komite, kurul.", "full_meaning": "1. Komite, kurul.", "guide": "Belirli bir görevi yerine getirmek için atanmış bir grup insan.", "examples": "1. She sits on the finance committee. (Finans komitesinde görev yapıyor.)\n2. a committee meeting (bir komite toplantısı)", "rank": 519}, {"word": "student", "type": "İsim", "meaning": "1. Öğrenci.", "full_meaning": "1. Öğrenci.\n2. (Bir konuda) Öğrenen kişi.\n3. Stajyer.", "guide": "Okulda, üniversitede veya bir kursta okuyan kişi.", "examples": "1. She is a medical student. (O bir tıp öğrencisidir.)\n2. He is a student of human nature. (O, insan doğasının bir öğrencisidir/gözlemcisidir.)\n3. The law firm takes on students. (Hukuk bürosu stajyer alıyor.)", "rank": 520}, {"word": "language", "type": "İsim", "meaning": "1. Dil, lisan.", "full_meaning": "1. Dil, lisan.\n2. İletişim şekli, terminoloji.\n3. (Bilgisayar) Programlama dili.", "guide": "İnsanların düşünce ve duygularını aktarmak için kullandığı sözlü, yazılı veya işaret sistemli iletişim aracı.", "examples": "1. How many languages do you speak? (Kaç dil konuşuyorsun?)\n2. The article is written in very technical language. (Makale çok teknik bir dille yazılmış.)\n3. Python is a popular programming language. (Python popüler bir programlama dilidir.)", "rank": 521}, {"word": "propose", "type": "Fiil", "meaning": "1. Önermek, teklif etmek.", "full_meaning": "1. Önermek, teklif etmek.\n2. Evlenme teklif etmek.\n3. Tasarlamak, niyet etmek.", "guide": "Bir şeyi tartışma veya kabul için sunmak. Evlilik teklifinde bulunmak.", "examples": "1. I propose we take a short break. (Kısa bir mola vermeyi öneriyorum.)\n2. He proposed to her on the beach. (Ona plajda evlenme teklif etti.)\n3. What do you propose to do next? (Sonra ne yapmayı düşünüyorsun?)", "rank": 522}, {"word": "introduce", "type": "Fiil", "meaning": "1. Tanıştırmak, takdim etmek.", "full_meaning": "1. Tanıştırmak, takdim etmek.\n2. Sunmak, ortaya koymak (fikir/ürün).\n3. Başlatmak, getirmek (sistem/kanun).", "guide": "İnsanları birbirlerine ilk kez tanıtmak. Yeni bir şeyi ilk kez göstermek veya uygulamak.", "examples": "1. Let me introduce you to my wife. (Seni eşimle tanıştırayım.)\n2. The company will introduce a new model next month. (Şirket önümüzdeki ay yeni bir model tanıtacak/sunacak.)\n3. The government introduced a new tax. (Hükümet yeni bir vergi getirdi.)", "rank": 523}, {"word": "current", "type": "Sıfat/İsim", "meaning": "1. Şimdiki, güncel (sıfat).", "full_meaning": "1. Şimdiki, güncel (sıfat).\n2. Akım (elektrik/su) (isim).\n3. Eğilim, akım (isim).", "guide": "Şu anda var olan veya olan. İsim olarak hareket eden su veya elektrik akışı.", "examples": "1. the current situation (mevcut durum)\n2. an electric current (bir elektrik akımı)\n3. a strong current (güçlü bir akıntı)", "rank": 524}, {"word": "attempt", "type": "İsim/Fiil", "meaning": "1. Girişim, teşebbüs (isim).", "full_meaning": "1. Girişim, teşebbüs (isim).\n2. Denemek, teşebbüs etmek (fiil).\n3. (Suikast) girişimi.", "guide": "Bir şeyi başarmak için çaba göstermek, genellikle başarısız olma olasılığıyla birlikte.", "examples": "1. This is my second attempt at learning the guitar. (Bu, gitar öğrenmek için ikinci girişimim.)\n2. He attempted to climb the mountain. (Dağı tırmanmaya teşebbüs etti.)\n3. an attempt on his life (ona yönelik bir suikast girişimi)", "rank": 525}, {"word": "computer", "type": "İsim", "meaning": "1. Bilgisayar.", "full_meaning": "1. Bilgisayar.\n2. (Hesap yapan) cihaz.", "guide": "Programlanabilir elektronik cihaz, veri işler.", "examples": "1. I work on a computer all day. (Bütün gün bilgisayar başında çalışıyorum.)\n2. a laptop computer (bir dizüstü bilgisayar)", "rank": 526}, {"word": "region", "type": "İsim", "meaning": "1. Bölge.", "full_meaning": "1. Bölge.\n2. Yöre, kesim.\n3. Alan, kısım (vücut).", "guide": "Belirli özellikleri olan geniş bir alan (coğrafi, idari veya vücuttaki).", "examples": "1. \"This wine comes from the Bordeaux region.\" (Bu şarap Bordeaux bölgesinden geliyor.)\n2. \"He has pain in the lower back region.\" (Bel bölgesinde ağrısı var.)", "rank": 527}, {"word": "parent", "type": "İsim", "meaning": "1. Ebeveyn, anne veya baba.", "full_meaning": "1. Ebeveyn, anne veya baba.\n2. Köken, kaynak, ana kuruluş.", "guide": "Bir canlının biyolojik veya yasal anne ya da babası. Kurumlar için de \"ana şirket\" anlamında kullanılır.", "examples": "1. My parents live in Istanbul. (Ailem/ebeveynlerim İstanbul'da yaşıyor.)\n2. The parent company is based in Germany. (Ana şirketin merkezi Almanya'da.)", "rank": 528}, {"word": "wait", "type": "Fiil, İsim", "meaning": "1. Beklemek (fiil)", "full_meaning": "1. Beklemek (fiil)\n2. Bekleme (isim)\n3. Servis yapmak, beklemek (wait on/at) (fiil)", "guide": "Bir şeyin olmasını veya birinin gelmesini zaman geçirerek beklemek. Bir restoranda müşterilere hizmet etmek için de kullanılır (wait on tables).", "examples": "1. Please wait here for a moment. (Lütfen bir dakika burada bekleyin.)\n2. We had a long wait at the doctor's office. (Doktor ofisinde uzun bir bekleyişimiz oldu.)\n3. She waits tables at a local restaurant. (Yerel bir restoranda garsonluk yapıyor.)", "rank": 529}, {"word": "profession", "type": "İsim", "meaning": "1. Meslek.", "full_meaning": "1. Meslek.\n2. (Belirli bir meslek) camiası.\n3. Açıklama, bildiri (eski).", "guide": "Özel eğitim ve nitelik gerektiren iş (doktor, avukat, mühendis vb.). O meslekten olan herkes.", "examples": "1. What profession are you in? (Hangi meslektesiniz?)\n2. The teaching profession is underpaid. (Öğretmenlik mesleği yetersiz maaş alıyor.)\n3. A profession of faith. (Bir inanç bildirisi.)", "rank": 530}, {"word": "responsible", "type": "Sıfat", "meaning": "1. Sorumlu, mesul.", "full_meaning": "1. Sorumlu, mesul.\n2. Güvenilir, sorumluluk sahibi.\n3. (Olumsuz olay) Sebep olan.", "guide": "Bir şeyden veya birine karşı hesap vermekle yükümlü olan veya güvenilebilir.", "examples": "1. \"Who is responsible for this department?\" (Bu bölümden kim sorumlu?)\n2. \"She is a very responsible student.\" (O çok sorumluluk sahibi bir öğrenci.)\n3. \"The storm was responsible for the damage.\" (Hasarın sebebi fırtınaydı.)", "rank": 531}, {"word": "sense", "type": "İsim / Fiil", "meaning": "1. (İ) Duyu (görme, işitme vb.).", "full_meaning": "1. (İ) Duyu (görme, işitme vb.).\n2. (İ) Anlam, mana.\n3. (F) Hissetmek, sezmek.", "guide": "Beş duyudan biri veya bir şeyin anlamı/mantığı. Fiil olarak sezgisel olarak hissetmek.", "examples": "1. Dogs have a keen sense of smell. (Köpeklerin keskin bir koku duyusu vardır.)\n2. This word has two senses. (Bu kelimenin iki anlamı var.)\n3. I could sense her anxiety. (Onun endişesini hissedebiliyordum.)", "rank": 532}, {"word": "situation", "type": "İsim", "meaning": "1. Durum, vaziyet.", "full_meaning": "1. Durum, vaziyet.\n2. Konum, yer.\n3. İş, pozisyon.", "guide": "Belirli bir zamandaki koşulların veya olayların toplamı.", "examples": "1. The economic situation is bad. (Ekonomik durum kötü.)\n2. The house has a beautiful situation. (Evin güzel bir konumu var.)\n3. She found a new situation as a manager. (Müdür olarak yeni bir iş/pozisyon buldu.)", "rank": 533}, {"word": "letter", "type": "İsim", "meaning": "1. Mektup.", "full_meaning": "1. Mektup.\n2. Harf.\n3. (Tam anlamıyla) Lafzı, harfi harfine.", "guide": "Yazılı mesaj taşıyan kağıt. Bir dilin alfabesindeki sembollerden her biri.", "examples": "1. I received a letter from my friend abroad. (Yurtdışındaki arkadaşımdan bir mektup aldım.)\n2. 'A' is the first letter of the alphabet. ('A' alfabenin ilk harfidir.)\n3. He followed the instructions to the letter. (Talimatları harfi harfine uyguladı.)", "rank": 534}, {"word": "achieve", "type": "Fiil", "meaning": "1. Başarmak, elde etmek.", "full_meaning": "1. Başarmak, elde etmek.\n2. (Hedefe) ulaşmak.\n3. (Sonuç) almak.", "guide": "Çaba, beceri veya azim sonucu bir hedefe ulaşmak veya bir şeyi elde etmek.", "examples": "1. She achieved all her career goals. (Tüm kariyer hedeflerini başardı.)\n2. We have achieved a great deal this year. (Bu yıl çok şey başardık.)\n3. It's hard to achieve a work-life balance. (İş-yaşam dengesini sağlamak zordur.)", "rank": 535}, {"word": "measure", "type": "Fiil / İsim", "meaning": "1. Ölçmek.", "full_meaning": "1. Ölçmek.\n2. (Bir şeyin) boyutunu/hacmini belirlemek.\n3. Önlem, tedbir.", "guide": "Bir şeyin büyüklüğünü, miktarını veya derecesini belirleme eylemi veya alınan bir tedbirdir.", "examples": "1. Can you measure the length of this table? (Bu masanın uzunluğunu ölçebilir misin?)\n2. Success isn't measured by money alone. (Başarı sadece parayla ölçülmez.)\n3. We must take measures to reduce costs. (Maliyetleri düşürmek için önlemler almalıyız.)", "rank": 536}, {"word": "soon", "type": "Zarf", "meaning": "1. Yakında, çok geçmeden.", "full_meaning": "1. Yakında, çok geçmeden.\n2. Erken, vaktinden önce.\n3. İster istemez.", "guide": "Kısa bir süre içinde, vakit geçmeden.", "examples": "1. I'll be back soon. (Yakında döneceğim.)\n2. He arrived sooner than expected. (Beklenenden daha erken geldi.)\n3. Sooner or later, you'll understand. (Er ya da geç anlayacaksın.)", "rank": 537}, {"word": "single", "type": "Sıfat / İsim", "meaning": "1. (S) Tek, bir tane.", "full_meaning": "1. (S) Tek, bir tane.\n2. (S) Bekar.\n3. (İ) Tek, bilet/müzik parçası.", "guide": "Bir tane olan veya evli olmayan. İsim olarak tek kişilik şey veya müzik single'ı.", "examples": "1. A single bed. (Bir tek kişilik yatak.)\n2. Are you single or married? (Bekar mısın yoksa evli mi?)\n3. The band released a new single. (Grup yeni bir single çıkardı.)", "rank": 538}, {"word": "evidence", "type": "İsim", "meaning": "1. Kanıt, delil.", "full_meaning": "1. Kanıt, delil.\n2. İz, belirti.\n3. (court) Tanık ifadesi.", "guide": "Bir şeyin doğru olduğunu göstermek veya kanıtlamak için kullanılan bilgi veya nesne. Bir şeyin olduğuna dair işaret.", "examples": "1. The police found evidence at the scene. (Polis olay yerinde kanıt buldu.)\n2. There was no evidence of a struggle. (Bir kavganın izi yoktu.)", "rank": 539}, {"word": "raise", "type": "Fiil", "meaning": "1. Kaldırmak, yükseltmek.", "full_meaning": "1. Kaldırmak, yükseltmek.\n2. Artırmak.\n3. Yetiştirmek, büyütmek (çocuk/hayvan/bitki).", "guide": "Bir şeyi fiziksel olarak daha yükseğe çıkarmak veya bir miktarı, seviyeyi artırmak anlamına gelir.", "examples": "1. \"Raise your hand if you know the answer.\" (Cevabı biliyorsanız elinizi kaldırın.)\n2. \"They raised the price of bread.\" (Ekmek fiyatını artırdılar.)\n3. \"They raised three children in this house.\" (Bu evde üç çocuk yetiştirdiler.)", "rank": 540}, {"word": "true", "type": "Sıfat", "meaning": "1. Doğru, gerçek.", "full_meaning": "1. Doğru, gerçek.\n2. Sadık, bağlı.\n3. Tam, hakiki.", "guide": "Gerçek olan, doğru olan veya sadık olan.", "examples": "1. Is it true that you're moving? (Taşınıyormuşsun, bu doğru mu?)\n2. A true friend stands by you. (Gerçek bir arkadaş senin yanında durur.)\n3. He is the true heir to the throne. (O, tahtın gerçek varisidir.)", "rank": 541}, {"word": "prepare", "type": "Fiil", "meaning": "1. Hazırlamak.", "full_meaning": "1. Hazırlamak.\n2. Hazırlanmak.\n3. Psikolojik olarak hazırlamak.", "guide": "Bir şeyi kullanıma veya gerçekleşmeye hazır hale getirmek. Kendini bir şeye hazır hissetmek.", "examples": "1. She prepared a delicious meal. (Lezzetli bir yemek hazırladı.)\n2. We need to prepare for the worst. (En kötüsüne hazırlanmamız gerekiyor.)\n3. The news prepared us for the inevitable. (Haber bizi kaçınılmaz olana hazırladı.)", "rank": 542}, {"word": "boy", "type": "İsim", "meaning": "1. Oğlan, erkek çocuk.", "full_meaning": "1. Oğlan, erkek çocuk.\n2. Delikanlı, genç adam.\n3. (Ünlem) Vay canına!", "guide": "Genç erkek. Şaşkınlık ifadesi olarak da kullanılır.", "examples": "1. They have two boys and a girl. (İki oğulları ve bir kızları var.)\n2. He's a local boy. (O buradan bir çocuk.)\n3. Oh boy, that's amazing! (Vay canına, bu harika!)", "rank": 543}, {"word": "normal", "type": "Sıfat / İsim", "meaning": "1. Normal, olağan.", "full_meaning": "1. Normal, olağan.\n2. Standart, ortalama.\n3. Dik (geometri).", "guide": "Alışılagelmiş, beklenen veya ortalama durumda olan.", "examples": "1. It's normal to feel nervous. (Gergin hissetmek normaldir.)\n2. Her temperature is back to normal. (Ateşi normale döndü.)\n3. A line normal to a surface. (Bir yüzeye dik bir çizgi.)", "rank": 544}, {"word": "east", "type": "İsim/Sıfat/Zarf", "meaning": "1. Doğu (yön) (isim).", "full_meaning": "1. Doğu (yön) (isim).\n2. Doğudaki (sıfat).\n3. Doğuya doğru (zarf).", "guide": "Güneşin doğduğu yön. Coğrafi olarak doğuda bulunan. Doğu yönüne doğru.", "examples": "1. The sun rises in the east. (Güneş doğudan doğar.)\n2. the east coast of America (Amerika'nın doğu sahili)\n3. We drove east for hours. (Saatlerce doğuya doğru sürdük.)", "rank": 545}, {"word": "morning", "type": "İsim", "meaning": "1. Sabah.", "full_meaning": "1. Sabah.\n2. Sabah vakti, günün erken saatleri.\n3. (the morning) sabahleyin.", "guide": "Günün gece yarısından öğlene kadar olan ilk bölümü.", "examples": "1. I go for a run every morning. (Her sabah koşuya giderim.)\n2. See you tomorrow morning! (Yarın sabah görüşürüz!)", "rank": 546}, {"word": "food", "type": "İsim", "meaning": "1. Yiyecek, gıda.", "full_meaning": "1. Yiyecek, gıda.\n2. Besin, gıda maddesi.\n3. (for thought) Düşündürücü şey.", "guide": "Canlıların büyümesi ve enerji için yediği şey.", "examples": "1. Do you like Italian food? (İtalyan yemeklerini sever misin?)\n2. healthy food (sağlıklı gıda)", "rank": 547}, {"word": "lord", "type": "İsim", "meaning": "1. Lord, efendi (soyluluk).", "full_meaning": "1. Lord, efendi (soyluluk).\n2. Rab, Tanrı (dini).\n3. (Ünlem) Aman Tanrım!", "guide": "Bir soyluluk unvanı. Hristiyanlıkta Tanrı veya İsa için kullanılır. Şaşkınlık ifadesi.", "examples": "1. Lord Byron was a famous poet. (Lord Byron ünlü bir şairdi.)\n2 \"Praise the Lord,\" she said. (\"Rabbe şükür,\" dedi.)\n3. Good Lord, look at the time! (Aman Tanrım, saate bak!)", "rank": 548}, {"word": "game", "type": "İsim, Sıfat", "meaning": "1. Oyun, eğlence.", "full_meaning": "1. Oyun, eğlence.\n2. (Av) Av hayvanı, av.\n3. (Argo) İş, plan, olup biten; cesaret.", "guide": "Temel anlamı kuralları olan eğlence veya yarışma faaliyetidir. Ayrıca, avlanan hayvan veya \"işler, durum\" anlamında metaforik olarak kullanılır. \"Sıfat\" olarak \"hazır, istekli\" anlamına gelir.", "examples": "1. Let's play a game of cards tonight. (Bu gece bir oyun kart oynayalım.)\n2. Hunting game is strictly regulated. (Av hayvanı avlamak sıkı bir şekilde düzenlenmiştir.)\n3. (Argo) So, what's the game? You trying to trick me? (Ee, olay/dümen ne? Beni kandırmaya mı çalışıyorsun?)", "rank": 549}, {"word": "air", "type": "İsim/Fiil", "meaning": "1. Hava (isim).", "full_meaning": "1. Hava (isim).\n2. Havalandırmak, yayınlamak (fiil).\n3. Görünüm, hava, tavır (isim).", "guide": "Soluduğumuz gaz karışımı. Fiil olarak bir fikri dile getirmek veya bir programı yayınlamak anlamına gelir.", "examples": "1. The air is fresh in the mountains. (Dağlarda hava temizdir.)\n2. She aired her grievances. (Şikayetlerini dile getirdi.)\n3. He has an air of confidence. (Kendinden emin bir havası var.)", "rank": 550}, {"word": "material", "type": "İsim / Sıfat", "meaning": "1. Malzeme, madde.", "full_meaning": "1. Malzeme, madde.\n2. Kumaş, tekstil.\n3. Maddi, fiziksel; önemli.", "guide": "Bir şeyin yapıldığı fiziksel madde veya kumaş. Sıfat olarak fiziksel dünyaya ait veya önemli anlamındadır.", "examples": "1. Wood is a natural building material. (Ahşap doğal bir yapı malzemesidir.)\n2. What material is this dress made of? (Bu elbise hangi kumaştan yapılmış?)\n3. He provided material evidence. (Maddi kanıt sağladı.)", "rank": 551}, {"word": "sign", "type": "İsim / Fiil", "meaning": "1. (İ) İşaret, tabela.", "full_meaning": "1. (İ) İşaret, tabela.\n2. (F) İmzalamak.\n3. (İ) Belirti, alamet.", "guide": "Bilgi veren yazı/resim veya bir şeyin varlığını gösteren belirti. Fiil olarak imza atmak.", "examples": "1. Follow the signs to the exit. (Çıkış için tabelaları takip et.)\n2. Please sign here. (Lütfen burayı imzalayın.)\n3. Dark clouds are a sign of rain. (Kara bulutlar yağmur belirtisidir.)", "rank": 552}, {"word": "role", "type": "İsim", "meaning": "1. Rol.", "full_meaning": "1. Rol.\n2. Görev, fonksiyon.\n3. (Tiyatro) Rol.", "guide": "Bir kişinin veya şeyin bir sistem, organizasyon veya oyun içindeki işlevi.", "examples": "1. \"She played the role of Juliet.\" (Juliet rolünü oynadı.)\n2. \"What is your role in the company?\" (Şirketteki göreviniz nedir?)", "rank": 553}, {"word": "event", "type": "İsim", "meaning": "1. Olay, hadise.", "full_meaning": "1. Olay, hadise.\n2. Etkinlik, organizasyon.\n3. (Spor) Yarışma, müsabaka.", "guide": "Önemli veya ilginç bir şeyin olması. Planlanmış bir toplantı veya eğlence. Bir spor müsabakasının bir bölümü.", "examples": "1. The election was the main event of the year. (Seçim yılın başlıca olayıydı.)\n2. a charity event (bir hayır etkinliği)\n3. the 100-meter event (100 metre yarışı)", "rank": 554}, {"word": "improve", "type": "Fiil", "meaning": "1. İyileştirmek, geliştirmek.", "full_meaning": "1. İyileştirmek, geliştirmek.\n2. Daha iyi hale gelmek.\n3. (Sağlık) Düzelmek, iyileşmek.", "guide": "Bir şeyin kalitesini veya durumunu artırmak. Kalitesi veya durumu artmak.", "examples": "1. We need to improve our customer service. (Müşteri hizmetimizi iyileştirmeliyiz.)\n2. His English has improved a lot. (İngilizcesi çok gelişti.)\n3. The patient's condition is improving. (Hastanın durumu düzeliyor.)", "rank": 555}, {"word": "president", "type": "İsim", "meaning": "1. Cumhurbaşkanı, başkan.", "full_meaning": "1. Cumhurbaşkanı, başkan.\n2. (Kurum) başkanı, genel müdür.\n3. (Üniversite) rektör.", "guide": "Bir cumhuriyetin en yüksek yöneticisi. Bir kuruluşun veya üniversitenin başındaki kişi.", "examples": "1. The president gave a speech to the nation. (Cumhurbaşkanı ulusa bir konuşma yaptı.)\n2. She is the president of the bank. (O, bankanın başkanıdır.)\n3. He met with the university president. (Üniversite rektörüyle görüştü.)", "rank": 556}, {"word": "telephone", "type": "İsim / Fiil", "meaning": "İsim: 1. Telefon.", "full_meaning": "İsim: 1. Telefon.\nFiil: 2. Telefon etmek, aramak.", "guide": "Resmi veya eski moda bir tabirdir. Günlük dilde genellikle 'phone' kısaltması kullanılır.", "examples": "1. The telephone rang in the middle of the night. (Telefon gecenin bir yarısı çaldı.)\n2. Please telephone the office to confirm. (Lütfen onaylamak için ofisi telefonla arayın.)\n3. He answered the telephone. (Telefona baktı/cevap verdi.)", "rank": 557}, {"word": "club", "type": "İsim/Fiil", "meaning": "1. Kulüp, dernek (isim).", "full_meaning": "1. Kulüp, dernek (isim).\n2. Sopa, gürz (isim).\n3. (Gece) kulübü (isim).", "guide": "Ortak ilgi alanları olan insanların topluluğu veya vurmak için kullanılan sopa.", "examples": "1. He's a member of a golf club. (Bir golf kulübünün üyesidir.)\n2. a night club (bir gece kulübü)\n3. They were clubbed to death. (Sopalarla dövülerek öldürüldüler.)", "rank": 558}, {"word": "shop", "type": "İsim / Fiil", "meaning": "1. (İ) Dükkan, mağaza.", "full_meaning": "1. (İ) Dükkan, mağaza.\n2. (F) Alışveriş yapmak.\n3. (İ) Atölye, tamirhane.", "guide": "Malların satıldığı küçük işletme. Fiil olarak alışveriş yapmak.", "examples": "1. There's a bakery shop on the corner. (Köşede bir fırın dükkanı var.)\n2. I need to shop for groceries. (Market alışverişi yapmam gerekiyor.)\n3. He works in a repair shop. (Bir tamir atölyesinde çalışıyor.)", "rank": 559}, {"word": "supply", "type": "Fiil / İsim", "meaning": "1. (F) Sağlamak, temin etmek.", "full_meaning": "1. (F) Sağlamak, temin etmek.\n2. (İ) Tedarik, arz.\n3. (İ) Stok, malzeme.", "guide": "İhtiyaç duyulan bir şeyi sağlamak. İsim olarak sağlanan şey veya miktarı.", "examples": "1. The company supplies us with paper. (Şirket bize kağıt sağlıyor.)\n2. The supply of water was cut off. (Su tedariği kesildi.)\n3. Medical supplies. (Tıbbi malzemeler.)", "rank": 560}, {"word": "shall", "type": "Yardımcı Fiil", "meaning": "1. (-ecek, -acak) (Gelecek zaman, resmi).", "full_meaning": "1. (-ecek, -acak) (Gelecek zaman, resmi).\n2. (Teklif) ...mı, ...lim mi?\n3. (Zorunluluk) ...meli, ...malı (resmi).", "guide": "Gelecek zaman veya teklif/öneri ifade etmek için kullanılan yardımcı fiil. Giderek daha az kullanılmaktadır, daha çok resmi veya yasal dilde görülür.", "examples": "1. I shall return tomorrow. (Yarın döneceğim.)\n2. Shall we go? (Gidelim mi?)\n3. The tenant shall pay the rent on time. (Kiracı kirasını zamanında ödemelidir.)", "rank": 561}, {"word": "direct", "type": "Sıfat/Fiil", "meaning": "1. Doğrudan, direkt (sıfat).", "full_meaning": "1. Doğrudan, direkt (sıfat).\n2. Yönetmek, idare etmek (fiil).\n3. Yol göstermek, tarif etmek (fiil).", "guide": "Arada başka bir şey olmadan, düz bir çizgide veya doğrudan ilişkili. Bir filmi, oyunu veya çalışanları yönetmek.", "examples": "1. This is a direct flight to New York. (Bu New York'a doğrudan uçuş.)\n2. He directed many famous movies. (Birçok ünlü filmin yönetmenliğini yaptı.)\n3. Can you direct me to the station? (Beni istasyona yönlendirebilir misiniz?)", "rank": 562}, {"word": "low", "type": "Sıfat / Zarf / İsim", "meaning": "1. Alçak, düşük.", "full_meaning": "1. Alçak, düşük.\n2. Düşük (fiyat/ses).\n3. Zayıf, moralsiz.\n4. (Meteoroloji) Alçak basınç alanı.", "guide": "Yüksek olmayan, zemine yakın. Miktar, derece veya şiddet olarak az olan.", "examples": "1. The chair is too low for the table. (Sandalye masa için çok alçak.)\n2. They sell fruits at low prices. (Meyveleri düşük fiyata satıyorlar.)\n3. He's been feeling low recently. (Son zamanlarda kendini moralsiz hissediyor.)\n4. A low is moving in from the west. (Batıdan bir alçak basınç alanı geliyor.)", "rank": 563}, {"word": "list", "type": "İsim / Fiil", "meaning": "1. Liste.", "full_meaning": "1. Liste.\n2. Listeye yazmak, kaydetmek.\n3. (Gemi) Yan yatmak, yana yatmak.", "guide": "Birbiri ardına yazılmış madde veya isimler dizisi. Bir şeyi listeye eklemek.", "examples": "1. Make a shopping list before you go to the supermarket. (Süpermarkete gitmeden önce bir alışveriş listesi yapın.)\n2. My name isn't listed on the door. (İsmim kapıda yazmıyor.)\n3. The ship listed to one side after the collision. (Gemi çarpışmadan sonra bir yana yattı.)", "rank": 564}, {"word": "award", "type": "İsim/Fiil", "meaning": "1. Ödül (isim).", "full_meaning": "1. Ödül (isim).\n2. Ödül vermek, takdim etmek (fiil).\n3. (Mahkeme) vermek, hükmetmek (fiil).", "guide": "Bir başarı veya kalite için verilen maddi/manevi ödül veya bu ödülü verme eylemi.", "examples": "1. She won an award for best actress. (En iyi kadın oyuncu ödülünü kazandı.)\n2. The jury awarded him first prize. (Jüri ona birincilik ödülünü verdi.)\n3. The court awarded damages to the victim. (Mahkeme, mağdura tazminat ödenmesine hükmetti.)", "rank": 565}, {"word": "music", "type": "İsim", "meaning": "1. Müzik.", "full_meaning": "1. Müzik.\n2. Nota, müzik eseri.\n3. Hoş ses, melodi.", "guide": "Seslerin ritim, melodi ve armoni içinde düzenlenmesiyle oluşan sanat dalı.", "examples": "1. What kind of music do you like? (Ne tür müzik seversin?)\n2. She composed the music for the film. (Filmin müziğini besteledi.)\n3. The music of the birds filled the air. (Kuşların müziği havayı doldurdu.)", "rank": 566}, {"word": "self", "type": "İsim", "meaning": "1. Benlik, kişilik.", "full_meaning": "1. Benlik, kişilik.\n2. Kendi, öz.\n3. Öz çıkar.", "guide": "Bir kişinin öz varlığı, bireyselliği veya karakteri.", "examples": "1. He showed his true self. (Gerçek benliğini gösterdi.)\n2. She did it by herself. (Onu kendi başına yaptı.)\n3. He always puts self first. (O her zaman kendi çıkarını öne koyar.)", "rank": 567}, {"word": "model", "type": "İsim / Fiil / Sıfat", "meaning": "1. Model, örnek.", "full_meaning": "1. Model, örnek.\n2. Manken.\n3. Maket, prototip.\n4. Örnek almak, modellemek.", "guide": "Taklit edilecek örnek, giysi gösteren kişi veya küçük ölçekli kopya. Fiil olarak örnek almak veya poz vermek.", "examples": "1. She is a model student. (O örnek bir öğrencidir.)\n2. He works as a fashion model. (Bir moda mankeni olarak çalışıyor.)\n3. I built a model airplane. (Bir maket uçak yaptım.)\n4. She models herself on her mother. (Kendisine annesini örnek alıyor.)", "rank": 568}, {"word": "contain", "type": "Fiil", "meaning": "1. İçermek, kapsamak.", "full_meaning": "1. İçermek, kapsamak.\n2. (Duyguyu) bastırmak, kontrol etmek.\n3. (Yayılmayı) durdurmak, sınırlamak.", "guide": "İçinde bulundurmak, bir şeyin parçası olarak sahip olmak.", "examples": "1. This box contains old photos. (Bu kutunun içinde eski fotoğraflar var.)\n2. I could hardly contain my excitement. (Heyecanımı zor kontrol edebiliyordum.)\n3. efforts to contain the disease (hastalığı kontrol altına alma çabaları)", "rank": 569}, {"word": "contract", "type": "İsim/Fiil", "meaning": "1. Sözleşme, kontrat (isim).", "full_meaning": "1. Sözleşme, kontrat (isim).\n2. Küçülmek, büzüşmek (fiil).\n3. (Hastalık) kapmak (fiil).", "guide": "Resmi, yazılı anlaşma. Fiil olarak küçülmek veya bir hastalığa yakalanmak.", "examples": "1. Sign the contract here. (Sözleşmeyi buraya imzalayın.)\n2. Metal contracts when it cools. (Metal soğuduğunda büzüşür.)\n3. He contracted malaria. (Sıtmaya yakalandı.)", "rank": 570}, {"word": "thus", "type": "Zarf", "meaning": "1. Böylece, bu şekilde.", "full_meaning": "1. Böylece, bu şekilde.\n2. Dolayısıyla, bu nedenle.", "guide": "Bir sonucu veya bir yöntemi belirtmek için kullanılır. 'Therefore' gibi, daha çok resmi ve yazılı dilde görülür.", "examples": "1. He studied hard and thus passed the exam. (Sıkı çalıştı ve böylece sınavı geçti.)\n2. The road was blocked; thus, we had to take a detour. (Yol kapalıydı; bu nedenle dolambaçlı bir yoldan gitmek zorunda kaldık.)\n3. Handle the equipment thus. (Ekipmanı bu şekilde kullanın.)", "rank": 571}, {"word": "step", "type": "İsim / Fiil", "meaning": "1. (İ) Adım.", "full_meaning": "1. (İ) Adım.\n2. (İ) Basamak.\n3. (F) Adım atmak, yürümek.", "guide": "Yürürken atılan hareket veya merdiven basamağı.", "examples": "1. Take a step forward. (Bir adım öne gel.)\n2. Be careful on the steps. (Basamaklarda dikkatli ol.)\n3. Don't step on the grass. (Çimlerin üzerine basma.)", "rank": 572}, {"word": "sex", "type": "İsim", "meaning": "1. Cinsiyet.", "full_meaning": "1. Cinsiyet.\n2. Cinsel ilişki.\n3. (Biyolojik) Cinsiyet.", "guide": "Bir organizmanın dişi veya erkek olarak sınıflandırılması veya cinsel aktivite.", "examples": "1. What is the baby's sex? (Bebeğin cinsiyeti nedir?)\n2. They were talking about sex. (Cinsellikten/Cinsel ilişkiden bahsediyorlardı.)\n3. The form asks for your name and sex. (Form adınızı ve cinsiyetinizi soruyor.)", "rank": 573}, {"word": "stay", "type": "Fiil / İsim", "meaning": "1. (F) Kalmak.", "full_meaning": "1. (F) Kalmak.\n2. (F) Konuk olmak.\n3. (İ) Kalış, konaklama.", "guide": "Bir yerde kalmak, ayrılmamak veya bir süre misafir olmak.", "examples": "1. Please stay here. (Lütfen burada kal.)\n2. I stayed at a hotel. (Bir otelde kaldım.)\n3. We enjoyed our stay in Paris. (Paris'teki kalışımızdan keyif aldık.)", "rank": 574}, {"word": "sale", "type": "İsim", "meaning": "1. Satış.", "full_meaning": "1. Satış.\n2. İndirim, satış kampanyası.\n3. Satış etkinliği (örn: garage sale).", "guide": "Bir şeyi para karşılığında elden çıkarma eylemi veya özellikle daha düşük fiyatlarla satış yapılan dönem.", "examples": "1. The sale of the house was finalized. (Evin satışı tamamlandı.)\n2. This shirt is on sale. (Bu gömlek indirimde.)\n3. Let's go to the book sale. (Kitap satışına/sergisine gidelim.)", "rank": 575}, {"word": "thank", "type": "Fiil", "meaning": "1. Teşekkür etmek.", "full_meaning": "1. Teşekkür etmek.", "guide": "Minnettarlık ifade etmek.", "examples": "1. I want to thank you for your help. (Yardımın için sana teşekkür etmek istiyorum.)\n2. She thanked him for the gift. (Hediye için ona teşekkür etti.)\n3. Don't thank me, it was nothing. (Bana teşekkür etme, önemsiz bir şeydi.)", "rank": 576}, {"word": "compare", "type": "Fiil", "meaning": "1. Karşılaştırmak, kıyaslamak.", "full_meaning": "1. Karşılaştırmak, kıyaslamak.\n2. (compare to) -e benzetmek.\n3. (compare with) -le kıyaslamak.", "guide": "İki veya daha fazla şey arasındaki benzerlik ve farklılıkları incelemek.", "examples": "1. Compare the prices before you buy. (Satın almadan önce fiyatları karşılaştır.)\n2. He compared her voice to an angel's. (Sesini bir meleğinkine benzetti.)\n3. Compared with last year, sales are up. (Geçen yılla karşılaştırıldığında satışlar arttı.)", "rank": 577}, {"word": "invest", "type": "Fiil", "meaning": "1. Yatırım yapmak, para yatırmak.", "full_meaning": "1. Yatırım yapmak, para yatırmak.\n2. (Zaman/emek) Harcamak, vermek.\n3. (Yetki) Vermek, donatmak.", "guide": "Para kazanma umuduyla parayı bir şeye (hisse, iş) koymak. Bir şeyi başarmak için zaman veya çaba harcamak. Birine resmi güç veya yetki vermek.", "examples": "1. It's a good idea to invest in real estate. (Gayrimenkule yatırım yapmak iyi bir fikirdir.)\n2. She invested a lot of time in learning the language. (Dili öğrenmeye çok zaman harcadı.)\n3. The new manager was invested with full authority. (Yeni müdüre tam yetki verildi.)", "rank": 578}, {"word": "arm", "type": "İsim/Fiil", "meaning": "1. Kol (isim).", "full_meaning": "1. Kol (isim).\n2. Silahlandırmak (fiil).\n3. Kolu (sandalye/koltuk).", "guide": "Vücudun omuzdan ele kadar olan bölümü. Fiil olarak silah vermek anlamına gelir.", "examples": "1. She broke her arm. (Kolunu kırdı.)\n2. The country was arming for war. (Ülke savaş için silahlanıyordu.)\n3. the arm of a chair (bir sandalyenin kolu)", "rank": 579}, {"word": "doubt", "type": "İsim/Fiil", "meaning": "1. Şüphe, kuşku (isim).", "full_meaning": "1. Şüphe, kuşku (isim).\n2. Şüphe etmek (fiil).\n3. (no doubt) Hiç şüphesiz.", "guide": "Bir şeyin doğruluğu veya gerçekliği konusunda emin olamama durumu. Bir şeyin doğru olduğuna inanmamak veya emin olamamak.", "examples": "1. I have my doubts about his story. (Onun hikayesi hakkında şüphelerim var.)\n2. I doubt he will come. (Geleceğinden şüpheliyim.)\n3. No doubt you're tired after the journey. (Yolculuktan sonra hiç şüphesiz yorgunsundur.)", "rank": 580}, {"word": "protect", "type": "Fiil", "meaning": "1. Korumak, muhafaza etmek.", "full_meaning": "1. Korumak, muhafaza etmek.\n2. Savunmak.\n3. (Ekonomi) yerli üretimi korumak.", "guide": "Bir şeyi veya birini zarar, tehlike veya kayba karşı savunmak.", "examples": "1. Wear sunscreen to protect your skin. (Cildinizi korumak için güneş kremi sürün.)\n2. The law protects consumers from fraud. (Kanun tüketicileri dolandırıcılığa karşı korur.)\n3. The government protects its farmers with subsidies. (Hükümet çiftçilerini sübvansiyonlarla koruyor.)", "rank": 581}, {"word": "benefit", "type": "İsim/Fiil", "meaning": "1. Yarar, fayda (isim).", "full_meaning": "1. Yarar, fayda (isim).\n2. Sosyal yardım (isim).\n3. Yararlanmak, faydalanmak (fiil).", "guide": "Olumlu, faydalı bir sonuç veya devlet yardımı.", "examples": "1. The benefits of exercise are well known. (Egzersizin yararları iyi bilinir.)\n2. He is on unemployment benefit. (O, işsizlik yardımı alıyor.)\n3. We all benefit from a good education. (Hepimiz iyi bir eğitimden yararlanırız.)", "rank": 582}, {"word": "judge", "type": "İsim / Fiil", "meaning": "(İsim): 1. Hakim, yargıç.", "full_meaning": "(İsim): 1. Hakim, yargıç.\n2. (Yarışma) Jüri üyesi.\n(Fiil): 3. Yargılamak, hüküm vermek.\n4. Tahmin etmek, değerlendirmek.", "guide": "(İsim) Mahkemede hüküm veren yetkili veya bir yarışmada değerlendirme yapan kişi. (Fiil) Bir kişi veya durum hakkında fikir oluşturmak veya karara varmak.", "examples": "1. The judge sentenced him to three years in prison. (Hakim onu üç yıl hapse mahkum etti.)\n2. He was a judge in the cooking competition. (Yemek yarışmasında jüri üyesiydi.)\n3. You shouldn't judge people by their appearance. (İnsanları dış görünüşlerine göre yargılamamalısın.)\n4. I judge it to be about 10 kilometers away. (Sanırım yaklaşık 10 kilometre uzakta.)", "rank": 583}, {"word": "amount", "type": "İsim/Fiil", "meaning": "1. Miktar, tutar (isim).", "full_meaning": "1. Miktar, tutar (isim).\n2. (amount to) -e varmak, -e eşdeğer olmak (fiil).\n3. Toplam.", "guide": "Ölçülebilir veya sayılabilir bir şeyin niceliği.", "examples": "1. A large amount of money was stolen. (Büyük miktarda para çalındı.)\n2. His debts amount to thousands of dollars. (Borçları binlerce dolara varıyor.)\n3. Pay the full amount by the end of the month. (Ay sonuna kadar tam tutarı ödeyin.)", "rank": 584}, {"word": "quick", "type": "Sıfat", "meaning": "1. Hızlı, çabuk.", "full_meaning": "1. Hızlı, çabuk.\n2. Kısa süren.\n3. Çabuk kavrayan, zeki.", "guide": "Bir işin yapılma süresinin kısa olduğunu veya birinin hızlı hareket ettiğini/öğrendiğini belirtir.", "examples": "1. \"He is a quick runner.\" (O hızlı bir koşucudur.)\n2. \"Let's take a quick break.\" (Kısa bir mola verelim.)\n3. \"She's very quick to learn new things.\" (Yeni şeyler öğrenmede çok çabuktur/zekidir.)", "rank": 585}, {"word": "method", "type": "İsim", "meaning": "1. Yöntem, metot, usul.", "full_meaning": "1. Yöntem, metot, usul.\n2. Sistem, düzen.\n3. (Bilimsel) teknik.", "guide": "Bir şeyi yapmak veya başarmak için izlenen belirli, sistematik yol.", "examples": "1. What's the best method for learning a language? (Bir dil öğrenmenin en iyi yöntemi nedir?)\n2. There's method in his madness. (Onun deliliğinde bir sistem var.)\n3. They use modern teaching methods. (Modern öğretim yöntemleri kullanıyorlar.)", "rank": 586}, {"word": "bad", "type": "Sıfat", "meaning": "1. Kötü, fena.", "full_meaning": "1. Kötü, fena.\n2. Bozuk, çürük.\n3. Şiddetli, ciddi.", "guide": "Kalitesiz, istenmeyen veya ahlaken yanlış olan.", "examples": "1. He's in a bad mood. (Kötü bir ruh hali içinde.)\n2. This milk has gone bad. (Bu süt bozulmuş.)\n3. a bad accident (ciddi bir kaza)", "rank": 587}, {"word": "please", "type": "Fiil/Ünlem", "meaning": "1. (Fiil) Memnun etmek, hoşnut etmek.", "full_meaning": "1. (Fiil) Memnun etmek, hoşnut etmek.\n2. (Ünlem) Lütfen.\n3. (Fiil) İstekte bulunmak.", "guide": "Fiil: Birini memnun etmek. Ünlem: Rica veya izin ifade eden nezaket sözcüğü.", "examples": "1. (Fiil) He's always trying to please everyone. (O her zaman herkesi memnun etmeye çalışır.)\n2. (Ünlem) Please sit down. (Lütfen oturun.)\n3. (Fiil) Do as you please. (İstediğini yap.)", "rank": 588}, {"word": "wish", "type": "Fiil, İsim", "meaning": "1. Dilemek, istemek (fiil)", "full_meaning": "1. Dilemek, istemek (fiil)\n2. Dilek, istek (isim)\n3. Dilek (kutlamalarda)", "guide": "Gerçekleşmesini istediğimiz, genellikle gerçekçi olmayan veya kontrolümüz dışındaki bir şey için duyulan güçlü arzu.", "examples": "1. I wish I could fly. (Keşke uçabilsem.)\n2. Make a wish before you blow out the candles. (Mumları üflemeden önce bir dilek tut.)\n3. Best wishes for your birthday! (Doğum günün için en iyi dileklerimle!)", "rank": 589}, {"word": "post", "type": "İsim/Fiil", "meaning": "1. (İsim, UK) Posta.", "full_meaning": "1. (İsim, UK) Posta.\n2. (İsim) Direk, dikme.\n3. (Fiil) Göndermek (mektup).\n4. (Fiil) (İnternete) göndermek, yayınlamak.", "guide": "UK'de mektup/mal dağıtım sistemi. Dikey destek direği. Fiil olarak mektup göndermek veya internet paylaşımı yapmak.", "examples": "1. (UK) I'll put the letter in the post. (Mektubu postaya atacağım.)\n2. The sign was nailed to a wooden post. (Tabela ahşap bir direğe çakılmıştı.)\n3. Don't forget to post the invitations. (Davetiyeleri postalayı unutma.)\n4. She posted a new photo on Instagram. (Instagram'da yeni bir fotoğraf paylaştı.)", "rank": 590}, {"word": "ago", "type": "Zarf", "meaning": "1. Önce (geçmiş zaman).", "full_meaning": "1. Önce (geçmiş zaman).", "guide": "Şu andan geriye doğru belirli bir süre önceyi ifade eder. Her zaman geçmiş zamanla kullanılır.", "examples": "1. I saw him two days ago. (Onu iki gün önce gördüm.)\n2. She left a long time ago. (O çok uzun zaman önce gitti.)\n3. How long ago did it happen? (Bu ne kadar zaman önce oldu?)", "rank": 591}, {"word": "fund", "type": "İsim/Fiil", "meaning": "1. Fon, kaynak (isim).", "full_meaning": "1. Fon, kaynak (isim).\n2. Finanse etmek (fiil).\n3. (çoğul) Nakit, para (isim).", "guide": "Belirli bir amaç için ayrılmış para. Para sağlamak. Birinin veya bir şirketin parası.", "examples": "1. a pension fund (bir emeklilik fonu)\n2. The project is funded by the government. (Proje hükümet tarafından finanse ediliyor.)\n3. He's short of funds at the moment. (Şu anda nakiti/nakit sıkıntısı var.)", "rank": 592}, {"word": "yesterday", "type": "Zarf, İsim", "meaning": "1. Dün (zarf)", "full_meaning": "1. Dün (zarf)\n2. Dün, yakın geçmiş (isim)", "guide": "Bugünden bir önceki gün. Mecazi olarak, çok yakın geçmiş için kullanılır.", "examples": "1. I saw her yesterday at the store. (Onu dün mağazada gördüm.)\n2. Yesterday was Monday. (Dün Pazartesi'ydi.)\n3. That feels like it happened only yesterday. (Bu dün gibi hissediliyor.)", "rank": 593}, {"word": "board", "type": "İsim/Fiil", "meaning": "1. Tahta, pano (isim).", "full_meaning": "1. Tahta, pano (isim).\n2. (Uçak/gemi) binmek (fiil).\n3. Kurul, yönetim kurulu (isim).", "guide": "Düz, sert yüzey. Toplu taşıma aracına binmek anlamında fiil olarak kullanılır.", "examples": "1. Write your name on the board. (Adınızı tahtaya yazın.)\n2. We boarded the plane at 10 AM. (Uçağa saat 10'da bindik.)\n3. the board of directors (yönetim kurulu)", "rank": 594}, {"word": "window", "type": "İsim", "meaning": "1. Pencere", "full_meaning": "1. Pencere\n2. Pencere (zaman/fırsat)\n3. Pencere (bilgisayar)", "guide": "Duvar açıklığı, genellikle camlı. Mecazi olarak, kısa bir süre veya fırsat anlamına gelir. Bilgisayar ekranındaki bağımsız alanlara da denir.", "examples": "1. Please close the window. (Lütfen pencereyi kapatın.)\n2. We have a small window of opportunity. (Küçük bir fırsat penceremiz var.)\n3. Open a new browser window. (Yeni bir tarayıcı penceresi aç.)", "rank": 595}, {"word": "wonder", "type": "Fiil, İsim", "meaning": "1. Merak etmek (fiil)", "full_meaning": "1. Merak etmek (fiil)\n2. Harika, mucize (isim)\n3. Şaşırmak (fiil)", "guide": "Bir şey hakkında düşünmek, merak duymak. Aynı zamanda olağanüstü güzel veya etkileyici bir şey anlamına gelir.", "examples": "1. I wonder what time it is. (Saatin kaç olduğunu merak ediyorum.)\n2. The Grand Canyon is a natural wonder. (Büyük Kanyon doğal bir harikadır.)\n3. It's no wonder you're tired after all that work. (Tüm o işten sonra yorgun olman şaşılacak bir şey değil.)", "rank": 596}, {"word": "private", "type": "Sıfat", "meaning": "1. Özel, kişisel.", "full_meaning": "1. Özel, kişisel.\n2. Gizli, kapalı.\n3. Özel sektöre ait, devlete ait olmayan.", "guide": "Herkese açık olmayan, sadece belirli kişilerle ilgili. Kişisel veya gizli.", "examples": "1. That's my private business. (O benim özel işim.)\n2. The meeting was held in private. (Toplantı gizli olarak yapıldı.)\n3. He goes to a private school. (Özel bir okula gidiyor.)", "rank": 597}, {"word": "quality", "type": "İsim", "meaning": "1. Kalite, nitelik.", "full_meaning": "1. Kalite, nitelik.\n2. Özellik, vasıf.\n3. Üstün nitelik, iyi vasıf.", "guide": "Bir şeyin ne kadar iyi veya kötü olduğu derecesini (kalite) veya onu tanımlayan temel özellikleri ifade eder.", "examples": "1. \"The quality of the sound is excellent.\" (Sesin kalitesi mükemmel.)\n2. \"She has many positive qualities like honesty and kindness.\" (Dürüstlük ve nezaket gibi birçok olumlu özelliği var.)\n3. \"We aim for quality, not just quantity.\" (Sadece miktar değil, kaliteyi hedefliyoruz.)", "rank": 598}, {"word": "fair", "type": "Sıfat/İsim", "meaning": "1. Adil, hakkaniyetli (sıfat).", "full_meaning": "1. Adil, hakkaniyetli (sıfat).\n2. (Saç/ten) Açık renk, sarışın (sıfat).\n3. Fuarl, panayır (isim).", "guide": "Tarafsız ve doğru, herkese eşit davranan. Açık renkli (saç/cilt). Eğlence, oyun ve satış için düzenlenen açık hava etkinliği.", "examples": "1. a fair decision (adil bir karar)\n2. She has fair hair and blue eyes. (Açık renk saçları ve mavi gözleri var.)\n3. a book fair (bir kitap fuarı)", "rank": 599}, {"word": "university", "type": "İsim", "meaning": "1. Üniversite", "full_meaning": "1. Üniversite", "guide": "Lisans ve lisansüstü dereceler (örneğin, BA, MA, PhD) veren yüksek öğretim ve araştırma kurumudur. Kolejden (college) genellikle daha büyük ve daha kapsamlıdır.", "examples": "1. She studied economics at university. (Üniversitede ekonomi okudu.)\n2. He is a professor at the state university. (Devlet üniversitesinde profesördür.)\n3. They are applying to universities abroad. (Yurtdışındaki üniversitelere başvuruyorlar.)", "rank": 600}, {"word": "kill", "type": "Fiil", "meaning": "1. Öldürmek.", "full_meaning": "1. Öldürmek.\n2. (Zaman/Zevk) Bitirmek, yok etmek.\n3. (Ağrı) Dindirmek, kesmek.", "guide": "Bir canlının yaşamına son vermek. Mecazi olarak bir duyguyu, hissi veya zamanı yok etmek/geçirmek.", "examples": "1. The disease kills thousands every year. (Hastalık her yıl binlerce insanı öldürür.)\n2. We killed time by playing cards. (İskambil oynayarak zaman öldürdük.)\n3. This pill should kill the pain. (Bu hap ağrıyı kesmeli.)", "rank": 601}, {"word": "safe", "type": "Sıfat", "meaning": "1. Güvende, tehlikede olmayan.", "full_meaning": "1. Güvende, tehlikede olmayan.\n2. Emniyetli, risksiz.\n3. Sağ salim, zarar görmemiş.\nİsim olarak: Kasa.", "guide": "Bir kişi, eşya veya eylemin herhangi bir fiziksel, duygusal veya başka türlü bir zarar/tehlike riski taşımadığını ifade eder.", "examples": "1. Are the children safe? (Çocuklar güvende mi?)\n2. It's a safe neighborhood to walk at night. (Gece yürümek için güvenli bir mahalle.)\n3. The package arrived safe and sound. (Paket sağ salim ulaştı.)\n4. (İsim) He keeps his passport in the safe. (Pasaportunu kasada tutar.)", "rank": 602}, {"word": "pound", "type": "İsim/Fiil", "meaning": "1. (İsim) Sterlin (İngiliz para birimi).", "full_meaning": "1. (İsim) Sterlin (İngiliz para birimi).\n2. (İsim) Libre (ağırlık birimi, ~453 gr).\n3. (Fiil) Dövmek, sertçe vurmak.\n4. (Fiil) (Kalp) hızlı atmak.", "guide": "İngiliz para birimi. Ağırlık birimi. Fiil olarak tekrar tekrar ve güçlü şekilde vurmak.", "examples": "1. It costs fifty pounds. (Elli sterline mal oluyor.)\n2. I need to lose a few pounds. (Birkaç kilo vermem gerekiyor.)\n3. He pounded on the door. (Kapıyı yumrukladı.)\n4. My heart was pounding with excitement. (Kalbim heyecandan hızla atıyordu.)", "rank": 603}, {"word": "analyse", "type": "Fiil", "meaning": "1. Çözümlemek, analiz etmek.", "full_meaning": "1. Çözümlemek, analiz etmek.\n2. İncelemek, detaylıca düşünmek.\n3. Psikanaliz yapmak.", "guide": "Bir şeyi daha iyi anlamak için onu bileşenlerine ayırmak veya detaylıca incelemek.", "examples": "1. We need to analyse the data carefully. (Veriyi dikkatlice analiz etmemiz gerekiyor.)\n2. The doctor analysed the symptoms. (Doktor semptomları inceledi.)\n3. He spent hours analysing the game. (Oyunu analiz etmek için saatler harcadı.)", "rank": 604}, {"word": "obvious", "type": "Sıfat", "meaning": "1. Açık, bariz, besbelli.", "full_meaning": "1. Açık, bariz, besbelli.\n2. Anlaşılır, kolayca görülebilir.\n3. Düşüncesizce yapılan, aşikar.", "guide": "Kolayca görülebilen veya anlaşılabilen, gizli olmayan.", "examples": "1. It was obvious that he was lying. (Yalan söylediği çok açıktı.)\n2. There is no obvious solution. (Bariz bir çözüm yok.)", "rank": 605}, {"word": "fire", "type": "İsim/Fiil", "meaning": "1. Ateş, yangın (isim).", "full_meaning": "1. Ateş, yangın (isim).\n2. Ateş etmek (fiil).\n3. (İşten) Kovmak (fiil).", "guide": "Yanma sırasında çıkan ısı ve ışık. Bir silahtan mermi atmak. Birini işten çıkarmak.", "examples": "1. They sat around the fire. (Ateşin etrafında oturdular.)\n2. The soldier fired his gun. (Asker silahını ateşledi.)\n3. He was fired for being late. (Geç kaldığı için kovuldu.)", "rank": 606}, {"word": "former", "type": "Sıfat", "meaning": "1. Eski, önceki.", "full_meaning": "1. Eski, önceki.\n2. (the former) İlki (ikiden bahsederken).", "guide": "Geçmişte olan ama artık olmayan. İki şeyden ilk söyleneni ifade eder.", "examples": "1. the former president (eski başkan)\n2. We visited Paris and Rome. I preferred the former. (Paris ve Roma'yı ziyaret ettik. Ben ilkini (Paris'i) tercih ettim.)", "rank": 607}, {"word": "difference", "type": "İsim", "meaning": "1. Fark, farklılık.", "full_meaning": "1. Fark, farklılık.\n2. Anlaşmazlık, ihtilaf.\n3. (make a difference) Etkisi olmak, fark yaratmak.", "guide": "İki veya daha fazla şey arasındaki ayrım veya benzemezlik. Görüş ayrılığı. Önemli bir değişiklik veya etki yaratmak.", "examples": "1. What's the difference between these two models? (Bu iki model arasındaki fark nedir?)\n2. They settled their differences. (Anlaşmazlıklarını çözdüler.)\n3. Volunteering can make a real difference. (Gönüllü çalışmak gerçek bir fark yaratabilir.)", "rank": 608}, {"word": "previous", "type": "Sıfat", "meaning": "1. Önceki, evvelki.", "full_meaning": "1. Önceki, evvelki.\n2. Önceden olan.\n3. (Argo) Aceleci, atak.", "guide": "Şimdikinden hemen önce gelen veya daha önce olmuş.", "examples": "1. On the previous page, we discussed... (Önceki sayfada, ... tartıştık.)\n2. Do you have any previous experience? (Önceden herhangi bir deneyiminiz var mı?)\n3. You're a bit previous – the meeting hasn't even started! (Biraz acelecisin – toplantı daha başlamadı bile!)", "rank": 609}, {"word": "tradition", "type": "İsim", "meaning": "1. Gelenek, görenek.", "full_meaning": "1. Gelenek, göre
