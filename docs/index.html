bakayı kazanan kişi veya bir davanın destekçisi.",examples:"1. the world champion (dünya şampiyonu) 2. She is a champion of human rights. (O bir insan hakları savunucusudur.) 3. He champions environmental causes. (Çevresel nedenleri savunur.)"},{word:"chance",type:"İsim/Sıfat",meaning:"1. Şans, fırsat (isim). 2. Olasılık, ihtimal (isim). 3. Tesadüfi, rastlantısal (sıfat).",guide:"Olma ihtimali veya beklenmedik bir fırsat.",examples:"1. You should give him a chance. (Ona bir şans vermelisin.) 2. There's a chance of rain tomorrow. (Yarın yağmur ihtimali var.) 3. a chance meeting (tesadüfi bir karşılaşma)"},{word:"change",type:"Fiil/İsim",meaning:"1. Değiştirmek (fiil). 2. Bozdurmak (para) (fiil). 3. Değişiklik, bozuk para (isim).",guide:"Bir şeyi başka bir şeyle değiştirmek veya farklı hale getirmek. Para üstü anlamında da kullanılır.",examples:"1. I need to change my clothes. (Kıyafetlerimi değiştirmem gerekiyor.) 2. Can you change a €20 note? (20 euroluk banknotu bozabilir misiniz?) 3. There has been a change of plan. (Planda bir değişiklik oldu.)"},{word:"channel",type:"İsim/Fiil",meaning:"1. Kanal (TV) (isim). 2. Kanal, boğaz (coğrafi) (isim). 3. Yönlendirmek (fiil).",guide:"Televizyon yayını için frekans veya suyun aktığı yol. Duyguları yönlendirmek için de kullanılır.",examples:"1. Switch to another channel. (Başka bir kanala geç.) 2. the English Channel (Manş Denizi) 3. Channel your anger into something productive. (Öfkeni verimli bir şeye yönlendir.)"},{word:"chapter",type:"İsim",meaning:"1. Bölüm (kitap). 2. Dönem, evre (hayat). 3. Şube (organizasyon).",guide:"Kitabın ana bölümlerinden biri veya hayatın bir dönemi.",examples:"1. Read the first chapter for homework. (Ev ödevi için ilk bölümü okuyun.) 2. a new chapter in my life (hayatımda yeni bir sayfa) 3. the local chapter of the club (kulübün yerel şubesi)"},{word:"character",type:"İsim",meaning:"1. Karakter, kişilik. 2. Karakter (roman/oyun). 3. Harf, karakter (yazı).",guide:"Bir kişinin veya şeyin ayırt edici nitelikleri; kurgusal kişi; alfabe sembolü.",examples:"1. He has a strong character. (Güçlü bir karakteri var.) 2. Who is your favourite character in the book? (Kitaptaki en sevdiğin karakter kim?) 3. Chinese characters (Çin harfleri)"},{word:"characteristic",type:"İsim/Sıfat",meaning:"1. Özellik, nitelik (isim). 2. Ayırt edici, karakteristik (sıfat).",guide:"Bir kişiyi veya şeyi tanımlayan tipik bir özellik.",examples:"1. Kindness is one of her main characteristics. (Nazik olmak onun temel özelliklerinden biridir.) 2. the characteristic flavour of olives (zeytinin ayırt edici tadı)"},{word:"charge",type:"Fiil/İsim",meaning:"1. Ücret almak, fiyatlandırmak (fiil). 2. Suçlamak (fiil). 3. Sorumluluk, şarj (isim).",guide:"Para talep etmek veya resmi bir suç yöneltmek. Elektrik yükü veya sorumluluk anlamı da vardır.",examples:"1. How much do you charge for a haircut? (Bir saç kesimi için ne kadar ücret alıyorsunuz?) 2. He was charged with murder. (Cinayetle suçlandı.) 3. Who is in charge here? (Burada kim sorumlu?)"},{word:"charity",type:"İsim",meaning:"1. Hayır kurumu, yardım kuruluşu. 2. Hayır, sadaka. 3. Şefkat, merhamet.",guide:"İhtiyacı olanlara yardım etmek için kurulan organizasyon veya yardım etme eylemi.",examples:"1. She works for a cancer charity. (Bir kanser yardım kuruluşunda çalışıyor.) 2. They live on charity. (Hayırla geçiniyorlar.) 3. out of charity (merhametten)"},{word:"chart",type:"İsim/Fiil",meaning:"1. Tablo, grafik, çizelge (isim). 2. Harita (deniz) (isim). 3. Çizmek, planlamak (fiil).",guide:"Bilgiyi görsel olarak gösteren çizim veya müzik listesi.",examples:"1. a sales chart (bir satış grafiği) 2. The song reached number one in the charts. (Şarkı listelerde bir numaraya ulaştı.) 3. to chart a course (bir rota çizmek)"},{word:"chat",type:"Fiil/İsim",meaning:"1. Sohbet etmek (fiil). 2. Sohbet, muhabbet (isim). 3. (Online) yazışmak.",guide:"Gayriresmi, samimi bir şekilde konuşmak.",examples:"1. We chatted for hours. (Saatlerce sohbet ettik.) 2. I had a nice chat with my neighbour. (Komşumla güzel bir sohbet ettim.) 3. online chat (çevrimiçi sohbet)"},{word:"cheap",type:"Sıfat/Zarf",meaning:"1. Ucuz (sıfat). 2. Kalitesiz, adi (sıfat). 3. Ucuz bir şekilde (zarf).",guide:"Düşük fiyatlı. Kalitesiz veya değersiz olumsuz anlamda da kullanılır.",examples:"1. This restaurant is very cheap. (Bu restoran çok ucuz.) 2. It was a cheap trick. (Adi bir numaraydı.) 3. I bought it cheap. (Onu ucuza aldım.)"},{word:"cheat",type:"Fiil/İsim",meaning:"1. Hile yapmak, aldatmak (fiil). 2. Hilebaz, dolandırıcı (isim). 3. (Kopya çekmek).",guide:"Kuralları çiğneyerek veya birini kandırarak haksız avantaj elde etmek.",examples:"1. He cheated on the exam. (Sınavda kopya çekti.) 2. She cheated on her husband. (Kocasını aldattı.) 3. He's a cheat and a liar. (O bir hilebaz ve yalancı.)"},{word:"check",type:"Fiil/İsim",meaning:"1. Kontrol etmek (fiil). 2. Çek (bank) (isim). 3. (US) kareli desen (isim).",guide:"Doğrulamak veya incelemek. Amerikan İngilizcesinde banka çeki veya desen anlamı vardır.",examples:"1. Check the oil level. (Yağ seviyesini kontrol et.) 2. Can I pay by check? (Çekle ödeyebilir miyim?) 3. a check shirt (kareli bir gömlek)"},{word:"cheerful",type:"Sıfat",meaning:"1. Neşeli, şen. 2. Canlı, parlak (renk). 3. İç açıcı.",guide:"Mutlu ve pozitif bir ruh hali gösteren.",examples:"1. She has a cheerful disposition. (Neşeli bir mizacı var.) 2. a cheerful yellow kitchen (neşeli sarı bir mutfak)"},{word:"cheese",type:"İsim",meaning:"1. Peynir. 2. (big cheese) önemli kişi, patron. 3. (say cheese) gülümseyin (fotoğraf).",guide:"Sütten yapılan yiyecek. Argo deyimlerde kullanılır.",examples:"1. I'd like a sandwich with cheese. (Peynirli bir sandviç istiyorum.) 2. Say cheese! (Peynir deyin! - fotoğraf çekilirken)"},{word:"chef",type:"İsim",meaning:"1. Şef, aşçıbaşı. 2. Profesyonel aşçı.",guide:"Profesyonel olarak yemek pişiren, özellikle restoranlarda çalışan kişi.",examples:"1. The chef prepared a special meal. (Şef özel bir yemek hazırladı.) 2. a pastry chef (bir pasta şefi)"},{word:"chemical",type:"Sıfat/İsim",meaning:"1. Kimyasal (sıfat). 2. Kimyasal madde (isim). 3. (çoğul) kimyasallar.",guide:"Kimyayla veya kimyasal maddelerle ilgili olan.",examples:"1. a chemical reaction (bir kimyasal reaksiyon) 2. dangerous chemicals (tehlikeli kimyasallar)"},{word:"chemistry",type:"İsim",meaning:"1. Kimya (bilim). 2. Uyum, çekim (iki kişi arasında). 3. Kimyasal yapı.",guide:"Maddenin yapısını ve özelliklerini inceleyen bilim. İnsanlar arasındaki uyum için mecazi anlamda kullanılır.",examples:"1. I studied chemistry at school. (Okulda kimya okudum.) 2. There was an instant chemistry between them. (Aralarında anında bir uyum/çekim vardı.)"},{word:"chest",type:"İsim",meaning:"1. Göğüs. 2. Sandık, kutu. 3. (Chest of drawers) şifonyer, çekmeceli dolap.",guide:"Vücudun kaburga ile boyun arasındaki bölgesi veya saklama kabı.",examples:"1. He has a pain in his chest. (Göğsünde bir ağrı var.) 2. a treasure chest (bir hazine sandığı) 3. a medicine chest (bir ecza dolabı)"},{word:"chicken",type:"İsim/Sıfat/Fiil",meaning:"1. Tavuk (isim). 2. Tavuk eti (isim). 3. Korkak (sıfat).",guide:"Evcil kümes hayvanı. Argo olarak korkak anlamında sıfat olarak kullanılır.",examples:"1. The chickens are in the yard. (Tavuklar bahçede.) 2. Would you like chicken or beef? (Tavuk mu et mi istersiniz?) 3. Don't be a chicken! (Korkak olma!)"},{word:"chief",type:"İsim/Sıfat",meaning:"1. Şef, reis, baş (isim). 2. Baş, ana, esas (sıfat). 3. (Kabile) reisi.",guide:"Bir organizasyondaki en yüksek rütbeli kişi veya en önemli unsur.",examples:"1. She is the chief of police. (Polis şefidir.) 2. The chief reason for my decision is cost. (Kararımın başlıca nedeni maliyettir.) 3. a chief engineer (bir baş mühendis)"},{word:"child",type:"İsim",meaning:"1. Çocuk. 2. Evlat. 3. (child's play) çok kolay iş.",guide:"Genç insan, bebeklik ile ergenlik arasında.",examples:"1. They have three children. (Üç çocukları var.) 2. She is an only child. (O tek çocuktur.) 3. This job is child's play for her. (Bu iş onun için çocuk oyuncağı.)"},{word:"childhood",type:"İsim",meaning:"1. Çocukluk, çocukluk dönemi.",guide:"Bir kişinin çocuk olduğu yaşam dönemi.",examples:"1. He had a happy childhood. (Mutlu bir çocukluğu oldu.) 2. a childhood friend (bir çocukluk arkadaşı)"},{word:"chip",type:"İsim/Fiil",meaning:"1. Cips (patates) (isim). 2. Çentik, kırık parça (isim). 3. (Bilgisayar) çip, yonga (isim).",guide:"Kızartılmış ince patates dilimi veya bir şeyden kırılan küçük parça.",examples:"1. a bag of chips (bir paket cips) 2. This cup has a chip in it. (Bu bardakta bir çentik var.) 3. a silicon chip (bir silikon çip)"},{word:"chocolate",type:"İsim/Sıfat",meaning:"1. Çikolata (isim). 2. Çikolatalı (sıfat). 3. Çikolata rengi (sıfat).",guide:"Kakao çekirdeklerinden yapılan tatlı yiyecek veya içecek.",examples:"1. a bar of chocolate (bir paket çikolata) 2. chocolate cake (çikolatalı kek) 3. chocolate brown (çikolata kahvesi)"},{word:"choice",type:"İsim/Sıfat",meaning:"1. Seçim, seçenek (isim). 2. Seçme hakkı (isim). 3. Seçkin, kaliteli (sıfat).",guide:"Seçme eylemi veya seçilebilecek şeyler. Sıfat olarak en iyi kalitede.",examples:"1. You have a choice between tea and coffee. (Çay ve kahve arasında bir seçimin var.) 2. It's your choice. (Bu senin seçimin.) 3. choice cuts of meat (seçilmiş, kaliteli et parçaları)"},{word:"choose",type:"Fiil",meaning:"1. Seçmek, tercih etmek. 2. Karar vermek. 3. (can't choose but) -mekten başka çaresi olmamak.",guide:"Birkaç olasılık arasından birini seçmek.",examples:"1. Choose the color you like best. (En çok beğendiğin rengi seç.) 2. I chose to stay home. (Evde kalmayı tercih ettim.) 3. You were chosen for the team. (Takım için seçildin.)"},{word:"church",type:"İsim",meaning:"1. Kilise (bina). 2. Kilise (kurum). 3. Ayin.",guide:"Hıristiyanların ibadet ettiği bina veya Hıristiyanlık kurumu.",examples:"1. They got married in a church. (Bir kilisede evlendiler.) 2. Do you go to church? (Kiliseye gider misin?)"},{word:"cigarette",type:"İsim",meaning:"1. Sigara.",guide:"Tütünün ince kağıda sarılarak yapıldığı, içilen şey.",examples:"1. He lit a cigarette. (Bir sigara yaktı.) 2. No cigarette smoking allowed. (Sigara içmek yasaktır.)"},{word:"cinema",type:"İsim (UK)",meaning:"1. Sinema. 2. Sinema sanatı, film endüstrisi.",guide:'Filmlerin gösterildiği bina. Amerikan İngilizcesinde "movie theater".',examples:"1. Let's go to the cinema tonight. (Bu gece sinemaya gidelim.) 2. the history of cinema (sinema tarihi)"},{word:"circle",type:"İsim/Fiil",meaning:"1. Daire, çember (isim). 2. Çevre, grup (isim). 3. Daire çizmek, etrafında dönmek (fiil).",guide:"Her noktası merkezden eşit uzaklıkta olan şekil veya ortak ilgileri olan insan grubu.",examples:"1. Draw a circle. (Bir daire çizin.) 2. She has a wide circle of friends. (Geniş bir arkadaş çevresi var.) 3. The plane circled the airport before landing. (Uçak iniş yapmadan önce havaalanının etrafında döndü.)"},{word:"circumstance",type:"İsim",meaning:"1. Durum, koşul, hal. 2. (çoğul) koşullar, şartlar. 3. (under the circumstances) bu koşullar altında.",guide:"Belirli bir anda var olan koşullar, olaylar veya gerçekler.",examples:"1. It depends on the circumstances. (Duruma bağlı.) 2. Under no circumstances should you open the door. (Hiçbir koşulda kapıyı açmamalısın.) 3. a victim of circumstance (şanssızlık kurbanı)"},{word:"cite",type:"Fiil",meaning:"1. Alıntı yapmak, kaynak göstermek. 2. Anmak, örnek vermek. 3. (Mahkemeye) çağırmak.",guide:"Bir şeyi kanıt veya örnek olarak göstermek, referans vermek.",examples:"1. He cited several studies in his report. (Raporunda birkaç çalışmaya atıfta bulundu.) 2. She was cited for her bravery. (Cesareti nedeniyle anıldı.)"},{word:"citizen",type:"İsim",meaning:"1. Vatandaş, yurttaş. 2. Kent sakini. 3. (Senior citizen) yaşlı vatandaş.",guide:"Belirli bir ülkenin vatandaşı olan kişi veya bir şehrin sakinleri.",examples:"1. a British citizen (Bir Britanya vatandaşı) 2. the citizens of Rome (Roma'nın yurttaşları)"},{word:"city",type:"İsim",meaning:"1. Şehir, kent. 2. (the City) Londra'nın finans merkezi. 3. Şehir merkezi.",guide:"Büyük ve önemli bir kasabadan daha büyük yerleşim yeri.",examples:"1. New York is a big city. (New York büyük bir şehirdir.) 2. I work in the City. (Londra finans merkezinde çalışıyorum.)"},{word:"civil",type:"Sıfat",meaning:"1. Sivil, askeri olmayan. 2. Medeni, nazik. 3. (Hukuk) medeni.",guide:"Askeri veya dini olmayan; nezaket kurallarına uygun.",examples:"1. civil aviation (sivil havacılık) 2. Try to be civil to him. (Ona karşı medeni olmaya çalış.) 3. civil rights (medeni haklar)"},{word:"claim",type:"Fiil/İsim",meaning:"1. İddia etmek (fiil). 2. Talep etmek (fiil). 3. İddia, talep (isim).",guide:"Bir şeyin doğru olduğunu söylemek veya bir hak talep etmek.",examples:"1. He claims to be an expert. (Kendisinin bir uzman olduğunu iddia ediyor.) 2. You can claim your expenses back. (Masraflarınızı geri talep edebilirsiniz.) 3. false claims (yanlış iddialar)"},{word:"class",type:"İsim/Fiil",meaning:"1. Sınıf (okul) (isim). 2. Sınıf, tabaka (toplumsal) (isim). 3. Sınıflandırmak (fiil).",guide:"Öğrencilerin öğrenim gördüğü grup veya sosyal/ekonomik derece.",examples:"1. I have a math class at 10. (Saat 10'da bir matematik dersim var.) 2. working class (işçi sınıfı) 3. first-class service (birinci sınıf hizmet)"},{word:"classic",type:"Sıfat/İsim",meaning:"1. Klasik, ölümsüz (sıfat). 2. Tipik, mükemmel örnek (sıfat). 3. Klasik eser (isim).",guide:"Yüksek kalite ve kalıcı değeri olan; tipik bir örnek.",examples:"1. a classic novel (klasik bir roman) 2. That's a classic mistake. (Bu tipik bir hatadır.) 3. The car is a classic. (Araba bir klasiktir.)"},{word:"classical",type:"Sıfat",meaning:"1. Klasik (müzik/sanat). 2. Antik Yunan/Roma'ya ait. 3. Geleneksel, konvansiyonel.",guide:"Batı'nın geleneksel ciddi müziği veya antik Yunan ve Roma kültürüne ait.",examples:"1. She listens to classical music. (Klasik müzik dinler.) 2. classical architecture (klasik mimari) 3. classical ballet (klasik bale)"},{word:"classroom",type:"İsim",meaning:"1. Sınıf, derslik.",guide:"İçinde ders yapılan oda.",examples:"1. The classroom was empty. (Sınıf boştu.) 2. a language classroom (bir dil sınıfı)"},{word:"clause",type:"İsim",meaning:"1. Cümlecik, yan cümle (dilbilgisi). 2. Madde, fıkra (sözleşme).",guide:"Bir sözleşmenin belirli bir bölümü veya dilbilgisinde özne ve yülem içeren ifade grubu.",examples:"1. The contract has a confidentiality clause. (Sözleşmede bir gizlilik maddesi var.) 2. a subordinate clause (bir yan cümle)"},{word:"clean",type:"Sıfat/Fiil",meaning:"1. Temiz (sıfat). 2. Temizlemek (fiil). 3. Adil, kuralsız olmayan (spor).",guide:"Kirli veya lekesi olmayan. Fiil olarak temizlik yapmak.",examples:"1. Keep your room clean. (Odanı temiz tut.) 2. I need to clean the windows. (Pencereleri temizlemem gerekiyor.) 3. a clean driving licence (cezası olmayan bir ehliyet)"},{word:"clear",type:"Sıfat/Fiil/Zarf",meaning:"1. Açık, net (sıfat). 2. Temizlemek, açıklığa kavuşturmak (fiil). 3. Açıkça (zarf).",guide:"Anlaşılması veya görülmesi kolay olan. Fiil olarak engelleri kaldırmak.",examples:"1. The instructions are very clear. (Talimatlar çok net.) 2. Clear the table, please. (Masayı temizleyin lütfen.) 3. The sky is clear. (Gökyüzü açık.)"},{word:"clearly",type:"Zarf",meaning:"1. Açıkça, net bir şekilde. 2. Kuşkusuz, besbelli. 3. Anlaşılır bir şekilde.",guide:"Hiçbir şüphe veya zorluk olmadan.",examples:"1. Speak clearly so everyone can hear. (Herkesin duyabilmesi için açıkça konuş.) 2. Clearly, you don't understand. (Açıkça, sen anlamıyorsun.) 3. I can see you clearly now. (Seni şimdi net görebiliyorum.)"},{word:"clever",type:"Sıfat",meaning:"1. Zeki, akıllı. 2. Becerikli, maharetli. 3. Cin fikirli, kurnaz.",guide:"Çabuk öğrenen ve anlayan, zihinsel olarak yetenekli. Bazen olumsuz anlamda kurnazlık için de kullanılır.",examples:"1. She is a very clever student. (Çok zeki bir öğrencidir.) 2. a clever trick (zekice bir numara) 3. That was a clever idea. (Bu akıllıca bir fikirdi.)"},{word:"click",type:"Fiil/İsim",meaning:"1. Tıklamak (bilgisayar) (fiil). 2. Tık sesi (isim). 3. (click with) anlaşmak, uyuşmak.",guide:"Fareyi kullanarak bir ekran öğesini seçmek veya kısa, keskin bir ses çıkarmak.",examples:"1. Click on the icon to open the file. (Dosyayı açmak için simgeye tıklayın.) 2. The door closed with a click. (Kapı bir tık sesiyle kapandı.) 3. We clicked immediately. (Hemen anlaştık.)"},{word:"client",type:"İsim",meaning:"1. Müşteri, alıcı. 2. Danışan, vekil altındaki kişi. 3. (Bilgisayar) istemci.",guide:"Bir profesyonelden hizmet alan kişi veya kuruluş (avukat, banka, muhasebeci).",examples:"1. The lawyer met with her client. (Avukat müvekkiliyle görüştü.) 2. a regular client (daimi bir müşteri)"},{word:"climate",type:"İsim",meaning:"1. İklim. 2. Ortam, atmosfer (fikir/duygu). 3. (climate change) iklim değişikliği.",guide:"Bir bölgenin uzun süreli ortalama hava koşulları veya yaygın olan kamuoyu/tutum.",examples:"1. a tropical climate (tropikal bir iklim) 2. the current political climate (mevcut politik ortam) 3. climate crisis (iklim krizi)"},{word:"climb",type:"Fiil/İsim",meaning:"1. Tırmanmak (fiil). 2. Yükselmek (fiyat/değer) (fiil). 3. Tırmanış, yokuş (isim).",guide:"Bir yere, özellikle yukarı doğru, elleri ve ayakları kullanarak çıkmak.",examples:"1. We climbed the mountain. (Dağa tırmandık.) 2. Prices are climbing steadily. (Fiyatlar istikrarlı bir şekilde yükseliyor.) 3. a steep climb (dik bir tırmanış)"},{word:"clock",type:"İsim/Fiil",meaning:"1. Saat (duvar/saat kulesi) (isim). 2. (Clock in/out) işe geliş/gidiş saatini kaydetmek (fiil). 3. Süre tutmak.",guide:"Zamanı gösteren cihaz. Fiil olarak bir hızı ölçmek veya işe giriş-çıkışı kaydetmek.",examples:"1. Look at the clock! (Saate bak!) 2. Employees must clock in by 9 AM. (Çalışanlar saat 9'a kadar işe giriş yapmalıdır.) 3. an alarm clock (bir çalar saat)"},{word:"close1",type:"Fiil",meaning:"1. Kapatmak. 2. Son vermek, bitirmek. 3. Yaklaşmak.",guide:"Bir şeyi kapalı hale getirmek (kapı, pencere) veya bir faaliyeti bitirmek.",examples:"1. Close the door behind you. (Arkandan kapıyı kapat.) 2. The shop closes at 6 PM. (Dükkan akşam 6'da kapanır.) 3. The gap between them is closing. (Aralarındaki fark kapanıyor.)"},{word:"close2",type:"Sıfat/Zarf",meaning:"1. Yakın (sıfat). 2. Yakından, sıkı (zarf). 3. Detaylı, dikkatli (sıfat).",guide:"Mesafe veya ilişki olarak uzak olmayan. Zarf olarak yakın bir şekilde.",examples:"1. My house is close to the station. (Evim istasyona yakın.) 2. Look closer. (Daha yakından bak.) 3. a close friend (yakın bir arkadaş)"},{word:"closed",type:"Sıfat",meaning:"1. Kapalı. 2. Kapanmış, sona ermiş. 3. Gizli, kapalı (toplantı).",guide:"Açık olmayan, iş yapmayan veya erişilemeyen.",examples:"1. The museum is closed on Mondays. (Müze Pazartesi günleri kapalıdır.) 2. a closed door (kapalı bir kapı) 3. a closed meeting (kapalı bir toplantı)"},{word:"closely",type:"Zarf",meaning:"1. Yakından, dikkatlice. 2. Sıkı bir şekilde. 3. Yakinen, benzer şekilde.",guide:"Çok dikkatli veya çok yakın bir şekilde.",examples:"1. Listen closely to what he says. (Ne dediğini dikkatlice dinle.) 2. The two ideas are closely related. (İki fikir yakından ilişkilidir.) 3. Watch him closely. (Onu yakından izle.)"},{word:"cloth",type:"İsim",meaning:"1. Kumaş, bez. 2. (The cloth) rahiplik. 3. (Tablecloth) masa örtüsü.",guide:"Dokunmuş malzeme. Özel anlamda rahiplik mesleği.",examples:"1. a piece of cloth (bir parça kumaş) 2. He cut the cloth with scissors. (Makasla kumaşı kesti.) 3. a man of the cloth (bir rahip)"},{word:"clothes",type:"İsim (çoğul)",meaning:"1. Giysiler, elbiseler, çamaşır.",guide:"Vücudu örtmek ve korumak için giyilen şeyler. Tekili yoktur.",examples:"1. Put your dirty clothes in the laundry basket. (Kirli çamaşırlarını çamaşır sepetine koy.) 2. She was wearing beautiful clothes. (Güzel giysiler giyiyordu.)"},{word:"clothing",type:"İsim (toplu)",meaning:"1. Giyim, giysi.",guide:'"Clothes"ın daha resmi veya genel ifadesi. Sayılamaz isimdir.',examples:"1. waterproof clothing (su geçirmez giysi) 2. The store sells children's clothing. (Mağaza çocuk giyimi satıyor.)"},{word:"cloud",type:"İsim/Fiil",meaning:"1. Bulut (isim). 2. Bulut gibi şey, kalabalık (isim). 3. Bulutlandırmak, karartmak (fiil).",guide:"Gökyüzünde su damlacıklarından veya buz kristallerinden oluşan kütle. Mecazi olarak bir şeyi belirsizleştirmek.",examples:"1. There isn't a cloud in the sky. (Gökyüzünde tek bir bulut yok.) 2. a cloud of dust (bir toz bulutu) 3. Tears clouded her vision. (Gözleri yaşlarla buğulandı.)"},{word:"club",type:"İsim/Fiil",meaning:"1. Kulüp, dernek (isim). 2. Sopa, gürz (isim). 3. (Gece) kulübü (isim).",guide:"Ortak ilgi alanları olan insanların topluluğu veya vurmak için kullanılan sopa.",examples:"1. He's a member of a golf club. (Bir golf kulübünün üyesidir.) 2. a night club (bir gece kulübü) 3. They were clubbed to death. (Sopalarla dövülerek öldürüldüler.)"},{word:"clue",type:"İsim/Fiil",meaning:"1. İpucu, iz. 2. (not have a clue) hiçbir fikri olmamak. 3. Bilgi vermek, aydınlatmak.",guide:"Bir sorunu çözmeye veya bir şeyi anlamaya yardımcı olan bilgi parçası.",examples:"1. The police are looking for clues. (Polis ipuçları arıyor.) 2. I don't have a clue what you're talking about. (Neden bahsettiğin hakkında hiçbir fikrim yok.) 3. Can you clue me in on what happened? (Bana ne olduğu hakkında bilgi verebilir misin?)"},{word:"coach",type:"İsim/Fiil",meaning:"1. Antrenör, koç (isim). 2. (Uzun mesafe) otobüs (isim). 3. Çalıştırmak, antrenman yaptırmak (fiil).",guide:"Sporcuları eğiten kişi veya uzun mesafe yolcu taşıyan araç.",examples:"1. The football coach gave a team talk. (Futbol antrenörü takıma konuşma yaptı.) 2. We took a coach to London. (Londra'ya bir otobüsle gittik.) 3. She coaches the swimming team. (Yüzme takımını çalıştırıyor.)"},{word:"coal",type:"İsim",meaning:"1. Kömür. 2. (carry coals to Newcastle) gereksiz iş yapmak. 3. (hot coals) zor durum.",guide:"Siyah, yanıcı bir mineral, fosil yakıt.",examples:"1. The power station burns coal. (Enerji santrali kömür yakıyor.) 2. a lump of coal (bir parça kömür)"},{word:"coast",type:"İsim/Fiil",meaning:"1. Kıyı, sahil (isim). 2. Yokuş aşağı pedal çevirmeden gitmek (fiil). 3. Rahatça başarmak.",guide:"Denizin karayla buluştuğu hat. Fiil olarak efor sarf etmeden ilerlemek.",examples:"1. We drove along the coast. (Sahil boyunca araba sürdük.) 2. The car coasted to a stop. (Araba pedal çevrilmeden durdu.) 3. the east coast (doğu sahili)"},{word:"coat",type:"İsim/Fiil",meaning:"1. Ceket, palto (isim). 2. Kat, tabaka (isim). 3. Kaplamak (fiil).",guide:"Üst giysi veya bir şeyin üzerini kaplayan ince katman.",examples:"1. Put your coat on; it's cold outside. (Paltonu giy; dışarısı soğuk.) 2. a coat of paint (bir kat boya) 3. The chicken was coated in breadcrumbs. (Tavuk galeta ununa bulanmıştı.)"},{word:"code",type:"İsim/Fiil",meaning:"1. Kod, şifre (isim). 2. Yasa, tüzük (isim). 3. Kodlamak (fiil).",guide:"Bilginin gizli veya kısa şekli veya belirli kurallar dizisi.",examples:"1. a secret code (gizli bir kod) 2. the highway code (karayolları tüzüğü) 3. The software is written in code. (Yazılım kodla yazılmıştır.)"},{word:"coffee",type:"İsim",meaning:"1. Kahve (içecek). 2. Kahve (çekirdek/toz). 3. Kahverengi.",guide:"Kavrulmuş ve öğütülmüş kahve çekirdeklerinden yapılan sıcak içecek.",examples:"1. Would you like a cup of coffee? (Bir fincan kahve ister misiniz?) 2. black coffee (sade kahve) 3. a coffee table (bir sehpa)"},{word:"coin",type:"İsim/Fiil",meaning:"1. Bozuk para, madeni para (isim). 2. (Sözcük) uydurmak (fiil). 3. (toss a coin) yazı-tura atmak.",guide:"Metal para. Fiil olarak yeni bir kelime veya ifade yaratmak.",examples:'1. Do you have any coins for the parking meter? (Parkmetre için bozuk paran var mı?) 2. The term "blog" was coined recently. ("Blog" terimi yakın zamanda uyduruldu.) 3. a gold coin (altın bir para)'},{word:"cold",type:"Sıfat/İsim",meaning:"1. Soğuk (sıfat). 2. Soğuk algınlığı (isim). 3. Duygusuz, soğuk (sıfat).",guide:"Düşük sıcaklığa sahip olan. İsim olarak nezle.",examples:"1. It's very cold today. (Bugün hava çok soğuk.) 2. I've caught a cold. (Soğuk algınlığına yakalandım.) 3. a cold response (soğuk bir tepki)"},{word:"collapse",type:"Fiil/İsim",meaning:"1. Çökmek, yıkılmak (fiil). 2. (Sağlık) kötüleşmek, bayılmak (fiil). 3. Çöküş (isim).",guide:"Aniden yere yığılmak veya yapısal bütünlüğünü kaybetmek.",examples:"1. The roof collapsed under the weight of the snow. (Çatı, karın ağırlığı altında çöktü.) 2. He collapsed on the street. (Sokakta bayıldı.) 3. economic collapse (ekonomik çöküş)"},{word:"colleague",type:"İsim",meaning:"1. Meslektaş, iş arkadaşı.",guide:"Aynı iş yerinde çalışan kişi, özellikle aynı meslekten olan.",examples:"1. She went out for dinner with her colleagues. (Meslektaşlarıyla akşam yemeğine çıktı.) 2. a respected colleague (saygın bir meslektaş)"},{word:"collect",type:"Fiil",meaning:"1. Toplamak, biriktirmek. 2. (Para) toplamak, tahsil etmek. 3. (Kendini) toparlamak.",guide:"Bir araya getirmek veya para toplamak.",examples:"1. He collects stamps. (Pul biriktirir.) 2. I need to collect the children from school. (Çocukları okuldan almam gerekiyor.) 3. collect your thoughts (düşüncelerini topla)"},{word:"collection",type:"İsim",meaning:"1. Koleksiyon. 2. Toplama, tahsilat. 3. (Çöp) toplama.",guide:"Toplanmış nesneler grubu veya toplama eylemi.",examples:"1. a valuable art collection (değerli bir sanat koleksiyonu) 2. rubbish collection (çöp toplama) 3. a charity collection (bir hayır toplama kampanyası)"},{word:"college",type:"İsim",meaning:"1. Kolej, yüksekokul. 2. (Üniversite içinde) kolej. 3. (US) üniversite.",guide:"Özellikle mesleki eğitim veren yükseköğretim kurumu. ABD'de üniversite anlamına da gelir.",examples:"1. She's studying at a secretarial college. (Bir sekreterlik okulunda okuyor.) 2. a college of further education (bir yükseköğretim koleji)"},{word:"colour (US: color)",type:"İsim/Fiil",meaning:"1. Renk (isim). 2. Renklendirmek, boyamak (fiil). 3. (Yüzü) kızarmak.",guide:"Gözün algıladığı ışık özelliği (kırmızı, mavi vb.). Fiil olarak renk vermek.",examples:"1. What's your favourite colour? (En sevdiğin renk nedir?) 2. The children coloured the pictures. (Çocuklar resimleri boyadı.) 3. local colour (yerel renk/atmosfer)"},{word:"coloured (US: colored)",type:"Sıfat",meaning:"1. Renkli. 2. (Eskimiş/kaba) beyaz olmayan ırktan. 3. Etkilenmiş, renklenmiş.",guide:"Rengi olan. Irk tanımlaması olarak kullanımı artık genellikle kaba veya eskimiş kabul edilir.",examples:"1. coloured pencils (renkli kalemler) 2. a coloured photograph (renkli bir fotoğraf)"},{word:"column",type:"İsim",meaning:"1. Sütun, kolon (mimari). 2. Sütun (gazete). 3. Dikey sıra, kolon.",guide:"Dikey destek yapısı veya gazetede dikey yazı alanı.",examples:"1. The temple had marble columns. (Tapınağın mermer sütunları vardı.) 2. She writes a weekly column for the newspaper. (Gazete için haftalık bir köşe yazısı yazıyor.) 3. a column of numbers (bir sayı sütunu)"},{word:"combination",type:"İsim",meaning:"1. Kombinasyon, birleşim. 2. Şifre (kasa). 3. (İlaç) karışım.",guide:"Birkaç şeyin bir araya gelmesinden oluşan şey.",examples:"1. The dish is a combination of flavours. (Yemek, lezzetlerin bir kombinasyonudur.) 2. a safe combination (bir kasa şifresi) 3. a winning combination (bir kazanç formülü)"},{word:"combine",type:"Fiil",meaning:"1. Birleştirmek, kombine etmek. 2. Karıştırmak. 3. (Combine with) -le birleşmek.",guide:"İki veya daha fazla şeyi bir araya getirerek tek bir şey oluşturmak.",examples:"1. Combine the eggs and flour. (Yumurtaları ve unu karıştırın.) 2. The two companies combined to form a larger one. (İki şirket birleşerek daha büyük bir şirket oluşturdu.) 3. work combined with pleasure (iş ile zevkin birleşimi)"},{word:"come",type:"Fiil",meaning:"1. Gelmek. 2. (come from) -li olmak, -den gelmek. 3. (come true) gerçekleşmek.",guide:"Konuşmacının bulunduğu yere doğru hareket etmek veya bir kaynağa sahip olmak.",examples:"1. Come here! (Buraya gel!) 2. Where do you come from? (Nerelisin?) 3. My dream has come true. (Hayalim gerçek oldu.)"},{word:"comedy",type:"İsim",meaning:"1. Komedi, güldürü. 2. Komik durum, komedi. 3. Komedi filmi/oyunu.",guide:"İnsanları güldürmeyi amaçlayan eğlence türü veya komik bir olay.",examples:"1. I prefer comedy to tragedy. (Trajediye göre komediyi tercih ederim.) 2. a romantic comedy (bir romantik komedi) 3. The situation turned into a comedy of errors. (Durum bir yanlışlar komedisine dönüştü.)"},{word:"comfort",type:"İsim/Fiil",meaning:"1. Rahatlık, konfor (isim). 2. Teselli, avutma (isim). 3. Teselli etmek (fiil).",guide:"Fiziksel rahatlık veya üzüntülü birini teselli etme.",examples:"1. live in comfort (konfor içinde yaşamak) 2. words of comfort (teselli sözleri) 3. She comforted the crying child. (Ağlayan çocuğu teselli etti.)"},{word:"comfortable",type:"Sıfat",meaning:"1. Rahat, konforlu. 2. Huzurlu, güvende hissettiren. 3. (Finansal) rahat.",guide:"Fiziksel veya duygusal olarak rahatlık veren, sıkıntı yaratmayan.",examples:"1. a comfortable chair (rahat bir sandalye) 2. Are you comfortable with this plan? (Bu planla rahat mısın?) 3. a comfortable income (rahat bir gelir)"},{word:"command",type:"Fiil/İsim",meaning:"1. Emretmek, komuta etmek (fiil). 2. Komuta, yetki (isim). 3. (Bilgisayar) komut (isim).",guide:"Yetkiyle emir vermek veya bir şeyi kontrol etmek.",examples:"1. He commands a large army. (Büyük bir orduya komuta ediyor.) 2. She has a good command of English. (İngilizceye iyi hakimdir.) 3. a voice command (bir sesli komut)"},{word:"comment",type:"İsim/Fiil",meaning:"1. Yorum (isim). 2. Yorum yapmak (fiil). 3. Açıklama, görüş.",guide:"Bir konu hakkında sözlü veya yazılı görüş ifade etme.",examples:"1. Do you have any comments? (Herhangi bir yorumunuz var mı?) 2. He refused to comment on the matter. (Konu hakkında yorum yapmayı reddetti.) 3. a fair comment (adil bir yorum)"},{word:"commercial",type:"Sıfat/İsim",meaning:"1. Ticari (sıfat). 2. Reklam (isim). 3. Kâr amacı güden (sıfat).",guide:"Ticaret veya kâr ile ilgili olan. İsim olarak televizyon reklamı.",examples:"1. a commercial success (ticari bir başarı) 2. The TV show was interrupted by commercials. (TV programı reklamlarla bölündü.) 3. commercial breaks (reklam araları)"},{word:"commission",type:"İsim/Fiil",meaning:"1. Komisyon (ücret) (isim). 2. Kurul, komisyon (isim). 3. Sipariş vermek, ısmarlamak (fiil).",guide:"Satış üzerinden alınan yüzde veya bir işi yaptırmak için resmi talimat verme.",examples:"1. He gets a 10% commission on every sale. (Her satıştan %10 komisyon alır.) 2. an official commission of inquiry (resmi bir soruşturma komisyonu) 3. The artist was commissioned to paint a portrait. (Sanatçıya bir portre ısmarlanmıştı.)"},{word:"commit",type:"Fiil",meaning:"1. İşlemek, yapmak (suç/hata). 2. Söz vermek, taahhüt etmek. 3. (Kendini) adamak.",guide:"Bir eylemde bulunmak, özellikle yanlış veya yasa dışı bir eylem. Bir şeye söz vermek.",examples:"1. He committed a crime. (Bir suç işledi.) 2. The government is committed to improving healthcare. (Hükümet sağlık hizmetlerini iyileştirmeye kararlıdır.) 3. She didn't want to commit to a relationship. (Bir ilişkiye bağlanmak istemedi.)"},{word:"commitment",type:"İsim",meaning:"1. Taahhüt, söz, yükümlülük. 2. Bağlılık, adamışlık. 3. (Hapse atma) kararı.",guide:"Bir şey yapma sözü veya bir şeye kendini adama durumu.",examples:"1. I have too many commitments at the moment. (Şu anda çok fazla yükümlülüğüm var.) 2. her commitment to her job (işine olan bağlılığı) 3. a long-term commitment (uzun vadeli bir taahhüt)"},{word:"committee",type:"İsim",meaning:"1. Komite, kurul.",guide:"Belirli bir görevi yerine getirmek için atanmış bir grup insan.",examples:"1. She sits on the finance committee. (Finans komitesinde görev yapıyor.) 2. a committee meeting (bir komite toplantısı)"},{word:"common",type:"Sıfat",meaning:"1. Yaygın, sık rastlanan. 2. Ortak, müşterek. 3. Sıradan, alelade.",guide:"Çok sayıda yerde bulunan veya birçok kişi tarafından paylaşılan.",examples:"1. It's a common mistake. (Yaygın bir hatadır.) 2. We have a common goal. (Ortak bir hedefimiz var.) 3. common sense (sağduyu)"},{word:"commonly",type:"Zarf",meaning:"1. Yaygın olarak, genellikle. 2. Alelade bir şekilde.",guide:"Çoğu durumda veya çoğu insan tarafından kabul edilen şekilde.",examples:"1. It is commonly believed that... (... olduğu genellikle kabul edilir.) 2. a commonly used phrase (yaygın olarak kullanılan bir ifade)"},{word:"communicate",type:"Fiil",meaning:"1. İletişim kurmak. 2. Bildirmek, iletmek. 3. (Hastalık) bulaştırmak.",guide:"Bilgi, düşünce veya duyguları birinden diğerine aktarmak.",examples:"1. We need to communicate better. (Daha iyi iletişim kurmamız gerekiyor.) 2. He finds it hard to communicate his feelings. (Duygularını ifade etmekte zorlanıyor.) 3. The disease is easily communicated. (Hastalık kolayca bulaşır.)"},{word:"communication",type:"İsim",meaning:"1. İletişim. 2. Haber, mesaj. 3. İletişim araçları.",guide:"Bilgi alışverişi eylemi veya gönderilen mesaj.",examples:"1. Good communication is key in a relationship. (İyi iletişim bir ilişkide anahtardır.) 2. I received a communication from head office. (Genel merkezden bir haber aldım.) 3. mass communication (kitle iletişimi)"},{word:"community",type:"İsim",meaning:"1. Topluluk, cemiyet. 2. (Belirli bir grup) camia. 3. Ortaklık, benzerlik.",guide:"Aynı bölgede yaşayan veya ortak özellikleri paylaşan insan grubu.",examples:"1. the local community (yerel topluluk) 2. the business community (iş dünyası) 3. a sense of community (bir topluluk duygusu)"},{word:"company",type:"İsim",meaning:"1. Şirket, firma. 2. Arkadaşlık, birliktelik. 3. Misafir, ziyaretçi.",guide:"Ticari faaliyette bulunan organizasyon veya birinin yanında olma durumu.",examples:"1. He works for an insurance company. (Bir sigorta şirketinde çalışıyor.) 2. I enjoy your company. (Seninle birlikte olmaktan hoşlanıyorum.) 3. We're expecting company tonight. (Bu gece misafirimiz var.)"},{word:"compare",type:"Fiil",meaning:"1. Karşılaştırmak, kıyaslamak. 2. (compare to) -e benzetmek. 3. (compare with) -le kıyaslamak.",guide:"İki veya daha fazla şey arasındaki benzerlik ve farklılıkları incelemek.",examples:"1. Compare the prices before you buy. (Satın almadan önce fiyatları karşılaştır.) 2. He compared her voice to an angel's. (Sesini bir meleğinkine benzetti.) 3. Compared with last year, sales are up. (Geçen yılla karşılaştırıldığında satışlar arttı.)"},{word:"comparison",type:"İsim",meaning:"1. Karşılaştırma, kıyas. 2. Benzerlik. 3. (In comparison) kıyasla.",guide:"Karşılaştırma eylemi veya bu eylemin sonucu.",examples:"1. There's no comparison between the two. (İkisi arasında hiçbir kıyaslama yok.) 2. By comparison, our house is small. (Kıyasla, bizim evimiz küçük.)"},{word:"compete",type:"Fiil",meaning:"1. Yarışmak, rekabet etmek. 2. (with/against) -le yarışmak. 3. (Mücadele etmek).",guide:"Bir ödül veya avantaj için başkalarıyla mücadele etmek.",examples:"1. The athletes competed for the gold medal. (Sporcular altın madalya için yarıştı.) 2. Small businesses can't compete with large chains. (Küçük işletmeler büyük zincirlerle rekabet edemez.)"},{word:"competition",type:"İsim",meaning:"1. Yarışma, müsabaka. 2. Rekabet. 3. Rakip, rakipler.",guide:"Kazananın seçildiği bir etkinlik veya piyasada rekabet durumu.",examples:"1. a singing competition (bir şarkı yarışması) 2. There's a lot of competition in this industry. (Bu sektörde çok fazla rekabet var.) 3. the competition (rakipler)"},{word:"competitive",type:"Sıfat",meaning:"1. Rekabetçi. 2. Rekabete dayalı. 3. Ucuz (fiyat).",guide:"Kazanma arzusu yüksek olan veya fiyat/ kalite açısından rekabet edebilen.",examples:"1. He's very competitive. (O çok rekabetçidir.) 2. a competitive market (rekabetçi bir pazar) 3. competitive prices (rekabetçi fiyatlar)"},{word:"competitor",type:"İsim",meaning:"1. Rakip, yarışmacı. 2. Mücadele eden kişi/kuruluş.",guide:"Bir yarışmada veya piyasada aynı şey için mücadele eden kişi veya kuruluş.",examples:"1. Their main competitor is the company across the street. (Onların ana rakibi sokağın karşısındaki şirkettir.) 2. All competitors must register. (Tüm yarışmacılar kayıt olmalıdır.)"},{word:"complain",type:"Fiil",meaning:"1. Şikayet etmek. 2. Yakınmak, sızlanmak. 3. (Resmi) şikayette bulunmak.",guide:"Hoşnutsuzluğu veya bir sorunu sözlü olarak ifade etmek.",examples:"1. He's always complaining about something. (O her zaman bir şeyden şikayet ediyor.) 2. I'd like to complain about the service. (Hizmet hakkında şikayette bulunmak istiyorum.) 3. She complained of a headache. (Baş ağrısından şikayet etti.)"},{word:"complaint",type:"İsim",meaning:"1. Şikayet, yakınma. 2. (Resmi) şikayet dilekçesi. 3. (Tıbbi) rahatsızlık.",guide:"Şikayet eylemi veya şikayet edilen şey.",examples:"1. I have no complaints. (Hiçbir şikayetim yok.) 2. The company received many complaints. (Şirket birçok şikayet aldı.) 3. a letter of complaint (bir şikayet mektubu)"},{word:"complete",type:"Sıfat/Fiil",meaning:"1. Tam, bütün (sıfat). 2. Tamamlamak, bitirmek (fiil). 3. Eksiksiz, kusursuz (sıfat).",guide:"Tüm parçaları olan, eksiksiz. Fiil olarak sona erdirmek.",examples:"1. The complete works of Shakespeare (Shakespeare'in tüm eserleri) 2. Please complete the application form. (Lütfen başvuru formunu doldurun.) 3. a complete surprise (tam bir sürpriz)"},{word:"completely",type:"Zarf",meaning:"1. Tamamen, bütünüyle. 2. Tümüyle, son derece.",guide:"Her açıdan, hiçbir şey eksik olmayacak şekilde.",examples:"1. I completely agree with you. (Size tamamen katılıyorum.) 2. The building was completely destroyed. (Bina tamamen yok edildi.) 3. completely different (tamamen farklı)"},{word:"complex",type:"Sıfat/İsim",meaning:"1. Karmaşık, kompleks (sıfat). 2. Site, kompleks (binalar) (isim). 3. (Psikoloji) kompleks.",guide:"Birçok bağlantılı parçası olan ve anlaşılması zor olan.",examples:"1. a complex problem (karmaşık bir sorun) 2. a sports complex (bir spor kompleksi) 3. an inferiority complex (bir aşağılık kompleksi)"},{word:"complicated",type:"Sıfat",meaning:"1. Karışık, karmaşık, çapraşık. 2. Anlaşılması zor.",guide:"Birçok parçası, aşaması veya detayı olduğu için anlaması veya çözmesi zor olan.",examples:"1. The instructions are too complicated. (Talimatlar çok karışık.) 2. a complicated relationship (karmaşık bir ilişki)"},{word:"component",type:"İsim/Sıfat",meaning:"1. Bileşen, parça (isim). 2. Bileşen (sıfat). 3. (Sistemin) bir parçası.",guide:"Daha büyük bir bütünün parçasını oluşturan şey.",examples:"1. the components of a machine (bir makinenin bileşenleri) 2. a key component of the plan (planın kilit bir bileşeni) 3. component parts (bileşen parçalar)"},{word:"computer",type:"İsim",meaning:"1. Bilgisayar. 2. (Hesap yapan) cihaz.",guide:"Programlanabilir elektronik cihaz, veri işler.",examples:"1. I work on a computer all day. (Bütün gün bilgisayar başında çalışıyorum.) 2. a laptop computer (bir dizüstü bilgisayar)"},{word:"concentrate",type:"Fiil/İsim",meaning:"1. Konsantre olmak, yoğunlaşmak (fiil). 2. Toplamak, bir yere yığmak (fiil). 3. Konsantre, yoğunlaştırılmış şey (isim).",guide:"Dikkatini bir şey üzerinde toplamak veya bir şeyi belirli bir alanda biriktirmek.",examples:"1. Concentrate on your work! (İşine konsantre ol!) 2. Power is concentrated in the hands of a few. (Güç birkaç kişinin elinde toplanmış.) 3. orange juice concentrate (portakal suyu konsantresi)"},{word:"concentration",type:"İsim",meaning:"1. Konsantrasyon, dikkat. 2. Yoğunlaşma, derişim (kimya). 3. Yığın, birikim.",guide:"Zihinsel odaklanma veya bir maddenin bir çözeltideki miktarı.",examples:"1. This game requires great concentration. (Bu oyun büyük konsantrasyon gerektirir.) 2. a high concentration of salt (yüksek tuz konsantrasyonu) 3. a concentration of resources (kaynakların yoğunlaşması)"},{word:"concept",type:"İsim",meaning:"1. Kavram, fikir. 2. Düşünce, anlayış. 3. Tasarım, konsept.",guide:"Zihinde oluşan genel ve soyut fikir.",examples:"1. the concept of freedom (özgürlük kavramı) 2. a new concept in car design (araba tasarımında yeni bir konsept) 3. I understand the concept. (Kavramı anlıyorum.)"},{word:"concern",type:"Fiil/İsim",meaning:"1. Endişelendirmek, kaygılandırmak (fiil). 2. İlgilendirmek (fiil). 3. Endişe, ilgi (isim).",guide:"Birini endişelendirmek veya bir şeyle ilgili olmak. İsim olarak endişe veya işletme.",examples:"1. His health concerns me. (Onun sağlığı beni endişelendiriyor.) 2. This matter concerns all of us. (Bu mesele hepimizi ilgilendirir.) 3. There is growing concern about pollution. (Kirlilik konusunda artan bir endişe var.)"},{word:"concerned",type:"Sıfat",meaning:"1. Endişeli, kaygılı. 2. İlgili, alakalı. 3. (as far as ... is concerned) -e gelince.",guide:"Bir şey hakkında endişe duyan veya bir şeyle ilişkisi olan.",examples:"1. I'm concerned about your safety. (Güvenliğiniz konusunda endişeliyim.) 2. the authorities concerned (ilgili makamlar) 3. As far as I'm concerned, you can leave. (Bana kalırsa, gidebilirsin.)"},{word:"concert",type:"İsim",meaning:"1. Konser. 2. Uyum, ahenk (eski). 3. (In concert) birlikte, dayanışma içinde.",guide:"Canlı müzik performansı.",examples:"1. We went to a rock concert. (Bir rock konserine gittik.) 2. a concert hall (bir konser salonu)"},{word:"conclude",type:"Fiil",meaning:"1. Sonuçlandırmak, bitirmek. 2. Sonuca varmak. 3. (Anlaşma) imzalamak.",guide:"Bir şeyi sona erdirmek veya düşünerek bir karara varmak.",examples:"1. He concluded his speech with a joke. (Konuşmasını bir şakayla bitirdi.) 2. What do you conclude from the evidence? (Kanıtlardan ne sonuç çıkarıyorsun?) 3. to conclude a deal (bir anlaşma yapmak)"},{word:"conclusion",type:"İsim",meaning:"1. Sonuç. 2. Karar, yargı. 3. Son, bitiş.",guide:"Bir tartışma veya sürecin son kısmı veya vardığınız karar.",examples:"1. In conclusion, I'd like to thank everyone. (Sonuç olarak, herkese teşekkür etmek istiyorum.) 2. I came to the conclusion that he was lying. (Onun yalan söylediği sonucuna vardım.) 3. the conclusion of the war (savaşın sonu)"},{word:"condition",type:"İsim/Fiil",meaning:"1. Durum, hal (isim). 2. Koşul, şart (isim). 3. Şartlandırmak, koşullandırmak (fiil).",guide:"Bir şeyin mevcut durumu veya bir şeyin gerçekleşmesi için gerekli olan şart.",examples:"1. The car is in good condition. (Araba iyi durumda.) 2. One condition of the job is that you travel. (İşin bir koşulu seyahat etmenizdir.) 3. a medical condition (tıbbi bir durum)"},{word:"conduct",type:"Fiil/İsim",meaning:"1. Yürütmek, yönetmek (fiil). 2. Davranmak (fiil). 3. Davranış, tutum (isim).",guide:"Bir faaliyeti organize etmek ve yürütmek. İsim olarak davranış tarzı.",examples:"1. They conducted a survey. (Bir anket yürüttüler.) 2. He conducted himself well during the interview. (Mülakat sırasında kendini iyi idare etti.) 3. professional conduct (profesyonel davranış)"},{word:"conference",type:"İsim",meaning:"1. Konferans, kongre. 2. Toplantı, görüşme. 3. (Spor ligi) konferans.",guide:"Resmi bir konuyu tartışmak için yapılan büyük toplantı.",examples:"1. an international conference on climate change (iklim değişikliği üzerine uluslararası bir konferans) 2. a press conference (bir basın toplantısı)"},{word:"confidence",type:"İsim",meaning:"1. Güven, itimat. 2. Özgüven, kendine güven. 3. Sır, gizli bilgi.",guide:"Birine veya bir şeye güvenme duygusu veya kendi yeteneklerine inanma.",examples:"1. I have complete confidence in you. (Sana tam güvenim var.) 2. She lacks confidence. (Özgüveni eksik.) 3. a confidence trick (bir güven dolandırıcılığı)"},{word:"confident",type:"Sıfat",meaning:"1. Kendine güvenen, emin. 2. Emin, inançlı. 3. (confident of) -den emin olmak.",guide:"Başarılı olacağına veya bir şeyin doğru olduğuna inanan.",examples:"1. He is a confident speaker. (Kendine güvenen bir konuşmacıdır.) 2. I'm confident that we will win. (Kazanacağımızdan eminim.) 3. She felt confident about the exam. (Sınav konusunda kendinden emindi.)"},{word:"confirm",type:"Fiil",meaning:"1. Doğrulamak, teyit etmek. 2. (Rezervasyon) onaylamak. 3. (Katolik) kutsamak.",guide:"Bir şeyin doğru olduğunu veya kesinleştiğini söylemek, onaylamak.",examples:"1. Can you confirm your date of birth? (Doğum tarihinizi doğrulayabilir misiniz?) 2. Please confirm your attendance by email. (Katılımınızı e-posta ile onaylayın lütfen.) 3. The news confirmed my suspicions. (Haber şüphelerimi doğruladı.)"},{word:"conflict",type:"İsim/Fiil",meaning:"1. Çatışma, anlaşmazlık (isim). 2. Savaş, çarpışma (isim). 3. Çatışmak, uyuşmamak (fiil).",guide:"Ciddi bir anlaşmazlık veya silahlı mücadele. Fiil olarak birbiriyle uyumsuz olmak.",examples:"1. There is a conflict of interest. (Bir çıkar çatışması var.) 2. armed conflict (silahlı çatışma) 3. His statement conflicts with the evidence. (İfadesi kanıtlarla çelişiyor.)"},{word:"confuse",type:"Fiil",meaning:"1. Karıştırmak, kafasını karıştırmak. 2. Şaşırtmak. 3. (İki şeyi) birbirine karıştırmak.",guide:"Birini anlamasını veya ayırt etmesini zorlaştırmak.",examples:"1. The instructions confused me. (Talimatlar kafamı karıştırdı.) 2. Don't confuse me with facts! (Beni gerçeklerle karıştırma!) 3. I always confuse their names. (Onların isimlerini hep karıştırıyorum.)"},{word:"confused",type:"Sıfat",meaning:"1. Kafası karışmış, şaşkın. 2. Karmaşık, anlaşılmaz. 3. Düzensiz.",guide:"Ne yapacağını veya ne olduğunu bilmeyen, şaşkın.",examples:"1. I'm confused about what to do next. (Bir sonraki ne yapacağım konusunda kafam karışık.) 2. a confused situation (karmaşık bir durum) 3. confused memories (karışık anılar)"},{word:"confusing",type:"Sıfat",meaning:"1. Kafa karıştırıcı. 2. Anlaşılması zor.",guide:"Anlaması veya takip etmesi zor olan, karmaşık.",examples:"1. The map is very confusing. (Harita çok kafa karıştırıcı.) 2. confusing instructions (kafa karıştırıcı talimatlar)"},{word:"connect",type:"Fiil",meaning:"1. Bağlamak, birleştirmek. 2. (Telefon) bağlamak. 3. İlişkilendirmek.",guide:"İki şeyi fiziksel veya soyut olarak birbirine bağlamak.",examples:"1. Connect the printer to the computer. (Yazıcıyı bilgisayara bağlayın.) 2. I was connected to the wrong department. (Yanlış departmana bağlandım.) 3. The two events are connected. (İki olay birbiriyle bağlantılı.)"},{word:"connected",type:"Sıfat",meaning:"1. Bağlı, ilişkili. 2. (İnternet) bağlantılı. 3. Akraba, tanıdık.",guide:"Fiziksel veya soyut olarak bir şeye bağlı olan.",examples:"1. The two issues are closely connected. (İki konu yakından bağlantılıdır.) 2. Are you connected to the internet? (İnternete bağlı mısın?) 3. a well-connected family (iyi bağlantıları olan bir aile)"},{word:"connection",type:"İsim",meaning:"1. Bağlantı, ilişki. 2. (Ulaşım) aktarma. 3. (Telefon/internet) bağlantı.",guide:"İki şey arasındaki bağ veya ilişki.",examples:"1. Is there a connection between smoking and cancer? (Sigara ve kanser arasında bir bağlantı var mı?) 2. I missed my connection in Paris. (Paris'teki aktarmamı kaçırdım.) 3. a slow internet connection (yavaş bir internet bağlantısı)"},{word:"conscious",type:"Sıfat",meaning:"1. Bilincinde olan, farkında. 2. Bilinçli, şuuru yerinde. 3. Kasıtlı, bilinçli.",guide:"Çevresinin veya belirli bir gerçeğin farkında olan.",examples:"1. Are you conscious of the risks? (Risklerin farkında mısınız?) 2. The patient is now conscious. (Hasta şimdi bilinci yerinde.) 3. a conscious decision (bilinçli bir karar)"},{word:"consequence",type:"İsim",meaning:"1. Sonuç, netice. 2. Önem, ehemmiyet. 3. (take the consequences) sonuçlarına katlanmak.",guide:"Bir eylem veya durumun doğal veya mantıksal sonucu.",examples:"1. The consequences of your actions could be serious. (Eylemlerinin sonuçları ciddi olabilir.) 2. It's of no consequence. (Hiç önemi yok.) 3. a person of consequence (önemli bir kişi)"},{word:"conservative",type:"Sıfat/İsim",meaning:"1. Muhafazakâr (sıfat/isim). 2. İhtiyatlı, tutucu (sıfat). 3. (Tahmin) ihtiyatlı.",guide:"Değişime karşı olan, geleneksel değerleri korumayı savunan. Ayrıca ihtiyatlı tahmin.",examples:"1. He has very conservative views. (Çok muhafazakâr görüşlere sahiptir.) 2. a conservative estimate (ihtiyatlı bir tahmin) 3. the Conservative Party (Muhafazakâr Parti)"},{word:"consider",type:"Fiil",meaning:"1. Düşünmek, göz önünde bulundurmak. 2. Saymak, kabul etmek. 3. (consider doing) yapmayı düşünmek.",guide:"Dikkatlice düşünmek veya bir şekilde değerlendirmek.",examples:"1. We need to consider all the options. (Tüm seçenekleri düşünmemiz gerekiyor.) 2. She is considered an expert. (O bir uzman olarak kabul edilir.) 3. I'm considering changing my job. (İşimi değiştirmeyi düşünüyorum.)"},{word:"consideration",type:"İsim",meaning:"1. Dikkate alma, göz önünde bulundurma. 2. Özen, nezaket. 3. (Karşılık) ücret, bedel.",guide:"Bir şeyi düşünme eylemi veya başkalarına gösterilen özen.",examples:"1. After careful consideration, I have decided to accept. (Dikkatli bir değerlendirmeden sonra kabul etmeye karar verdim.) 2. Show some consideration for others. (Başkalarına biraz özen göster.) 3. a small financial consideration (küçük bir maddi karşılık)"},{word:"consist",type:"Fiil",meaning:"1. (-den) oluşmak, ibaret olmak. 2. (consist in) -den ibaret olmak, -de yatmaktır. 3. (consist with) -e uymak.",guide:'Belirli parçalar veya unsurlar içermek. "Of" edatı ile kullanılır.',examples:"1. The team consists of five players. (Takım beş oyuncudan oluşur.) 2. The beauty of the plan consists in its simplicity. (Planın güzelliği basitliğinde yatar.)"},{word:"consistent",type:"Sıfat",meaning:"1. Tutarlı, istikrarlı. 2. Uyumlu, bağdaşır. 3. Düzenli, sürekli.",guide:"Zaman içinde değişmeyen veya diğer şeylerle çelişmeyen.",examples:"1. His work is always consistent. (Onun işi her zaman tutarlıdır.) 2. Your story is not consistent with the facts. (Hikayen gerçeklerle uyuşmuyor.) 3. consistent performance (istikrarlı performans)"},{word:"constant",type:"Sıfat/İsim",meaning:"1. Sabit, değişmeyen (sıfat). 2. Sürekli, devamlı (sıfat). 3. Sabit sayı (isim).",guide:"Sürekli aynı kalan veya tekrarlanan.",examples:"1. at a constant speed (sabit bir hızla) 2. constant noise (sürekli gürültü) 3. He's in constant pain. (Sürekli ağrı içinde.)"},{word:"constantly",type:"Zarf",meaning:"1. Sürekli olarak, durmadan. 2. Devamlı surette.",guide:"Hiç kesilmeden veya çok sık aralıklarla.",examples:"1. The rules are constantly changing. (Kurallar sürekli değişiyor.) 2. She is constantly on the phone. (O sürekli telefonla meşgul.)"},{word:"construct",type:"Fiil",meaning:"1. İnşa etmek, yapmak. 2. (Cümle/teori) kurmak. 3. Çizmek (geometri).",guide:"Bir şeyi parçaları bir araya getirerek oluşturmak.",examples:"1. They plan to construct a new bridge. (Yeni bir köprü inşa etmeyi planlıyorlar.) 2. a well-constructed argument (iyi kurulmuş bir argüman)"},{word:"construction",type:"İsim",meaning:"1. İnşaat, yapım. 2. Yapı, bina. 3. (Dilbilgisi) yapı, kuruluş.",guide:"İnşa etme eylemi veya inşa edilmiş şey.",examples:"1. The road is under construction. (Yol yapım aşamasında.) 2. a steel construction (bir çelik yapı) 3. grammatical construction (dilbilgisel yapı)"},{word:"consume",type:"Fiil",meaning:"1. Tüketmek, yiyip içmek. 2. (Zaman/enerji) harcamak. 3. (Ateş) yutmak, yakıp kül etmek.",guide:"Bir şeyi kullanmak, yemek/içmek veya tamamen bitirmek.",examples:"1. We consume a lot of sugar. (Çok fazla şeker tüketiyoruz.) 2. The project consumed all her energy. (Proje onun tüm enerjisini tüketti.) 3. consumed with jealousy (kıskançlıkla tükenmiş)"},{word:"consumer",type:"İsim",meaning:"1. Tüketici, müşteri. 2. (Canlı) tüketici (ekoloji).",guide:"Mal veya hizmet satın alan kişi.",examples:"1. consumer rights (tüketici hakları) 2. consumer goods (tüketim malları) 3. consumer demand (tüketici talebi)"},{word:"contact",type:"İsim/Fiil",meaning:"1. Temas, ilişki (isim). 2. İletişim kurmak (fiil). 3. Bağlantı, tanıdık (isim).",guide:"Birine ulaşmak veya onunla iletişim kurmak.",examples:"1. Have you been in contact with him? (Onunla temas kurdun mu?) 2. Contact me if you have any questions. (Herhangi bir sorunuz olursa benimle iletişime geçin.) 3. eye contact (göz teması)"},{word:"contain",type:"Fiil",meaning:"1. İçermek, kapsamak. 2. (Duyguyu) bastırmak, kontrol etmek. 3. (Yayılmayı) durdurmak, sınırlamak.",guide:"İçinde bulundurmak, bir şeyin parçası olarak sahip olmak.",examples:"1. This box contains old photos. (Bu kutunun içinde eski fotoğraflar var.) 2. I could hardly contain my excitement. (Heyecanımı zor kontrol edebiliyordum.) 3. efforts to contain the disease (hastalığı kontrol altına alma çabaları)"},{word:"container",type:"İsim",meaning:"1. Kap, konteyner. 2. (Nakliye) konteyner.",guide:"Bir şeyi içine koymak için kullanılan şey.",examples:"1. a plastic container (plastik bir kap) 2. a shipping container (bir nakliye konteyneri)"},{word:"contemporary",type:"Sıfat/İsim",meaning:"1. Çağdaş, modern (sıfat). 2. Aynı dönemde yaşayan (sıfat/isim). 3. Güncel.",guide:"Günümüzde var olan veya aynı zamanda yaşamış olan.",examples:"1. contemporary art (çağdaş sanat) 2. He was a contemporary of Shakespeare. (O, Shakespeare'in çağdaşıydı.) 3. contemporary music (çağdaş müzik)"},{word:"content1",type:"İsim",meaning:"1. İçerik. 2. (Kitap/konuşma) içeriği. 3. (İnternet) içerik.",guide:"Bir şeyin içerdiği bilgi veya fikirler.",examples:"1. The content of the letter was shocking. (Mektubun içeriği şok ediciydi.) 2. table of contents (içindekiler) 3. online content (çevrimiçi içerik)"},{word:"contest",type:"İsim/Fiil",meaning:"1. Yarışma, müsabaka (isim). 2. İtiraz etmek, tartışmak (fiil). 3. Mücadele etmek.",guide:"Kazananın seçildiği bir etkinlik veya bir şeyin doğruluğuna karşı çıkmak.",examples:"1. a beauty contest (bir güzellik yarışması) 2. He plans to contest the election results. (Seçim sonuçlarına itiraz etmeyi planlıyor.) 3. a singing contest (bir şarkı yarışması)"},{word:"context",type:"İsim",meaning:"1. Bağlam, ortam. 2. (Dilbilim) bağlam. 3. Şartlar, çerçeve.",guide:"Bir olayın veya fikrin içinde gerçekleştiği koşullar, çevre.",examples:"1. You need to see it in context. (Onu bağlamı içinde görmen gerekiyor.) 2. historical context (tarihsel bağlam) 3. out of context (bağlamından koparılmış)"},{word:"continent",type:"İsim",meaning:"1. Kıta. 2. (the Continent) Avrupa anakarası (BK).",guide:"Büyük kara kütlesi (Asya, Afrika, Avrupa, vb.). Britanya'da Avrupa anakarası için kullanılır.",examples:"1. Africa is a continent. (Afrika bir kıtadır.) 2. They're travelling on the Continent. (Avrupa anakarasında seyahat ediyorlar.)"},{word:"continue",type:"Fiil",meaning:"1. Devam etmek, sürmek. 2. (Sona ermeden) sürdürmek. 3. (Konuşmaya) devam etmek.",guide:"Bir şeyi yapmayı veya bir durumda olmayı sürdürmek.",examples:"1. The rain continued all day. (Yağmur bütün gün devam etti.) 2. He continued working despite being tired. (Yorgun olmasına rağmen çalışmaya devam etti.) 3. To be continued... (Devam edecek...)"},{word:"continuous",type:"Sıfat",meaning:"1. Sürekli, kesintisiz. 2. (Dilbilgisi) sürekli zaman. 3. Devamlı, aralıksız.",guide:"Hiç ara vermeden devam eden.",examples:"1. a continuous noise (kesintisiz bir gürültü) 2. continuous improvement (sürekli iyileştirme) 3. the continuous tense (sürekli zaman)"},{word:"contract",type:"İsim/Fiil",meaning:"1. Sözleşme, kontrat (isim). 2. Küçülmek, büzüşmek (fiil). 3. (Hastalık) kapmak (fiil).",guide:"Resmi, yazılı anlaşma. Fiil olarak küçülmek veya bir hastalığa yakalanmak.",examples:"1. Sign the contract here. (Sözleşmeyi buraya imzalayın.) 2. Metal contracts when it cools. (Metal soğuduğunda büzüşür.) 3. He contracted malaria. (Sıtmaya yakalandı.)"},{word:"contrast",type:"İsim/Fiil",meaning:"1. Kontrast, tezat (isim). 2. Karşılaştırmak (fiil). 3. Zıtlık oluşturmak (fiil).",guide:"İki şey arasındaki belirgin fark veya bu farkı vurgulamak.",examples:"1. There's a sharp contrast between their styles. (Onların stilleri arasında keskin bir tezat var.) 2. Contrast her work with his. (Onun çalışmasını onunkiyle karşılaştırın.) 3. in contrast to (aksine)"},{word:"contribute",type:"Fiil",meaning:"1. Katkıda bulunmak. 2. (Para) bağışlamak. 3. (Yazı) yazmak (dergiye).",guide:"Bir şeyin oluşmasına veya gelişmesine yardım etmek.",examples:"1. Everyone contributed to the discussion. (Herkes tartışmaya katkıda bulundu.) 2. He contributes to a charity. (Bir hayır kurumuna bağış yapıyor.) 3. factors contributing to the accident (kazaya katkıda bulunan faktörler)"},{word:"contribution",type:"İsim",meaning:"1. Katkı. 2. Bağış. 3. Yazı, makale.",guide:"Katkıda bulunma eylemi veya katkılanan şey (para, fikir).",examples:"1. She made a major contribution to the project. (Projeye önemli bir katkı yaptı.) 2. a charitable contribution (hayırseverlik bağışı)"},{word:"control",type:"İsim/Fiil",meaning:"1. Kontrol, denetim (isim). 2. Kontrol etmek, yönetmek (fiil). 3. (Duygularını) kontrol etmek.",guide:"Bir şeyi veya birini yönetme veya yönlendirme gücü.",examples:"1. Who is in control here? (Burada kontrol kimde?) 2. The government controls the price of bread. (Hükümet ekmek fiyatını kontrol ediyor.) 3. control panel (kontrol paneli)"},{word:"convenient",type:"Sıfat",meaning:"1. Uygun, elverişli. 2. Kullanışlı, pratik. 3. (Saat/yer) uygun.",guide:"Zorluk yaratmayan, rahat ve kolay ulaşılabilir veya yapılabilir.",examples:"1. Is 3 o'clock convenient for you? (Saat 3 sizin için uygun mu?) 2. a convenient location (uygun bir konum) 3. a convenient excuse (uygun bir mazeret)"},{word:"conversation",type:"İsim",meaning:"1. Konuşma, sohbet. 2. Görüşme, diyalog.",guide:"İki veya daha fazla kişi arasındaki sözlü fikir alışverişi.",examples:"1. I had a long conversation with my boss. (Patronumla uzun bir konuşma yaptım.) 2. an interesting conversation (ilginç bir sohbet)"},{word:"convert",type:"Fiil/İsim",meaning:"1. Dönüştürmek, çevirmek (fiil). 2. (Din) değiştirmek (fiil). 3. Din değiştiren kişi (isim).",guide:"Bir şeyi bir biçimden/ durumdan başka birine değiştirmek.",examples:"1. They converted the attic into a bedroom. (Tavan arasını bir yatak odasına dönüştürdüler.) 2. He converted to Islam. (İslamiyet'i kabul etti.) 3. a convert to vegetarianism (vejetaryenliğe geçen biri)"},{word:"convince",type:"Fiil",meaning:"1. İkna etmek, inandırmak. 2. (convince of) -e ikna etmek.",guide:"Birinin bir şeyin doğru olduğuna veya bir şeyi yapması gerektiğine inanmasını sağlamak.",examples:"1. I tried to convince him to come with us. (Onu bizimle gelmeye ikna etmeye çalıştım.) 2. I am convinced that she is innocent. (Onun masum olduğuna ikna oldum.) 3. a convincing argument (ikna edici bir argüman)"},{word:"convinced",type:"Sıfat",meaning:"1. İkna olmuş, inanmış. 2. Emin, kanaat getirmiş.",guide:"Bir şeyin doğruluğundan emin olan.",examples:"1. I'm convinced we made the right decision. (Doğru kararı verdiğimize ikna oldum.) 2. a convinced atheist (kendinden emin bir ateist)"},{word:"cook",type:"Fiil/İsim",meaning:"1. Pişirmek, yemek yapmak (fiil). 2. Aşçı, yemek pişiren kişi (isim). 3. (Veri) üretmek/ uydurmak (fiil).",guide:"Yiyeceği ısıtarak yemeye hazır hale getirmek.",examples:"1. Who's cooking dinner tonight? (Bu akşam yemeği kim pişiriyor?) 2. She's a fantastic cook. (O harika bir aşçı.) 3. The books cooked (hesaplarıyla oynadı)."},{word:"cooker",type:"İsim (UK)",meaning:"1. Ocak, fırın (mutfak aleti). 2. (US) tencereli ocak.",guide:"Yemek pişirmek için kullanılan, genellikle fırın ve ocak üstü olan alet.",examples:"1. a gas cooker (bir gaz ocağı) 2. an electric cooker (bir elektrikli ocak)"},{word:"cooking",type:"İsim/Sıfat",meaning:"1. Yemek pişirme, aşçılık (isim). 2. Pişirme (sıfat). 3. (cooking up) uydurmak.",guide:"Yemek pişirme eylemi veya faaliyeti.",examples:"1. I love Italian cooking. (İtalyan yemeklerini seviyorum.) 2. cooking utensils (pişirme gereçleri) 3. cooking oil (yemeklik yağ)"},{word:"cool",type:"Sıfat/Fiil",meaning:"1. Serin (sıfat). 2. Harika, süper (sıfat). 3. Serinlemek, soğumak (fiil).",guide:"Hafif soğuk veya gayriresmi dilde çok iyi, harika.",examples:"1. a cool breeze (serin bir esinti) 2. That's a really cool car! (Bu gerçekten süper bir araba!) 3. Let the soup cool down. (Çorbanın soğumasını bekle.)"},{word:"copy",type:"İsim/Fiil",meaning:"1. Kopya, suret (isim). 2. Kopyalamak, taklit etmek (fiil). 3. (Gazete) nüsha, sayı (isim).",guide:"Orijinaline benzer şekilde yapılmış şey veya bir şeyi aynen tekrarlamak.",examples:"1. Make a copy of this document. (Bu belgenin bir kopyasını yapın.) 2. He always copies my homework. (O her zaman benim ödevimi kopyalar.) 3. a hard copy (bir basılı kopya)"},{word:"core",type:"İsim/Sıfat",meaning:"1. Çekirdek, öz (isim). 2. Asıl, temel (sıfat). 3. Merkez.",guide:"Bir şeyin en iç, en merkezi veya en önemli kısmı.",examples:"1. an apple core (bir elma çekirdeği) 2. the core subjects in school (okuldaki temel dersler) 3. the core of the problem (sorunun özü)"},{word:"corner",type:"İsim/Fiil",meaning:"1. Köşe (isim). 2. (Sokak) köşesi (isim). 3. Köşeye sıkıştırmak (fiil).",guide:"İki çizginin veya yüzeyin buluştuğu nokta.",examples:"1. Write your name in the top right-hand corner. (Adınızı sağ üst köşeye yazın.) 2. There's a shop on the corner. (Köşede bir dükkan var.) 3. The police cornered the thief. (Polis hırsızı köşeye sıkıştırdı.)"},{word:"corporate",type:"Sıfat",meaning:"1. Kurumsal, şirkete ait. 2. Tüzel, tüzel kişilik. 3. Birlikte yapılan, ortak.",guide:"Bir şirket veya büyük ticari organizasyonla ilgili olan.",examples:"1. corporate finance (kurumsal finans) 2. corporate culture (kurum kültürü) 3. corporate responsibility (kurumsal sorumluluk)"},{word:"correct",type:"Sıfat/Fiil",meaning:"1. Doğru, yanlışsız (sıfat). 2. Düzeltmek (fiil). 3. Uygun, yerinde (sıfat).",guide:"Gerçeğe veya kurallara uygun olan. Fiil olarak hataları gidermek.",examples:"1. Is this the correct answer? (Bu doğru cevap mı?) 2. Please correct any mistakes. (Lütfen hataları düzeltin.) 3. correct b rking","always"],color:"#0e7490"},{id:10,level:"A2",title:"Dün: was / were",titleEn:"Past of Be",focus:"Dünde kimlik ve durum anlatma.",trap:"was tekil, were çoğul ama 'you were' tekil de olsa were. 'You was' asla.",detail:"was/were + sıfat: 'I was tired.' Fiil yok, to be yetiyor.",feeling:"Biraz yorgun, geçmişi anlatma tonu.",pronun:"was /waz/ hızlı, were /wör/ zayıf. Vurgusuzda 'were' /wer/.",chunks:[{en:"I was at home yesterday.",tr:"Dün evdeydim.",use:"Yer bildirme"},{en:"They were happy.",tr:"Mutluydular.",use:"Duygu geçmişte"},{en:"Was it difficult?",tr:"Zor muydu?",use:"Geçmiş sorma"}],keywords:["yesterday","was","were","tired","happy","at home"],color:"#be123c"},{id:11,level:"A2",title:"Geçmiş Hikaye: Past Simple",titleEn:"Past Simple",focus:"Bitti, oldu, gitti: I went, I saw.",trap:"Did ile geçmişi iki kez işaretleme: 'Did you went?' yanlış, 'Did you go?' doğru.",detail:"Düzensiz fiillerin %60’ı günlük konuşma: go-went, have-had, make-made. Önce bunları ezberle.",feeling:"Hikaye anlatıcısı: net, sıralı, -di bitti.",pronun:"-ed 3 ses: /t/ walked, /d/ played, /id/ wanted. Çoğu kişi hep /id/ diyor.",chunks:[{en:"I went to the market.",tr:"Markete gittim.",use:"Hareket"},{en:"She bought a dress.",tr:"Elbise aldı.",use:"Alışveriş geçmişi"},{en:"We watched a movie.",tr:"Film izledik.",use:"Aktivite"}],keywords:["went","bought","watched","yesterday","last","ago"],color:"#4f46e5"},{id:12,level:"A2",title:"Arka Plan: Past Continuous",titleEn:"Interrupted Past",focus:"Bir şey olurken başka bir şey oldu.",trap:"when ve while ayrımı: when + simple, while + continuous genelde. 'When I was cooking, he came.'",detail:"İki continuous yan yana uzun arka plan: 'I was walking while she was talking.'",feeling:"Film sahnesi: sisli, devam eden arka plan.",pronun:"was cooking → /waz kuking/ hızlı bağla.",chunks:[{en:"I was sleeping when you called.",tr:"Aradığında uyuyordum.",use:"Bölünen eylem"},{en:"It was raining all day.",tr:"Bütün gün yağmur yağıyordu.",use:"Hava durumu geçm art: 'taller than me' ama konuşmada 'taller than I am' resmi.",feeling:"Yarışma sunucusu gibi: kıyasla!",pronun:"than /dhen/ zayıf, /than/ değil. th + en hızlı.",chunks:[{en:"This is cheaper than that.",tr:"Bu ondan daha ucuz.",use:"Alışveriş"},{en:"She is taller than me.",tr:"Benden uzun.",use:"Fiziksel kıyas"},{en:"It’s more difficult now.",tr:"Şimdi daha zor.",use:"Zorluk"}],keywords:["than","cheaper","bigger","more","taller","better"],color:"#059669"},{id:19,level:"B1",title:"En: superlative + as...as",titleEn:"Superlatives & Equality",focus:"En ... ve ... kadar.",trap:"the unutuluyor: 'He is tallest' değil 'He is the tallest'.",detail:"as...as eşitlik: 'as tall as' - olumsuzda 'not as tall as'.",feeling:"Abartı, ödül töreni: en iyisi!",pronun:"the best /dhe best/. th + b bağla.",chunks:[{en:"This is the best coffee.",tr:"Bu en iyi kahve.",use:"Övgü"},{en:"He is as tall as me.",tr:"Benim kadar uzun.",use:"Eşitlik"},{en:"It’s not as cheap as before.",tr:"Eskisi kadar ucuz değil.",use:"Kıyas olumsuz"}],keywords:["best","tallest","cheapest","as","than","most"],color:"#0e7490"},{id:20,level:"A2",title:"İzin/Yetenek: can / could / must",titleEn:"Modals I",focus:"Yapabilirsin, yapmalısın.",trap:"can sonrası to yok: 'I can to go' yanlış. Modal + yalın fiil her zaman.",detail:"must güçlü zorunluluk, have to dış zorunluluk: 'I must study (kendi kararım)' vs 'I have to work (patron diyor)'.",feeling:"Net, dik: kurallar, izinler.",pronun:"can /ken/ zayıf, can't /ka:nt/ güçlü. Vurgu farkı can/cant ayrımı.",chunks:[{en:"I can swim.",tr:"Yüzebilirim.",use:"Yetenek"},{en:"You must wear a mask.",tr:"Maske takmalısın.",use:"Zorunluluk"},{en:"Can I help you?",tr:"Yardımcı olabilir miyim?",use:"Teklif"}],keywords:["can","must","can’t","could","help","wear"],color:"#be123c"},{id:21,level:"B1",title:"Tavsiye: should / have to",titleEn:"Modals II",focus:"Tavsiye ve dış zorunluluk.",trap:"should = tavsiye, must = emir. 'You should see doctor' tavsiye, 'You must see' acil.",detail:"shouldn’t nazik uyarı: 'You shouldn’t smoke here.'",feeling:"Arkadaş tavsiyesi: yumuşak, ilgili.",pronun:"should /şud/ - l okunmaz! Çoğu kişi 'shuld' diyor yanlış.",chunks:[{en:"You should rest.",tr:"Dinlenmelisin.",use:"Tavsiye"},{en:"I have to go now.",tr:"Şimdi gitmem lazım.",use:"Zorunluluk dış"},{en:"Should I call him?",tr:"Onu aramalı mıyım?",use:"Fikir alma"}],keywords:["should","have to","rest","call","go"],color:"#4f46e5"},{id:22,level:"B1",title:"Eğer: if / when - First Conditional",titleEn:"First Conditional",focus:"Eğer olursa, olacak: If + present, will.",trap:"if cümlesinde will yok: 'If it will rain' yanlış, 'If it rains' doğru. Gelecek if'te yasak.",detail:"when kesin, if ihtimal: 'When I come (kesin geleceğim)' vs 'If I come (belki)'.",feeling:"Plan + B planı: tetikte.",pronun:"If /if/ kısa, when /wen/ net. Vurgu sonuçta: If you STUDY, you WILL pass.",chunks:[{en:"If it rains, I’ll stay home.",tr:"Yağmur yağarsa evde kalacağım.",use:"Koşul"},{en:"When you come, call me.",tr:"Gelince ara beni.",use:"Zaman koşulu"},{en:"If you study, you will pass.",tr:"Çalışırsan geçersin.",use:"Neden-sonuç"}],keywords:["if","when","will","rains","study","come"],color:"#7c3aed"},{id:23,level:"B1",title:"Hayal: Second Conditional",titleEn:"Unreal Present",focus:"Olsa, yapsam: If I were you...",trap:"were herkes için: 'If I were you' doğru, 'If I was you' konuşmada duyulur ama sınavda were.",detail:"Hayal + tavsiye: 'If I were you, I would...' En nazik tavsiye kalıbı.",feeling:"Hayalperest, gözler uzaklarda.",pronun:"would /wud/ zayıf, would you → /wudju/.",chunks:[{en:"If I were you, I would go.",tr:"Senin yerinde olsam giderdim.",use:"Tavsiye hayali"},{en:"If I had money, I would travel.",tr:"Param olsa seyahat ederdim.",use:"Hayal"},{en:"What would you do?",tr:"Ne yapardın?",use:"Hayali sorma"}],keywords:["would","were","if i were","travel","money"],color:"#059669"},{id:24,level:"B1",title:"Edilgen: was made / is made",titleEn:"Passive",focus:"Yapıldı, yapılıyor: odak
